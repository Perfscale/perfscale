name: Build & Release perfscale

on:
  push:
    tags: ["v*"]
  # Re-run ONLY the npm publish for an already-released tag (e.g. after a
  # transient registry/sigstore failure mid-loop). Binaries come from the
  # tag's GitHub Release assets; build/release/docker/reset don't run.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish to npm, e.g. v0.30.0"
        required: true

# Default for jobs without their own block (build); publish jobs declare the
# elevated scopes they need (contents: write, packages: write, id-token).
permissions:
  contents: read

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.artifact }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — static musl binaries, native runners per arch (no QEMU).
          - artifact: perfscale-linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            setup: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          - artifact: perfscale-linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            setup: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          # macOS — arm64 native, x86_64 cross-compiled on the same runner
          # (same SDK, works out of the box).
          - artifact: perfscale-darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - artifact: perfscale-darwin-amd64
            runner: macos-latest
            target: x86_64-apple-darwin
          # Windows — x86_64 native, arm64 cross-compiled via the MSVC toolchain.
          - artifact: perfscale-windows-amd64.exe
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - artifact: perfscale-windows-arm64.exe
            runner: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: build.rs runs `git describe --tags` to stamp the
          # version — with the default shallow fetch the tag is invisible and
          # the release binary would get a dev `-next+unknown` suffix.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      # Restore-only: a tag run's cache is scoped to that tag's ref, which no
      # later run can read — saving it only spent ~2.9 GB of the repo's 10 GB
      # Actions cache per release and evicted main's CI cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: false

      - name: Setup
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Build
        run: cargo build --release -p perfscale-cli --target ${{ matrix.target }}

      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/perfscale" "dist/${{ matrix.artifact }}"
      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/perfscale.exe" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7

  # ── Publish to GitHub Releases ──────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum perfscale-* > sha256sums.txt
          ls -lh

      # Human-written notes from UPCOMING.md become the release body; the
      # auto-generated changelog is appended below them. An empty file falls
      # back to generated notes only (with a warning) — a release should
      # never be blocked on prose.
      - name: Prepare release notes from UPCOMING.md
        run: |
          sed '/^<!--/,/^-->/d; /^# Upcoming release/d' UPCOMING.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "release notes from UPCOMING.md:"
            cat release-notes.md
          else
            echo "::warning::UPCOMING.md has no entries — release body falls back to auto-generated notes"
            : > release-notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/perfscale-*
            dist/sha256sums.txt
          generate_release_notes: true

  # ── Publish to npm (@perfscale/exe + platform packages) ─────────────────────
  npm:
    name: Publish to npm
    needs: release
    # On a tag push: after the GitHub Release. On workflow_dispatch: alone
    # (release is skipped), from the existing release's assets.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v5
        if: github.event_name == 'push'
        with:
          path: dist/
          merge-multiple: true

      - name: Download binaries from the GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'perfscale-*'
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir . \
            --pattern sha256sums.txt --clobber
          (cd dist && sha256sum -c ../sha256sums.txt --ignore-missing)

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Assemble packages
        run: node npm/build-npm-packages.mjs "${TAG#v}" dist npm/out

      # Platform packages first — the meta package's optionalDependencies
      # must be resolvable the moment @perfscale/exe lands.
      # Publishes via OIDC trusted publishing: the workflow authenticates with
      # its OIDC token (no long-lived npm token anywhere) and the packages
      # carry provenance attestations. The binding lives on npmjs.com →
      # package settings → Trusted Publisher → GitHub Actions.
      # Requires npm ≥ 11.5.1 (hence the npm@latest upgrade).
      # Idempotent: a version already on the registry is skipped, so a run
      # that died mid-loop (v0.30.0: sigstore answered 409 "equivalent entry
      # already exists" on the third package) can simply be re-run. A failed
      # publish is retried once — the tlog 409 is transient.
      - name: Publish
        run: |
          npm install -g npm@latest
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64 exe; do
            name=$(node -p "require('./npm/out/$pkg/package.json').name")
            version=$(node -p "require('./npm/out/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version — already published"
              continue
            fi
            npm publish "npm/out/$pkg" --access public --provenance \
              || { echo "retrying $name@$version once"; sleep 20; \
                   npm view "$name@$version" version >/dev/null 2>&1 \
                   || npm publish "npm/out/$pkg" --access public --provenance; }
          done

  # ── Publish Docker images to ghcr.io ─────────────────────────────────────
  # Five flavors from docker/image.Dockerfile (multi-arch, binaries come from
  # the build matrix — nothing is recompiled here), one package each, tagged
  # X.Y.Z / X.Y / latest:
  #   perfscale         — perfscale only (native engine)
  #   perfscale-k6      — + k6
  #   perfscale-jmeter  — + JMeter (headless JRE)
  #   perfscale-locust  — + locust
  #   perfscale-full    — + k6 + JMeter + locust
  # Legacy suffix tags on the perfscale package (perfscale:X.Y.Z-k6, …) are
  # still pushed for the same digests so existing pulls keep working.
  docker:
    name: Publish Docker images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: perfscale-linux-*
          path: dist/
          merge-multiple: true

      - name: Compute tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MAJOR_MINOR=${VERSION%.*}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push all flavors
        run: |
          for flavor in "" k6 jmeter locust full; do
            target="base"; image="ghcr.io/perfscale/perfscale"; legacy=()
            if [ -n "$flavor" ]; then
              target="$flavor"; image="ghcr.io/perfscale/perfscale-$flavor"
              for t in "$VERSION" "$MAJOR_MINOR" latest; do
                legacy+=(-t "ghcr.io/perfscale/perfscale:${t}-$flavor")
              done
            fi
            echo "── flavor: ${flavor:-slim} (target $target) → $image"
            docker buildx build -f docker/image.Dockerfile --target "$target" \
              --platform linux/amd64,linux/arm64 \
              -t "$image:${VERSION}" \
              -t "$image:${MAJOR_MINOR}" \
              -t "$image:latest" \
              "${legacy[@]}" \
              --push .
          done

      # Runs the published image, not just the build: real scenario, in-memory
      # SQLite (no server, no cwd writes — the container user is non-root).
      - name: Smoke test slim image
        run: |
          IMAGE="ghcr.io/perfscale/perfscale:${VERSION}"
          docker run --rm "$IMAGE" --version
          printf 'vus: 1\nduration: 5s\n' > db.config.yaml
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" \
            run -f examples/db-sqlite.test.yaml -c db.config.yaml 2>&1 | tee run.log
          grep -q "db_connect_duration" run.log
          grep -q "db_query_duration" run.log
          grep -q "db_rows" run.log
          echo "slim image runs real scenarios ✓"

      # Each runner flavor: the runner binary itself must start (this exercises
      # the JRE for JMeter and the Python runtime for locust, not just PATH).
      - name: Smoke test runner flavors
        run: |
          docker run --rm --entrypoint k6 \
            "ghcr.io/perfscale/perfscale-k6:${VERSION}" version
          docker run --rm --entrypoint jmeter \
            "ghcr.io/perfscale/perfscale-jmeter:${VERSION}" --version
          docker run --rm --entrypoint locust \
            "ghcr.io/perfscale/perfscale-locust:${VERSION}" --version
          docker run --rm "ghcr.io/perfscale/perfscale-full:${VERSION}" --version
          docker run --rm --entrypoint k6 \
            "ghcr.io/perfscale/perfscale-full:${VERSION}" version
          docker run --rm --entrypoint jmeter \
            "ghcr.io/perfscale/perfscale-full:${VERSION}" --version
          docker run --rm --entrypoint locust \
            "ghcr.io/perfscale/perfscale-full:${VERSION}" --version
          echo "all runner flavors functional ✓"

  # ── Reset UPCOMING.md for the next cycle ────────────────────────────────────
  reset-upcoming:
    name: Reset UPCOMING.md
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Clear released notes
        run: |
          cat > UPCOMING.md <<'EOF'
          # Upcoming release

          <!--
          Release notes for the next release, written as features land.

          - Append short, user-facing entries below this comment as you merge changes
            (what changed and why a user cares — not commit messages).
          - On a `v*` tag, the release workflow publishes everything below the comment
            as the release body (with the auto-generated changelog appended), then
            resets this file back to the template.
          - If this file has no entries at tag time, the release falls back to
            auto-generated notes and the workflow prints a warning.
          -->
          EOF

          if git diff --quiet UPCOMING.md; then
            echo "UPCOMING.md already pristine — nothing to reset"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPCOMING.md
          git commit -m "chore: reset UPCOMING.md after ${GITHUB_REF_NAME} [skip ci]"
          git push origin main
