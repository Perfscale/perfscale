name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — saves Actions minutes on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Real broker for the `std/pubsub@v1` nats-driver tests (gated on
      # NATS_URL / a reachable 127.0.0.1:4222 — they skip without one).
      nats:
        image: nats:latest
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          # wasm32-wasip2: the WASM-library tests build the SDK example
          # components (RFC 005 phase 2); without the target they skip.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      # k6 + locust — several tests exercise the real binaries end-to-end
      # (happy-path tests skip gracefully if a binary is missing, but CI
      # installs both so they actually run).
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg ca-certificates
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends k6
      - name: Install locust
        run: pipx install locust

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
        env:
          NATS_URL: nats://127.0.0.1:4222

      # Informational — not a merge gate, just visibility on where coverage is thin.
      - name: Coverage summary
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --all-features --workspace --summary-only

  # The serve dashboard (crates/perfscale-cli/ui) is committed as a prebuilt
  # single-file HTML because the release workflow has no Node — this job
  # rebuilds it from source and fails if the committed file is stale.
  serve-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/perfscale-cli/ui
    steps:
      - uses: actions/checkout@v5
      # pnpm/action-setup resolves the version from the repo-root package.json
      # (not the job's working-directory), and the root has no packageManager
      # field — pin it explicitly (keep in sync with ui/package.json).
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/perfscale-cli/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Rebuild and compare the committed serve_ui.html
        run: pnpm check-built
