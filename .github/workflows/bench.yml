name: bench

# Engine benchmark on a fixed CI runner class, so numbers are comparable
# between runs (local machines vary too much). Results land in the job
# summary and as a downloadable artifact, and each run is compared against
# the previous successful run's bench-results.json (regression tracking).
on:
  workflow_dispatch:
    inputs:
      vus:
        description: "Virtual users per engine"
        default: "10"
      duration:
        description: "Run duration per engine (e.g. 30s, 1m)"
        default: "30s"
      runs:
        description: "hyperfine runs per scenario"
        default: "5"
      suites:
        description: "Suites to run (see scripts/bench.sh)"
        default: "overhead throughput startup scaling saturation yaml ws boundary tls library grpc graphql db"
  schedule:
    # Daily drift check (04:23 UTC) — catches perf regressions between
    # releases. ~30min per run ≈ ~900 Actions-min/month; off-:00 to dodge
    # the top-of-hour scheduler herd.
    - cron: "23 4 * * *"

permissions:
  contents: read
  # Download the previous run's bench-results artifact for the delta table.
  actions: read

env:
  JMETER_VERSION: "5.6.3"
  # PostgreSQL JDBC driver for JMeter's db-suite scenario (pinned + sha256).
  PGJDBC_VERSION: "42.7.4"
  PGJDBC_SHA256: "188976721ead8e8627eb6d8389d500dccc0c9bebd885268a3047180274a6031e"
  PSYCOPG2_VERSION: "2.9.10"
  # Custom k6 for the db suite's `k6 (xk6-sql)` row: xk6 build tool + the
  # xk6-sql extension + its postgres driver, all pinned. The k6 core version
  # comes from xk6-sql's go.mod (v1.2.3 pins go.k6.io/k6/v2 v2.3.0) — the
  # stock apt k6 is untouched and serves every other suite.
  XK6_VERSION: "1.4.14"
  XK6_SQL_VERSION: "1.2.3"
  XK6_SQL_PG_VERSION: "0.3.2"
  XK6_K6_VERSION: "2.3.0"
  # xk6-sql v1.2.3 / driver v0.3.2 declare `go 1.26.0` / `toolchain go1.26.8`.
  XK6_GO_VERSION: "1.26.8"

jobs:
  bench:
    runs-on: ubuntu-latest
    services:
      # db suite target (BENCH_PG_DSN default matches this).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: perfscale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          # library suite fixture: the SDK hello example compiles to a
          # wasm32-wasip2 component.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg ca-certificates
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends k6

      - name: Install locust
        # psycopg2-binary powers the db-suite locust scenario (warm SELECT 1
        # loop). Pinned: bench numbers must stay comparable between runs.
        run: |
          pipx install locust
          pipx inject locust "psycopg2-binary==${PSYCOPG2_VERSION}"

      - name: Install JRE (for JMeter)
        run: sudo apt-get install -y --no-install-recommends openjdk-17-jre-headless

      - name: Cache JMeter
        id: jmeter-cache
        uses: actions/cache@v4
        with:
          path: /opt/apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Install JMeter
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        # archive.apache.org is the stable distribution point (the CDN mirrors
        # only carry current releases).
        run: |
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" \
            | sudo tar xz -C /opt
          "/opt/apache-jmeter-${JMETER_VERSION}/bin/jmeter" --version

      - name: JMeter on PATH
        run: echo "/opt/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      # PostgreSQL JDBC driver for the db-suite JMeter scenario. Pinned
      # version + sha256-verified; cached separately from the JMeter install.
      - name: Cache PostgreSQL JDBC driver
        id: pgjdbc-cache
        uses: actions/cache@v4
        with:
          path: /opt/jdbc/postgresql-${{ env.PGJDBC_VERSION }}.jar
          key: pgjdbc-${{ env.PGJDBC_VERSION }}-${{ env.PGJDBC_SHA256 }}

      - name: Install PostgreSQL JDBC driver
        run: |
          jar="/opt/jdbc/postgresql-${PGJDBC_VERSION}.jar"
          if [ "${{ steps.pgjdbc-cache.outputs.cache-hit }}" != "true" ]; then
            sudo mkdir -p /opt/jdbc
            curl -fsSL "https://repo1.maven.org/maven2/org/postgresql/postgresql/${PGJDBC_VERSION}/postgresql-${PGJDBC_VERSION}.jar" \
              | sudo tee "$jar" >/dev/null
          fi
          echo "${PGJDBC_SHA256}  $jar" | sha256sum -c -
          sudo cp "$jar" "/opt/apache-jmeter-${JMETER_VERSION}/lib/"

      # Custom k6 with the xk6-sql extension for the db suite. Builds take
      # minutes (full k6 recompile), so the binary is cached by version key;
      # a version bump of any component changes the key and forces a rebuild.
      # bench.sh picks the binary up at target/xk6-sql/k6 (K6_SQL_BIN).
      - name: Set up Go (for the xk6 build)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.XK6_GO_VERSION }}

      - name: Cache k6+xk6-sql binary
        id: k6sql-cache
        uses: actions/cache@v4
        with:
          path: target/xk6-sql/k6
          key: xk6sql-${{ env.XK6_VERSION }}-${{ env.XK6_SQL_VERSION }}-${{ env.XK6_SQL_PG_VERSION }}-k6${{ env.XK6_K6_VERSION }}-go${{ env.XK6_GO_VERSION }}

      - name: Build k6 with xk6-sql
        if: steps.k6sql-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .gobin
          GOBIN="$PWD/.gobin" go install "go.k6.io/xk6/cmd/xk6@v${XK6_VERSION}"
          ./.gobin/xk6 build "v${XK6_K6_VERSION}" \
            --with "github.com/grafana/xk6-sql@v${XK6_SQL_VERSION}" \
            --with "github.com/grafana/xk6-sql-driver-postgres@v${XK6_SQL_PG_VERSION}" \
            --output target/xk6-sql/k6
          rm -rf .gobin

      - name: Verify k6+xk6-sql binary
        run: |
          target/xk6-sql/k6 version
          echo 'import sql from "k6/x/sql"; import driver from "k6/x/sql/driver/postgres"; export default function() {}' \
            | target/xk6-sql/k6 run -

      # Prebuilt binary (seconds) instead of `cargo install` compiling from
      # source (minutes). Pinned: bench numbers must stay comparable between
      # runs, and 1.22 changed the command-string rules (env-prefixed
      # commands are refused — bench.sh routes those through `env` anyway).
      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine@1.21.0

      - name: Install GNU time
        run: sudo apt-get install -y --no-install-recommends time

      - name: Build perfscale (release)
        run: cargo build --release

      - name: Write environment summary
        run: |
          {
            echo '## Environment'
            echo '| | |'
            echo '|---|---|'
            echo "| OS | $(lsb_release -ds 2>/dev/null || uname -sr) ($(uname -m)) |"
            echo "| CPU | $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//') |"
            echo "| Threads | $(nproc) |"
            echo "| RAM | $(free -h | awk '/^Mem:/ {print $2}') |"
            echo "| Swap | $(free -h | awk '/^Swap:/ {print $2}') |"
            echo
            echo '## Software'
            echo '| | |'
            echo '|---|---|'
            echo "| perfscale | $(./target/release/perfscale --version) |"
            echo "| k6 | $(k6 version 2>/dev/null || echo 'not installed') |"
            echo "| k6 (xk6-sql custom build) | $(target/xk6-sql/k6 version 2>/dev/null || echo 'not built') — xk6-sql ${XK6_SQL_VERSION} + driver-postgres ${XK6_SQL_PG_VERSION} |"
            echo "| locust | $(locust --version 2>/dev/null || echo 'not installed') |"
            echo "| jmeter | ${JMETER_VERSION} |"
            echo "| pgjdbc | ${PGJDBC_VERSION} |"
            echo "| psycopg2 | ${PSYCOPG2_VERSION} |"
            echo "| java | $(java -version 2>&1 | head -n1) |"
            echo "| hyperfine | $(hyperfine --version) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run benchmark suites
        env:
          VUS: ${{ github.event.inputs.vus || '10' }}
          DURATION: ${{ github.event.inputs.duration || '30s' }}
          RUNS: ${{ github.event.inputs.runs || '5' }}
          SUITES: ${{ github.event.inputs.suites || 'overhead throughput startup scaling saturation yaml ws boundary tls library grpc graphql db' }}
        run: ./scripts/bench.sh

      - name: Micro-benchmarks (criterion)
        # Short measurement windows: precise enough for a drift check, and the
        # weekly job shouldn't spend more time on micro-benches than on the
        # end-to-end suites.
        run: |
          cargo bench -p perfscale-core --bench engine -- --warm-up-time 1 --measurement-time 3
          cargo bench -p perfscale-core --features wasm-libs --bench library -- --warm-up-time 1 --measurement-time 3
          python3 scripts/bench_metrics.py criterion target/criterion bench-results.json bench-report.md

      - name: Publish report to job summary
        run: |
          {
            echo '## Benchmark results'
            echo
            cat bench-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with previous run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bench.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id' 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "no previous successful run — skipping comparison"
            exit 0
          fi
          gh run download "$prev" --repo "$GITHUB_REPOSITORY" --name bench-report --dir prev-bench || true
          if [ ! -f prev-bench/bench-results.json ]; then
            echo "previous run has no bench-results.json — skipping comparison"
            exit 0
          fi
          python3 scripts/bench_compare.py prev-bench/bench-results.json bench-results.json \
            | tee -a bench-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: bench-report
          path: |
            bench-report.md
            bench-results.json
          retention-days: 90
