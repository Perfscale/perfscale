[package]
name = "perfscale-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic load-testing engine for perfscale: k6/locust runners, native step engine, YAML test/config parsing"

[dependencies]
# Named-connection registry backing `step::resources` (parking of live
# ws/gRPC/DB handles under minted Connection IDs).
perfscale-connection = { path = "../perfscale-connection" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid       = { version = "1", features = ["serde", "v4"] }

# Async runtime + subprocess management (k6, locust). `net` powers the raw
# transport actions (std/tcp@v1, std/udp@v1) and the waitUntil port_open probe;
# `signal` powers the graceful SIGINT/SIGTERM shutdown of native runs.
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "process", "io-util", "fs", "net", "signal"] }

# Regular expressions for the waitUntil stdout_matches/stderr_matches
# readiness matchers of `std/child_process@v1`.
regex = "1"

# HTTP client for std/http@v1
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }

# CSV parsing for locust's --csv stats output
csv = "1"

# Fixed-size latency histogram for the native engine (no serialization/sync
# features — just the core data structure)
hdrhistogram = { version = "7", default-features = false }

# `std/file@v1` binary content encoding
base64 = "0.22"

# YAML/JSON schema generation + validation
schemars   = "0.8"
jsonschema = "0.18"

# GraphQL query parsing (syntax validation, operation-name extraction) and SDL
# schema parsing for the `std/graphql@v1` action family. The schema the query
# is validated against arrives at run time (server introspection or an SDL
# file), so no codegen — same dynamic posture as the gRPC family.
graphql-parser = "0.4"

tracing = "0.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
futures-util = { version = "0.3.32", default-features = false, features = ["sink"] }

# gRPC client for the `std/grpc*@v1` action family. Dynamic calls only — the
# message schema arrives at run time (`descriptor_set` / server reflection),
# so no codegen/prost features of tonic are needed. TLS stays on rustls/ring
# with webpki roots, matching the WebSocket family. 0.14.6 is the floor:
# `Endpoint::tls_config_with_verifier` (used for `skipTLSVerify`) was added
# in that release.
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", default-features = false, features = ["serde"] }
# Client-only (server reflection protocol for `reflection: true`); the test
# server pulls the default `server` feature back in as a dev-dependency.
tonic-reflection = { version = "0.14.6", default-features = false }
tokio-stream = "0.1"
# URI types for dynamic call paths (tonic's re-export sits behind its
# `codegen` feature, which dynamic calls don't need).
http = "1"

# Database drivers for the `std/db-*@v1` action family (PostgreSQL,
# MySQL/MariaDB, SQLite). Runtime is tokio and TLS stays on rustls/ring with
# webpki roots, matching the WebSocket/gRPC families; no chrono/time/decimal
# extras — unmapped column types decode as null (see step/db.rs).
sqlx = { version = "0.8", default-features = false, features = ["postgres", "mysql", "sqlite", "runtime-tokio", "tls-rustls-ring-webpki", "json"] }

# kill(2)/killpg(2) for the managed child processes of `std/child_process@v1`
# and `std/kill_process@v1` (signal delivery + tree kill by process group).
# Non-unix platforms degrade to `Child::kill` without process groups.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Compiles proto/echo.proto for the in-crate gRPC test server (used only by
# tests, but build scripts cannot be dev-only). Pure Rust — `protox` replaces
# the `protoc` binary so downstream consumers (git dependency, Docker/CI
# images without protoc) build unchanged.
protox = "0.9"
prost = "0.14"
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio-test = "0.4"
tempfile   = "3"
wiremock   = "0.6"
serial_test = { version = "3", features = ["file_locks"] }
criterion  = { version = "0.5", default-features = false }
rcgen = "0.13"
# Test gRPC server (unary + all streaming shapes + reflection).
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Real GraphQL test server for `std/graphql@v1` integration tests (query/
# mutation resolvers + introspection), served over axum. Default features are
# off: `graphiql` pulls handlebars, whose preserve_json_order flips
# serde_json's Map to insertion order and breaks ordering-sensitive tests.
async-graphql = { version = "7", default-features = false }
async-graphql-axum = "7"
axum = "0.7"

[[bench]]
name = "engine"
harness = false
