[package]
name = "perfscale-library-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Authoring SDK for perfscale WASM value-generator libraries (RFC 005)"

[dependencies]
# Guest-side bindings generated from ../../wit (single source of truth for the
# perfscale:library ABI). Authors never touch wit-bindgen directly — the
# `export_library!` macro hides it.
wit-bindgen = { version = "0.57.1", features = ["macros"] }
serde_json = "1"
