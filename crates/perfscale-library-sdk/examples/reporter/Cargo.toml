[package]
name = "perfscale-reporter-example"
version = "0.1.0"
edition = "2021"
description = "Example perfscale WASM reporter: summary.txt + raw report.json (issue #9)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.57.1", features = ["macros"] }
serde_json = "1"

# Standalone crate (built with `cargo build --release --target wasm32-wasip2`),
# not part of the perfscale workspace.
[workspace]
