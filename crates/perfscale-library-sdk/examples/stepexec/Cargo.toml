[package]
name = "perfscale-stepexec-library"
version = "0.1.0"
edition = "2021"
description = "Example perfscale WASM step component with the process capability (RFC 009)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.57.1", features = ["macros"] }
serde_json = "1"

# Standalone crate (built with `cargo build --release --target wasm32-wasip2`),
# not part of the perfscale workspace.
[workspace]
