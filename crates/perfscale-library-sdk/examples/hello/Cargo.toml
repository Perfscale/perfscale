[package]
name = "perfscale-hello-library"
version = "0.1.0"
edition = "2021"
description = "Example perfscale WASM library: greet + memoized token (RFC 005)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
perfscale-library-sdk = { path = "../.." }
serde_json = "1"

# Standalone crate (built with `cargo build --release --target wasm32-wasip2`),
# not part of the perfscale workspace.
[workspace]
