load-test a WebSocket endpoint:<\/p>\n<ul>\n<li><strong>One-shot session<\/strong> — <code>std/ws@v1<\/code> opens a connection, exchanges messages,\nand closes, all in one step (like a FIX session). Simplest; the whole\nsession is timed as one <code>http_req_duration<\/code> sample.<\/li>\n<li><strong>Live connection<\/strong> — <code>std/ws-connect@v1<\/code> opens a connection that stays up\nacross steps within the iteration; <code>ws-send<\/code> / <code>ws-recv<\/code> / <code>ws-ping<\/code> /\n<code>ws-close<\/code> address it by the <strong>id<\/strong> the connect step returned. Use this to\ninterleave WS traffic with other steps (e.g. subscribe over WS, trigger via\nHTTP, assert the push arrives).<\/li>\n<\/ul>\n<p>A connection left open at the end of an iteration is dropped abruptly (no\nClose handshake) — call <code>std/ws-close@v1<\/code> for a graceful shutdown. Live\nconnections never survive into the next iteration, and <code>ws-connect<\/code> inside\n<code>before:<\/code> setup is not useful (the setup context is gone before VUs start).<\/p>\n<h3>Connection profile<\/h3>\n<p>All connect-capable steps (<code>std/ws@v1<\/code>, <code>std/ws-connect@v1<\/code>) accept the same\ntarget parameters, inline or bundled as a profile object under <code>connection<\/code>\n(inline fields win). A profile defined in a config <code>before:<\/code> step travels as\n<code>connection: \"${{ config.&lt;name&gt; }}\"<\/code>.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td><code>ws://<\/code> or <code>wss://<\/code> target<\/td><\/tr>\n<tr><td><code>headers<\/code><\/td><td>object<\/td><td>—<\/td><td>Extra handshake headers (auth tokens etc.)<\/td><\/tr>\n<tr><td><code>subprotocols<\/code><\/td><td>array | string<\/td><td>—<\/td><td>Offered <code>Sec-WebSocket-Protocol<\/code> values (e.g. <code>graphql-ws<\/code>)<\/td><\/tr>\n<tr><td><code>skipTLSVerify<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Accept any server certificate (self-signed staging only)<\/td><\/tr>\n<tr><td><code>connection<\/code><\/td><td>object | string<\/td><td>—<\/td><td>A profile supplying defaults for any field above<\/td><\/tr>\n<\/tbody><\/table>\n<p><code>timeout<\/code> (integer ms, default <code>10000<\/code>) is accepted inline by both steps but\nis <strong>not<\/strong> part of the profile — a <code>timeout<\/code> inside <code>connection<\/code> is ignored.\nFor <code>std/ws-connect@v1<\/code> it bounds the handshake; for <code>std/ws@v1<\/code> the whole\nsession.<\/p>\n<h3><code>std/ws-connect@v1<\/code><\/h3>\n<p>Opens a live connection. Output:<\/p>\n<pre><code class=\"language-json\">{ \"id\": \"ws-1\", \"connected\": true, \"subprotocol\": \"graphql-ws\", \"duration_ms\": 3.1 }\n<\/code><\/pre>\n<p><code>subprotocol<\/code> is the server-negotiated protocol, or <code>null<\/code> when the server\npicked none. The handshake feeds <code>http_req_duration<\/code>; a failed handshake\ncounts in <code>http_req_failed<\/code> and the output is\n<code>{ \"connected\": false, \"error\": \"…\", \"duration_ms\": … }<\/code>.<\/p>\n<p>Store the output (<code>outputs: feed<\/code>) and pass <code>id: \"${{ feed.id }}\"<\/code> to the\nother <code>ws-*<\/code> steps. Ids are minted per VU (<code>ws-1<\/code>, <code>ws-2<\/code>, …) and are valid\nonly inside that VU's current iteration.<\/p>\n<h3><code>std/ws-send@v1<\/code><\/h3>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Connection id from <code>std/ws-connect@v1<\/code><\/td><\/tr>\n<tr><td><code>send<\/code><\/td><td>string<\/td><td>one of send/send_base64<\/td><td>Text payload; <code>${…}<\/code> tokens expand per send (see below)<\/td><\/tr>\n<tr><td><code>send_base64<\/code><\/td><td>string<\/td><td>one of send/send_base64<\/td><td>Binary payload<\/td><\/tr>\n<tr><td><code>repeat<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Emit N messages from the one template<\/td><\/tr>\n<tr><td><code>interval_ms<\/code><\/td><td>integer<\/td><td><code>0<\/code><\/td><td>Gap between repeated sends<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (ms)<\/td><td><code>10000<\/code><\/td><td>For the whole send loop<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>: <code>{ \"sent\": N, \"bytes\": B, \"duration_ms\": …, \"metrics\": { \"ws_msgs_sent\": N } }<\/code>.\nCounts toward the <code>ws_msgs_sent<\/code> rate. A transport error fails the step and\ndrops the connection — later steps on that id get an \"unknown connection id\"\nerror. A parameter error (e.g. both <code>send<\/code> and <code>send_base64<\/code>) leaves the\nconnection usable.<\/p>\n<p>Text payloads may embed single-brace <code>${…}<\/code> tokens, expanded anew per send —\ndistinct from the engine's <code>${{ … }}<\/code>, which resolves once before the action\nruns:<\/p>\n<table><thead><tr><th>Token<\/th><th>Expands to<\/th><\/tr><\/thead><tbody>\n<tr><td><code>${seq}<\/code><\/td><td>Monotonic counter, unique per message (keeps counting across sends on the same connection)<\/td><\/tr>\n<tr><td><code>${uuid}<\/code><\/td><td>Random 32-hex id<\/td><\/tr>\n<tr><td><code>${now}<\/code><\/td><td>UTC <code>YYYYMMDD-HH:MM:SS.sss<\/code> (FIX SendingTime shape)<\/td><\/tr>\n<tr><td><code>${now_ms}<\/code><\/td><td>Unix milliseconds<\/td><\/tr>\n<tr><td><code>${now_iso}<\/code><\/td><td>UTC RFC 3339 <code>YYYY-MM-DDTHH:MM:SS.sssZ<\/code><\/td><\/tr>\n<tr><td><code>${rand(a,b)}<\/code><\/td><td>Random integer in <code>[a,b]<\/code><\/td><\/tr>\n<tr><td><code>${randf(a,b[,dp])}<\/code><\/td><td>Random float, <code>dp<\/code> decimals (default 2)<\/td><\/tr>\n<tr><td><code>${choice(x|y|z)}<\/code><\/td><td>Random pick<\/td><\/tr>\n<\/tbody><\/table>\n<p>Unknown tokens are left verbatim. <code>send_base64<\/code> payloads are decoded once and\nsent as-is — no token expansion.<\/p>\n<h3><code>std/ws-recv@v1<\/code><\/h3>\n<p>Reads until a <strong>stopping rule<\/strong> is satisfied — not reaching it within\n<code>timeout<\/code> fails the step:<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Connection id<\/td><\/tr>\n<tr><td><code>until_contains<\/code><\/td><td>string<\/td><td>—<\/td><td>Stop when a message contains this substring (mutually exclusive with <code>until_json<\/code>)<\/td><\/tr>\n<tr><td><code>until_json<\/code><\/td><td>object<\/td><td>—<\/td><td>Stop when a message JSON-subset-matches (pattern fields must equal; extra fields ignored)<\/td><\/tr>\n<tr><td><code>count<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Without an <code>until_*<\/code> rule: stop after N data messages<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (ms)<\/td><td><code>10000<\/code><\/td><td>Deadline for the stopping rule<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>:<\/p>\n<pre><code class=\"language-json\">{ \"messages\": [\"…\"], \"body\": \"…\", \"count\": 2, \"matched\": true, \"duration_ms\": 8.4,\n  \"metrics\": { \"ws_msgs_received\": 2, \"ws_msg_rtt\": [7.9] } }\n<\/code><\/pre>\n<p><code>matched<\/code> reports whether the stopping rule was reached (in <code>count<\/code> mode: the\ncount was reached). Text frames arrive as strings, binary frames as base64\nstrings; <code>body<\/code> is the newline-joined text form (so\n<code>check: { body_contains: … }<\/code> works). Received messages count toward the\n<code>ws_msgs_received<\/code> rate. When an <code>until_*<\/code> rule matches and a <code>ws-send<\/code>\npreceded it on this connection, the send→match time is recorded as a\n<code>ws_msg_rtt<\/code> histogram sample — the application-level message round trip.<\/p>\n<p>Every message read along the way stays in <code>messages<\/code>, whatever the outcome.\nIf the peer closes or the transport dies before the rule is reached, the step\nfails, the output gains an <code>error<\/code> field, and the connection is dropped; a\nplain timeout fails the step too but leaves the connection usable for later\nsteps. Ping/pong frames arriving during the read are ignored as transport\nnoise.<\/p>\n<p>The step's own <code>duration_ms<\/code> deliberately does <strong>not<\/strong> feed\n<code>http_req_duration<\/code>: how long a server chooses to wait before pushing is not\ntarget latency and would poison the shared percentiles.<\/p>\n<h3><code>std/ws-ping@v1<\/code><\/h3>\n<p>Transport-level ping→pong round trip: <code>{ \"pong\": true, \"duration_ms\": 0.4 }<\/code>.\nTakes <code>id<\/code> and <code>timeout<\/code>. The RTT is not aggregated into any histogram —\nbound it with <code>check: { duration_ms_lt: … }<\/code> when needed. Data messages\narriving while waiting for the pong are buffered for the next <code>ws-recv<\/code>. No\npong within <code>timeout<\/code> (or a closed connection) fails the step and drops the\nconnection.<\/p>\n<h3><code>std/ws-close@v1<\/code><\/h3>\n<p>Graceful close handshake. Takes <code>id<\/code>, <code>code<\/code> (default <code>1000<\/code>, normal\nclosure), <code>reason<\/code> (default empty) — both sent in the Close frame — and\n<code>timeout<\/code>. Output: <code>{ \"closed\": true, \"duration_ms\": … }<\/code>, reported even when\nthe peer does not acknowledge within <code>timeout<\/code>: the socket is gone either way\nand the id is released.<\/p>\n<h3><code>std/ws@v1<\/code> — one-shot session<\/h3>\n<p>Profile parameters as above, plus <code>messages<\/code> — a list where each entry is a\nstring (a <code>${…}<\/code> template to send) or an object:<\/p>\n<table><thead><tr><th>Entry field<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>send<\/code> / <code>send_base64<\/code><\/td><td>Payload, as in <code>ws-send<\/code><\/td><\/tr>\n<tr><td><code>repeat<\/code> / <code>interval_ms<\/code><\/td><td>Stream expansion, as in <code>ws-send<\/code><\/td><\/tr>\n<tr><td><code>until_contains<\/code> / <code>until_json<\/code><\/td><td>Wait for a matching reply before the next entry; yields a <code>ws_msg_rtt<\/code> sample<\/td><\/tr>\n<\/tbody><\/table>\n<pre><code class=\"language-yaml\">steps:\n  - name: subscribe and await first trade\n    use: std/ws@v1\n    with:\n      url: wss://stream.example.com/feed\n      messages:\n        - send: '{\"op\":\"subscribe\",\"channel\":\"trades\",\"id\":\"sub-${seq}\"}'\n          until_json: { type: trade }\n    check:\n      message_matches: { type: trade }\n    outputs: feed\n<\/code><\/pre>\n<p><strong>Output<\/strong>: <code>{ \"connected\": true, \"sent\": N, \"received\": M, \"messages\": […], \"body\": \"…\", \"subprotocol\": …, \"duration_ms\": …, \"metrics\": { \"ws_msgs_sent\": N, \"ws_msgs_received\": M, \"ws_msg_rtt\": […] } }<\/code>.\nThe whole session is one <code>http_req_duration<\/code> sample; the step fails on\nhandshake/transport errors or any entry whose <code>until_*<\/code> rule did not match in\ntime. A mid-session failure still reports everything exchanged up to that\npoint, plus an <code>error<\/code> field naming the failing entry (<code>message[i]: …<\/code>); a\nhandshake failure yields <code>{ \"connected\": false, \"error\": \"…\", \"duration_ms\": … }<\/code>\nand counts in <code>http_req_failed<\/code>.<\/p>\n<h3>Limits<\/h3>\n<p>Inbound protocol limits come from the WebSocket library defaults: messages up\nto 64 MiB, single frames up to 16 MiB — a larger inbound message errors the\nconnection (and therefore the step reading it). Timeout values, <code>repeat<\/code>\ncounts, and the <code>messages<\/code> list have no built-in caps.<\/p>\n<h2>gRPC: <code>std/grpc@v1<\/code> and the <code>std/grpc-*@v1<\/code> family<\/h2>\n<blockquote>\n<p>Concept-level walkthrough (schema sources, streams, assertions, metrics):\n<a href=\"#/docs/core/grpc\">gRPC guide<\/a>.<\/p>\n<\/blockquote>\n<p>Two ways to load-test a gRPC endpoint:<\/p>\n<ul>\n<li><strong>One-shot call<\/strong> — <code>std/grpc@v1<\/code> opens a channel, loads the schema, makes\none unary call, and closes, all in one step. Simplest for occasional probes.<\/li>\n<li><strong>Live channel<\/strong> — <code>std/grpc-connect@v1<\/code> opens an HTTP/2 channel that stays\nup across steps within the iteration; <code>grpc-call<\/code> (unary) and the\n<code>grpc-stream-*<\/code> family address it by the <strong>id<\/strong> the connect step returned.\nUse this for any serious load: the connection and the schema load are paid\nonce per iteration, not per call.<\/li>\n<\/ul>\n<p>Calls are <strong>dynamic<\/strong>: no protobuf codegen — the schema arrives at run time\nand requests/responses are JSON (protobuf-JSON rules: field names accept both\nthe proto name and its camelCase <code>json_name<\/code>; 64-bit ints are strings; enums\nare names).<\/p>\n<p>A channel left open at the end of an iteration is dropped — Live Channels and\nstreams never survive into the next iteration, and <code>grpc-connect<\/code> inside\n<code>before:<\/code> setup is not useful (the setup context is gone before VUs start).<\/p>\n<h3>Channel profile<\/h3>\n<p><code>std/grpc@v1<\/code> and <code>std/grpc-connect@v1<\/code> accept the same target parameters,\ninline or bundled as a profile object under <code>connection<\/code> (inline fields win).\nA profile defined in a config <code>before:<\/code> step travels as\n<code>connection: \"${{ config.&lt;name&gt; }}\"<\/code>.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td><code>grpc://<\/code> (plaintext) or <code>grpcs://<\/code> (TLS) target; a scheme-less host means <code>grpcs://<\/code><\/td><\/tr>\n<tr><td><code>metadata<\/code><\/td><td>object<\/td><td>—<\/td><td>Default call metadata (auth tokens etc.); per-call <code>metadata<\/code> overrides per key<\/td><\/tr>\n<tr><td><code>skipTLSVerify<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Accept any server certificate (self-signed staging only)<\/td><\/tr>\n<tr><td><code>descriptor_set<\/code><\/td><td>string<\/td><td>one schema source<\/td><td>Base64 of a serialized <code>FileDescriptorSet<\/code> (mutually exclusive with <code>reflection<\/code>)<\/td><\/tr>\n<tr><td><code>reflection<\/code><\/td><td>boolean<\/td><td>one schema source<\/td><td><code>true<\/code>: fetch the schema via the server reflection service (v1)<\/td><\/tr>\n<tr><td><code>max_recv_size<\/code><\/td><td>integer (bytes)<\/td><td><code>16777216<\/code><\/td><td>Inbound message cap (16 MiB)<\/td><\/tr>\n<tr><td><code>connection<\/code><\/td><td>object | string<\/td><td>—<\/td><td>A profile supplying defaults for any field above<\/td><\/tr>\n<\/tbody><\/table>\n<p>Exactly one schema source is required. <code>descriptor_set<\/code> is a base64\n<code>FileDescriptorSet<\/code> — produce one with <code>protoc --descriptor_set_out<\/code>, or fetch\nit over HTTP and reference <code>${{ fetch.body_base64 }}<\/code>. With <code>reflection: true<\/code>\nthe server must enable gRPC reflection; the fetched pool is cached per URL for\nthe rest of the run, so repeated connects to one server pay one round trip.<\/p>\n<p><code>timeout<\/code> (integer ms, default <code>10000<\/code>) is accepted inline by both steps but\nis <strong>not<\/strong> part of the profile. For <code>std/grpc-connect@v1<\/code> it bounds connect +\nschema load; for <code>std/grpc@v1<\/code> the whole step (connect → schema → call; the\ncall's <code>grpc-timeout<\/code> header is the remaining budget).<\/p>\n<p>Methods are named <code>\"package.Service/Method\"<\/code>. A typo fails with a did-you-mean\nsuggestion when a known method is within edit distance 2.<\/p>\n<h3>Payloads<\/h3>\n<p>Requests take <code>payload<\/code> (JSON → dynamic protobuf message) or <code>payload_base64<\/code>\n(base64 of the serialized protobuf bytes) — mutually exclusive. String leaves\nof <code>payload<\/code> may embed the single-brace <code>${…}<\/code> tokens documented under\n<a href=\"#stdws-sendv1\"><code>std/ws-send@v1<\/code><\/a>, expanded per call/send (<code>${seq}<\/code> keeps\ncounting per channel/stream). Responses appear in <code>body<\/code> as JSON under the\nsame mapping rules.<\/p>\n<h3><code>std/grpc-connect@v1<\/code><\/h3>\n<p>Opens a live channel and loads the schema. Output:<\/p>\n<pre><code class=\"language-json\">{ \"id\": \"grpc-1\", \"connected\": true, \"duration_ms\": 4.8 }\n<\/code><\/pre>\n<p>Store the output (<code>outputs: conn<\/code>) and pass <code>id: \"${{ conn.id }}\"<\/code> to the\nother <code>grpc-*<\/code> steps. Ids are minted per VU (<code>grpc-1<\/code>, <code>grpc-2<\/code>, …) and are\nvalid only inside that VU's current iteration. A failed connect or schema\nload yields <code>{ \"connected\": false, \"error\": \"…\", \"duration_ms\": … }<\/code>.<\/p>\n<h3><code>std/grpc-call@v1<\/code><\/h3>\n<p>One unary call on a live channel.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Channel id from <code>std/grpc-connect@v1<\/code><\/td><\/tr>\n<tr><td><code>method<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td><code>\"package.Service/Method\"<\/code> (unary methods only)<\/td><\/tr>\n<tr><td><code>payload<\/code><\/td><td>object | array | string<\/td><td>one of payload/payload_base64<\/td><td>JSON request message; <code>${…}<\/code> tokens expand per call<\/td><\/tr>\n<tr><td><code>payload_base64<\/code><\/td><td>string<\/td><td>one of payload/payload_base64<\/td><td>Serialized protobuf bytes<\/td><\/tr>\n<tr><td><code>metadata<\/code><\/td><td>object<\/td><td>—<\/td><td>Per-call metadata (overrides channel defaults per key)<\/td><\/tr>\n<tr><td><code>expect_status<\/code><\/td><td>integer<\/td><td><code>0<\/code><\/td><td>Expected gRPC status code — the step fails on any other<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (ms)<\/td><td><code>10000<\/code><\/td><td>Sent as <code>grpc-timeout<\/code> and enforced locally<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>:<\/p>\n<pre><code class=\"language-json\">{ \"status\": 0, \"body\": { \"message\": \"hello\" }, \"duration_ms\": 2.4,\n  \"metrics\": { \"grpc_req_duration\": [2.4], \"grpc_msgs_sent\": 1,\n               \"grpc_msgs_received\": 1, \"grpc_msg_rtt\": [2.3], \"grpc_req_failed\": 0 } }\n<\/code><\/pre>\n<p>On a non-zero status the output carries <code>error<\/code> (the status message) instead\nof <code>body<\/code>. <code>expect_status<\/code> makes error-path tests read naturally:\n<code>expect_status: 5<\/code> passes when the server returns NOT_FOUND and fails on OK.\nA failed RPC fails the step but the channel stays usable (HTTP/2 channels\nrecover; a dead WebSocket does not). Unary metrics: <code>grpc_req_duration<\/code> and\n<code>grpc_msg_rtt<\/code> histograms, <code>grpc_msgs_sent<\/code> / <code>grpc_msgs_received<\/code> counters,\n<code>grpc_req_failed<\/code> for RPCs that did not meet <code>expect_status<\/code>.<\/p>\n<h3><code>std/grpc@v1<\/code> — one-shot call<\/h3>\n<p>Channel-profile and call parameters in one step; connects, loads the schema,\ncalls, closes. Same output as <code>std/grpc-call@v1<\/code>.<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch schema\n    use: std/http@v1\n    with: { url: \"https://schema.example.com/echo.pb\" }\n    outputs: fetch\n\n  - name: unary probe\n    use: std/grpc@v1\n    with:\n      url: grpcs://api.example.com:443\n      descriptor_set: \"${{ fetch.body_base64 }}\"\n      method: \"echo.v1.Echo/Unary\"\n      payload: { message: \"ping ${seq}\" }\n    check:\n      duration_ms_lt: 500\n<\/code><\/pre>\n<h3><code>std/grpc-stream-open@v1<\/code><\/h3>\n<p>Starts a client-streaming, bidi, or server-streaming call on a live channel\nand returns a <strong>stream id<\/strong> (<code>grpcs-1<\/code>, …).<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Channel id<\/td><\/tr>\n<tr><td><code>method<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td><code>\"package.Service/Method\"<\/code> (streaming methods only)<\/td><\/tr>\n<tr><td><code>payload<\/code><\/td><td>object<\/td><td>server-streaming: required<\/td><td>The single request message for server-streaming methods<\/td><\/tr>\n<tr><td><code>payload_base64<\/code><\/td><td>string<\/td><td>—<\/td><td>Serialized form of the above<\/td><\/tr>\n<tr><td><code>metadata<\/code><\/td><td>object<\/td><td>—<\/td><td>Per-call metadata<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>: <code>{ \"id\": \"grpcs-1\", \"kind\": \"server\"|\"client\"|\"bidi\", \"open\": true, \"duration_ms\": … }<\/code>.<\/p>\n<p>For server-streaming, the one request goes out at open; for\nclient-streaming/bidi, messages go out via <code>std/grpc-stream-send@v1<\/code> (passing\n<code>payload<\/code> at open is an error). Open returns immediately — the call runs in a\nrelay task, because a client-streaming server sends its initial metadata only\nafter the client half-closes. A server-side failure (UNIMPLEMENTED, auth,\n…) therefore surfaces at the first recv/close, not at open.<\/p>\n<h3><code>std/grpc-stream-send@v1<\/code><\/h3>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Stream id<\/td><\/tr>\n<tr><td><code>payload<\/code><\/td><td>object<\/td><td>one of payload/payload_base64<\/td><td>JSON message; <code>${…}<\/code> tokens expand per send<\/td><\/tr>\n<tr><td><code>payload_base64<\/code><\/td><td>string<\/td><td>one of payload/payload_base64<\/td><td>Serialized protobuf bytes<\/td><\/tr>\n<tr><td><code>repeat<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Emit N messages from the one template<\/td><\/tr>\n<tr><td><code>interval_ms<\/code><\/td><td>integer<\/td><td><code>0<\/code><\/td><td>Gap between repeated sends<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (ms)<\/td><td><code>10000<\/code><\/td><td>For the whole send loop<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>: <code>{ \"sent\": N, \"duration_ms\": …, \"metrics\": { \"grpc_msgs_sent\": N } }<\/code>.\nSending on a server-streaming stream is a parameter error (the stream stays\nusable). A send that fails because the peer ended the call fails the step and\ndrops the stream id.<\/p>\n<h3><code>std/grpc-stream-recv@v1<\/code><\/h3>\n<p>Reads until a <strong>stopping rule<\/strong> is satisfied — not reaching it within\n<code>timeout<\/code> fails the step:<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Stream id<\/td><\/tr>\n<tr><td><code>until_contains<\/code><\/td><td>string<\/td><td>—<\/td><td>Stop when a message contains this substring (objects: compact-JSON form)<\/td><\/tr>\n<tr><td><code>until_json<\/code><\/td><td>object<\/td><td>—<\/td><td>Stop when a message JSON-subset-matches (mutually exclusive with <code>until_contains<\/code>)<\/td><\/tr>\n<tr><td><code>count<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Without an <code>until_*<\/code> rule: stop after N messages<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (ms)<\/td><td><code>10000<\/code><\/td><td>Deadline for the stopping rule<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>:<\/p>\n<pre><code class=\"language-json\">{ \"messages\": [ { \"message\": \"hello\" } ], \"count\": 1, \"matched\": true,\n  \"duration_ms\": 3.1,\n  \"metrics\": { \"grpc_msgs_received\": 1, \"grpc_msg_rtt\": [2.9] } }\n<\/code><\/pre>\n<p><code>grpc_msg_rtt<\/code> appears only when an <code>until_*<\/code> rule matched and a\n<code>grpc-stream-send<\/code> preceded it on this stream — the send→match application\nRTT. A plain timeout fails the step but leaves the stream usable; the stream\nending (cleanly or with a status) before the rule is reached fails the step\nand drops the stream.<\/p>\n<h3><code>std/grpc-stream-close@v1<\/code><\/h3>\n<p>Half-closes the request side (client-streaming/bidi: the server sees\nend-of-input) and drains remaining server messages until the final status,\nbounded by <code>timeout<\/code>.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Stream id<\/td><\/tr>\n<tr><td><code>expect_status<\/code><\/td><td>integer<\/td><td><code>0<\/code><\/td><td>Expected final gRPC status code<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (ms)<\/td><td><code>10000<\/code><\/td><td>Drain deadline<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>: <code>{ \"closed\": true, \"status\": 0, \"received\": N, \"messages\": […], \"duration_ms\": …, \"metrics\": { \"grpc_msgs_received\": N, \"grpc_req_failed\": 0|1 } }<\/code>.\nFor a client-streaming method the drained single message is the call's\nresponse. The stream id is released either way.<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open channel\n    use: std/grpc-connect@v1\n    with:\n      url: grpcs://api.example.com:443\n      reflection: true\n      metadata: { authorization: \"Bearer ${{ vars.token }}\" }\n    outputs: conn\n\n  - name: open bidi stream\n    use: std/grpc-stream-open@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"echo.v1.Echo/Bidi\"\n    outputs: stream\n\n  - name: send events\n    use: std/grpc-stream-send@v1\n    with:\n      id: \"${{ stream.id }}\"\n      payload: { message: \"evt-${seq}\" }\n      repeat: 5\n      interval_ms: 20\n\n  - name: await echoes\n    use: std/grpc-stream-recv@v1\n    with:\n      id: \"${{ stream.id }}\"\n      until_contains: \"evt-5\"\n      timeout: 5000\n    outputs: got\n\n  - name: close stream\n    use: std/grpc-stream-close@v1\n    with: { id: \"${{ stream.id }}\" }\n<\/code><\/pre>\n<h3>gRPC limits<\/h3>\n<p>Inbound messages are capped by <code>max_recv_size<\/code> (default 16 MiB); an oversized\nmessage fails the call with RESOURCE_EXCEEDED. Binary (<code>-bin<\/code>) metadata keys\nare not supported — metadata values are strings. Stream lifetimes span user\nsteps, so streams deliberately do not feed <code>grpc_req_duration<\/code> (only unary\ncalls do); <code>grpc-stream-close<\/code> is what turns a stream's final status into\n<code>grpc_req_failed<\/code>. Timeouts, <code>repeat<\/code> counts, and drain lengths have no\nbuilt-in caps.<\/p>\n<h2>Database: the <code>std/db-*@v1<\/code> family<\/h2>\n<p>SQL load tests against <strong>PostgreSQL<\/strong>, <strong>MySQL/MariaDB<\/strong>, and <strong>SQLite<\/strong>.\nTwo styles, mirroring the WebSocket family: a live connection held across\nsteps (<code>db-connect<\/code> → <code>db-query<\/code> / transactions → <code>db-close<\/code>), and a\n<code>per-query<\/code> mode where every query pays connect + query (see\n<a href=\"#db-connection-modes\">Connection modes<\/a>).<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open db\n    use: std/db-connect@v1\n    with:\n      driver: postgres\n      dsn: \"${{ vars.db_dsn }}\"      # keep the password out of the file\n    outputs: db\n\n  - name: begin tx\n    use: std/db-tx-begin@v1\n    with: { id: \"${{ db.id }}\" }\n\n  - name: write\n    use: std/db-query@v1\n    with:\n      id: \"${{ db.id }}\"\n      query: INSERT INTO hits (path, status) VALUES ($1, $2)\n      params: [\"/api/checkout\", 200]\n\n  - name: commit\n    use: std/db-tx-commit@v1\n    with: { id: \"${{ db.id }}\" }\n\n  - name: hang up\n    use: std/db-close@v1\n    with: { id: \"${{ db.id }}\" }\n<\/code><\/pre>\n<h3><code>std/db-connect@v1<\/code><\/h3>\n<p>Opens a connection pool (persistent mode) or stores the parsed connect\nconfig (per-query mode), and returns the Connection ID.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>driver<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td><code>postgres<\/code>, <code>mysql<\/code> (covers MariaDB), or <code>sqlite<\/code><\/td><\/tr>\n<tr><td><code>dsn<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Driver-native connection string, e.g. <code>postgres://user:pass@host:5432/db<\/code>, <code>mysql://user:pass@host:3306/db<\/code>, <code>sqlite://data.db?mode=rwc<\/code>, <code>sqlite::memory:<\/code>. May use <code>${{ … }}<\/code> interpolation for secrets<\/td><\/tr>\n<tr><td><code>tls<\/code><\/td><td>bool | string<\/td><td><code>true<\/code><\/td><td><code>true<\/code> verifies certificate + hostname; <code>false<\/code> is plaintext; <code>\"skip-verify\"<\/code> encrypts without verification. Ignored for sqlite<\/td><\/tr>\n<tr><td><code>mode<\/code><\/td><td>string<\/td><td><code>persistent<\/code><\/td><td><code>persistent<\/code> (pool held across steps) or <code>per-query<\/code> (config only — each query connects fresh)<\/td><\/tr>\n<tr><td><code>pool_size<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Persistent-mode pool size (max 1024)<\/td><\/tr>\n<tr><td><code>timeout_ms<\/code><\/td><td>integer<\/td><td><code>30000<\/code><\/td><td>Connect timeout<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>: <code>{ \"id\": \"db-1\", \"driver\": \"postgres\", \"mode\": \"persistent\", \"connected\": true, \"duration_ms\": …, \"metrics\": … }<\/code>.\nIn per-query mode <code>connected<\/code> is <code>false<\/code> — nothing is opened yet. The DSN\nand its password are never logged; log lines use a sanitized\n<code>host:port/database<\/code> label.<\/p>\n<h3><code>std/db-query@v1<\/code><\/h3>\n<p>Runs one parameterized statement. INSERT/UPDATE/DELETE/DDL are allowed by\ndefault.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Connection ID from <code>std/db-connect@v1<\/code> (<code>id: \"${{ db.id }}\"<\/code>)<\/td><\/tr>\n<tr><td><code>query<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>SQL with driver-native placeholders (<code>$1<\/code>, <code>$2<\/code>, … for postgres; <code>?<\/code> for mysql/sqlite). <strong>Never interpolated<\/strong> — a <code>${{<\/code> in the SQL reaches the database verbatim. 64 KiB hard limit (<code>max_query_bytes<\/code>)<\/td><\/tr>\n<tr><td><code>params<\/code><\/td><td>array<\/td><td><code>[]<\/code><\/td><td>Positional bind values; each entry <em>is<\/em> interpolated. Strings → text, numbers → i64/f64, booleans → bool, null → typed NULL (text-typed on postgres — cast in SQL, e.g. <code>$1::int<\/code>). Arrays/objects cannot be bound<\/td><\/tr>\n<tr><td><code>max_rows<\/code><\/td><td>integer<\/td><td><code>10000<\/code><\/td><td>Hard cap on rows read into memory; extra rows only set <code>truncated: true<\/code><\/td><\/tr>\n<tr><td><code>timeout_ms<\/code><\/td><td>integer<\/td><td><code>30000<\/code><\/td><td>Query timeout (per-query mode: connect + query)<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>: <code>{ \"rows\": &lt;u64&gt;, \"rows_affected\": &lt;u64&gt;, \"truncated\": &lt;bool&gt;, \"data\": [ … ], \"duration_ms\": …, \"metrics\": … }<\/code>.\nRow cells decode as booleans/integers/floats/text/JSON/base64 (binary);\nunmapped types (NUMERIC, temporal, UUID, arrays) surface as <code>null<\/code> — the\nrow still counts. With a transaction open on the connection the query runs\ninside it. A failed query fails the step but leaves the connection — and\nany open transaction — parked.<\/p>\n<h3><code>std/db-tx-begin@v1<\/code>, <code>std/db-tx-commit@v1<\/code>, <code>std/db-tx-rollback@v1<\/code><\/h3>\n<p>Transaction context on a persistent connection (<code>id<\/code> parameter;\n<code>timeout_ms<\/code> applies). Each step is timed as one unit (<code>duration_ms<\/code> +\n<code>db_query_duration<\/code>). One open transaction per connection — begin while one\nis open, or commit/rollback with none, fails the step. Transactions are\nrejected on per-query ids.<\/p>\n<h3><code>std/db-close@v1<\/code><\/h3>\n<p>Closes the connection and releases its id (<code>id<\/code> parameter). An open\ntransaction rolls back as it drops. Connections left open are closed\nimplicitly at iteration end.<\/p>\n<h3>DB connection modes<\/h3>\n<p><strong>persistent<\/strong> (default): <code>db-connect<\/code> opens a pool (<code>pool_size<\/code>, default\n1 — steps within a VU run strictly sequentially) held across the VU's\nsteps; <code>db_query_duration<\/code> measures the query alone.<\/p>\n<p><strong>per-query<\/strong>: the connect step only validates and stores the config; every\n<code>db-query<\/code> opens a fresh connection, queries, and closes, so\n<code>db_query_duration<\/code> measures connect + query as one unit — the shape of\nserverless drivers and connect-time benchmarking. Transactions are\nunavailable. <code>sqlite::memory:<\/code> is pointless here (each fresh connection is\nan empty database) — use a file DSN; conversely an in-memory pool must\nstay at <code>pool_size: 1<\/code>.<\/p>\n<h3>Connection poolers (PgBouncer, Supabase)<\/h3>\n<p>Queries are executed with <strong>unnamed statements<\/strong>, so transaction-mode\npoolers (PgBouncer, Supabase's Supavisor on port 6543) are supported — a\ncached named statement would collide on the shared backend\n(<code>prepared statement \"sqlx_s_1\" already exists<\/code>). If such a pooler splits a\nquery's protocol exchange across backends under concurrency, the step\ntransparently retries inside a transaction (which pins the backend) and the\nconnection keeps wrapping from then on; direct connections never pay for\nthis. For Supabase: use the pooler DSN (port 6543, IPv4) with\n<code>tls: \"skip-verify\"<\/code> (their CA chain is not in webpki-roots) or install\ntheir CA.<\/p>\n<h3>DB metrics<\/h3>\n<table><thead><tr><th>Name<\/th><th>Type<\/th><th>Emitted by<\/th><th>Meaning<\/th><\/tr><\/thead><tbody>\n<tr><td><code>db_connect_duration<\/code><\/td><td>histogram<\/td><td><code>std/db-connect@v1<\/code> (success)<\/td><td>Connect + pool setup latency<\/td><\/tr>\n<tr><td><code>db_query_duration<\/code><\/td><td>histogram<\/td><td><code>std/db-query@v1<\/code>, tx steps<\/td><td>Query latency; includes the fresh connect in per-query mode<\/td><\/tr>\n<tr><td><code>db_rows<\/code><\/td><td>counter<\/td><td><code>std/db-query@v1<\/code><\/td><td>Rows returned, or rows affected when the statement returned none<\/td><\/tr>\n<tr><td><code>db_errors<\/code><\/td><td>counter<\/td><td>all DB steps (failure)<\/td><td>Failed DB steps, total<\/td><\/tr>\n<tr><td><code>db_errors_{connection,constraint,deadlock,timeout,other}<\/code><\/td><td>counter<\/td><td>all DB steps (failure)<\/td><td>Same, split by class (SQLSTATE / errno / SQLite result code; also in the step output's <code>error_kind<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Metric labels carry the step name only — never raw SQL.<\/p>\n<h2><code>std/file-read@v1<\/code><\/h2>\n<p>Read a file into the process-wide cache and expose its content to later\nsteps. The first access pays the disk read; every following iteration —\nacross all VUs — is served from RAM. The cache revalidates against the\nfile's <code>(mtime, size)<\/code> on each access, so a file edited between runs of a\nlong-lived agent is picked up automatically.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>path<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>File to read<\/td><\/tr>\n<tr><td><code>encoding<\/code><\/td><td>string<\/td><td><code>text<\/code><\/td><td><code>text<\/code> (file must be valid UTF-8) or <code>base64<\/code> (binary content)<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong> (available via <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{ \"content\": \"...\", \"size\": 1024, \"path\": \"./fixtures/payload.json\" }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">steps:\n  - name: load payload\n    use: std/file-read@v1\n    with: { path: ./fixtures/payload.json }\n    outputs: payload\n\n  - name: send it\n    use: std/http@v1\n    with:\n      method: POST\n      url: \"https://api.example.com/items\"\n      headers: { content-type: application/json }\n      body: \"${{ payload.content }}\"\n    check:\n      status: 201\n<\/code><\/pre>\n<p>Notes:<\/p>\n<ul>\n<li>A non-UTF-8 file with <code>encoding: text<\/code> fails the step — use\n<code>encoding: base64<\/code> for binary content.<\/li>\n<li>Emits no per-iteration log lines: cache hits are the hot path.<\/li>\n<li>Referencing <code>${{ payload.content }}<\/code> copies the content into the request —\nthe cache saves disk reads, not the per-request copy. Keep fixtures small\nunder high RPS.<\/li>\n<li>For file <em>uploads<\/em>, prefer <code>std/http@v1<\/code>'s <a href=\"#multipart-uploads\"><code>multipart<\/code><\/a>\nparameter, which sends proper <code>multipart/form-data<\/code>.<\/li>\n<\/ul>\n<h2><code>std/file-write@v1<\/code><\/h2>\n<p>Write content to a file — typically to persist a previous step's response.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>path<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>File to write (parent directory must exist)<\/td><\/tr>\n<tr><td><code>content<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Data to write; <code>${{ ... }}<\/code> placeholders make <code>${{ resp.body }}<\/code> the typical payload<\/td><\/tr>\n<tr><td><code>encoding<\/code><\/td><td>string<\/td><td><code>text<\/code><\/td><td><code>text<\/code> writes the string as-is; <code>base64<\/code> decodes it first (the inverse of <code>file-read<\/code>'s base64)<\/td><\/tr>\n<tr><td><code>append<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Append instead of overwrite<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>: <code>{ \"path\": &lt;string&gt;, \"size\": &lt;bytes written&gt; }<\/code><\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch report\n    use: std/http@v1\n    with: { url: \"https://api.example.com/report\" }\n    outputs: resp\n\n  - name: save it\n    use: std/file-write@v1\n    with:\n      path: ./out/report.json\n      content: \"${{ resp.body }}\"\n<\/code><\/pre>\n<p>Notes:<\/p>\n<ul>\n<li>Writing a path that <code>std/file-read@v1<\/code> has cached invalidates that cache\nentry automatically — the read cache revalidates by <code>(mtime, size)<\/code>.<\/li>\n<li>With <code>append: true<\/code> each call is a single <code>O_APPEND<\/code> write, so concurrent\nVUs do not interleave mid-content; ordering between VUs is unspecified.<\/li>\n<li>Emits no per-iteration log lines.<\/li>\n<\/ul>\n<h2><code>std/child_process@v1<\/code><\/h2>\n<p>Spawn a local OS process and keep it alive across the run — a mock server, a\nfixture database, a sidecar the system under test needs. Typical home is the\nconfig's <code>before:<\/code> block (start) paired with <code>after:<\/code> (stop); usable in test\nsteps too. <strong>Fail-closed<\/strong>: the run must opt in with\n<code>allow_process_actions: true<\/code> in the config.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>command<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Executable to spawn<\/td><\/tr>\n<tr><td><code>args<\/code><\/td><td>array of strings<\/td><td><code>[]<\/code><\/td><td>Command arguments<\/td><\/tr>\n<tr><td><code>env<\/code><\/td><td>object<\/td><td>—<\/td><td>Extra environment variables (<code>{ \"NAME\": \"value\" }<\/code>, string values only)<\/td><\/tr>\n<tr><td><code>cwd<\/code><\/td><td>string<\/td><td>—<\/td><td>Working directory of the child<\/td><\/tr>\n<tr><td><code>port<\/code><\/td><td>integer<\/td><td>—<\/td><td>Port the process answers on (echoed to outputs); <code>0<\/code> auto-assigns a free port and exports it to the child as the <code>PORT<\/code> env var<\/td><\/tr>\n<tr><td><code>restart<\/code><\/td><td>string<\/td><td><code>never<\/code><\/td><td>Restart policy: <code>never<\/code>, <code>on-failure<\/code> (non-zero exit or signal), <code>always<\/code><\/td><\/tr>\n<tr><td><code>max_restarts<\/code><\/td><td>integer<\/td><td><code>3<\/code><\/td><td>Restart budget for the policy<\/td><\/tr>\n<tr><td><code>backoff_ms<\/code><\/td><td>integer<\/td><td><code>1000<\/code><\/td><td>Delay before each restart<\/td><\/tr>\n<tr><td><code>buffer_kb<\/code><\/td><td>integer<\/td><td><code>64<\/code><\/td><td>Captured stdout/stderr tail size per stream (KiB)<\/td><\/tr>\n<tr><td><code>waitUntil<\/code><\/td><td>object | string<\/td><td>—<\/td><td>Readiness gate — see below<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong> (available via <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{ \"pid\": 12345, \"ppid\": 12300, \"pgid\": 12345, \"port\": 8080,\n  \"stdout\": \"&lt;tail&gt;\", \"stderr\": \"&lt;tail&gt;\", \"restart_count\": 0 }\n<\/code><\/pre>\n<p><code>ppid<\/code> is the perfscale process itself; <code>pgid<\/code> is the child's process group —\nevery child leads its own group, so a tree kill can never hit perfscale.\n<code>port<\/code> is present only when the step declared one. <code>pid<\/code>/<code>pgid<\/code>/\n<code>restart_count<\/code> are a <strong>snapshot<\/strong>: they move on restarts, so stop processes\nby registry name (<a href=\"#stdkill_processv1\"><code>std/kill_process@v1<\/code><\/a>), not by a\ncaptured pid.<\/p>\n<p>The child keeps running after the step returns. Its output streams into the\nrun log with a <code>{step}: <\/code> prefix (same shape as the k6 runner) and accumulates\nin the bounded tail buffers behind <code>stdout<\/code>/<code>stderr<\/code>. A supervisor applies the\nrestart policy for the rest of the run and logs each restart. Whatever is\nstill alive when the run ends — normal finish, failed <code>before:<\/code>, or Ctrl-C —\nis <strong>stopped automatically<\/strong> (SIGTERM, escalated to SIGKILL after a grace\nperiod, whole process group), so a forgotten <code>kill_process<\/code> never leaks a\nserver.<\/p>\n<h3>waitUntil — readiness gate<\/h3>\n<p>Blocks the step until the process is ready; every listed matcher must hold.\nObject form:<\/p>\n<table><thead><tr><th>Field<\/th><th>Type<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>stdout_contains<\/code><\/td><td>string<\/td><td>Substring in captured stdout<\/td><\/tr>\n<tr><td><code>stderr_contains<\/code><\/td><td>string<\/td><td>Substring in captured stderr<\/td><\/tr>\n<tr><td><code>stdout_matches<\/code><\/td><td>string (regex)<\/td><td>Regex matched against captured stdout<\/td><\/tr>\n<tr><td><code>stderr_matches<\/code><\/td><td>string (regex)<\/td><td>Regex matched against captured stderr<\/td><\/tr>\n<tr><td><code>port_open<\/code><\/td><td>integer<\/td><td>A TCP connect to <code>127.0.0.1:&lt;port&gt;<\/code> succeeds; <code>0<\/code> probes the step's own <code>port<\/code><\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>string<\/td><td>Duration like <code>30s<\/code>/<code>1m<\/code> (default <code>30s<\/code>)<\/td><\/tr>\n<tr><td><code>on_timeout<\/code><\/td><td>string<\/td><td><code>fail<\/code> (default) fails the step; <code>continue<\/code> logs the miss and goes on<\/td><\/tr>\n<\/tbody><\/table>\n<p>A process that exits before becoming ready fails the step with its exit code\nand an stderr tail. The string form covers the common one-matcher case:\n<code>waitUntil: 'contains(stdout, \"Serving HTTP\")'<\/code>, <code>'matches(stderr, \"re\")'<\/code>,\n<code>'port_open(8080)'<\/code>.<\/p>\n<pre><code class=\"language-yaml\">allow_process_actions: true\n\nbefore:\n  - name: web\n    uses: std/child_process@v1\n    with:\n      command: python3\n      args: [\"-m\", \"http.server\", \"8080\"]\n      waitUntil:\n        port_open: 8080\n        timeout: 10s\n      restart: on-failure\n    outputs: web          # → ${{ config.web.pid }}, ${{ config.web.port }}\n<\/code><\/pre>\n<h2><code>std/kill_process@v1<\/code><\/h2>\n<p>Stop a process started with <code>std/child_process@v1<\/code> — the <code>after:<\/code> counterpart.\nSame <code>allow_process_actions<\/code> gate.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>name<\/code><\/td><td>string<\/td><td>one of name/pid<\/td><td>Registry name of a managed process (its step name or <code>outputs<\/code> name). Preferred: the lookup always targets the <em>current<\/em> pid, even across restarts<\/td><\/tr>\n<tr><td><code>pid<\/code><\/td><td>integer<\/td><td>one of name/pid<\/td><td>Raw OS pid — best-effort fallback for processes outside the registry (unix only)<\/td><\/tr>\n<tr><td><code>signal<\/code><\/td><td>string<\/td><td><code>TERM<\/code><\/td><td><code>TERM<\/code>, <code>KILL<\/code>, <code>INT<\/code>, <code>HUP<\/code>, <code>QUIT<\/code>, <code>USR1<\/code>, <code>USR2<\/code> (a <code>SIG<\/code> prefix is accepted)<\/td><\/tr>\n<tr><td><code>grace_ms<\/code><\/td><td>integer<\/td><td><code>5000<\/code><\/td><td>Wait this long for the process to die before escalating to SIGKILL<\/td><\/tr>\n<tr><td><code>tree<\/code><\/td><td>boolean<\/td><td><code>true<\/code><\/td><td>Signal the whole process group, not just the leader<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong>: <code>{ \"pid\": 12345, \"signal\": \"TERM\", \"exit_code\": null, \"waited_ms\": 12 }<\/code><\/p>\n<p><code>exit_code<\/code> is <code>null<\/code> when the process died to a signal, and always <code>null<\/code>\nfor raw pids (a non-child's exit status cannot be collected). Killing an\nalready-stopped process is a no-op, not an error; the run's end-of-run\nauto-kill covers anything not stopped explicitly.<\/p>\n<pre><code class=\"language-yaml\">after:\n  - name: stop web\n    uses: std/kill_process@v1\n    with: { name: web, signal: TERM }\n<\/code><\/pre>\n<p>On non-unix platforms there are no POSIX signals or process groups:\n<code>std/kill_process@v1<\/code> by <code>name<\/code> terminates the direct child only (<code>tree<\/code> has\nno effect), and <code>pid:<\/code> is unsupported.<\/p>\n<h2><code>std/thresholds@v1<\/code><\/h2>\n<p>Run-level SLO gates over the metrics a run collected — k6-style threshold\nexpressions evaluated <strong>once<\/strong>, after every VU has stopped. Its home is the\nconfig's <code>after:<\/code> block:<\/p>\n<pre><code class=\"language-yaml\">after:\n  - name: slo gate\n    use: std/thresholds@v1\n    with:\n      db_query_duration: [\"p95&lt;500\", \"max&lt;2000\"]\n      db_query_failed: [\"rate&lt;0.05\"]\n      db_errors: [\"count==0\"]\n      http_req_duration: [\"avg&lt;300\"]\n    severity: fail            # fail (default) | warn | info\n    message: \"checkout SLO\"   # optional, interpolated\n<\/code><\/pre>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>with.&lt;metric&gt;<\/code><\/td><td>string or array of strings<\/td><td><strong>required (≥1)<\/strong><\/td><td>Threshold expressions for a run metric<\/td><\/tr>\n<tr><td><code>severity<\/code><\/td><td>string<\/td><td><code>fail<\/code><\/td><td>Step-level field: what a violated gate becomes — <code>fail<\/code> (the run exits non-zero), <code>warn<\/code>, or <code>info<\/code> (both exit zero)<\/td><\/tr>\n<tr><td><code>message<\/code><\/td><td>string<\/td><td>—<\/td><td>Step-level field: custom label appended to the violation summary; interpolated<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Expressions<\/strong> are <code>&lt;agg&gt;&lt;op&gt;&lt;number&gt;<\/code>: agg ∈ <code>avg<\/code>, <code>min<\/code>, <code>max<\/code>, <code>p50<\/code>,\n<code>p90<\/code>, <code>p95<\/code>, <code>p99<\/code>, <code>count<\/code>, <code>rate<\/code>; op ∈ <code>&lt;<\/code>, <code>&lt;=<\/code>, <code>&gt;<\/code>, <code>&gt;=<\/code>, <code>==<\/code>, <code>!=<\/code>;\nthe number is a plain float (int or decimal, no units). Whitespace around the\nparts is tolerated (<code>p95 &lt; 500<\/code> parses).<\/p>\n<p><strong>Which aggregates apply<\/strong> depends on the metric kind:<\/p>\n<ul>\n<li><em>Sample metrics<\/em> (<code>db_query_duration<\/code>, <code>http_req_duration<\/code>, <code>ws_msg_rtt<\/code>, …):\n<code>avg<\/code>/<code>min<\/code>/<code>max<\/code>/<code>p50<\/code>/<code>p90<\/code>/<code>p95<\/code>/<code>p99<\/code> are computed over <strong>all<\/strong> samples\nemitted during the run, from the same HDR histograms the end-of-run summary\nprints — gate numbers match the summary. <code>count<\/code> is the number of samples.<\/li>\n<li><em>Counter metrics<\/em> (<code>db_errors<\/code>, <code>db_rows<\/code>, …): only <code>count<\/code>, the counter's\nfinal value.<\/li>\n<li><em>Failure metrics<\/em> (<code>http_req_failed<\/code>, <code>db_query_failed<\/code>, …): <code>rate<\/code> is\nfailed/total invocations in <code>0.0..=1.0<\/code>; <code>count<\/code> is the invocation count.\nThe runner derives these automatically — every step invocation records a\n0/1 sample under <code>&lt;family&gt;_failed<\/code> for each duration metric it emitted\n(<code>db_query_duration<\/code> → <code>db_query_failed<\/code>). See\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<\/ul>\n<p><strong>Errors are hard.<\/strong> An unknown metric name fails the gate — and the run —\nwith an error listing the metrics that <em>are<\/em> present; so does an empty\n<code>with:<\/code>, an unparseable expression, or an aggregate that doesn't apply to the\nmetric kind. A broken gate never silently passes CI.<\/p>\n<p><strong>Output<\/strong> (available via <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{ \"status\": \"fail\",\n  \"message\": \"db_query_duration p95=612ms ≥ 500ms; checkout SLO\",\n  \"violations\": [{ \"metric\": \"db_query_duration\", \"expr\": \"p95&lt;500\", \"actual\": 612.0 }] }\n<\/code><\/pre>\n<p><code>status<\/code> is <code>pass<\/code> when every expression holds, else the <code>severity<\/code> value.\n<code>message<\/code> is the violation summary joined with <code>; <\/code> plus the custom message,\ntruncated at 200 chars with <code>…<\/code>. The run summary JSON\n(<code>perfscale run --summary-export<\/code>) gains a <code>thresholds<\/code> field with the same\nshape (several gates combine: worst status wins).<\/p>\n<h2><code>std/check@v1<\/code><\/h2>\n<p>Assert properties of a previous step's output. Usually written as a step's\ninline <code>check:<\/code> block, which runs this action against that step's output;\nstandalone usage picks its target with <code>on<\/code>.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>on<\/code><\/td><td>string<\/td><td>What to check (defaults to the last step's output). Dots descend into the value: <code>on: got.messages.0<\/code> addresses one message by position<\/td><\/tr>\n<tr><td><code>status<\/code><\/td><td>integer<\/td><td>HTTP status must equal this value<\/td><\/tr>\n<tr><td><code>duration_ms_lt<\/code><\/td><td>integer<\/td><td><code>duration_ms<\/code> must be strictly less<\/td><\/tr>\n<tr><td><code>body_contains<\/code><\/td><td>string<\/td><td>Response body must contain this substring<\/td><\/tr>\n<tr><td><code>message_contains<\/code><\/td><td>string<\/td><td>Some message in the <code>messages<\/code> list contains this substring<\/td><\/tr>\n<tr><td><code>message_matches<\/code><\/td><td>object<\/td><td>Some message JSON-subset-matches this object<\/td><\/tr>\n<tr><td><code>messages_count_gte<\/code><\/td><td>integer<\/td><td>The <code>messages<\/code> list has at least N entries<\/td><\/tr>\n<\/tbody><\/table>\n<p>The <code>message_*<\/code> asserts work over the <code>messages<\/code> list that message-exchanging\nactions expose (<code>std/ws@v1<\/code>, <code>std/ws-recv@v1<\/code>, <code>pro/fix@v1<\/code>) and use the\n<strong>any<\/strong> quantifier — at least one message must match, because streams carry\nnoise (heartbeats, unrelated events). WS text frames (strings) are parsed as\nJSON for <code>message_matches<\/code>; FIX frames (tag→value objects) match directly, so\n<code>message_matches: { \"35\": \"8\", \"150\": \"F\" }<\/code> asserts a filled\nExecutionReport. For deterministic exchanges, address one message by index\nvia <code>on<\/code> (<code>on: got.messages.0<\/code>) — brittle on unordered streams.<\/p>\n<p>Each assertion logs <code>PASS<\/code>/<code>FAIL<\/code>; failures go to stderr but do not stop the\nrun. Output: <code>{ \"passed\": true|false }<\/code>.<\/p>\n<h2><code>std/sleep@v1<\/code><\/h2>\n<p>Pause the current VU.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>ms<\/code><\/td><td>integer<\/td><td><code>1000<\/code><\/td><td>Milliseconds to sleep<\/td><\/tr>\n<tr><td><code>seconds<\/code><\/td><td>number<\/td><td>—<\/td><td>Alternative to <code>ms<\/code> (fractions allowed)<\/td><\/tr>\n<\/tbody><\/table>\n<h2><code>std/log@v1<\/code><\/h2>\n<p>Emit a line to stdout — mostly useful with interpolation:<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>message<\/code><\/td><td>string<\/td><td>Text to emit; <code>${{ var.field }}<\/code> references are resolved first<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Interpolation rules<\/h2>\n<p>All string leaves in <code>with<\/code>/<code>check<\/code> are interpolated before the action runs:<\/p>\n<ul>\n<li><code>${{ name }}<\/code> — the stored value, stringified<\/li>\n<li><code>${{ name.field }}<\/code> — one field of a stored JSON object<\/li>\n<li>unknown names resolve to <code>\"\"<\/code>; an unterminated <code>${{<\/code> is left as-is<\/li>\n<\/ul>\n<h2>Adding a new action (contributors)<\/h2>\n<ol>\n<li>Implement it in <code>crates/perfscale-core/src/step/actions.rs<\/code> and add a\ndispatch arm in <code>execute_action<\/code>.<\/li>\n<li>Return an <code>ActionOutput<\/code>: stored <code>value<\/code>, log lines, <code>success<\/code>, and an\n<code>http_sample<\/code> if the action performs HTTP work that should count toward\nmetrics.<\/li>\n<li>Add unit tests next to the existing ones (wiremock is available for HTTP).<\/li>\n<li>Document it here and, if it introduces new step fields, regenerate the\nschemas (<code>cargo run -p perfscale-core --example gen_schema<\/code>).<\/li>\n<\/ol>\n<h2>Custom actions from downstream crates<\/h2>\n<p>Actions that shouldn't live in this OSS crate — higher-tier or proprietary\nprotocols such as the FIX action <code>pro/fix@v1<\/code> — plug in without a fork.\nImplement the <code>perfscale_core::step::actions::ActionHandler<\/code> trait in your own\ncrate and call <code>register_action(Arc::new(MyHandler))<\/code> once at process start\n(e.g. in the agent's <code>main<\/code>). Registered handlers are consulted only for action\nIDs no built-in <code>std/*<\/code> action matches, so built-ins pay no lookup cost. Params\nreach the handler with <code>${{ }}<\/code> interpolation already applied.<\/p>\n","html_ru":"<h1>Встроенные действия<\/h1>\n<p>Действия (actions) — это единицы, из которых состоят <code>steps<\/code> нативного теста.\nКаждый шаг указывает действие в <code>use<\/code>, передаёт параметры в <code>with<\/code> и может\nпроверять результат в <code>check<\/code>.<\/p>\n<p>Полные идентификаторы содержат пространство имён и версию (<code>std/http@v1<\/code>);\nкороткие псевдонимы (<code>http<\/code>, <code>graphql<\/code>, <code>tcp<\/code>, <code>udp<\/code>, <code>pubsub<\/code>, <code>llm<\/code>, <code>ws<\/code>,\n<code>ws-connect<\/code>, <code>ws-send<\/code>, <code>ws-recv<\/code>, <code>ws-ping<\/code>,\n<code>ws-close<\/code>, <code>grpc<\/code>, <code>grpc-connect<\/code>, <code>grpc-call<\/code>, <code>grpc-stream-open<\/code>,\n<code>grpc-stream-send<\/code>, <code>grpc-stream-recv<\/code>, <code>grpc-stream-close<\/code>, <code>db-connect<\/code>,\n<code>db-query<\/code>, <code>db-tx-begin<\/code>, <code>db-tx-commit<\/code>, <code>db-tx-rollback<\/code>, <code>db-close<\/code>,\n<code>check<\/code>, <code>sleep<\/code>,\n<code>log<\/code>, <code>file-read<\/code>, <code>file-write<\/code>, <code>child_process<\/code>, <code>kill_process<\/code>,\n<code>set_shared_variable<\/code>, <code>get_shared_variable<\/code>) разрешаются в те же\nреализации.<\/p>\n<h2><code>std/http@v1<\/code><\/h2>\n<p>Выполняет один HTTP-запрос за итерацию. Время выполнения попадает в метрики\nпрогона.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Абсолютный URL<\/td><\/tr>\n<tr><td><code>method<\/code><\/td><td>string<\/td><td><code>GET<\/code><\/td><td>Любой HTTP-метод, включая расширенные методы вроде <code>QUERY<\/code> (безопасный метод с телом, <a target=\"_blank\" rel=\"noopener\" href=\"https://datatracker.ietf.org/doc/draft-ietf-httpbis-safe-method-w-body/\">draft-ietf-httpbis-safe-method-w-body<\/a>)<\/td><\/tr>\n<tr><td><code>headers<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ \"Name\": \"Value\" }<\/code>, значения — только строки<\/td><\/tr>\n<tr><td><code>body<\/code><\/td><td>string | object<\/td><td>—<\/td><td>Строка → <code>text/plain<\/code>; объект → сериализованный JSON с <code>application/json<\/code>. Взаимоисключающий с <code>multipart<\/code><\/td><\/tr>\n<tr><td><code>multipart<\/code><\/td><td>array<\/td><td>—<\/td><td>Отправка <code>multipart/form-data<\/code> — см. <a href=\"#multipart-%D0%B7%D0%B0%D0%B3%D1%80%D1%83%D0%B7%D0%BA%D0%B8\">Multipart-загрузки<\/a>. Взаимоисключающий с <code>body<\/code><\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (мс)<\/td><td><code>10000<\/code><\/td><td>Таймаут на запрос<\/td><\/tr>\n<tr><td><code>insecure<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Пропустить проверку TLS-сертификата — для целей с самоподписанными сертификатами, например <code>perfscale serve --tls<\/code>. Никогда не используйте против хостов, которые вы не контролируете<\/td><\/tr>\n<tr><td><code>pool<\/code><\/td><td>string<\/td><td><code>per-vu<\/code><\/td><td><code>per-vu<\/code> привязывает шаг к шарду HTTP-клиента виртуального пользователя; <code>shared<\/code> переводит всех VU на один глобальный для процесса клиент<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong> (доступен через <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{\n  \"status\": 200,\n  \"body\": \"...\",\n  \"duration_ms\": 42.37,\n  \"headers\": { \"content-type\": \"application/json\", \"x-request-id\": \"abc-123\" }\n}\n<\/code><\/pre>\n<p>Имена заголовков приводятся к нижнему регистру; повторяющиеся заголовки\nобъединяются через <code>\", \"<\/code>. Используйте их в последующих шагах через\n<code>${{ resp.headers.x-request-id }}<\/code>.<\/p>\n<p>Ответы с текстовым типом содержимого (<code>text/*<\/code>, <code>application/json<\/code>,\n<code>application/*+json<\/code>, <code>application/*+xml<\/code>, …) приходят в <code>body<\/code>, как и раньше.\nБинарные данные (например, <code>application/octet-stream<\/code>) вместо этого возвращают\nпустое <code>body<\/code> плюс поле <code>body_base64<\/code> — именно так полученный protobuf\nFileDescriptorSet передаётся в gRPC-шаг:\n<code>descriptor_set: \"${{ fetch.body_base64 }}\"<\/code>. Отсутствующий тип содержимого\nопределяется эвристически: корректный UTF-8 обрабатывается как текст, всё\nостальное — как бинарные данные.<\/p>\n<p>Статусы ≥ 400, транспортные ошибки и таймауты считаются неудачными запросами в\n<code>http_req_failed<\/code>. Таймаут логируется отдельно (<code>→ TIMEOUT after ...ms<\/code>).<\/p>\n<h3>Multipart-загрузки<\/h3>\n<p><code>multipart<\/code> отправляет <code>multipart/form-data<\/code> (загрузка файлов, эндпоинты в\nстиле HTML-форм). Каждый элемент массива — одна часть:<\/p>\n<table><thead><tr><th>Поле части<\/th><th>Обязательно<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>name<\/code><\/td><td>да<\/td><td>Имя поля формы<\/td><\/tr>\n<tr><td><code>value<\/code><\/td><td>одно из value/file<\/td><td>Содержимое текстового поля<\/td><\/tr>\n<tr><td><code>file<\/code><\/td><td>одно из value/file<\/td><td>Путь к файлу на диске (относительно рабочего каталога)<\/td><\/tr>\n<tr><td><code>filename<\/code><\/td><td>нет<\/td><td>Имя файла, отправляемое серверу; по умолчанию — базовое имя файла<\/td><\/tr>\n<tr><td><code>content_type<\/code><\/td><td>нет<\/td><td>MIME-тип части (например, <code>application/octet-stream<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n<pre><code class=\"language-yaml\">steps:\n  - name: upload report\n    use: std/http@v1\n    with:\n      method: POST\n      url: \"https://api.example.com/upload\"\n      multipart:\n        - name: file\n          file: ./fixtures/report.csv\n          content_type: text/csv\n        - name: description\n          value: \"uploaded by ${{ __last__.status }} check run\"\n    check:\n      status: 201\n<\/code><\/pre>\n<p>Примечания:<\/p>\n<ul>\n<li>Заголовок <code>Content-Type: multipart/form-data; boundary=…<\/code> выставляется\nавтоматически — не добавляйте его в <code>headers<\/code>.<\/li>\n<li>Плейсхолдеры <code>${{ ... }}<\/code> работают в значениях частей и путях, как и везде\nв <code>with:<\/code>.<\/li>\n<li>Файлы читаются с диска на каждой итерации: страничный кэш ОС делает\nповторные чтения дешёвыми, а файл, изменённый между прогонами, подхватывается.\nПри высоком RPS предпочитайте небольшие файлы-фикстуры.<\/li>\n<li>Отсутствующий или недоступный для чтения файл приводит к ошибке шага до\nотправки любого запроса.<\/li>\n<\/ul>\n<h2><code>std/graphql@v1<\/code><\/h2>\n<p>Отправляет одну GraphQL-операцию (запрос или мутацию) за итерацию по HTTP, с\nопциональной валидацией схемы по схеме, полученной интроспекцией эндпоинта.\nПолное пошаговое руководство — в <a href=\"#/docs/core/graphql\">Нагрузочное тестирование GraphQL<\/a>.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>GraphQL-эндпоинт, например <code>https://api.example.com/graphql<\/code><\/td><\/tr>\n<tr><td><code>query<\/code><\/td><td>string<\/td><td>одно из query/query_file<\/td><td>Встроенный GraphQL-документ<\/td><\/tr>\n<tr><td><code>query_file<\/code><\/td><td>string (путь)<\/td><td>одно из query/query_file<\/td><td>Прочитать документ из файла <code>.graphql<\/code>. Доступ к файловой системе: требует <code>allow_file_actions<\/code>, учитывает <code>fs_root<\/code><\/td><\/tr>\n<tr><td><code>variables<\/code><\/td><td>object<\/td><td>—<\/td><td>Переменные запроса. Применяется интерполяция <code>${{ … }}<\/code>, а токены-генераторы с одинарными фигурными скобками <code>${…}<\/code> (<code>${uuid}<\/code>, <code>${rand}<\/code>, <code>${now}<\/code>) раскрываются при каждом выполнении<\/td><\/tr>\n<tr><td><code>operation<\/code><\/td><td>string<\/td><td>—<\/td><td><code>operationName<\/code> для выполнения. Обязателен, когда документ содержит несколько операций; также служит тегом метрик по операциям<\/td><\/tr>\n<tr><td><code>method<\/code><\/td><td>string<\/td><td><code>POST<\/code><\/td><td><code>POST<\/code> (тело JSON) или <code>GET<\/code> (параметры в URL-запросе — для чтений, кэшируемых CDN)<\/td><\/tr>\n<tr><td><code>headers<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ \"Name\": \"Value\" }<\/code>, значения — только строки<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (мс)<\/td><td><code>10000<\/code><\/td><td>Таймаут на запрос<\/td><\/tr>\n<tr><td><code>insecure<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Пропустить проверку TLS-сертификата<\/td><\/tr>\n<tr><td><code>introspection<\/code><\/td><td>boolean<\/td><td><code>true<\/code><\/td><td>Один раз за прогон получить схему эндпоинта и валидировать каждый запрос перед отправкой. Ошибка получения схемы деградирует до прогона без валидации (логируется один раз)<\/td><\/tr>\n<tr><td><code>schema_file<\/code><\/td><td>string (путь)<\/td><td>—<\/td><td>Валидировать по локальному SDL-файлу вместо интроспекции (запасной вариант для эндпоинтов с отключённой интроспекцией). Те же правила файловой системы, что и для <code>query_file<\/code><\/td><\/tr>\n<tr><td><code>pool<\/code><\/td><td>string<\/td><td><code>per-vu<\/code><\/td><td><code>per-vu<\/code> привязывает шаг к шарду HTTP-клиента виртуального пользователя (поведение <code>std/http@v1<\/code>); <code>shared<\/code> переводит всех VU на один глобальный для процесса клиент<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong> (доступен через <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{\n  \"status\": 200,\n  \"data\": { \"viewer\": { \"id\": \"u-1\" } },\n  \"errors\": [ { \"message\": \"widgets timed out\" } ],\n  \"body\": \"{\\\"data\\\":…}\",\n  \"duration_ms\": 12.31,\n  \"headers\": { \"content-type\": \"application/json\" }\n}\n<\/code><\/pre>\n<p><code>data<\/code> и <code>errors<\/code> — декодированная полезная нагрузка GraphQL (<code>errors<\/code>\nприсутствует, только когда сервер её прислал); <code>body<\/code> хранит сырой текст для\nпроверок <code>body_contains<\/code>. Извлечение читает структурированную нагрузку:\n<code>${{ create.data.createWidget.id }}<\/code>.<\/p>\n<p>Семантика ответов соответствует реальности GraphQL-over-HTTP: статусы ≥ 400\nприводят к ошибке шага; <code>200<\/code> с <code>errors<\/code> и без <code>data<\/code> — тоже ошибка; частичные\n<code>data<\/code> плюс <code>errors<\/code> считаются успехом (сервер разрешил то, что смог), а ошибки\nучитываются в метрике <code>graphql_errors<\/code>.<\/p>\n<p>Синтаксическая ошибка, ошибка валидации схемы или нечитаемый <code>query_file<\/code>\nприводят к ошибке шага <strong>до<\/strong> отправки запроса — цель никогда не увидит\nнекорректный запрос.<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch viewer\n    use: std/graphql@v1\n    with:\n      url: https://api.example.com/graphql\n      query: |\n        query GetViewer($id: ID!) {\n          viewer(id: $id) { id name }\n        }\n      variables: { \"id\": \"${{ vars.viewer_id }}\" }\n    check:\n      status: 200\n    outputs: viewer\n\n  - name: rename widget\n    use: std/graphql@v1\n    with:\n      url: https://api.example.com/graphql\n      query_file: ./queries/rename-widget.graphql\n      variables: { \"id\": \"${{ viewer.data.viewer.id }}\", \"name\": \"w-${seq}\" }\n<\/code><\/pre>\n<p>Метрики: <code>graphql_req_duration<\/code> (гистограмма с производной частотой\n<code>graphql_req_failed<\/code>), <code>graphql_errors<\/code> (счётчик) и\n<code>graphql_op_&lt;operationName&gt;_duration<\/code>, когда операция именована, — плюс\nстандартные агрегаты <code>http_req_*<\/code>, которые пополняет каждый HTTP-шаг.<\/p>\n<h2><code>std/tcp@v1<\/code><\/h2>\n<p>Открывает «сырое» TCP-соединение, опционально отправляет данные, опционально\nчитает ответ и измеряет время всего обмена. Без протокольного фрейминга —\nстроительный блок для проверки произвольных строковых/бинарных сервисов\n(Redis, SMTP, собственные шлюзы).<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>host<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong>*<\/td><td>Целевой хост (вместе с <code>port<\/code>)<\/td><\/tr>\n<tr><td><code>port<\/code><\/td><td>integer<\/td><td><strong>обязателен<\/strong>*<\/td><td>Целевой порт<\/td><\/tr>\n<tr><td><code>address<\/code><\/td><td>string<\/td><td>—<\/td><td>Сокращение <code>host:port<\/code>, вместо <code>host<\/code>+<code>port<\/code><\/td><\/tr>\n<tr><td><code>send<\/code><\/td><td>string<\/td><td>—<\/td><td>Текстовые данные для отправки после подключения<\/td><\/tr>\n<tr><td><code>send_base64<\/code><\/td><td>string<\/td><td>—<\/td><td>Данные в Base64 для бинарных протоколов. Взаимоисключающий с <code>send<\/code><\/td><\/tr>\n<tr><td><code>read<\/code><\/td><td>boolean<\/td><td><code>true<\/code>, если задан <code>expect<\/code>, иначе <code>false<\/code><\/td><td>Прочитать один фрагмент ответа<\/td><\/tr>\n<tr><td><code>read_bytes<\/code><\/td><td>integer<\/td><td><code>65536<\/code><\/td><td>Ограничение на число прочитанных байт<\/td><\/tr>\n<tr><td><code>expect<\/code><\/td><td>string<\/td><td>—<\/td><td>Подстрока, которую должен содержать ответ (подразумевает <code>read<\/code>)<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (мс)<\/td><td><code>10000<\/code><\/td><td>Таймаут на подключение + обмен<\/td><\/tr>\n<\/tbody><\/table>\n<p>* Укажите либо <code>address<\/code>, <strong>либо<\/strong> <code>host<\/code> + <code>port<\/code>.<\/p>\n<p><strong>Результат<\/strong> (доступен через <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{ \"connected\": true, \"sent\": 4, \"received\": 4, \"response\": \"pong\", \"duration_ms\": 0.63 }\n<\/code><\/pre>\n<p><code>response<\/code> — UTF-8 с потерями (lossy), поэтому для бинарных сервисов проверяйте\n<code>received<\/code>, а не строку. Ошибки подключения, таймауты и несовпадение <code>expect<\/code>\nпомечают шаг неудачным и учитываются в <code>http_req_failed<\/code>; время попадает в\n<code>http_req_duration<\/code> наравне с HTTP и UDP, так что перцентили сопоставимы между\nтранспортами.<\/p>\n<h2><code>std/udp@v1<\/code><\/h2>\n<p>Отправляет UDP-датаграмму цели и опционально ждёт ответ. Задержка «туда и\nобратно» измеряется от отправки до датаграммы-ответа (или только сама отправка,\nкогда ответ не ожидается). Те же поля <code>with<\/code>, что у <code>std/tcp@v1<\/code>, за\nисключением того, что <code>send<\/code> (или <code>send_base64<\/code>) <strong>обязателен<\/strong>.<\/p>\n<p>UDP не устанавливает соединения: «успешная» отправка означает лишь, что\nдатаграмма покинула хост. Задайте <code>read<\/code> (или <code>expect<\/code>), чтобы действительно\nпроверить ответ.<\/p>\n<p><strong>Результат:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"sent\": 4, \"received\": 4, \"response\": \"pong\", \"duration_ms\": 0.21 }\n<\/code><\/pre>\n<h2><code>std/pubsub@v1<\/code><\/h2>\n<blockquote>\n<p>Пошаговое описание на уровне концепций (драйверы, шаблоны producer/consumer,\nметрики, пороги): <a href=\"#/docs/core/pubsub\">руководство по Pub/Sub<\/a>.<\/p>\n<\/blockquote>\n<p>Публикует сообщения в subject и/или ждёт сообщения из него — разовый pub/sub\nобмен, измеряющий задержку публикации и сквозную (end-to-end) задержку.\nТранспорт подключается через <strong>драйвер<\/strong>:<\/p>\n<table><thead><tr><th>Драйвер<\/th><th>Транспорт<\/th><\/tr><\/thead><tbody>\n<tr><td><code>memory<\/code> (по умолчанию)<\/td><td>Внутрипроцессная шина рассылки — брокер не нужен. Шина глобальна для процесса: один канал на subject, общий для всех VU, поэтому публикация одного VU доставляется каждому VU, подписанному на этот subject (fan-out между VU — это особенность)<\/td><\/tr>\n<tr><td><code>nats<\/code><\/td><td>Настоящий сервер NATS (core NATS, без JetStream) через <code>async-nats<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<p>Проприетарные драйверы (Kafka, Redis, …) регистрируются через ту же точку\nподключения в pro-сборке; неизвестное значение <code>driver<\/code> приводит к ошибке шага\nсо списком зарегистрированных драйверов — так вы узнаёте, что в вашей сборке их\nнет.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>driver<\/code><\/td><td>string<\/td><td><code>memory<\/code><\/td><td><code>memory<\/code>, <code>nats<\/code> или драйвер, зарегистрированный downstream<\/td><\/tr>\n<tr><td><code>subject<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Subject NATS / имя топика в памяти<\/td><\/tr>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td>—<\/td><td>URL брокера; обязателен для <code>nats<\/code>, игнорируется <code>memory<\/code><\/td><\/tr>\n<tr><td><code>publish<\/code><\/td><td>string | array<\/td><td>—<\/td><td>Одно сообщение или список; не-строки сериализуются в текст JSON<\/td><\/tr>\n<tr><td><code>subscribe<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ count, until_contains, timeout_ms }<\/code> — ждать <code>count<\/code> сообщений (по умолчанию <code>1<\/code>), каждое из которых содержит <code>until_contains<\/code> (опционально), в течение <code>timeout_ms<\/code> (по умолчанию <code>5000<\/code>)<\/td><\/tr>\n<tr><td><code>options<\/code><\/td><td>object<\/td><td>—<\/td><td>Специфичная для драйвера настройка, передаваемая как есть — встроенные драйверы её игнорируют; pro-драйверы (Kafka, Redis, MQTT) используют для QoS, consumer-групп, аутентификации и т.д.<\/td><\/tr>\n<\/tbody><\/table>\n<p>Требуется хотя бы один из <code>publish<\/code> / <code>subscribe<\/code>. Когда заданы оба, подписка\nустанавливается <strong>первой<\/strong>, поэтому roundtrip на одном и том же subject видит\nсвои же сообщения. Только публикация — чистый шаг-производитель (успех = все\nпубликации приняты); только подписка — чистый шаг-потребитель. Шаг завершается\nошибкой при сбое подключения, ошибке публикации или таймауте подписки — в\nошибке указано, сколько сообщений из <code>count<\/code> пришло и сколько отклонил\nсопоставитель <code>until_contains<\/code>.<\/p>\n<p><strong>Результат:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"driver\": \"memory\", \"subject\": \"orders.created\", \"published\": 2,\n  \"received\": 1, \"duration_ms\": 3.21,\n  \"body\": \"&lt;joined received payloads&gt;\",\n  \"metrics\": { \"pubsub_msgs_published\": 2, \"pubsub_msgs_received\": 1,\n               \"pubsub_e2e_ms\": [1.2] } }\n<\/code><\/pre>\n<p><code>received<\/code> / <code>body<\/code> и метрики <code>pubsub_msgs_received<\/code> / <code>pubsub_e2e_ms<\/code>\nпоявляются, только когда задан <code>subscribe<\/code>. <code>pubsub_e2e_ms<\/code> содержит по одному\nзамеру на сопоставленное сообщение: начало фазы публикации → получено. <code>body<\/code> —\nэто сопоставленные нагрузки, объединённые переводами строк, поэтому работает\n<code>check: { body_contains: … }<\/code>.<\/p>\n<p><strong>Примеры.<\/strong> Roundtrip в памяти (без брокера — обе стороны в одном шаге):<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: order events roundtrip\n    use: std/pubsub@v1\n    with:\n      subject: orders.created\n      publish: [\"order-1 created\", \"order-2 created\"]\n      subscribe: { count: 2, until_contains: created, timeout_ms: 2000 }\n    check:\n      body_contains: order-2\n<\/code><\/pre>\n<p>Производитель NATS, только публикация:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: produce order events\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.created\n      publish:\n        - '{\"id\":\"ord-1\",\"total\":42.50}'\n        - '{\"id\":\"ord-2\",\"total\":17.00}'\n<\/code><\/pre>\n<p>Потребитель NATS с сопоставителем, таймаутом и блоком check:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: await shipment event\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.shipped\n      subscribe: { count: 1, until_contains: '\"id\":\"ord-1\"', timeout_ms: 3000 }\n    check:\n      body_contains: ord-1\n    outputs: shipment\n<\/code><\/pre>\n<h2><code>std/set_shared_variable@v1<\/code><\/h2>\n<blockquote>\n<p>Пошаговое описание на уровне концепций (объявление, шаблоны, драйверы):\n<a href=\"#/docs/core/shared-variables\">руководство по разделяемым переменным<\/a>.<\/p>\n<\/blockquote>\n<p>Атомарно изменяет разделяемую переменную — единое хранилище «ключ/значение» в\nрамках прогона, общее для всех VU процесса, для координации между VU\n(разделяемые счётчики, очереди producer/consumer, барьеры), которую не могут\nвыразить неизменяемые <code>variables<\/code> отдельного VU. Имена должны быть\n<strong>объявлены<\/strong> в блоке\n<a href=\"#/docs/yaml-reference\"><code>shared_variables:<\/code><\/a> конфигурационного\nфайла; шаг, ссылающийся на необъявленное имя, или <code>op<\/code>, несовместимая с\nобъявленным типом (<code>increment<\/code> над списком), завершится ошибкой валидации\nконфигурации до старта любого VU.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>driver<\/code><\/td><td>string<\/td><td><code>memory<\/code><\/td><td><code>memory<\/code> (глобальное для процесса хранилище) или драйвер, зарегистрированный downstream (pro-сборки: Redis, …). Неизвестное значение приводит к ошибке шага со списком зарегистрированных драйверов<\/td><\/tr>\n<tr><td><code>name<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Имя объявленной разделяемой переменной<\/td><\/tr>\n<tr><td><code>op<\/code><\/td><td>string<\/td><td><code>set<\/code><\/td><td><code>set<\/code> (любой тип), <code>increment<\/code> (число — <code>value<\/code> это приращение), <code>append<\/code> (список — <code>value<\/code> это элемент)<\/td><\/tr>\n<tr><td><code>value<\/code><\/td><td>any<\/td><td><strong>обязателен<\/strong><\/td><td>Новое значение / приращение / добавляемый элемент<\/td><\/tr>\n<\/tbody><\/table>\n<p><code>increment<\/code> возвращает новое значение, <code>append<\/code> — новую длину списка, <code>set<\/code> —\nсохранённое значение. Каждая операция — одно атомарное захватывание: пары\n«прочитал-изменил-записал», которая могла бы породить гонку, нет.<\/p>\n<p><strong>Результат:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"driver\": \"memory\", \"name\": \"approved_count\", \"op\": \"increment\",\n  \"value\": 3, \"duration_ms\": 0.03 }\n<\/code><\/pre>\n<h2><code>std/get_shared_variable@v1<\/code><\/h2>\n<p>Атомарно читает разделяемую переменную, опционально блокируясь до выполнения\nусловия.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>driver<\/code><\/td><td>string<\/td><td><code>memory<\/code><\/td><td><code>memory<\/code> или драйвер, зарегистрированный downstream<\/td><\/tr>\n<tr><td><code>name<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Имя объявленной разделяемой переменной<\/td><\/tr>\n<tr><td><code>op<\/code><\/td><td>string<\/td><td><code>get<\/code><\/td><td><code>get<\/code> (любой тип) или <code>pop<\/code> (список: удалить и вернуть первый элемент FIFO; <code>null<\/code>, когда пусто
