e>webrtc_ttff_ms<\/code>, <code>webrtc_call_duration_ms<\/code>, …<\/td><td><code>&lt;тем же именем&gt;_failed<\/code> — см. <a href=\"/docs/pro-features/webrtc#%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D0%BA%D0%B8\">WebRTC (pro)<\/a><\/td><\/tr>\n<\/tbody><\/table>\n<p>Они выводятся как <code>&lt;name&gt;: &lt;pct&gt;%<\/code> (в форме k6 <code>http_req_failed<\/code>). Поскольку\nодин сэмпл записывается <strong>на вызов<\/strong> (а не на сэмпл длительности — вызов,\nсовпавший с тремя сообщениями, всё равно записывает один сэмпл ошибки),\n<code>failed/total<\/code> по ним — это в точности доля ошибок вызовов семейства шагов —\nименно её оценивает <code>std/thresholds@v1<\/code> с <code>rate<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  - use: std/thresholds@v1\n    with:\n      graphql_req_failed:\n        - \"rate&lt;0.01\"             # менее 1% неуспешных операций\n      pubsub_e2e_ms_failed:\n        - \"rate&lt;0.05\"             # ожидания подписки в основном успевали\n<\/code><\/pre>\n<p>Учтите: неудачный шаг, не эмитировавший сэмпл длительности (например,\n<code>db-connect<\/code>, который так и не подключился, или ожидание подписки без\nединого совпавшего сообщения), не записывает и сэмпл ошибки, поэтому доля\nсемейства покрывает только вызовы, дошедшие до измерения.<\/p>\n<p><strong>Нативные и производные.<\/strong> <code>http_req_failed<\/code> — нативная для HTTP-пути:\nкаждое действие, возвращающее <code>HttpSample<\/code>, само помечает его успех/ошибку\n(статус ≥ 400, транспортная ошибка, таймаут), и никакого вычисления нет.\nСемейство gRPC — асимметричный случай: <code>std/grpc-call@v1<\/code> и\n<code>std/grpc-stream-close@v1<\/code> эмитируют <strong>счётчик<\/strong> <code>grpc_req_failed<\/code> (0/1 на\nвызов, управляемый <code>expect_status<\/code>), а раннер <em>дополнительно<\/em> вычисляет\nrate <code>grpc_req_failed<\/code> из <code>grpc_req_duration<\/code>. Когда существуют обе,\nrate-метрика затеняет счётчик и в сводке, и при оценке порогов — поэтому\nработает <code>grpc_req_failed: [\"rate&lt;0.05\"]<\/code>, а выражения с <code>count<\/code> по этому\nимени счётчик не видят. У семейства WebRTC есть собственные счётчики ошибок\n(<code>webrtc_connect_errors<\/code>, <code>webrtc_call_errors_&lt;stage&gt;<\/code>), сосуществующие с\nпроизводными rate — см. <a href=\"/docs/pro-features/webrtc#%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D0%BA%D0%B8\">WebRTC (pro)<\/a>.<\/p>\n<h2>Пороговые проверки запуска (<code>std/thresholds@v1<\/code>)<\/h2>\n<p>Шаг <code>std/thresholds@v1<\/code> (обычно в <code>after:<\/code>) оценивает выражения в стиле k6\nпо агрегатам запуска и выводит одну машиночитаемую строку после сводки метрик:<\/p>\n<pre><code class=\"language-text\">thresholds: {\"status\":\"fail\",\"message\":\"db_query_failed rate=1 ≥ 0.05; checkout SLO\",\"violations\":[{\"metric\":\"db_query_failed\",\"expr\":\"rate&lt;0.05\",\"actual\":1.0}]}\n<\/code><\/pre>\n<p>Агрегаты берутся из тех же HDR-гистограмм/счётчиков, что и текстовая сводка,\nпоэтому числа проверок совпадают с выводом сводки. Строка собирается в\nвывод <code>perfscale run --summary-export<\/code> под ключом <code>thresholds<\/code>\n(<code>{status, message, violations}<\/code>), а статус <code>fail<\/code> заставляет CLI завершиться\nс ненулевым кодом. См. <a href=\"#/docs/core/actions\">actions.md<\/a>.<\/p>\n<h2>Метрики GPU (<code>gpu:<\/code>)<\/h2>\n<p>При <code>gpu.enabled: true<\/code> в <a href=\"#/docs/yaml-reference\">конфигурации запуска<\/a>\nнативный движок сэмплирует каждый GPU на хосте — загрузку %, занято/всего\nVRAM, температуру, потребляемую мощность — раз в <code>interval_ms<\/code> на протяжении\nвсей фазы VU (через <code>nvidia-smi<\/code> или эндпоинт dcgm-exporter). После сводки\nметрик запуск выводит компактный блок по устройствам плюс одну машиночитаемую\nстроку <code>gpu: {...}<\/code> с полным временным рядом, которую <code>--summary-export<\/code>\nвкладывает под ключом <code>gpu<\/code>:<\/p>\n<pre><code class=\"language-text\">gpu: 1 device, 300 samples every 1000ms (nvidia-smi)\ngpu0: util avg=64.3% max=100.0% vram max=41088/81559MiB temp max=71.0C power max=512.3W\ngpu: {\"source\":\"nvidia-smi\",\"interval_ms\":1000,\"devices\":[{\"index\":0,\"samples\":[…],…}]}\n<\/code><\/pre>\n<p>Сбор — наилучшее усилие: отсутствие GPU / необходимых утилит логируется одним\nпредупреждением, и запуск продолжается без метрик GPU. Метки времени сэмплов\nделят общую шкалу epoch-мс со строками <code>[stats]<\/code>, поэтому нагрузка и\nсостояние GPU коррелируют напрямую — основной сценарий использования:\nзапуски <a href=\"#/docs/core/llm\"><code>std/llm@v1<\/code><\/a> против локальных серверов моделей. Полное\nруководство: <a href=\"#/docs/core/gpu\">gpu.md<\/a>.<\/p>\n<h2>Реестр метрик (для авторов шагов)<\/h2>\n<p>Реализации шагов объявляют свои метрики в <strong>семействе<\/strong>\n(<code>MetricsFamily<\/code>): наборе <code>MetricDef<\/code> — имя, вид (<code>counter<\/code>, <code>gauge<\/code>,\n<code>histogram<\/code>, <code>rate<\/code>), единица измерения, описание, — регистрируемом глобально\nчерез <code>perfscale_core::metrics::register_family<\/code> рядом с вызовами\n<code>register_action<\/code> семейства. Ядро регистрирует встроенные семейства <code>http<\/code>\n(<code>http_req_duration<\/code>, <code>http_req_failed<\/code>, <code>http_reqs<\/code>, плюс прогресс-шкалы\n<code>perfscale_iterations_completed<\/code> / <code>perfscale_vus<\/code>) и <code>llm<\/code> (<code>llm_ttft_ms<\/code>,\n<code>llm_tokens_per_sec<\/code>, счётчики токенов); проприетарные крейты регистрируют\nсвои так же.<\/p>\n<p>Что даёт реестр:<\/p>\n<ul>\n<li><strong>Каталог<\/strong> — <code>perfscale metrics<\/code> печатает каждую объявленную метрику с\nсемейством, видом, единицей и описанием.<\/li>\n<li><strong>Валидация при свёртке<\/strong> — если шаг выдаёт зарегистрированное имя в\nнеправильной JSON-форме (скаляр там, где семейство объявило <code>histogram<\/code>,\nмассив для скалярного вида), в лог запуска попадает предупреждение с именем\nметрики и семейства. Значение всё равно сворачивается (поведение как для\nнеизвестного имени), так что ошибочный шаг портит только свою метрику, а\nне весь запуск; незарегистрированные имена проходят молча, как раньше.<\/li>\n<li><strong>Точки представления<\/strong> — семейство может добавлять поля в живую строку\n<code>[stats]<\/code> (<code>stats_extras<\/code> — так семейство <code>llm<\/code> добавляет\n<code>llm_reqs<\/code>/<code>llm_tok_s<\/code>) и свой блок в итоговую сводку (<code>summary_lines<\/code> —\nтак семейство <code>http<\/code> рисует тройку <code>http_req_*<\/code>). Семейства без переопределений\nрисуются через общие формы выше, побайтово идентично незарегистрированным\nметрикам.<\/li>\n<li><strong>Фоновые сэмплеры<\/strong> — <code>start_samplers<\/code> вызывается в начале фазы VU для\nметрик, производимых между шагами (например, периодический опрос статистики\nWebRTC в pro-сборках). Встроенные семейства сэмплеров не регистрируют.<\/li>\n<\/ul>\n<p>Полный дизайн — в RFC 010 (<code>rfcs/010-metrics-module.md<\/code>).<\/p>\n<h2><code>--quiet<\/code><\/h2>\n<p>Два независимых слоя:<\/p>\n<ul>\n<li><strong>В источнике<\/strong> (нативный движок): вывод об успешных итерациях — строки\nзапросов, маркеры sleep, прошедшие проверки — даже не форматируется и не\nотправляется. Ошибки, провалившиеся проверки, строки <code>[stats]<\/code> и итоговая\nсводка всегда попадают в поток.<\/li>\n<li><strong>В принтере CLI<\/strong>: при <code>--quiet<\/code> строки stdout выводятся только если это\nстроки сводки в формате k6 (<code>vus<\/code>, <code>iterations<\/code>, <code>http_req_*<\/code>); stderr и\nсистемные строки выводятся всегда. Строки пользовательских метрик и <code>[stats]<\/code>\nостаются в потоке для потребителей логов, но скрываются из консоли.<\/li>\n<\/ul>\n<h2>Пересылка сводки (<code>report<\/code>)<\/h2>\n<p>Укажите запуску экземпляр <code>perfscale serve<\/code>, и строки сводки будут пересланы\nпо завершении запуска:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nreport:\n  url: http://localhost:7999\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml --report http://localhost:7999\n<\/code><\/pre>\n<p>Флаг CLI имеет приоритет над блоком конфига. После запуска CLI отправляет POST\nс собранными строками сводки (только в формате k6) как\n<code>{\"lines\": […]}<\/code> на <code>&lt;url&gt;/api/v1/metrics<\/code> с таймаутом 5 с; проблемы доставки\nлогируются как <code>[report] …<\/code> в stderr и никогда не роняют сам запуск.<\/p>\n<h2>Метрики во время запуска (<code>report.during_run<\/code>)<\/h2>\n<p>Тот же блок <code>report:<\/code> может также стримить метрики <strong>пока запуск ещё идёт<\/strong> —\nкумулятивные снапшоты всех семейств метрик, пакетируемые и отправляемые POST\nна тот же эндпоинт <code>&lt;url&gt;/api/v1/metrics<\/code>:<\/p>\n<pre><code class=\"language-yaml\">report:\n  url: http://localhost:7999\n  during_run: true        # default false — only the end-of-run summary\n  interval_ms: 5000       # snapshot/flush interval, min 100\n  batch_size: 500         # flush a batch once it holds this many samples\n  max_cpu_percent: 90     # CPU gate; 0 disables it\n  max_pending: 24         # soft warn cap — batches are never dropped mid-run\n<\/code><\/pre>\n<p>Движок эмитирует один снапшот на <code>interval_ms<\/code> (независимо от 5-секундного\nрепортёра <code>[stats]<\/code>), а shipper их пакетирует: батч отправляется POST, как\nтолько достигает <code>batch_size<\/code> сэмплов, а всё открытое сбрасывается на каждом\nтике интервала. Каждое тело POST — <code>{samples, seq}<\/code> (плюс <code>taskId<\/code>, если\nвызывающая сторона его задаёт), где <code>seq<\/code> — монотонно возрастающий номер\nбатча, переиспользуемый при повторах — получатели могут дедуплицировать\nповторные доставки.<\/p>\n<p><strong>Именование сэмплов<\/strong> следует соглашениям Prometheus для summary/counter, с\nконвертацией длительностей из миллисекунд движка в <strong>секунды<\/strong>:<\/p>\n<table><thead><tr><th>Метрика движка<\/th><th>Отправляемые сэмплы<\/th><\/tr><\/thead><tbody>\n<tr><td>histogram (<code>http_req_duration<\/code>, <code>db_query_duration<\/code>, …)<\/td><td><code>&lt;name&gt;{quantile=\"0.5\"/\"0.9\"/\"0.95\"/\"0.99\"}<\/code> (секунды), <code>&lt;name&gt;_count<\/code>, <code>&lt;name&gt;_sum<\/code> (секунды)<\/td><\/tr>\n<tr><td>counter (<code>db_rows<\/code>, …)<\/td><td><code>&lt;name&gt;_total<\/code><\/td><\/tr>\n<tr><td>доля ошибок (<code>http_req_failed<\/code>, …)<\/td><td><code>&lt;name&gt;_total<\/code> (вызовы), <code>&lt;name&gt;_failed_total<\/code> (ошибки)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Все значения <strong>кумулятивные с начала запуска<\/strong> — HDR-гистограммы и счётчики\nникогда не сбрасываются во время запуска. Чтобы получить показатели за окно на\nстороне потребителя, вычитайте соседние снапшоты: в стиле\n<code>rate(x_count[window])<\/code> для пропускной способности, <code>Δ_sum / Δ_count<\/code> для\nсредней задержки за окно.<\/p>\n<p><strong>Каждый снапшот также несёт два гейджа прогресса запуска<\/strong>, поэтому запуск,\nшаги которого ещё не записали ни одного сэмпла — например, чистый LLM-запуск\nв ожидании первого 60-секундного завершения — всё равно стримит непустой батч\nкаждый интервал:<\/p>\n<table><thead><tr><th>Отправляемый сэмпл<\/th><th>Значение<\/th><\/tr><\/thead><tbody>\n<tr><td><code>perfscale_iterations_completed<\/code><\/td><td>итерации, начатые с начала запуска (монотонно)<\/td><\/tr>\n<tr><td><code>perfscale_vus<\/code><\/td><td>число активных VU на момент снапшота (настроенное число для фиксированного профиля)<\/td><\/tr>\n<\/tbody><\/table>\n<p><code>perfscale_iterations_completed<\/code> кумулятивен (вычитайте соседние значения для\nскорости итераций за окно); <code>perfscale_vus<\/code> — мгновенный гейдж, отображайте\nкак есть.<\/p>\n<p><strong>Гейджи GPU стримятся тоже<\/strong>, когда в запуске также включено\n<code>gpu.enabled: true<\/code> (см. <a href=\"#/docs/core/gpu\">метрики GPU<\/a>): каждый снапшот несёт сэмплы\nGPU, снятые с момента предыдущего, как мгновенные гейджи с собственными\nметками времени коллектора — отображайте их как есть, без дифференцирования:<\/p>\n<table><thead><tr><th>Отправляемый сэмпл<\/th><th>Метки<\/th><th>Единицы<\/th><\/tr><\/thead><tbody>\n<tr><td><code>gpu_utilization_pct<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>проценты, 0–100<\/td><\/tr>\n<tr><td><code>gpu_memory_used_mib<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>MiB<\/td><\/tr>\n<tr><td><code>gpu_memory_total_mib<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>MiB<\/td><\/tr>\n<tr><td><code>gpu_temperature_c<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>°C<\/td><\/tr>\n<tr><td><code>gpu_power_w<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>ватты<\/td><\/tr>\n<\/tbody><\/table>\n<p>Поля, которые источник сообщил как <code>N/A<\/code>, пропускаются (никогда не отправляются\nкак нули), а дополнительные поля pro-коллектора передаются под собственными\nименами. Без <code>gpu.enabled<\/code> снапшоты вообще не содержат данных GPU.<\/p>\n<p><strong>Защитные стратегии<\/strong> (цикл VU всегда в приоритете; стриминг уступает первым):<\/p>\n<ul>\n<li><em>CPU-гейт<\/em>: пока загрузка CPU хоста (из <code>/proc/stat<\/code>) равна или выше\n<code>max_cpu_percent<\/code>, ожидающие батчи удерживаются — без POST — а входящие\nснапшоты откладываются (ставятся в очередь, каждый десятый логирует\nпредупреждение), затем сбрасываются в порядке поступления, когда гейт\nоткрывается. Вне Linux показаний CPU нет, поэтому гейт бездействует.\n<code>max_cpu_percent: 0<\/code> отключает его.<\/li>\n<li><em>Неограниченный бэклог, мягкий предел<\/em>: запечатанные, но недоставленные\nбатчи никогда не отбрасываются, пока запуск жив; превышение <code>max_pending<\/code>\nлишь логирует предупреждение с ограничением частоты. Доставка возобновляется\nпо порядку, когда цель отвечает.<\/li>\n<li><em>Повторы<\/em>: сетевые ошибки, 5xx и 429 повторяют тот же батч с\nэкспоненциальной задержкой ×2 от 1 с, ограниченной 60 с. Любой другой 4xx\nсчитается ядом — батч отбрасывается и не повторяется.<\/li>\n<li><em>Завершение<\/em>: когда запуск заканчивается, всё ещё ожидающее — включая\nснапшоты, отложенные CPU-гейтом, — сбрасывается с короткими ограниченными\nповторами (1/2/5/10 с), после чего shipper завершается. CLI ждёт этого\nфинального дренажа (ограниченного), чтобы последний батч дошёл до выхода\nпроцесса.<\/li>\n<\/ul>\n<p>Движок никогда не блокируется на стриминге: снапшоты идут через ограниченный\nканал с <code>try_send<\/code>, и полный канал отбрасывает снапшот вместо обратного давления\nна VU — единственное место, где точка может быть потеряна в середине запуска.\nПри отсутствующем или ложном <code>during_run<\/code> нет ни дополнительной задачи, ни\nтрафика канала вовсе.<\/p>\n<p>Замечание по аутентификации: CLI отправляет без аутентификации (как и сводка\nв конце запуска). Аутентифицированный путь — у агента: он запускает тот же\nshipper с провайдером токенов Keycloak и <code>taskId<\/code> (также проставляемым как\nметка <code>task_id<\/code> на каждом сэмпле).<\/p>\n<p><strong>На платформе<\/strong> (perfscale.su или self-hosted controlplane) поток оживляет\nстраницу запуска в реальном времени — квантили задержки, пропускная\nспособность, доля ошибок и кривые GPU рисуются по мере поступления сэмплов.\nАгент подключает всё сам: <code>report.during_run: true<\/code> в конфигурации запуска —\nединственное действие пользователя — он аутентифицирует поток своим машинным\nтокеном и помечает каждый сэмпл <code>task_id<\/code> и <code>machine_id<\/code>. Те же сэмплы питают\nдашборд Metrics, Prometheus-совместимый query API (направьте Grafana на\n<code>/api/v1/integrations/prometheus<\/code>) и Remote Write в ваш собственный\nPrometheus/Mimir.<\/p>\n","slug":"core/metrics","title":"Metrics"},{"group":"core","html_en":"<h1>Pub/Sub load testing<\/h1>\n<p>perfscale drives <strong>pub/sub messaging<\/strong> under load with the native step\nengine: publish message bursts to a subject, wait for matching messages, and\nmeasure both publish throughput and end-to-end (publish → consumed) latency —\nalongside your HTTP/gRPC/WebSocket metrics.<\/p>\n<p>One step = one exchange: (optional) subscribe → (optional) publish →\n(optional) wait for <code>count<\/code> matching messages, bounded by a timeout. When\nboth sides are given the subscription is established <strong>first<\/strong>, so a\nsame-subject roundtrip always sees its own messages.<\/p>\n<p>This page is the guide. Per-step parameters and outputs live in the\n<a href=\"#/docs/core/actions\">actions reference<\/a>.<\/p>\n<h2>Drivers<\/h2>\n<p>The transport is pluggable behind a driver, chosen per step:<\/p>\n<table><thead><tr><th>Driver<\/th><th>Transport<\/th><\/tr><\/thead><tbody>\n<tr><td><code>memory<\/code> (default)<\/td><td>In-process broadcast bus — no broker needed. One channel per subject, shared by all VUs in the process: one VU's publish reaches every VU subscribed to that subject (cross-VU fan-out is a feature, not leakage)<\/td><\/tr>\n<tr><td><code>nats<\/code><\/td><td>A real <a target=\"_blank\" rel=\"noopener\" href=\"https://nats.io\">NATS<\/a> server (core NATS, no JetStream) via <code>async-nats<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<p>Vendor drivers — <strong>Kafka, Redis, MQTT<\/strong> — are a pro capability registered on\nthe same driver seam; their tuning travels in the step's <code>options<\/code> object. An\nunknown <code>driver<\/code> value fails the step with the list of registered drivers, so\nit is always clear which build you are running.<\/p>\n<p>The <code>memory<\/code> bus needs no <code>url<\/code> and no broker — it is the fastest way to\nbuild the test logic, and under load it shows the engine's raw ceiling. Point\nthe same YAML at <code>nats<\/code> (or a pro driver) to add the real broker round trip;\ndiffing the two isolates what the broker costs you.<\/p>\n<h2>Roundtrip in one step<\/h2>\n<p>Publish a burst and wait for it on the same subject — the basic broker\nhealth/latency probe:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: order events roundtrip\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.created\n      publish:\n        - '{\"id\":\"ord-1\",\"total\":42.50}'\n        - '{\"id\":\"ord-2\",\"total\":17.00}'\n      subscribe:\n        count: 2                    # wait for both messages\n        until_contains: '\"id\"'      # each counted message must match\n        timeout_ms: 2000\n    check:\n      body_contains: ord-2\n<\/code><\/pre>\n<p>The step fails on connect failure, publish error, or a subscribe timeout —\nthe error reports how many of <code>count<\/code> arrived and how many the\n<code>until_contains<\/code> matcher rejected. A subscribe shortfall is an assertion\nfailure, not a transport error: the run continues and the failed exchanges\nshow up in <code>pubsub_e2e_ms_failed<\/code>.<\/p>\n<h2>Producer-only load<\/h2>\n<p>Hammer a broker without consuming — success means every publish was accepted:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: produce order events\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://nats.internal:4222\n      subject: orders.created\n      publish:\n        - '{\"id\":\"ord-${seq}\",\"total\":${randf(10,100,2)}}'\n<\/code><\/pre>\n<p>Message payloads interpolate like any other step — <code>${seq}<\/code>,\n<code>${randf(10, 100, 2)}<\/code>, <code>${{ vars.* }}<\/code>, outputs of previous steps — so every\niteration can publish a fresh payload.<\/p>\n<h2>Consumer with assertions<\/h2>\n<p>Subscribe-only is a pure consumer step: wait for a specific event and assert\non the payload. <code>outputs<\/code> exposes <code>published<\/code>, <code>received<\/code>, <code>duration_ms<\/code>, and\n<code>body<\/code> (the newline-joined matched payloads) to later steps:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: await shipment event\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://nats.internal:4222\n      subject: orders.shipped\n      subscribe:\n        count: 1\n        until_contains: '\"id\":\"ord-1\"'\n        timeout_ms: 3000\n    check:\n      body_contains: ord-1\n    outputs: shipment\n<\/code><\/pre>\n<h2>Producer / consumer pair<\/h2>\n<p>The realistic broker pattern: one process generates load, others consume.\nTwo test files share one config; run them concurrently against one broker:<\/p>\n<pre><code class=\"language-yaml\"># producer.yaml\nsteps:\n  - name: produce order events\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.created\n      publish: ['{\"id\":\"ord-${seq}\"}']\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># consumer.yaml — 10 events per iteration or the step fails\nsteps:\n  - name: consume order events\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.created\n      subscribe: { count: 10, until_contains: '\"id\"', timeout_ms: 30000 }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 4\nduration: 30s\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f consumer.yaml -c config.yaml &amp;\nperfscale run -f producer.yaml -c config.yaml\n<\/code><\/pre>\n<p>A consumer that falls behind fails its step on the subscribe timeout — that\nis the signal you are sizing consumers for. (With the <code>memory<\/code> driver the\nsame pair works inside one process: the bus fans out across VUs.)<\/p>\n<h2>Metrics and thresholds<\/h2>\n<p>Every exchange folds into the run summary as custom metrics:<\/p>\n<ul>\n<li><code>pubsub_msgs_published<\/code> — counter (summed over the run); messages\naccepted by the transport. Emitted by every completed exchange, on\nsuccess and on failure (0 for subscribe-only steps). A step that never\nconnected emits no metrics at all.<\/li>\n<li><code>pubsub_msgs_received<\/code> — counter; messages counted toward\n<code>subscribe.count<\/code>. Emitted only when the step has a <code>subscribe<\/code> block.<\/li>\n<li><code>pubsub_e2e_ms<\/code> — HDR histogram in ms (percentiles in the summary); start\nof the publish phase → message consumed, one sample per matched message.\nEmitted only with <code>subscribe<\/code>, and only when at least one message\nmatched. For subscribe-only steps this is the wait time (there is no\npublish to anchor on).<\/li>\n<li><code>pubsub_e2e_ms_failed<\/code> — derived failure rate: one 0/1 sample per\ninvocation that emitted an e2e sample (1 = the step failed, e.g. its\nsubscribe wait fell short of <code>count<\/code>). A wait that matched zero messages\nrecords no sample — see\n<a href=\"#/docs/core/metrics\">metrics.md<\/a> for how the\nderivation works.<\/li>\n<\/ul>\n<p>Gate a run on them with <code>std/thresholds@v1<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  - use: std/thresholds@v1\n    with:\n      pubsub_e2e_ms:\n        - \"p(95)&lt;50\"              # 95% of messages land within 50 ms\n      pubsub_e2e_ms_failed:\n        - \"rate&lt;0.01\"             # fewer than 1% timed-out/failed exchanges\n      pubsub_msgs_received:\n        - \"count&gt;=10000\"          # consumers actually kept up\n<\/code><\/pre>\n<h2>Connection posture<\/h2>\n<p>Every exchange is a full cycle: connect → subscribe → publish → collect →\ndrop. Connections are not pooled across steps or VU iterations — under load\neach VU opens a fresh broker connection per iteration (except <code>memory<\/code>,\nwhich is in-process). That keeps the e2e measurement honest — connect cost is\nincluded — but brokers see real connection churn; size test rates\naccordingly, and prefer <code>duration<\/code>-bounded runs when pointing at a shared\nstaging broker.<\/p>\n<h2>Limits<\/h2>\n<ul>\n<li>The <code>nats<\/code> driver is core NATS: no JetStream persistence, streams, or\nqueue groups — a subscriber that is not connected yet misses messages (the\nstep subscribes first, so same-step roundtrips are safe).<\/li>\n<li><code>until_contains<\/code> is a substring match, not a JSONPath/regex — for\nfield-level assertions read <code>body<\/code> via a <code>std/check@v1<\/code> step.<\/li>\n<li>One subject per step; fan-in across subjects needs one step per subject.<\/li>\n<\/ul>\n","html_ru":"<h1>Нагрузочное тестирование Pub/Sub<\/h1>\n<p>perfscale нагружает <strong>pub/sub-месседжинг<\/strong> через встроенный движок шагов:\nпубликует пачки сообщений в subject, ждёт подходящие сообщения и измеряет\nкак пропускную способность публикации, так и сквозную задержку\n(публикация → получение) — наряду с вашими метриками HTTP/gRPC/WebSocket.<\/p>\n<p>Один шаг = один обмен: (опционально) подписка → (опционально) публикация →\n(опционально) ожидание <code>count<\/code> подходящих сообщений, ограниченное таймаутом.\nКогда заданы обе стороны, подписка устанавливается <strong>первой<\/strong>, поэтому\nкруговой обмен (roundtrip) в пределах одного subject всегда видит свои\nсобственные сообщения.<\/p>\n<p>Эта страница — руководство. Параметры и выходные данные шага описаны в\n<a href=\"#/docs/core/actions\">справочнике действий<\/a>.<\/p>\n<h2>Драйверы<\/h2>\n<p>Транспорт подключается через драйвер, выбираемый для каждого шага:<\/p>\n<table><thead><tr><th>Драйвер<\/th><th>Транспорт<\/th><\/tr><\/thead><tbody>\n<tr><td><code>memory<\/code> (по умолчанию)<\/td><td>Внутрипроцессная шина broadcast — брокер не нужен. Один канал на subject, общий для всех VU в процессе: публикация одного VU доходит до каждого VU, подписанного на этот subject (fan-out между VU — это возможность, а не утечка)<\/td><\/tr>\n<tr><td><code>nats<\/code><\/td><td>Реальный сервер <a target=\"_blank\" rel=\"noopener\" href=\"https://nats.io\">NATS<\/a> (core NATS, без JetStream) через <code>async-nats<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<p>Вендорские драйверы — <strong>Kafka, Redis, MQTT<\/strong> — это pro-capability,\nрегистрируемые на том же драйверном шве; их настройки передаются в объекте\n<code>options<\/code> шага. Неизвестное значение <code>driver<\/code> завершает шаг ошибкой со\nсписком зарегистрированных драйверов, так что всегда понятно, какую сборку\nвы запускаете.<\/p>\n<p>Шине <code>memory<\/code> не нужны ни <code>url<\/code>, ни брокер — это самый быстрый способ\nсобрать логику теста, а под нагрузкой она показывает чистый потолок движка.\nНаправьте тот же YAML на <code>nats<\/code> (или pro-драйвер), чтобы добавить реальный\nкруговой путь через брокер; сравнение двух запусков изолирует цену брокера.<\/p>\n<h2>Круговой обмен в одном шаге<\/h2>\n<p>Публикуем пачку и ждём её на том же subject — базовая проверка здоровья и\nзадержки брокера:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: order events roundtrip\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.created\n      publish:\n        - '{\"id\":\"ord-1\",\"total\":42.50}'\n        - '{\"id\":\"ord-2\",\"total\":17.00}'\n      subscribe:\n        count: 2                    # ждём оба сообщения\n        until_contains: '\"id\"'      # каждое учтённое сообщение должно совпасть\n        timeout_ms: 2000\n    check:\n      body_contains: ord-2\n<\/code><\/pre>\n<p>Шаг падает при ошибке подключения, ошибке публикации или таймауте\nподписки — ошибка сообщает, сколько из <code>count<\/code> сообщений пришло и сколько\nбыло отклонено матчером <code>until_contains<\/code>. Недополучение при подписке — это\nпровал проверки (assertion), а не транспортная ошибка: прогон продолжается,\nа упавшие обмены попадают в <code>pubsub_e2e_ms_failed<\/code>.<\/p>\n<h2>Нагрузка только от продюсера<\/h2>\n<p>Долбим брокер без потребления — успех означает, что каждая публикация была\nпринята:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: produce order events\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://nats.internal:4222\n      subject: orders.created\n      publish:\n        - '{\"id\":\"ord-${seq}\",\"total\":${randf(10,100,2)}}'\n<\/code><\/pre>\n<p>Полезная нагрузка сообщений интерполируется, как в любом другом шаге —\n<code>${seq}<\/code>, <code>${randf(10, 100, 2)}<\/code>, <code>${{ vars.* }}<\/code>, выходы предыдущих\nшагов — так что каждая итерация может публиковать свежую нагрузку.<\/p>\n<h2>Потребитель с проверками<\/h2>\n<p>Шаг только с подпиской — чистый потребитель: ждём конкретное событие и\nпроверяем нагрузку. <code>outputs<\/code> отдаёт последующим шагам <code>published<\/code>,\n<code>received<\/code>, <code>duration_ms<\/code> и <code>body<\/code> (совпавшие нагрузки, склеенные\nпереводами строк):<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: await shipment event\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://nats.internal:4222\n      subject: orders.shipped\n      subscribe:\n        count: 1\n        until_contains: '\"id\":\"ord-1\"'\n        timeout_ms: 3000\n    check:\n      body_contains: ord-1\n    outputs: shipment\n<\/code><\/pre>\n<h2>Пара продюсер / потребитель<\/h2>\n<p>Реалистичный паттерн с брокером: один процесс генерирует нагрузку, другие\nпотребляют. Два тестовых файла используют общий конфиг; запускайте их\nпараллельно против одного брокера:<\/p>\n<pre><code class=\"language-yaml\"># producer.yaml\nsteps:\n  - name: produce order events\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.created\n      publish: ['{\"id\":\"ord-${seq}\"}']\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># consumer.yaml — 10 событий за итерацию, иначе шаг падает\nsteps:\n  - name: consume order events\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.created\n      subscribe: { count: 10, until_contains: '\"id\"', timeout_ms: 30000 }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 4\nduration: 30s\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f consumer.yaml -c config.yaml &amp;\nperfscale run -f producer.yaml -c config.yaml\n<\/code><\/pre>\n<p>Потребитель, который не успевает, роняет свой шаг по таймауту подписки —\nэто тот самый сигнал, по которому вы подбираете размер пула потребителей.\n(С драйвером <code>memory<\/code> та же пара работает внутри одного процесса: шина\nделает fan-out между VU.)<\/p>\n<h2>Метрики и пороги<\/h2>\n<p>Каждый обмен сворачивается в сводку прогона как пользовательские метрики:<\/p>\n<ul>\n<li><code>pubsub_msgs_published<\/code> — счётчик (суммируется за прогон); сообщения,\nпринятые транспортом. Эмитируется каждым завершённым обменом, при успехе\nи при ошибке (0 для шагов только с подпиской). Шаг, не сумевший\nподключиться, не эмитирует метрик вовсе.<\/li>\n<li><code>pubsub_msgs_received<\/code> — счётчик; сообщения, учтённые в\n<code>subscribe.count<\/code>. Эмитируется только когда у шага есть блок <code>subscribe<\/code>.<\/li>\n<li><code>pubsub_e2e_ms<\/code> — HDR-гистограмма в мс (процентили в сводке); начало\nфазы публикации → сообщение обработано, один сэмпл на каждое совпавшее\nсообщение. Эмитируется только с <code>subscribe<\/code> и только когда совпало хотя\nбы одно сообщение. Для шагов только с подпиской это время ожидания (якоря\nв виде публикации нет).<\/li>\n<li><code>pubsub_e2e_ms_failed<\/code> — производная доля ошибок: один сэмпл 0/1 на\nвызов, эмитировавший e2e-сэмпл (1 = шаг упал, например ожидание подписки\nне набрало <code>count<\/code>). Ожидание без единого совпавшего сообщения сэмпла не\nзаписывает — о механике вычисления см.\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<\/ul>\n<p>Проверяйте прогон по ним с помощью <code>std/thresholds@v1<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  - use: std/thresholds@v1\n    with:\n      pubsub_e2e_ms:\n        - \"p(95)&lt;50\"              # 95% сообщений доставляются за 50 мс\n      pubsub_e2e_ms_failed:\n        - \"rate&lt;0.01\"             # менее 1% обменов с таймаутом/ошибкой\n      pubsub_msgs_received:\n        - \"count&gt;=10000\"          # потребители реально успевали\n<\/code><\/pre>\n<h2>Модель подключений<\/h2>\n<p>Каждый обмен — это полный цикл: подключение → подписка → публикация →\nсбор → разрыв. Подключения не переиспользуются между шагами и итерациями\nVU — под нагрузкой каждый VU открывает свежее подключение к брокеру на\nкаждую итерацию (кроме <code>memory<\/code>, который работает внутри процесса). Это\nдержит измерение e2e честным — стоимость подключения включена, — но\nброкеры видят реальный оборот подключений; подбирайте интенсивность теста\nсоответственно и предпочитайте прогоны, ограниченные <code>duration<\/code>, когда\nнаправляете нагрузку на общий staging-брокер.<\/p>\n<h2>Ограничения<\/h2>\n<ul>\n<li>Драйвер <code>nats<\/code> — это core NATS: никакого JetStream, персистентности,\nстримов и очередей — подписчик, который ещё не подключился, пропускает\nсообщения (шаг подписывается первым, поэтому круговые обмены внутри\nшага безопасны).<\/li>\n<li><code>until_contains<\/code> — это совпадение по подстроке, а не JSONPath/regex —\nдля проверок на уровне полей читайте <code>body<\/code> через шаг <code>std/check@v1<\/code>.<\/li>\n<li>Один subject на шаг; fan-in по нескольким subject требует одного шага\nна каждый subject.<\/li>\n<\/ul>\n","slug":"core/pubsub","title":"Pub/Sub load testing"},{"group":"core","html_en":"<h1>Runners<\/h1>\n<p>Four engines, one interface: every runner produces an\n<code>mpsc::Receiver&lt;LogLine&gt;<\/code> that streams output live and closes when the run\nends. Pick one via <code>ExecutionPlan<\/code>.<\/p>\n<h2>Native step engine (<code>step::runner<\/code>)<\/h2>\n<p>Pure Rust, no external binary. <code>run_steps(steps, config, tx)<\/code> runs the step\nlist under one of three load profiles, resolved from the config by\n<code>step::schedule::Schedule<\/code>:<\/p>\n<ul>\n<li><strong>Fixed<\/strong> — <code>vus<\/code> + <code>duration<\/code>: <code>config.vus<\/code> tokio tasks each loop over the\nstep list until the duration expires.<\/li>\n<li><strong>Ramping VUs<\/strong> — <code>stages:<\/code> (k6-style): a supervisor task recomputes the\ntarget VU count every ~100ms by linear interpolation between stage targets\n(the first stage ramps from 0, each next one from the previous target).\nScaling up spawns fresh VU tasks; scaling down flags the newest VUs, which\nfinish their in-flight step and exit at the next step boundary (graceful).\nThe run length is the sum of the stage durations.<\/li>\n<li><strong>Arrival-rate<\/strong> — <code>arrival:<\/code> (open model): a dispatcher computes iteration\nstart instants by inverting the piecewise-linear rate integral and hands\npermits to a worker pool that starts at <code>pre_allocated_vus<\/code> (default 1) and\ngrows lazily to <code>max_vus<\/code>. Unlike the closed VU-loop models, new iterations\nstart on schedule even when the system under test slows down — a permit\nnobody can serve (pool saturated at <code>max_vus<\/code>) is dropped, counted in the\n<code>dropped_iterations<\/code> summary metric, and logged at most once per 5s. The\ncounter is emitted even at 0, so <code>std/thresholds@v1<\/code> gates like\n<code>dropped_iterations: [\"count==0\"]<\/code> resolve on clean runs instead of\nerroring on an unknown metric.<\/li>\n<\/ul>\n<p>For staged/arrival runs the summary's <code>vus<\/code> line reports the <em>observed<\/em>\nconcurrency — <code>vus....................: &lt;last&gt; min=&lt;min&gt; max=&lt;max&gt;<\/code> — and the\nperiodic <code>[stats]<\/code> line gains a trailing <code>vus=N<\/code> with the live count. Fixed\nruns keep the historical formats unchanged.<\/p>\n<ul>\n<li>Per-VU <code>Context<\/code> — step outputs and <code>${{ }}<\/code> interpolation are isolated\nbetween VUs, persistent across iterations of the same VU<\/li>\n<\/ul>\n<h3>Exit marker on agent streams<\/h3>\n<p>When a run executes through the machine agent (<code>perfscaled<\/code>), every engine's\nlog stream ends with exactly one system line after all engine output:<\/p>\n<pre><code>[sys] __perfscale_exit__=&lt;code|signal|unknown&gt;\n<\/code><\/pre>\n<ul>\n<li><code>code<\/code> — the engine's exit code (<code>0<\/code> = success; the native engine reports\n<code>1<\/code> for a violated <code>severity: fail<\/code> thresholds gate or an invalid load\nprofile)<\/li>\n<li><code>signal<\/code> — the engine process was killed by a signal (e.g. OOM killer)<\/li>\n<li><code>unknown<\/code> — the exit code could not be determined<\/li>\n<\/ul>\n<p>Consumers should treat the marker as the authoritative run result: stderr\nnoise (for example k6 <code>console.log<\/code>) does <strong>not<\/strong> mean failure when the exit\ncode is <code>0<\/code>. Consumers older than agent <code>0.3.6<\/code> see no marker and fall back\nto heuristics; older consumers reading a new agent's stream simply print the\nline as a regular system message.<\/p>\n<ul>\n<li>HTTP timings from <code>std/http@v1<\/code> feed the shared metrics; other actions\n(WebSocket, gRPC, TCP/UDP) contribute counters and latency histograms\n(e.g. <code>ws_msg_rtt<\/code>, <code>grpc_req_duration<\/code>) through the same collector<\/li>\n<li>Ends with the k6-compatible summary block + <code>Done — Xs wall clock<\/code><\/li>\n<li><code>vus: 0<\/code> is clamped to 1; duration strings parse via <code>parse_duration_ms<\/code>\n(<code>\"90\"<\/code>, <code>\"500ms\"<\/code>, <code>\"1.5s\"<\/code>, <code>\"1m30s\"<\/code>, <code>\"1h\"<\/code> — millisecond resolution,\nminimum 1ms). Stage durations are validated\nstrictly: unparseable or zero lengths fail the run (and <code>perfscale lint<\/code>)\nwith a clear error, as do <code>stages<\/code> combined with <code>arrival<\/code>, and <code>arrival<\/code>\nwithout <code>max_vus &gt;= 1<\/code><\/li>\n<\/ul>\n<h2>k6 (<code>runner::k6<\/code>)<\/h2>\n<p>Wraps an existing <code>k6<\/code> install:<\/p>\n<ol>\n<li>the script is written to <code>$TMPDIR/perfscale-&lt;uuid&gt;.js<\/code><\/li>\n<li><code>k6 run --no-color &lt;script&gt;<\/code> is spawned with piped stdio<\/li>\n<li>stdout/stderr stream as <code>LogLine<\/code>s; the temp file is removed on exit<\/li>\n<\/ol>\n<p>Two modes:<\/p>\n<table><thead><tr><th>Function<\/th><th>Returns<\/th><th>Use<\/th><\/tr><\/thead><tbody>\n<tr><td><code>run_streaming(script)<\/code><\/td><td><code>Receiver&lt;LogLine&gt;<\/code><\/td><td>live output<\/td><\/tr>\n<tr><td><code>run_oneshot(script)<\/code><\/td><td><code>RunResult { exit_code, success, stdout, stderr, script }<\/code><\/td><td>collect-then-inspect<\/td><\/tr>\n<\/tbody><\/table>\n<p>Load configuration (VUs, stages, thresholds) belongs in the script's own\n<code>options<\/code> block — perfscale does not inject k6 flags.<\/p>\n<p>Missing binary → <code>k6 not found in PATH — install from https://k6.io/...<\/code>.<\/p>\n<h2>locust (<code>runner::locust<\/code>)<\/h2>\n<p>Wraps an existing <code>locust<\/code> install in headless mode:<\/p>\n<pre><code class=\"language-text\">locust -f &lt;script&gt; --headless -u &lt;users&gt; -r &lt;spawn_rate&gt; -t &lt;duration&gt; --csv &lt;tmp-prefix&gt; [--host &lt;host&gt;]\n<\/code><\/pre>\n<p><code>LocustOpts { users, spawn_rate, duration, host }<\/code> maps from a generic\n<code>RunConfig<\/code> via <code>LocustOpts::from_run_config<\/code> (vus → users and spawn_rate).<\/p>\n<p>While running, locust's own stdout/stderr stream through. After exit, the\nrunner parses the <code>Aggregated<\/code> row of <code>&lt;prefix&gt;_stats.csv<\/code> and emits the same\nsummary block the other engines produce:<\/p>\n<pre><code class=\"language-text\">http_req_duration......: avg=42.50ms p(50)=40ms p(90)=60ms p(95)=68ms p(99)=85ms min=10ms max=120ms\nhttp_req_failed........: 2.00%\nhttp_reqs..............: 100 10.50/s\n<\/code><\/pre>\n<p>Temp CSV files (<code>_stats<\/code>, <code>_stats_history<\/code>, <code>_failures<\/code>, <code>_exceptions<\/code>) are\ncleaned up afterwards. A missing/short CSV yields a <code>system<\/code> line\n(<code>failed to read locust stats: ...<\/code>) rather than an error — the process\noutput has already been streamed.<\/p>\n<p>Missing binary → <code>locust not found in PATH — install with pip install locust<\/code>.<\/p>\n<h2>JMeter (<code>runner::jmeter<\/code>)<\/h2>\n<p>Wraps an existing <code>jmeter<\/code> install in non-GUI mode:<\/p>\n<pre><code class=\"language-text\">jmeter -n -t &lt;plan.jmx&gt;\n<\/code><\/pre>\n<p>The plan owns the whole load shape (thread groups, timers, throughput) —\nperfscale passes no <code>-J<\/code> properties and no perfscale config applies. While\nrunning, jmeter's own stdout/stderr stream through. After exit, the final\nconsole line (<code>summary = N in HH:MM:SS = R/s Avg: .. Min: .. Max: .. Err: .. (E%)<\/code>) is translated into the k6-compatible summary block:<\/p>\n<pre><code class=\"language-text\">http_req_duration......: avg=4.00ms min=1.00ms max=42.00ms\nhttp_req_failed........: 0.25%\nhttp_reqs..............: 1200 80.0/s\n<\/code><\/pre>\n<p>What JMeter does <strong>not<\/strong> get: the console summary carries no percentiles, so\nthe translated duration line has <code>avg<\/code>/<code>min<\/code>/<code>max<\/code> only; there are no\nperfscale <code>std/thresholds@v1<\/code> gates over jmeter runs (exit code is the CI\ngate — jmeter exits non-zero on plan/startup errors); and <code>.jtl<\/code> result files\nare not parsed (throughput parsing of <code>.jtl<\/code> is future work).<\/p>\n<p>Missing binary → <code>jmeter not found in PATH — install from https://jmeter.apache.org/download_jmeter.cgi (requires a JRE)<\/code>.<\/p>\n<h2>Choosing an engine<\/h2>\n<table><thead><tr><th><\/th><th>native<\/th><th>k6<\/th><th>locust<\/th><th>JMeter<\/th><\/tr><\/thead><tbody>\n<tr><td>Install needed<\/td><td>none<\/td><td>k6 binary<\/td><td>python + locust<\/td><td>JRE + jmeter<\/td><\/tr>\n<tr><td>Scenario language<\/td><td>YAML steps<\/td><td>JavaScript<\/td><td>Python<\/td><td><code>.jmx<\/code> test plan (XML)<\/td><\/tr>\n<tr><td>Scripting power<\/td><td>low (4 actions)<\/td><td>high<\/td><td>high<\/td><td>high<\/td><\/tr>\n<tr><td>Load model<\/td><td>fixed VUs, ramping <code>stages:<\/code>, or arrival-rate<\/td><td>stages/thresholds/scenarios<\/td><td>users/spawn-rate<\/td><td>thread groups/timers (in the plan)<\/td><\/tr>\n<tr><td>Best for<\/td><td>smoke tests, CI gates, simple API flows<\/td><td>complex k6 suites you already have<\/td><td>python-centric teams<\/td><td>existing JMeter suites<\/td><\/tr>\n<\/tbody><\/table>\n","html_ru":"<h1>Раннеры<\/h1>\n<p>Четыре движка, один интерфейс: каждый раннер возвращает\n<code>mpsc::Receiver&lt;LogLine&gt;<\/code>, который потоково отдаёт вывод в реальном времени и\nзакрывается по завершении прогона. Выбор движка задаётся через <code>ExecutionPlan<\/code>.<\/p>\n<h2>Нативный движок шагов (<code>step::runner<\/code>)<\/h2>\n<p>Чистый Rust, без внешних бинарников. <code>run_steps(steps, config, tx)<\/code> выполняет\nсписок шагов под одним из трёх профилей нагрузки, который вычисляется из\nконфигурации через <code>step::schedule::Schedule<\/code>:<\/p>\n<ul>\n<li><strong>Fixed<\/strong> — <code>vus<\/code> + <code>duration<\/code>: <code>config.vus<\/code> задач tokio, каждая из которых\nциклически выполняет список шагов, пока не истечёт длительность.<\/li>\n<li><strong>Ramping VUs<\/strong> — <code>stages:<\/code> (в стиле k6): задача-супервизор каждые ~100 мс\nпересчитывает целевое число VU линейной интерполяцией между целями ступеней\n(первая ступень наращивает с 0, каждая следующая — от предыдущей цели).\nПри увеличении нагрузки порождаются новые задачи VU; при уменьшении\nпомечаются самые новые VU, которые завершают текущий шаг и выходят на\nближайшей границе шага (плавная остановка). Длительность прогона равна сумме\nдлительностей ступеней.<\/li>\n<li><strong>Arrival-rate<\/strong> — <code>arrival:<\/code> (открытая модель): диспетчер вычисляет моменты\nстарта итераций, обращая кусочно-линейный интеграл интенсивности, и выдаёт\nразрешения пулу воркеров, который стартует с <code>pre_allocated_vus<\/code> (по\nумолчанию 1) и лениво растёт до <code>max_vus<\/code>. В отличие от закрытых моделей с\nциклом VU, новые итерации стартуют по расписанию, даже когда тестируемая\nсистема замедляется — разрешение, которое некому обслужить (пул насыщен до\n<code>max_vus<\/code>), отбрасывается, учитывается в сводной метрике\n<code>dropped_iterations<\/code> и логируется не чаще одного раза в 5 с. Счётчик\nвыводится даже при значении 0, поэтому гейты <code>std/thresholds@v1<\/code> вида\n<code>dropped_iterations: [\"count==0\"]<\/code> корректно срабатывают на чистых прогонах,\nа не падают с ошибкой о неизвестной метрике.<\/li>\n<\/ul>\n<p>Для прогонов со ступенями/arrival строка <code>vus<\/code> в сводке показывает\n<em>наблюдаемый<\/em> параллелизм — <code>vus....................: &lt;last&gt; min=&lt;min&gt; max=&lt;max&gt;<\/code> —\nа периодическая строка <code>[stats]<\/code> дополняется хвостом <code>vus=N<\/code> с текущим\nзначением. Прогоны Fixed сохраняют исторические форматы без изменений.<\/p>\n<ul>\n<li><code>Context<\/code> на каждый VU — выводы шагов и интерполяция <code>${{ }}<\/code> изолированы\nмежду VU и сохраняются между итерациями одного VU<\/li>\n<\/ul>\n<h3>Маркер завершения в потоках агента<\/h3>\n<p>Когда прогон выполняется через машинного агента (<code>perfscaled<\/code>), поток логов\nкаждого движка завершается ровно одной системной строкой после всего вывода\nдвижка:<\/p>\n<pre><code>[sys] __perfscale_exit__=&lt;code|signal|unknown&gt;\n<\/code><\/pre>\n<ul>\n<li><code>code<\/code> — код завершения движка (<code>0<\/code> = успех; нативный движок возвращает\n<code>1<\/code> при нарушенном гейте порогов <code>severity: fail<\/code> или при некорректном\nпрофиле нагрузки)<\/li>\n<li><code>signal<\/code> — процесс движка был завершён сигналом (например, OOM killer)<\/li>\n<li><code>unknown<\/code> — код завершения определить не удалось<\/li>\n<\/ul>\n<p>Потребителям следует считать маркер авторитетным результатом прогона: шум в\nstderr (например, k6 <code>console.log<\/code>) <strong>не<\/strong> означает неудачу, если код\nзавершения равен <code>0<\/code>. Потребители старше агента <code>0.3.6<\/code> не видят маркера и\nвозвращаются к эвристикам; старые потребители, читающие поток нового агента,\nпросто выводят эту строку как обычное системное сообщение.<\/p>\n<ul>\n<li>Тайминги HTTP из <code>std/http@v1<\/code> питают общие метрики; другие действия\n(WebSocket, gRPC, TCP/UDP) вносят счётчики и гистограммы задержек\n(например, <code>ws_msg_rtt<\/code>, <code>grpc_req_duration<\/code>) через тот же коллектор<\/li>\n<li>Завершается k6-совместимым блоком сводки + <code>Done — Xs wall clock<\/code><\/li>\n<li><code>vus: 0<\/code> приводится к 1; строки длительности парсятся через\n<code>parse_duration_ms<\/code> (<code>\"90\"<\/code>, <code>\"500ms\"<\/code>, <code>\"1.5s\"<\/code>, <code>\"1m30s\"<\/code>, <code>\"1h\"<\/code> —\nразрешение в миллисекундах, минимум 1 мс). Длительности ступеней\nпроверяются строго: непарсящиеся или нулевые значения завершают прогон\n(и <code>perfscale lint<\/code>) с понятной ошибкой, так же как и сочетание <code>stages<\/code> с\n<code>arrival<\/code>, и <code>arrival<\/code> без <code>max_vus &gt;= 1<\/code><\/li>\n<\/ul>\n<h2>k6 (<code>runner::k6<\/code>)<\/h2>\n<p>Обёртка вокруг существующей установки <code>k6<\/code>:<\/p>\n<ol>\n<li>скрипт записывается в <code>$TMPDIR/perfscale-&lt;uuid&gt;.js<\/code><\/li>\n<li>запускается <code>k6 run --no-color &lt;script&gt;<\/code> с перенаправленными stdio<\/li>\n<li>stdout/stderr стримятся как <code>LogLine<\/code>; временный файл удаляется на выходе<\/li>\n<\/ol>\n<p>Два режима:<\/p>\n<table><thead><tr><th>Функция<\/th><th>Возвращает<\/th><th>Применение<\/th><\/tr><\/thead><tbody>\n<tr><td><code>run_streaming(script)<\/code><\/td><td><code>Receiver&lt;LogLine&gt;<\/code><\/td><td>вывод в реальном времени<\/td><\/tr>\n<tr><td><code>run_oneshot(script)<\/code><\/td><td><code>RunResult { exit_code, success, stdout, stderr, script }<\/code><\/td><td>сначала собрать, потом проверить<\/td><\/tr>\n<\/tbody><\/table>\n<p>Конфигурация нагрузки (VU, ступени, пороги) задаётся в собственном блоке\n<code>options<\/code> скрипта — perfscale не подставляет флаги k6.<\/p>\n<p>Отсутствующий бинарник → <code>k6 not found in PATH — install from https://k6.io/...<\/code>.<\/p>\n<h2>locust (<code>runner::locust<\/code>)<\/h2>\n<p>Обёртка вокруг существующей установки <code>locust<\/code> в headless-режиме:<\/p>\n<pre><code class=\"language-text\">locust -f &lt;script&gt; --headless -u &lt;users&gt; -r &lt;spawn_rate&gt; -t &lt;duration&gt; --csv &lt;tmp-prefix&gt; [--host &lt;host&gt;]\n<\/code><\/pre>\n<p><code>LocustOpts { users, spawn_rate, duration, host }<\/code> маппится из общего\n<code>RunConfig<\/code> через <code>LocustOpts::from_run_config<\/code> (vus → users и spawn_rate).<\/p>\n<p>Во время прогона собственные stdout/stderr locust стримятся напрямую. После\nвыхода раннер парсит строку <code>Aggregated<\/code> из <code>&lt;prefix&gt;_stats.csv<\/code> и выводит тот\nже блок сводки, что и остальные движки:<\/p>\n<pre><code class=\"language-text\">http_req_duration......: avg=42.50ms p(50)=40ms p(90)=60ms p(95)=68ms p(99)=85ms min=10ms max=120ms\nhttp_req_failed........: 2.00%\nhttp_reqs..............: 100 10.50/s\n<\/code><\/pre>\n<p>Временные CSV-файлы (<code>_stats<\/code>, <code>_stats_history<\/code>, <code>_failures<\/code>, <code>_exceptions<\/code>)\nудаляются после завершения. Отсутствующий или усечённый CSV даёт строку\n<code>system<\/code> (<code>failed to read locust stats: ...<\/code>), а не ошибку — вывод процесса\nуже был отстримлен.<\/p>\n<p>Отсутствующий бинарник → <code>locust not found in PATH — install with pip install locust<\/code>.<\/p>\n<h2>JMeter (<code>runner::jmeter<\/code>)<\/h2>\n<p>Обёртка вокруг существующей установки <code>jmeter<\/code> в не-GUI режиме:<\/p>\n<pre><code class=\"language-text\">jmeter -n -t &lt;plan.jmx&gt;\n<\/code><\/pre>\n<p>План полностью определяет форму нагрузки (группы потоков, таймеры,\nпропускная способность) — perfscale не передаёт свойства <code>-J<\/code>, и никакая\nконфигурация perfscale не применяется. Во время прогона собственные\nstdout/stderr jmeter стримятся напрямую. После выхода финальная консольная\nстрока (<code>summary = N in HH:MM:SS = R/s Avg: .. Min: .. Max: .. Err: .. (E%)<\/code>) переводится в k6-совместимый блок сводки:<\/p>\n<pre><code class=\"language-text\">http_req_duration......: avg=4.00ms min=1.00ms max=42.00ms\nhttp_req_failed........: 0.25%\nhttp_reqs..............: 1200 80.0/s\n<\/code><\/pre>\n<p>Чего у JMeter <strong>нет<\/strong>: консольная сводка не содержит перцентилей, поэтому в\nпереведённой строке длительности есть только <code>avg<\/code>/<code>min<\/code>/<code>max<\/code>; для прогонов\njmeter нет гейтов perfscale <code>std/thresholds@v1<\/code> (гейтом для CI служит код\nзавершения — jmeter завершается с ненулевым кодом при ошибках плана или\nзапуска); файлы результатов <code>.jtl<\/code> не парсятся (парсинг пропускной\nспособности из <code>.jtl<\/code> — задача на будущее).<\/p>\n<p>Отсутствующий бинарник → <code>jmeter not found in PATH — install from https://jmeter.apache.org/download_jmeter.cgi (requires a JRE)<\/code>.<\/p>\n<h2>Выбор движка<\/h2>\n<table><thead><tr><th><\/th><th>native<\/th><th>k6<\/th><th>locust<\/th><th>JMeter<\/th><\/tr><\/thead><tbody>\n<tr><td>Требуется установка<\/td><td>не нужна<\/td><td>бинарник k6<\/td><td>python + locust<\/td><td>JRE + jmeter<\/td><\/tr>\n<tr><td>Язык сценариев<\/td><td>шаги YAML<\/td><td>JavaScript<\/td><td>Python<\/td><td>тест-план <code>.jmx<\/code> (XML)<\/td><\/tr>\n<tr><td>Возможности скриптинга<\/td><td>низкие (4 действия)<\/td><td>высокие<\/td><td>высокие<\/td><td>высокие<\/td><\/tr>\n<tr><td>Модель нагрузки<\/td><td>фиксированные VU, <code>stages:<\/code> с ростом или arrival-rate<\/td><td>stages/thresholds/scenarios<\/td><td>users/spawn-rate<\/td><td>группы потоков/таймеры (в плане)<\/td><\/tr>\n<tr><td>Лучше всего для<\/td><td>смоук-тесты, гейты CI, простые API-сценарии<\/td><td>сложные наборы k6, которые у вас уже есть<\/td><td>команды с фокусом на Python<\/td><td>существующие наборы JMeter<\/td><\/tr>\n<\/tbody><\/table>\n","slug":"core/runners","title":"Runners"},{"group":"core","html_en":"<h1>Setup and teardown<\/h1>\n<p>A native run is more than the VU loop. The config file can bracket the load\nwith one-time steps: <code>before:<\/code> prepares the world (fetch a token, start a\nlocal server), <code>after:<\/code> tears it down — on every exit path.<\/p>\n<h2>Run lifecycle<\/h2>\n<pre><code class=\"language-text\">before steps (once, in order, fail-fast)\n      │\n      ▼\nVU loop (steps × iterations until duration expires)\n      │\n      ▼\nafter steps (once, best-effort)          ← runs on EVERY exit path:\n      │                                    normal finish, failed run,\n      ▼                                    failed before, Ctrl-C/SIGTERM\nauto-kill of remaining managed processes\n      │\n      ▼\nsummary\n<\/code><\/pre>\n<ul>\n<li><code>before:<\/code> steps run <strong>once<\/strong>, in order, before any VU is spawned. If any of\nthem fails, the run aborts before spawning VUs (<code>Setup failed, aborting run: …<\/code>) — a broken setup would make every iteration fail identically.<\/li>\n<li><code>after:<\/code> steps run <strong>always<\/strong>: after a normal finish, after a failed run,\nafter a failed <code>before:<\/code> (a setup step may already have started something\nthe teardown exists to clean up), and after Ctrl-C/SIGTERM. Unlike\n<code>before:<\/code>, a failing teardown step is logged\n(<code>teardown step '&lt;name&gt;' failed (continuing)<\/code>) and the remaining steps\nstill run — partial cleanup beats none.<\/li>\n<li>After the teardown, every managed process still alive in the run's\nregistry is <strong>stopped automatically<\/strong> (SIGTERM, escalated to SIGKILL after\na grace period, whole process group). A forgotten <code>kill_process<\/code> never\nleaks a server.<\/li>\n<li>Besides cleanup, <code>after:<\/code> is where run-level SLO gates live: a\n<code>std/thresholds@v1<\/code> step sees everything the run collected and gates the\nexit code on it (see <a href=\"#/docs/core/actions\">actions.md<\/a>).<\/li>\n<li>The metric summary prints last.<\/li>\n<\/ul>\n<h2>Data flow: <code>vars.*<\/code> and <code>config.*<\/code><\/h2>\n<p>Two config blocks feed the steps:<\/p>\n<table><thead><tr><th>Block<\/th><th>Exposed as<\/th><th>Visible to<\/th><\/tr><\/thead><tbody>\n<tr><td><code>variables:<\/code><\/td><td><code>${{ vars.&lt;key&gt; }}<\/code><\/td><td><code>before<\/code> steps, test steps, <code>after<\/code> steps<\/td><\/tr>\n<tr><td><code>before:<\/code> step <code>outputs<\/code><\/td><td><code>${{ config.&lt;name&gt;.&lt;field&gt; }}<\/code><\/td><td>test steps and <code>after<\/code> steps<\/td><\/tr>\n<\/tbody><\/table>\n<pre><code class=\"language-yaml\">variables:\n  region: eu-west\n\nbefore:\n  - uses: std/http@v1\n    with:\n      url: \"https://api.example.com/token?region=${{ vars.region }}\"\n    outputs: auth            # → ${{ config.auth.status }} etc. later on\n<\/code><\/pre>\n<ul>\n<li>A <code>before<\/code> step sees <code>${{ vars.* }}<\/code> and the outputs of <strong>earlier<\/strong> setup\nsteps (each under its own <code>outputs<\/code> name).<\/li>\n<li>Test steps see <code>config.*<\/code> and <code>vars.*<\/code> — but never each other's outputs\nacross VUs (per-VU contexts are independent).<\/li>\n<li><code>after<\/code> steps see the same <code>config.*<\/code> and <code>vars.*<\/code> as test steps did, so a\nteardown step can reference exactly what the test referenced.<\/li>\n<li>Interpolation always yields a <strong>string<\/strong>: a numeric output like\n<code>${{ config.keeper.port }}<\/code> reaches the action as <code>\"8080\"<\/code>. Actions that\ntake numbers accept the string form.<\/li>\n<\/ul>\n<h2>What does not work in <code>before:<\/code><\/h2>\n<p>Live connections (<code>std/ws-connect@v1<\/code>, <code>std/grpc-connect@v1<\/code> and the stream\nfamily) are scoped to the context that created them. The setup context is\ngone before the first VU starts, so a connection opened in <code>before:<\/code> is dead\nby the time a test step asks for its id — open connections per VU iteration\ninstead (they are drained at iteration end).<\/p>\n<p>Processes are the exception: <code>std/child_process@v1<\/code> registers its child in a\n<strong>run-scoped<\/strong> registry, which is exactly why a server started in <code>before:<\/code>\nstays alive and killable for the whole run.<\/p>\n<h2>Background processes end to end<\/h2>\n<p>The canonical setup/teardown pair: start a local service in <code>before:<\/code>, hit\nit from the test, stop it in <code>after:<\/code>. Here a \"position keeper\" mock for a\nCFD-trading scenario:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 20\nduration: 5m\nallow_process_actions: true        # fail-closed gate, default false\n\nbefore:\n  - name: position-keeper\n    uses: std/child_process@v1\n    with:\n      command: python3\n      args: [\"-m\", \"http.server\", \"8080\"]\n      port: 8080                   # echoed to outputs; port: 0 auto-assigns\n      waitUntil:                   # block the step until the server is ready\n        port_open: 8080\n        timeout: 15s\n      restart: on-failure          # supervisor restarts crashes (max 3, 1s apart)\n    outputs: keeper                # → ${{ config.keeper.port }} etc.\n\nafter:\n  - name: stop-keeper\n    uses: std/kill_process@v1\n    with:\n      name: keeper                 # registry lookup — always the current pid\n      signal: TERM\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - uses: std/http@v1\n    with:\n      url: \"http://127.0.0.1:${{ config.keeper.port }}/positions\"\n    check:\n      status: 200\n<\/code><\/pre>\n<p>What happens underneath:<\/p>\n<ul>\n<li><strong>Streaming<\/strong>: the child's stdout/stderr stream into the run log with a\n<code>position-keeper: <\/code> prefix (same shape as the k6 runner) and accumulate in\nbounded tail buffers (64 KiB per stream by default, <code>buffer_kb<\/code> to tune).<\/li>\n<li><strong>Supervision<\/strong>: with <code>restart: on-failure<\/code> (or <code>always<\/code>), a supervisor\ntask watches the child and respawns it after <code>backoff_ms<\/code> (default 1000),\nup to <code>max_restarts<\/code> (default 3) times, logging each restart.<\/li>\n<li><strong>Outputs are a snapshot<\/strong>:\n<code>{ pid, ppid, pgid, port, stdout, stderr, restart_count }<\/code>. <code>ppid<\/code> is\nperfscale itself; <code>pgid<\/code> is the child's process group. After a restart the\nstored <code>pid<\/code> is stale — which is why <code>std/kill_process@v1<\/code> should address\nthe process by <code>name<\/code> (the step name or the <code>outputs<\/code> name): the registry\nlookup always resolves the <em>current<\/em> pid. <code>pid:<\/code> (raw OS pid) exists as a\nbest-effort escape hatch for processes outside the registry.<\/li>\n<li><strong>Auto-kill<\/strong>: even without the <code>after:<\/code> step, the keeper would be stopped\nwhen the run ends. The explicit <code>kill_process<\/code> is about a clean, timely\nstop — and about being able to assert on it.<\/li>\n<\/ul>\n<p>See <a href=\"#/docs/core/actions\"><code>std/child_process@v1<\/code><\/a> and\n<a href=\"#/docs/core/actions\"><code>std/kill_process@v1<\/code><\/a> for the full parameter\nreferences, and\n<a href=\"../examples/with-processes.config.yaml\">examples/with-processes.config.yaml<\/a>\nfor a runnable variant.<\/p>\n<h2>waitUntil — readiness gates<\/h2>\n<p>A <code>child_process<\/code> step blocks until the process is ready (or the gate times\nout). Two forms:<\/p>\n<pre><code class=\"language-yaml\"># Object form — all listed matchers must hold:\nwaitUntil:\n  stdout_contains: \"Serving HTTP\"    # substring in captured stdout\n  stderr_contains: \"listening\"       # substring in captured stderr\n  stdout_matches: \"on port \\\\d+\"     # regex against captured stdout\n  stderr_matches: \"err\\\\d+\"          # regex against captured stderr\n  port_open: 8080                    # TCP connect to 127.0.0.1:&lt;port&gt; works;\n                                     # 0 = the step's own `port`\n  timeout: 15s                       # duration string, default 30s\n  on_timeout: fail                   # fail (default) | continue\n\n# String form — one matcher, defaults for the rest:\nwaitUntil: 'contains(stdout, \"Serving HTTP\")'\nwaitUntil: 'matches(stderr, \"err\\\\d+\")'\nwaitUntil: 'port_open(8080)'\n<\/code><\/pre>\n<ul>\n<li>With <code>on_timeout: fail<\/code> an unmet gate fails the step (and therefore the\nrun when used in <code>before:<\/code>); <code>continue<\/code> logs the miss and proceeds anyway.<\/li>\n<li>A process that <strong>exits before becoming ready<\/strong> fails the step immediately\nwith its exit code and an stderr tail — no waiting out the timeout.<\/li>\n<\/ul>\n<h2>Interrupts (SIGINT / SIGTERM)<\/h2>\n<p>Two-stage semantics:<\/p>\n<ul>\n<li><strong>First<\/strong> SIGINT (Ctrl-C) or SIGTERM: the VU loop stops between steps, and\nthe run proceeds through the normal teardown — <code>after:<\/code> steps, process\nauto-kill, summary. A log line announces it:\n<code>Interrupt received — stopping load, running teardown (interrupt again to force-quit)<\/code>.<\/li>\n<li><strong>Second<\/strong> signal: immediate <code>exit(130)<\/code> — teardown itself may be wedged,\nand the operator clearly wants out. Anything not yet stopped by then may\nleak, so prefer waiting out the first stage.<\/li>\n<\/ul>\n<h2>Safety and portability<\/h2>\n<ul>\n<li><strong>Fail-closed gate<\/strong>: both process actions fail with\n<code>process actions disabled (allow_process_actions is false)<\/code> unless the\nconfig opts in with <code>allow_process_actions: true<\/code> — a step list from an\nuntrusted source cannot spawn or signal OS processes. The same pattern as\n<code>allow_file_actions<\/code> for the file actions.<\/li>\n<li><strong>Process groups (unix)<\/strong>: every child leads its own process group\n(<code>pgid == pid<\/code>), so a <code>tree: true<\/code> kill signals exactly the child's group —\nit can never hit perfscale or its parent.<\/li>\n<li><strong>Non-unix<\/strong>: there are no POSIX signals or process groups.\n<code>std/kill_process@v1<\/code> by <code>name<\/code> terminates the direct child only (<code>tree<\/code>\nhas no effect); <code>pid:<\/code> is unsupported. Everything else — capture, restart\nsupervision, <code>waitUntil<\/code>, auto-kill — works the same.<\/li>\n<\/ul>\n","html_ru":"<h1>Setup и teardown<\/h1>\n<p>Нативный запуск — это не только цикл VU. Конфигурационный файл может обрамлять\nнагрузку одноразовыми шагами: <code>before:<\/code> подготавливает окружение (получить\nтокен, запустить локальный сервер), <code>after:<\/code> очищает его — на любом пути\nзавершения.<\/p>\n<h2>Жизненный цикл запуска<\/h2>\n<pre><code class=\"language-text\">before steps (once, in order, fail-fast)\n      │\n      ▼\nVU loop (steps × iterations until duration expires)\n      │\n      ▼\nafter steps (once, best-effort)          ← runs on EVERY exit path:\n      │                                    normal finish, failed run,\n      ▼                                    failed before, Ctrl-C/SIGTERM\nauto-kill of remaining managed processes\n      │\n      ▼\nsummary\n<\/code><\/pre>\n<ul>\n<li>Шаги <code>before:<\/code> выполняются <strong>один раз<\/strong>, по порядку, до создания любого VU.\nЕсли какой-либо из них завершается с ошибкой, запуск прерывается до создания\nVU (<code>Setup failed, aborting run: …<\/code>) — сломанная подготовка привела бы к\nодинаковому провалу каждой итерации.<\/li>\n<li>Шаги <code>after:<\/code> выполняются <strong>всегда<\/strong>: после нормального завершения, после\nнеудачного запуска, после неудачного <code>before:<\/code> (шаг подготовки мог уже\nзапустить что-то, что teardown как раз и существует, чтобы убрать) и после\nCtrl-C/SIGTERM. В отличие от <code>before:<\/code>, неудачный шаг очистки логируется\n(<code>teardown step '&lt;name&gt;' failed (continuing)<\/code>), а оставшиеся шаги всё равно\nвыполняются — частичная очистка лучше, чем никакой.<\/li>\n<li>После teardown каждый управляемый процесс, всё ещё живой в реестре запуска,\n<strong>останавливается автоматически<\/strong> (SIGTERM с эскалацией до SIGKILL после\nпериода ожидания, вся группа процессов). Забытый <code>kill_process<\/code> никогда не\nприводит к утечке сервера.<\/li>\n<li>Помимо очистки, в <code>after:<\/code> живут SLO-гейты уровня запуска: шаг\n<code>std/thresholds@v1<\/code> видит всё, что собрал запуск, и определяет по этому код\nзавершения (см. <a href=\"#/docs/core/actions\">actions.md<\/a>).<\/li>\n<li>Сводка метрик печатается последней.<\/li>\n<\/ul>\n<h2>Поток данных: <code>vars.*<\/code> и <code>config.*<\/code><\/h2>\n<p>Шаги питаются из двух блоков конфигурации:<\/p>\n<table><thead><tr><th>Блок<\/th><th>Доступен как<\/th><th>Виден<\/th><\/tr><\/thead><tbody>\n<tr><td><code>variables:<\/code><\/td><td><code>${{ vars.&lt;key&gt; }}<\/code><\/td><td>шагам <code>before<\/code>, тестовым шагам, шагам <code>after<\/code><\/td><\/tr>\n<tr><td><code>outputs<\/code> шага <code>before:<\/code><\/td><td><code>${{ config.&lt;name&gt;.&lt;field&gt; }}<\/code><\/td><td>тестовым шагам и шагам <code>after<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<pre><code class=\"language-yaml\">variables:\n  region: eu-west\n\nbefore:\n  - uses: std/http@v1\n    with:\n      url: \"https://api.example.com/token?region=${{ vars.region }}\"\n    outputs: auth            # → ${{ config.auth.status }} etc. later on\n<\/code><\/pre>\n<ul>\n<li>Шаг <code>before<\/code> видит <code>${{ vars.* }}<\/code> и выходные данные <strong>предыдущих<\/strong> шагов\nподготовки (каждый под своим именем <code>outputs<\/code>).<\/li>\n<li>Тестовые шаги видят <code>config.*<\/code> и <code>vars.*<\/code> — но никогда не видят выходные\nданные друг друга между VU (контексты VU независимы).<\/li>\n<li>Шаги <code>after<\/code> видят те же <code>config.*<\/code> и <code>vars.*<\/code>, что и тестовые шаги, поэтому\nшаг очистки может ссылаться ровно на то, на что ссылался тест.<\/li>\n<li>Интерполяция всегда возвращает <strong>строку<\/strong>: числовое выходное значение вроде\n<code>${{ config.keeper.port }}<\/code> доходит до action как <code>\"8080\"<\/code>. Actions,\nпринимающие числа, принимают и строковую форму.<\/li>\n<\/ul>\n<h2>Что не работает в <code>before:<\/code><\/h2>\n<p>Живые соединения (<code>std/ws-connect@v1<\/code>, <code>std/grpc-connect@v1<\/code> и семейство\nstream) привязаны к контексту, который их создал. Контекст подготовки\nисчезает до старта первого VU, поэтому соединение, открытое в <code>before:<\/code>, уже\nмёртво к моменту, когда тестовый шаг запросит его id — вместо этого открывайте\nсоединения на каждой итерации VU (они освобождаются в конце итерации).<\/p>\n<p>Процессы — исключение: <code>std/child_process@v1<\/code> регистрирует свой дочерний\nпроцесс в реестре <strong>с областью видимости запуска<\/strong>, и именно поэтому сервер,\nзапущенный в <code>before:<\/code>, остаётся живым и доступным для остановки на протяжении\nвсего запуска.<\/p>\n<h2>Фоновые процессы от начала до конца<\/h2>\n<p>Каноническая пара setup/teardown: запустить локальный сервис в <code>before:<\/code>,\nобращаться к нему из теста, остановить в <code>after:<\/code>. Здесь — мок «position\nkeeper» для сценария CFD-трейдинга:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 20\nduration: 5m\nallow_process_actions: true        # fail-closed gate, default false\n\nbefore:\n  - name: position-keeper\n    uses: std/child_process@v1\n    with:\n      command: python3\n      args: [\"-m\", \"http.server\", \"8080\"]\n      port: 8080                   # echoed to outputs; port: 0 auto-assigns\n      waitUntil:                   # block the step until the server is ready\n        port_open: 8080\n        timeout: 15s\n      restart: on-failure          # supervisor restarts crashes (max 3, 1s apart)\n    outputs: keeper                # → ${{ config.keeper.port }} etc.\n\nafter:\n  - name: stop-keeper\n    uses: std/kill_process@v1\n    with:\n      name: keeper                 # registry lookup — always the current pid\n      signal: TERM\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - uses: std/http@v1\n    with:\n      url: \"http://127.0.0.1:${{ config.keeper.port }}/positions\"\n    check:\n      status: 200\n<\/code><\/pre>\n<p>Что происходит под капотом:<\/p>\n<ul>\n<li><strong>Стриминг<\/strong>: stdout/stderr дочернего процесса стримятся в лог запуска с\nпрефиксом <code>position-keeper: <\/code> (тот же формат, что и у раннера k6) и\nнакапливаются в ограниченных tail-буферах (по умолчанию 64 КиБ на поток,\nнастраивается параметром <code>buffer_kb<\/code>).<\/li>\n<li><strong>Супервизия<\/strong>: с <code>restart: on-failure<\/code> (или <code>always<\/code>) задача-супервизор\nследит за дочерним процессом и перезапускает его после <code>backoff_ms<\/code> (по\nумолчанию 1000), не более <code>max_restarts<\/code> (по умолчанию 3) раз, логируя каждый\nперезапуск.<\/li>\n<li><strong>Выходные данные — это снимок<\/strong>:\n<code>{ pid, ppid, pgid, port, stdout, stderr, restart_count }<\/code>. <code>ppid<\/code> — это сам\nperfscale; <code>pgid<\/code> — группа процессов дочернего процесса. После перезапуска\nсохранённый <code>pid<\/code> устаревает — именно поэтому <code>std/kill_process@v1<\/code> следует\nадресовать процесс по <code>name<\/code> (имя шага или имя <code>outputs<\/code>): поиск в реестре\nвсегда разрешает <em>текущий<\/em> pid. <code>pid:<\/code> (сырой pid ОС) существует как\nbest-effort лазейка для процессов вне реестра.<\/li>\n<li><strong>Автоостановка<\/strong>: даже без шага <code>after:<\/code> keeper был бы остановлен по\nзавершении запуска. Явный <code>kill_process<\/code> нужен для чистой и своевременной\nостановки — и для возможности проверить её утверждением.<\/li>\n<\/ul>\n<p>Полные справочники параметров см. в\n<a href=\"#/docs/core/actions\"><code>std/child_process@v1<\/code><\/a> и\n<a href=\"#/docs/core/actions\"><code>std/kill_process@v1<\/code><\/a>, а запускаемый вариант —\nв\n<a href=\"../examples/with-processes.config.yaml\">examples/with-processes.config.yaml<\/a>.<\/p>\n<h2>waitUntil — гейты готовности<\/h2>\n<p>Шаг <code>child_process<\/code> блокируется до готовности процесса (или до истечения\nтаймаута гейта). Две формы:<\/p>\n<pre><code class=\"language-yaml\"># Object form — all listed matchers must hold:\nwaitUntil:\n  stdout_contains: \"Serving HTTP\"    # substring in captured stdout\n  stderr_contains: \"listening\"       # substring in captured stderr\n  stdout_matches: \"on port \\\\d+\"     # regex against captured stdout\n  stderr_matches: \"err\\\\d+\"          # regex against captured stderr\n  port_open: 8080                    # TCP connect to 127.0.0.1:&lt;port&gt; works;\n                                     # 0 = the step's own `port`\n  timeout: 15s                       # duration string, default 30s\n  on_timeout: fail                   # fail (default) | continue\n\n# String form — one matcher, defaults for the rest:\nwaitUntil: 'contains(stdout, \"Serving HTTP\")'\nwaitUntil: 'matches(stderr, \"err\\\\d+\")'\nwaitUntil: 'port_open(8080)'\n<\/code><\/pre>\n<ul>\n<li>С <code>on_timeout: fail<\/code> невыполненный гейт проваливает шаг (а значит, и запуск,\nесли он используется в <code>before:<\/code>); <code>continue<\/code> логирует промах и продолжает\nвыполнение.<\/li>\n<li>Процесс, который <strong>завершился до наступления готовности<\/strong>, немедленно\nпроваливает шаг со своим кодом завершения и хвостом stderr — без ожидания\nтаймаута.<\/li>\n<\/ul>\n<h2>Прерывания (SIGINT / SIGTERM)<\/h2>\n<p>Двухступенчатая семантика:<\/p>\n<ul>\n<li><strong>Первый<\/strong> SIGINT (Ctrl-C) или SIGTERM: цикл VU останавливается между шагами,\nи запуск проходит через обычный teardown — шаги <code>after:<\/code>, автоостановка\nпроцессов, сводка. Об этом сообщает строка в логе:\n<code>Interrupt received — stopping load, running teardown (interrupt again to force-quit)<\/code>.<\/li>\n<li><strong>Второй<\/strong> сигнал: немедленный <code>exit(130)<\/code> — сам teardown мог зависнуть, и\nоператор явно хочет выйти. Всё, что к этому моменту ещё не остановлено, может\nутечь, поэтому лучше дождаться первой стадии.<\/li>\n<\/ul>\n<h2>Безопасность и переносимость<\/h2>\n<ul>\n<li><strong>Fail-closed гейт<\/strong>: оба process actions завершаются с ошибкой\n<code>process actions disabled (allow_process_actions is false)<\/code>, если конфиг явно\nне включил их через <code>allow_process_actions: true<\/code> — список шагов из\nнедоверенного источника не может порождать OS-процессы или посылать им\nсигналы. Тот же паттерн, что и <code>allow_file_actions<\/code> для файловых actions.<\/li>\n<li><strong>Группы процессов (unix)<\/strong>: каждый дочерний процесс возглавляет свою группу\n(<code>pgid == pid<\/code>), поэтому остановка с <code>tree: true<\/code> посылает сигнал точно в\nгруппу дочернего процесса — она никогда не может задеть perfscale или его\nродителя.<\/li>\n<li><strong>Не-unix<\/strong>: ни POSIX-сигналов, ни групп процессов нет.\n<code>std/kill_process@v1<\/code> по <code>name<\/code> завершает только непосредственный дочерний\nпроцесс (<code>tree<\/code> не действует); <code>pid:<\/code> не поддерживается. Всё остальное —\nзахват вывода, супервизия перезапусков, <code>waitUntil<\/code>, автоостановка —\nработает так же.<\/li>\n<\/ul>\n","slug":"core/setup-teardown","title":"Setup and teardown"},{"group":"core","html_en":"<h1>Shared variables<\/h1>\n<p>perfscale's <code>variables:<\/code> and step outputs are <strong>immutable and per-VU<\/strong> — one\nVU cannot see another's values, and nothing can be updated mid-run. Shared\nvariables fill that gap: one run-scoped key/value store with <strong>atomic<\/strong>\noperations, mutated and read from steps with <code>std/set_shared_variable@v1<\/code> /\n<code>std/get_shared_variable@v1<\/code>. They express the coordination patterns\nper-VU variables cannot:<\/p>\n<ul>\n<li><strong>Shared counters<\/strong> — count events across all VUs (<code>increment<\/code>).<\/li>\n<li><strong>Producer/consumer queues<\/strong> — one VU appends work items, others <code>pop<\/code>\nthem FIFO.<\/li>\n<li><strong>Barriers<\/strong> — a consumer blocks with <code>wait_for<\/code> until N items have\naccumulated or a flag flips.<\/li>\n<\/ul>\n<p>Every operation is a single atomic acquisition — there is no\nread-modify-write pair of steps to race, and no lock primitive to deadlock.<\/p>\n<p>This page is the guide. Per-step parameters and outputs live in the\n<a href=\"#/docs/core/actions\">actions reference<\/a>.<\/p>\n<h2>Declaration (mandatory)<\/h2>\n<p>Shared variables are declared in the <strong>config file<\/strong>, next to <code>variables:<\/code>,\nas a map of name → initial JSON value. The type is inferred from the initial\nvalue and constrains which ops are legal:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 8\nduration: 30s\n\nshared_variables:\n  pending_orders: []      # list  → append / pop / length_gte\n  approved_count: 0       # number → increment\n  last_error: null        # any   → set / get\n<\/code><\/pre>\n<p>A step referencing an undeclared name, or an <code>op<\/code> incompatible with the\ndeclared type (<code>increment<\/code> on a list), fails <strong>configuration validation<\/strong>\nbefore any VU starts — a typo never becomes a silent <code>null<\/code> mid-test. There\nis no dynamic creation: steps only use declared names. At run start the\ndeclared names are (re)set to their initial values.<\/p>\n<h2>Producer / consumer queue<\/h2>\n<p>One VU (or one test file) produces work items, the rest consume. <code>append<\/code>\nreturns the new list length; <code>pop<\/code> removes and returns the first element\n(<code>null<\/code> on an empty list — gate on it with <code>check:<\/code> when emptiness is an\nerror, or use <code>wait_for<\/code> to block instead):<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nshared_variables:\n  pending_orders: []\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># producer.yaml — every iteration enqueues one order\nsteps:\n  - name: enqueue order\n    use: std/set_shared_variable@v1\n    with:\n      name: pending_orders\n      op: append\n      value: { id: \"ord-${seq}\", total: \"${randf(10,100,2)}\" }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># consumer.yaml — block up to 10s for an item, then take it\nsteps:\n  - name: dequeue order\n    use: std/get_shared_variable@v1\n    with:\n      name: pending_orders\n      op: pop\n      wait_for: { length_gte: 1, timeout_ms: 10000 }\n      extract: { order_id: $.id, total: $.total }\n    check:\n      body_contains: ord-\n<\/code><\/pre>\n<p>Payloads interpolate like any other step — <code>${seq}<\/code>, <code>${randf(10, 100, 2)}<\/code>,\n<code>${{ vars.* }}<\/code>, outputs of previous steps. <code>extract<\/code> pulls fields out of the\nvalue with the same dotted-path syntax (<code>$.foo.bar<\/code>, <code>$.[0].x<\/code>) as\n<a href=\"#/docs/core/llm\"><code>std/llm@v1<\/code><\/a>'s extract; each extracted key lands at the top level\nof the step output, so <code>outputs:<\/code> + <code>${{ name.order_id }}<\/code> works downstream.<\/p>\n<h2>Barrier: accumulate N items<\/h2>\n<p>A consumer that must not start until N producers have contributed — the\nclassic load-test rendezvous. <code>wait_for<\/code> blocks (polling with a small async\nsleep, no spinning) until the condition holds:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: wait for batch of 10 orders\n    use: std/get_shared_variable@v1\n    with:\n      name: pending_orders\n      wait_for: { length_gte: 10, timeout_ms: 30000 }\n<\/code><\/pre>\n<p><code>wait_for<\/code> takes exactly one condition — <code>exists<\/code>, <code>equals: &lt;json&gt;<\/code>, or\n<code>length_gte: &lt;int&gt;<\/code> — plus <code>timeout_ms<\/code> (default <code>5000<\/code>). On timeout the\nstep <strong>fails<\/strong> with an <code>[err]<\/code> line reporting the last observed value (the\nsame contract as <code>std/pubsub@v1<\/code>'s subscribe timeout): a producer that fell\nbehind is the signal you are sizing for, not a silent pass. The wait time\nlands in <code>waited_ms<\/code> and a <code>shared_variable_wait_ms<\/code> metric sample, so slow\nbarriers show up in the summary.<\/p>\n<p>A shared counter pairs naturally with a barrier — <code>increment<\/code> returns the\nnew value:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nshared_variables:\n  approved_count: 0\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">steps:\n  - name: approve\n    use: std/set_shared_variable@v1\n    with: { name: approved_count, op: increment, value: 1 }\n\n  - name: proceed once 50 approvals are in\n    use: std/get_shared_variable@v1\n    with:\n      name: approved_count\n      wait_for: { equals: 50, timeout_ms: 60000 }\n<\/code><\/pre>\n<h2>Drivers: memory vs redis<\/h2>\n<p>The backing store is pluggable behind a driver, chosen per step:<\/p>\n<table><thead><tr><th>Driver<\/th><th>Store<\/th><\/tr><
