\/thead><tbody>\n<tr><td><code>memory<\/code> (default)<\/td><td>Process-global map — shared by every VU <strong>in one process<\/strong>, no external service needed<\/td><\/tr>\n<\/tbody><\/table>\n<p>Vendor drivers — <strong>Redis<\/strong>, … — are a pro capability registered on the same\ndriver seam; an unknown <code>driver<\/code> value fails the step with the list of\nregistered drivers, so it is always clear which build you are running.<\/p>\n<p>The <code>memory<\/code> store is <strong>per process<\/strong>: when a distributed run spreads VUs\nacross multiple <code>perfscaled<\/code> agents, each agent has its own store — an\n<code>append<\/code> on agent A is invisible to agent B. Cross-agent coordination (a\ncluster-wide queue or barrier) requires a networked driver such as Redis;\nwithin one agent, <code>memory<\/code> is the fastest option and needs nothing running.<\/p>\n<h2>Limits<\/h2>\n<ul>\n<li>No dynamic creation — undeclared names are config errors, so a test's\nshared state is fully listed in <code>shared_variables:<\/code>.<\/li>\n<li><code>pop<\/code> is FIFO and there is no peek-by-index; consumer-side assertions on\npayload fields go through <code>extract<\/code> or a <code>std/check@v1<\/code> step.<\/li>\n<li><code>wait_for<\/code> is polling, not a push subscription — keep <code>timeout_ms<\/code> tight\nin hot loops so a stuck producer fails fast.<\/li>\n<\/ul>\n","html_ru":"<h1>Общие переменные<\/h1>\n<p>Переменные <code>variables:<\/code> в perfscale и выходные данные шагов <strong>неизменяемы и\nсуществуют в рамках одного VU<\/strong> — один VU не видит значений другого, и ничего\nнельзя обновить в процессе прогона. Общие переменные закрывают этот пробел:\nединое хранилище «ключ/значение» с областью видимости на весь прогон и\n<strong>атомарными<\/strong> операциями, которое изменяется и читается из шагов через\n<code>std/set_shared_variable@v1<\/code> / <code>std/get_shared_variable@v1<\/code>. Они выражают\nпаттерны координации, недоступные переменным уровня VU:<\/p>\n<ul>\n<li><strong>Общие счётчики<\/strong> — подсчёт событий по всем VU (<code>increment<\/code>).<\/li>\n<li><strong>Очереди «производитель/потребитель»<\/strong> — один VU добавляет элементы работы,\nостальные извлекают их через <code>pop<\/code> в порядке FIFO.<\/li>\n<li><strong>Барьеры<\/strong> — потребитель блокируется через <code>wait_for<\/code>, пока не накопится\nN элементов или не изменится флаг.<\/li>\n<\/ul>\n<p>Каждая операция — одно атомарное обращение: нет пары шагов\n«чтение-изменение-запись», которая могла бы привести к гонке, и нет примитива\nблокировки, который мог бы вызвать взаимную блокировку.<\/p>\n<p>Эта страница — руководство. Параметры и выходные данные шагов описаны в\n<a href=\"#/docs/core/actions\">справочнике действий<\/a>.<\/p>\n<h2>Объявление (обязательно)<\/h2>\n<p>Общие переменные объявляются в <strong>файле конфигурации<\/strong>, рядом с <code>variables:<\/code>,\nв виде отображения «имя → начальное JSON-значение». Тип выводится из\nначального значения и определяет, какие операции допустимы:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 8\nduration: 30s\n\nshared_variables:\n  pending_orders: []      # list  → append / pop / length_gte\n  approved_count: 0       # number → increment\n  last_error: null        # any   → set / get\n<\/code><\/pre>\n<p>Шаг, ссылающийся на необъявленное имя, или операция <code>op<\/code>, несовместимая с\nобъявленным типом (<code>increment<\/code> для списка), завершается ошибкой <strong>валидации\nконфигурации<\/strong> ещё до запуска любого VU — опечатка никогда не превратится в\nмолчаливый <code>null<\/code> посреди теста. Динамического создания нет: шаги используют\nтолько объявленные имена. При старте прогона объявленные имена (пере)устанавливаются\nв свои начальные значения.<\/p>\n<h2>Очередь «производитель/потребитель»<\/h2>\n<p>Один VU (или один тестовый файл) производит элементы работы, остальные их\nпотребляют. <code>append<\/code> возвращает новую длину списка; <code>pop<\/code> извлекает и\nвозвращает первый элемент (<code>null<\/code> для пустого списка — проверяйте это через\n<code>check:<\/code>, когда пустота является ошибкой, или используйте <code>wait_for<\/code>, чтобы\nвместо этого заблокироваться):<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nshared_variables:\n  pending_orders: []\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># producer.yaml — every iteration enqueues one order\nsteps:\n  - name: enqueue order\n    use: std/set_shared_variable@v1\n    with:\n      name: pending_orders\n      op: append\n      value: { id: \"ord-${seq}\", total: \"${randf(10,100,2)}\" }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># consumer.yaml — block up to 10s for an item, then take it\nsteps:\n  - name: dequeue order\n    use: std/get_shared_variable@v1\n    with:\n      name: pending_orders\n      op: pop\n      wait_for: { length_gte: 1, timeout_ms: 10000 }\n      extract: { order_id: $.id, total: $.total }\n    check:\n      body_contains: ord-\n<\/code><\/pre>\n<p>Полезные данные интерполируются, как в любом другом шаге, — <code>${seq}<\/code>,\n<code>${randf(10, 100, 2)}<\/code>, <code>${{ vars.* }}<\/code>, выходные данные предыдущих шагов.\n<code>extract<\/code> извлекает поля из значения тем же синтаксисом путей через точку\n(<code>$.foo.bar<\/code>, <code>$.[0].x<\/code>), что и extract в <a href=\"#/docs/core/llm\"><code>std/llm@v1<\/code><\/a>; каждый\nизвлечённый ключ попадает на верхний уровень выходных данных шага, поэтому\n<code>outputs:<\/code> + <code>${{ name.order_id }}<\/code> работают дальше по цепочке.<\/p>\n<h2>Барьер: накопление N элементов<\/h2>\n<p>Потребитель, который не должен начинать работу, пока N производителей не\nвнесли свою часть, — классический рандеву нагрузочного тестирования.\n<code>wait_for<\/code> блокирует выполнение (опрашивая значение с небольшой асинхронной\nзадержкой, без активного ожидания), пока условие не станет истинным:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: wait for batch of 10 orders\n    use: std/get_shared_variable@v1\n    with:\n      name: pending_orders\n      wait_for: { length_gte: 10, timeout_ms: 30000 }\n<\/code><\/pre>\n<p><code>wait_for<\/code> принимает ровно одно условие — <code>exists<\/code>, <code>equals: &lt;json&gt;<\/code> или\n<code>length_gte: &lt;int&gt;<\/code> — плюс <code>timeout_ms<\/code> (по умолчанию <code>5000<\/code>). По истечении\nтаймаута шаг <strong>завершается с ошибкой<\/strong> и строкой <code>[err]<\/code>, в которой указано\nпоследнее наблюдавшееся значение (тот же контракт, что и у таймаута подписки\nв <code>std/pubsub@v1<\/code>): отставший производитель — это именно тот сигнал, для\nкоторого вы подбираете размер теста, а не молчаливый успех. Время ожидания\nпопадает в <code>waited_ms<\/code> и в сэмпл метрики <code>shared_variable_wait_ms<\/code>, поэтому\nмедленные барьеры видны в сводке.<\/p>\n<p>Общий счётчик естественно сочетается с барьером — <code>increment<\/code> возвращает\nновое значение:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nshared_variables:\n  approved_count: 0\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">steps:\n  - name: approve\n    use: std/set_shared_variable@v1\n    with: { name: approved_count, op: increment, value: 1 }\n\n  - name: proceed once 50 approvals are in\n    use: std/get_shared_variable@v1\n    with:\n      name: approved_count\n      wait_for: { equals: 50, timeout_ms: 60000 }\n<\/code><\/pre>\n<h2>Драйверы: memory против redis<\/h2>\n<p>Хранилище подключается через драйвер, который выбирается для каждого шага:<\/p>\n<table><thead><tr><th>Драйвер<\/th><th>Хранилище<\/th><\/tr><\/thead><tbody>\n<tr><td><code>memory<\/code> (по умолчанию)<\/td><td>Глобальное для процесса отображение — общее для всех VU <strong>в одном процессе<\/strong>, внешний сервис не требуется<\/td><\/tr>\n<\/tbody><\/table>\n<p>Вендорные драйверы — <strong>Redis<\/strong>, … — это pro-capability, регистрируемые на том\nже драйверном интерфейсе; неизвестное значение <code>driver<\/code> завершает шаг ошибкой\nсо списком зарегистрированных драйверов, так что всегда ясно, какую сборку\nвы запускаете.<\/p>\n<p>Хранилище <code>memory<\/code> <strong>локально для процесса<\/strong>: когда распределённый прогон\nраспределяет VU по нескольким агентам <code>perfscaled<\/code>, у каждого агента своё\nхранилище — <code>append<\/code> на агенте A невидим для агента B. Межагентная\nкоординация (очередь или барьер на весь кластер) требует сетевого драйвера,\nнапример Redis; в пределах одного агента <code>memory<\/code> — самый быстрый вариант,\nне требующий никаких запущенных сервисов.<\/p>\n<h2>Ограничения<\/h2>\n<ul>\n<li>Нет динамического создания — необъявленные имена являются ошибками\nконфигурации, поэтому всё общее состояние теста полностью перечислено в\n<code>shared_variables:<\/code>.<\/li>\n<li><code>pop<\/code> работает по принципу FIFO, и просмотра по индексу (peek) нет;\nпроверки полей полезных данных на стороне потребителя выполняются через\n<code>extract<\/code> или шаг <code>std/check@v1<\/code>.<\/li>\n<li><code>wait_for<\/code> — это опрос (polling), а не push-подписка, — держите\n<code>timeout_ms<\/code> небольшим в горячих циклах, чтобы зависший производитель\nбыстро приводил к ошибке.<\/li>\n<\/ul>\n","slug":"core/shared-variables","title":"Shared variables"},{"group":"core","html_en":"<h1>WebSocket load testing<\/h1>\n<p>perfscale drives <strong>WebSocket<\/strong> endpoints under load with the native step\nengine: open connections, stream messages from templates, wait for matching\nreplies, and measure both the handshake and the application-level message\nround trip alongside your HTTP/TCP/UDP metrics.<\/p>\n<p>This page is the guide — what the pieces are and when to reach for which.\nPer-step parameters, outputs, and error semantics live in the\n<a href=\"#/docs/core/actions\">actions reference<\/a>;\na runnable scenario ships as\n<a href=\"../../examples/websocket.test.yaml\"><code>examples/websocket.test.yaml<\/code><\/a>.<\/p>\n<h2>Two styles<\/h2>\n<ul>\n<li><strong>One-shot session<\/strong> (<code>std/ws@v1<\/code>) — connect, exchange, close in one step.\nThe whole session is timed as one latency sample, like a FIX session.\nSimplest; right for request/reply-shaped exchanges.<\/li>\n<li><strong>Live connection<\/strong> (<code>std/ws-connect@v1<\/code> + friends) — a connection held\nacross steps within an iteration, addressed by the id the connect step\nreturns. Interleave WS traffic with other steps: subscribe over WS, trigger\nvia REST, assert the push arrives.<\/li>\n<\/ul>\n<p>Freely mixable in one scenario.<\/p>\n<h2>One-shot session<\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: subscribe and await first trade\n    use: std/ws@v1\n    with:\n      url: wss://stream.example.com/feed\n      messages:\n        - send: '{\"op\":\"subscribe\",\"channel\":\"trades\",\"id\":\"sub-${seq}\"}'\n          until_json: { type: trade }\n    check:\n      message_matches: { type: trade }\n<\/code><\/pre>\n<p>Each <code>messages<\/code> entry sends a payload; an entry with an <code>until_*<\/code> rule waits\nfor its matching reply before the next entry — and yields one <strong>message RTT<\/strong>\nsample. The step fails on handshake/transport errors or on any entry whose\nrule did not match in time. Full parameter list:\n<a href=\"#/docs/core/actions\"><code>std/ws@v1<\/code><\/a>.<\/p>\n<h2>Live connection<\/h2>\n<pre><code class=\"language-yaml\"># config.yaml — 25 concurrent VUs, each holding its own connection per iteration\nvus: 25\nduration: 5m\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - name: open feed\n    use: std/ws-connect@v1\n    with: { url: \"wss://stream.example.com/feed\" }\n    outputs: feed\n\n  - name: subscribe\n    use: std/ws-send@v1\n    with:\n      id: \"${{ feed.id }}\"\n      send: '{\"op\":\"subscribe\",\"id\":\"sub-${seq}\"}'\n\n  - name: await confirmation\n    use: std/ws-recv@v1\n    with:\n      id: \"${{ feed.id }}\"\n      until_json: { type: subscribed }\n    outputs: got\n\n  - name: hang up\n    use: std/ws-close@v1\n    with: { id: \"${{ feed.id }}\" }\n<\/code><\/pre>\n<p>Five steps share the connection:<\/p>\n<ul>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-connect@v1<\/code><\/a> — opens it, returns\n<code>{ id, subprotocol, … }<\/code>.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-send@v1<\/code><\/a> — sends a text template\n(<code>${…}<\/code> tokens expand per send) or binary <code>send_base64<\/code>;\n<code>repeat<\/code> + <code>interval_ms<\/code> stream N messages from one template.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-recv@v1<\/code><\/a> — reads until a <strong>stopping\nrule<\/strong>: <code>until_contains<\/code> (substring), <code>until_json<\/code> (JSON-subset match), or\nplain <code>count<\/code>. Not reaching it within <code>timeout<\/code> fails the step. Messages\nbuffered while waiting for the match are capped at <code>max_buffered<\/code>\n(default 10000, override per step); hitting the cap fails the step with a\ndiagnostic — silently dropping buffered messages would hide a missed\nmatch. <code>std/ws@v1<\/code> sessions accept the same <code>max_buffered<\/code> for their\nper-message reply waits.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-ping@v1<\/code><\/a> — transport ping→pong; RTT in\nthe step's <code>duration_ms<\/code>.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-close@v1<\/code><\/a> — graceful close handshake.<\/li>\n<\/ul>\n<p>Connection ids are minted per VU (<code>ws-1<\/code>, <code>ws-2<\/code>, …) and are valid only\ninside that VU's current iteration — an id never crosses into the next\niteration or another VU. Whatever a scenario leaves open is dropped at\niteration end (abruptly — use <code>ws-close<\/code> for a clean shutdown), and\n<code>ws-connect<\/code> inside a config's <code>before:<\/code> setup is not useful: the setup\ncontext and its sockets are gone before VUs start.<\/p>\n<h2>Dynamic messages<\/h2>\n<p>Text payloads may embed single-brace <code>${…}<\/code> tokens (<code>${seq}<\/code>, <code>${vu}<\/code>,\n<code>${uuid}<\/code>,\n<code>${now}<\/code>/<code>${now_ms}<\/code>/<code>${now_iso}<\/code>, <code>${rand(a,b)}<\/code>, <code>${randf(a,b[,dp])}<\/code>,\n<code>${choice(x|y|z)}<\/code>), expanded anew per send — distinct from <code>${{ … }}<\/code>, which\nresolves once before the action runs:<\/p>\n<pre><code class=\"language-yaml\">- use: std/ws-send@v1\n  with:\n    id: \"${{ feed.id }}\"\n    send: '{\"op\":\"order\",\"id\":\"ord-${seq}\",\"px\":${randf(1.05,1.15,5)}}'\n    repeat: 100\n    interval_ms: 50\n<\/code><\/pre>\n<p>The full token table is in the\n<a href=\"#/docs/core/actions\"><code>std/ws-send@v1<\/code> reference<\/a>.<\/p>\n<h2>Asserting messages<\/h2>\n<p>Receive steps expose a <code>messages<\/code> list; <code>std/check@v1<\/code> asserts over it with\nthe <strong>any<\/strong> quantifier (at least one message matches — streams carry\nheartbeats and unrelated events):<\/p>\n<pre><code class=\"language-yaml\">check:\n  message_contains: \"trade\"              # some message contains the substring\n  message_matches: { type: trade }       # some message JSON-subset-matches\n  messages_count_gte: 5                  # at least 5 messages arrived\n<\/code><\/pre>\n<p>For deterministic exchanges, address one message by index:\n<code>check: { on: got.messages.0, message_matches: { type: welcome } }<\/code>.<\/p>\n<h2>Metrics<\/h2>\n<ul>\n<li><code>http_req_duration<\/code> / <code>http_req_failed<\/code> — handshakes (<code>std/ws-connect@v1<\/code>)\nand one-shot sessions (<code>std/ws@v1<\/code>) feed the shared latency histogram\n(one sample per step) — comparable with HTTP/TCP/UDP percentiles; failed\nhandshakes count in <code>http_req_failed<\/code>.<\/li>\n<li><code>ws_msg_rtt<\/code> — HDR histogram in ms (percentiles in the summary);\napplication-level message RTT: time from a send to the first reply\nmatching your until-rule. Emitted by <code>std/ws@v1<\/code> (one sample per matched\nreply in the session) and <code>std/ws-recv@v1<\/code> (one sample, only when a rule\nmatched after a send on the same connection).<\/li>\n<li><code>ws_msg_failed<\/code> — derived failure rate: one 0/1 sample per invocation\nthat produced an RTT sample. See\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<li><code>ws_msgs_sent<\/code> / <code>ws_msgs_received<\/code> — message throughput counters,\nsummed over the run; <code>std/ws@v1<\/code> reports whole-session totals,\n<code>std/ws-send@v1<\/code> / <code>std/ws-recv@v1<\/code> per-step counts.<\/li>\n<li>Waiting on a server-push stream is deliberately <em>not<\/em> counted as latency —\nhow long a server chooses to wait before pushing is not target latency and\nwould poison the shared percentiles.<\/li>\n<\/ul>\n<h2>Limits<\/h2>\n<p>Inbound protocol limits come from the WebSocket library defaults: messages up\nto 64 MiB, single frames up to 16 MiB — a larger inbound message errors the\nconnection (and therefore the step reading it). Timeout values, <code>repeat<\/code>\ncounts, and the <code>messages<\/code> list have no built-in caps.<\/p>\n","html_ru":"<h1>Нагрузочное тестирование WebSocket<\/h1>\n<p>perfscale нагружает <strong>WebSocket<\/strong>-эндпоинты с помощью нативного движка шагов:\nоткрывает соединения, стримит сообщения из шаблонов, ждёт подходящих ответов\nи измеряет как handshake, так и полный круг (round trip) сообщения на уровне\nприложения — наряду с метриками HTTP/TCP/UDP.<\/p>\n<p>Эта страница — руководство: из каких частей всё состоит и когда какую\nиспользовать. Параметры, выходные данные и семантика ошибок каждого шага\nописаны в <a href=\"#/docs/core/actions\">справочнике действий<\/a>;\nготовый к запуску сценарий лежит в\n<a href=\"../../examples/websocket.test.yaml\"><code>examples/websocket.test.yaml<\/code><\/a>.<\/p>\n<h2>Два стиля<\/h2>\n<ul>\n<li><strong>Разовая сессия<\/strong> (<code>std/ws@v1<\/code>) — подключиться, обменяться сообщениями,\nзакрыть соединение за один шаг. Вся сессия измеряется как один сэмпл\nзадержки, как FIX-сессия. Самый простой вариант; подходит для обменов\nвида «запрос/ответ».<\/li>\n<li><strong>Живое соединение<\/strong> (<code>std/ws-connect@v1<\/code> и компания) — соединение,\nудерживаемое между шагами внутри одной итерации и адресуемое по id,\nкоторый возвращает шаг подключения. Позволяет чередовать WS-трафик с\nдругими шагами: подписаться по WS, инициировать событие через REST,\nпроверить, что push пришёл.<\/li>\n<\/ul>\n<p>Оба стиля свободно смешиваются в одном сценарии.<\/p>\n<h2>Разовая сессия<\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: subscribe and await first trade\n    use: std/ws@v1\n    with:\n      url: wss://stream.example.com/feed\n      messages:\n        - send: '{\"op\":\"subscribe\",\"channel\":\"trades\",\"id\":\"sub-${seq}\"}'\n          until_json: { type: trade }\n    check:\n      message_matches: { type: trade }\n<\/code><\/pre>\n<p>Каждый элемент <code>messages<\/code> отправляет payload; элемент с правилом <code>until_*<\/code>\nждёт подходящий ответ перед переходом к следующему элементу — и даёт один\nсэмпл <strong>RTT сообщения<\/strong>. Шаг падает при ошибках handshake/транспорта или\nкогда правило любого элемента не сработало вовремя. Полный список параметров:\n<a href=\"#/docs/core/actions\"><code>std/ws@v1<\/code><\/a>.<\/p>\n<h2>Живое соединение<\/h2>\n<pre><code class=\"language-yaml\"># config.yaml — 25 concurrent VUs, each holding its own connection per iteration\nvus: 25\nduration: 5m\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - name: open feed\n    use: std/ws-connect@v1\n    with: { url: \"wss://stream.example.com/feed\" }\n    outputs: feed\n\n  - name: subscribe\n    use: std/ws-send@v1\n    with:\n      id: \"${{ feed.id }}\"\n      send: '{\"op\":\"subscribe\",\"id\":\"sub-${seq}\"}'\n\n  - name: await confirmation\n    use: std/ws-recv@v1\n    with:\n      id: \"${{ feed.id }}\"\n      until_json: { type: subscribed }\n    outputs: got\n\n  - name: hang up\n    use: std/ws-close@v1\n    with: { id: \"${{ feed.id }}\" }\n<\/code><\/pre>\n<p>Пять шагов делят одно соединение:<\/p>\n<ul>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-connect@v1<\/code><\/a> — открывает его и\nвозвращает <code>{ id, subprotocol, … }<\/code>.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-send@v1<\/code><\/a> — отправляет текстовый шаблон\n(токены <code>${…}<\/code> подставляются при каждой отправке) или бинарные данные через\n<code>send_base64<\/code>; <code>repeat<\/code> + <code>interval_ms<\/code> стримят N сообщений из одного\nшаблона.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-recv@v1<\/code><\/a> — читает, пока не сработает\n<strong>правило остановки<\/strong>: <code>until_contains<\/code> (подстрока), <code>until_json<\/code>\n(совпадение по подмножеству JSON) или просто <code>count<\/code>. Если правило не\nсработало за <code>timeout<\/code>, шаг падает. Сообщения, буферизованные во время\nожидания совпадения, ограничены <code>max_buffered<\/code> (по умолчанию 10000,\nпереопределяется на шаг); при превышении шаг падает с диагностикой —\nмолчаливый дроп буферизованных сообщений скрыл бы пропущенное совпадение.\nСессии <code>std/ws@v1<\/code> принимают тот же <code>max_buffered<\/code> для ожиданий ответа на\nкаждое сообщение.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-ping@v1<\/code><\/a> — транспортный ping→pong; RTT\nпопадает в <code>duration_ms<\/code> шага.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/ws-close@v1<\/code><\/a> — корректный close handshake.<\/li>\n<\/ul>\n<p>Идентификаторы соединений выдаются на каждого виртуального пользователя (VU)\n(<code>ws-1<\/code>, <code>ws-2<\/code>, …) и действуют только внутри текущей итерации этого VU —\nid никогда не переходит в следующую итерацию или к другому VU. Всё, что\nсценарий оставил открытым, сбрасывается в конце итерации (аварийно — для\nчистого завершения используйте <code>ws-close<\/code>), а <code>ws-connect<\/code> в <code>before:<\/code>-настройке\nконфига бесполезен: контекст настройки и его сокеты исчезают до старта VU.<\/p>\n<h2>Динамические сообщения<\/h2>\n<p>Текстовые payload могут содержать токены <code>${…}<\/code> в одинарных фигурных скобках\n(<code>${seq}<\/code>, <code>${vu}<\/code>, <code>${uuid}<\/code>, <code>${now}<\/code>/<code>${now_ms}<\/code>/<code>${now_iso}<\/code>, <code>${rand(a,b)}<\/code>,\n<code>${randf(a,b[,dp])}<\/code>, <code>${choice(x|y|z)}<\/code>), которые подставляются заново при\nкаждой отправке — в отличие от <code>${{ … }}<\/code>, который вычисляется один раз до\nзапуска действия:<\/p>\n<pre><code class=\"language-yaml\">- use: std/ws-send@v1\n  with:\n    id: \"${{ feed.id }}\"\n    send: '{\"op\":\"order\",\"id\":\"ord-${seq}\",\"px\":${randf(1.05,1.15,5)}}'\n    repeat: 100\n    interval_ms: 50\n<\/code><\/pre>\n<p>Полная таблица токенов — в\n<a href=\"#/docs/core/actions\">справочнике <code>std/ws-send@v1<\/code><\/a>.<\/p>\n<h2>Проверка сообщений<\/h2>\n<p>Шаги приёма отдают список <code>messages<\/code>; <code>std/check@v1<\/code> проверяет его с\nквантором <strong>any<\/strong> (хотя бы одно сообщение совпало — потоки несут heartbeat'ы\nи посторонние события):<\/p>\n<pre><code class=\"language-yaml\">check:\n  message_contains: \"trade\"              # some message contains the substring\n  message_matches: { type: trade }       # some message JSON-subset-matches\n  messages_count_gte: 5                  # at least 5 messages arrived\n<\/code><\/pre>\n<p>Для детерминированных обменов адресуйте конкретное сообщение по индексу:\n<code>check: { on: got.messages.0, message_matches: { type: welcome } }<\/code>.<\/p>\n<h2>Метрики<\/h2>\n<ul>\n<li><code>http_req_duration<\/code> / <code>http_req_failed<\/code> — handshake'и\n(<code>std/ws-connect@v1<\/code>) и разовые сессии (<code>std/ws@v1<\/code>) попадают в общую\nгистограмму задержек (один сэмпл на шаг) — сопоставимы с перцентилями\nHTTP/TCP/UDP; неудачные handshake'и учитываются в <code>http_req_failed<\/code>.<\/li>\n<li><code>ws_msg_rtt<\/code> — HDR-гистограмма в мс (процентили в сводке); RTT сообщения\nна уровне приложения: время от отправки до первого ответа, подходящего\nпод until-правило. Эмитируется <code>std/ws@v1<\/code> (по сэмплу на каждый совпавший\nответ в сессии) и <code>std/ws-recv@v1<\/code> (один сэмпл, только когда правило\nсработало после отправки на том же соединении).<\/li>\n<li><code>ws_msg_failed<\/code> — производная доля ошибок: один сэмпл 0/1 на вызов,\nпородивший RTT-сэмпл. См.\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<li><code>ws_msgs_sent<\/code> / <code>ws_msgs_received<\/code> — счётчики пропускной способности по\nсообщениям, суммируются за прогон; <code>std/ws@v1<\/code> сообщает итоги за сессию,\n<code>std/ws-send@v1<\/code> / <code>std/ws-recv@v1<\/code> — по шагу.<\/li>\n<li>Ожидание server-push потока намеренно <em>не<\/em> считается задержкой — то,\nсколько сервер решит ждать перед отправкой, не является задержкой цели и\nтолько отравило бы общие перцентили.<\/li>\n<\/ul>\n<h2>Ограничения<\/h2>\n<p>Входящие протокольные лимиты берутся из настроек WebSocket-библиотеки по\nумолчанию: сообщения до 64 МиБ, отдельные фреймы до 16 МиБ — бо́льшее\nвходящее сообщение приводит к ошибке соединения (а значит, и шага, который\nего читает). Значения таймаутов, количества <code>repeat<\/code> и список <code>messages<\/code>\nвстроенных ограничений не имеют.<\/p>\n","slug":"core/websocket","title":"WebSocket load testing"},{"group":"top","html_en":"<h1>Getting started<\/h1>\n<h2>Install<\/h2>\n<p>Via npm — installs the standalone binary for your platform (no Node.js\nrequired at runtime):<\/p>\n<pre><code class=\"language-sh\">npm install -g @perfscale/exe\n<\/code><\/pre>\n<p>Or download a binary for your platform from\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/releases\">GitHub Releases<\/a>:<\/p>\n<table><thead><tr><th>Platform<\/th><th>Artifact<\/th><\/tr><\/thead><tbody>\n<tr><td>Linux x86_64<\/td><td><code>perfscale-linux-amd64<\/code> (static)<\/td><\/tr>\n<tr><td>Linux ARM64<\/td><td><code>perfscale-linux-arm64<\/code> (static)<\/td><\/tr>\n<tr><td>macOS Apple Silicon<\/td><td><code>perfscale-darwin-arm64<\/code><\/td><\/tr>\n<tr><td>macOS Intel<\/td><td><code>perfscale-darwin-amd64<\/code><\/td><\/tr>\n<tr><td>Windows x86_64<\/td><td><code>perfscale-windows-amd64.exe<\/code><\/td><\/tr>\n<tr><td>Windows ARM64<\/td><td><code>perfscale-windows-arm64.exe<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<pre><code class=\"language-sh\"># Linux/macOS example\ncurl -fsSL -o perfscale https://github.com/Perfscale/perfscale/releases/latest/download/perfscale-linux-amd64\nchmod +x perfscale\n<\/code><\/pre>\n<p>Verify with <code>sha256sums.txt<\/code> from the same release. Once installed, staying\ncurrent is one command — it verifies checksums and swaps the binary in place:<\/p>\n<pre><code class=\"language-sh\">perfscale self-update\n<\/code><\/pre>\n<p>Or build from source:<\/p>\n<pre><code class=\"language-sh\">cargo build --release -p perfscale-cli\n# binary at target/release/perfscale\n<\/code><\/pre>\n<p>perfscale itself has no runtime dependencies. The external engines are\noptional and only needed if you use them:<\/p>\n<ul>\n<li><strong>k6<\/strong> — <a target=\"_blank\" rel=\"noopener\" href=\"https://k6.io/docs/get-started/installation/\">installation guide<\/a><\/li>\n<li><strong>locust<\/strong> — <code>pip install locust<\/code><\/li>\n<li><strong>native engine<\/strong> — built in, nothing to install<\/li>\n<\/ul>\n<h2>First run (no external tools needed)<\/h2>\n<p>Create <code>test.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\"># yaml-language-server: $schema=https://raw.githubusercontent.com/Perfscale/perfscale/main/schema/test.schema.json\nsteps:\n  - name: homepage\n    use: std/http@v1\n    with:\n      method: GET\n      url: https://httpbin.org/get\n    check:\n      status: 200\n    outputs: resp\n\n  - name: log status\n    use: std/log@v1\n    with:\n      message: \"got status ${{ resp.status }}\"\n<\/code><\/pre>\n<p>Create <code>config.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">vus: 5\nduration: 30s\n<\/code><\/pre>\n<p>Run it:<\/p>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml\n<\/code><\/pre>\n<p>You'll see live per-request output, then a k6-compatible summary:<\/p>\n<pre><code class=\"language-text\">vus....................: 5 min=1 max=5\niterations..............: 142 4.73/s\nhttp_req_duration......: avg=213.40ms p(50)=201ms p(90)=280ms p(95)=310ms p(99)=352ms min=180ms max=390ms\nhttp_req_failed........: 0.00%\nhttp_reqs..............: 142 4.73/s\n<\/code><\/pre>\n<p>Beyond a fixed <code>vus<\/code>/<code>duration<\/code>, the native engine also runs k6-style\nload profiles: ramping VUs via <code>stages:<\/code> and arrival-rate via <code>arrival:<\/code> —\nsee <a href=\"#/docs/yaml-reference\">Load profiles<\/a>.<\/p>\n<h2>Running k6 or locust scripts<\/h2>\n<p>Already have scripts? Point perfscale at them — output lands in the same\nunified summary format regardless of engine:<\/p>\n<pre><code class=\"language-sh\">perfscale run --k6 script.js\nperfscale run --locust locustfile.py --host https://target.example.com\n<\/code><\/pre>\n<p>For locust, <code>-c config.yaml<\/code> maps <code>vus<\/code>/<code>duration<\/code> onto locust's\n<code>--users<\/code>/<code>--spawn-rate<\/code>/<code>--run-time<\/code>.<\/p>\n<h2>Collecting results from multiple runs<\/h2>\n<p>Start the local dev server in one terminal:<\/p>\n<pre><code class=\"language-sh\">perfscale serve            # listens on :7999\n<\/code><\/pre>\n<p>Then report runs to it from anywhere:<\/p>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml --report http://localhost:7999\n<\/code><\/pre>\n<p>The server prints each incoming summary batch. Only the metric summary is\nforwarded — never the full per-iteration log.<\/p>\n<h2>Next steps<\/h2>\n<ul>\n<li><a href=\"#/docs/yaml-reference\">YAML reference<\/a> — every field of both file formats<\/li>\n<li><a href=\"#/docs/cli/commands\">CLI commands<\/a> — all flags<\/li>\n<li><a href=\"#/docs/cli/examples\">Recipes<\/a> — CI usage, presets, multi-step scenarios, WebSocket, gRPC<\/li>\n<\/ul>\n","html_ru":"<h1>Начало работы<\/h1>\n<h2>Установка<\/h2>\n<p>Через npm — устанавливает автономный бинарный файл для вашей платформы\n(Node.js во время выполнения не требуется):<\/p>\n<pre><code class=\"language-sh\">npm install -g @perfscale/exe\n<\/code><\/pre>\n<p>Или скачайте бинарный файл для вашей платформы со страницы\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/releases\">GitHub Releases<\/a>:<\/p>\n<table><thead><tr><th>Платформа<\/th><th>Артефакт<\/th><\/tr><\/thead><tbody>\n<tr><td>Linux x86_64<\/td><td><code>perfscale-linux-amd64<\/code> (static)<\/td><\/tr>\n<tr><td>Linux ARM64<\/td><td><code>perfscale-linux-arm64<\/code> (static)<\/td><\/tr>\n<tr><td>macOS Apple Silicon<\/td><td><code>perfscale-darwin-arm64<\/code><\/td><\/tr>\n<tr><td>macOS Intel<\/td><td><code>perfscale-darwin-amd64<\/code><\/td><\/tr>\n<tr><td>Windows x86_64<\/td><td><code>perfscale-windows-amd64.exe<\/code><\/td><\/tr>\n<tr><td>Windows ARM64<\/td><td><code>perfscale-windows-arm64.exe<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<pre><code class=\"language-sh\"># пример для Linux/macOS\ncurl -fsSL -o perfscale https://github.com/Perfscale/perfscale/releases/latest/download/perfscale-linux-amd64\nchmod +x perfscale\n<\/code><\/pre>\n<p>Проверьте файл с помощью <code>sha256sums.txt<\/code> из того же релиза. После установки\nобновление выполняется одной командой — она проверяет контрольные суммы\nи заменяет бинарный файл на месте:<\/p>\n<pre><code class=\"language-sh\">perfscale self-update\n<\/code><\/pre>\n<p>Или соберите из исходников:<\/p>\n<pre><code class=\"language-sh\">cargo build --release -p perfscale-cli\n# бинарный файл: target/release/perfscale\n<\/code><\/pre>\n<p>Сам perfscale не имеет зависимостей во время выполнения. Внешние движки\nнеобязательны и нужны, только если вы их используете:<\/p>\n<ul>\n<li><strong>k6<\/strong> — <a target=\"_blank\" rel=\"noopener\" href=\"https://k6.io/docs/get-started/installation/\">руководство по установке<\/a><\/li>\n<li><strong>locust<\/strong> — <code>pip install locust<\/code><\/li>\n<li><strong>нативный движок<\/strong> — встроен, ничего устанавливать не нужно<\/li>\n<\/ul>\n<h2>Первый запуск (внешние инструменты не нужны)<\/h2>\n<p>Создайте <code>test.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\"># yaml-language-server: $schema=https://raw.githubusercontent.com/Perfscale/perfscale/main/schema/test.schema.json\nsteps:\n  - name: homepage\n    use: std/http@v1\n    with:\n      method: GET\n      url: https://httpbin.org/get\n    check:\n      status: 200\n    outputs: resp\n\n  - name: log status\n    use: std/log@v1\n    with:\n      message: \"got status ${{ resp.status }}\"\n<\/code><\/pre>\n<p>Создайте <code>config.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">vus: 5\nduration: 30s\n<\/code><\/pre>\n<p>Запустите:<\/p>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml\n<\/code><\/pre>\n<p>Вы увидите живой вывод по каждому запросу, а затем сводку в формате,\nсовместимом с k6:<\/p>\n<pre><code class=\"language-text\">vus....................: 5 min=1 max=5\niterations..............: 142 4.73/s\nhttp_req_duration......: avg=213.40ms p(50)=201ms p(90)=280ms p(95)=310ms p(99)=352ms min=180ms max=390ms\nhttp_req_failed........: 0.00%\nhttp_reqs..............: 142 4.73/s\n<\/code><\/pre>\n<p>Помимо фиксированных <code>vus<\/code>/<code>duration<\/code>, нативный движок также выполняет\nпрофили нагрузки в стиле k6: нарастание VU через <code>stages:<\/code> и arrival-rate\nчерез <code>arrival:<\/code> — см. <a href=\"#/docs/yaml-reference\">Профили нагрузки<\/a>.<\/p>\n<h2>Запуск скриптов k6 или locust<\/h2>\n<p>Уже есть скрипты? Просто укажите их perfscale — результат будет выведен\nв том же едином формате сводки независимо от движка:<\/p>\n<pre><code class=\"language-sh\">perfscale run --k6 script.js\nperfscale run --locust locustfile.py --host https://target.example.com\n<\/code><\/pre>\n<p>Для locust параметр <code>-c config.yaml<\/code> сопоставляет <code>vus<\/code>/<code>duration<\/code>\nс опциями locust <code>--users<\/code>/<code>--spawn-rate<\/code>/<code>--run-time<\/code>.<\/p>\n<h2>Сбор результатов из нескольких запусков<\/h2>\n<p>Запустите локальный dev-сервер в одном терминале:<\/p>\n<pre><code class=\"language-sh\">perfscale serve            # слушает порт :7999\n<\/code><\/pre>\n<p>Затем отправляйте результаты запусков на него откуда угодно:<\/p>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml --report http://localhost:7999\n<\/code><\/pre>\n<p>Сервер выводит каждый входящий пакет сводок. Пересылается только сводка\nметрик — полный лог итераций никогда не отправляется.<\/p>\n<h2>Дальнейшие шаги<\/h2>\n<ul>\n<li><a href=\"#/docs/yaml-reference\">Справочник по YAML<\/a> — все поля обоих форматов файлов<\/li>\n<li><a href=\"#/docs/cli/commands\">Команды CLI<\/a> — все флаги<\/li>\n<li><a href=\"#/docs/cli/examples\">Рецепты<\/a> — использование в CI, пресеты, многошаговые сценарии, WebSocket, gRPC<\/li>\n<\/ul>\n","slug":"getting-started","title":"Getting started"},{"group":"top","html_en":"<h1>Library SDKs<\/h1>\n<p>SDKs for authoring <strong>perfscale libraries<\/strong> — WASM components that provide\nvalue-generating functions to <code>${alias.fn(...)}<\/code> tokens in test payloads\n(RFC 005). If you want to <em>use<\/em> libraries in a test, start with the\n<a href=\"#/docs/core/libraries\">libraries guide<\/a>; this page is for writing your own.<\/p>\n<p>One ABI contract (<code>perfscale:library<\/code>, WASI Preview 2 component model), one\nSDK shape, three languages:<\/p>\n<table><thead><tr><th>Language<\/th><th>Package<\/th><th>Status<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Rust<\/strong><\/td><td><a href=\"../crates/perfscale-library-sdk\"><code>perfscale-library-sdk<\/code><\/a> (this repo)<\/td><td>Stable, versioned with the engine<\/td><\/tr>\n<tr><td><strong>TypeScript / JavaScript<\/strong><\/td><td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.npmjs.com/package/@perfscale/library-sdk\"><code>@perfscale/library-sdk<\/code><\/a> (<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries\">sdk-libraries<\/a>)<\/td><td>Stable (v0.1.x)<\/td><\/tr>\n<tr><td><strong>Go<\/strong><\/td><td><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries/tree/main/go\">TinyGo recipe<\/a><\/td><td>Experimental (no SDK package yet)<\/td><\/tr>\n<\/tbody><\/table>\n<h2>What every SDK gives you<\/h2>\n<p>The SDK hides all WIT plumbing. You declare a library name and its\nfunctions; the SDK provides:<\/p>\n<ul>\n<li><strong><code>Ctx<\/code><\/strong> — the per-call context: <code>message_seq<\/code>, <code>iteration_seq<\/code>,\n<code>vu_id<\/code>, <code>seed<\/code>, <code>time_ms<\/code> (plus the run's frozen <code>settings_json<\/code> on the\n0.2 ABI).<\/li>\n<li><strong><code>memo(key, fn)<\/code><\/strong> — keyed reuse of a generated value within one\nmessage: <code>${fix.id(new)}<\/code> appearing twice in one message yields one id.<\/li>\n<li><strong>A seeded PRNG bit-identical across all SDKs and the engine's built-in\ngenerator<\/strong> (xorshift64, same draw order) — a <code>seed:<\/code> run reproduces\nregardless of the language the library is written in. <code>wasi:random<\/code> is\nnever provided to guests; draw all randomness from the SDK's PRNG.<\/li>\n<li><strong>Argument helpers<\/strong> with author-friendly errors, and a <strong>runtime-free\ntest harness<\/strong> — unit-test your library on the host, no wasm runtime\nneeded.<\/li>\n<\/ul>\n<h2>Rust<\/h2>\n<p>The Rust SDK lives in this repository at\n<a href=\"../crates/perfscale-library-sdk\"><code>crates/perfscale-library-sdk<\/code><\/a> and\npublishes to crates.io. Rust ≥ 1.82 emits WASI Preview 2 components\nnatively — no cargo-component needed:<\/p>\n<pre><code class=\"language-rust\">#[perfscale::library(name = \"fixer-ids\", version = \"1.0.0\")]\nimpl Library for FixerIds {\n    fn functions(&amp;self) -&gt; Vec&lt;FunctionInfo&gt; { /* … */ }\n    fn init(&amp;mut self, config: &amp;Value, ctx: InitContext) -&gt; Result&lt;(), Error&gt; { /* … */ }\n    fn call(&amp;mut self, ctx: &amp;Ctx, f: &amp;str, args: &amp;Value) -&gt; Result&lt;String, Error&gt; {\n        ctx.memo(\"new\", || self.next_clordid())\n    }\n}\n<\/code><\/pre>\n<pre><code class=\"language-console\">$ rustup target add wasm32-wasip2\n$ cargo build --release --target wasm32-wasip2   # → target/wasm32-wasip2/release/&lt;name&gt;.wasm\n<\/code><\/pre>\n<p>The <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/library-random\">library-random<\/a> repo —\nthe WASM port of the engine's <code>@std/random<\/code> built-in — doubles as the\nreference implementation and author template.<\/p>\n<h2>TypeScript / JavaScript<\/h2>\n<pre><code class=\"language-console\">$ npm install @perfscale/library-sdk     # requires Node.js ≥ 24\n<\/code><\/pre>\n<pre><code class=\"language-ts\">import { args, defineLibrary } from \"@perfscale/library-sdk\";\n\nexport default defineLibrary({\n  name: \"mylib\",\n  functions: {\n    token: {\n      description: \"Deterministic per-instance token; memo key reuses it within one message\",\n      call(argv, ctx) {\n        const mint = () =&gt; `tok-${ctx.rng().nextU64().toString(16)}`;\n        const key = args.optionalString(argv, 0);\n        return key === undefined ? mint() : ctx.memo(key, mint);\n      },\n    },\n  },\n});\n<\/code><\/pre>\n<p>Build to a component with the bundled CLI (ComponentizeJS embeds a JS\nengine — that is how TS becomes WASM):<\/p>\n<pre><code class=\"language-console\">$ npx perfscale-library-build mylib.ts -o mylib.wasm\n<\/code><\/pre>\n<p>Unit-test without any WASM runtime:<\/p>\n<pre><code class=\"language-ts\">import assert from \"node:assert/strict\";\nimport { Ctx, testCall } from \"@perfscale/library-sdk\";\nimport lib from \"./mylib.ts\";\n\nconst ctx = new Ctx(42);\nassert.equal(testCall(lib, ctx, \"token\", []), testCall(lib, ctx, \"token\", []));\n<\/code><\/pre>\n<p>Note: jco components always import <code>wasi:filesystem/*<\/code> and\n<code>wasi:clocks/wall-clock<\/code>. A TS library that never touches files or the wall\nclock declares <code>\"pure\": true<\/code> in its <code>info()<\/code> JSON (the TS SDK does this for\nyou when the library opts in) and then needs <strong>no<\/strong> <code>capabilities:<\/code> grant and\nno <code>allow_library_capabilities: true<\/code>: the engine links those interfaces so\nthe component instantiates, but attaches no preopens — any actual file\naccess fails at runtime. (The <code>capabilities:<\/code> <strong>key<\/strong> is still required on\nevery <code>libraries:<\/code> entry — write <code>capabilities: []<\/code> for a grant-less\nlibrary; omitting the key is a validation error.) A TS library that really\nreads files still declares\n<code>capabilities: [fs]<\/code> (a read-only preopen of the run's <code>fs_root<\/code>) plus\n<code>allow_library_capabilities: true<\/code>. The build already strips <code>wasi:random<\/code>,\n<code>wasi:http<\/code> and timers.<\/p>\n<h2>Go<\/h2>\n<p>The <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries\">sdk-libraries<\/a> repo\ncarries a documented TinyGo recipe (<code>wasip2<\/code> target + generated bindings),\nsame shape as the other SDKs. Experimental — no packaged SDK yet.<\/p>\n<h2>The ABI contract<\/h2>\n<p>A library component exports one interface\n(<code>wit/library.wit<\/code> in this repo, vendored into each SDK repo):<\/p>\n<pre><code class=\"language-wit\">info: func() -&gt; string;   // JSON: { name, version, functions: […] }\ninit: func(config-json: string) -&gt; result&lt;_, string&gt;;\ncall: func(ctx: context, func-name: string, args-json: string)\n    -&gt; result&lt;string, string&gt;;\n<\/code><\/pre>\n<p>Arguments and results are JSON strings (every language has JSON; the\ndestination is always a payload slot). The engine accepts components built\nagainst WIT <code>perfscale:library@0.1.x<\/code> and <code>@0.2.x<\/code> — 0.2 adds\n<code>settings-json<\/code> to the call context; 0.1 components keep working and simply\nnever see it. Minors are additive-only; an unsupported major fails to load\nwith both versions named in the error.<\/p>\n<p>Functions marked <code>secret: true<\/code> in <code>info()<\/code> have every result masked\n(<code>***<\/code>) in the run log — minted credentials never leak into logs. Declare\nit on the outermost producing function; never derive-and-return partial\nsecrets.<\/p>\n<h2>Running and distributing your library<\/h2>\n<ul>\n<li><strong>Local iteration<\/strong>: declare <code>use: ./mylib.wasm<\/code> (path relative to the\ndeclaring YAML) and run — nothing else needed.<\/li>\n<li><strong>Distribution<\/strong>: HTTPS or\n<code>git+&lt;repo&gt;@&lt;ref&gt;#&lt;path&gt;<\/code> sources, fetched once by <code>perfscale install<\/code>\ninto the content-addressed cache and pinned in <code>perfscale.lock<\/code>; <code>run<\/code>\nand <code>lint<\/code> then work fully offline. A <code>sha256:<\/code> pin is recommended\n(verified on install) — without it the computed digest is pinned with a\nwarning.<\/li>\n<li><strong>Performance<\/strong>: <code>perfscale install<\/code> also <em>burns<\/em> each library — AOT\nprecompiles it to a native artifact, so runs deserialize instead of\nrecompiling per run. <code>perfscale burn -f test.yaml -o ./perfscale+libs<\/code>\ngoes further and embeds the libraries into a standalone binary copy —\none file to ship to load generators.<\/li>\n<li><strong>Capabilities<\/strong>: libraries run in a fail-closed wasmtime sandbox — see\nthe <a href=\"#/docs/core/libraries\">libraries guide<\/a> for the capability model.<\/li>\n<li><strong>Docker<\/strong>: the sdk-libraries repo carries a hermetic authoring image\n(<code>ts/docker/Dockerfile<\/code> — Node 24 + the published SDK; <code>docker build -t perfscale-library-build ts/docker<\/code>, then <code>docker run --rm -v \"$PWD:/src\" -w /src perfscale-library-build mylib.ts -o mylib.wasm<\/code>). Running\nlibraries in the engine's Docker images — mount layout, the install\ncache, burned standalone binaries — is covered in\n<a href=\"#/docs/core/docker\">Running perfscale in Docker<\/a>.<\/li>\n<\/ul>\n<h2>Links<\/h2>\n<ul>\n<li><a href=\"#/docs/core/libraries\">Libraries guide<\/a> — using libraries in tests<\/li>\n<li><a href=\"#/docs/yaml-reference\">YAML reference<\/a> — the full\n<code>libraries:<\/code> config surface<\/li>\n<li><a href=\"../rfcs/005-libraries.md\">RFC 005<\/a> — design rationale<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries\">Perfscale/sdk-libraries<\/a> —\nTS/JS SDK + Go recipe ·\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/library-random\">library-random<\/a> — author\ntemplate ·\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.npmjs.com/package/@perfscale/library-sdk\">@perfscale/library-sdk on npm<\/a><\/li>\n<\/ul>\n","html_ru":"<h1>SDK для библиотек<\/h1>\n<p>SDK для создания <strong>библиотек perfscale<\/strong> — WASM-компонентов, предоставляющих\nгенерирующие значения функции для токенов <code>${alias.fn(...)}<\/code> в полезной\nнагрузке тестов (RFC 005). Если вы хотите <em>использовать<\/em> библиотеки в тесте,\nначните с <a href=\"#/docs/core/libraries\">руководства по библиотекам<\/a>; эта страница — про\nнаписание собственных.<\/p>\n<p>Один ABI-контракт (<code>perfscale:library<\/code>, модель компонентов WASI Preview 2),\nодна форма SDK, три языка:<\/p>\n<table><thead><tr><th>Язык<\/th><th>Пакет<\/th><th>Статус<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Rust<\/strong><\/td><td><a href=\"../crates/perfscale-library-sdk\"><code>perfscale-library-sdk<\/code><\/a> (этот репозиторий)<\/td><td>Стабильный, версионируется вместе с движком<\/td><\/tr>\n<tr><td><strong>TypeScript / JavaScript<\/strong><\/td><td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.npmjs.com/package/@perfscale/library-sdk\"><code>@perfscale/library-sdk<\/code><\/a> (<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries\">sdk-libraries<\/a>)<\/td><td>Стабильный (v0.1.x)<\/td><\/tr>\n<tr><td><strong>Go<\/strong><\/td><td><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries/tree/main/go\">Рецепт на TinyGo<\/a><\/td><td>Экспериментальный (пакета SDK пока нет)<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Что даёт каждый SDK<\/h2>\n<p>SDK скрывает всю WIT-обвязку. Вы объявляете имя библиотеки и её функции;\nSDK предоставляет:<\/p>\n<ul>\n<li><strong><code>Ctx<\/code><\/strong> — контекст одного вызова: <code>message_seq<\/code>, <code>iteration_seq<\/code>,\n<code>vu_id<\/code>, <code>seed<\/code>, <code>time_ms<\/code> (плюс зафиксированный для прогона <code>settings_json<\/code>\nв ABI 0.2).<\/li>\n<li><strong><code>memo(key, fn)<\/code><\/strong> — повторное использование сгенерированного значения по\nключу в пределах одного сообщения: <code>${fix.id(new)}<\/code>, встреченный дважды в\nодном сообщении, даст один и тот же id.<\/li>\n<li><strong>PRNG с seed, бит-в-бит идентичный во всех SDK и во встроенном генераторе\nдвижка<\/strong> (xorshift64, тот же порядок выборок) — прогон с <code>seed:<\/code>\nвоспроизводится независимо от языка, на котором написана библиотека.\n<code>wasi:random<\/code> гостевым компонентам никогда не предоставляется; всю\nслучайность получайте из PRNG SDK.<\/li>\n<li><strong>Хелперы для аргументов<\/strong> с понятными авторам ошибками и <strong>тестовый стенд\nбез рантайма<\/strong> — юнит-тестируйте библиотеку на хосте, без wasm-рантайма.<\/li>\n<\/ul>\n<h2>Rust<\/h2>\n<p>Rust SDK находится в этом репозитории в\n<a href=\"../crates/perfscale-library-sdk\"><code>crates/perfscale-library-sdk<\/code><\/a> и\nпубликуется на crates.io. Rust ≥ 1.82 нативно генерирует компоненты WASI\nPreview 2 — cargo-component не нужен:<\/p>\n<pre><code class=\"language-rust\">#[perfscale::library(name = \"fixer-ids\", version = \"1.0.0\")]\nimpl Library for FixerIds {\n    fn functions(&amp;self) -&gt; Vec&lt;FunctionInfo&gt; { /* … */ }\n    fn init(&amp;mut self, config: &amp;Value, ctx: InitContext) -&gt; Result&lt;(), Error&gt; { /* … */ }\n    fn call(&amp;mut self, ctx: &amp;Ctx, f: &amp;str, args: &amp;Value) -&gt; Result&lt;String, Error&gt; {\n        ctx.memo(\"new\", || self.next_clordid())\n    }\n}\n<\/code><\/pre>\n<pre><code class=\"language-console\">$ rustup target add wasm32-wasip2\n$ cargo build --release --target wasm32-wasip2   # → target/wasm32-wasip2/release/&lt;name&gt;.wasm\n<\/code><\/pre>\n<p>Репозиторий <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/library-random\">library-random<\/a> —\nWASM-порт встроенного модуля движка <code>@std/random<\/code> — одновременно служит\nэталонной реализацией и шаблоном для авторов.<\/p>\n<h2>TypeScript / JavaScript<\/h2>\n<pre><code class=\"language-console\">$ npm install @perfscale/library-sdk     # requires Node.js ≥ 24\n<\/code><\/pre>\n<pre><code class=\"language-ts\">import { args, defineLibrary } from \"@perfscale/library-sdk\";\n\nexport default defineLibrary({\n  name: \"mylib\",\n  functions: {\n    token: {\n      description: \"Deterministic per-instance token; memo key reuses it within one message\",\n      call(argv, ctx) {\n        const mint = () =&gt; `tok-${ctx.rng().nextU64().toString(16)}`;\n        const key = args.optionalString(argv, 0);\n        return key === undefined ? mint() : ctx.memo(key, mint);\n      },\n    },\n  },\n});\n<\/code><\/pre>\n<p>Сборка в компонент — через встроенный CLI (ComponentizeJS встраивает\nJS-движок — так TS превращается в WASM):<\/p>\n<pre><code class=\"language-console\">$ npx perfscale-library-build mylib.ts -o mylib.wasm\n<\/code><\/pre>\n<p>Юнит-тесты без какого-либо WASM-рантайма:<\/p>\n<pre><code class=\"language-ts\">import assert from \"node:assert/strict\";\nimport { Ctx, testCall } from \"@perfscale/library-sdk\";\nimport lib from \"./mylib.ts\";\n\nconst ctx = new Ctx(42);\nassert.equal(testCall(lib, ctx, \"token\", []), testCall(lib, ctx, \"token\", []));\n<\/code><\/pre>\n<p>Примечание: компоненты jco всегда импортируют <code>wasi:filesystem/*<\/code> и\n<code>wasi:clocks/wall-clock<\/code>. TS-библиотека, которая никогда не обращается к\nфайлам или к системным часам, объявляет <code>\"pure\": true<\/code> в своём JSON из\n<code>info()<\/code> (TS SDK делает это за вас, когда библиотека включает эту опцию), и\nтогда ей <strong>не нужны<\/strong> ни разрешение <code>capabilities:<\/code>, ни\n<code>allow_library_capabilities: true<\/code>: движок линкует эти интерфейсы, чтобы\nкомпонент инстанцировался, но не подключает никаких preopen — любой\nреальный доступ к файлам завершится ошибкой во время выполнения. (Сам\n<strong>ключ<\/strong> <code>capabilities:<\/code> по-прежнему обязателен в каждой записи\n<code>libraries:<\/code> — для библиотеки без разрешений пишите <code>capabilities: []<\/code>;\nпропуск ключа — ошибка валидации.) TS-библиотека, которая действительно\nчитает файлы, по-прежнему объявляет <code>capabilities: [fs]<\/code> (preopen только на\nчтение к <code>fs_root<\/code> прогона) плюс <code>allow_library_capabilities: true<\/code>. Сборка\nуже вырезает <code>wasi:random<\/code>, <code>wasi:http<\/code> и таймеры.<\/p>\n<h2>Go<\/h2>\n<p>Репозиторий <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries\">sdk-libraries<\/a>\nсодержит документированный рецепт на TinyGo (таргет <code>wasip2<\/code> +\nсгенерированные биндинги) той же формы, что и остальные SDK.\nЭкспериментальный — пакетного SDK пока нет.<\/p>\n<h2>ABI-контракт<\/h2>\n<p>Библиотечный компонент экспортирует один интерфейс\n(<code>wit/library.wit<\/code> в этом репозитории, копируется в репозиторий каждого SDK):<\/p>\n<pre><code class=\"language-wit\">info: func() -&gt; string;   // JSON: { name, version, functions: […] }\ninit: func(config-json: string) -&gt; result&lt;_, string&gt;;\ncall: func(ctx: context, func-name: string, args-json: string)\n    -&gt; result&lt;string, string&gt;;\n<\/code><\/pre>\n<p>Аргументы и результаты — JSON-строки (JSON есть в любом языке, а назначение\n— всегда слот полезной нагрузки). Движок принимает компоненты, собранные под\nWIT <code>perfscale:library@0.1.x<\/code> и <code>@0.2.x<\/code> — 0.2 добавляет <code>settings-json<\/code> в\nконтекст вызова; компоненты 0.1 продолжают работать и просто никогда его не\nвидят. Минорные версии — строго аддитивные; неподдерживаемая мажорная версия\nне загружается, и в ошибке называются обе версии.<\/p>\n<p>У функций, помеченных <code>secret: true<\/code> в <code>info()<\/code>, каждый результат маскируется\n(<code>***<\/code>) в журнале прогона — сгенерированные учётные данные никогда не\nпопадают в логи. Объявляйте его на самой внешней производящей функции;\nникогда не возвращайте производные частичные секреты.<\/p>\n<h2>Запуск и распространение вашей библиотеки<\/h2>\n<ul>\n<li><strong>Локальная разработка<\/strong>: объявите <code>use: ./mylib.wasm<\/code> (путь относительно\nобъявляющего YAML) и запускайте — больше ничего не нужно.<\/li>\n<li><strong>Распространение<\/strong>: источники по HTTPS или\n<code>git+&lt;repo&gt;@&lt;ref&gt;#&lt;path&gt;<\/code>, скачиваются один раз командой <code>perfscale install<\/code>\nв контентно-адресуемый кэш и фиксируются в <code>perfscale.lock<\/code>; после этого\n<code>run<\/code> и <code>lint<\/code> работают полностью офлайн. Рекомендуется пин <code>sha256:<\/code>\n(проверяется при установке) — без него вычисленный дайджест фиксируется с\nпредупреждением.<\/li>\n<li><strong>Производительность<\/strong>: <code>perfscale install<\/code> также <em>прожигает<\/em> каждую\nбиблиотеку — AOT-прекомпилирует её в нативный артефакт, так что при\nпрогонах она десериализуется вместо перекомпиляции на каждый прогон.\n<code>perfscale burn -f test.yaml -o ./perfscale+libs<\/code> идёт дальше и встраивает\nбиблиотеки в автономную бинарную копию — один файл для доставки на\nгенераторы нагрузки.<\/li>\n<li><strong>Capabilities<\/strong>: библиотеки работают в fail-closed песочнице wasmtime —\nсм. модель разрешений в <a href=\"#/docs/core/libraries\">руководстве по библиотекам<\/a>.<\/li>\n<li><strong>Docker<\/strong>: репозиторий sdk-libraries содержит герметичный образ для\nавторов (<code>ts/docker/Dockerfile<\/code> — Node 24 + опубликованный SDK;\n<code>docker build -t perfscale-library-build ts/docker<\/code>, затем\n<code>docker run --rm -v \"$PWD:/src\" -w /src perfscale-library-build mylib.ts -o mylib.wasm<\/code>). Запуск библиотек в Docker-образах движка — схема монтирования,\nкэш установки, прожжённые автономные бинарники — описан в\n<a href=\"#/docs/core/docker\">Запуск perfscale в Docker<\/a>.<\/li>\n<\/ul>\n<h2>Ссылки<\/h2>\n<ul>\n<li><a href=\"#/docs/core/libraries\">Руководство по библиотекам<\/a> — использование библиотек\nв тестах<\/li>\n<li><a href=\"#/docs/yaml-reference\">Справочник YAML<\/a> — вся поверхность\nконфигурации <code>libraries:<\/code><\/li>\n<li><a href=\"../rfcs/005-libraries.md\">RFC 005<\/a> — обоснование дизайна<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries\">Perfscale/sdk-libraries<\/a> —\nTS/JS SDK + рецепт на Go ·\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/library-random\">library-random<\/a> — шаблон для\nавторов ·\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.npmjs.com/package/@perfscale/library-sdk\">@perfscale/library-sdk в npm<\/a><\/li>\n<\/ul>\n","slug":"library-sdk","title":"Library SDKs"},{"group":"top","html_en":"<h1>MCP server<\/h1>\n<p><code>@perfscale/mcp<\/code> is a <a target=\"_blank\" rel=\"noopener\" href=\"https://modelcontextprotocol.io\">Model Context Protocol<\/a>\nserver that exposes the perfscale CLI to AI agents (Claude Code, Claude\nDesktop, and any other MCP client). The agent can author test YAML with\nschema-validated writes, run load tests, and read back structured metrics —\nwithout shell access.<\/p>\n<p>Source: <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/mcp\">Perfscale/mcp<\/a>. For the hosted\nplatform (machines, runs, dashboards on perfscale.su/.ru) see the\n<code>@perfscale/controlplane-mcp<\/code> server in the same repository.<\/p>\n<h2>Setup<\/h2>\n<p>Requires the <code>perfscale<\/code> binary on <code>PATH<\/code> (override with <code>PERFSCALE_BIN<\/code>) and\nNode.js 20+.<\/p>\n<pre><code class=\"language-json\">{\n  \"mcpServers\": {\n    \"perfscale\": {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"@perfscale/mcp\"]\n    }\n  }\n}\n<\/code><\/pre>\n<p>With Claude Code:<\/p>\n<pre><code class=\"language-sh\">claude mcp add perfscale -- npx -y @perfscale/mcp\n<\/code><\/pre>\n<h2>Tools<\/h2>\n<table><thead><tr><th>Tool<\/th><th>What it does<\/th><\/tr><\/thead><tbody>\n<tr><td><code>run_test<\/code><\/td><td>Run a k6/locust/native test (<code>perfscale run<\/code>), return exit code + parsed <a href=\"#/docs/cli/commands\">summary export<\/a><\/td><\/tr>\n<tr><td><code>lint<\/code><\/td><td>Validate YAML files (<code>perfscale lint<\/code>), including typo and action-ID checks<\/td><\/tr>\n<tr><td><code>get_schema<\/code><\/td><td>JSON Schema for <code>test<\/code> or <code>config<\/code> YAML (<code>perfscale schema<\/code>)<\/td><\/tr>\n<tr><td><code>parse_summary<\/code><\/td><td>Parse raw k6-compatible output into structured metrics<\/td><\/tr>\n<tr><td><code>list_actions<\/code><\/td><td>Catalog of native <code>std/*<\/code> step actions<\/td><\/tr>\n<tr><td><code>list_configs<\/code><\/td><td>Recursively list YAML files in a directory, classified test/config<\/td><\/tr>\n<tr><td><code>read_config<\/code><\/td><td>Read one YAML file with its detected kind<\/td><\/tr>\n<tr><td><code>write_test<\/code><\/td><td>Create/overwrite a test definition, then lint it against the test schema<\/td><\/tr>\n<tr><td><code>write_config<\/code><\/td><td>Create/overwrite a run config, then lint it against the config schema<\/td><\/tr>\n<tr><td><code>update_config<\/code><\/td><td>Overwrite an existing file only (fails when absent), then lint<\/td><\/tr>\n<tr><td><code>remove_config<\/code><\/td><td>Delete a test/config YAML file<\/td><\/tr>\n<\/tbody><\/table>\n<p>Every write is linted immediately — the agent sees schema violations in the\nsame tool result, so invalid YAML never silently lands on disk.<\/p>\n<h2>Environment variables<\/h2>\n<table><thead><tr><th>Variable<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>PERFSCALE_BIN<\/code><\/td><td><code>perfscale<\/code><\/td><td>Path to the perfscale binary<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Notes<\/h2>\n<ul>\n<li><code>get_schema<\/code> requires a perfscale build with the <code>schema<\/code> subcommand — run\n<code>perfscale self-update<\/code> if you see an error mentioning it.<\/li>\n<li><code>run_test<\/code> executes locally with the same semantics as\n<a href=\"#/docs/cli/commands\"><code>perfscale run<\/code><\/a>: exactly one of\nk6/locust/file, and native tests require a config.<\/li>\n<\/ul>\n","html_ru":"<h1>MCP-сервер<\/h1>\n<p><code>@perfscale/mcp<\/code> — это сервер <a target=\"_blank\" rel=\"noopener\" href=\"https://modelcontextprotocol.io\">Model Context Protocol<\/a>,\nкоторый предоставляет CLI perfscale AI-агентам (Claude Code, Claude\nDesktop и любому другому MCP-клиенту). Агент может создавать YAML тестов с\nвалидацией записей по схеме, запускать нагрузочные тесты и читать структурированные\nметрики — без доступа к shell.<\/p>\n<p>Исходный код: <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/mcp\">Perfscale/mcp<\/a>. Для облачной\nплатформы (машины, запуски, дашборды на perfscale.su/.ru) см. сервер\n<code>@perfscale/controlplane-mcp<\/code> в том же репозитории.<\/p>\n<h2>Установка<\/h2>\n<p>Требуется бинарный файл <code>perfscale<\/code>, доступный в <code>PATH<\/code> (можно переопределить через <code>PERFSCALE_BIN<\/code>), и\nNode.js 20+.<\/p>\n<pre><code class=\"language-json\">{\n  \"mcpServers\": {\n    \"perfscale\": {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"@perfscale/mcp\"]\n    }\n  }\n}\n<\/code><\/pre>\n<p>С Claude Code:<\/p>\n<pre><code class=\"language-sh\">claude mcp add perfscale -- npx -y @perfscale/mcp\n<\/code><\/pre>\n<h2>Инструменты<\/h2>\n<table><thead><tr><th>Инструмент<\/th><th>Что делает<\/th><\/tr><\/thead><tbody>\n<tr><td><code>run_test<\/code><\/td><td>Запускает тест k6/locust/native (<code>perfscale run<\/code>), возвращает код выхода + разобранный <a href=\"#/docs/cli/commands\">экспорт сводки<\/a><\/td><\/tr>\n<tr><td><code>lint<\/code><\/td><td>Валидирует YAML-файлы (<code>perfscale lint<\/code>), включая проверки опечаток и идентификаторов действий<\/td><\/tr>\n<tr><td><code>get_schema<\/code><\/td><td>JSON Schema для YAML <code>test<\/code> или <code>config<\/code> (<code>perfscale schema<\/code>)<\/td><\/tr>\n<tr><td><code>parse_summary<\/code><\/td><td>Разбирает сырой k6-совместимый вывод в структурированные метрики<\/td><\/tr>\n<tr><td><code>list_actions<\/code><\/td><td>Каталог встроенных действий шагов <code>std/*<\/code><\/td><\/tr>\n<tr><td><code>list_configs<\/code><\/td><td>Рекурсивно перечисляет YAML-файлы в каталоге, классифицируя их как test/config<\/td><\/tr>\n<tr><td><code>read_config<\/code><\/td><td>Читает один YAML-файл с определением его типа<\/td><\/tr>\n<tr><td><code>write_test<\/code><\/td><td>Создаёт/перезаписывает определение теста, затем проверяет его по схеме теста<\/td><\/tr>\n<tr><td><code>write_config<\/code><\/td><td>Создаёт/перезаписывает конфигурацию запуска, затем проверяет её по схеме конфигурации<\/td><\/tr>\n<tr><td><code>update_config<\/code><\/td><td>Перезаписывает только существующий файл (завершается ошибкой при его отсутствии), затем проверяет<\/td><\/tr>\n<tr><td><code>remove_config<\/code><\/td><td>Удаляет YAML-файл теста/конфигурации<\/td><\/tr>\n<\/tbody><\/table>\n<p>Каждая запись сразу проходит валидацию — агент видит нарушения схемы в\nтом же результате инструмента, поэтому некорректный YAML никогда не попадает\nна диск незамеченным.<\/p>\n<h2>Переменные окружения<\/h2>\n<table><thead><tr><th>Переменная<\/th><th>Значение по умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>PERFSCALE_BIN<\/code><\/td><td><code>perfscale<\/code><\/td><td>Путь к бинарному файлу perfscale<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Примечания<\/h2>\n<ul>\n<li><code>get_schema<\/code> требует сборку perfscale с подкомандой <code>schema<\/code> — выполните\n<code>perfscale self-update<\/code>, если видите ошибку с её упоминанием.<\/li>\n<li><code>run_test<\/code> выполняется локально с той же семантикой, что и\n<a href=\"#/docs/cli/commands\"><code>perfscale run<\/code><\/a>: ровно один вариант из\nk6/locust/файл, а для нативных тестов требуется конфигурация.<\/li>\n<\/ul>\n","slug":"mcp","title":"MCP server"},{"group":"top","html_en":"<h1>YAML reference<\/h1>\n<p>Two files drive a native run: the <strong>test definition<\/strong> (<code>-f<\/code>) describes <em>what<\/em>\nto do; the <strong>config<\/strong> (<code>-c<\/code>) describes <em>how much load<\/em> to apply.<\/p>\n<p>Both are validated against JSON Schemas before execution — errors point at\nthe offending field path, not a raw parser dump. The schemas live in\n<a href=\"../schema/\"><code>schema/<\/code><\/a> and can drive editor autocomplete via a modeline:<\/p>\n<pre><code class=\"language-yaml\"># yaml-language-server: $schema=https://raw.githubusercontent.com/Perfscale/perfscale/main/schema/test.schema.json\n<\/code><\/pre>\n<h2>Test definition (<code>-f test.yaml<\/code>)<\/h2>\n<p>A single <code>steps<\/code> array. Each virtual user (VU) executes the whole list in a\nloop until the configured duration expires. An optional top-level <code>import:<\/code>\ninherits a base document — see\n<a href=\"#composing-documents-import\">Composing documents<\/a>. An optional top-level\n<code>libraries:<\/code> declares value-generator libraries for <code>${alias.fn(...)}<\/code>\ntokens — see <a href=\"#libraries-libraries\">Libraries<\/a>.<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: login                     # optional label used in log output\n    use: std/http@v1                # required — action ID\n    with:                           # action parameters (see below)\n      method: POST\n      url: https://api.example.com/login\n      body:\n        user: demo\n    check:                          # optional inline assertions\n      status: 200\n      duration_ms_lt: 500\n    outputs: login                  # optional — store output for later steps\n<\/code><\/pre>\n<h3>Step fields<\/h3>\n<table><thead><tr><th>Field<\/th><th>Required<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>use<\/code><\/td><td>yes<\/td><td>Action ID: <code>std/http@v1<\/code>, <code>std/graphql@v1<\/code>, <code>std/tcp@v1<\/code>, <code>std/udp@v1<\/code>, <code>std/pubsub@v1<\/code>, <code>std/llm@v1<\/code>, <code>std/ws@v1<\/code>, <code>std/ws-connect@v1<\/code>, <code>std/ws-send@v1<\/code>, <code>std/ws-recv@v1<\/code>, <code>std/ws-ping@v1<\/code>, <code>std/ws-close@v1<\/code>, <code>std/grpc@v1<\/code>, <code>std/grpc-connect@v1<\/code>, <code>std/grpc-call@v1<\/code>, <code>std/grpc-stream-open@v1<\/code>, <code>std/grpc-stream-send@v1<\/code>, <code>std/grpc-stream-recv@v1<\/code>, <code>std/grpc-stream-close@v1<\/code>, <code>std/db-connect@v1<\/code>, <code>std/db-query@v1<\/code>, <code>std/db-tx-begin@v1<\/code>, <code>std/db-tx-commit@v1<\/code>, <code>std/db-tx-rollback@v1<\/code>, <code>std/db-close@v1<\/code>, <code>std/check@v1<\/code>, <code>std/sleep@v1<\/code>, <code>std/log@v1<\/code>, <code>std/file-read@v1<\/code>, <code>std/file-write@v1<\/code>, <code>std/child_process@v1<\/code>, <code>std/kill_process@v1<\/code>, <code>std/thresholds@v1<\/code>, <code>std/set_shared_variable@v1<\/code>, <code>std/get_shared_variable@v1<\/code> (short aliases <code>http<\/code>, <code>graphql<\/code>, <code>tcp<\/code>, <code>udp<\/code>, <code>pubsub<\/code>, <code>llm<\/code>, <code>ws<\/code>, <code>ws-connect<\/code>, <code>ws-send<\/code>, <code>ws-recv<\/code>, <code>ws-ping<\/code>, <code>ws-close<\/code>, <code>grpc<\/code>, <code>grpc-connect<\/code>, <code>grpc-call<\/code>, <code>grpc-stream-open<\/code>, <code>grpc-stream-send<\/code>, <code>grpc-stream-recv<\/code>, <code>grpc-stream-close<\/code>, <code>db-connect<\/code>, <code>db-query<\/code>, <code>db-tx-begin<\/code>, <code>db-tx-commit<\/code>, <code>db-tx-rollback<\/code>, <code>db-close<\/code>, <code>check<\/code>, <code>sleep<\/code>, <code>log<\/code>, <code>file-read<\/code>, <code>file-write<\/code>, <code>child_process<\/code>, <code>kill_process<\/code>, <code>thresholds<\/code>, <code>set_shared_variable<\/code>, <code>get_shared_variable<\/code> also work). <code>uses:<\/code> is accepted as an alias for <code>use:<\/code><\/td><\/tr>\n<tr><td><code>name<\/code><\/td><td>no<\/td><td>Human-readable label shown in log lines<\/td><\/tr>\n<tr><td><code>with<\/code><\/td><td>no<\/td><td>Action parameters — see <a href=\"#/docs/core/actions\">Actions<\/a><\/td><\/tr>\n<tr><td><code>check<\/code><\/td><td>no<\/td><td>Assertions on this step's output — same keys as <code>std/check@v1<\/code><\/td><\/tr>\n<tr><td><code>outputs<\/code><\/td><td>no<\/td><td>Variable name to store the step output under<\/td><\/tr>\n<tr><td><code>severity<\/code><\/td><td>no<\/td><td><code>std/thresholds@v1<\/code> only: what a violated gate becomes — <code>fail<\/code> (default; the run exits non-zero), <code>warn<\/code>, or <code>info<\/code><\/td><\/tr>\n<tr><td><code>message<\/code><\/td><td>no<\/td><td><code>std/thresholds@v1<\/code> only: custom label appended to the violation summary (interpolated)<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Variables (<code>${{ ... }}<\/code>)<\/h3>\n<p>Steps pass data to later steps through GitHub-Actions-style placeholders.\nA step stores its output under the name given by <code>outputs:<\/code>; any <strong>string\nvalue<\/strong> in a later step's <code>with:<\/code> or <code>check:<\/code> can then reference it:<\/p>\n<table><thead><tr><th>Expression<\/th><th>Resolves to<\/th><\/tr><\/thead><tbody>\n<tr><td><code>${{ name }}<\/code><\/td><td>The whole stored output, stringified<\/td><\/tr>\n<tr><td><code>${{ name.field }}<\/code><\/td><td>One field of a stored object (e.g. <code>.status<\/code>, <code>.body<\/code>, <code>.duration_ms<\/code>)<\/td><\/tr>\n<tr><td><code>${{ name.a.b }}<\/code><\/td><td>Nested path — one JSON level per <code>.<\/code>, e.g. <code>${{ resp.headers.x-request-id }}<\/code><\/td><\/tr>\n<tr><td><code>${{ __last__ }}<\/code> / <code>${{ __last__.field }}<\/code><\/td><td>The immediately preceding step's output — always available, no <code>outputs:<\/code> needed<\/td><\/tr>\n<tr><td><code>${{ config.&lt;name&gt;.&lt;field&gt; }}<\/code><\/td><td>Output of a config-file <code>before:<\/code> setup step (see <a href=\"#config--c-configyaml\">Config<\/a>)<\/td><\/tr>\n<tr><td><code>${{ vars.&lt;key&gt; }}<\/code><\/td><td>A static value from the config file's <code>variables:<\/code> block<\/td><\/tr>\n<tr><td><code>${{ env.NAME }}<\/code><\/td><td>Process environment variable <code>NAME<\/code> — for secrets (<code>api_key<\/code>, tokens, DSNs) that must not live in the YAML<\/td><\/tr>\n<\/tbody><\/table>\n<p>For <code>std/http@v1<\/code> the stored output is\n<code>{ \"status\": &lt;int&gt;, \"body\": &lt;string&gt;, \"duration_ms\": &lt;float&gt;, \"headers\": &lt;object&gt; }<\/code>\n— header names lowercase, so a session/token header from response 1 can flow\ninto request 2:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - use: std/http@v1\n    with: { url: \"https://api.example.com/first\" }\n    outputs: r1\n  - use: std/http@v1\n    with:\n      url: \"https://api.example.com/second\"\n      headers:\n        x-session: \"${{ r1.headers.x-session }}\"\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">steps:\n  - name: login\n    use: std/http@v1\n    with:\n      method: POST\n      url: \"https://api.example.com/token\"\n      body: { user: demo }\n    outputs: auth                          # ← stored as `auth`\n\n  - name: fetch profile\n    use: std/http@v1\n    with:\n      url: \"https://api.example.com/me\"\n      headers:\n        authorization: \"Bearer ${{ auth.body }}\"   # nested values work\n    check:\n      body_contains: \"${{ auth.body }}\"            # check values too\n\n  - use: std/log@v1\n    with:\n      message: \"login took ${{ auth.duration_ms }}ms → ${{ auth.status }}\"\n<\/code><\/pre>\n<p>Rules and edge cases:<\/p>\n<ul>\n<li>Placeholders work in string values at <strong>any depth<\/strong> of <code>with<\/code>/<code>check<\/code> —\nnested objects (headers), array elements, bodies. Keys are never\ninterpolated.<\/li>\n<li>Whitespace inside the braces is ignored: <code>${{auth.status}}<\/code> ≡\n<code>${{ auth.status }}<\/code>.<\/li>\n<li>A <strong>missing variable or field resolves to an empty string<\/strong> — the run does\nnot fail. Gate on the value with <code>check:<\/code> when absence should be an error.\n<strong>Exception:<\/strong> <code>${{ env.NAME }}<\/code> with <code>NAME<\/code> unset <strong>fails the step<\/strong> with\n<code>env var 'NAME' is not set<\/code> before the action runs — a silently empty\n<code>api_key<\/code> would surface as a confusing 401 from the API instead.<\/li>\n<li><code>${{ env.NAME }}<\/code> reads the process environment of the <code>perfscale<\/code> run\n(everything after <code>env.<\/code> is the variable name). <code>env<\/code> is a reserved\nprefix: a stored output literally named <code>env<\/code> is shadowed by it. Resolved\nvalues are substituted into step parameters only — the engine never\nwrites them to logs or summaries itself. It also records every resolved\n<code>env.*<\/code> value into a run-scoped registry and <strong>masks it in the run log<\/strong>:\nvalues of 4+ characters are replaced with <code>***<\/code> wherever they occur\n(inside URLs and DSNs too), shorter values only as whole tokens — so a\nsecret that slips into a request URL or a <code>std/log@v1<\/code> message still\ncannot leak into the output. This is why <code>env.*<\/code> is the right channel\nfor secrets.<\/li>\n<li>Path segments descend one JSON object level per <code>.<\/code> — header names with\ndots in them cannot be addressed (rare; everything else works).<\/li>\n<li>Placeholders are resolved per virtual user, per iteration — each VU sees\nthe outputs of its own step chain, never another VU's.<\/li>\n<li>Steps without any <code>${{<\/code> are executed as-is: the engine skips the\ninterpolation pass entirely, so plain steps pay zero overhead for this\nfeature.<\/li>\n<li>YAML quoting: both plain (<code>Bearer ${{ auth.body }}<\/code>) and quoted\n(<code>\"${{ auth.body }}\"<\/code>) scalars work; quote when the value starts with a\ncharacter YAML treats specially (<code>{<\/code>, <code>[<\/code>, <code>*<\/code>, …).<\/li>\n<\/ul>\n<h2>Config (<code>-c config.yaml<\/code>)<\/h2>\n<pre><code class=\"language-yaml\">vus: 10          # virtual users, default 1\nduration: 5m     # \"30s\", \"500ms\", \"1.5s\", \"1m\", \"5m30s\", \"1h\" — default \"1m\"\n\nreport:          # optional — forward metrics to a perfscale serve instance\n  url: http://localhost:7999\n  during_run: true      # also stream cumulative snapshots while running\n\ngpu:             # optional — GPU metrics during the run (native engine)\n  enabled: true\n  interval_ms: 1000\n  source: nvidia-smi\n<\/code><\/pre>\n<table><thead><tr><th>Field<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>vus<\/code><\/td><td><code>1<\/code><\/td><td>Concurrent virtual users (fixed profile)<\/td><\/tr>\n<tr><td><code>duration<\/code><\/td><td><code>1m<\/code><\/td><td>Wall-clock run length; bare numbers are seconds; sub-second values (<code>\"500ms\"<\/code>, <code>\"1.5s\"<\/code>) are honored by the native engine<\/td><\/tr>\n<tr><td><code>stages<\/code><\/td><td>—<\/td><td>Ramping-VU profile (k6-style): list of <code>{ duration, target }<\/code> stages. Overrides <code>vus<\/code>/<code>duration<\/code>; mutually exclusive with <code>arrival<\/code>. Native engine only<\/td><\/tr>\n<tr><td><code>arrival<\/code><\/td><td>—<\/td><td>Arrival-rate profile (open model): <code>{ max_vus, pre_allocated_vus?, stages: [{ duration, rate }] }<\/code> — hold an iterations/sec rate. Mutually exclusive with <code>stages<\/code>. Native engine only<\/td><\/tr>\n<tr><td><code>report.url<\/code><\/td><td>—<\/td><td>A <code>perfscale serve<\/code> base URL; the CLI <code>--report<\/code> flag overrides it<\/td><\/tr>\n<tr><td><code>report.during_run<\/code><\/td><td><code>false<\/code><\/td><td>Also stream cumulative metric snapshots during the run (batched POSTs to <code>&lt;url&gt;/api/v1/metrics<\/code>), not just the summary at the end — see <a href=\"#/docs/core/metrics\">During-run metrics<\/a>. Native engine only<\/td><\/tr>\n<tr><td><code>report.interval_ms<\/code><\/td><td><code>5000<\/code><\/td><td>During-run snapshot/flush interval, milliseconds (min 1000)<\/td><\/tr>\n<tr><td><code>report.batch_size<\/code><\/td><td><code>500<\/code><\/td><td>Flush a batch once it holds this many samples<\/td><\/tr>\n<tr><td><code>report.max_cpu_percent<\/code><\/td><td><code>90<\/code><\/td><td>CPU gate: while host CPU% ≥ this, batches are held (no POSTs) and snapshots queued — never dropped — until the gate opens; <code>0<\/code> disables; inert off-Linux<\/td><\/tr>\n<tr><td><code>report.max_pending<\/code><\/td><td><code>24<\/code><\/td><td>Soft cap on undelivered batches — crossing it warns, but batches are kept and delivered in order, never dropped mid-run<\/td><\/tr>\n<tr><td><code>gpu<\/code><\/td><td>—<\/td><td>GPU metrics collection — see <a href=\"#gpu-metrics-gpu\">GPU metrics<\/a>. Native engine only<\/td><\/tr>\n<tr><td><code>engine_metrics<\/code><\/td><td>—<\/td><td>Engine self-observability — see <a href=\"#engine-self-metrics-engine_metrics\">Engine self-metrics<\/a>. Native engine only<\/td><\/tr>\n<tr><td><code>before<\/code><\/td><td><code>[]<\/code><\/td><td>One-time setup steps — see <a href=\"#setup-and-variables\">Setup and variables<\/a><\/td><\/tr>\n<tr><td><code>after<\/code><\/td><td><code>[]<\/code><\/td><td>One-time teardown steps — see <a href=\"#teardown-after\">Teardown<\/a><\/td><\/tr>\n<tr><td><code>variables<\/code><\/td><td><code>{}<\/code><\/td><td>Static values exposed to steps as <code>${{ vars.* }}<\/code>. Keep secrets out of this block — it is plain YAML, checked into repos and shown in diffs; use <code>${{ env.NAME }}<\/code> (process environment, masked in run logs) for those<\/td><\/tr>\n<tr><td><code>shared_variables<\/code><\/td><td><code>{}<\/code><\/td><td>Mutable cross-VU shared state for <code>std/set_shared_variable@v1<\/code> / <code>std/get_shared_variable@v1<\/code>: a map of name → initial JSON value (the type is inferred from it). Declaring is mandatory — a step referencing an undeclared name, or an <code>op<\/code> incompatible with the declared type, fails validation before the run starts. See <a href=\"#/docs/core/shared-variables\">Shared variables guide<\/a>. Native engine only<\/td><\/tr>\n<tr><td><code>allow_process_actions<\/code><\/td><td><code>false<\/code><\/td><td>Let steps spawn/signal OS processes (<code>std/child_process@v1<\/code>, <code>std/kill_process@v1<\/code>). Fail-closed: a step list from an untrusted source cannot touch processes until you opt in<\/td><\/tr>\n<tr><td><code>allow_library_capabilities<\/code><\/td><td><code>false<\/code><\/td><td>Let <code>libraries:<\/code> entries carry non-empty <code>capabilities:<\/code> grants. Fail-closed, same pattern as <code>allow_file_actions<\/code><\/td><\/tr>\n<tr><td><code>seed<\/code><\/td><td>—<\/td><td>Run-level determinism seed: every <code>${…}<\/code> generator and library instance derives its seed as <code>hash(seed, vu_id, conn_seq)<\/code>, so a seeded run reproduces the same generated values. Wall-clock time stays non-deterministic<\/td><\/tr>\n<tr><td><code>max_response_body_bytes<\/code><\/td><td><code>16777216<\/code> (16 MiB)<\/td><td>Response body cap for <code>std/http@v1<\/code> / <code>std/graphql@v1<\/code>. A larger response fails the step with a clear error (never silently truncated — a truncated body could pass a <code>check:<\/code>). Native engine only<\/td><\/tr>\n<tr><td><code>libraries<\/code><\/td><td>—<\/td><td>Value-generator libraries for <code>${alias.fn(...)}<\/code> tokens — see <a href=\"#libraries-libraries\">Libraries<\/a><\/td><\/tr>\n<tr><td><code>import<\/code><\/td><td>—<\/td><td>Base document to inherit from — see <a href=\"#composing-documents-import\">Composing documents<\/a><\/td><\/tr>\n<\/tbody><\/table>\n<h3>GPU metrics (<code>gpu:<\/code>)<\/h3>\n<p>Sample the host's GPUs (utilization, VRAM, temperature, power) for the whole\nrun and land a <code>gpu<\/code> section in the run summary — primarily to correlate\n<a href=\"#/docs/core/llm\"><code>std/llm@v1<\/code>
