code> detects this (the executable lives\nunder <code>node_modules/@perfscale/<\/code>) and refuses with the right command instead:<\/p>\n<pre><code class=\"language-sh\">npm install -g @perfscale/exe@latest\n<\/code><\/pre>\n<p><code>--check<\/code> still works, and the passive hint below suggests the npm command\nfor npm installs automatically.<\/p>\n<h3>The passive \"update available\" hint<\/h3>\n<p>Other commands (<code>run<\/code>, <code>serve<\/code>, <code>lint<\/code>) print a one-line stderr hint\nwhen a newer release is known:<\/p>\n<pre><code class=\"language-text\">perfscale v0.2.0 is available (you have 0.1.0) — run `perfscale self-update`\n<\/code><\/pre>\n<p>The check is deliberately unobtrusive: at most one network call per 24h\n(cached in the user cache dir), only in interactive terminals (never in CI\nlogs or pipes), never delays a command by more than ~2s, and silent when\noffline.<\/p>\n<table><thead><tr><th>Variable<\/th><th>Effect<\/th><\/tr><\/thead><tbody>\n<tr><td><code>PERFSCALE_NO_UPDATE_CHECK=1<\/code><\/td><td>Disable the passive check and hint entirely<\/td><\/tr>\n<tr><td><code>PERFSCALE_UPDATE_API_BASE<\/code><\/td><td>Override the release API host (default <code>https://api.github.com<\/code>) — for mirrors/proxies<\/td><\/tr>\n<tr><td><code>PERFSCALE_UPDATE_DOWNLOAD_BASE<\/code><\/td><td>Override the asset download host (default <code>https://github.com<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n<h2><code>perfscale cache<\/code><\/h2>\n<p>The import/library cache (<code>~/.cache/perfscale<\/code>, overridable with\n<code>PERFSCALE_CACHE_DIR<\/code>) grows without bound: every fetched remote import and\nevery compiled WASM artifact is content-addressed and kept forever. Clean it\nexplicitly:<\/p>\n<pre><code class=\"language-sh\">perfscale cache clean              # remove all cached imports + library artifacts\nperfscale cache clean --dry-run    # only show what would be freed\n<\/code><\/pre>\n<p>Eviction is always safe — everything in the cache is re-fetchable: the next\n<code>perfscale install<\/code> or <code>run<\/code> rebuilds what a pinned <code>perfscale.lock<\/code>\nreferences (at the cost of one refetch/recompile).<\/p>\n<h2>Environment variables<\/h2>\n<table><thead><tr><th>Name<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>RUST_LOG<\/code><\/td><td><code>tracing<\/code> filter, e.g. <code>RUST_LOG=debug perfscale run ...<\/code><\/td><\/tr>\n<tr><td><code>PERFSCALE_NO_UPDATE_CHECK<\/code><\/td><td><code>1<\/code> disables the update-available hint<\/td><\/tr>\n<tr><td><code>PERFSCALE_CACHE_DIR<\/code><\/td><td>Cache root for <code>import:<\/code> git clones and installed libraries (default <code>~/.cache/perfscale<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n","html_ru":"<h1>Команды CLI<\/h1>\n<pre><code class=\"language-text\">perfscale run          Run a load test with k6, locust, JMeter, or the native step engine\nperfscale serve        Start a local dev server that receives metrics from `run --report`\nperfscale lint         Validate test/config YAML files without running them\nperfscale install      Fetch remote libraries and pin them in perfscale.lock\nperfscale burn         Build a standalone binary with WASM libraries embedded\nperfscale schema       Print the JSON Schema for test or config YAML files\nperfscale metrics      List every metric the registered families declare\nperfscale man          Print the bundled man page (or install it for `man perfscale`)\nperfscale self-update  Update perfscale to the latest release for this platform\nperfscale cache        Manage the local import/library cache (~/.cache/perfscale)\n<\/code><\/pre>\n<h2><code>perfscale run<\/code><\/h2>\n<p>Требуется ровно один флаг движка: <code>--k6<\/code>, <code>--locust<\/code>, <code>--jmeter<\/code> или <code>-f<\/code>.<\/p>\n<table><thead><tr><th>Флаг<\/th><th>Значение<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>--k6 &lt;FILE&gt;<\/code><\/td><td><code>.js<\/code>-скрипт<\/td><td>Запуск через бинарник <code>k6<\/code> из <code>PATH<\/code><\/td><\/tr>\n<tr><td><code>--locust &lt;FILE&gt;<\/code><\/td><td>locustfile<\/td><td>Запуск через бинарник <code>locust<\/code> из <code>PATH<\/code>, в headless-режиме<\/td><\/tr>\n<tr><td><code>--jmeter &lt;FILE&gt;<\/code><\/td><td><code>.jmx<\/code> тест-план<\/td><td>Запуск через бинарник <code>jmeter<\/code> из <code>PATH<\/code>, без GUI (<code>jmeter -n -t<\/code>). План сам определяет профиль нагрузки — конфигурация perfscale не применяется<\/td><\/tr>\n<tr><td><code>-f, --file &lt;FILE&gt;<\/code><\/td><td><code>test.yaml<\/code><\/td><td>Запуск со встроенным нативным движком (требует <code>-c<\/code>)<\/td><\/tr>\n<tr><td><code>-c, --config &lt;FILE&gt;<\/code><\/td><td><code>config.yaml<\/code><\/td><td>Конфигурация нагрузки: <code>vus<\/code>, <code>duration<\/code>, опционально <code>report.url<\/code>. Обязателен с <code>-f<\/code>, для <code>--locust<\/code> — опциональная подсказка о нагрузке, для <code>--k6<\/code> и <code>--jmeter<\/code> игнорируется<\/td><\/tr>\n<tr><td><code>--host &lt;URL&gt;<\/code><\/td><td>базовый URL<\/td><td>Целевой хост для <code>--locust<\/code> (аналог <code>--host<\/code> у locust)<\/td><\/tr>\n<tr><td><code>--report &lt;URL&gt;<\/code><\/td><td>базовый URL<\/td><td>Отправить POST-запросом итоговую сводку на экземпляр <code>perfscale serve<\/code> после прогона; переопределяет <code>report.url<\/code> из конфигурационного файла<\/td><\/tr>\n<tr><td><code>-q, --quiet<\/code><\/td><td>—<\/td><td>Подавить вывод по каждому запросу; ошибки и итоговая сводка метрик по-прежнему печатаются. Нативный движок отбрасывает эти строки прямо у источника, что заодно убирает накладные расходы на их форматирование и ввод-вывод под высокой нагрузкой<\/td><\/tr>\n<tr><td><code>--summary-export &lt;FILE&gt;<\/code><\/td><td>путь, повторяемый<\/td><td>После прогона записать в этот файл разобранную сводку метрик (запросы, RPS, перцентили задержки, доля ошибок) вместе с метаданными прогона (движок, VU, длительность, метка времени, версия perfscale). Повторите флаг, чтобы записать несколько экспортов за один прогон. Расширение <code>.md<\/code>/<code>.json<\/code> выбирает формат для каждого файла (по умолчанию JSON)<\/td><\/tr>\n<tr><td><code>--summary-format &lt;json|md&gt;<\/code><\/td><td>вместе с <code>--summary-export<\/code><\/td><td>Формат для файлов экспорта без распознанного расширения. <code>md<\/code> рендерит таблицу для сводок заданий CI: <code>--summary-export \"$GITHUB_STEP_SUMMARY\" --summary-format md<\/code><\/td><\/tr>\n<tr><td><code>--allow-remote-import<\/code><\/td><td>—<\/td><td>Разрешить <code>import:<\/code> в документах <code>-f<\/code>/<code>-c<\/code> загружаться по сети (http(s) URL, git-репозитории). По умолчанию запрещено (fail-closed) — документ не может сам себе выдать доступ к сети. См. <a href=\"#/docs/core/imports\">импорты<\/a><\/td><\/tr>\n<tr><td><code>--refresh-imports<\/code><\/td><td>—<\/td><td>Повторно загрузить кэшированные git-импорты по тегу/ветке вместо доверия кэшу (импорты по SHA коммита неизменяемы и никогда не перезагружаются)<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Семантика кодов выхода<\/h3>\n<ul>\n<li><code>0<\/code> — прогон завершён, <strong>даже если запросы или проверки завершались неудачей<\/strong>. Провалившиеся\nпроверки — это обратная связь нагрузочного теста (видна в <code>http_req_failed<\/code> и в stderr),\nа не ошибка CLI — как поведение k6 по умолчанию без порогов (thresholds). Это\nтакже касается движков, которые выходят с ненулевым кодом при провалившихся <em>запросах<\/em> (k6 с\nthresholds, locust), если они выдали сводку результатов.<\/li>\n<li><code>1<\/code> — прогон не удалось выполнить: файл не найден, некорректный YAML, бинарник\nдвижка не найден или движок упал до выдачи каких-либо результатов (ненулевой\nвыход с нулевыми метриками — ошибка в скрипте или сломанная установка, а не обратная\nсвязь теста): <code>error: engine exited with code 1 before producing any results<\/code>.\nКроме того: нативный прогон, у которого gate\n<a href=\"#/docs/core/actions\"><code>std/thresholds@v1<\/code><\/a>\nдал результат <code>fail<\/code> (<code>error: thresholds failed: …<\/code>) — gates позволяют CI\nпревращать нарушения SLO в провалившуюся сборку, как thresholds в k6.<\/li>\n<li><code>2<\/code> — некорректные аргументы командной строки.<\/li>\n<\/ul>\n<h3>Потоки вывода<\/h3>\n<ul>\n<li><strong>stdout<\/strong> — вывод движка и итоговая сводка метрик (машиночитаемый формат)<\/li>\n<li><strong>stderr<\/strong> — ошибки, провалившиеся проверки и маркеры прогресса <code>[system]<\/code>. Прогоны,\nвыполняемые через машинного агента, завершаются финальным маркером\n<code>[sys] __perfscale_exit__=&lt;code&gt;<\/code>, несущим код выхода движка —\nсм. <a href=\"#/docs/core/runners\">Раннеры → маркер выхода<\/a><\/li>\n<\/ul>\n<h3>Экспорт сводки<\/h3>\n<p><code>--summary-export<\/code> записывает самоописательный файл результатов после прогона:<\/p>\n<pre><code class=\"language-json\">{\n  \"meta\": {\n    \"perfscale_version\": \"0.2.0\",\n    \"engine\": \"native\",\n    \"vus\": 10,\n    \"duration\": \"30s\",\n    \"timestamp\": \"2026-07-08T11:11:17Z\"\n  },\n  \"summary\": {\n    \"avg_ms\": 0.09, \"med_ms\": 0.08, \"p90_ms\": 0.15, \"p95_ms\": 0.17,\n    \"p99_ms\": 0.27, \"min_ms\": 0.02, \"max_ms\": 2.86,\n    \"error_rate\": 0.0, \"total_requests\": 20872, \"requests_per_sec\": 20866.54\n  }\n}\n<\/code><\/pre>\n<p><code>vus<\/code>/<code>duration<\/code> равны <code>null<\/code> для прогонов <code>--k6<\/code> и <code>--jmeter<\/code> (профиль нагрузки\nзадан в скрипте/плане). То же верно для нативных прогонов с профилем <code>stages:<\/code>/<code>arrival:<\/code> —\nфиксированного числа VU нет, поэтому <code>vus<\/code> равен <code>null<\/code>, а <code>duration<\/code> — суммарная\nдлительность шагов (например, <code>\"90s\"<\/code>); строка <code>vus<\/code> в сводке в этом случае показывает\nнаблюдаемый минимум/максимум параллелизма. <code>summary<\/code> равен <code>null<\/code>, если прогон не дал\nHTTP-метрик. Если в конфигурации был gate\n<a href=\"#/docs/core/actions\"><code>std/thresholds@v1<\/code><\/a>,\nв экспорте появляется поле <code>thresholds<\/code> с результатом gate:<\/p>\n<pre><code class=\"language-json\">{\n  \"thresholds\": {\n    \"status\": \"fail\",\n    \"message\": \"db_query_failed rate=1 ≥ 0.05; checkout SLO\",\n    \"violations\": [{ \"metric\": \"db_query_failed\", \"expr\": \"rate&lt;0.05\", \"actual\": 1.0 }]\n  }\n}\n<\/code><\/pre>\n<p><code>status<\/code> равен <code>pass<\/code>, когда все выражения выполнились, иначе — <code>severity<\/code>\ngate (<code>fail<\/code>/<code>warn<\/code>/<code>info<\/code>). Статус <code>fail<\/code> также заставляет <code>perfscale run<\/code> завершиться\nс ненулевым кодом, так что CI падает на самом gate. С\n<code>--summary-format md<\/code> те же данные рендерятся как таблица Markdown — если направить её в\n<code>$GITHUB_STEP_SUMMARY<\/code>, она попадёт прямо в сводку задания GitHub Actions.\nНеудачная запись экспорта — ошибка CLI (код выхода 1), даже если сам прогон\nзавершился успешно: CI не должен молча продолжаться без запрошенного артефакта.<\/p>\n<h3>Ошибки доступности движков<\/h3>\n<pre><code class=\"language-text\">error: k6 not found in PATH — install from https://k6.io/docs/get-started/installation/\nerror: locust not found in PATH — install with `pip install locust` (...)\nerror: jmeter not found in PATH — install from https://jmeter.apache.org/download_jmeter.cgi (...)\n<\/code><\/pre>\n<p>Прогоны JMeter не выдают перцентилей задержки: после прогона финальная\nконсольная строка <code>summary =<\/code> jmeter преобразуется в совместимый с k6 блок сводки\nтолько с <code>avg<\/code>/<code>min<\/code>/<code>max<\/code>. Интеграции <code>std/thresholds@v1<\/code> для\n<code>--jmeter<\/code> нет — код выхода процесса jmeter и есть gate.<\/p>\n<h2><code>perfscale serve<\/code><\/h2>\n<table><thead><tr><th>Флаг<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>--port &lt;PORT&gt;<\/code><\/td><td><code>7999<\/code><\/td><td>Порт для прослушивания; <code>0<\/code> выбирает свободный порт (печатается при запуске)<\/td><\/tr>\n<tr><td><code>--tls<\/code><\/td><td>выкл.<\/td><td>Обслуживать HTTPS с самоподписанным сертификатом, сгенерированным при запуске, — локальная TLS-цель для нагрузочных тестов. Клиенты должны пропускать проверку сертификата (<code>insecure: true<\/code> в <code>std/http@v1<\/code>, <code>insecureSkipTLSVerify<\/code> у k6, <code>verify=False<\/code> у locust)<\/td><\/tr>\n<tr><td><code>--no-ui<\/code><\/td><td>выкл.<\/td><td>Не обслуживать встроенный дашборд на <code>/<\/code>; API приёма метрик продолжает работать<\/td><\/tr>\n<\/tbody><\/table>\n<p>Эндпоинты:<\/p>\n<table><thead><tr><th>Метод<\/th><th>Путь<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>GET<\/code><\/td><td><code>/<\/code><\/td><td>Встроенный дашборд (отсутствует с <code>--no-ui<\/code>): живые временные ряды снапшотов во время прогона и последние сводки прогонов. Самодостаточный — без CDN; опрашивает <code>/api/v1/state<\/code><\/td><\/tr>\n<tr><td><code>GET<\/code><\/td><td><code>/health<\/code><\/td><td>Возвращает <code>ok<\/code><\/td><\/tr>\n<tr><td><code>POST<\/code><\/td><td><code>/api/v1/metrics<\/code><\/td><td>Принимает итоговую сводку <code>{\"lines\": [\"...\", ...]}<\/code> или снапшот во время прогона <code>{\"samples\": [...], \"seq\": N}<\/code> (<code>report.during_run<\/code>), печатает его и хранит в памяти для дашборда<\/td><\/tr>\n<tr><td><code>GET<\/code><\/td><td><code>/api/v1/state<\/code><\/td><td>Недавние пакеты снапшотов и последние сводки прогонов в JSON — то, что опрашивает дашборд. Хранится только в памяти: последние 2000 пакетов снапшотов и 20 сводок<\/td><\/tr>\n<tr><td><code>GET<\/code><\/td><td><code>/ws<\/code><\/td><td>WebSocket-эхо — каждое текстовое (и бинарное) сообщение возвращается дословно. Петлевая (loopback) цель для WebSocket-нагрузочных тестов и бенчмарк-набора <code>ws<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h3>Дашборд<\/h3>\n<p>Дашборд включён по умолчанию — запустите <code>perfscale serve<\/code> и откройте\n<code>http://localhost:7999/<\/code> (флага <code>--ui<\/code> нет; страница обслуживается, пока не\nпередан <code>--no-ui<\/code>):<\/p>\n<p><img src=\"../../images/serve-dashboard.png\" alt=\"Дашборд perfscale serve: живые карточки метрик со спарклайнами и сводка последнего прогона\" /><\/p>\n<p>Каждый ряд из снапшотов <code>report.during_run<\/code> становится карточкой с последним\nзначением и спарклайном; завершённые прогоны складываются блоками сводок ниже.\nСортируемая таблица с фильтром перечисляет все ряды, а карточки и строки метрик\nведут на соответствующие страницы встроенной документации. Страница опрашивает\n<code>GET /api/v1/state<\/code> каждые 2 секунды и имеет переключатель тёмной/светлой темы\n(по умолчанию — тема ОС).<\/p>\n<p>Страница — один самодостаточный HTML-файл без CDN. Её исходники — React +\nTypeScript + Tailwind + shadcn/ui приложение в <code>crates/perfscale-cli/ui/<\/code>,\nсобираемое Vite в закоммиченный <code>src/commands/serve_ui.html<\/code>, который CLI\nвстраивает через <code>include_str!<\/code>, поэтому сборке Rust не нужен Node. Чтобы\nизменить дашборд: отредактируйте приложение, выполните <code>pnpm install &amp;&amp; pnpm build<\/code> в <code>crates/perfscale-cli/ui/<\/code> и закоммитьте обновлённый\n<code>serve_ui.html<\/code> — CI проверяет его свежесть (<code>pnpm check-built<\/code>).<\/p>\n<p>На этой же странице встроена вся документация: вкладка <strong>Docs<\/strong> рендерит\nmarkdown из <code>docs/<\/code> (английский и русский, переключатель EN/RU, по умолчанию —\nязык браузера) полностью офлайн. Встроенная копия генерируется из документации\nпри сборке; после правок markdown контрибьюторы регенерируют её командой\n<code>PERFSCALE_UPDATE_DOCS=1 cargo test -p perfscale-cli serve_docs<\/code>.<\/p>\n<pre><code class=\"language-bash\"># терминал 1 — дашборд обслуживается на /\nperfscale serve\n\n# терминал 2 — для живых рядов нужен report.during_run: true в конфиге\nperfscale run -f test.yaml -c config.yaml --report http://127.0.0.1:7999\n<\/code><\/pre>\n<p>Это заменитель для разработки, а не control-plane: ни персистентности, ни аутентификации,\nни агрегации между прогонами. Его может заменить всё, что умеет работать с этими эндпоинтами.<\/p>\n<h2>Бенчмаркинг<\/h2>\n<p>В perfscale нет подкоманды <code>bench<\/code> — сравнения движков запускаются через\n<a href=\"../../scripts/bench.sh\"><code>scripts/bench.sh<\/code><\/a>, скрипт на базе\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/sharkdp/hyperfine\">hyperfine<\/a>. Методология и использование описаны в разделе <a href=\"#/docs/benchmarks\">Бенчмарки<\/a>.<\/p>\n<h2><code>perfscale lint<\/code><\/h2>\n<p>Проверяет YAML-файлы по тем же схемам, что использует <code>run<\/code>, — плюс проверки,\nкоторые схема выразить не может, — ничего не выполняя. Предназначен для редакторов, CI\ngate'ов и pre-commit-хуков.<\/p>\n<pre><code class=\"language-sh\">perfscale lint test.yaml config.yaml\nperfscale lint --schema config load.yaml\n<\/code><\/pre>\n<table><thead><tr><th>Флаг<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>FILE...<\/code><\/td><td>обязательный<\/td><td>Один или несколько YAML-файлов<\/td><\/tr>\n<tr><td><code>--schema &lt;auto|test|config&gt;<\/code><\/td><td><code>auto<\/code><\/td><td><code>auto<\/code> определяет тип по файлу: ключ верхнего уровня <code>steps:<\/code> означает определение теста, всё остальное — конфигурация<\/td><\/tr>\n<tr><td><code>--offline<\/code><\/td><td>выкл.<\/td><td>Пропустить сетевой проход (интроспекция GraphQL) — проверять только офлайн<\/td><\/tr>\n<tr><td><code>--allow-remote-import<\/code><\/td><td>выкл.<\/td><td>Разрешить <code>import:<\/code> в проверяемых документах загружаться по сети, чтобы можно было валидировать объединённый результат<\/td><\/tr>\n<tr><td><code>--refresh-imports<\/code><\/td><td>выкл.<\/td><td>Повторно загрузить кэшированные git-импорты по тегу/ветке вместо доверия кэшу<\/td><\/tr>\n<\/tbody><\/table>\n<p>Что проверяется:<\/p>\n<ol start=\"0\">\n<li><strong>Импорты<\/strong> — документы с ключом <code>import:<\/code> сначала разрешаются и объединяются,\nтак что валидация видит то, что реально будет выполняться. Проблемы разрешения\n(отсутствующая база, цикл, удалённый импорт без <code>--allow-remote-import<\/code>)\nсообщаются как находки по адресу <code>/import<\/code><\/li>\n<li><strong>Синтаксис YAML<\/strong> — ошибки разбора с подсказкой про отступы/кавычки<\/li>\n<li><strong>JSON Schema<\/strong> — обязательные поля, типы (та же валидация, что выполняет <code>run<\/code>)<\/li>\n<li><strong>Неизвестные/опечаточные поля<\/strong> — с подсказками «возможно, вы имели в виду» (<code>chek<\/code> → <code>check<\/code>),\nна каждом уровне: поля шагов, параметры <code>with:<\/code> каждого действия, ключи <code>check:<\/code>,\nполя конфигурации, поля <code>report:<\/code><\/li>\n<li><strong>Неизвестные идентификаторы действий<\/strong> — <code>std/htp@v1<\/code> → <code>did you mean 'std/http@v1'?<\/code><\/li>\n<li><strong>GraphQL-документы<\/strong> — запросы <code>std/graphql@v1<\/code> разбираются (синтаксические ошибки\nуказывают на <code>/steps/N/with/query<\/code>) и, когда эндпоинт доступен,\nвалидируются по его интроспектированной схеме. Шаги со <code>schema_file<\/code> валидируются\nпо локальному SDL, а недоступные эндпоинты дают информационную заметку, но никогда не провал. <code>--offline<\/code> пропускает сетевой проход<\/li>\n<\/ol>\n<p>Каждая находка показывает <em>где<\/em> (<code>/steps/0/with<\/code>), <em>что<\/em> не так и <em>что использовать\nвместо<\/em>, а вывод завершается ссылкой на\n<a href=\"#/docs/yaml-reference\">справочник по YAML<\/a>.<\/p>\n<p>Код выхода: <code>0<\/code>, если все файлы валидны, иначе <code>1<\/code> — безопасно использовать как CI\ngate:<\/p>\n<pre><code class=\"language-yaml\">- run: perfscale lint tests/*.yaml\n<\/code><\/pre>\n<h2><code>perfscale install<\/code><\/h2>\n<p>Загружает удалённые библиотеки генераторов значений (RFC 005), объявленные в\n<code>libraries:<\/code>, и фиксирует их для офлайн-прогонов.<\/p>\n<pre><code class=\"language-sh\">perfscale install test.yaml config.yaml\nperfscale install test.yaml --refresh   # re-resolve git refs\n<\/code><\/pre>\n<p>Каждый <code>use:<\/code>, являющийся URL <code>https://…<\/code> или ссылкой\n<code>git+&lt;repo&gt;@&lt;ref&gt;#&lt;path&gt;<\/code>, загружается один раз — включая объявления,\nнайденные через цепочки <code>import:<\/code> — проверяется по дайджесту на соответствие его пину <code>sha256:<\/code>\n(только объявленные пины; см. ниже), сохраняется в\nконтентно-адресуемом кэше (<code>&lt;cache&gt;/libraries/&lt;sha256&gt;.wasm<\/code>) и записывается\nв TOML-файл <code>perfscale.lock<\/code> рядом с объявляющим файлом (git-ссылки фиксируются на\nразрешённый коммит). Закоммитьте lockfile: <code>run<\/code> и <code>lint<\/code> разрешают удалённые\nбиблиотеки через lock + кэш <strong>полностью офлайн<\/strong>, а отсутствующий пин или\nартефакт кэша — жёсткая ошибка с указанием запустить <code>perfscale install<\/code>.<\/p>\n<p><code>sha256:<\/code> опционален для источников <code>https://…<\/code> (как и в агенте\nperfscaled): без него дайджест загруженного артефакта вычисляется, фиксируется в\nlockfile и печатается с предупреждением, советующим добавить пин в\nYAML. При наличии пина несовпадение — жёсткая ошибка с указанием обоих дайджестов.<\/p>\n<p>Код выхода: <code>0<\/code>, если все удалённые библиотеки установлены (или уже зафиксированы),\n<code>1<\/code> при ошибках загрузки/проверки (несовпадение sha256 называет оба дайджеста).<\/p>\n<p><code>install<\/code> также <em>встраивает<\/em> (burn) каждую WASM-библиотеку — удалённую и локальную — в AOT-\nкэш (<code>&lt;cache&gt;/libraries/&lt;sha256&gt;.cwasm<\/code>), так что <code>run<\/code>/<code>lint<\/code> десериализуют\nпредварительно скомпилированный артефакт вместо компиляции на каждый прогон. Эта операция\nнеобязательна: библиотека, которую не удалось предкомпилировать, понижается до предупреждения\nи компилируется во время выполнения.<\/p>\n<h2><code>perfscale burn<\/code><\/h2>\n<p>Собирает автономный бинарник со встроенными WASM-библиотеками из документов:<\/p>\n<pre><code class=\"language-sh\">perfscale burn -f test.yaml -c config.yaml -o ./perfscale+libs\n<\/code><\/pre>\n<table><thead><tr><th>Флаг<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>-f, --file &lt;FILE&gt;<\/code><\/td><td>обязательный, повторяемый<\/td><td>YAML-документ(ы) теста, чьи <code>libraries:<\/code> нужно встроить<\/td><\/tr>\n<tr><td><code>-c, --config &lt;FILE&gt;<\/code><\/td><td>—<\/td><td>Опциональная YAML-конфигурация, чьи <code>libraries:<\/code> также нужно встроить<\/td><\/tr>\n<tr><td><code>-o, --output &lt;FILE&gt;<\/code><\/td><td>обязательный<\/td><td>Путь выходного производного бинарника<\/td><\/tr>\n<\/tbody><\/table>\n<p>Результат — побайтовая копия запущенного бинарника perfscale плюс\nAOT-предкомпилированные (<code>.cwasm<\/code>) артефакты всех объявленных WASM-библиотек,\nдописанные за маркером-окончанием <code>PFSEMBED<\/code>. Производный бинарник разрешает эти\nбиблиотеки из самого себя — ни файлы <code>.wasm<\/code>, ни кэш, ни <code>perfscale.lock<\/code>\nна машине запуска не нужны — что делает его однофайловым дистрибутивом для\nгенераторов нагрузки и контейнеров (см.\n<a href=\"#/docs/core/docker\">Запуск perfscale в Docker<\/a>).<\/p>\n<p>Удалённые ссылки должны быть сначала установлены (<code>perfscale install<\/code>) — <code>burn<\/code> разрешает\nих через lock + кэш офлайн, как <code>run<\/code>. Встроенные <code>@std<\/code> — это нативный\nкод, они пропускаются автоматически. Артефакты burn привязаны к сборке,\nкоторая их произвела (версия wasmtime, target triple, конфигурация движка):\nповторно запускайте <code>perfscale burn<\/code> после обновления perfscale. Burn устраняет\nкомпиляцию на прогон, но не накладные расходы на вызов — стоимость вызова библиотеки не меняется.<\/p>\n<p>Код выхода: <code>0<\/code> при успехе, <code>1<\/code>, если документ не загружается, WASM-библиотеки\nне объявлены или библиотека не компилируется как компонент.<\/p>\n<h2><code>perfscale schema<\/code><\/h2>\n<p>Печатает JSON Schema, по которой perfscale валидирует YAML-файлы, — точно те\nсхемы, что используют <code>lint<\/code> и <code>run<\/code>, в виде форматированного JSON на stdout.<\/p>\n<pre><code class=\"language-sh\">perfscale schema test     # schema for test definitions (steps)\nperfscale schema config   # schema for run configs\n<\/code><\/pre>\n<p>Предназначен для всего, что программно создаёт YAML для perfscale:<\/p>\n<ul>\n<li><strong>Автодополнение в редакторе<\/strong> — направьте ваш языковой сервер YAML на этот вывод<\/li>\n<li><strong>Инструментарий агентов<\/strong> — <a href=\"#/docs/mcp\">MCP-сервер perfscale<\/a> вызывает эту команду, чтобы\nдать моделям контракт авторинга<\/li>\n<\/ul>\n<p>Код выхода: <code>0<\/code> при успехе.<\/p>\n<h2><code>perfscale metrics<\/code><\/h2>\n<p>Печатает каталог метрик: каждую метрику, объявленную зарегистрированными\nсемействами, в виде таблицы — семейство, имя, вид\n(<code>counter<\/code>/<code>gauge<\/code>/<code>histogram<\/code>/<code>rate<\/code>), единица измерения и описание.\nВстроенные семейства <code>http<\/code> и <code>llm<\/code> присутствуют всегда; сборки с pro-модулями\nпоказывают и их семейства. См. <a href=\"#/docs/core/metrics\">Метрики<\/a>.<\/p>\n<pre><code class=\"language-sh\">perfscale metrics\n<\/code><\/pre>\n<p>Код выхода: <code>0<\/code> при успехе.<\/p>\n<h2><code>perfscale man<\/code><\/h2>\n<p>Печатает встроенную man-страницу — полный справочник CLI, вкомпилированный в\nбинарник при сборке. Это путь для <strong>Windows<\/strong>, где нет <code>man(1)<\/code>:<\/p>\n<pre><code class=\"language-sh\">perfscale man          # plain-text manual on stdout\nperfscale man --raw    # the roff source instead\n<\/code><\/pre>\n<p>В Unix установите страницу один раз, чтобы работал <code>man perfscale<\/code>:<\/p>\n<pre><code class=\"language-sh\">perfscale man --install                                # → ~/.local/share/man/man1\nperfscale man --install --dir /usr/local/share/man/man1  # system-wide\n<\/code><\/pre>\n<p><code>--install<\/code> записывает <code>perfscale.1<\/code> в выбранную директорию и обновляет\nman-индекс, если доступен <code>mandb<\/code>. Если после этого <code>man perfscale<\/code> не находит страницу,\nдобавьте родительскую директорию в <code>MANPATH<\/code>:<\/p>\n<pre><code class=\"language-sh\">export MANPATH=\"$HOME/.local/share/man:$MANPATH\"\n<\/code><\/pre>\n<p>Глобальная установка через npm (<code>npm install -g @perfscale/exe<\/code>) связывает man-страницу\nавтоматически — поле <code>man<\/code> в npm помещает её в\n<code>&lt;prefix&gt;/share/man/man1<\/code>.<\/p>\n<p>Код выхода: <code>0<\/code> при успехе, <code>1<\/code>, если <code>--install<\/code> не может записать в директорию.<\/p>\n<h2><code>perfscale self-update<\/code><\/h2>\n<p>Заменяет запущенный бинарник на последний\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/releases\">релиз GitHub<\/a> для этой\nплатформы. sha256 загрузки проверяется по <code>sha256sums.txt<\/code> релиза\nдо замены, а сама замена атомарна (файл сначала подготавливается рядом\nс исполняемым, затем переименовывается) — неудачное обновление никогда не оставляет\nпосле себя сломанный бинарник.<\/p>\n<pre><code class=\"language-sh\">perfscale self-update                       # обновиться до последнего релиза (спросит подтверждение)\nperfscale self-update --check               # только проверить; exit 10 = обновление доступно\nperfscale self-update --force               # переустановить, даже если уже актуально\nperfscale self-update --non-interactive     # без вопроса-подтверждения (скрипты, CI)\n<\/code><\/pre>\n<p>Перед загрузкой команда спрашивает подтверждение в терминале:<\/p>\n<pre><code class=\"language-text\">Update perfscale 0.24.0 → 0.25.0? [Y/n]\n<\/code><\/pre>\n<p>Enter (пустой ответ) или <code>y<\/code>/<code>yes<\/code> продолжают; <code>n<\/code>/<code>no<\/code> отменяют с кодом\nвыхода 0 (отказ от обновления — не ошибка). Вопрос выводится в <strong>stderr<\/strong>,\nпоэтому stdout остаётся машиночитаемым. Когда stdin — не TTY (CI, пайпы) и\n<code>--non-interactive<\/code> не передан, команда завершается ошибкой с подсказкой\nвместо висящего вопроса, на который некому ответить. <code>--check<\/code> ничего не\nспрашивает.<\/p>\n<p>Загрузки рассчитаны на медленные сети: нет общего бюджета времени (44 МиБ на\nмедленном соединении законно качаются минуты), вместо него — лимит простоя\n60 с на чтение, до 3 попыток с backoff при обрыве соединения и живая строка\nпрогресса <code>x.x/43.9 MiB<\/code> в терминале. Обрыв посреди загрузки называется\nпонятно («connection dropped mid-download»), а не сырым «error decoding\nresponse body» из reqwest.<\/p>\n<table><thead><tr><th>Флаг<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>--check<\/code><\/td><td>Сообщить, есть ли обновление, не устанавливая его. Коды выхода: <code>0<\/code> — актуально, <code>10<\/code> — обновление доступно; удобно для скриптов в cron/CI<\/td><\/tr>\n<tr><td><code>--force<\/code><\/td><td>Переустановить последний релиз, даже если версии совпадают<\/td><\/tr>\n<tr><td><code>--non-interactive<\/code><\/td><td>Пропустить вопрос-подтверждение — для скриптов и CI<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Установки через npm<\/h3>\n<p>Когда perfscale установлен через <code>npm install -g @perfscale/exe<\/code>, бинарник\nпринадлежит npm — замена его на месте оставила бы метаданные пакета npm,\nутверждающие про старую версию. <code>self-update<\/code> обнаруживает это (исполняемый файл находится\nв <code>node_modules/@perfscale/<\/code>) и отказывается, предлагая правильную команду:<\/p>\n<pre><code class=\"language-sh\">npm install -g @perfscale/exe@latest\n<\/code><\/pre>\n<p><code>--check<\/code> по-прежнему работает, а пассивная подсказка ниже предлагает npm-команду\nдля npm-установок автоматически.<\/p>\n<h3>Пассивная подсказка «доступно обновление»<\/h3>\n<p>Другие команды (<code>run<\/code>, <code>serve<\/code>, <code>lint<\/code>) печатают однострочную подсказку в stderr,\nкогда известен более новый релиз:<\/p>\n<pre><code class=\"language-text\">perfscale v0.2.0 is available (you have 0.1.0) — run `perfscale self-update`\n<\/code><\/pre>\n<p>Проверка намеренно ненавязчива: не более одного сетевого запроса за 24 часа\n(кэшируется в пользовательской директории кэша), только в интерактивных терминалах (никогда в\nлогах CI или пайпах), никогда не задерживает команду более чем на ~2 с и молчит\nофлайн.<\/p>\n<table><thead><tr><th>Переменная<\/th><th>Эффект<\/th><\/tr><\/thead><tbody>\n<tr><td><code>PERFSCALE_NO_UPDATE_CHECK=1<\/code><\/td><td>Полностью отключить пассивную проверку и подсказку<\/td><\/tr>\n<tr><td><code>PERFSCALE_UPDATE_API_BASE<\/code><\/td><td>Переопределить хост API релизов (по умолчанию <code>https://api.github.com<\/code>) — для зеркал/прокси<\/td><\/tr>\n<tr><td><code>PERFSCALE_UPDATE_DOWNLOAD_BASE<\/code><\/td><td>Переопределить хост загрузки артефактов (по умолчанию <code>https://github.com<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n<h2><code>perfscale cache<\/code><\/h2>\n<p>Кэш импортов/библиотек (<code>~/.cache/perfscale<\/code>, переопределяется через\n<code>PERFSCALE_CACHE_DIR<\/code>) растёт бесконечно: каждый скачанный удалённый импорт и\nкаждый скомпилированный WASM-артефакт адресуются по содержимому и хранятся\nвечно. Чистится явно:<\/p>\n<pre><code class=\"language-sh\">perfscale cache clean              # удалить все кэшированные импорты и артефакты библиотек\nperfscale cache clean --dry-run    # только показать, сколько освободится\n<\/code><\/pre>\n<p>Удаление всегда безопасно — всё в кэше перекачиваемо: следующий\n<code>perfscale install<\/code> или <code>run<\/code> пересоберёт то, на что ссылается закреплённый\n<code>perfscale.lock<\/code> (ценой одной повторной загрузки/компиляции).<\/p>\n<h2>Переменные окружения<\/h2>\n<table><thead><tr><th>Имя<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>RUST_LOG<\/code><\/td><td>фильтр <code>tracing<\/code>, например <code>RUST_LOG=debug perfscale run ...<\/code><\/td><\/tr>\n<tr><td><code>PERFSCALE_NO_UPDATE_CHECK<\/code><\/td><td><code>1<\/code> отключает подсказку о доступном обновлении<\/td><\/tr>\n<tr><td><code>PERFSCALE_CACHE_DIR<\/code><\/td><td>Корень кэша для git-клонов <code>import:<\/code> и установленных библиотек (по умолчанию <code>~/.cache/perfscale<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n","slug":"cli/commands","title":"CLI commands"},{"group":"cli","html_en":"<h1>Recipes<\/h1>\n<p>Runnable sample files for every engine live in <a href=\"../../examples/\"><code>examples/<\/code><\/a>.<\/p>\n<h2>Smoke-test an API before merging<\/h2>\n<pre><code class=\"language-yaml\"># smoke.test.yaml\nsteps:\n  - name: health\n    use: std/http@v1\n    with: { url: \"https://staging.example.com/health\" }\n    check: { status: 200, duration_ms_lt: 300 }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># smoke.config.yaml\nvus: 5\nduration: 30s\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f smoke.test.yaml -c smoke.config.yaml\n<\/code><\/pre>\n<h2>Login → authenticated request (chained steps)<\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: login\n    use: std/http@v1\n    with:\n      method: POST\n      url: https://api.example.com/login\n      body: { user: demo, password: demo }\n    check: { status: 200 }\n    outputs: login\n\n  - name: profile\n    use: std/http@v1\n    with:\n      url: https://api.example.com/me\n      headers:\n        authorization: \"Bearer ${{ login.body }}\"\n    check: { status: 200, body_contains: \"demo\" }\n\n  - use: std/sleep@v1\n    with: { ms: 500 }\n<\/code><\/pre>\n<h2>Load-test a WebSocket endpoint<\/h2>\n<p><a href=\"../../examples/websocket.test.yaml\"><code>examples/websocket.test.yaml<\/code><\/a> shows both\nstyles — a live connection held across steps and a one-shot session. The live\nstyle addresses the connection by the id <code>std/ws-connect@v1<\/code> returned:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open feed\n    use: std/ws-connect@v1\n    with: { url: ws://127.0.0.1:9222 }\n    outputs: feed\n\n  - name: subscribe\n    use: std/ws-send@v1\n    with:\n      id: \"${{ feed.id }}\"\n      send: '{\"op\":\"subscribe\",\"id\":\"sub-${seq}\"}'\n\n  - name: await echo\n    use: std/ws-recv@v1\n    with: { id: \"${{ feed.id }}\", until_contains: \"sub-1\", timeout: 5000 }\n    check: { message_contains: \"subscribe\" }\n\n  - name: hang up\n    use: std/ws-close@v1\n    with: { id: \"${{ feed.id }}\" }\n<\/code><\/pre>\n<p>Run it against any echo server (<code>npx wscat --listen 9222<\/code>). See the\n<a href=\"#/docs/core/websocket\">WebSocket guide<\/a> for concepts and\n<a href=\"#/docs/core/actions\">Actions → WebSocket<\/a>\nfor the full parameter and metrics reference.<\/p>\n<h2>Load-test a gRPC endpoint<\/h2>\n<p><a href=\"../../examples/grpc.test.yaml\"><code>examples/grpc.test.yaml<\/code><\/a> drives unary calls\nand a bidi stream over one live channel. No protobuf codegen: the schema is\nloaded at run time via server reflection (or a base64 <code>descriptor_set<\/code>), and\npayloads are plain JSON mapped by protobuf-JSON rules. The channel and its\nschema are paid once per iteration — calls and streams ride the same HTTP/2\nconnection:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open channel\n    use: std/grpc-connect@v1\n    with:\n      url: grpc://127.0.0.1:50051\n      reflection: true\n    outputs: conn\n\n  - name: unary echo\n    use: std/grpc-call@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"perfscale.test.v1.Echo/Unary\"\n      payload: { message: \"ping-${seq}\" }\n    check:\n      duration_ms_lt: 250\n\n  - name: open bidi stream\n    use: std/grpc-stream-open@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"perfscale.test.v1.Echo/Bidi\"\n    outputs: stream\n\n  - name: send events\n    use: std/grpc-stream-send@v1\n    with:\n      id: \"${{ stream.id }}\"\n      payload: { message: \"evt-${seq}\" }\n      repeat: 5\n      interval_ms: 20\n\n  - name: await echoes\n    use: std/grpc-stream-recv@v1\n    with:\n      id: \"${{ stream.id }}\"\n      until_contains: \"evt-5\"\n      timeout: 5000\n    check:\n      messages_count_gte: 5\n\n  - name: close stream\n    use: std/grpc-stream-close@v1\n    with: { id: \"${{ stream.id }}\" }\n<\/code><\/pre>\n<p>Run it against the bundled echo server\n(<code>cargo run -p perfscale-core --example grpc_echo_server<\/code>). For occasional\nprobes there is also the one-shot <code>std/grpc@v1<\/code> (connect → schema → call →\nclose in one step). See the <a href=\"#/docs/core/grpc\">gRPC guide<\/a> for concepts and\n<a href=\"#/docs/core/actions\">Actions → gRPC<\/a>\nfor the full parameter and metrics reference.<\/p>\n<h2>Load-test a database<\/h2>\n<p><a href=\"../../examples/db-sqlite.test.yaml\"><code>examples/db-sqlite.test.yaml<\/code><\/a> runs\nagainst in-memory SQLite — no server needed. PostgreSQL and MySQL/MariaDB\nwork the same way; only <code>driver<\/code> and <code>dsn<\/code> change:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open db\n    use: std/db-connect@v1\n    with:\n      driver: postgres\n      dsn: \"${{ vars.db_dsn }}\"        # keep the password out of the file\n    outputs: db\n\n  - name: write\n    use: std/db-query@v1\n    with:\n      id: \"${{ db.id }}\"\n      # SQL is never interpolated — values move through bound params.\n      query: INSERT INTO hits (path, status) VALUES ($1, $2)\n      params: [\"/api/checkout\", 200]\n\n  - name: hang up\n    use: std/db-close@v1\n    with: { id: \"${{ db.id }}\" }\n<\/code><\/pre>\n<p>Transactions (<code>std/db-tx-begin@v1<\/code> / <code>commit<\/code> / <code>rollback<\/code>) bracket groups\nof queries on a persistent connection; <code>mode: per-query<\/code> instead connects\nfresh per query (measuring connect + query). Metrics land in\n<code>db_query_duration<\/code>, <code>db_rows<\/code>, and a classified <code>db_errors<\/code>. See\n<a href=\"#/docs/core/actions\">Actions → Database<\/a> for\nthe full parameter and metrics reference.<\/p>\n<h2>Reuse an existing k6 script<\/h2>\n<pre><code class=\"language-sh\">perfscale run --k6 load-tests/checkout.js\n<\/code><\/pre>\n<p>Load configuration (VUs, stages, thresholds) stays in the script's <code>options<\/code>\nblock — perfscale streams the output and returns k6's exit code semantics.<\/p>\n<h2>Reuse an existing locustfile<\/h2>\n<pre><code class=\"language-sh\">perfscale run --locust locustfile.py --host https://target.example.com -c load.config.yaml\n<\/code><\/pre>\n<p><code>vus<\/code>/<code>duration<\/code> from the config map to <code>--users<\/code>/<code>--spawn-rate<\/code>/<code>--run-time<\/code>.\nAfter the run, locust's CSV stats are converted to the same summary block the\nother engines print.<\/p>\n<h2>Collect results from several terminals / machines<\/h2>\n<pre><code class=\"language-sh\"># terminal 1 — collector\nperfscale serve --port 7999\n\n# terminals 2..N — each run reports in\nperfscale run -f test.yaml -c config.yaml --report http://collector-host:7999\n<\/code><\/pre>\n<p>Or bake the collector into the config so the flag isn't needed:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 10\nduration: 5m\nreport:\n  url: http://collector-host:7999\n<\/code><\/pre>\n<h2>CI (GitHub Actions)<\/h2>\n<p>The <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/github-action\"><code>Perfscale/github-action<\/code><\/a>\ninstalls perfscale, runs the test, renders the metric table into the job\nsummary, and writes a machine-readable JSON summary:<\/p>\n<pre><code class=\"language-yaml\">- uses: Perfscale/github-action@v1\n  id: loadtest\n  with:\n    file: smoke.test.yaml\n    config: smoke.config.yaml\n\n- name: Gate on error rate and p95\n  run: |\n    jq -e '.summary.error_rate &lt; 0.01 and .summary.p95_ms &lt; 500' \\\n      \"${{ steps.loadtest.outputs.summary-json }}\"\n<\/code><\/pre>\n<p>Without the action, the same gate works from any CI via <code>--summary-export<\/code>:<\/p>\n<pre><code class=\"language-sh\">perfscale run -f smoke.test.yaml -c smoke.config.yaml --summary-export result.json\njq -e '.summary.error_rate &lt; 0.01' result.json\n<\/code><\/pre>\n<p>The run itself exits <code>0<\/code> even when checks fail (see\n<a href=\"#/docs/cli/commands\">exit code semantics<\/a>) — gate on the exported\nsummary, as above, when you want failures to break the build.<\/p>\n","html_ru":"<h1>Рецепты<\/h1>\n<p>Готовые к запуску файлы-примеры для каждого движка лежат в <a href=\"../../examples/\"><code>examples/<\/code><\/a>.<\/p>\n<h2>Smoke-тест API перед мёрджем<\/h2>\n<pre><code class=\"language-yaml\"># smoke.test.yaml\nsteps:\n  - name: health\n    use: std/http@v1\n    with: { url: \"https://staging.example.com/health\" }\n    check: { status: 200, duration_ms_lt: 300 }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># smoke.config.yaml\nvus: 5\nduration: 30s\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f smoke.test.yaml -c smoke.config.yaml\n<\/code><\/pre>\n<h2>Логин → авторизованный запрос (цепочка шагов)<\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: login\n    use: std/http@v1\n    with:\n      method: POST\n      url: https://api.example.com/login\n      body: { user: demo, password: demo }\n    check: { status: 200 }\n    outputs: login\n\n  - name: profile\n    use: std/http@v1\n    with:\n      url: https://api.example.com/me\n      headers:\n        authorization: \"Bearer ${{ login.body }}\"\n    check: { status: 200, body_contains: \"demo\" }\n\n  - use: std/sleep@v1\n    with: { ms: 500 }\n<\/code><\/pre>\n<h2>Нагрузочный тест WebSocket-эндпоинта<\/h2>\n<p><a href=\"../../examples/websocket.test.yaml\"><code>examples/websocket.test.yaml<\/code><\/a> показывает оба\nстиля — живое соединение, удерживаемое между шагами, и разовую сессию. В живом\nстиле соединение адресуется по id, который вернул <code>std/ws-connect@v1<\/code>:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open feed\n    use: std/ws-connect@v1\n    with: { url: ws://127.0.0.1:9222 }\n    outputs: feed\n\n  - name: subscribe\n    use: std/ws-send@v1\n    with:\n      id: \"${{ feed.id }}\"\n      send: '{\"op\":\"subscribe\",\"id\":\"sub-${seq}\"}'\n\n  - name: await echo\n    use: std/ws-recv@v1\n    with: { id: \"${{ feed.id }}\", until_contains: \"sub-1\", timeout: 5000 }\n    check: { message_contains: \"subscribe\" }\n\n  - name: hang up\n    use: std/ws-close@v1\n    with: { id: \"${{ feed.id }}\" }\n<\/code><\/pre>\n<p>Запускайте против любого echo-сервера (<code>npx wscat --listen 9222<\/code>). Концепции — в\n<a href=\"#/docs/core/websocket\">руководстве по WebSocket<\/a>, а полный справочник параметров и\nметрик — в <a href=\"#/docs/core/actions\">Actions → WebSocket<\/a>.<\/p>\n<h2>Нагрузочный тест gRPC-эндпоинта<\/h2>\n<p><a href=\"../../examples/grpc.test.yaml\"><code>examples/grpc.test.yaml<\/code><\/a> выполняет унарные вызовы\nи двунаправленный (bidi) стрим через один живой канал. Без кодогенерации по protobuf:\nсхема загружается во время выполнения через server reflection (или base64\n<code>descriptor_set<\/code>), а полезные данные — обычный JSON, преобразуемый по правилам\nprotobuf-JSON. Канал и его схема оплачиваются один раз за итерацию — вызовы и стримы\nидут по тому же HTTP/2-соединению:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open channel\n    use: std/grpc-connect@v1\n    with:\n      url: grpc://127.0.0.1:50051\n      reflection: true\n    outputs: conn\n\n  - name: unary echo\n    use: std/grpc-call@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"perfscale.test.v1.Echo/Unary\"\n      payload: { message: \"ping-${seq}\" }\n    check:\n      duration_ms_lt: 250\n\n  - name: open bidi stream\n    use: std/grpc-stream-open@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"perfscale.test.v1.Echo/Bidi\"\n    outputs: stream\n\n  - name: send events\n    use: std/grpc-stream-send@v1\n    with:\n      id: \"${{ stream.id }}\"\n      payload: { message: \"evt-${seq}\" }\n      repeat: 5\n      interval_ms: 20\n\n  - name: await echoes\n    use: std/grpc-stream-recv@v1\n    with:\n      id: \"${{ stream.id }}\"\n      until_contains: \"evt-5\"\n      timeout: 5000\n    check:\n      messages_count_gte: 5\n\n  - name: close stream\n    use: std/grpc-stream-close@v1\n    with: { id: \"${{ stream.id }}\" }\n<\/code><\/pre>\n<p>Запускайте против встроенного echo-сервера\n(<code>cargo run -p perfscale-core --example grpc_echo_server<\/code>). Для разовых проб\nесть также one-shot-вариант <code>std/grpc@v1<\/code> (подключение → схема → вызов →\nзакрытие одним шагом). Концепции — в <a href=\"#/docs/core/grpc\">руководстве по gRPC<\/a>,\nа полный справочник параметров и метрик — в\n<a href=\"#/docs/core/actions\">Actions → gRPC<\/a>.<\/p>\n<h2>Нагрузочный тест базы данных<\/h2>\n<p><a href=\"../../examples/db-sqlite.test.yaml\"><code>examples/db-sqlite.test.yaml<\/code><\/a> работает\nс in-memory SQLite — сервер не нужен. PostgreSQL и MySQL/MariaDB работают так же;\nменяются только <code>driver<\/code> и <code>dsn<\/code>:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open db\n    use: std/db-connect@v1\n    with:\n      driver: postgres\n      dsn: \"${{ vars.db_dsn }}\"        # keep the password out of the file\n    outputs: db\n\n  - name: write\n    use: std/db-query@v1\n    with:\n      id: \"${{ db.id }}\"\n      # SQL is never interpolated — values move through bound params.\n      query: INSERT INTO hits (path, status) VALUES ($1, $2)\n      params: [\"/api/checkout\", 200]\n\n  - name: hang up\n    use: std/db-close@v1\n    with: { id: \"${{ db.id }}\" }\n<\/code><\/pre>\n<p>Транзакции (<code>std/db-tx-begin@v1<\/code> / <code>commit<\/code> / <code>rollback<\/code>) обрамляют группы\nзапросов на постоянном соединении; <code>mode: per-query<\/code>, наоборот, подключается\nзаново для каждого запроса (измеряя подключение + запрос). Метрики попадают в\n<code>db_query_duration<\/code>, <code>db_rows<\/code> и классифицированные <code>db_errors<\/code>. Полный\nсправочник параметров и метрик — в\n<a href=\"#/docs/core/actions\">Actions → Database<\/a>.<\/p>\n<h2>Переиспользование существующего скрипта k6<\/h2>\n<pre><code class=\"language-sh\">perfscale run --k6 load-tests/checkout.js\n<\/code><\/pre>\n<p>Конфигурация нагрузки (VU, стадии, пороги) остаётся в блоке <code>options<\/code>\nскрипта — perfscale стримит вывод и сохраняет семантику кодов выхода k6.<\/p>\n<h2>Переиспользование существующего locustfile<\/h2>\n<pre><code class=\"language-sh\">perfscale run --locust locustfile.py --host https://target.example.com -c load.config.yaml\n<\/code><\/pre>\n<p><code>vus<\/code>/<code>duration<\/code> из конфига мапятся на <code>--users<\/code>/<code>--spawn-rate<\/code>/<code>--run-time<\/code>.\nПосле прогона CSV-статистика locust преобразуется в тот же summary-блок,\nкоторый выводят остальные движки.<\/p>\n<h2>Сбор результатов с нескольких терминалов / машин<\/h2>\n<pre><code class=\"language-sh\"># terminal 1 — collector\nperfscale serve --port 7999\n\n# terminals 2..N — each run reports in\nperfscale run -f test.yaml -c config.yaml --report http://collector-host:7999\n<\/code><\/pre>\n<p>Или зашейте коллектор в конфиг, чтобы флаг не был нужен:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 10\nduration: 5m\nreport:\n  url: http://collector-host:7999\n<\/code><\/pre>\n<h2>CI (GitHub Actions)<\/h2>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/github-action\"><code>Perfscale/github-action<\/code><\/a>\nустанавливает perfscale, запускает тест, выводит таблицу метрик в сводку джоба\nи записывает машиночитаемую JSON-сводку:<\/p>\n<pre><code class=\"language-yaml\">- uses: Perfscale/github-action@v1\n  id: loadtest\n  with:\n    file: smoke.test.yaml\n    config: smoke.config.yaml\n\n- name: Gate on error rate and p95\n  run: |\n    jq -e '.summary.error_rate &lt; 0.01 and .summary.p95_ms &lt; 500' \\\n      \"${{ steps.loadtest.outputs.summary-json }}\"\n<\/code><\/pre>\n<p>Без action тот же гейт работает из любого CI через <code>--summary-export<\/code>:<\/p>\n<pre><code class=\"language-sh\">perfscale run -f smoke.test.yaml -c smoke.config.yaml --summary-export result.json\njq -e '.summary.error_rate &lt; 0.01' result.json\n<\/code><\/pre>\n<p>Сам прогон завершается с кодом <code>0<\/code>, даже когда проверки падают (см.\n<a href=\"#/docs/cli/commands\">семантику кодов выхода<\/a>) — если падения должны\nломать сборку, гейтите по экспортированной сводке, как показано выше.<\/p>\n","slug":"cli/examples","title":"Recipes"},{"group":"core","html_en":"<h1>Built-in actions<\/h1>\n<p>Actions are the units a native test's <code>steps<\/code> are made of. Each step names an\naction in <code>use<\/code>, passes parameters in <code>with<\/code>, and may assert on the result in\n<code>check<\/code>.<\/p>\n<p>Full IDs carry a namespace and version (<code>std/http@v1<\/code>); the short aliases\n(<code>http<\/code>, <code>graphql<\/code>, <code>tcp<\/code>, <code>udp<\/code>, <code>pubsub<\/code>, <code>llm<\/code>, <code>ws<\/code>, <code>ws-connect<\/code>, <code>ws-send<\/code>, <code>ws-recv<\/code>, <code>ws-ping<\/code>,\n<code>ws-close<\/code>, <code>grpc<\/code>, <code>grpc-connect<\/code>, <code>grpc-call<\/code>, <code>grpc-stream-open<\/code>,\n<code>grpc-stream-send<\/code>, <code>grpc-stream-recv<\/code>, <code>grpc-stream-close<\/code>, <code>db-connect<\/code>,\n<code>db-query<\/code>, <code>db-tx-begin<\/code>, <code>db-tx-commit<\/code>, <code>db-tx-rollback<\/code>, <code>db-close<\/code>,\n<code>check<\/code>, <code>sleep<\/code>,\n<code>log<\/code>, <code>file-read<\/code>, <code>file-write<\/code>, <code>child_process<\/code>, <code>kill_process<\/code>,\n<code>set_shared_variable<\/code>, <code>get_shared_variable<\/code>) resolve to the\nsame implementations.<\/p>\n<h2><code>std/http@v1<\/code><\/h2>\n<p>Perform one HTTP request per iteration. Timing feeds the run's metrics.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Absolute URL<\/td><\/tr>\n<tr><td><code>method<\/code><\/td><td>string<\/td><td><code>GET<\/code><\/td><td>Any HTTP method, including extension methods like <code>QUERY<\/code> (safe method with a body, <a target=\"_blank\" rel=\"noopener\" href=\"https://datatracker.ietf.org/doc/draft-ietf-httpbis-safe-method-w-body/\">draft-ietf-httpbis-safe-method-w-body<\/a>)<\/td><\/tr>\n<tr><td><code>headers<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ \"Name\": \"Value\" }<\/code>, string values only<\/td><\/tr>\n<tr><td><code>body<\/code><\/td><td>string | object<\/td><td>—<\/td><td>String → <code>text/plain<\/code>; object → serialized JSON with <code>application/json<\/code>. Mutually exclusive with <code>multipart<\/code><\/td><\/tr>\n<tr><td><code>multipart<\/code><\/td><td>array<\/td><td>—<\/td><td>Send <code>multipart/form-data<\/code> — see <a href=\"#multipart-uploads\">Multipart uploads<\/a>. Mutually exclusive with <code>body<\/code><\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (ms)<\/td><td><code>10000<\/code><\/td><td>Per-request timeout<\/td><\/tr>\n<tr><td><code>insecure<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Skip TLS certificate verification — for self-signed targets like <code>perfscale serve --tls<\/code>. Never use against hosts you don't control<\/td><\/tr>\n<tr><td><code>pool<\/code><\/td><td>string<\/td><td><code>per-vu<\/code><\/td><td><code>per-vu<\/code> pins the step to the VU's HTTP client shard; <code>shared<\/code> puts every VU on one process-global client<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong> (available via <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{\n  \"status\": 200,\n  \"body\": \"...\",\n  \"duration_ms\": 42.37,\n  \"headers\": { \"content-type\": \"application/json\", \"x-request-id\": \"abc-123\" }\n}\n<\/code><\/pre>\n<p>Header names are lowercase; repeated headers are joined with <code>\", \"<\/code>. Reuse\nthem in later steps via <code>${{ resp.headers.x-request-id }}<\/code>.<\/p>\n<p>Responses with a textual content type (<code>text/*<\/code>, <code>application/json<\/code>,\n<code>application/*+json<\/code>, <code>application/*+xml<\/code>, …) arrive in <code>body<\/code> as before.\nBinary payloads (e.g. <code>application/octet-stream<\/code>) instead return an empty\n<code>body<\/code> plus a <code>body_base64<\/code> field — which is how a fetched protobuf\nFileDescriptorSet flows into a gRPC step:\n<code>descriptor_set: \"${{ fetch.body_base64 }}\"<\/code>. A missing content type is\nsniffed: valid UTF-8 behaves as text, anything else as binary.<\/p>\n<p>Statuses ≥ 400, transport errors, and timeouts count as failed requests in\n<code>http_req_failed<\/code>. A timeout is logged distinctly (<code>→ TIMEOUT after ...ms<\/code>).<\/p>\n<h3>Multipart uploads<\/h3>\n<p><code>multipart<\/code> sends <code>multipart/form-data<\/code> (file uploads, HTML-form-style\nendpoints). Each array element is one part:<\/p>\n<table><thead><tr><th>Part field<\/th><th>Required<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>name<\/code><\/td><td>yes<\/td><td>Form field name<\/td><\/tr>\n<tr><td><code>value<\/code><\/td><td>one of value/file<\/td><td>Text field content<\/td><\/tr>\n<tr><td><code>file<\/code><\/td><td>one of value/file<\/td><td>Path to a file on disk (relative to the working directory)<\/td><\/tr>\n<tr><td><code>filename<\/code><\/td><td>no<\/td><td>Filename sent to the server; defaults to the file's basename<\/td><\/tr>\n<tr><td><code>content_type<\/code><\/td><td>no<\/td><td>MIME type of the part (e.g. <code>application/octet-stream<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n<pre><code class=\"language-yaml\">steps:\n  - name: upload report\n    use: std/http@v1\n    with:\n      method: POST\n      url: \"https://api.example.com/upload\"\n      multipart:\n        - name: file\n          file: ./fixtures/report.csv\n          content_type: text/csv\n        - name: description\n          value: \"uploaded by ${{ __last__.status }} check run\"\n    check:\n      status: 201\n<\/code><\/pre>\n<p>Notes:<\/p>\n<ul>\n<li>The <code>Content-Type: multipart/form-data; boundary=…<\/code> header is set\nautomatically — don't add it to <code>headers<\/code>.<\/li>\n<li><code>${{ ... }}<\/code> placeholders work in part values and paths, like everywhere\nelse in <code>with:<\/code>.<\/li>\n<li>Files are read from disk on every iteration: the OS page cache makes\nrepeats cheap, and a file changed between runs is picked up. Under high\nRPS prefer small fixture files.<\/li>\n<li>A missing/unreadable file fails the step before any request is sent.<\/li>\n<\/ul>\n<h2><code>std/graphql@v1<\/code><\/h2>\n<p>Send one GraphQL operation (query or mutation) per iteration over HTTP, with\noptional schema validation against the endpoint's introspected schema. See the\nfull walkthrough in <a href=\"#/docs/core/graphql\">GraphQL load testing<\/a>.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>GraphQL endpoint, e.g. <code>https://api.example.com/graphql<\/code><\/td><\/tr>\n<tr><td><code>query<\/code><\/td><td>string<\/td><td>one of query/query_file<\/td><td>Inline GraphQL document<\/td><\/tr>\n<tr><td><code>query_file<\/code><\/td><td>string (path)<\/td><td>one of query/query_file<\/td><td>Read the document from a <code>.graphql<\/code> file. Filesystem access: requires <code>allow_file_actions<\/code>, honours <code>fs_root<\/code><\/td><\/tr>\n<tr><td><code>variables<\/code><\/td><td>object<\/td><td>—<\/td><td>Query variables. <code>${{ … }}<\/code> interpolation applies, and single-brace <code>${…}<\/code> generator tokens (<code>${uuid}<\/code>, <code>${rand}<\/code>, <code>${now}<\/code>) expand per execution<\/td><\/tr>\n<tr><td><code>operation<\/code><\/td><td>string<\/td><td>—<\/td><td><code>operationName<\/code> to execute. Required when the document holds several operations; also the per-operation metrics tag<\/td><\/tr>\n<tr><td><code>method<\/code><\/td><td>string<\/td><td><code>POST<\/code><\/td><td><code>POST<\/code> (JSON body) or <code>GET<\/code> (URL query parameters, for CDN-cacheable reads)<\/td><\/tr>\n<tr><td><code>headers<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ \"Name\": \"Value\" }<\/code>, string values only<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (ms)<\/td><td><code>10000<\/code><\/td><td>Per-request timeout<\/td><\/tr>\n<tr><td><code>insecure<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Skip TLS certificate verification<\/td><\/tr>\n<tr><td><code>introspection<\/code><\/td><td>boolean<\/td><td><code>true<\/code><\/td><td>Fetch the endpoint's schema once per run and validate every query before sending. Fetch failure degrades to unvalidated runs (logged once)<\/td><\/tr>\n<tr><td><code>schema_file<\/code><\/td><td>string (path)<\/td><td>—<\/td><td>Validate against a local SDL file instead of introspection (fallback for endpoints with introspection disabled). Same filesystem rules as <code>query_file<\/code><\/td><\/tr>\n<tr><td><code>pool<\/code><\/td><td>string<\/td><td><code>per-vu<\/code><\/td><td><code>per-vu<\/code> pins the step to the VU's HTTP client shard (the <code>std/http@v1<\/code> behaviour); <code>shared<\/code> puts every VU on one process-global client<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Output<\/strong> (available via <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{\n  \"status\": 200,\n  \"data\": { \"viewer\": { \"id\": \"u-1\" } },\n  \"errors\": [ { \"message\": \"widgets timed out\" } ],\n  \"body\": \"{\\\"data\\\":…}\",\n  \"duration_ms\": 12.31,\n  \"headers\": { \"content-type\": \"application/json\" }\n}\n<\/code><\/pre>\n<p><code>data<\/code> and <code>errors<\/code> are the decoded GraphQL payload (<code>errors<\/code> only present\nwhen the server sent it); <code>body<\/code> keeps the raw text for <code>body_contains<\/code>\nchecks. Extraction reads the structured payload:\n<code>${{ create.data.createWidget.id }}<\/code>.<\/p>\n<p>Response semantics follow the GraphQL-over-HTTP reality: statuses ≥ 400 fail\nthe step; a <code>200<\/code> with <code>errors<\/code> and no <code>data<\/code> fails; partial <code>data<\/code> plus\n<code>errors<\/code> passes (the server resolved what it could) and the errors are\ncounted in the <code>graphql_errors<\/code> metric.<\/p>\n<p>A syntax error, a schema-validation failure, or an unreadable <code>query_file<\/code>\nfails the step <strong>before<\/strong> any request is made — the target never sees a\nmalformed query.<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch viewer\n    use: std/graphql@v1\n    with:\n      url: https://api.example.com/graphql\n      query: |\n        query GetViewer($id: ID!) {\n          viewer(id: $id) { id name }\n        }\n      variables: { \"id\": \"${{ vars.viewer_id }}\" }\n    check:\n      status: 200\n    outputs: viewer\n\n  - name: rename widget\n    use: std/graphql@v1\n    with:\n      url: https://api.example.com/graphql\n      query_file: ./queries/rename-widget.graphql\n      variables: { \"id\": \"${{ viewer.data.viewer.id }}\", \"name\": \"w-${seq}\" }\n<\/code><\/pre>\n<p>Metrics: <code>graphql_req_duration<\/code> (histogram, with the derived\n<code>graphql_req_failed<\/code> rate), <code>graphql_errors<\/code> (counter), and\n<code>graphql_op_&lt;operationName&gt;_duration<\/code> when the operation is named — plus the\nstandard <code>http_req_*<\/code> aggregates every HTTP step feeds.<\/p>\n<h2><code>std/tcp@v1<\/code><\/h2>\n<p>Open a raw TCP connection, optionally send a payload, optionally read a\nresponse, and time the whole exchange. No protocol framing — the building block\nfor probing arbitrary line/binary services (Redis, SMTP, custom gateways).<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>host<\/code><\/td><td>string<\/td><td><strong>required<\/strong>*<\/td><td>Target host (with <code>port<\/code>)<\/td><\/tr>\n<tr><td><code>port<\/code><\/td><td>integer<\/td><td><strong>required<\/strong>*<\/td><td>Target port<\/td><\/tr>\n<tr><td><code>address<\/code><\/td><td>string<\/td><td>—<\/td><td><code>host:port<\/code> shorthand, instead of <code>host<\/code>+<code>port<\/code><\/td><\/tr>\n<tr><td><code>send<\/code><\/td><td>string<\/td><td>—<\/td><td>Text payload to write after connecting<\/td><\/tr>\n<tr><td><code>send_base64<\/code><\/td><td>string<\/td><td>—<\/td><td>Base64 payload for binary protocols. Mutually exclusive with <code>send<\/code><\/td><\/tr>\n<tr><td><code>read<\/code><\/td><td>boolean<\/td><td><code>true<\/code> if <code>expect<\/code> is set, else <code>false<\/code><\/td><td>Read one response chunk<\/td><\/tr>\n<tr><td><code>read_bytes<\/code><\/td><td>integer<\/td><td><code>65536<\/code><\/td><td>Cap on bytes read<\/td><\/tr>\n<tr><td><code>expect<\/code><\/td><td>string<\/td><td>—<\/td><td>Substring the response must contain (implies <code>read<\/code>)<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (ms)<\/td><td><code>10000<\/code><\/td><td>Timeout for connect + exchange<\/td><\/tr>\n<\/tbody><\/table>\n<p>* Provide either <code>address<\/code> <strong>or<\/strong> <code>host<\/code> + <code>port<\/code>.<\/p>\n<p><strong>Output<\/strong> (available via <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{ \"connected\": true, \"sent\": 4, \"received\": 4, \"response\": \"pong\", \"duration_ms\": 0.63 }\n<\/code><\/pre>\n<p><code>response<\/code> is UTF-8 lossy — for binary services assert on <code>received<\/code> rather than\nthe string. Connection failures, timeouts, and an <code>expect<\/code> mismatch mark the\nstep failed and count toward <code>http_req_failed<\/code>; timing lands in\n<code>http_req_duration<\/code> alongside HTTP and UDP, so percentiles are comparable across\ntransports.<\/p>\n<h2><code>std/udp@v1<\/code><\/h2>\n<p>Send a UDP datagram to the target and optionally wait for a reply. Round-trip\nlatency is measured from send to the reply datagram (or just the send when no\nreply is expected). Same <code>with<\/code> fields as <code>std/tcp@v1<\/code>, except <code>send<\/code>\n(or <code>send_base64<\/code>) is <strong>required<\/strong>.<\/p>\n<p>UDP is connectionless: a \"successful\" send only means the datagram left the\nhost. Set <code>read<\/code> (or <code>expect<\/code>) to actually validate a response.<\/p>\n<p><strong>Output:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"sent\": 4, \"received\": 4, \"response\": \"pong\", \"duration_ms\": 0.21 }\n<\/code><\/pre>\n<h2><code>std/pubsub@v1<\/code><\/h2>\n<blockquote>\n<p>Concept-level walkthrough (drivers, producer/consumer patterns, metrics,\nthresholds): <a href=\"#/docs/core/pubsub\">Pub/Sub guide<\/a>.<\/p>\n<\/blockquote>\n<p>Publish messages to a subject and/or wait for messages on it — a one-shot\npub/sub exchange measuring publish and end-to-end latency. The transport is\npluggable behind a <strong>driver<\/strong>:<\/p>\n<table><thead><tr><th>Driver<\/th><th>Transport<\/th><\/tr><\/thead><tbody>\n<tr><td><code>memory<\/code> (default)<\/td><td>In-process broadcast bus — no broker needed. The bus is process-global: one channel per subject shared by all VUs, so one VU's publish is delivered to every VU subscribed to that subject (cross-VU fan-out is a feature)<\/td><\/tr>\n<tr><td><code>nats<\/code><\/td><td>A real NATS server (core NATS, no JetStream) via <code>async-nats<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<p>Proprietary drivers (Kafka, Redis, …) register through the same seam in the\npro build; an unknown <code>driver<\/code> value fails the step listing the registered\ndrivers, which is how you learn your build lacks them.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>driver<\/code><\/td><td>string<\/td><td><code>memory<\/code><\/td><td><code>memory<\/code>, <code>nats<\/code>, or a downstream-registered driver<\/td><\/tr>\n<tr><td><code>subject<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>NATS subject / in-memory topic name<\/td><\/tr>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td>—<\/td><td>Broker URL; required by <code>nats<\/code>, ignored by <code>memory<\/code><\/td><\/tr>\n<tr><td><code>publish<\/code><\/td><td>string | array<\/td><td>—<\/td><td>One message or a list; non-strings are serialized to JSON text<\/td><\/tr>\n<tr><td><code>subscribe<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ count, until_contains, timeout_ms }<\/code> — wait for <code>count<\/code> messages (default <code>1<\/code>) that each contain <code>until_contains<\/code> (optional), within <code>timeout_ms<\/code> (default <code>5000<\/code>)<\/td><\/tr>\n<tr><td><code>options<\/code><\/td><td>object<\/td><td>—<\/td><td>Driver-specific tuning passed through verbatim — ignored by the built-in drivers; pro drivers (Kafka, Redis, MQTT) use it for QoS, consumer groups, auth, …<\/td><\/tr>\n<\/tbody><\/table>\n<p>At least one of <code>publish<\/code> / <code>subscribe<\/code> is required. When both are given the\nsubscription is established <strong>first<\/strong>, so a same-subject roundtrip sees its\nown messages. Publish-only is a pure producer step (success = all publishes\naccepted); subscribe-only is a pure consumer step. The step fails on connect\nfailure, publish error, or a subscribe timeout — the error reports how many\nof <code>count<\/code> arrived and how many the <code>until_contains<\/code> matcher rejected.<\/p>\n<p><strong>Output:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"driver\": \"memory\", \"subject\": \"orders.created\", \"published\": 2,\n  \"received\": 1, \"duration_ms\": 3.21,\n  \"body\": \"&lt;joined received payloads&gt;\",\n  \"metrics\": { \"pubsub_msgs_published\": 2, \"pubsub_msgs_received\": 1,\n               \"pubsub_e2e_ms\": [1.2] } }\n<\/code><\/pre>\n<p><code>received<\/code> / <code>body<\/code> and the <code>pubsub_msgs_received<\/code> / <code>pubsub_e2e_ms<\/code> metrics\nappear only when <code>subscribe<\/code> is given. <code>pubsub_e2e_ms<\/code> holds one sample per\nmatched message: start of the publish phase → consumed. <code>body<\/code> is the\nnewline-joined matched payloads, so <code>check: { body_contains: … }<\/code> works.<\/p>\n<p><strong>Examples.<\/strong> In-memory roundtrip (no broker — both sides in one step):<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: order events roundtrip\n    use: std/pubsub@v1\n    with:\n      subject: orders.created\n      publish: [\"order-1 created\", \"order-2 created\"]\n      subscribe: { count: 2, until_contains: created, timeout_ms: 2000 }\n    check:\n      body_contains: order-2\n<\/code><\/pre>\n<p>NATS publish-only producer:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: produce order events\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.created\n      publish:\n        - '{\"id\":\"ord-1\",\"total\":42.50}'\n        - '{\"id\":\"ord-2\",\"total\":17.00}'\n<\/code><\/pre>\n<p>NATS consumer with matcher, timeout, and a check block:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: await shipment event\n    use: std/pubsub@v1\n    with:\n      driver: nats\n      url: nats://127.0.0.1:4222\n      subject: orders.shipped\n      subscribe: { count: 1, until_contains: '\"id\":\"ord-1\"', timeout_ms: 3000 }\n    check:\n      body_contains: ord-1\n    outputs: shipment\n<\/code><\/pre>\n<h2><code>std/set_shared_variable@v1<\/code><\/h2>\n<blockquote>\n<p>Concept-level walkthrough (declaration, patterns, drivers):\n<a href=\"#/docs/core/shared-variables\">Shared variables guide<\/a>.<\/p>\n<\/blockquote>\n<p>Atomically mutate a shared variable — one run-scoped key/value store shared\nby every VU in the process, for cross-VU coordination (shared counters,\nproducer/consumer queues, barriers) that immutable per-VU <code>variables<\/code> cannot\nexpress. Names must be <strong>declared<\/strong> in the config file's\n<a href=\"#/docs/yaml-reference\"><code>shared_variables:<\/code><\/a> block; a step\nreferencing an undeclared name, or an <code>op<\/code> incompatible with the declared\ntype (<code>increment<\/code> on a list), fails configuration validation before any VU\nstarts.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>driver<\/code><\/td><td>string<\/td><td><code>memory<\/code><\/td><td><code>memory<\/code> (process-global store) or a downstream-registered driver (pro builds: Redis, …). An unknown value fails the step listing the registered drivers<\/td><\/tr>\n<tr><td><code>name<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Declared shared-variable name<\/td><\/tr>\n<tr><td><code>op<\/code><\/td><td>string<\/td><td><code>set<\/code><\/td><td><code>set<\/code> (any type), <code>increment<\/code> (number — <code>value<\/code> is the delta), <code>append<\/code> (list — <code>value<\/code> is the element)<\/td><\/tr>\n<tr><td><code>value<\/code><\/td><td>any<\/td><td><strong>required<\/strong><\/td><td>New value / increment delta / appended element<\/td><\/tr>\n<\/tbody><\/table>\n<p><code>increment<\/code> returns the new value, <code>append<\/code> the new list length, <code>set<\/code> the\nstored value. Every op is a single atomic acquisition — there is no\nread-modify-write pair to race.<\/p>\n<p><strong>Output:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"driver\": \"memory\", \"name\": \"approved_count\", \"op\": \"increment\",\n  \"value\": 3, \"duration_ms\": 0.03 }\n<\/code><\/pre>\n<h2><code>std/get_shared_variable@v1<\/code><\/h2>\n<p>Atomically read a shared variable, optionally blocking until a condition\nholds.<\/p>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>driver<\/code><\/td><td>string<\/td><td><code>memory<\/code><\/td><td><code>memory<\/code> or a downstream-registered driver<\/td><\/tr>\n<tr><td><code>name<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Declared shared-variable name<\/td><\/tr>\n<tr><td><code>op<\/code><\/td><td>string<\/td><td><code>get<\/code><\/td><td><code>get<\/code> (any type) or <code>pop<\/code> (list: remove and return the first element FIFO; <code>null<\/code> when empty)<\/td><\/tr>\n<tr><td><code>wait_for<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ exists | equals: &lt;json&gt; | length_gte: &lt;int&gt;, timeout_ms }<\/code> — block until the condition holds; exactly one condition key, <code>timeout_ms<\/code> default <code>5000<\/code><\/td><\/tr>\n<tr><td><code>extract<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ key: dotted-path }<\/code> — pull fields out of the value; same <code>$.a.b[0]<\/code> syntax as <a href=\"#stdllmv1\"><code>std/llm@v1<\/code>'s extract<\/a><\/td><\/tr>\n<\/tbody><\/table>\n<p><code>wait_for<\/code> polls with a small async sleep (no spinning). On timeout the step\n<strong>fails<\/strong> (<code>[err]<\/code> line, the same contract as <code>std/pubsub@v1<\/code>'s subscribe),\nreporting the last observed value — a slow producer is an assertion failure,\nnot a silent <code>null<\/code>.<\/p>\n<p><strong>Output:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"driver\": \"memory\", \"name\": \"pending_orders\", \"op\": \"pop\",\n  \"value\": {\"id\": \"ord-1\"}, \"duration_ms\": 0.05 }\n<\/code><\/pre>\n<p>With <code>extract<\/code>, each extracted key is added at the top level instead of\n<code>value<\/code> (unresolvable paths map to <code>null<\/code>). A <code>wait_for<\/code> wait adds\n<code>waited_ms<\/code> to the output and a <code>shared_variable_wait_ms<\/code> metric sample.<\/p>\n<p><strong>Examples.<\/strong> Producer/consumer queue over a shared list:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nshared_variables:\n  pending_orders: []      # type inferred: list\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># producer step\n- name: enqueue order\n  use: std/set_shared_variable@v1\n  with: { name: pending_orders, op: append, value: { id: \"ord-${seq}\" } }\n\n# consumer step — block until something is there, then take it\n- name: dequeue order\n  use: std/get_shared_variable@v1\n  with:\n    name: pending_orders\n    op: pop\n    wait_for: { length_gte: 1, timeout_ms: 10000 }\n    extract: { order_id: $.id }\n<\/code><\/pre>\n<p>Shared counter:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nshared_variables:\n  approved_count: 0       # type inferred: number\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">- name: count approval\n  use: std/set_shared_variable@v1\n  with: { name: approved_count, op: increment, value: 1 }\n<\/code><\/pre>\n<h2><code>std/llm@v1<\/code><\/h2>\n<blockquote>\n<p>Concept-level walkthrough (endpoints, examples, metrics, thresholds):\n<a href=\"#/docs/core/llm\">LLM guide<\/a>.<\/p>\n<\/blockquote>\n<p>Send one LLM chat-completion request per iteration, streaming by default,\nmeasuring time-to-first-token (TTFT), generation throughput, and token usage.\nThree endpoint wire formats:<\/p>\n<table><thead><tr><th>Endpoint<\/th><th>Wire format<\/th><\/tr><\/thead><tbody>\n<tr><td><code>openai<\/code> (default)<\/td><td>OpenAI chat completions — also OpenAI-compatible servers (Ollama, vLLM, LM Studio, …). Sends <code>stream_options: { include_usage: true }<\/code> when streaming<\/td><\/tr>\n<tr><td><code>anthropic<\/code><\/td><td>Anthropic messages API; sends <code>anthropic-version: 2023-06-01<\/code>, key as <code>x-api-key<\/code><\/td><\/tr>\n<tr><td><code>generic<\/code><\/td><td>Body is the <code>params<\/code> object verbatim; response fields pulled out via <code>extract<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<table><thead><tr><th>Parameter<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>endpoint<\/code><\/td><td>string<\/td><td><code>openai<\/code><\/td><td><code>openai<\/code>, <code>anthropic<\/code>, or <code>generic<\/code><\/td><\/tr>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>required<\/strong><\/td><td>Completion endpoint URL<\/td><\/tr>\n<tr><td><code>model<\/code><\/td><td>string<\/td><td>—<\/td><td>Model name; required for <code>openai<\/code> / <code>anthropic<\/code><\/td><\/tr>\n<tr><td><code>prompt<\/code><\/td><td>string<\/td><td>one of prompt/messages<\/td><td>Sugar for a single <code>user<\/code> message (mutually exclusive with <code>messages<\/code>)<\/td><\/tr>\n<tr><td><code>messages<\/code><\/td><td>array<\/td><td>one of prompt/messages<\/td><td><code>[{ role, content }]<\/code> chat messages<\/td><\/tr>\n<tr><td><code>max_tokens<\/code><\/td><td>integer<\/td><td><code>256<\/code><\/td><td>Completion token cap<\/td><\/tr>\n<tr><td><code>stream<\/code><\/td><td>boolean<\/td><td><code>true<\/code> (<code>openai<\/code>/<code>anthropic<\/code>), <code>false<\/code> (<code>generic<\/code>)<\/td><td>Stream the response as SSE<\/td><\/tr>\n<tr><td><code>api_key<\/code><\/td><td>string<\/td><td>—<\/td><td><code>Authorization: Bearer<\/code> (<code>openai<\/code>/<code>generic<\/code>) or <code>x-api-key<\/code> (<code>anthropic<\/code>)<\/td><\/tr>\n<tr><td><code>headers<\/code><\/td><td>object<\/td><td>—<\/td><td>Extra request headers, string values<\/td><\/tr>\n<tr><td><code>params<\/code><\/td><td>object<\/td><td>—<\/td><td>Passthrough body fields (<code>temperature<\/code>, …); for <code>generic<\/code> it IS the body<\/td><\/tr>\n<tr><td><code>extract<\/code><\/td><td>object<\/td><td>—<\/td><td><code>generic<\/code> only: <code>{ text, prompt_tokens, completion_tokens }<\/code> — each a dotted path (<code>$.usage.completion_tokens<\/code>, <code>$.choices[0].text<\/code>) or a regex with one capture group<\/td><\/tr>\n<tr><td><code>timeout_ms<\/code><\/td><td>integer (ms)<\/td><td><code>120000<\/code><\/td><td>Whole-request timeout (connect → last chunk)<\/td><\/tr>\n<\/tbody><\/table>\n<p>A non-2xx status fails the step with the status and the first ~500 characters\nof the error body.<\/p>\n<p><strong>Output:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"endpoint\": \"openai\", \"model\": \"gpt-4o-mini\", \"status\": 200,\n  \"ttft_ms\": 120.31, \"duration_ms\": 850.02,\n  \"prompt_tokens\": 12, \"completion_tokens\": 96,\n  \"tokens_per_sec\": 131.5, \"chunks\": 34, \"text\": \"…\",\n  \"metrics\": { \"llm_ttft_ms\": [120.31], \"llm_tokens_per_sec\": [131.5],\n               \"llm_prompt_tokens\": 12, \"llm_completion_tokens\": 96,\n               \"llm_chunks\": 34 } }\n<\/code><\/pre>\n<p><code>ttft_ms<\/code> appears only for streamed responses (TTFT = request start → first\ncontent chunk); <code>tokens_per_sec<\/code> divides completion tokens by the generation\ntime after the first token, falling back to the whole request time when no\nTTFT was measured. <code>text<\/code> is truncated to ~4 KiB. <code>llm_ttft_ms<\/code> /\n<code>llm_tokens_per_sec<\/code> are trends (percentile-able in <code>std/thresholds@v1<\/code>);\n<code>llm_prompt_tokens<\/code> / <code>llm_completion_tokens<\/code> / <code>llm_chunks<\/code> are counters.<\/p>\n<p><strong>Examples.<\/strong> Local Ollama (OpenAI-compatible, no key):<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: llama completion\n    use: std/llm@v1\n    with:\n      url: http://127.0.0.1:11434/v1/chat/completions\n      model: llama3.1\n      prompt: \"Summarize the CAP theorem in two sentences.\"\n      max_tokens: 128\n    check:\n      status: 200\n<\/code><\/pre>\n<p>Anthropic streaming with a key from the environment:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: claude completion\n    use: std/llm@v1\n    with:\n      endpoint: anthropic\n      url: https://api.anthropic.com/v1/messages\n      model: claude-sonnet-4-5\n      api_key: ${{ env.ANTHROPIC_API_KEY }}\n      prompt: \"Explain backpressure in one paragraph.\"\n<\/code><\/pre>\n<p>Generic endpoint with field extraction:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: tgi generate\n    use: std/llm@v1\n    with:\n      endpoint: generic\n      url: http://127.0.0.1:8080/generate\n      params:\n        inputs: \"Tell me a joke.\"\n        parameters: { max_new_tokens: 64 }\n      extract:\n        text: \"$.generated_text\"\n        completion_tokens: '\"generated_tokens\": (\\d+)'\n<\/code><\/pre>\n<h2>WebSocket: <code>std/ws@v1<\/code> and the <code>std/ws-*@v1<\/code> family<\/h2>\n<blockquote>\n<p>Concept-level walkthrough (styles, dynamic messages, assertions, metrics):\n<a href=\"#/docs/core/websocket\">WebSocket guide<\/a>.<\/p>\n<\/blockquote>\n<p>Two ways to
