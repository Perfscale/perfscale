{{ … }}<\/code> работает везде внутри\n<code>with:<\/code>, поэтому значения, извлечённые на предыдущих шагах, попадают сюда\nнапрямую, а токены-генераторы с одинарными фигурными скобками (<code>${uuid}<\/code>,\n<code>${rand}<\/code>, <code>${now}<\/code>) раскрываются при каждом выполнении — каждая итерация\nможет отправлять новое имя или id.<\/li>\n<li>Документ с несколькими операциями требует <code>operation: GetViewer<\/code>, чтобы\nвыбрать одну из них, — это тот же <code>operationName<\/code>, который получает сервер.<\/li>\n<li><code>method: GET<\/code> переносит операцию в query-параметры URL для чтений,\nкешируемых на CDN. Мутации остаются на POST (по умолчанию).<\/li>\n<\/ul>\n<h2>Валидация по схеме<\/h2>\n<p>Каждый запрос разбирается перед отправкой и — когда схема доступна —\nвалидируется по ней. Опечатка заваливает шаг (и <code>perfscale lint<\/code>) с\nподсказкой «возможно, вы имели в виду» вместо того, чтобы тратить запросы\nна целевой сервис:<\/p>\n<pre><code class=\"language-text\">fetch viewer: query validation failed: unknown field 'viewr' on type 'Query' — did you mean 'viewer'?\n<\/code><\/pre>\n<p>Два источника схемы:<\/p>\n<ul>\n<li><strong>Introspection<\/strong> (по умолчанию) — движок один раз за прогон отправляет\nintrospection-запрос на эндпоинт, кеширует схему на весь процесс и\nвалидирует по ней каждый запрос. Один сетевой обход на эндпоинт, независимо\nот числа VU.<\/li>\n<li><strong><code>schema_file: schema.graphql<\/code><\/strong> — валидация по локальному SDL-файлу.\nЭто запасной вариант для эндпоинтов, которые запрещают introspection\n(типично для продакшена): если introspection не удался и <code>schema_file<\/code>\nне задан, шаг всё равно выполняется — без валидации, с одной строкой\n<code>[sys]<\/code> в логе об этом. <code>introspection: false<\/code> полностью отключает\nполучение схемы.<\/li>\n<\/ul>\n<p><code>perfscale lint<\/code> применяет тот же барьер: синтаксис — всегда (офлайн), схема —\nкогда эндпоинт доступен или задан SDL-файл. <code>perfscale lint --offline<\/code>\nпропускает сетевую проверку.<\/p>\n<h2>Что считается ошибкой<\/h2>\n<p>Ошибки GraphQL приходят в теле ответа со статусом <code>200 OK<\/code>, поэтому одного\nHTTP-статуса для вердикта недостаточно:<\/p>\n<ul>\n<li>HTTP-статус ≥ 400 → шаг падает.<\/li>\n<li>есть <code>errors<\/code>, а <code>data<\/code> равно null или отсутствует → шаг падает (ничего не\nразрешилось).<\/li>\n<li>частичные <code>data<\/code> <strong>плюс<\/strong> <code>errors<\/code> → шаг <strong>проходит<\/strong> — сервер разрешил то,\nчто смог, — а ошибки учитываются в <code>graphql_errors<\/code>.<\/li>\n<\/ul>\n<p>Стандартные проверки <code>check:<\/code> работают без изменений: <code>status<\/code>,\n<code>duration_ms_lt<\/code>, <code>body_contains<\/code> (по сырому телу ответа). Проверки на уровне\nполей читают декодированную нагрузку через шаг <code>std/check@v1<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  - name: viewer id present\n    use: std/check@v1\n    with:\n      on: viewer.data.viewer\n      message_contains: \"id\"   # …or assert via outputs interpolation\n<\/code><\/pre>\n<h2>Метрики<\/h2>\n<ul>\n<li><code>graphql_req_duration<\/code> — HDR-гистограмма в мс (процентили в сводке);\nвремя оборота каждой операции, один сэмпл на реально отправленный запрос,\nпри успехе и при ошибке. Задавайте пороги через <code>std/thresholds@v1<\/code>:\n<code>\"graphql_req_duration\": [\"p99&lt;200\"]<\/code>.<\/li>\n<li><code>graphql_req_failed<\/code> — доля ошибок, вычисляемая из\n<code>graphql_req_duration<\/code>: один сэмпл 0/1 на вызов (1 = шаг упал:\nтранспортная ошибка, HTTP-статус с ошибкой или <code>errors<\/code> без <code>data<\/code> —\nсм. выше). Используйте её для SLO-гейтов:\n<code>graphql_req_failed: [\"rate&lt;0.01\"]<\/code>. Подробности вычисления:\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<li><code>graphql_errors<\/code> — счётчик, суммируется за прогон; ошибки уровня\nGraphQL, включая те, что при частичных данных не заваливают шаг.\nЭмитируется всегда (0 на чистых ответах), поэтому проверки\n<code>graphql_errors: [\"count==0\"]<\/code> разрешаются и на здоровых прогонах.<\/li>\n<li><code>graphql_op_&lt;operationName&gt;_duration<\/code> — HDR-гистограмма в мс; задержка\nпо каждой операции, публикуется только когда операция именованная (явный\n<code>operation<\/code> или единственная именованная операция), поэтому\nкардинальность метрик ограничена определением теста. Каждая именованная\nоперация получает и производную долю <code>graphql_op_&lt;operationName&gt;_failed<\/code>.<\/li>\n<li>Запрос также попадает в стандартные агрегаты <code>http_req_duration<\/code> /\n<code>http_req_failed<\/code> / <code>http_reqs<\/code>, как любой HTTP-шаг.<\/li>\n<\/ul>\n<h2>Пул соединений<\/h2>\n<p><code>pool: per-vu<\/code> (по умолчанию) привязывает шаг к шарду HTTP-клиента виртуального\nпользователя — то же поведение keep-alive, что и у <code>std/http@v1<\/code>, поэтому VU\nпереиспользует свои тёплые соединения между итерациями. <code>pool: shared<\/code> сажает\nвсех VU на один глобальный для процесса клиент: максимальное переиспользование\nсоединений к одному эндпоинту ценой конкуренции за блокировку пула при очень\nбольшом числе VU.<\/p>\n<h2>Ограничения<\/h2>\n<ul>\n<li>Подписки не поддерживаются (транспорт — HTTP запрос/ответ); документ,\nсодержащий подписку, не пройдёт валидацию.<\/li>\n<li>Батчинг запросов (массивы операций) и инкрементальная доставка\n(<code>@defer<\/code>/<code>@stream<\/code>) не поддерживаются — одна операция на шаг.<\/li>\n<li><code>query_file<\/code> и <code>schema_file<\/code> — это доступ к файловой системе: они требуют\n<code>allow_file_actions<\/code> в конфигурации прогона и подчиняются ограничению\n<code>fs_root<\/code>.<\/li>\n<\/ul>\n","slug":"core/graphql","title":"GraphQL load testing"},{"group":"core","html_en":"<h1>gRPC load testing<\/h1>\n<p>perfscale drives <strong>gRPC<\/strong> endpoints under load with the native step engine:\nopen HTTP/2 channels, make unary calls from JSON templates, run\nclient/server/bidi streams, and measure both the request round trip and the\napplication-level message RTT alongside your HTTP/TCP/UDP/WebSocket metrics.<\/p>\n<p>Calls are <strong>dynamic<\/strong>: no protobuf codegen. The schema arrives at run time\n(from a descriptor set or server reflection), requests and responses are\nJSON, and perfscale maps between the two using protobuf-JSON rules.<\/p>\n<p>This page is the guide — what the pieces are and when to reach for which.\nPer-step parameters, outputs, and error semantics live in the\n<a href=\"#/docs/core/actions\">actions reference<\/a>;\na runnable scenario ships as\n<a href=\"../../examples/grpc.test.yaml\"><code>examples/grpc.test.yaml<\/code><\/a>, together with a\nlocal echo server to run it against\n(<code>cargo run -p perfscale-core --example grpc_echo_server<\/code>).<\/p>\n<h2>Two styles<\/h2>\n<ul>\n<li><strong>One-shot call<\/strong> (<code>std/grpc@v1<\/code>) — connect, load the schema, make one\nunary call, close in one step. Simplest for occasional probes.<\/li>\n<li><strong>Live channel<\/strong> (<code>std/grpc-connect@v1<\/code> + friends) — a channel held across\nsteps within an iteration, addressed by the id the connect step returns.\nUnary calls and streams ride the same HTTP/2 connection: the connect and\nthe schema load are paid once per iteration, not per call. Use this for any\nserious load.<\/li>\n<\/ul>\n<p>Freely mixable in one scenario.<\/p>\n<h2>Schema sources<\/h2>\n<p>Dynamic calls need the protobuf schema at run time. Both connect-capable\nsteps (<code>std/grpc@v1<\/code>, <code>std/grpc-connect@v1<\/code>) take exactly one source — the\ntwo are mutually exclusive:<\/p>\n<ul>\n<li>\n<p><strong><code>descriptor_set<\/code><\/strong> — base64 of a serialized <code>FileDescriptorSet<\/code>. Produce\none from your protos:<\/p>\n<pre><code class=\"language-bash\">protoc --descriptor_set_out=echo.pb --include_imports echo.proto\nbase64 -i echo.pb   # macOS; on Linux: base64 -w0 echo.pb\n<\/code><\/pre>\n<p>Or fetch it over HTTP in an earlier step and pipe the binary body straight\nin — a <code>std/http@v1<\/code> step returns binary payloads as <code>body_base64<\/code>:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch schema\n    use: std/http@v1\n    with: { url: \"https://schema.example.com/echo.pb\" }\n    outputs: fetch\n\n  - name: unary probe\n    use: std/grpc@v1\n    with:\n      url: grpcs://api.example.com:443\n      descriptor_set: \"${{ fetch.body_base64 }}\"\n      method: \"echo.v1.Echo/Unary\"\n      payload: { message: \"ping ${seq}\" }\n    check:\n      duration_ms_lt: 500\n<\/code><\/pre>\n<\/li>\n<li>\n<p><strong><code>reflection: true<\/code><\/strong> — fetch the schema from the server's reflection\nservice (v1 protocol); the server must have reflection enabled. The fetched\npool is cached per URL for the rest of the run, so repeated connects to one\nserver pay one reflection round trip.<\/p>\n<\/li>\n<\/ul>\n<p>A bad <code>descriptor_set<\/code> fails fast, before any network I/O. Methods are named\n<code>\"package.Service/Method\"<\/code>; a typo fails with a did-you-mean suggestion when\na known method is close enough.<\/p>\n<h2>Live channel<\/h2>\n<pre><code class=\"language-yaml\"># config.yaml — 25 concurrent VUs, each holding its own channel per iteration\nvus: 25\nduration: 5m\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - name: open channel\n    use: std/grpc-connect@v1\n    with:\n      url: grpcs://api.example.com:443\n      reflection: true\n      metadata: { authorization: \"Bearer ${{ vars.token }}\" }\n    outputs: conn\n\n  - name: unary echo\n    use: std/grpc-call@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"echo.v1.Echo/Unary\"\n      payload: { message: \"ping-${seq}\" }\n    check:\n      duration_ms_lt: 250\n\n  - name: open bidi stream\n    use: std/grpc-stream-open@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"echo.v1.Echo/Bidi\"\n    outputs: stream\n\n  - name: send events\n    use: std/grpc-stream-send@v1\n    with:\n      id: \"${{ stream.id }}\"\n      payload: { message: \"evt-${seq}\" }\n      repeat: 5\n      interval_ms: 20\n\n  - name: await echoes\n    use: std/grpc-stream-recv@v1\n    with:\n      id: \"${{ stream.id }}\"\n      until_contains: \"evt-5\"\n      timeout: 5000\n    check:\n      messages_count_gte: 5\n\n  - name: close stream\n    use: std/grpc-stream-close@v1\n    with: { id: \"${{ stream.id }}\" }\n<\/code><\/pre>\n<p>Seven steps, each with a short alias:<\/p>\n<ul>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-connect@v1<\/code><\/a> — opens the channel\nand loads the schema, returns <code>{ id, connected, duration_ms }<\/code>.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-call@v1<\/code><\/a> — one unary call on the\nchannel. A failed RPC fails the step but the channel stays usable: HTTP/2\nchannels recover, unlike a dead WebSocket.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc@v1<\/code><\/a> — the one-shot\nvariant (connect → schema → call → close).<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-stream-open@v1<\/code><\/a> — starts a\nclient-streaming, bidi, or server-streaming call, returns a stream id. For\nserver-streaming the one request goes out at open; a server-side failure\n(UNIMPLEMENTED, auth, …) surfaces at the first recv/close, not at open.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-stream-send@v1<\/code><\/a> — sends\n<code>payload<\/code> (JSON, <code>${…}<\/code> tokens expand per send) or <code>payload_base64<\/code>;\n<code>repeat<\/code> + <code>interval_ms<\/code> stream N messages from one template.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-stream-recv@v1<\/code><\/a> — reads\nuntil a <strong>stopping rule<\/strong>: <code>until_contains<\/code>, <code>until_json<\/code>, or plain\n<code>count<\/code>.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-stream-close@v1<\/code><\/a> —\nhalf-closes the request side and drains the server side to the final\nstatus.<\/li>\n<\/ul>\n<p>Channel ids are minted per VU (<code>grpc-1<\/code>, <code>grpc-2<\/code>, …), stream ids likewise\n(<code>grpcs-1<\/code>, …); both are valid only inside that VU's current iteration. A\nchannel never outlives its iteration: whatever a scenario leaves open is\ndropped at iteration end (streams are cancelled — use <code>grpc-stream-close<\/code>\nfor a clean, status-checked shutdown), and <code>grpc-connect<\/code> inside a config's\n<code>before:<\/code> setup is not useful: the setup context and its channels are gone\nbefore VUs start.<\/p>\n<h2>Dynamic payloads<\/h2>\n<p>Requests take <code>payload<\/code> (JSON → dynamic protobuf message) or\n<code>payload_base64<\/code> (serialized protobuf bytes) — mutually exclusive. The JSON\nmapping follows protobuf-JSON rules: field names accept both the proto name\nand its camelCase <code>json_name<\/code>, 64-bit ints are strings, enums are names.\nResponses appear in <code>body<\/code> (unary) and <code>messages<\/code> (streams) under the same\nrules.<\/p>\n<p>String leaves of <code>payload<\/code> may embed the same single-brace <code>${…}<\/code> tokens as\n<a href=\"#/docs/core/websocket\">WebSocket sends<\/a>, expanded per call/send\n(<code>${seq}<\/code> keeps counting per channel on unary calls, per stream on stream\nsends). <code>payload_base64<\/code> is decoded once and sent as-is — no token\nexpansion. Metadata values support <code>${{ … }}<\/code> interpolation only.<\/p>\n<h2>Asserting responses<\/h2>\n<p>Stream receive/close steps expose a <code>messages<\/code> list; <code>std/check@v1<\/code> asserts\nover it with the <strong>any<\/strong> quantifier (at least one message matches):<\/p>\n<pre><code class=\"language-yaml\">check:\n  message_contains: \"trade\"              # some message contains the substring\n  message_matches: { type: trade }       # some message JSON-subset-matches\n  messages_count_gte: 5                  # at least 5 messages arrived\n<\/code><\/pre>\n<p>For deterministic exchanges, address one message by index:\n<code>check: { on: got.messages.0, message_matches: { type: welcome } }<\/code>.<\/p>\n<p>Unary calls assert on the status code with <code>expect_status<\/code> (e.g.\n<code>expect_status: 5<\/code> passes when the server returns NOT_FOUND and fails on OK)\nand on latency with <code>check: { duration_ms_lt: … }<\/code>; the JSON <code>body<\/code> can be\naddressed field by field via <code>outputs<\/code> and <code>on:<\/code>.<\/p>\n<h2>Metrics<\/h2>\n<ul>\n<li><code>grpc_req_duration<\/code> — HDR histogram in ms (percentiles in the summary);\nunary call latency, one sample per completed call (<code>std/grpc@v1<\/code> and\n<code>std/grpc-call@v1<\/code> only, on success and on <code>expect_status<\/code> miss). Streams\ndeliberately do not feed it: their lifetimes span user steps.<\/li>\n<li><code>grpc_msg_rtt<\/code> — HDR histogram in ms; application-level message RTT. On a\nunary call it is emitted only when the status is OK (then it equals the\nrequest duration); on a stream recv it is the send→match time, reported\nonly when an <code>until_*<\/code> rule matched and a <code>grpc-stream-send<\/code> preceded it\non the same stream.<\/li>\n<li><code>grpc_msgs_sent<\/code> / <code>grpc_msgs_received<\/code> — message throughput counters,\nsummed over the run: per <code>std/grpc-call@v1<\/code> call (1 sent, 0/1 received),\nper <code>std/grpc-stream-send@v1<\/code> / <code>std/grpc-stream-recv@v1<\/code> step, and\nper <code>std/grpc-stream-close@v1<\/code> (messages drained at close).<\/li>\n<li><code>grpc_req_failed<\/code> — counter, 0/1 per call: RPCs that did not meet\n<code>expect_status<\/code>. For streams, <code>grpc-stream-close<\/code> is what turns the final\nstatus into this counter. The runner additionally derives a same-named\nfailure <strong>rate<\/strong> from <code>grpc_req_duration<\/code> (one 0/1 sample per\ninvocation), and the rate shadows this counter in the summary and in\n<code>std/thresholds@v1<\/code> — gate with <code>grpc_req_failed: [\"rate&lt;…\"]<\/code>, not\n<code>count<\/code>. See\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<\/ul>\n<p>Unlike the WebSocket handshake, gRPC steps never feed <code>http_req_duration<\/code> /\n<code>http_req_failed<\/code> — the <code>grpc_*<\/code> series are the whole story, and a failed\nconnect emits no metrics at all (no RPC was made).<\/p>\n<h2>Limits<\/h2>\n<p>Inbound messages are capped by <code>max_recv_size<\/code> (default 16 MiB); an\noversized message fails the call with RESOURCE_EXCEEDED. Binary (<code>-bin<\/code>)\nmetadata keys are not supported — metadata values are strings. Server\nreflection must be explicitly enabled on the server for <code>reflection: true<\/code>\nto work. Timeout values, <code>repeat<\/code> counts, and drain lengths have no built-in\ncaps.<\/p>\n","html_ru":"<h1>Нагрузочное тестирование gRPC<\/h1>\n<p>perfscale нагружает <strong>gRPC<\/strong>-эндпоинты с помощью встроенного движка шагов:\nоткрывает HTTP/2-каналы, выполняет унарные вызовы из JSON-шаблонов, запускает\nклиентские/серверные/двунаправленные стримы и измеряет как полный круговой путь\nзапроса, так и RTT сообщений на уровне приложения — наряду с метриками\nHTTP/TCP/UDP/WebSocket.<\/p>\n<p>Вызовы <strong>динамические<\/strong>: генерация кода по protobuf не требуется. Схема\nприходит во время выполнения (из дескриптор-сета или через серверный\nreflection), запросы и ответы представлены в JSON, а perfscale преобразует их\nпо правилам protobuf-JSON.<\/p>\n<p>Эта страница — руководство: из чего всё состоит и когда что использовать.\nПараметры, выходы и семантика ошибок каждого шага описаны в\n<a href=\"#/docs/core/actions\">справочнике actions<\/a>;\nготовый к запуску сценарий поставляется как\n<a href=\"../../examples/grpc.test.yaml\"><code>examples/grpc.test.yaml<\/code><\/a> вместе с локальным\nэхо-сервером для проверки\n(<code>cargo run -p perfscale-core --example grpc_echo_server<\/code>).<\/p>\n<h2>Два стиля<\/h2>\n<ul>\n<li><strong>Разовый вызов<\/strong> (<code>std/grpc@v1<\/code>) — подключиться, загрузить схему, сделать\nодин унарный вызов и закрыть соединение в одном шаге. Самый простой вариант\nдля редких проб.<\/li>\n<li><strong>Живой канал<\/strong> (<code>std/grpc-connect@v1<\/code> и сопутствующие шаги) — канал,\nудерживаемый между шагами внутри итерации и адресуемый по id, который\nвозвращает шаг подключения. Унарные вызовы и стримы идут по одному\nHTTP/2-соединению: подключение и загрузка схемы оплачиваются один раз на\nитерацию, а не на вызов. Используйте этот стиль для любой серьёзной\nнагрузки.<\/li>\n<\/ul>\n<p>Оба стиля свободно сочетаются в одном сценарии.<\/p>\n<h2>Источники схемы<\/h2>\n<p>Динамическим вызовам нужна protobuf-схема во время выполнения. Оба шага с\nподключением (<code>std/grpc@v1<\/code>, <code>std/grpc-connect@v1<\/code>) принимают ровно один\nисточник — они взаимоисключающие:<\/p>\n<ul>\n<li>\n<p><strong><code>descriptor_set<\/code><\/strong> — base64 от сериализованного <code>FileDescriptorSet<\/code>.\nСгенерируйте его из своих proto-файлов:<\/p>\n<pre><code class=\"language-bash\">protoc --descriptor_set_out=echo.pb --include_imports echo.proto\nbase64 -i echo.pb   # macOS; on Linux: base64 -w0 echo.pb\n<\/code><\/pre>\n<p>Или получите его по HTTP на более раннем шаге и передайте бинарное тело\nнапрямую — шаг <code>std/http@v1<\/code> возвращает бинарные ответы как <code>body_base64<\/code>:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch schema\n    use: std/http@v1\n    with: { url: \"https://schema.example.com/echo.pb\" }\n    outputs: fetch\n\n  - name: unary probe\n    use: std/grpc@v1\n    with:\n      url: grpcs://api.example.com:443\n      descriptor_set: \"${{ fetch.body_base64 }}\"\n      method: \"echo.v1.Echo/Unary\"\n      payload: { message: \"ping ${seq}\" }\n    check:\n      duration_ms_lt: 500\n<\/code><\/pre>\n<\/li>\n<li>\n<p><strong><code>reflection: true<\/code><\/strong> — получить схему через сервис reflection сервера\n(протокол v1); на сервере reflection должен быть включён. Полученный пул\nкэшируется по URL до конца прогона, так что повторные подключения к одному\nсерверу тратят всего один reflection-запрос.<\/p>\n<\/li>\n<\/ul>\n<p>Некорректный <code>descriptor_set<\/code> завершается с ошибкой сразу, до любого сетевого\nввода-вывода. Методы именуются как <code>\"package.Service/Method\"<\/code>; при опечатке\nошибка содержит подсказку «возможно, вы имели в виду», если известный метод\nдостаточно похож.<\/p>\n<h2>Живой канал<\/h2>\n<pre><code class=\"language-yaml\"># config.yaml — 25 concurrent VUs, each holding its own channel per iteration\nvus: 25\nduration: 5m\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - name: open channel\n    use: std/grpc-connect@v1\n    with:\n      url: grpcs://api.example.com:443\n      reflection: true\n      metadata: { authorization: \"Bearer ${{ vars.token }}\" }\n    outputs: conn\n\n  - name: unary echo\n    use: std/grpc-call@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"echo.v1.Echo/Unary\"\n      payload: { message: \"ping-${seq}\" }\n    check:\n      duration_ms_lt: 250\n\n  - name: open bidi stream\n    use: std/grpc-stream-open@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"echo.v1.Echo/Bidi\"\n    outputs: stream\n\n  - name: send events\n    use: std/grpc-stream-send@v1\n    with:\n      id: \"${{ stream.id }}\"\n      payload: { message: \"evt-${seq}\" }\n      repeat: 5\n      interval_ms: 20\n\n  - name: await echoes\n    use: std/grpc-stream-recv@v1\n    with:\n      id: \"${{ stream.id }}\"\n      until_contains: \"evt-5\"\n      timeout: 5000\n    check:\n      messages_count_gte: 5\n\n  - name: close stream\n    use: std/grpc-stream-close@v1\n    with: { id: \"${{ stream.id }}\" }\n<\/code><\/pre>\n<p>Семь шагов, каждый с коротким псевдонимом:<\/p>\n<ul>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-connect@v1<\/code><\/a> — открывает канал и\nзагружает схему, возвращает <code>{ id, connected, duration_ms }<\/code>.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-call@v1<\/code><\/a> — один унарный вызов по\nканалу. Неудачный RPC проваливает шаг, но канал остаётся рабочим:\nHTTP/2-каналы восстанавливаются, в отличие от мёртвого WebSocket.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc@v1<\/code><\/a> — разовый вариант\n(подключение → схема → вызов → закрытие).<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-stream-open@v1<\/code><\/a> — запускает\nклиентский стриминг, двунаправленный или серверный стриминг и возвращает id\nстрима. Для серверного стриминга единственный запрос уходит при открытии;\nошибка на стороне сервера (UNIMPLEMENTED, аутентификация, …) проявится при\nпервом recv/close, а не при open.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-stream-send@v1<\/code><\/a> — отправляет\n<code>payload<\/code> (JSON, токены <code>${…}<\/code> подставляются при каждой отправке) или\n<code>payload_base64<\/code>; <code>repeat<\/code> + <code>interval_ms<\/code> отправляют N сообщений из одного\nшаблона.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-stream-recv@v1<\/code><\/a> — читает до\nсрабатывания <strong>правила остановки<\/strong>: <code>until_contains<\/code>, <code>until_json<\/code> или\nпросто <code>count<\/code>.<\/li>\n<li><a href=\"#/docs/core/actions\"><code>std/grpc-stream-close@v1<\/code><\/a> —\nполузакрывает сторону запросов и дочитывает сторону сервера до финального\nстатуса.<\/li>\n<\/ul>\n<p>Id каналов выдаются на каждого VU (<code>grpc-1<\/code>, <code>grpc-2<\/code>, …), id стримов —\nаналогично (<code>grpcs-1<\/code>, …); оба действительны только внутри текущей итерации\nэтого VU. Канал никогда не переживает свою итерацию: всё, что сценарий\nоставил открытым, сбрасывается в конце итерации (стримы отменяются — для\nчистого завершения с проверкой статуса используйте <code>grpc-stream-close<\/code>), а\n<code>grpc-connect<\/code> в блоке <code>before:<\/code> конфига бесполезен: контекст настройки и его\nканалы исчезают до старта VU.<\/p>\n<h2>Динамические payload<\/h2>\n<p>Запросы принимают <code>payload<\/code> (JSON → динамическое protobuf-сообщение) или\n<code>payload_base64<\/code> (сериализованные protobuf-байты) — взаимоисключающие. JSON\nпреобразуется по правилам protobuf-JSON: имена полей принимаются как в виде\nимени из proto, так и в camelCase <code>json_name<\/code>, 64-битные целые — строками,\nперечисления — именами. Ответы появляются в <code>body<\/code> (унарные вызовы) и\n<code>messages<\/code> (стримы) по тем же правилам.<\/p>\n<p>Строковые листья <code>payload<\/code> могут содержать те же токены с одинарными скобками\n<code>${…}<\/code>, что и при <a href=\"#/docs/core/websocket\">отправке по WebSocket<\/a>, —\nони подставляются при каждом вызове/отправке (<code>${seq}<\/code> продолжает считать на\nканал при унарных вызовах и на стрим при отправках в стрим). <code>payload_base64<\/code>\nдекодируется один раз и отправляется как есть — без подстановки токенов.\nЗначения metadata поддерживают только интерполяцию <code>${{ … }}<\/code>.<\/p>\n<h2>Проверка ответов<\/h2>\n<p>Шаги приёма/закрытия стрима предоставляют список <code>messages<\/code>; <code>std/check@v1<\/code>\nпроверяет его с квантором <strong>any<\/strong> (хотя бы одно сообщение совпадает):<\/p>\n<pre><code class=\"language-yaml\">check:\n  message_contains: \"trade\"              # some message contains the substring\n  message_matches: { type: trade }       # some message JSON-subset-matches\n  messages_count_gte: 5                  # at least 5 messages arrived\n<\/code><\/pre>\n<p>Для детерминированных обменов адресуйте конкретное сообщение по индексу:\n<code>check: { on: got.messages.0, message_matches: { type: welcome } }<\/code>.<\/p>\n<p>Унарные вызовы проверяют код статуса через <code>expect_status<\/code> (например,\n<code>expect_status: 5<\/code> проходит, когда сервер возвращает NOT_FOUND, и падает при\nOK) и задержку через <code>check: { duration_ms_lt: … }<\/code>; JSON-<code>body<\/code> можно\nпроверять по полям через <code>outputs<\/code> и <code>on:<\/code>.<\/p>\n<h2>Метрики<\/h2>\n<ul>\n<li><code>grpc_req_duration<\/code> — HDR-гистограмма в мс (процентили в сводке);\nзадержка унарного вызова, один сэмпл на завершённый вызов (только\n<code>std/grpc@v1<\/code> и <code>std/grpc-call@v1<\/code>, при успехе и при промахе\n<code>expect_status<\/code>). Стримы намеренно не попадают в неё: их время жизни\nохватывает пользовательские шаги.<\/li>\n<li><code>grpc_msg_rtt<\/code> — HDR-гистограмма в мс; RTT сообщения на уровне\nприложения. При унарном вызове эмитируется только когда статус OK (тогда\nравен длительности запроса); при recv в стриме это время от отправки до\nсовпадения, записывается только если сработало правило <code>until_*<\/code> и перед\nэтим на том же стриме был <code>grpc-stream-send<\/code>.<\/li>\n<li><code>grpc_msgs_sent<\/code> / <code>grpc_msgs_received<\/code> — счётчики пропускной\nспособности сообщений, суммируются за прогон: за вызов <code>std/grpc-call@v1<\/code>\n(1 отправлено, 0/1 получено), за шаг <code>std/grpc-stream-send@v1<\/code> /\n<code>std/grpc-stream-recv@v1<\/code> и за <code>std/grpc-stream-close@v1<\/code> (дочитанные при\nзакрытии).<\/li>\n<li><code>grpc_req_failed<\/code> — счётчик, 0/1 на вызов: RPC, не соответствующие\n<code>expect_status<\/code>. Для стримов финальный статус в этот счётчик превращает\nименно <code>grpc-stream-close<\/code>. Раннер дополнительно вычисляет одноимённую\n<strong>долю ошибок<\/strong> из <code>grpc_req_duration<\/code> (один сэмпл 0/1 на вызов), и она\nзатеняет этот счётчик в сводке и в <code>std/thresholds@v1<\/code> — задавайте порог\nкак <code>grpc_req_failed: [\"rate&lt;…\"]<\/code>, а не <code>count<\/code>. См.\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<\/ul>\n<p>В отличие от WebSocket-рукопожатия, шаги gRPC никогда не попадают в\n<code>http_req_duration<\/code> / <code>http_req_failed<\/code> — серии <code>grpc_*<\/code> описывают всё\nполностью, а неудачное подключение не порождает метрик вообще (RPC не было).<\/p>\n<h2>Ограничения<\/h2>\n<p>Размер входящих сообщений ограничен <code>max_recv_size<\/code> (по умолчанию 16 МиБ);\nслишком большое сообщение проваливает вызов с RESOURCE_EXCEEDED. Бинарные\n(<code>-bin<\/code>) ключи metadata не поддерживаются — значения metadata являются\nстроками. Для работы <code>reflection: true<\/code> серверный reflection должен быть явно\nвключён на сервере. Значения таймаутов, количество повторов <code>repeat<\/code> и длина\nдренирования встроенных ограничений не имеют.<\/p>\n","slug":"core/grpc","title":"gRPC load testing"},{"group":"core","html_en":"<h1>Composing documents: <code>import<\/code><\/h1>\n<p>Both <code>-f test.yaml<\/code> and <code>-c config.yaml<\/code> accept a top-level <code>import:<\/code> key\nnaming a <strong>base document<\/strong>. The base loads first — recursively, since it may\nimport its own base — then the importing document deep-merges on top. Teams\nshare one blessed base (load shape, variables, thresholds) and each service\noverrides only what differs.<\/p>\n<pre><code class=\"language-yaml\"># perf/config/_base.yaml — owned by the platform team\nvus: 50\nduration: 5m\nvariables:\n  region: eu-west\n  base_url: https://staging.example.com\n\n# services/checkout/perf.yaml — owned by the checkout team\nimport: ../../perf/config/_base.yaml\nvariables:\n  base_url: https://checkout.staging.example.com   # region inherited\n<\/code><\/pre>\n<h2>Merge semantics<\/h2>\n<ul>\n<li><strong>Objects merge key-by-key, recursively<\/strong> — <code>variables:<\/code> from the base and\nthe importing file combine; same-name keys are won by the importing side.<\/li>\n<li><strong>Everything else is replaced<\/strong> — scalars, and arrays <em>including <code>steps:<\/code><\/em>.\nA test document that defines <code>steps:<\/code> replaces the base's list outright\n(there is no per-step splicing); one that omits <code>steps:<\/code> inherits the\nbase's list unchanged.<\/li>\n<li>Chains work: A imports B imports C → C loads first, B merges over it, A\nmerges over the result. Cycles fail with the chain printed.<\/li>\n<\/ul>\n<p>Validation runs on the <strong>merged<\/strong> document — <code>perfscale lint<\/code> and\n<code>perfscale run<\/code> both resolve imports first, so an error points at what would\nactually execute.<\/p>\n<h2>Source forms<\/h2>\n<pre><code class=\"language-yaml\"># 1. relative filesystem path — resolved against the importing file's dir\nimport: ../shared/_base.yaml\n\n# 2. raw HTTP(S) URL — the ref is already pinned in the path\nimport: \"https://raw.githubusercontent.com/org/repo/v1.2.0/perf/config/_base.yaml\"\n\n# 3. a file at a ref of any git remote (SSH or HTTPS, self-hosted included)\nimport:\n  git: git@gitlab.example.com:group/repo.git\n  ref: v1.2.0          # tag, branch, or commit SHA\n  file: perf/config/_base.yaml\n<\/code><\/pre>\n<p>Git imports shell out to your system <code>git<\/code> (<code>clone --depth 1<\/code>), so SSH keys,\ncredential helpers, and proxy settings all apply — private repos work with\nwhatever auth <code>git clone<\/code> already has. There is no libgit2 dependency.<\/p>\n<h2>Security: remote imports are opt-in<\/h2>\n<p>Import resolution happens at config-load time — <strong>before<\/strong> the\n<code>allow_file_actions<\/code> / <code>allow_process_actions<\/code> gates ever run. If the config\nitself comes from an untrusted place (say, a file in a PR), a network\n<code>import:<\/code> inside it is an SSRF primitive and a supply-chain vector: a remote\nbase could carry <code>allow_process_actions: true<\/code> plus a\n<code>std/child_process@v1<\/code> step.<\/p>\n<p>Permission to touch the network therefore comes from the <strong>caller<\/strong>, never\nfrom the document:<\/p>\n<pre><code class=\"language-sh\">perfscale run -f t.yaml -c c.yaml --allow-remote-import\nperfscale lint c.yaml --allow-remote-import\n<\/code><\/pre>\n<p>Without the flag, any URL or git import fails closed with an explanation.\nThere is deliberately no YAML field that enables it — a document cannot\ngrant itself network access.<\/p>\n<p>Origins stay confined:<\/p>\n<ul>\n<li>A document fetched from a <strong>URL<\/strong> resolves relative imports against its\nown URL. It cannot name a local filesystem path.<\/li>\n<li>A document from a <strong>git repo<\/strong> may only import files inside that same\nclone; <code>../<\/code> escapes past the repository root are rejected.<\/li>\n<li>Only local documents on your disk may start a chain into the network (and\nonly under the flag).<\/li>\n<\/ul>\n<h2>Caching<\/h2>\n<p>Git clones land under <code>~/.cache/perfscale/imports/&lt;hash(git+ref)&gt;<\/code>\n(<code>$XDG_CACHE_HOME<\/code> respected; <code>$PERFSCALE_CACHE_DIR<\/code> overrides the root).<\/p>\n<table><thead><tr><th>Ref kind<\/th><th>Behaviour<\/th><\/tr><\/thead><tbody>\n<tr><td>Commit SHA<\/td><td>Immutable — cached forever, never refetched<\/td><\/tr>\n<tr><td>Tag<\/td><td>Treated as immutable — cached forever; <code>--refresh-imports<\/code> refetches<\/td><\/tr>\n<tr><td>Branch<\/td><td>Mutable — after a 5-minute TTL the remote is revalidated with <code>git ls-remote<\/code>; a moved branch refetches, an unreachable remote falls back to the cached copy with a <code>[sys]<\/code> warning<\/td><\/tr>\n<\/tbody><\/table>\n<p>The branch rule matters: without it a floating <code>ref: main<\/code> would silently\nfreeze at whatever the first fetch saw, and every subsequent run would claim\nto test against \"latest\" while using a stale base. <code>--refresh-imports<\/code>\nforces the check immediately.<\/p>\n<p>HTTP imports are fetched per run (pin a tag or SHA in the URL for\nreproducibility).<\/p>\n<h2>Interaction with the rest of the engine<\/h2>\n<ul>\n<li><code>import<\/code> composes the <em>document<\/em>; it is not a step and consumes no\niteration time. After the merge the result is validated against the same\nJSON Schema as any plain file.<\/li>\n<li><code>${{ vars.* }}<\/code> interpolation happens at run time, after the merge — a\nbase can reference variables the importing file supplies, and vice versa.<\/li>\n<li><code>perfscale lint<\/code> reports resolution problems (missing base, cycle, remote\nblocked) as regular findings; with imports resolved it validates the\nmerged document, including the GraphQL schema pass over imported steps.<\/li>\n<\/ul>\n<h2>Limits<\/h2>\n<ul>\n<li>One <code>import<\/code> per document (chain bases instead of listing several).<\/li>\n<li>No per-step merge surgery: <code>steps:<\/code> replaces wholesale.<\/li>\n<li>Import chains are capped at 16 levels; HTTP bodies at 10 MB.<\/li>\n<\/ul>\n<p>A runnable pair lives in <a href=\"../../examples/import/\"><code>examples/import/<\/code><\/a>.<\/p>\n","html_ru":"<h1>Составные документы: <code>import<\/code><\/h1>\n<p>И <code>-f test.yaml<\/code>, и <code>-c config.yaml<\/code> принимают верхнеуровневый ключ <code>import:<\/code>,\nуказывающий <strong>базовый документ<\/strong>. База загружается первой — рекурсивно, так как\nона сама может импортировать свою базу, — а затем импортирующий документ\nглубоко объединяется поверх неё. Команды используют общий согласованный базовый\nдокумент (профиль нагрузки, переменные, пороги), а каждый сервис переопределяет\nтолько то, что отличается.<\/p>\n<pre><code class=\"language-yaml\"># perf/config/_base.yaml — owned by the platform team\nvus: 50\nduration: 5m\nvariables:\n  region: eu-west\n  base_url: https://staging.example.com\n\n# services/checkout/perf.yaml — owned by the checkout team\nimport: ../../perf/config/_base.yaml\nvariables:\n  base_url: https://checkout.staging.example.com   # region inherited\n<\/code><\/pre>\n<h2>Семантика слияния<\/h2>\n<ul>\n<li><strong>Объекты сливаются по ключам, рекурсивно<\/strong> — <code>variables:<\/code> из базы и из\nимпортирующего файла объединяются; при совпадении имён ключей побеждает\nимпортирующая сторона.<\/li>\n<li><strong>Всё остальное замещается<\/strong> — скаляры и массивы, <em>включая <code>steps:<\/code><\/em>.\nТестовый документ, определяющий <code>steps:<\/code>, целиком замещает список базы\n(пошагового сращивания нет); документ без <code>steps:<\/code> наследует список базы\nбез изменений.<\/li>\n<li>Цепочки работают: A импортирует B, B импортирует C → C загружается первым,\nB сливается поверх него, A — поверх результата. Циклы завершаются ошибкой\nс выводом всей цепочки.<\/li>\n<\/ul>\n<p>Валидация выполняется над <strong>объединённым<\/strong> документом — и <code>perfscale lint<\/code>, и\n<code>perfscale run<\/code> сначала разрешают импорты, поэтому ошибка указывает на то, что\nреально будет выполняться.<\/p>\n<h2>Формы источников<\/h2>\n<pre><code class=\"language-yaml\"># 1. relative filesystem path — resolved against the importing file's dir\nimport: ../shared/_base.yaml\n\n# 2. raw HTTP(S) URL — the ref is already pinned in the path\nimport: \"https://raw.githubusercontent.com/org/repo/v1.2.0/perf/config/_base.yaml\"\n\n# 3. a file at a ref of any git remote (SSH or HTTPS, self-hosted included)\nimport:\n  git: git@gitlab.example.com:group/repo.git\n  ref: v1.2.0          # tag, branch, or commit SHA\n  file: perf/config/_base.yaml\n<\/code><\/pre>\n<p>Git-импорты вызывают системный <code>git<\/code> (<code>clone --depth 1<\/code>), поэтому применяются\nSSH-ключи, credential helpers и настройки прокси — приватные репозитории работают\nс той аутентификацией, которая уже настроена для <code>git clone<\/code>. Зависимости от\nlibgit2 нет.<\/p>\n<h2>Безопасность: удалённые импорты включаются явно<\/h2>\n<p>Разрешение импортов происходит при загрузке конфигурации — <strong>до<\/strong> того, как\nсработают ограничения <code>allow_file_actions<\/code> / <code>allow_process_actions<\/code>. Если сама\nконфигурация получена из недоверенного источника (скажем, файл из PR), сетевой\n<code>import:<\/code> внутри неё — это примитив SSRF и вектор атаки на цепочку поставок:\nудалённая база может содержать <code>allow_process_actions: true<\/code> вместе с шагом\n<code>std/child_process@v1<\/code>.<\/p>\n<p>Поэтому разрешение на обращение к сети даёт <strong>вызывающая сторона<\/strong>, а не\nдокумент:<\/p>\n<pre><code class=\"language-sh\">perfscale run -f t.yaml -c c.yaml --allow-remote-import\nperfscale lint c.yaml --allow-remote-import\n<\/code><\/pre>\n<p>Без флага любой импорт по URL или из git завершается ошибкой с пояснением.\nYAML-поля, включающего такой доступ, намеренно не существует — документ не\nможет сам выдать себе доступ к сети.<\/p>\n<p>Источники остаются изолированными:<\/p>\n<ul>\n<li>Документ, загруженный по <strong>URL<\/strong>, разрешает относительные импорты относительно\nсобственного URL. Указать локальный путь файловой системы он не может.<\/li>\n<li>Документ из <strong>git-репозитория<\/strong> может импортировать только файлы внутри того\nже клона; выходы за пределы корня репозитория через <code>../<\/code> отклоняются.<\/li>\n<li>Только локальные документы на вашем диске могут начинать цепочку в сеть (и\nтолько при наличии флага).<\/li>\n<\/ul>\n<h2>Кэширование<\/h2>\n<p>Git-клоны размещаются в <code>~/.cache/perfscale/imports/&lt;hash(git+ref)&gt;<\/code>\n(учитывается <code>$XDG_CACHE_HOME<\/code>; <code>$PERFSCALE_CACHE_DIR<\/code> переопределяет корень).<\/p>\n<table><thead><tr><th>Тип ref<\/th><th>Поведение<\/th><\/tr><\/thead><tbody>\n<tr><td>Commit SHA<\/td><td>Неизменяемый — кэшируется навсегда, повторно не запрашивается<\/td><\/tr>\n<tr><td>Tag<\/td><td>Считается неизменяемым — кэшируется навсегда; <code>--refresh-imports<\/code> запрашивает заново<\/td><\/tr>\n<tr><td>Branch<\/td><td>Изменяемый — после 5-минутного TTL удалённый репозиторий перепроверяется через <code>git ls-remote<\/code>; сдвинувшаяся ветка запрашивается заново, недоступный удалённый репозиторий откатывается к кэшированной копии с предупреждением <code>[sys]<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<p>Правило для веток важно: без него плавающий <code>ref: main<\/code> молча застыл бы на том,\nчто увидела первая загрузка, и каждый последующий запуск утверждал бы, что\nтестирует «последнюю версию», используя устаревшую базу. <code>--refresh-imports<\/code>\nпринудительно выполняет проверку немедленно.<\/p>\n<p>HTTP-импорты запрашиваются при каждом запуске (для воспроизводимости закрепляйте\nв URL тег или SHA).<\/p>\n<h2>Взаимодействие с остальным движком<\/h2>\n<ul>\n<li><code>import<\/code> собирает <em>документ<\/em>; это не шаг, и время итераций он не расходует.\nПосле слияния результат валидируется по той же JSON Schema, что и любой\nобычный файл.<\/li>\n<li>Интерполяция <code>${{ vars.* }}<\/code> происходит во время выполнения, после слияния, —\nбаза может ссылаться на переменные, задаваемые импортирующим файлом, и\nнаоборот.<\/li>\n<li><code>perfscale lint<\/code> сообщает о проблемах разрешения импортов (отсутствующая\nбаза, цикл, заблокированный удалённый источник) как об обычных находках; после\nразрешения импортов он валидирует объединённый документ, включая проверку\nимпортированных шагов по схеме GraphQL.<\/li>\n<\/ul>\n<h2>Ограничения<\/h2>\n<ul>\n<li>Один <code>import<\/code> на документ (вместо перечисления нескольких — выстраивайте\nбазы в цепочку).<\/li>\n<li>Никакой пошаговой хирургии слияния: <code>steps:<\/code> замещается целиком.<\/li>\n<li>Цепочки импортов ограничены 16 уровнями; тела HTTP-ответов — 10 МБ.<\/li>\n<\/ul>\n<p>Готовый к запуску пример пары лежит в <a href=\"../../examples/import/\"><code>examples/import/<\/code><\/a>.<\/p>\n","slug":"core/imports","title":"Composing documents: `import`"},{"group":"core","html_en":"<h1>JMeter load testing<\/h1>\n<p>perfscale runs your <strong>existing JMeter test plans<\/strong> (<code>.jmx<\/code>) headless and\nfolds the results into the same live log stream and k6-compatible summary\nformat as every other engine. There is nothing to rewrite: keep the plan\nyou already have, point perfscale at it, and get live output plus a\nmachine-readable summary you can diff against k6, locust, and native runs.<\/p>\n<pre><code class=\"language-sh\">perfscale run --jmeter plan.jmx\n<\/code><\/pre>\n<h2>Prerequisites<\/h2>\n<p>A JMeter installation on the machine that runs the test — perfscale wraps\nit, it does not embed it:<\/p>\n<pre><code class=\"language-sh\">jmeter --version   # must be on PATH (requires a JRE)\n<\/code><\/pre>\n<p>If the binary is missing the run fails fast with\n<code>jmeter not found in PATH — install from https://jmeter.apache.org/download_jmeter.cgi (requires a JRE)<\/code>.\nOn PerfScale Cloud agents the dev docker image already ships a JRE with\nJMeter 5.6.3.<\/p>\n<h2>How a run works<\/h2>\n<p>perfscale spawns the plan in non-GUI mode and streams everything live:<\/p>\n<pre><code class=\"language-text\">jmeter -n -t &lt;plan.jmx&gt;\n<\/code><\/pre>\n<ul>\n<li><strong>JMeter owns the load shape.<\/strong> Thread groups, ramp-up, timers, and\nthroughput all come from the plan. perfscale passes no <code>-J<\/code> properties,\nand perfscale run config (<code>vus<\/code>, <code>duration<\/code>, <code>stages:<\/code>) does not apply —\nthe plan is the config.<\/li>\n<li><strong>Live output.<\/strong> JMeter's own stdout/stderr stream through while the\nrun is in progress, same as k6 or locust output.<\/li>\n<li><strong>Exit code.<\/strong> JMeter exits non-zero on plan/startup errors; sample\nfailures inside a plan do <em>not<\/em> change the exit code unless the plan\nitself gates on them. In CI the exit code is your plan-health gate.<\/li>\n<\/ul>\n<h2>The translated summary<\/h2>\n<p>After the process exits, perfscale captures JMeter's final console line\n(<code>summary = N in HH:MM:SS = R/s Avg: .. Min: .. Max: .. Err: .. (E%)<\/code>) and\ntranslates it into the k6-compatible summary block every engine reports in:<\/p>\n<pre><code class=\"language-text\">http_req_duration......: avg=4.00ms min=3.00ms max=72.00ms\nhttp_req_failed........: 0.00%\nhttp_reqs..............: 100 109.2/s\n<\/code><\/pre>\n<p><strong>No percentiles.<\/strong> The console summary does not carry them, so\n<code>http_req_duration<\/code> has <code>avg<\/code>/<code>min<\/code>/<code>max<\/code> only. If you need p95/p99, use\nJMeter's own reporting (an HTML report or a Backend Listener) alongside the\nrun — see <a href=\"#limits\">Limits<\/a>.<\/p>\n<h2>Parameterizing plans<\/h2>\n<p>Since no <code>-J<\/code> properties are passed from outside, parameterize the plan\nitself with JMeter's property functions and defaults:<\/p>\n<pre><code class=\"language-xml\">&lt;stringProp name=\"ThreadGroup.num_threads\"&gt;${__P(vus,5)}&lt;/stringProp&gt;\n&lt;stringProp name=\"LoopController.loops\"&gt;${__P(loops,20)}&lt;/stringProp&gt;\n&lt;stringProp name=\"HTTPSampler.domain\"&gt;${__P(host,127.0.0.1)}&lt;/stringProp&gt;\n&lt;stringProp name=\"HTTPSampler.port\"&gt;${__P(port,8080)}&lt;/stringProp&gt;\n<\/code><\/pre>\n<p>The defaults keep the plan runnable as-is; to vary the shape, wrap the\n<code>jmeter<\/code> invocation in a script that passes <code>-Jvus=50 -Jloops=100<\/code>, or keep\nseveral thin plan variants for different profiles.<\/p>\n<h2>Running on an agent (PerfScale Cloud)<\/h2>\n<p>The same runner serves the platform: a JMeter-type test stores the plan\nXML, the control plane dispatches it to an agent, and the agent executes it\nvia <code>POST /api/v1/run/jmeter<\/code> — streaming the log live and landing the\ntranslated summary in the same dashboard and metrics pipeline as k6 runs.<\/p>\n<h2>Limits<\/h2>\n<ul>\n<li><strong>No percentiles<\/strong> in the summary (avg/min/max only) — the JMeter\nconsole summary doesn't carry them.<\/li>\n<li><strong>No <code>std/thresholds@v1<\/code> gates<\/strong> over JMeter runs — the exit code is the\nCI gate.<\/li>\n<li><strong><code>.jtl<\/code> result files are not parsed<\/strong> (throughput parsing of <code>.jtl<\/code> is\nfuture work).<\/li>\n<li><strong>No external parameterization<\/strong> — perfscale config and <code>-J<\/code> properties\nare not applied; the plan owns the load shape.<\/li>\n<\/ul>\n<p>Per-engine trade-offs at a glance live in the\n<a href=\"#/docs/core/runners\">runners reference<\/a>.<\/p>\n","html_ru":"<h1>Нагрузочное тестирование с JMeter<\/h1>\n<p>perfscale запускает ваши <strong>существующие тест-планы JMeter<\/strong> (<code>.jmx<\/code>) в\nheadless-режиме и сводит результаты в тот же поток логов в реальном времени\nи k6-совместимый формат сводки, что и все остальные движки. Ничего\nпереписывать не нужно: возьмите уже имеющийся план, укажите на него\nperfscale и получите живой вывод плюс машиночитаемую сводку, которую можно\nсравнивать с прогонами k6, locust и нативного движка.<\/p>\n<pre><code class=\"language-sh\">perfscale run --jmeter plan.jmx\n<\/code><\/pre>\n<h2>Предварительные требования<\/h2>\n<p>На машине, где выполняется тест, должна быть установлена JMeter — perfscale\nоборачивает её, а не встраивает:<\/p>\n<pre><code class=\"language-sh\">jmeter --version   # must be on PATH (requires a JRE)\n<\/code><\/pre>\n<p>Если бинарный файл не найден, запуск быстро завершается с ошибкой\n<code>jmeter not found in PATH — install from https://jmeter.apache.org/download_jmeter.cgi (requires a JRE)<\/code>.\nНа агентах PerfScale Cloud dev-образ docker уже содержит JRE с\nJMeter 5.6.3.<\/p>\n<h2>Как проходит прогон<\/h2>\n<p>perfscale запускает план в non-GUI-режиме и стримит всё в реальном времени:<\/p>\n<pre><code class=\"language-text\">jmeter -n -t &lt;plan.jmx&gt;\n<\/code><\/pre>\n<ul>\n<li><strong>JMeter полностью определяет форму нагрузки.<\/strong> Thread groups, ramp-up,\nтаймеры и пропускная способность — всё берётся из плана. perfscale не\nпередаёт никаких <code>-J<\/code>-свойств, а конфигурация запуска perfscale\n(<code>vus<\/code>, <code>duration<\/code>, <code>stages:<\/code>) не применяется — план и есть конфигурация.<\/li>\n<li><strong>Живой вывод.<\/strong> Собственные stdout/stderr JMeter стримятся во время\nпрогона, так же как вывод k6 или locust.<\/li>\n<li><strong>Код выхода.<\/strong> JMeter завершается с ненулевым кодом при ошибках плана\nили запуска; падения сэмплов внутри плана <em>не<\/em> меняют код выхода, если\nсам план на них не реагирует. В CI код выхода — это ваш гейт здоровья\nплана.<\/li>\n<\/ul>\n<h2>Транслированная сводка<\/h2>\n<p>После завершения процесса perfscale захватывает финальную консольную\nстроку JMeter\n(<code>summary = N in HH:MM:SS = R/s Avg: .. Min: .. Max: .. Err: .. (E%)<\/code>) и\nтранслирует её в k6-совместимый блок сводки, в котором отчитывается каждый\nдвижок:<\/p>\n<pre><code class=\"language-text\">http_req_duration......: avg=4.00ms min=3.00ms max=72.00ms\nhttp_req_failed........: 0.00%\nhttp_reqs..............: 100 109.2/s\n<\/code><\/pre>\n<p><strong>Без перцентилей.<\/strong> Консольная сводка их не содержит, поэтому у\n<code>http_req_duration<\/code> есть только <code>avg<\/code>/<code>min<\/code>/<code>max<\/code>. Если нужны p95/p99,\nиспользуйте собственные средства отчётности JMeter (HTML-отчёт или Backend\nListener) параллельно с прогоном — см. <a href=\"#%D0%BE%D0%B3%D1%80%D0%B0%D0%BD%D0%B8%D1%87%D0%B5%D0%BD%D0%B8%D1%8F\">Ограничения<\/a>.<\/p>\n<h2>Параметризация планов<\/h2>\n<p>Поскольку <code>-J<\/code>-свойства извне не передаются, параметризуйте сам план с\nпомощью property-функций JMeter и значений по умолчанию:<\/p>\n<pre><code class=\"language-xml\">&lt;stringProp name=\"ThreadGroup.num_threads\"&gt;${__P(vus,5)}&lt;/stringProp&gt;\n&lt;stringProp name=\"LoopController.loops\"&gt;${__P(loops,20)}&lt;/stringProp&gt;\n&lt;stringProp name=\"HTTPSampler.domain\"&gt;${__P(host,127.0.0.1)}&lt;/stringProp&gt;\n&lt;stringProp name=\"HTTPSampler.port\"&gt;${__P(port,8080)}&lt;/stringProp&gt;\n<\/code><\/pre>\n<p>Значения по умолчанию позволяют запускать план как есть; чтобы менять\nформу нагрузки, оберните вызов <code>jmeter<\/code> в скрипт, передающий\n<code>-Jvus=50 -Jloops=100<\/code>, или держите несколько тонких вариантов плана под\nразные профили.<\/p>\n<h2>Запуск на агенте (PerfScale Cloud)<\/h2>\n<p>Платформу обслуживает тот же раннер: тест типа JMeter хранит XML плана,\ncontrol plane отправляет его на агент, и агент выполняет его через\n<code>POST /api/v1/run/jmeter<\/code> — стримя лог в реальном времени и помещая\nтранслированную сводку в тот же дашборд и тот же конвейер метрик, что и\nпрогоны k6.<\/p>\n<h2>Ограничения<\/h2>\n<ul>\n<li><strong>Без перцентилей<\/strong> в сводке (только avg/min/max) — консольная сводка\nJMeter их не содержит.<\/li>\n<li><strong>Нет гейтов <code>std/thresholds@v1<\/code><\/strong> для прогонов JMeter — гейтом в CI\nслужит код выхода.<\/li>\n<li><strong>Файлы результатов <code>.jtl<\/code> не разбираются<\/strong> (парсинг пропускной\nспособности из <code>.jtl<\/code> — план на будущее).<\/li>\n<li><strong>Без внешней параметризации<\/strong> — конфигурация perfscale и <code>-J<\/code>-свойства\nне применяются; формой нагрузки управляет план.<\/li>\n<\/ul>\n<p>Сводное сравнение компромиссов по движкам см. в\n<a href=\"#/docs/core/runners\">справочнике раннеров<\/a>.<\/p>\n","slug":"core/jmeter","title":"JMeter load testing"},{"group":"core","html_en":"<h1>Kubernetes<\/h1>\n<p>Two ways to run perfscale in a cluster: one-shot or scheduled <strong>Jobs<\/strong> for\nthe CLI itself (the Helm chart below), and the <strong>perfscaled agent<\/strong> as a\nDaemonSet (it joins your fleet and picks up platform tasks).<\/p>\n<h2>The perfscale chart (Jobs and CronJobs)<\/h2>\n<p>The <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/charts\">Perfscale/charts<\/a> repo ships the\nCLI as a chart — a one-shot Job by default, a CronJob when <code>schedule<\/code> is\nset:<\/p>\n<pre><code class=\"language-sh\">helm repo add perfscale https://raw.githubusercontent.com/Perfscale/charts/main/\nhelm install smoke perfscale/perfscale                                    # one-shot Job\nhelm install nightly perfscale/perfscale --set schedule=\"0 3 * * *\"       # CronJob\n<\/code><\/pre>\n<p>The scenario comes from an inline ConfigMap (<code>--set-file scenario.test=my.test.yaml<\/code>) or an existing one\n(<code>--set scenario.existingConfigMap=…<\/code>). The default scenario is a\nself-contained SQLite smoke test, so <code>helm install<\/code> works out of the box.\nEngine flavors (<code>image.flavor: k6|jmeter|locust|full<\/code>), resource limits and\nextra CLI args are plain values — see the chart's <code>values.yaml<\/code>.<\/p>\n<h3>Libraries on the chart (RFC 005)<\/h3>\n<p>Enable <code>cache.enabled<\/code> to get a <code>library-cache<\/code> PVC mounted at\n<code>/var/lib/perfscale/cache<\/code> (<code>PERFSCALE_CACHE_DIR<\/code>): pre-populate it with\n<code>perfscale install<\/code> (from a one-time Job on the same claim) and every run\nreads libraries from the shared cache. With the cache disabled, libraries\nride the scenario volume like in Docker, or are burned into a standalone\nbinary.<\/p>\n<h2>One-shot runs as plain Jobs<\/h2>\n<p>No Helm needed — the <a href=\"#/docs/core/docker\">engine images<\/a> work as plain Jobs. Mount\nthe scenario (ConfigMap for small tests, a PVC otherwise) and run:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: perfscale-smoke\nspec:\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n        - name: perfscale\n          image: ghcr.io/perfscale/perfscale:latest\n          args: [\"run\", \"-f\", \"/work/test.yaml\", \"-c\", \"/work/config.yaml\"]\n          volumeMounts:\n            - name: scenario\n              mountPath: /work\n      volumes:\n        - name: scenario\n          configMap:\n            name: perfscale-smoke\n<\/code><\/pre>\n<p>Libraries work the same as in Docker: local components ride the mounted\nvolume (paths resolve relative to the declaring file); remote ones need a\nshared install cache (<code>PERFSCALE_CACHE_DIR<\/code> on a PVC) populated by\n<code>perfscale install<\/code>, or a <a href=\"#/docs/core/docker\">burned standalone binary<\/a>\nwith libraries embedded.<\/p>\n<h2>The perfscaled agent (DaemonSet)<\/h2>\n<p>The platform agent runs one pod per node as a DaemonSet and joins your\nfleet. Its Helm chart is parked until the agent ships a container image —\ntrack <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/charts/issues/1\">Perfscale/charts#1<\/a>;\nthe chart source from before the park is in the repo's git history\n(<code>git show 9718911:perfscaled/values.yaml<\/code>).<\/p>\n<p>Agents enforce a fail-closed fleet policy on <code>libraries:<\/code> declared by\ntasks:<\/p>\n<ul>\n<li><code>PERFSCALE_LIBRARY_CAPABILITIES<\/code> — the fleet ceiling (<code>fs<\/code>, <code>clock<\/code>,\n<code>net:&lt;host&gt;<\/code> globs). Default: <strong>none<\/strong> — libraries run, but with zero\ncapabilities. A task granting more is rejected with a validation error,\nnever silently downgraded.<\/li>\n<li><code>PERFSCALE_LIBRARY_ALLOW_DIGESTS<\/code> — optional sha256 allowlist of\nartifacts permitted on the fleet at all.<\/li>\n<li>Remote libraries are never fetched at run time: they are installed by\ndigest (<code>perfscaled library install &lt;url&gt; --sha256 …<\/code> or\n<code>POST /api/v1/libraries/install<\/code>) into a content-addressed cache, and the\ncached bytes are re-hashed when a task is accepted.<\/li>\n<\/ul>\n<h2>Links<\/h2>\n<ul>\n<li><a href=\"#/docs/core/docker\">Running perfscale in Docker<\/a> — images, flavors, mounting<\/li>\n<li><a href=\"#/docs/core/libraries\">Libraries guide<\/a> — the libraries feature itself<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/charts\">Perfscale/charts<\/a> — chart source<\/li>\n<\/ul>\n","html_ru":"<h1>Kubernetes<\/h1>\n<p>Есть два способа запускать perfscale в кластере: разовые или расписанием\n<strong>Jobs<\/strong> для самого CLI (Helm-чарт ниже) и <strong>агент perfscaled<\/strong> в виде\nDaemonSet (он присоединяется к вашему флоту и забирает задачи платформы).<\/p>\n<h2>Чарт perfscale (Jobs и CronJobs)<\/h2>\n<p>Репозиторий <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/charts\">Perfscale/charts<\/a>\nпоставляет CLI в виде чарта — по умолчанию разовый Job, а при заданном\n<code>schedule<\/code> — CronJob:<\/p>\n<pre><code class=\"language-sh\">helm repo add perfscale https://raw.githubusercontent.com/Perfscale/charts/main/\nhelm install smoke perfscale/perfscale                                    # one-shot Job\nhelm install nightly perfscale/perfscale --set schedule=\"0 3 * * *\"       # CronJob\n<\/code><\/pre>\n<p>Сценарий берётся из встроенного ConfigMap (<code>--set-file scenario.test=my.test.yaml<\/code>) или из существующего\n(<code>--set scenario.existingConfigMap=…<\/code>). Сценарий по умолчанию —\nсамодостаточный smoke-тест на SQLite, так что <code>helm install<\/code> работает из\nкоробки. Варианты движка (<code>image.flavor: k6|jmeter|locust|full<\/code>), лимиты\nресурсов и дополнительные аргументы CLI задаются обычными values — см.\n<code>values.yaml<\/code> чарта.<\/p>\n<h3>Библиотеки в чарте (RFC 005)<\/h3>\n<p>Включите <code>cache.enabled<\/code>, чтобы получить PVC <code>library-cache<\/code>,\nсмонтированный в <code>/var/lib/perfscale/cache<\/code> (<code>PERFSCALE_CACHE_DIR<\/code>):\nзаполните его заранее с помощью <code>perfscale install<\/code> (из разового Job на\nтом же claim), и каждый запуск будет читать библиотеки из общего кеша. С\nотключённым кешем библиотеки едут на том же томе, что и сценарий, как в\nDocker, либо вжигаются в автономный бинарник.<\/p>\n<h2>Разовые запуски обычными Jobs<\/h2>\n<p>Helm не нужен — <a href=\"#/docs/core/docker\">образы движков<\/a> работают как обычные Jobs.\nСмонтируйте сценарий (ConfigMap для небольших тестов, иначе PVC) и\nзапустите:<\/p>\n<pre><code class=\"language-yaml\">apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: perfscale-smoke\nspec:\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n        - name: perfscale\n          image: ghcr.io/perfscale/perfscale:latest\n          args: [\"run\", \"-f\", \"/work/test.yaml\", \"-c\", \"/work/config.yaml\"]\n          volumeMounts:\n            - name: scenario\n              mountPath: /work\n      volumes:\n        - name: scenario\n          configMap:\n            name: perfscale-smoke\n<\/code><\/pre>\n<p>Библиотеки работают так же, как в Docker: локальные компоненты едут на\nсмонтированном томе (пути разрешаются относительно объявляющего файла);\nудалённым нужен общий кеш установки (<code>PERFSCALE_CACHE_DIR<\/code> на PVC),\nзаполненный командой <code>perfscale install<\/code>, либо\n<a href=\"#/docs/core/docker\">вжигаемый автономный бинарник<\/a> со встроенными\nбиблиотеками.<\/p>\n<h2>Агент perfscaled (DaemonSet)<\/h2>\n<p>Агент платформы запускается по одному поду на узел в виде DaemonSet и\nприсоединяется к вашему флоту. Его Helm-чарт припаркован до тех пор, пока\nагент не выпустит контейнерный образ — следите за\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/charts/issues/1\">Perfscale/charts#1<\/a>; исходники\nчарта до парковки есть в git-истории репозитория\n(<code>git show 9718911:perfscaled/values.yaml<\/code>).<\/p>\n<p>Агенты применяют fail-closed политику флота к <code>libraries:<\/code>, объявленным в\nзадачах:<\/p>\n<ul>\n<li><code>PERFSCALE_LIBRARY_CAPABILITIES<\/code> — потолок флота (<code>fs<\/code>, <code>clock<\/code>,\n<code>net:&lt;host&gt;<\/code> — glob-шаблоны). По умолчанию: <strong>none<\/strong> — библиотеки\nзапускаются, но с нулевым набором capability. Задача, запрашивающая\nбольше, отклоняется с ошибкой валидации и никогда не понижается молча.<\/li>\n<li><code>PERFSCALE_LIBRARY_ALLOW_DIGESTS<\/code> — необязательный allowlist sha256\nартефактов, вообще допущенных на флоте.<\/li>\n<li>Удалённые библиотеки никогда не скачиваются во время выполнения: они\nустанавливаются по дайджесту (<code>perfscaled library install &lt;url&gt; --sha256 …<\/code>\nили <code>POST /api/v1/libraries/install<\/code>) в content-addressed кеш, а\nзакешированные байты перехешируются при принятии задачи.<\/li>\n<\/ul>\n<h2>Ссылки<\/h2>\n<ul>\n<li><a href=\"#/docs/core/docker\">Запуск perfscale в Docker<\/a> — образы, варианты, монтирование<\/li>\n<li><a href=\"#/docs/core/libraries\">Руководство по библиотекам<\/a> — сама функциональность библиотек<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/charts\">Perfscale/charts<\/a> — исходники чарта<\/li>\n<\/ul>\n","slug":"core/kubernetes","title":"Kubernetes"},{"group":"core","html_en":"<h1>Libraries — custom value generators (WASM)<\/h1>\n<p>Every perfscale payload can embed <code>${...}<\/code> generator tokens — <code>${seq}<\/code>,\n<code>${uuid}<\/code>, <code>${rand(1,100)}<\/code> — that the engine expands when a message is\nsent. <strong>Libraries<\/strong> are the extension point: a library contributes its own\nfunctions, callable from any payload as <code>${alias.fn(...)}<\/code> with the same\nsyntax across every protocol (HTTP, WebSocket, gRPC, GraphQL, raw TCP/UDP,\nLLM prompts, DB parameters).<\/p>\n<p>A library is either a <strong>built-in<\/strong> shipped with the engine (<code>@std/random<\/code>)\nor a <strong>WASM component<\/strong> you wrote yourself — this page covers both, with a\nfocus on authoring your own. The full config surface lives in the\n<a href=\"#/docs/yaml-reference\">YAML reference<\/a>; the design\nrationale is <a href=\"#/docs/rfcs/005-libraries\">RFC 005<\/a>.<\/p>\n<h2>Declaring and using<\/h2>\n<pre><code class=\"language-yaml\">libraries:\n  - use: '@std/random@v1'        # built-in, no files needed\n    capabilities: []             # required key — [] means \"no grants\"\n\nsteps:\n  - use: std/db-query@v1\n    with:\n      query: INSERT INTO orders (id, code, who) VALUES (?, ?, ?)\n      params:\n        - \"${random.ulid()}\"\n        - \"${random.pattern(\"ORD-####-^^\")}\"\n        - \"${random.email()}\"\n<\/code><\/pre>\n<ul>\n<li><code>use:<\/code> — a built-in <code>@ns/name@vN<\/code> reference (quotes required), a local\n<code>.wasm<\/code> path (relative to the declaring file), an HTTPS URL (requires\n<code>sha256:<\/code>), or a <code>git+&lt;repo&gt;@&lt;ref&gt;#&lt;path&gt;<\/code> reference.<\/li>\n<li><code>as:<\/code> — the token prefix. Default is the library's own name.<\/li>\n<li><code>capabilities:<\/code> — explicit sandbox grants, see below. <strong>Required on every\nentry<\/strong> — an empty list (<code>capabilities: []<\/code>) means \"no grants\". Omitting\nthe key is a validation error. Migration from older documents: add\n<code>capabilities: []<\/code> to every entry that has no grants.<\/li>\n<li><code>with:<\/code> — JSON config passed to the library's <code>init()<\/code>; may use\n<code>${{ env.X }}<\/code> so secrets stay masked in logs.<\/li>\n<\/ul>\n<p>Remote sources (<code>https:<\/code>, <code>git+<\/code>) are <strong>never fetched at run time<\/strong>:\n<code>perfscale install<\/code> downloads each one once, verifies the digest, stores it\nin a content-addressed cache, and writes a <code>perfscale.lock<\/code> next to the\ndeclaring file — commit the lock. <code>run<\/code> and <code>lint<\/code> then resolve everything\nfully offline.<\/p>\n<p>Token semantics in short:<\/p>\n<ul>\n<li>Built-in tokens (<code>${seq}<\/code>, <code>${rand}<\/code>, …) match first and are unchanged; an\nalias may not shadow them.<\/li>\n<li>Unknown alias → the token stays verbatim (backward compatible; <code>perfscale lint<\/code> flags it). Known alias + unknown function → the <strong>step fails<\/strong> — a\ntypo must not ship silently into a payload.<\/li>\n<li>Any function's optional trailing <code>key<\/code> argument <strong>memoizes<\/strong> the result\nwithin one message: two <code>${random.uuid4(order)}<\/code> in one message yield one\nid; the next message generates a fresh one.<\/li>\n<li><code>seed: 42<\/code> in the config makes a run reproducible — every library call\ncarries a per-message seed derived as <code>hash(seed, vu_id, conn_seq)<\/code>, so\ntwo seeded runs mint the same values.<\/li>\n<\/ul>\n<h3>Instance lifecycle<\/h3>\n<p>WASM instances are expensive to create (<code>Store::new<\/code> + WASI wiring +\n<code>init()<\/code>), so the engine keeps <strong>one instance per library per VU<\/strong>, reused\nby every message and connection that VU runs — not one per step. <code>init()<\/code>\ntherefore runs once per VU, and instance state persists across that VU's\nmessages; per-message isolation (memo keys) still holds because every\nmessage carries a distinct <code>message_seq<\/code>. Memory: a fresh store is lazy —\nmeasured ~0.5 MiB RSS per instance for a small component (500 VUs ≈\n250 MB total engine RSS; the 64 MiB limit is a cap, not an allocation), so\neven 1000 VUs with a WASM library stay in the hundreds of MB — but a\ncomponent that eagerly allocates its linear memory multiplies that. The\nbuilt-in <code>@std/random@v1<\/code> is <em>not<\/em> shared: its PRNG is seeded per instance\n(<code>hash(config.seed, vu_id, conn_seq)<\/code>), and sharing would change the value\nsequence — it stays per-generator.<\/p>\n<ul>\n<li>A failed call (guest error, trap, timeout) fails the step with the cause\nrecorded — a load test never sends wrong data and reports green.<\/li>\n<\/ul>\n<h2>The <code>@std/random@v1<\/code> built-in<\/h2>\n<p>Ships with the engine — no WASM, no install, no capabilities. Every\nfunction accepts the optional trailing memo <code>key<\/code>:<\/p>\n<table><thead><tr><th>Function<\/th><th>Returns<\/th><\/tr><\/thead><tbody>\n<tr><td><code>uuid4([key])<\/code> / <code>uuid7([key])<\/code><\/td><td>Random v4 / time-ordered v7 UUID<\/td><\/tr>\n<tr><td><code>ulid([key])<\/code><\/td><td>26-char Crockford-base32 ULID<\/td><\/tr>\n<tr><td><code>nanoid([len], [key])<\/code><\/td><td>URL-safe id (default len 21)<\/td><\/tr>\n<tr><td><code>int(a, b, [key])<\/code><\/td><td>Random integer in <code>[a, b]<\/code><\/td><\/tr>\n<tr><td><code>float(a, b, [dp], [key])<\/code><\/td><td>Random float, <code>dp<\/code> decimals<\/td><\/tr>\n<tr><td><code>pick(a|b|c, [key])<\/code><\/td><td>Random pick among <code>|<\/code>-separated options<\/td><\/tr>\n<tr><td><code>weighted(a:10|b:90, [key])<\/code><\/td><td>Weighted random pick<\/td><\/tr>\n<tr><td><code>seq(name)<\/code><\/td><td>Named monotonic counter, starts at 1<\/td><\/tr>\n<tr><td><code>pattern(\"ORD-####-????\")<\/code><\/td><td>Template fill: <code>#<\/code>→digit, <code>?<\/code>→a-z, <code>^<\/code>→A-Z, <code>*<\/code>→alphanumeric<\/td><\/tr>\n<tr><td><code>first_name()<\/code> / <code>last_name()<\/code> / <code>name()<\/code><\/td><td>Random names<\/td><\/tr>\n<tr><td><code>username()<\/code> / <code>email()<\/code> / <code>company()<\/code><\/td><td>Random username / email / company<\/td><\/tr>\n<tr><td><code>lorem([words])<\/code><\/td><td>Lorem-ipsum words (default 5)<\/td><\/tr>\n<tr><td><code>phone()<\/code><\/td><td>Random phone number<\/td><\/tr>\n<tr><td><code>date(a, b)<\/code> / <code>timestamp(a, b)<\/code> / <code>datetime(a, b)<\/code><\/td><td>Random dates and timestamps in a range<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Capabilities and the sandbox<\/h2>\n<p>Custom libraries run in a wasmtime sandbox under a <strong>fail-closed<\/strong>\ncapability model: the component's WASI imports are checked against the\n<code>capabilities:<\/code> grant in YAML, and a component importing more than granted\nis a hard load error. The one exception is a <strong>self-declared pure library<\/strong>:\nwhen the component's <code>info()<\/code> reports <code>\"pure\": true<\/code>, its <code>wasi:filesystem<\/code>\nand <code>wasi:clocks/wall-clock<\/code> imports are treated as toolchain noise\n(jco-built TS/JS components always carry them) and no grant is needed. The\nsandbox still holds — without an <code>fs<\/code> grant the guest gets zero preopens, so\nany actual file access fails at runtime.<\/p>\n<table><thead><tr><th>Capability<\/th><th>Host provides<\/th><th>Boundaries<\/th><\/tr><\/thead><tbody>\n<tr><td><code>fs<\/code><\/td><td><code>wasi:filesystem<\/code> preopens<\/td><td>only paths under <code>fs_root<\/code>, read-only<\/td><\/tr>\n<tr><td><code>clock<\/code><\/td><td><code>wasi:clocks<\/code><\/td><td>wall time also arrives via the call context<\/td><\/tr>\n<tr><td><code>net: [hosts]<\/code><\/td><td><code>wasi:http<\/code> outgoing-handler<\/td><td>destination host/port checked against the allowlist on every request<\/td><\/tr>\n<\/tbody><\/table>\n<p><code>net<\/code> takes a host allowlist instead of a bare flag:<\/p>\n<pre><code class=\"language-yaml\">capabilities:\n  - net: [\"api.acme.com\", \"api.acme.com:8443\", \"*.internal\"]\n<\/code><\/pre>\n<p>Entry forms (case-insensitive): <code>api.acme.com<\/code> allows that host on <strong>any<\/strong>\nport; <code>api.acme.com:8443<\/code> pins the port; <code>*.internal<\/code> allows any host under\nthe suffix (<code>db.internal<\/code>, <code>a.b.internal<\/code> — but not bare <code>internal<\/code> or\n<code>internal.evil.net<\/code>). A request to a destination outside the allowlist fails\nwith an error naming the destination. Fuel does not see time spent inside a\nhost HTTP call, so the host bounds it instead: <strong>30 s per request<\/strong> (connect,\nfirst byte, between bytes, and the overall send) and a <strong>16 MiB cap<\/strong> on both\nrequest and response bodies. <strong>Raw <code>wasi:sockets<\/code> is never provided<\/strong> — an\nallowlist is only enforceable while the host mediates the connection.<\/p>\n<p>Any non-empty grant requires <code>allow_library_capabilities: true<\/code> in the\nconfig — the same fail-closed pattern as <code>allow_file_actions<\/code>. The\n<code>capabilities:<\/code> key itself is required on every <code>libraries:<\/code> entry\n(built-ins included): write <code>capabilities: []<\/code> when the library needs no\ngrants — omitting the key is a validation error at load, lint, and run.\nRaw sockets are never provided. <code>wasi:random<\/code> is not provided either: libraries draw\nall randomness from the seeded PRNG their SDK exposes, which is what makes\n<code>seed:<\/code> runs reproducible. Per-call fuel and a wall-time timeout bound what\na runaway component can do on the hot path, and time inside a library call\nis counted in the enclosing step's duration — library cost shows up in\nmetrics, never hidden.<\/p>\n<p>A library entry can also restrict and mask its surface:<\/p>\n<pre><code class=\"language-yaml\">libraries:\n  - use: ./libs/fixer-ids.wasm\n    capabilities: []       # no sandbox grants\n    allow: [uuid4, ulid]   # only these functions callable\n    log:\n      secret: true         # mask every result of this library in the run log\n<\/code><\/pre>\n<h2>Writing your own library<\/h2>\n<p>One shape, three languages — each SDK hides the WIT plumbing\n(<code>perfscale:library@0.2.0<\/code>, WASI Preview 2) and gives you a seeded PRNG\n(bit-identical across SDKs and the engine's built-in generator),\n<code>memo()<\/code> for per-message reuse, argument helpers, and a runtime-free test\nharness.<\/p>\n<h3>TypeScript / JavaScript — <code>@perfscale/library-sdk<\/code><\/h3>\n<p>SDK and build tooling live in the\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries\">sdk-libraries<\/a> repo; install\nfrom npm:<\/p>\n<pre><code class=\"language-console\">$ npm install @perfscale/library-sdk\n<\/code><\/pre>\n<pre><code class=\"language-ts\">import { args, defineLibrary } from \"@perfscale/library-sdk\";\n\nexport default defineLibrary({\n  name: \"mylib\",\n  functions: {\n    token: {\n      description: \"Deterministic per-instance token; memo key reuses it within one message\",\n      call(argv, ctx) {\n        const mint = () =&gt; `tok-${ctx.rng().nextU64().toString(16)}`;\n        const key = args.optionalString(argv, 0);\n        return key === undefined ? mint() : ctx.memo(key, mint);\n      },\n    },\n  },\n});\n<\/code><\/pre>\n<p>Build to a WASM component (jco's ComponentizeJS embeds a JS engine):<\/p>\n<pre><code class=\"language-console\">$ npx perfscale-library-build mylib.ts -o mylib.wasm\n<\/code><\/pre>\n<p>Then reference the <code>.wasm<\/code> from <code>libraries:<\/code> and call <code>${mylib.token()}<\/code> in\npayloads. The SDK's <code>Ctx<\/code> carries <code>messageSeq<\/code>, <code>iterationSeq<\/code>, <code>vuId<\/code>,\n<code>seed<\/code>, <code>timeMs<\/code>, plus <code>ctx.memo()<\/code> and <code>ctx.rng()<\/code>; <code>testCall<\/code> runs unit\ntests under <code>node:test<\/code> with no WASM involved.<\/p>\n<p>Sandboxing note: jco components always import <code>wasi:filesystem<\/code> and\n<code>wasi:clocks/wall-clock<\/code>. A TS library that declares <code>\"pure\": true<\/code> in its\n<code>info()<\/code> metadata needs no <code>capabilities:<\/code> grant for those imports — the\nengine links the interfaces but provides no preopens, so real file access\nwould still fail. Libraries that do read files keep declaring\n<code>capabilities: [fs]<\/code> (one <code>fs<\/code> grant satisfies both interfaces).<\/p>\n<h3>Rust — <code>perfscale-library-sdk<\/code><\/h3>\n<p>Full SDK in the main repo:\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/tree/main/crates/perfscale-library-sdk\"><code>crates/perfscale-library-sdk<\/code><\/a>,\nbuilds to <code>wasm32-wasip2<\/code> with no extra toolchain. The\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/library-random\">library-random<\/a> repo — the\nWASM port of <code>@std/random<\/code> — doubles as the reference implementation and\nauthor template.<\/p>\n<h3>Go — documented recipe (experimental)<\/h3>\n<p>TinyGo + <code>wasm32-wasip2<\/code> + <code>wit-bindgen-go<\/code> walkthrough in\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries/blob/main/go/README.md\"><code>go/README.md<\/code><\/a>\nof the sdk-libraries repo. No SDK crate yet — the WIT contract is the same,\nso generated bindings work against any perfscale release speaking\n<code>perfscale:library@0.2.0<\/code>.<\/p>\n<h3>Starting from a template<\/h3>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/library-template\">library-template<\/a> is a\nminimal ready-to-build library (greet + memoized token) with the SDK wired\nup — clone it, rename, and add functions.<\/p>\n<h2>Availability and linting<\/h2>\n<p>Libraries are part of the test/config YAML, so the same definition runs\nfrom the CLI and on your machines. The <code>@std/random<\/code> built-in needs no\nfiles at all; custom WASM components must be present on the load generator\n(relative paths resolve against the declaring file, remote refs come from\nthe install cache). <code>perfscale lint<\/code> loads declared libraries and validates\nevery <code>${alias.fn(...)}<\/code> token against the functions they actually export —\ntypos are caught before the run.<\/p>\n","html_ru":"<h1>Библиотеки — пользовательские генераторы значений (WASM)<\/h1>\n<p>Каждый payload в perfscale может содержать токены-генераторы <code>${...}<\/code> —\n<code>${seq}<\/code>, <code>${uuid}<\/code>, <code>${rand(1,100)}<\/code> — которые движок подставляет при\nотправке сообщения. <strong>Библиотеки<\/strong> — это точка расширения: библиотека\nдобавляет собственные функции, которые можно вызывать из любого payload как\n<code>${alias.fn(...)}<\/code> с одинаковым синтаксисом во всех протоколах (HTTP,\nWebSocket, gRPC, GraphQL, сырой TCP/UDP, LLM-промпты, параметры БД).<\/p>\n<p>Библиотека — это либо <strong>встроенный<\/strong> модуль, поставляемый с движком\n(<code>@std/random<\/code>), либо <strong>WASM-компонент<\/strong>, написанный вами, — эта страница\nрассматривает оба варианта с акцентом на создание собственных. Полное\nописание конфигурации находится в\n<a href=\"#/docs/yaml-reference\">YAML-справочнике<\/a>; обоснование\nдизайна — в <a href=\"#/docs/rfcs/005-libraries\">RFC 005<\/a>.<\/p>\n<h2>Объявление и использование<\/h2>\n<pre><code class=\"language-yaml\">libraries:\n  - use: '@std/random@v1'        # built-in, no files needed\n    capabilities: []             # required key — [] means \"no grants\"\n\nsteps:\n  - use: std/db-query@v1\n    with:\n      query: INSERT INTO orders (id, code, who) VALUES (?, ?, ?)\n      params:\n        - \"${random.ulid()}\"\n        - \"${random.pattern(\"ORD-####-^^\")}\"\n        - \"${random.email()}\"\n<\/code><\/pre>\n<ul>\n<li><code>use:<\/code> — ссылка на встроенную библиотеку <code>@ns/name@vN<\/code> (кавычки\nобязательны), локальный путь к <code>.wasm<\/code> (относительно файла, в котором она\nобъявлена), HTTPS-URL (требует <code>sha256:<\/code>) или ссылка вида\n<code>git+&lt;repo&gt;@&lt;ref&gt;#&lt;path&gt;<\/code>.<\/li>\n<li><code>as:<\/code> — префикс токена. По умолчанию — собственное имя библиотеки.<\/li>\n<li><code>capabilities:<\/code> — явные разрешения для песочницы, см. ниже. <strong>Обязателен в\nкаждой записи<\/strong> — пустой список (<code>capabilities: []<\/code>) означает «без\nразрешений». Отсутствие ключа — ошибка валидации. Миграция со старых\nдокументов: добавьте <code>capabilities: []<\/code> в каждую запись без разрешений.<\/li>\n<li><code>with:<\/code> — JSON-конфигурация, передаваемая в <code>init()<\/code> библиотеки; может\nиспользовать <code>${{ env.X }}<\/code>, чтобы секреты оставались замаскированными в\nлогах.<\/li>\n<\/ul>\n<p>Удалённые источники (<code>https:<\/code>, <code>git+<\/code>) <strong>никогда не скачиваются во время\nвыполнения<\/strong>: <code>perfscale install<\/code> скачивает каждый из них один раз,\nпроверяет хеш, сохраняет в content-addressed кеш и записывает\n<code>perfscale.lock<\/code> рядом с объявляющим файлом — закоммитьте lock-файл. Затем\n<code>run<\/code> и <code>lint<\/code> разрешают всё полностью офлайн.<\/p>\n<p>Кратко о семантике токенов:<\/p>\n<ul>\n<li>Встроенные токены (<code>${seq}<\/code>, <code>${rand}<\/code>, …) сопоставляются первыми и не\nизменяются; alias не может их перекрыть.<\/li>\n<li>Неизвестный alias → токен остаётся как есть (обратная совместимость;\n<code>perfscale lint<\/code> помечает его). Известный alias + неизвестная функция →\n<strong>шаг завершается с ошибкой<\/strong> — опечатка не должна незаметно попасть в\npayload.<\/li>\n<li>Необязательный завершающий аргумент <code>key<\/code> любой функции <strong>мемоизирует<\/strong>\nрезультат в пределах одного сообщения: два <code>${random.uuid4(order)}<\/code> в\nодном сообщении дают один и тот же id; следующее сообщение генерирует\nновый.<\/li>\n<li><code>seed: 42<\/code> в конфигурации делает прогон воспроизводимым — каждый вызов\nбиблиотеки несёт seed сообщения, выведенный как <code>hash(seed, vu_id, conn_seq)<\/code>, поэтому два прогона с одним seed генерируют одни и те же\nзначения.<\/li>\n<\/ul>\n<h3>Жизненный цикл экземпляров<\/h3>\n<p>WASM-экземпляры дорого создавать (<code>Store::new<\/code> + настройка WASI +\n<code>init()<\/code>), поэтому движок держит <strong>один экземпляр библиотеки на VU<\/strong>,\nпереиспользуемый всеми сообщениями и соединениями этого VU, — а не один на\nшаг. <code>init()<\/code> поэтому выполняется один раз на VU, а состояние экземпляра\nсохраняется между сообщениями этого VU; изоляция сообщений (memo-ключи)\nсохраняется, потому что каждое сообщение несёт уникальный <code>message_seq<\/code>.\nПамять: свежий store ленив — измерено ~0.5 МиБ RSS на экзе
