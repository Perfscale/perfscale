мпляр для\nнебольшого компонента (500 VU ≈ 250 МБ суммарного RSS движка; предел 64 МиБ —\nограничение, а не аллокация), т.е. даже 1000 VU с WASM-библиотекой остаются в\nпределах сотен мегабайт — но компонент, жадно выделяющий линейную память,\nумножает эту цифру. Встроенный <code>@std/random@v1<\/code> <strong>не<\/strong> разделяется: его\nPRNG засеян на экземпляр (<code>hash(config.seed, vu_id, conn_seq)<\/code>), и\nпереиспользование изменило бы последовательность значений — он остаётся\nper-generator.<\/p>\n<ul>\n<li>Ошибка вызова (ошибка гостя, trap, таймаут) завершает шаг с ошибкой и\nзафиксированной причиной — нагрузочный тест никогда не отправит неверные\nданные, отчитавшись об успехе.<\/li>\n<\/ul>\n<h2>Встроенная библиотека <code>@std/random@v1<\/code><\/h2>\n<p>Поставляется с движком — без WASM, без установки, без capabilities. Каждая\nфункция принимает необязательный завершающий ключ мемоизации <code>key<\/code>:<\/p>\n<table><thead><tr><th>Функция<\/th><th>Возвращает<\/th><\/tr><\/thead><tbody>\n<tr><td><code>uuid4([key])<\/code> / <code>uuid7([key])<\/code><\/td><td>Случайный v4 / упорядоченный по времени v7 UUID<\/td><\/tr>\n<tr><td><code>ulid([key])<\/code><\/td><td>26-символьный ULID в Crockford-base32<\/td><\/tr>\n<tr><td><code>nanoid([len], [key])<\/code><\/td><td>URL-безопасный id (длина по умолчанию 21)<\/td><\/tr>\n<tr><td><code>int(a, b, [key])<\/code><\/td><td>Случайное целое в <code>[a, b]<\/code><\/td><\/tr>\n<tr><td><code>float(a, b, [dp], [key])<\/code><\/td><td>Случайное число с плавающей точкой, <code>dp<\/code> знаков после запятой<\/td><\/tr>\n<tr><td><code>pick(a|b|c, [key])<\/code><\/td><td>Случайный выбор среди вариантов, разделённых <code>|<\/code><\/td><\/tr>\n<tr><td><code>weighted(a:10|b:90, [key])<\/code><\/td><td>Взвешенный случайный выбор<\/td><\/tr>\n<tr><td><code>seq(name)<\/code><\/td><td>Именованный монотонный счётчик, начинается с 1<\/td><\/tr>\n<tr><td><code>pattern(\"ORD-####-????\")<\/code><\/td><td>Заполнение шаблона: <code>#<\/code>→цифра, <code>?<\/code>→a-z, <code>^<\/code>→A-Z, <code>*<\/code>→буква или цифра<\/td><\/tr>\n<tr><td><code>first_name()<\/code> / <code>last_name()<\/code> / <code>name()<\/code><\/td><td>Случайные имена<\/td><\/tr>\n<tr><td><code>username()<\/code> / <code>email()<\/code> / <code>company()<\/code><\/td><td>Случайный username / email / название компании<\/td><\/tr>\n<tr><td><code>lorem([words])<\/code><\/td><td>Слова lorem-ipsum (по умолчанию 5)<\/td><\/tr>\n<tr><td><code>phone()<\/code><\/td><td>Случайный номер телефона<\/td><\/tr>\n<tr><td><code>date(a, b)<\/code> / <code>timestamp(a, b)<\/code> / <code>datetime(a, b)<\/code><\/td><td>Случайные даты и метки времени в диапазоне<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Capabilities и песочница<\/h2>\n<p>Пользовательские библиотеки выполняются в песочнице wasmtime по\n<strong>fail-closed<\/strong> модели capability: WASI-импорты компонента сверяются с\nразрешениями <code>capabilities:<\/code> в YAML, а компонент, импортирующий больше, чем\nразрешено, — это жёсткая ошибка загрузки. Единственное исключение —\n<strong>самообъявленная чистая библиотека<\/strong>: когда <code>info()<\/code> компонента сообщает\n<code>\"pure\": true<\/code>, его импорты <code>wasi:filesystem<\/code> и <code>wasi:clocks/wall-clock<\/code>\nсчитаются шумом тулчейна (компоненты TS/JS, собранные jco, всегда их\nсодержат) и разрешение не требуется. Песочница при этом продолжает\nдействовать — без разрешения <code>fs<\/code> гость получает ноль preopen'ов, поэтому\nлюбой реальный доступ к файлам завершится ошибкой во время выполнения.<\/p>\n<table><thead><tr><th>Capability<\/th><th>Что предоставляет хост<\/th><th>Границы<\/th><\/tr><\/thead><tbody>\n<tr><td><code>fs<\/code><\/td><td>preopen'ы <code>wasi:filesystem<\/code><\/td><td>только пути внутри <code>fs_root<\/code>, только чтение<\/td><\/tr>\n<tr><td><code>clock<\/code><\/td><td><code>wasi:clocks<\/code><\/td><td>wall time также приходит через контекст вызова<\/td><\/tr>\n<tr><td><code>net: [hosts]<\/code><\/td><td><code>wasi:http<\/code> outgoing-handler<\/td><td>host/port назначения проверяется по allowlist'у на каждый запрос<\/td><\/tr>\n<\/tbody><\/table>\n<p><code>net<\/code> принимает allowlist хостов вместо простого флага:<\/p>\n<pre><code class=\"language-yaml\">capabilities:\n  - net: [\"api.acme.com\", \"api.acme.com:8443\", \"*.internal\"]\n<\/code><\/pre>\n<p>Формы записей (регистр не важен): <code>api.acme.com<\/code> разрешает этот хост на\n<strong>любом<\/strong> порту; <code>api.acme.com:8443<\/code> фиксирует порт; <code>*.internal<\/code> разрешает\nлюбой хост под суффиксом (<code>db.internal<\/code>, <code>a.b.internal<\/code> — но не голый\n<code>internal<\/code> и не <code>internal.evil.net<\/code>). Запрос к адресу вне allowlist'а\nзавершается ошибкой с именем адресата. Fuel не видит время, проведённое\nвнутри HTTP-вызова хоста, поэтому хост ограничивает его сам: <strong>30 с на\nзапрос<\/strong> (connect, первый байт, паузы между байтами и весь send целиком) и\nлимит <strong>16 МиБ<\/strong> на тело запроса и ответа. <strong>Сырые <code>wasi:sockets<\/code> никогда не\nпредоставляются<\/strong> — allowlist можно обеспечить, только пока соединением\nуправляет хост.<\/p>\n<p>Любое непустое разрешение требует <code>allow_library_capabilities: true<\/code> в\nконфигурации — тот же fail-closed паттерн, что и <code>allow_file_actions<\/code>. Сам\nключ <code>capabilities:<\/code> обязателен в каждой записи <code>libraries:<\/code> (включая\nвстроенные): пишите <code>capabilities: []<\/code>, когда библиотеке не нужны\nразрешения, — отсутствие ключа является ошибкой валидации при загрузке, lint\nи run. Сырые сокеты никогда не предоставляются. <code>wasi:random<\/code> тоже не\nпредоставляется: библиотеки получают всю случайность из PRNG с seed'ом,\nкоторый предоставляет их SDK, — именно это делает прогоны с <code>seed:<\/code>\nвоспроизводимыми. Fuel на каждый вызов и таймаут по wall time ограничивают\nто, что сбежавший компонент может натворить на горячем пути, а время внутри\nвызова библиотеки учитывается в длительности охватывающего шага — стоимость\nбиблиотеки видна в метриках и никогда не скрыта.<\/p>\n<p>Запись библиотеки также может ограничивать и маскировать свою поверхность:<\/p>\n<pre><code class=\"language-yaml\">libraries:\n  - use: ./libs/fixer-ids.wasm\n    capabilities: []       # no sandbox grants\n    allow: [uuid4, ulid]   # only these functions callable\n    log:\n      secret: true         # mask every result of this library in the run log\n<\/code><\/pre>\n<h2>Написание собственной библиотеки<\/h2>\n<p>Одна форма, три языка — каждый SDK скрывает WIT-инфраструктуру\n(<code>perfscale:library@0.2.0<\/code>, WASI Preview 2) и предоставляет PRNG с seed'ом\n(бит-идентичный во всех SDK и во встроенном генераторе движка), <code>memo()<\/code>\nдля повторного использования в пределах сообщения, вспомогательные функции\nдля аргументов и тестовое окружение без рантайма.<\/p>\n<h3>TypeScript / JavaScript — <code>@perfscale/library-sdk<\/code><\/h3>\n<p>SDK и инструменты сборки находятся в репозитории\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries\">sdk-libraries<\/a>; установка из\nnpm:<\/p>\n<pre><code class=\"language-console\">$ npm install @perfscale/library-sdk\n<\/code><\/pre>\n<pre><code class=\"language-ts\">import { args, defineLibrary } from \"@perfscale/library-sdk\";\n\nexport default defineLibrary({\n  name: \"mylib\",\n  functions: {\n    token: {\n      description: \"Deterministic per-instance token; memo key reuses it within one message\",\n      call(argv, ctx) {\n        const mint = () =&gt; `tok-${ctx.rng().nextU64().toString(16)}`;\n        const key = args.optionalString(argv, 0);\n        return key === undefined ? mint() : ctx.memo(key, mint);\n      },\n    },\n  },\n});\n<\/code><\/pre>\n<p>Сборка в WASM-компонент (ComponentizeJS из jco встраивает JS-движок):<\/p>\n<pre><code class=\"language-console\">$ npx perfscale-library-build mylib.ts -o mylib.wasm\n<\/code><\/pre>\n<p>Затем укажите <code>.wasm<\/code> в <code>libraries:<\/code> и вызывайте <code>${mylib.token()}<\/code> в\npayload'ах. <code>Ctx<\/code> из SDK содержит <code>messageSeq<\/code>, <code>iterationSeq<\/code>, <code>vuId<\/code>,\n<code>seed<\/code>, <code>timeMs<\/code>, а также <code>ctx.memo()<\/code> и <code>ctx.rng()<\/code>; <code>testCall<\/code> запускает\nюнит-тесты под <code>node:test<\/code> без участия WASM.<\/p>\n<p>Замечание о песочнице: компоненты jco всегда импортируют <code>wasi:filesystem<\/code> и\n<code>wasi:clocks/wall-clock<\/code>. TS-библиотеке, объявляющей <code>\"pure\": true<\/code> в\nметаданных <code>info()<\/code>, не нужно разрешение <code>capabilities:<\/code> для этих импортов —\nдвижок связывает интерфейсы, но не предоставляет preopen'ов, поэтому\nреальный доступ к файлам всё равно завершится ошибкой. Библиотеки, которые\nдействительно читают файлы, по-прежнему объявляют <code>capabilities: [fs]<\/code> (одно\nразрешение <code>fs<\/code> покрывает оба интерфейса).<\/p>\n<h3>Rust — <code>perfscale-library-sdk<\/code><\/h3>\n<p>Полный SDK в основном репозитории:\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/tree/main/crates/perfscale-library-sdk\"><code>crates/perfscale-library-sdk<\/code><\/a>,\nсобирается в <code>wasm32-wasip2<\/code> без дополнительного тулчейна. Репозиторий\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/library-random\">library-random<\/a> — WASM-порт\n<code>@std/random<\/code> — одновременно служит эталонной реализацией и шаблоном для\nавторов.<\/p>\n<h3>Go — документированный рецепт (экспериментальный)<\/h3>\n<p>Пошаговое руководство по TinyGo + <code>wasm32-wasip2<\/code> + <code>wit-bindgen-go<\/code> в\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/sdk-libraries/blob/main/go/README.md\"><code>go/README.md<\/code><\/a>\nрепозитория sdk-libraries. Готового SDK-пакета пока нет — WIT-контракт тот\nже, поэтому сгенерированные биндинги работают с любым релизом perfscale,\nподдерживающим <code>perfscale:library@0.2.0<\/code>.<\/p>\n<h3>Начало с шаблона<\/h3>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/library-template\">library-template<\/a> —\nминимальная готовая к сборке библиотека (greet + мемоизированный токен) с\nподключённым SDK — склонируйте, переименуйте и добавляйте функции.<\/p>\n<h2>Доступность и линтинг<\/h2>\n<p>Библиотеки — часть YAML теста/конфигурации, поэтому одно и то же определение\nработает и из CLI, и на ваших машинах. Встроенной <code>@std/random<\/code> вообще не\nнужны файлы; пользовательские WASM-компоненты должны присутствовать на\nгенераторе нагрузки (относительные пути разрешаются относительно объявляющего\nфайла, удалённые ссылки берутся из кеша install). <code>perfscale lint<\/code> загружает\nобъявленные библиотеки и проверяет каждый токен <code>${alias.fn(...)}<\/code> на\nсоответствие функциям, которые они реально экспортируют, — опечатки\nотлавливаются до прогона.<\/p>\n","slug":"core/libraries","title":"Libraries — custom value generators (WASM)"},{"group":"core","html_en":"<h1>LLM load testing<\/h1>\n<p>perfscale drives <strong>LLM inference endpoints<\/strong> under load with the native step\nengine: send chat-completion requests, stream the responses, and measure\ntime-to-first-token (TTFT), generation throughput (tokens/sec), and token\nusage — alongside your HTTP/gRPC/WebSocket metrics.<\/p>\n<p>One step = one completion request. Streaming is the default: the response is\nread as server-sent events, text deltas are concatenated, and TTFT is the\narrival time of the first chunk that carries content.<\/p>\n<p>This page is the guide. Per-step parameters and outputs live in the\n<a href=\"#/docs/core/actions\">actions reference<\/a>.<\/p>\n<h2>Endpoints<\/h2>\n<table><thead><tr><th>Endpoint<\/th><th>Wire format<\/th><\/tr><\/thead><tbody>\n<tr><td><code>openai<\/code> (default)<\/td><td>OpenAI chat completions (<code>POST /v1/chat/completions<\/code>) — also every OpenAI-compatible server: <strong>Ollama<\/strong>, <strong>vLLM<\/strong>, LM Studio, Together, Groq, … The step sends <code>stream_options: { include_usage: true }<\/code> when streaming, so token counts arrive with the final chunk<\/td><\/tr>\n<tr><td><code>anthropic<\/code><\/td><td>Anthropic messages API (<code>POST /v1/messages<\/code>). Sends <code>anthropic-version: 2023-06-01<\/code>; usage comes from the <code>message_start<\/code> / <code>message_delta<\/code> SSE events<\/td><\/tr>\n<tr><td><code>generic<\/code><\/td><td>Bring-your-own format: the request body is the step's <code>params<\/code> object verbatim, and the response fields are pulled out with <code>extract<\/code> rules (dotted paths or regexes) — for endpoints that match neither API<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Local model: Ollama (OpenAI-compatible)<\/h2>\n<p>The fastest way to build the test logic — no API key, no cloud bill. Ollama\nserves an OpenAI-compatible endpoint on port 11434:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: llama completion\n    use: std/llm@v1\n    with:\n      url: http://127.0.0.1:11434/v1/chat/completions\n      model: llama3.1\n      prompt: \"Summarize the CAP theorem in two sentences.\"\n      max_tokens: 128\n    check:\n      status: 200\n<\/code><\/pre>\n<p><code>prompt<\/code> is sugar for a single <code>user<\/code> message; use <code>messages<\/code> for a real\nconversation (a <code>system<\/code> prompt, few-shot examples, …). Prompts interpolate\nlike any other step — <code>${{ vars.* }}<\/code>, outputs of previous steps, <code>${uuid}<\/code> —\nso every iteration can send a fresh prompt.<\/p>\n<h2>OpenAI with a key from the environment<\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: gpt completion\n    use: std/llm@v1\n    with:\n      url: https://api.openai.com/v1/chat/completions\n      model: gpt-4o-mini\n      api_key: ${{ env.OPENAI_API_KEY }}\n      messages:\n        - { role: system, content: \"Answer in one word.\" }\n        - { role: user, content: \"Capital of France?\" }\n      params:\n        temperature: 0\n      timeout_ms: 30000\n    check:\n      status: 200\n<\/code><\/pre>\n<p><code>api_key<\/code> goes out as <code>Authorization: Bearer …<\/code>. Extra body fields the API\nunderstands (<code>temperature<\/code>, <code>top_p<\/code>, <code>presence_penalty<\/code>, …) ride in <code>params<\/code>,\nmerged into the request verbatim. <code>${{ env.* }}<\/code> reads the process\nenvironment at run time — if the variable is unset the step fails with\n<code>env var 'OPENAI_API_KEY' is not set<\/code> instead of sending an empty key (see\n<a href=\"#/docs/yaml-reference\">Variables<\/a>).<\/p>\n<h2>Anthropic streaming<\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: claude completion\n    use: std/llm@v1\n    with:\n      endpoint: anthropic\n      url: https://api.anthropic.com/v1/messages\n      model: claude-sonnet-4-5\n      api_key: ${{ env.ANTHROPIC_API_KEY }}\n      prompt: \"Explain backpressure in one paragraph.\"\n      max_tokens: 512\n<\/code><\/pre>\n<p>The key is sent as <code>x-api-key<\/code> (with <code>anthropic-version: 2023-06-01<\/code>).\nStreaming is on by default — set <code>stream: false<\/code> for a single JSON response\n(no TTFT is measured then; tokens/sec falls back to the whole request time).<\/p>\n<h2>Generic endpoint with extract<\/h2>\n<p>For a server that matches neither API — here a text-generation-inference\nstyle <code>/generate<\/code> that returns one JSON document:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: tgi generate\n    use: std/llm@v1\n    with:\n      endpoint: generic\n      url: http://127.0.0.1:8080/generate\n      params:                        # this object IS the request body\n        inputs: \"Tell me a joke.\"\n        parameters: { max_new_tokens: 64 }\n      extract:\n        text: \"$.generated_text\"                 # dotted path…\n        completion_tokens: '\"generated_tokens\": (\\d+)'   # …or a one-group regex\n    outputs: gen\n<\/code><\/pre>\n<p>Each <code>extract<\/code> value is either a dotted path (<code>$.usage.completion_tokens<\/code>,\n<code>$.choices[0].text<\/code> — nested keys and <code>[N]<\/code> array indices) applied to the\nresponse JSON, or a regex with exactly one capture group applied to the raw\nresponse text. With <code>stream: true<\/code> the SSE <code>data:<\/code> payloads are glued back\ntogether and <code>extract<\/code> applies to the last JSON payload / the joined text.<\/p>\n<h2>Metrics and thresholds<\/h2>\n<p>Every request folds into the run summary as custom metrics:<\/p>\n<ul>\n<li><code>llm_ttft_ms<\/code> — HDR histogram in ms (percentiles in the summary); request\nstart → first content chunk (time to first token). Streamed requests\nonly.<\/li>\n<li><code>llm_tokens_per_sec<\/code> — HDR histogram; completion tokens / generation time\n(after the first token when streamed, over the whole request otherwise).\nOnly when the server reports completion tokens.<\/li>\n<li><code>llm_prompt_tokens<\/code>, <code>llm_completion_tokens<\/code> — counters as reported by\nthe server; absent when the server does not report usage.<\/li>\n<li><code>llm_chunks<\/code> — counter of SSE chunks received (0 for non-streamed\nrequests).<\/li>\n<li><code>llm_ttft_ms_failed<\/code> / <code>llm_tokens_per_sec_failed<\/code> — derived failure\nrates: one 0/1 sample per invocation that produced the corresponding\nsample (1 = the step failed — non-2xx, timeout, transport error). See\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<\/ul>\n<p>Gate a run on them with <code>std/thresholds@v1<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  - use: std/thresholds@v1\n    with:\n      llm_ttft_ms:\n        - \"p(95)&lt;500\"            # 95% of requests start streaming within 500 ms\n      llm_tokens_per_sec:\n        - \"avg&gt;20\"               # fleet-average generation speed\n      llm_ttft_ms_failed:\n        - \"rate&lt;0.01\"            # fewer than 1% failed requests\n<\/code><\/pre>\n<p>Step-level assertions work too — the output exposes <code>ttft_ms<\/code>,\n<code>duration_ms<\/code>, <code>tokens_per_sec<\/code>, <code>prompt_tokens<\/code>, <code>completion_tokens<\/code>,\n<code>text<\/code>, and more, so <code>check: { duration_ms_lt: 2000 }<\/code> or a <code>std/check@v1<\/code>\nstep over <code>outputs<\/code> covers per-iteration SLOs.<\/p>\n<h2>Connection posture<\/h2>\n<p>Requests reuse the VU's pinned HTTP client shard (the same pooling as\n<code>std/http@v1<\/code>), so a VU hammers one endpoint over a warm keep-alive\nconnection. <code>timeout_ms<\/code> (default 120 s) bounds the <em>whole<\/em> request —\nconnect through the last stream chunk — so a stalled generation fails the\nstep instead of hanging the VU. A non-2xx status fails the step with the\nstatus and the first ~500 characters of the error body.<\/p>\n<h2>Limits<\/h2>\n<ul>\n<li><code>text<\/code> in the step output is truncated to ~4 KiB; assert on substrings via\n<code>std/check@v1<\/code>, not on the whole completion.<\/li>\n<li>Token counts come from the server's <code>usage<\/code> report — a server that does\nnot report usage yields no <code>llm_*_tokens<\/code> / <code>llm_tokens_per_sec<\/code> metrics.<\/li>\n<li>TTFT needs streaming; non-streamed requests only report total latency.<\/li>\n<li>Detailed per-token timing (ITL/TPOT percentiles) and cost accounting are a\npro capability on the <code>register_llm_observer<\/code> seam; the OSS build reports\nthe metrics above.<\/li>\n<\/ul>\n<p>Against a <strong>local<\/strong> model server the GPU is the system under test — turn on\n<a href=\"#/docs/core/gpu\">GPU metrics<\/a> (<code>gpu.enabled: true<\/code> in the config) to chart\nutilization/VRAM/temperature alongside TTFT and tokens/sec. On Apple Silicon\nMacs use <code>gpu.source: powermetrics<\/code> for the integrated GPU (true active\nresidency) plus ANE/CPU rail power (<code>ane_power_w<\/code>, <code>cpu_power_w<\/code>).<\/p>\n","html_ru":"<h1>Нагрузочное тестирование LLM<\/h1>\n<p>perfscale нагружает <strong>эндпоинты LLM-инференса<\/strong> с помощью нативного движка\nшагов: отправляет запросы chat-completion, читает потоковые ответы и измеряет\nвремя до первого токена (TTFT), скорость генерации (токены/с) и расход\nтокенов — вместе с вашими метриками HTTP/gRPC/WebSocket.<\/p>\n<p>Один шаг = один запрос на completion. Стриминг включён по умолчанию: ответ\nчитается как server-sent events, текстовые дельты склеиваются, а TTFT — это\nмомент прихода первого чанка, содержащего контент.<\/p>\n<p>Эта страница — руководство. Параметры и выходные данные шага описаны в\n<a href=\"#/docs/core/actions\">справочнике actions<\/a>.<\/p>\n<h2>Эндпоинты<\/h2>\n<table><thead><tr><th>Эндпоинт<\/th><th>Формат на проводе<\/th><\/tr><\/thead><tbody>\n<tr><td><code>openai<\/code> (по умолчанию)<\/td><td>OpenAI chat completions (<code>POST /v1/chat/completions<\/code>) — а также любой OpenAI-совместимый сервер: <strong>Ollama<\/strong>, <strong>vLLM<\/strong>, LM Studio, Together, Groq, … При стриминге шаг отправляет <code>stream_options: { include_usage: true }<\/code>, поэтому счётчики токенов приходят с финальным чанком<\/td><\/tr>\n<tr><td><code>anthropic<\/code><\/td><td>Anthropic messages API (<code>POST /v1/messages<\/code>). Отправляет <code>anthropic-version: 2023-06-01<\/code>; usage берётся из SSE-событий <code>message_start<\/code> / <code>message_delta<\/code><\/td><\/tr>\n<tr><td><code>generic<\/code><\/td><td>Свой собственный формат: тело запроса — это объект <code>params<\/code> шага как есть, а поля ответа извлекаются правилами <code>extract<\/code> (пути через точку или регулярные выражения) — для эндпоинтов, не соответствующих ни одному из API<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Локальная модель: Ollama (OpenAI-совместимая)<\/h2>\n<p>Самый быстрый способ собрать логику теста — без API-ключа и счетов за облако.\nOllama обслуживает OpenAI-совместимый эндпоинт на порту 11434:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: llama completion\n    use: std/llm@v1\n    with:\n      url: http://127.0.0.1:11434/v1/chat/completions\n      model: llama3.1\n      prompt: \"Summarize the CAP theorem in two sentences.\"\n      max_tokens: 128\n    check:\n      status: 200\n<\/code><\/pre>\n<p><code>prompt<\/code> — это сокращение для одиночного сообщения <code>user<\/code>; для настоящего\nдиалога (<code>system<\/code>-промпт, few-shot примеры, …) используйте <code>messages<\/code>.\nПромпты интерполируются, как и любой другой шаг — <code>${{ vars.* }}<\/code>, выходные\nданные предыдущих шагов, <code>${uuid}<\/code> — так что каждая итерация может отправлять\nсвежий промпт.<\/p>\n<h2>OpenAI с ключом из окружения<\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: gpt completion\n    use: std/llm@v1\n    with:\n      url: https://api.openai.com/v1/chat/completions\n      model: gpt-4o-mini\n      api_key: ${{ env.OPENAI_API_KEY }}\n      messages:\n        - { role: system, content: \"Answer in one word.\" }\n        - { role: user, content: \"Capital of France?\" }\n      params:\n        temperature: 0\n      timeout_ms: 30000\n    check:\n      status: 200\n<\/code><\/pre>\n<p><code>api_key<\/code> уходит в заголовке <code>Authorization: Bearer …<\/code>. Дополнительные поля\nтела, которые понимает API (<code>temperature<\/code>, <code>top_p<\/code>, <code>presence_penalty<\/code>, …),\nпередаются в <code>params<\/code> и вставляются в запрос как есть. <code>${{ env.* }}<\/code> читает\nокружение процесса во время выполнения — если переменная не задана, шаг падает\nс ошибкой <code>env var 'OPENAI_API_KEY' is not set<\/code> вместо отправки пустого ключа\n(см. <a href=\"#/docs/yaml-reference\">Переменные<\/a>).<\/p>\n<h2>Стриминг Anthropic<\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: claude completion\n    use: std/llm@v1\n    with:\n      endpoint: anthropic\n      url: https://api.anthropic.com/v1/messages\n      model: claude-sonnet-4-5\n      api_key: ${{ env.ANTHROPIC_API_KEY }}\n      prompt: \"Explain backpressure in one paragraph.\"\n      max_tokens: 512\n<\/code><\/pre>\n<p>Ключ отправляется в заголовке <code>x-api-key<\/code> (вместе с\n<code>anthropic-version: 2023-06-01<\/code>). Стриминг включён по умолчанию — задайте\n<code>stream: false<\/code> для единственного JSON-ответа (тогда TTFT не измеряется, а\nтокены/с считаются по полному времени запроса).<\/p>\n<h2>Generic-эндпоинт с extract<\/h2>\n<p>Для сервера, не соответствующего ни одному из API, — например, эндпоинт\n<code>/generate<\/code> в стиле text-generation-inference, возвращающий один JSON-документ:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: tgi generate\n    use: std/llm@v1\n    with:\n      endpoint: generic\n      url: http://127.0.0.1:8080/generate\n      params:                        # этот объект и ЕСТЬ тело запроса\n        inputs: \"Tell me a joke.\"\n        parameters: { max_new_tokens: 64 }\n      extract:\n        text: \"$.generated_text\"                 # путь через точку…\n        completion_tokens: '\"generated_tokens\": (\\d+)'   # …или regex с одной группой\n    outputs: gen\n<\/code><\/pre>\n<p>Каждое значение <code>extract<\/code> — это либо путь через точку\n(<code>$.usage.completion_tokens<\/code>, <code>$.choices[0].text<\/code> — вложенные ключи и индексы\nмассивов <code>[N]<\/code>), применяемый к JSON ответа, либо регулярное выражение ровно с\nодной группой захвата, применяемое к сырому тексту ответа. При <code>stream: true<\/code>\nполезные данные SSE <code>data:<\/code> склеиваются обратно, и <code>extract<\/code> применяется к\nпоследнему JSON-пayload / склеенному тексту.<\/p>\n<h2>Метрики и пороги<\/h2>\n<p>Каждый запрос складывается в сводку прогона как пользовательские метрики:<\/p>\n<ul>\n<li><code>llm_ttft_ms<\/code> — HDR-гистограмма в мс (процентили в сводке); от начала\nзапроса до первого чанка с контентом (время до первого токена). Только\nпотоковые запросы.<\/li>\n<li><code>llm_tokens_per_sec<\/code> — HDR-гистограмма; completion-токены / время\nгенерации (после первого токена при стриминге, за весь запрос в остальных\nслучаях). Только когда сервер сообщает число токенов завершения.<\/li>\n<li><code>llm_prompt_tokens<\/code>, <code>llm_completion_tokens<\/code> — счётчики, как их сообщает\nсервер; отсутствуют, когда сервер не сообщает usage.<\/li>\n<li><code>llm_chunks<\/code> — счётчик полученных SSE-чанков (0 для непотоковых\nзапросов).<\/li>\n<li><code>llm_ttft_ms_failed<\/code> / <code>llm_tokens_per_sec_failed<\/code> — производные доли\nошибок: один сэмпл 0/1 на вызов, породивший соответствующий сэмпл\n(1 = шаг упал — не-2xx, таймаут, транспортная ошибка). См.\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<\/ul>\n<p>Ограничьте прогон по ним с помощью <code>std/thresholds@v1<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  - use: std/thresholds@v1\n    with:\n      llm_ttft_ms:\n        - \"p(95)&lt;500\"            # 95% запросов начинают стримить в течение 500 мс\n      llm_tokens_per_sec:\n        - \"avg&gt;20\"               # средняя по флоту скорость генерации\n      llm_ttft_ms_failed:\n        - \"rate&lt;0.01\"            # менее 1% неуспешных запросов\n<\/code><\/pre>\n<p>Работают и проверки на уровне шага — выходные данные содержат <code>ttft_ms<\/code>,\n<code>duration_ms<\/code>, <code>tokens_per_sec<\/code>, <code>prompt_tokens<\/code>, <code>completion_tokens<\/code>, <code>text<\/code>\nи другое, так что <code>check: { duration_ms_lt: 2000 }<\/code> или шаг <code>std/check@v1<\/code>\nпо <code>outputs<\/code> покрывают SLO на каждую итерацию.<\/p>\n<h2>Работа с соединениями<\/h2>\n<p>Запросы переиспользуют закреплённый за VU шард HTTP-клиента (тот же пулинг,\nчто и у <code>std/http@v1<\/code>), поэтому VU бьёт в один эндпоинт по тёплому\nkeep-alive соединению. <code>timeout_ms<\/code> (по умолчанию 120 с) ограничивает <em>весь<\/em>\nзапрос — от соединения до последнего чанка стрима — так что зависшая\nгенерация роняет шаг, а не вешает VU. Статус, отличный от 2xx, роняет шаг с\nуказанием статуса и первых ~500 символов тела ошибки.<\/p>\n<h2>Ограничения<\/h2>\n<ul>\n<li><code>text<\/code> в выходных данных шага обрезается до ~4 КиБ; проверяйте подстроки\nчерез <code>std/check@v1<\/code>, а не весь completion целиком.<\/li>\n<li>Счётчики токенов берутся из отчёта <code>usage<\/code> сервера — сервер, который не\nсообщает usage, не даёт метрик <code>llm_*_tokens<\/code> / <code>llm_tokens_per_sec<\/code>.<\/li>\n<li>TTFT требует стриминга; непотоковые запросы сообщают только общую задержку.<\/li>\n<li>Детальные пометоковые тайминги (перцентили ITL/TPOT) и учёт стоимости —\nэто pro-capability на точке расширения <code>register_llm_observer<\/code>; OSS-сборка\nсообщает метрики, перечисленные выше.<\/li>\n<\/ul>\n<p>При тестировании <strong>локального<\/strong> сервера модели GPU — это тестируемая система,\nпоэтому включите <a href=\"#/docs/core/gpu\">GPU-метрики<\/a> (<code>gpu.enabled: true<\/code> в конфиге), чтобы\nстроить графики утилизации/VRAM/температуры рядом с TTFT и токенами/с. На\nMac с Apple Silicon используйте <code>gpu.source: powermetrics<\/code> для встроенного\nGPU (истинная активная резидентность) плюс мощность линий ANE/CPU\n(<code>ane_power_w<\/code>, <code>cpu_power_w<\/code>).<\/p>\n","slug":"core/llm","title":"LLM load testing"},{"group":"core","html_en":"<h1>Metrics<\/h1>\n<p>The native engine records every request-like step into a fixed-size HDR\nhistogram and folds custom counters/histograms from action outputs into the\nsame run aggregates. Two outputs: a machine-readable <code>[stats]<\/code> line every 5\nseconds during the run, and a k6-compatible summary at the end.<\/p>\n<h2>Request metrics (<code>http_req_*<\/code>)<\/h2>\n<p>Actions that perform a timed request return an <code>HttpSample<\/code>\n(<code>duration_ms<\/code>, <code>status<\/code>, <code>failed<\/code>). Durations are recorded in\n<strong>microseconds<\/strong> — sub-millisecond loopback calls stay distinguishable.<\/p>\n<table><thead><tr><th>Action<\/th><th>What feeds <code>http_req_duration<\/code><\/th><th>What counts as failed<\/th><\/tr><\/thead><tbody>\n<tr><td><code>std/http@v1<\/code><\/td><td>Every request<\/td><td>Status ≥ 400, transport error, timeout (logged as <code>→ TIMEOUT after …ms<\/code>; <code>status<\/code> reported as 0)<\/td><\/tr>\n<tr><td><code>std/tcp@v1<\/code><\/td><td>Connect + send/read exchange<\/td><td>Connect failure, timeout, <code>expect<\/code> mismatch<\/td><\/tr>\n<tr><td><code>std/udp@v1<\/code><\/td><td>Send (+ optional reply wait)<\/td><td>Timeout, <code>expect<\/code> mismatch<\/td><\/tr>\n<tr><td><code>std/ws@v1<\/code><\/td><td>The whole one-shot session (one sample)<\/td><td>Handshake/transport error, an <code>until_*<\/code> rule not met in time<\/td><\/tr>\n<tr><td><code>std/ws-connect@v1<\/code><\/td><td>The handshake only<\/td><td>Handshake failure (<code>connected: false<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Deliberately <strong>not<\/strong> feeding <code>http_req_duration<\/code> — a step whose duration\nsays nothing about target latency would poison the shared percentiles:<\/p>\n<table><thead><tr><th>Action<\/th><th>Why<\/th><\/tr><\/thead><tbody>\n<tr><td><code>std/ws-recv@v1<\/code><\/td><td>How long a server waits before pushing is not target latency<\/td><\/tr>\n<tr><td><code>std/ws-ping@v1<\/code><\/td><td>Transport RTT; bound it with <code>check: { duration_ms_lt: … }<\/code> instead<\/td><\/tr>\n<tr><td><code>std/ws-send@v1<\/code>, <code>std/ws-close@v1<\/code><\/td><td>No meaningful request latency<\/td><\/tr>\n<tr><td><code>std/grpc*@v1<\/code> (whole family)<\/td><td>gRPC has its own histograms (<code>grpc_req_duration<\/code>, <code>grpc_msg_rtt<\/code>); stream lifetimes span user steps, so streams don't feed even those<\/td><\/tr>\n<tr><td><code>std/db-*@v1<\/code> (whole family)<\/td><td>DB steps have their own histograms (<code>db_connect_duration<\/code>, <code>db_query_duration<\/code>) and counters (<code>db_rows<\/code>, <code>db_errors<\/code>)<\/td><\/tr>\n<tr><td><code>std/child_process@v1<\/code>, <code>std/kill_process@v1<\/code><\/td><td>Process lifecycle, not requests<\/td><\/tr>\n<tr><td><code>std/check@v1<\/code>, <code>std/sleep@v1<\/code>, <code>std/log@v1<\/code>, <code>std/file-*@v1<\/code><\/td><td>No network I/O<\/td><\/tr>\n<\/tbody><\/table>\n<p>Note the asymmetry: gRPC assertion failures go to <code>grpc_req_failed<\/code> (a custom\ncounter, driven by <code>expect_status<\/code>), <strong>not<\/strong> to <code>http_req_failed<\/code>.<\/p>\n<h2>Arrival-profile latency and coordinated omission (<code>engine_arrival_*<\/code>)<\/h2>\n<p>Request metrics measure <strong>server time<\/strong>: the clock starts when the request\ngoes out (<code>http_req_duration<\/code> is deliberately pure response latency). In the\narrival-rate profile (open model) the engine additionally knows when each\niteration was <em>supposed<\/em> to start, so it records the hidden half of the\nstory:<\/p>\n<table><thead><tr><th>Metric<\/th><th>Kind<\/th><th>What it measures<\/th><\/tr><\/thead><tbody>\n<tr><td><code>engine_arrival_queue_wait_ms<\/code><\/td><td>histogram<\/td><td>Scheduled→actual iteration start delay — the queueing classic latency metrics omit (coordinated omission)<\/td><\/tr>\n<tr><td><code>engine_arrival_iteration_ms<\/code><\/td><td>histogram<\/td><td>Queue wait + iteration body, measured from the <em>scheduled<\/em> start — the CO-corrected end-to-end latency of an arrival iteration<\/td><\/tr>\n<tr><td><code>dropped_iterations<\/code><\/td><td>counter<\/td><td>Permits no worker could serve (pool saturated at <code>arrival.max_vus<\/code>) — always emitted, even at 0, so <code>count==0<\/code> gates resolve on clean runs<\/td><\/tr>\n<\/tbody><\/table>\n<p>Under saturation <code>http_req_duration<\/code> keeps looking healthy — only requests\nthat actually started are measured — while <code>engine_arrival_queue_wait_ms<\/code>\ngrows and <code>dropped_iterations<\/code> climbs. Judge an overloaded arrival run by\nall three together: percentiles alone under-report what users experienced.<\/p>\n<p>These are engine metrics: always recorded on arrival-rate runs (two\nhistogram writes per iteration), registered in the built-in <code>engine<\/code> family,\nvisible to <code>std/thresholds@v1<\/code> like any other metric.<\/p>\n<p>Related engine counter, recorded on every run profile:\n<code>engine_log_lines_dropped<\/code> — per-step log lines dropped because the bounded\nrun-log channel (512 lines) was full. Per-request output is lossy by design\n(a slow stdout consumer must not stretch VU iterations); the summary and\nengine errors always get through, and a dropped total &gt; 0 prints one warning\nat the end of the run.<\/p>\n<h2>Final summary<\/h2>\n<p>Printed at the end of every run, k6-compatible so downstream parsers\n(dashboards, <code>perfscale serve<\/code>) treat all engines uniformly:<\/p>\n<pre><code class=\"language-text\">vus....................: 10 min=1 max=10\niterations..............: 4521 150.23/s\nhttp_req_duration......: avg=0.42ms p(50)=0.31ms p(90)=0.88ms p(95)=1.02ms p(99)=1.90ms min=0.09ms max=3.10ms\nhttp_req_failed........: 0.00%\nhttp_reqs..............: 4521 150.23/s\n<\/code><\/pre>\n<ul>\n<li><code>vus<\/code> / <code>iterations<\/code> (+ per-second rate) are always emitted, even for\nsleep-only runs.<\/li>\n<li><code>dropped_iterations<\/code> is always emitted for arrival-rate runs — 0 when the\npool kept up — so threshold gates (<code>dropped_iterations: [\"count==0\"]<\/code>)\nresolve instead of erroring on an unknown metric.<\/li>\n<li>The <code>http_req_*<\/code> block appears only when at least one sample was recorded.<\/li>\n<li>Percentiles come from a fixed-size HDR histogram (1 µs – 1 h range, two\nsignificant figures → ≤1% quantile error) — memory stays flat no matter how\nlong the soak, at the cost of an error invisible at the printed precision.<\/li>\n<\/ul>\n<h2>Live <code>[stats]<\/code> lines<\/h2>\n<p>Every 5 seconds while VUs run, one machine-readable line:<\/p>\n<pre><code class=\"language-text\">[stats] ts=1720000000000 rps=246.80 err_pct=0.00 p50=1.20 p90=3.40 p95=4.10 p99=8.20 reqs=1234 iters=456\n<\/code><\/pre>\n<ul>\n<li><code>ts<\/code> — unix epoch milliseconds; <code>rps<\/code> — requests in the just-finished 5 s\nwindow; <code>err_pct<\/code> — cumulative failure percentage; <code>p50<\/code>…<code>p99<\/code> — cumulative\npercentiles in ms (the histogram is never reset, so they converge instead\nof jittering); <code>reqs<\/code> — cumulative requests; <code>iters<\/code> — cumulative\niterations.<\/li>\n<li>With no requests yet the percentiles are omitted:\n<code>[stats] ts=… rps=0.00 reqs=0 iters=3<\/code>.<\/li>\n<li><code>std/llm@v1<\/code> reports through its own metric family and never feeds\n<code>reqs<\/code>/<code>rps<\/code>, so a pure-LLM run shows <code>reqs=0<\/code> while requests are flowing.\nOnce any LLM request completes, the line carries <code>llm_reqs<\/code> (completed LLM\nrequests) and <code>llm_tok_s<\/code> (mean completion tok/s):\n<code>[stats] ts=… rps=0.00 reqs=0 iters=12 llm_reqs=9 llm_tok_s=38.7<\/code>.<\/li>\n<li>These lines exist for streaming consumers (the controlplane parses them\nout of the log stream); see <a href=\"#quiet\"><code>--quiet<\/code><\/a> for console behavior.<\/li>\n<\/ul>\n<h2>Custom metrics (<code>value.metrics<\/code>)<\/h2>\n<p>Any action can attach a reserved <code>metrics<\/code> object to its step output; the\nrunner folds it into the run aggregates:<\/p>\n<ul>\n<li>A <strong>number<\/strong> becomes a counter, summed across VUs and iterations, reported\nas <code>&lt;name&gt;: &lt;total&gt; &lt;rate&gt;/s<\/code>.<\/li>\n<li>An <strong>array of numbers<\/strong> becomes HDR histogram samples (milliseconds),\nreported as\n<code>&lt;name&gt;: avg=…ms p(50)=… p(90)=… p(95)=… p(99)=… min=… max=… count=N<\/code>.<\/li>\n<\/ul>\n<p>Built-in emitters, per metric (details on each family's page):<\/p>\n<p>WebSocket — <a href=\"#/docs/core/websocket\">websocket.md<\/a>:<\/p>\n<ul>\n<li><code>ws_msgs_sent<\/code> — counter; WS messages sent. Emitted by <code>std/ws@v1<\/code>\n(whole-session total) and <code>std/ws-send@v1<\/code> (per step), on success and on\nfailure.<\/li>\n<li><code>ws_msgs_received<\/code> — counter; WS messages read. Emitted by <code>std/ws@v1<\/code>\nand <code>std/ws-recv@v1<\/code>.<\/li>\n<li><code>ws_msg_rtt<\/code> — HDR histogram (ms); send → first reply matching your\n<code>until_*<\/code> rule (application-level RTT). One sample per matched reply;\nemitted only when a rule matched after a send on the same connection —\npure push waits record nothing (deliberately, see\n<a href=\"#/docs/core/websocket\">websocket.md<\/a>).<\/li>\n<\/ul>\n<p>Pub/Sub — <a href=\"#/docs/core/pubsub\">pubsub.md<\/a>:<\/p>\n<ul>\n<li><code>pubsub_msgs_published<\/code> — counter; messages accepted by the transport.\nEmitted by every completed <code>std/pubsub@v1<\/code> exchange (also 0 for\nsubscribe-only steps).<\/li>\n<li><code>pubsub_msgs_received<\/code> — counter; messages counted toward\n<code>subscribe.count<\/code>. Only when the step has a <code>subscribe<\/code> block.<\/li>\n<li><code>pubsub_e2e_ms<\/code> — HDR histogram (ms); publish-phase start → message\nconsumed, one sample per matched message. Only with <code>subscribe<\/code>, and only\nwhen at least one message matched (a subscribe wait that matched nothing\nemits no samples). For subscribe-only steps this is the wait time.<\/li>\n<\/ul>\n<p>Shared variables:<\/p>\n<ul>\n<li><code>shared_variable_wait_ms<\/code> — HDR histogram (ms); time blocked in\n<code>wait_for<\/code> before the condition held, one sample per waiting read.\nEmitted by <code>std/get_shared_variable@v1<\/code> only with <code>wait_for<\/code>.<\/li>\n<\/ul>\n<p>LLM — <a href=\"#/docs/core/llm\">llm.md<\/a>:<\/p>\n<ul>\n<li><code>llm_ttft_ms<\/code> — HDR histogram (ms); request start → first content chunk\n(time to first token). Streamed requests only.<\/li>\n<li><code>llm_tokens_per_sec<\/code> — HDR histogram; completion tokens / generation time\n(after the first token when streamed). Only when the server reports\ncompletion tokens.<\/li>\n<li><code>llm_prompt_tokens<\/code> / <code>llm_completion_tokens<\/code> — counters, as reported by\nthe server's <code>usage<\/code>; absent when the server does not report usage.<\/li>\n<li><code>llm_chunks<\/code> — counter; SSE chunks received (0 for non-streamed\nrequests).<\/li>\n<\/ul>\n<p>gRPC — <a href=\"#/docs/core/grpc\">grpc.md<\/a>:<\/p>\n<ul>\n<li><code>grpc_req_duration<\/code> — HDR histogram (ms); unary call latency, one sample\nper completed call. <code>std/grpc@v1<\/code> and <code>std/grpc-call@v1<\/code> only — stream\nlifetimes span user steps and deliberately feed nothing; a failed connect\nemits no metrics at all (no RPC was made).<\/li>\n<li><code>grpc_msg_rtt<\/code> — HDR histogram (ms); send → matching reply RTT. On a\nunary call emitted only when the status is OK (then it equals\n<code>grpc_req_duration<\/code>); on <code>std/grpc-stream-recv@v1<\/code> only when an <code>until_*<\/code>\nrule matched and a <code>grpc-stream-send<\/code> preceded it on the same stream.<\/li>\n<li><code>grpc_msgs_sent<\/code> — counter; messages sent, per <code>std/grpc-call@v1<\/code> call\n(1) and per <code>std/grpc-stream-send@v1<\/code> step.<\/li>\n<li><code>grpc_msgs_received<\/code> — counter; messages read, per <code>std/grpc-call@v1<\/code>\ncall, per <code>std/grpc-stream-recv@v1<\/code> and per <code>std/grpc-stream-close@v1<\/code>\n(drained at close).<\/li>\n<li><code>grpc_req_failed<\/code> — counter, 0/1 per call; calls that missed\n<code>expect_status<\/code>. Emitted by <code>std/grpc-call@v1<\/code> and\n<code>std/grpc-stream-close@v1<\/code> (close turns the stream's final status into\nthis counter). Note the derived same-named failure rate shadows this\ncounter — see <a href=\"#failure-rate-metrics-family_failed\">below<\/a>.<\/li>\n<\/ul>\n<p>GraphQL — <a href=\"#/docs/core/graphql\">graphql.md<\/a>:<\/p>\n<ul>\n<li><code>graphql_req_duration<\/code> — HDR histogram (ms); the operation's round trip,\none sample per request that was actually sent (success or failure).<\/li>\n<li><code>graphql_errors<\/code> — counter; GraphQL-level errors, including partial-data\nresponses that pass the step. Always emitted (0 on clean responses), so\n<code>graphql_errors: [\"count==0\"]<\/code> gates resolve on healthy runs too.<\/li>\n<li><code>graphql_op_&lt;operationName&gt;_duration<\/code> — HDR histogram (ms); per-operation\nlatency, emitted only for named operations (explicit <code>operation<\/code> or a\nsingle named operation in the document), so cardinality stays bounded by\nthe test definition.<\/li>\n<\/ul>\n<p>Databases:<\/p>\n<ul>\n<li><code>db_connect_duration<\/code> — HDR histogram (ms); connect + pool setup latency,\n<code>std/db-connect@v1<\/code> on success.<\/li>\n<li><code>db_query_duration<\/code> — HDR histogram (ms); query latency for\n<code>std/db-query@v1<\/code> and <code>std/db-tx-*@v1<\/code>; includes the fresh connect in\nper-query mode.<\/li>\n<li><code>db_rows<\/code> — counter; rows returned by <code>std/db-query@v1<\/code>, or rows affected\nwhen the statement returned none.<\/li>\n<li><code>db_errors<\/code> — counter; failed DB steps, total, emitted by every\n<code>std/db-*@v1<\/code> step. Successful steps emit <code>db_errors: 0<\/code>, so the counter\nexists (at 0) on fully healthy runs — gates like\n<code>db_errors: [\"count==0\"]<\/code> work either way.<\/li>\n<li><code>db_errors_connection<\/code> / <code>_constraint<\/code> / <code>_deadlock<\/code> / <code>_timeout<\/code> /\n<code>_other<\/code> — counters; same, split by class (SQLSTATE / errno / SQLite\nresult code), emitted on failure.<\/li>\n<\/ul>\n<p>Downstream actions use the same channel — e.g. the WebRTC plugin emits\n<code>webrtc_*<\/code> series (<a href=\"/docs/pro-features/webrtc#metrics\">WebRTC (pro)<\/a>) and the proprietary FIX\naction emits <code>fix_messages_sent<\/code>.<\/p>\n<h2>Failure-rate metrics (<code>&lt;family&gt;_failed<\/code>)<\/h2>\n<p><strong>Why they exist.<\/strong> <code>std/thresholds@v1<\/code> <code>rate<\/code> expressions are the natural\nshape for an SLO gate — \"fewer than 1% of calls may fail\" — but a duration\nhistogram alone cannot answer it: it holds latencies, and nothing in a\nlatency sample says whether the invocation that produced it succeeded. So\nalongside the <code>metrics<\/code> payload, the runner derives a per-invocation\nfailure signal generically.<\/p>\n<p><strong>How they are derived.<\/strong> For every array-valued (histogram) metric a step\ninvocation emits, the runner records one 0/1 sample — 1 when the step\ninvocation failed, 0 when it succeeded — under the metric's family name: a\ntrailing <code>_duration<\/code>/<code>_rtt<\/code> is replaced by <code>_failed<\/code>, and when there is no\nsuch suffix the full name gets <code>_failed<\/code> appended:<\/p>\n<table><thead><tr><th>Duration metric<\/th><th>Derived failure metric<\/th><\/tr><\/thead><tbody>\n<tr><td><code>http_req_duration<\/code><\/td><td><code>http_req_failed<\/code> (native to the HTTP path — see below)<\/td><\/tr>\n<tr><td><code>db_query_duration<\/code><\/td><td><code>db_query_failed<\/code><\/td><\/tr>\n<tr><td><code>db_connect_duration<\/code><\/td><td><code>db_connect_failed<\/code><\/td><\/tr>\n<tr><td><code>grpc_req_duration<\/code><\/td><td><code>grpc_req_failed<\/code><\/td><\/tr>\n<tr><td><code>graphql_req_duration<\/code><\/td><td><code>graphql_req_failed<\/code><\/td><\/tr>\n<tr><td><code>graphql_op_&lt;name&gt;_duration<\/code><\/td><td><code>graphql_op_&lt;name&gt;_failed<\/code> (per named operation)<\/td><\/tr>\n<tr><td><code>ws_msg_rtt<\/code><\/td><td><code>ws_msg_failed<\/code><\/td><\/tr>\n<tr><td><code>pubsub_e2e_ms<\/code><\/td><td><code>pubsub_e2e_ms_failed<\/code><\/td><\/tr>\n<tr><td><code>shared_variable_wait_ms<\/code><\/td><td><code>shared_variable_wait_ms_failed<\/code><\/td><\/tr>\n<tr><td><code>llm_ttft_ms<\/code><\/td><td><code>llm_ttft_ms_failed<\/code><\/td><\/tr>\n<tr><td><code>llm_tokens_per_sec<\/code><\/td><td><code>llm_tokens_per_sec_failed<\/code><\/td><\/tr>\n<tr><td><code>webrtc_setup_ms<\/code>, <code>webrtc_ttff_ms<\/code>, <code>webrtc_call_duration_ms<\/code>, …<\/td><td><code>&lt;same name&gt;_failed<\/code> — see <a href=\"/docs/pro-features/webrtc#metrics\">WebRTC (pro)<\/a><\/td><\/tr>\n<\/tbody><\/table>\n<p>These print as <code>&lt;name&gt;: &lt;pct&gt;%<\/code> (k6's <code>http_req_failed<\/code> shape). Because one\nsample is recorded <strong>per invocation<\/strong> (not per duration sample — an\ninvocation that matched three messages still records one failure sample),\n<code>failed/total<\/code> over them is exactly the step family's invocation failure\nrate — that is what <code>std/thresholds@v1<\/code> evaluates with <code>rate<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  - use: std/thresholds@v1\n    with:\n      graphql_req_failed:\n        - \"rate&lt;0.01\"             # fewer than 1% failed operations\n      pubsub_e2e_ms_failed:\n        - \"rate&lt;0.05\"             # subscribe waits mostly kept up\n<\/code><\/pre>\n<p>Note a failed step that emits no duration sample (e.g. <code>db-connect<\/code> that\nnever connected, a subscribe wait that matched zero messages) records no\nfailure sample either, so its family rate covers invocations that got far\nenough to produce a measurement.<\/p>\n<p><strong>Native vs derived.<\/strong> <code>http_req_failed<\/code> is native to the HTTP path: every\naction returning an <code>HttpSample<\/code> marks it failed/succeeded itself (status ≥\n400, transport error, timeout), and no derivation is involved. The gRPC\nfamily is the asymmetric case: <code>std/grpc-call@v1<\/code> and\n<code>std/grpc-stream-close@v1<\/code> emit a <code>grpc_req_failed<\/code> <strong>counter<\/strong> (0/1 per\ncall, driven by <code>expect_status<\/code>), and the runner <em>also<\/em> derives a\n<code>grpc_req_failed<\/code> rate from <code>grpc_req_duration<\/code>. When both exist, the rate\nmetric shadows the counter in the summary and in threshold evaluation — so\n<code>grpc_req_failed: [\"rate&lt;0.05\"]<\/code> works, while <code>count<\/code> expressions against\nthat name do not see the counter. The WebRTC family has its own failure\ncounters (<code>webrtc_connect_errors<\/code>, <code>webrtc_call_errors_&lt;stage&gt;<\/code>) that\ncoexist with derived rates — see <a href=\"/docs/pro-features/webrtc#metrics\">WebRTC (pro)<\/a>.<\/p>\n<h2>Run-level gates (<code>std/thresholds@v1<\/code>)<\/h2>\n<p>A <code>std/thresholds@v1<\/code> step (typically in <code>after:<\/code>) evaluates k6-style\nexpressions against the run aggregates and prints one machine-readable line\nafter the metric summary:<\/p>\n<pre><code class=\"language-text\">thresholds: {\"status\":\"fail\",\"message\":\"db_query_failed rate=1 ≥ 0.05; checkout SLO\",\"violations\":[{\"metric\":\"db_query_failed\",\"expr\":\"rate&lt;0.05\",\"actual\":1.0}]}\n<\/code><\/pre>\n<p>Aggregates come from the same HDR histograms/counters as the text summary,\nso gate numbers match what the summary prints. The line is collected into\n<code>perfscale run --summary-export<\/code> output under <code>thresholds<\/code>\n(<code>{status, message, violations}<\/code>), and a <code>fail<\/code> status makes the CLI exit\nnon-zero. See <a href=\"#/docs/core/actions\">actions.md<\/a>.<\/p>\n<h2>GPU metrics (<code>gpu:<\/code>)<\/h2>\n<p>With <code>gpu.enabled: true<\/code> in the <a href=\"#/docs/yaml-reference\">run config<\/a>,\nthe native engine samples every GPU on the host — utilization %, VRAM\nused/total, temperature, power draw — once per <code>interval_ms<\/code> for the whole\nVU phase (via <code>nvidia-smi<\/code> or a dcgm-exporter endpoint). After the metric\nsummary the run prints a compact per-device block plus one machine-readable\n<code>gpu: {...}<\/code> line with the full timeseries, which <code>--summary-export<\/code> embeds\nunder <code>gpu<\/code>:<\/p>\n<pre><code class=\"language-text\">gpu: 1 device, 300 samples every 1000ms (nvidia-smi)\ngpu0: util avg=64.3% max=100.0% vram max=41088/81559MiB temp max=71.0C power max=512.3W\ngpu: {\"source\":\"nvidia-smi\",\"interval_ms\":1000,\"devices\":[{\"index\":0,\"samples\":[…],…}]}\n<\/code><\/pre>\n<p>Collection is best-effort: no GPU / missing tooling logs one warning and the\nrun continues without GPU metrics. Sample timestamps share the epoch-ms\ntimeline with the <code>[stats]<\/code> lines, so load and GPU state correlate directly —\nthe primary use case is <a href=\"#/docs/core/llm\"><code>std/llm@v1<\/code><\/a> runs against local model\nservers. Full guide: <a href=\"#/docs/core/gpu\">gpu.md<\/a>.<\/p>\n<h2>The metrics registry (for step authors)<\/h2>\n<p>Step implementations declare their metrics in a <strong>family<\/strong>\n(<code>MetricsFamily<\/code>): a set of <code>MetricDef<\/code>s — name, kind (<code>counter<\/code>, <code>gauge<\/code>,\n<code>histogram<\/code>, <code>rate<\/code>), unit, description — registered process-globally via\n<code>perfscale_core::metrics::register_family<\/code>, next to the family's\n<code>register_action<\/code> calls. Core registers the built-in <code>http<\/code> family\n(<code>http_req_duration<\/code>, <code>http_req_failed<\/code>, <code>http_reqs<\/code>, plus the\n<code>perfscale_iterations_completed<\/code> / <code>perfscale_vus<\/code> run-progress gauges) and\nthe <code>llm<\/code> family (<code>llm_ttft_ms<\/code>, <code>llm_tokens_per_sec<\/code>, the token counters);\ndownstream pro crates register theirs the same way.<\/p>\n<p>What the registry buys:<\/p>\n<ul>\n<li><strong>Catalog<\/strong> — <code>perfscale metrics<\/code> prints every declared metric with its\nfamily, kind, unit, and description.<\/li>\n<li><strong>Fold-time validation<\/strong> — when a step emits a registered name with the\nwrong JSON shape (a scalar where the family declared a <code>histogram<\/code>, an\narray for a scalar kind), the run log gets a warning naming the metric and\nfamily. The value still folds (unknown-name behavior), so a buggy step\ndegrades its own metric instead of failing the run; unregistered names\npass through silently, as before.<\/li>\n<li><strong>Presentation hooks<\/strong> — a family can append fields to the live <code>[stats]<\/code>\nline (<code>stats_extras<\/code>, how the <code>llm<\/code> family adds <code>llm_reqs<\/code>/<code>llm_tok_s<\/code>)\nand its own block to the end-of-run summary (<code>summary_lines<\/code>, how the\n<code>http<\/code> family renders the <code>http_req_*<\/code> triple). Families without overrides\nrender through the generic shapes above, byte-identical to unregistered\nmetrics.<\/li>\n<li><strong>Background samplers<\/strong> — <code>start_samplers<\/code> runs at the start of the VU\nphase for metrics produced between steps (e.g. periodic WebRTC stats\npolling in pro builds). Built-in families register no samplers.<\/li>\n<\/ul>\n<p>See RFC 010 (<code>rfcs/010-metrics-module.md<\/code>) for the full design.<\/p>\n<h2><code>--quiet<\/code><\/h2>\n<p>Two independent layers:<\/p>\n<ul>\n<li><strong>At the source<\/strong> (native engine): per-iteration success output — request\nlines, sleep markers, passing checks — is not even formatted or sent.\nErrors, failing checks, <code>[stats]<\/code> lines, and the final summary are always\nemitted into the stream.<\/li>\n<li><strong>At the CLI printer<\/strong>: under <code>--quiet<\/code>, stdout lines print only if they\nare k6-shaped summary lines (<code>vus<\/code>, <code>iterations<\/code>, <code>http_req_*<\/code>); stderr and\nsystem lines always print. Custom metric lines and <code>[stats]<\/code> stay in the\nstream for log consumers but are hidden from the console.<\/li>\n<\/ul>\n<h2>Forwarding the summary (<code>report<\/code>)<\/h2>\n<p>Point the run at a <code>perfscale serve<\/code> instance and the summary lines are\nforwarded when the run finishes:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nreport:\n  url: http://localhost:7999\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml --report http://localhost:7999\n<\/code><\/pre>\n<p>The CLI flag wins over the config block. After the run, the CLI POSTs the\ncollected summary lines (only the k6-shaped ones) as\n<code>{\"lines\": […]}<\/code> to <code>&lt;url&gt;/api/v1/metrics<\/code> with a 5 s timeout; delivery\nproblems are logged as <code>[report] …<\/code> on stderr and never fail the run itself.<\/p>\n<h2>During-run metrics (<code>report.during_run<\/code>)<\/h2>\n<p>The same <code>report:<\/code> block can also stream metrics <strong>while the run is in\nprogress<\/strong> — cumulative snapshots of every metric family, batched and POSTed\nto the same <code>&lt;url&gt;/api/v1/metrics<\/code> endpoint:<\/p>\n<pre><code class=\"language-yaml\">report:\n  url: http://localhost:7999\n  during_run: true        # default false — only the end-of-run summary\n  interval_ms: 5000       # snapshot/flush interval, min 100\n  batch_size: 500         # flush a batch once it holds this many samples\n  max_cpu_percent: 90     # CPU gate; 0 disables it\n  max_pending: 24         # soft warn cap — batches are never dropped mid-run\n<\/code><\/pre>\n<p>The engine emits one snapshot per <code>interval_ms<\/code> (independent of the 5 s\n<code>[stats]<\/code> reporter) and a shipper batches them: a batch is POSTed once it\nreaches <code>batch_size<\/code> samples, and whatever is open flushes on every interval\ntick. Each POST body is <code>{samples, seq}<\/code> (<code>taskId<\/code> too when the caller sets\none), where <code>seq<\/code> is a monotonically increasing batch number reused across\nretries — receivers can deduplicate redeliveries.<\/p>\n<p><strong>Sample naming<\/strong> follows the Prometheus summary/counter conventions, with\ndurations converted from the engine's milliseconds to <strong>seconds<\/strong>:<\/p>\n<table><thead><tr><th>Engine metric<\/th><th>Shipped samples<\/th><\/tr><\/thead><tbody>\n<tr><td>histogram (<code>http_req_duration<\/code>, <code>db_query_duration<\/code>, …)<\/td><td><code>&lt;name&gt;{quantile=\"0.5\"/\"0.9\"/\"0.95\"/\"0.99\"}<\/code> (seconds), <code>&lt;name&gt;_count<\/code>, <code>&lt;name&gt;_sum<\/code> (seconds)<\/td><\/tr>\n<tr><td>counter (<code>db_rows<\/code>, …)<\/td><td><code>&lt;name&gt;_total<\/code><\/td><\/tr>\n<tr><td>failure rate (<code>http_req_failed<\/code>, …)<\/td><td><code>&lt;name&gt;_total<\/code> (invocations), <code>&lt;name&gt;_failed_total<\/code> (failures)<\/td><\/tr>\n<\/tbody><\/table>\n<p>All values are <strong>cumulative since run start<\/strong> — the HDR histograms and\ncounters never reset during a run. To derive per-window numbers consumer-side,\ndiff successive snapshots: <code>rate(x_count[window])<\/code>-style for throughput,\n<code>Δ_sum / Δ_count<\/code> for windowed average latency.<\/p>\n<p><strong>Every snapshot also carries two run-progress gauges<\/strong>, so a run whose steps\nrecord no samples yet — e.g. a pure-LLM run waiting on its first 60 s\ncompletion — still streams a non-empty batch every interval:<\/p>\n<table><thead><tr><th>Shipped sample<\/th><th>Meaning<\/th><\/tr><\/thead><tbody>\n<tr><td><code>perfscale_iterations_completed<\/code><\/td><td>iterations started since run start (monotonic)<\/td><\/tr>\n<tr><td><code>perfscale_vus<\/code><\/td><td>live VU count at snapshot time (the configured count on fixed runs)<\/td><\/tr>\n<\/tbody><\/table>\n<p><code>perfscale_iterations_completed<\/code> is cumulative (diff it for a per-window\niteration rate); <code>perfscale_vus<\/code> is a point-in-time gauge — chart as-is.<\/p>\n<p><strong>GPU gauges stream too<\/strong> when the run also has <code>gpu.enabled: true<\/code> (see\n<a href=\"#/docs/core/gpu\">GPU metrics<\/a>): each snapshot carries the GPU samples taken since the\nprevious one, as point-in-time gauges with the collector's own timestamps —\nchart them as-is, no diffing:<\/p>\n<table><thead><tr><th>Shipped sample<\/th><th>Labels<\/th><th>Unit<\/th><\/tr><\/thead><tbody>\n<tr><td><code>gpu_utilization_pct<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>percent, 0–100<\/td><\/tr>\n<tr><td><code>gpu_memory_used_mib<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>MiB<\/td><\/tr>\n<tr><td><code>gpu_memory_total_mib<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>MiB<\/td><\/tr>\n<tr><td><code>gpu_temperature_c<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>°C<\/td><\/tr>\n<tr><td><code>gpu_power_w<\/code><\/td><td><code>gpu=\"&lt;index&gt;\"<\/code><\/td><td>watts<\/td><\/tr>\n<\/tbody><\/table>\n<p>Fields the source reported as <code>N/A<\/code> are skipped (never shipped as zeros), and\npro-collector extras ride under their own names. Without <code>gpu.enabled<\/code> the\nsnapshots carry no GPU data at all.<\/p>\n<p><strong>Protective strategies<\/strong> (the VU loop always wins; streaming yields first):<\/p>\n<ul>\n<li><em>CPU gate<\/em>: while the host's busy CPU% (from <code>/proc/stat<\/code>) is at or above\n<code>max_cpu_percent<\/code>, pending batches are held — no POSTs — and incoming\nsnapshots are deferred (queued, every 10th logs a warning), then flushed\nin arrival order once the gate opens. Off-Linux there is no CPU reading,\nso the gate is inert. <code>max_cpu_percent: 0<\/code> disables it.<\/li>\n<li><em>Unbounded backlog, soft cap<\/em>: sealed-but-undelivered batches are never\ndropped while the run is alive; growing past <code>max_pending<\/code> only logs a\nrate-limited warning. Delivery resumes in order when the target responds.<\/li>\n<li><em>Retries<\/em>: network errors, 5xx and 429 retry the same batch with\nexponential backoff ×2 from 1 s, capped at 60 s. Any other 4xx is treated\nas poison — the batch is dropped, never retried.<\/li>\n<li><em>Shutdown<\/em>: when the run ends, everything still pending — including\nsnapshots deferred by the CPU gate — is flushed with short bounded\nretries (1/2/5/10 s), then the shipper exits. The CLI waits for this\nfinal drain (bounded) so the last batch lands before the process exits.<\/li>\n<\/ul>\n<p>The engine never blocks on streaming: snapshots go over a bounded channel\nwith <code>try_send<\/code>, and a full channel drops the snapshot rather than\nbackpressuring VUs — the only place a point can be shed mid-run. With\n<code>during_run<\/code> absent or <code>false<\/code> there is no extra task and no channel\ntraffic at all.<\/p>\n<p>Auth note: the CLI ships unauthenticated (same as the end-of-run report).\nThe authenticated path is the agent's — it runs the same shipper with a\nKeycloak token provider and a <code>taskId<\/code> (also stamped as a <code>task_id<\/code> label on\nevery sample).<\/p>\n<p><strong>On the platform<\/strong> (perfscale.su or a self-hosted controlplane) the stream\nlights the run page up live — latency quantiles, throughput, failure rate\nand GPU curves drawn as the samples arrive. The agent wires everything\nitself: <code>report.during_run: true<\/code> in the run's configuration is the only\nuser action — it authenticates the stream with its machine token and stamps\nevery sample with <code>task_id<\/code> and <code>machine_id<\/code>. The same samples feed the\nMetrics dashboard, the Prometheus-compatible query API (point Grafana at\n<code>/api/v1/integrations/prometheus<\/code>) and Remote Write into your own\nPrometheus/Mimir.<\/p>\n","html_ru":"<h1>Метрики<\/h1>\n<p>Нативный движок записывает каждый шаг, похожий на запрос, в HDR-гистограмму\nфиксированного размера и сворачивает пользовательские счётчики/гистограммы из\nвыводов действий в те же агрегаты запуска. Два выхода: машиночитаемая строка\n<code>[stats]<\/code> каждые 5 секунд во время запуска и k6-совместимая сводка в конце.<\/p>\n<h2>Метрики запросов (<code>http_req_*<\/code>)<\/h2>\n<p>Действия, выполняющие измеряемый по времени запрос, возвращают <code>HttpSample<\/code>\n(<code>duration_ms<\/code>, <code>status<\/code>, <code>failed<\/code>). Длительности записываются в\n<strong>микросекундах<\/strong> — вызовы через loopback короче миллисекунды остаются различимыми.<\/p>\n<table><thead><tr><th>Действие<\/th><th>Что попадает в <code>http_req_duration<\/code><\/th><th>Что считается ошибкой<\/th><\/tr><\/thead><tbody>\n<tr><td><code>std/http@v1<\/code><\/td><td>Каждый запрос<\/td><td>Статус ≥ 400, транспортная ошибка, таймаут (логируется как <code>→ TIMEOUT after …ms<\/code>; <code>status<\/code> указывается как 0)<\/td><\/tr>\n<tr><td><code>std/tcp@v1<\/code><\/td><td>Connect + обмен send/read<\/td><td>Ошибка соединения, таймаут, несовпадение с <code>expect<\/code><\/td><\/tr>\n<tr><td><code>std/udp@v1<\/code><\/td><td>Отправка (+ опциональное ожидание ответа)<\/td><td>Таймаут, несовпадение с <code>expect<\/code><\/td><\/tr>\n<tr><td><code>std/ws@v1<\/code><\/td><td>Вся one-shot-сессия целиком (один сэмпл)<\/td><td>Ошибка рукопожатия/транспорта, правило <code>until_*<\/code>, не выполненное вовремя<\/td><\/tr>\n<tr><td><code>std/ws-connect@v1<\/code><\/td><td>Только рукопожатие<\/td><td>Ошибка рукопожатия (<code>connected: false<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Намеренно <strong>не<\/strong> попадают в <code>http_req_duration<\/code> — шаг, чья длительность\nничего не говорит о задержке цели, отравил бы общие процентили:<\/p>\n<table><thead><tr><th>Действие<\/th><th>Почему<\/th><\/tr><\/thead><tbody>\n<tr><td><code>std/ws-recv@v1<\/code><\/td><td>То, сколько сервер ждёт перед отправкой, — не задержка цели<\/td><\/tr>\n<tr><td><code>std/ws-ping@v1<\/code><\/td><td>Транспортный RTT; вместо этого ограничивайте его через <code>check: { duration_ms_lt: … }<\/code><\/td><\/tr>\n<tr><td><code>std/ws-send@v1<\/code>, <code>std/ws-close@v1<\/code><\/td><td>Нет осмысленной задержки запроса<\/td><\/tr>\n<tr><td><code>std/grpc*@v1<\/code> (всё семейство)<\/td><td>У gRPC свои гистограммы (<code>grpc_req_duration<\/code>, <code>grpc_msg_rtt<\/code>); время жизни стримов выходит за пределы шагов пользователя, поэтому стримы не попадают даже в них<\/td><\/tr>\n<tr><td><code>std/db-*@v1<\/code> (всё семейство)<\/td><td>У DB-шагов свои гистограммы (<code>db_connect_duration<\/code>, <code>db_query_duration<\/code>) и счётчики (<code>db_rows<\/code>, <code>db_errors<\/code>)<\/td><\/tr>\n<tr><td><code>std/child_process@v1<\/code>, <code>std/kill_process@v1<\/code><\/td><td>Жизненный цикл процесса, а не запросы<\/td><\/tr>\n<tr><td><code>std/check@v1<\/code>, <code>std/sleep@v1<\/code>, <code>std/log@v1<\/code>, <code>std/file-*@v1<\/code><\/td><td>Нет сетевого ввода-вывода<\/td><\/tr>\n<\/tbody><\/table>\n<p>Обратите внимание на асимметрию: ошибки gRPC-утверждений попадают в\n<code>grpc_req_failed<\/code> (пользовательский счётчик, управляемый <code>expect_status<\/code>),\n<strong>а не<\/strong> в <code>http_req_failed<\/code>.<\/p>\n<h2>Латентность arrival-профиля и coordinated omission (<code>engine_arrival_*<\/code>)<\/h2>\n<p>Метрики запросов измеряют <strong>время сервера<\/strong>: часы стартуют в момент отправки\nзапроса (<code>http_req_duration<\/code> осознанно остаётся чистой латентностью ответа).\nВ arrival-rate профиле (открытая модель) движок дополнительно знает, когда\nкаждая итерация <em>должна была<\/em> начаться, и записывает скрытую половину\nкартины:<\/p>\n<table><thead><tr><th>Метрика<\/th><th>Тип<\/th><th>Что измеряет<\/th><\/tr><\/thead><tbody>\n<tr><td><code>engine_arrival_queue_wait_ms<\/code><\/td><td>гистограмма<\/td><td>Задержка «запланировано → фактически началось» — то самое ожидание в очереди, которое классические метрики латентности опускают (coordinated omission)<\/td><\/tr>\n<tr><td><code>engine_arrival_iteration_ms<\/code><\/td><td>гистограмма<\/td><td>Ожидание в очереди + тело итерации, измеренные от <em>запланированного<\/em> старта — CO-скорректированная сквозная латентность arrival-итерации<\/td><\/tr>\n<tr><td><code>dropped_iterations<\/code><\/td><td>счётчик<\/td><td>Пермиты, которые не смог обслужить ни один воркер (пул насыщен на <code>arrival.max_vus<\/code>) — выводится всегда, даже при 0, чтобы пороги <code>count==0<\/code> срабатывали на чистых запусках<\/td><\/tr>\n<\/tbody><\/table>\n<p>Под насыщением <code>http_req_duration<\/code> продолжает выглядеть здоровой — измеряются\nтолько запросы, которые реально начались, — в то время как\n<code>engine_arrival_queue_wait_ms<\/code> растёт, а <code>dropped_iterations<\/code> накапливается.\nОценивайте перегруженный arrival-запуск по всем трём вместе: одни перцентили\nзанижают то, что пережили пользователи.<\/p>\n<p>Это engine-метрики: записываются всегда на arrival-rate запусках (два\nсэмпла гистограммы на итерацию), зарегистрированы во встроенном семействе\n<code>engine<\/code> и доступны для <code>std/thresholds@v1<\/code>, как любая другая метрика.<\/p>\n<p>Связанный engine-счётчик, записываемый на любом профиле нагрузки:\n<code>engine_log_lines_dropped<\/code> — строки лога шагов, отброшенные из-за\nпереполнения ограниченного канала лога запуска (512 строк). Per-request\nвывод намеренно lossy (медленный потребитель stdout не должен растягивать\nитерации VU); сводка и ошибки движка доставляются всегда, а при dropped &gt; 0\nв конце запуска выводится одно предупреждение.<\/p>\n<h2>Итоговая сводка<\/h2>\n<p>Выводится в конце каждого запуска, k6-совместимая, чтобы нижестоящие парсеры\n(дашборды, <code>perfscale serve<\/code>) обрабатывали все движки единообразно:<\/p>\n<pre><code class=\"language-text\">vus....................: 10 min=1 max=10\niterations..............: 4521 150.23/s\nhttp_req_duration......: avg=0.42ms p(50)=0.31ms p(90)=0.88ms p(95)=1.02ms p(99)=1.90ms min=0.09ms max=3.10ms\nhttp_req_failed........: 0.00%\nhttp_reqs..............: 4521 150.23/s\n<\/code><\/pre>\n<ul>\n<li><code>vus<\/code> / <code>iterations<\/code> (+ скорость в секунду) выводятся всегда, даже для\nзапусков, состоящих только из sleep.<\/li>\n<li><code>dropped_iterations<\/code> всегда выводится для запусков с arrival rate — 0, если\nпул справлялся, — чтобы пороговые проверки (<code>dropped_iterations: [\"count==0\"]<\/code>)\nразрешались, а не падали с ошибкой на неизвестной метрике.<\/li>\n<li>Блок <code>http_req_*<\/code> появляется только когда записан хотя бы один сэмпл.<\/li>\n<li>Процентили берутся из HDR-гистограммы фиксированного размера (диапазон 1 мкс –\n1 ч, два значащих разряда → ошибка квантиля ≤1%) — потребление памяти не\nрастёт независимо от длительности soak-теста ценой погрешности, невидимой\nна выводимой точности.<\/li>\n<\/ul>\n<h2>Живые строки <code>[stats]<\/code><\/h2>\n<p>Каждые 5 секунд, пока работают VU, выводится одна машиночитаемая строка:<\/p>\n<pre><code class=\"language-text\">[stats] ts=1720000000000 rps=246.80 err_pct=0.00 p50=1.20 p90=3.40 p95=4.10 p99=8.20 reqs=1234 iters=456\n<\/code><\/pre>\n<ul>\n<li><code>ts<\/code> — миллисекунды unix-эпохи; <code>rps<\/code> — запросы за только что завершившееся\n5-секундное окно; <code>err_pct<\/code> — кумулятивный процент ошибок; <code>p50<\/code>…<code>p99<\/code> —\nкумулятивные процентили в мс (гистограмма никогда не сбрасывается, поэтому\nони сходятся, а не дрожат); <code>reqs<\/code> — суммарное число запросов; <code>iters<\/code> —\nсуммарное число итераций.<\/li>\n<li>Пока запросов не было, процентили опускаются:\n<code>[stats] ts=… rps=0.00 reqs=0 iters=3<\/code>.<\/li>\n<li><code>std/llm@v1<\/code> отчитывается своим семейством метрик и не попадает в\n<code>reqs<\/code>/<code>rps<\/code>, поэтому в чисто LLM-прогоне видно <code>reqs=0<\/code>, хотя запросы идут.\nКак только завершается первый LLM-запрос, строка дополняется полями\n<code>llm_reqs<\/code> (число завершённых LLM-запросов) и <code>llm_tok_s<\/code> (средняя скорость\nгенерации, tok/s):\n<code>[stats] ts=… rps=0.00 reqs=0 iters=12 llm_reqs=9 llm_tok_s=38.7<\/code>.<\/li>\n<li>Эти строки существуют для потоковых потребителей (controlplane разбирает их\nиз потока логов); о поведении консоли см. <a href=\"#quiet\"><code>--quiet<\/code><\/a>.<\/li>\n<\/ul>\n<h2>Пользовательские метрики (<code>value.metrics<\/code>)<\/h2>\n<p>Любое действие может прикрепить зарезервированный объект <code>metrics<\/code> к выводу\nсвоего шага; раннер сворачивает его в агрегаты запуска:<\/p>\n<ul>\n<li><strong>Число<\/strong> становится счётчиком, суммируется по всем VU и итерациям,\nвыводится как <code>&lt;name&gt;: &lt;total&gt; &lt;rate&gt;/s<\/code>.<\/li>\n<li><strong>Массив чисел<\/strong> становится сэмплами HDR-гистограммы (миллисекунды),\nвыводится как\n<code>&lt;name&gt;: avg=…ms p(50)=… p(90)=… p(95)=… p(99)=… min=… max=… count=N<\/code>.<\/li>\n<\/ul>\n<p>Встроенные эмиттеры, по метрикам (подробности — на странице каждого\nсемейства):<\/p>\n<p>WebSocket — <a href=\"#/docs/core/websocket\">websocket.md<\/a>:<\/p>\n<ul>\n<li><code>ws_msgs_sent<\/code> — счётчик; отправленные WS-сообщения. Эмитируется\n<code>std/ws@v1<\/code> (итог за всю сессию) и <code>std/ws-send@v1<\/code> (за шаг), при успехе\nи при ошибке.<\/li>\n<li><code>ws_msgs_received<\/code> — счётчик; прочитанные WS-сообщения. Эмитируется\n<code>std/ws@v1<\/code> и <code>std/ws-recv@v1<\/code>.<\/li>\n<li><code>ws_msg_rtt<\/code> — HDR-гистограмма (мс); отправка → первый ответ,\nподходящий под <code>until_*<\/code>-правило (RTT на уровне приложения). Один сэмпл\nна каждый совпавший ответ; эмитируется только когда правило сработало\nпосле отправки на том же соединении — чистое ожидание push не записывает\nничего (намеренно, см. <a href=\"#/docs/core/websocket\">websocket.md<\/a>).<\/li>\n<\/ul>\n<p>Pub/Sub — <a href=\"#/docs/core/pubsub\">pubsub.md<\/a>:<\/p>\n<ul>\n<li><code>pubsub_msgs_published<\/code> — счётчик; сообщения, принятые транспортом.\nЭмитируется каждым завершённым обменом <code>std/pubsub@v1<\/code> (также 0 для\nшагов только с подпиской).<\/li>\n<li><code>pubsub_msgs_received<\/code> — счётчик; сообщения, учтённые в\n<code>subscribe.count<\/code>. Только когда у шага есть блок <code>subscribe<\/code>.<\/li>\n<li><code>pubsub_e2e_ms<\/code> — HDR-гистограмма (мс); начало фазы публикации →\nсообщение обработано, один сэмпл на каждое совпавшее сообщение. Только с\n<code>subscribe<\/code> и только когда совпало хотя бы одно сообщение (ожидание\nподписки, не совпавшее ни с чем, сэмплов не эмитирует). Для шагов только\nс подпиской это время ожидания.<\/li>\n<\/ul>\n<p>Общие переменные:<\/p>\n<ul>\n<li><code>shared_variable_wait_ms<\/code> — HDR-гистограмма (мс); время блокировки в\n<code>wait_for<\/code> до выполнения условия, один сэмпл на каждое ожидающее чтение.\nЭмитируется <code>std/get_shared_variable@v1<\/code> только с <code>wait_for<\/code>.<\/li>\n<\/ul>\n<p>LLM — <a href=\"#/docs/core/llm\">llm.md<\/a>:<\/p>\n<ul>\n<li><code>llm_ttft_ms<\/code> — HDR-гистограмма (мс); начало запроса → первый чанк\nконтента (время до первого токена). Только потоковые запросы.<\/li>\n<li><code>llm_tokens_per_sec<\/code> — HDR-гистограмма; токены завершения / время\nгенерации (после первого токена при стриминге). Только когда сервер\nсообщает число токенов завершения.<\/li>\n<li><code>llm_prompt_tokens<\/code> / <code>llm_completion_tokens<\/code> — счётчики по данным\n<code>usage<\/code> сервера; отсутствуют, когда сервер не сообщает usage.<\/li>\n<li><code>llm_chunks<\/code> — счётчик; полученные SSE-чанки (0 для непотоковых\nзапросов).<\/li>\n<\/ul>\n<p>gRPC — <a href=\"#/docs/core/grpc\">grpc.md<\/a>:<\/p>\n<ul>\n<li><code>grpc_req_duration<\/code> — HDR-гистограмма (мс); задержка унарного вызова,\nодин сэмпл на завершённый вызов. Только <code>std/grpc@v1<\/code> и\n<code>std/grpc-call@v1<\/code> — время жизни стримов выходит за пределы шагов и\nнамеренно ничего не эмитирует; неудачное подключение не порождает метрик\nвообще (RPC не было).<\/li>\n<li><code>grpc_msg_rtt<\/code> — HDR-гистограмма (мс); отправка → RTT подходящего\nответа. При унарном вызове эмитируется только когда статус OK (тогда\nравен <code>grpc_req_duration<\/code>); на <code>std/grpc-stream-recv@v1<\/code> — только когда\nсработало правило <code>until_*<\/code> и перед этим на том же стриме был\n<code>grpc-stream-send<\/code>.<\/li>\n<li><code>grpc_msgs_sent<\/code> — счётчик; отправленные сообщения, за вызов\n<code>std/grpc-call@v1<\/code> (1) и за шаг <code>std/grpc-stream-send@v1<\/code>.<\/li>\n<li><code>grpc_msgs_received<\/code> — счётчик; прочитанные сообщения, за вызов\n<code>std/grpc-call@v1<\/code>, за шаг <code>std/grpc-stream-recv@v1<\/code> и за\n<code>std/grpc-stream-close@v1<\/code> (дочитанные при закрытии).<\/li>\n<li><code>grpc_req_failed<\/code> — счётчик, 0/1 на вызов; вызовы, не прошедшие\n<code>expect_status<\/code>. Эмитируется <code>std/grpc-call@v1<\/code> и\n<code>std/grpc-stream-close@v1<\/code> (close превращает финальный статус стрима в\nэтот счётчик). Учтите: производная одноимённая rate-метрика затеняет этот\nсчётчик — см. <a href=\"#%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D0%BA%D0%B8-%D0%B4%D0%BE%D0%BB%D0%B8-%D0%BE%D1%88%D0%B8%D0%B1%D0%BE%D0%BA-family_failed\">ниже<\/a>.<\/li>\n<\/ul>\n<p>GraphQL — <a href=\"#/docs/core/graphql\">graphql.md<\/a>:<\/p>\n<ul>\n<li><code>graphql_req_duration<\/code> — HDR-гистограмма (мс); полный цикл операции,\nодин сэмпл на каждый реально отправленный запрос (успех или ошибка).<\/li>\n<li><code>graphql_errors<\/code> — счётчик; ошибки уровня GraphQL, включая ответы с\nчастичными данными, которые проходят шаг. Эмитируется всегда (0 на\nчистых ответах), поэтому проверки <code>graphql_errors: [\"count==0\"]<\/code>\nразрешаются и на здоровых прогонах.<\/li>\n<li><code>graphql_op_&lt;operationName&gt;_duration<\/code> — HDR-гистограмма (мс); задержка\nпо операциям, эмитируется только для именованных операций (явный\n<code>operation<\/code> или единственная именованная операция в документе), поэтому\nкардинальность ограничена определением теста.<\/li>\n<\/ul>\n<p>Базы данных:<\/p>\n<ul>\n<li><code>db_connect_duration<\/code> — HDR-гистограмма (мс); задержка соединения +\nнастройки пула, <code>std/db-connect@v1<\/code> при успехе.<\/li>\n<li><code>db_query_duration<\/code> — HDR-гистограмма (мс); задержка запроса для\n<code>std/db-query@v1<\/code> и <code>std/db-tx-*@v1<\/code>; в режиме соединения на каждый\nзапрос включает новый connect.<\/li>\n<li><code>db_rows<\/code> — счётчик; строки, возвращённые <code>std/db-query@v1<\/code>, либо\nзатронутые строки, если выражение не вернуло ни одной.<\/li>\n<li><code>db_errors<\/code> — счётчик; неудачные DB-шаги, всего, эмитируется каждым\nшагом <code>std/db-*@v1<\/code>. Успешные шаги эмитируют <code>db_errors: 0<\/code>, поэтому\nсчётчик существует (равный 0) даже на полностью здоровых прогонах —\nпроверки вида <code>db_errors: [\"count==0\"]<\/code> работают в обоих случаях.<\/li>\n<li><code>db_errors_connection<\/code> / <code>_constraint<\/code> / <code>_deadlock<\/code> / <code>_timeout<\/code> /\n<code>_other<\/code> — счётчики; то же, разбитое по классам (SQLSTATE / errno / код\nрезультата SQLite), эмитируются при ошибке.<\/li>\n<\/ul>\n<p>Нижестоящие действия используют тот же канал — например, WebRTC-плагин\nэмитирует серии <code>webrtc_*<\/code> (<a href=\"/docs/pro-features/webrtc#%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D0%BA%D0%B8\">WebRTC (pro)<\/a>), а\nпроприетарное FIX-действие эмитирует <code>fix_messages_sent<\/code>.<\/p>\n<h2>Метрики доли ошибок (<code>&lt;family&gt;_failed<\/code>)<\/h2>\n<p><strong>Зачем они нужны.<\/strong> Выражения <code>rate<\/code> в <code>std/thresholds@v1<\/code> — естественная\nформа SLO-гейта: «менее 1% вызовов может падать», — но одна гистограмма\nдлительностей на него не отвечает: в ней лежат задержки, и ничто в сэмпле\nзадержки не говорит, успешным ли был породивший его вызов. Поэтому помимо\nполезной нагрузки <code>metrics<\/code> раннер универсально вычисляет сигнал ошибок по\nвызовам.<\/p>\n<p><strong>Как они вычисляются.<\/strong> Для каждой гистограммной (массивной) метрики,\nкоторую эмитирует вызов шага, раннер записывает один сэмпл 0/1 — 1, если\nвызов завершился ошибкой, 0 при успехе — под именем семейства метрики:\nхвост <code>_duration<\/code>/<code>_rtt<\/code> заменяется на <code>_failed<\/code>, а если такого хвоста нет,\n<code>_failed<\/code> добавляется к полному имени:<\/p>\n<table><thead><tr><th>Метрика длительности<\/th><th>Производная метрика ошибок<\/th><\/tr><\/thead><tbody>\n<tr><td><code>http_req_duration<\/code><\/td><td><code>http_req_failed<\/code> (нативная для HTTP-пути — см. ниже)<\/td><\/tr>\n<tr><td><code>db_query_duration<\/code><\/td><td><code>db_query_failed<\/code><\/td><\/tr>\n<tr><td><code>db_connect_duration<\/code><\/td><td><code>db_connect_failed<\/code><\/td><\/tr>\n<tr><td><code>grpc_req_duration<\/code><\/td><td><code>grpc_req_failed<\/code><\/td><\/tr>\n<tr><td><code>graphql_req_duration<\/code><\/td><td><code>graphql_req_failed<\/code><\/td><\/tr>\n<tr><td><code>graphql_op_&lt;name&gt;_duration<\/code><\/td><td><code>graphql_op_&lt;name&gt;_failed<\/code> (по каждой именованной операции)<\/td><\/tr>\n<tr><td><code>ws_msg_rtt<\/code><\/td><td><code>ws_msg_failed<\/code><\/td><\/tr>\n<tr><td><code>pubsub_e2e_ms<\/code><\/td><td><code>pubsub_e2e_ms_failed<\/code><\/td><\/tr>\n<tr><td><code>shared_variable_wait_ms<\/code><\/td><td><code>shared_variable_wait_ms_failed<\/code><\/td><\/tr>\n<tr><td><code>llm_ttft_ms<\/code><\/td><td><code>llm_ttft_ms_failed<\/code><\/td><\/tr>\n<tr><td><code>llm_tokens_per_sec<\/code><\/td><td><code>llm_tokens_per_sec_failed<\/code><\/td><\/tr>\n<tr><td><code>webrtc_setup_ms<\/code>, <cod
