<script>window.PERFSCALE_DOCS = [{"group":"top","html_en":"<h1>perfscale documentation<\/h1>\n<p>perfscale is a single CLI for running load tests with <a target=\"_blank\" rel=\"noopener\" href=\"https://k6.io\">k6<\/a>,\n<a target=\"_blank\" rel=\"noopener\" href=\"https://locust.io\">locust<\/a>, or perfscale's own native step engine — plus a\ntiny local dev server for collecting results.<\/p>\n<h2>Start here<\/h2>\n<ul>\n<li><a href=\"#/docs/getting-started\">Getting started<\/a> — install, first run, first results<\/li>\n<li><a href=\"#/docs/yaml-reference\">YAML reference<\/a> — the <code>test.yaml<\/code> / <code>config.yaml<\/code> formats<\/li>\n<li><a href=\"#/docs/library-sdk\">Library SDKs<\/a> — author WASM value-generator libraries in\nRust, TypeScript, or Go<\/li>\n<\/ul>\n<h2>CLI (<code>perfscale<\/code> binary)<\/h2>\n<ul>\n<li><a href=\"#/docs/cli/commands\">Commands<\/a> — <code>run<\/code>, <code>serve<\/code>, <code>lint<\/code>, and <code>schema<\/code> reference<\/li>\n<li><a href=\"#/docs/cli/examples\">Recipes<\/a> — copy-paste examples for common workflows<\/li>\n<li><a href=\"#/docs/benchmarks\">Benchmarks<\/a> — engine comparison methodology &amp; CI runs<\/li>\n<li><a href=\"#/docs/mcp\">MCP server<\/a> — drive perfscale from AI agents over the Model Context Protocol<\/li>\n<\/ul>\n<h2>Core (<code>perfscale-core<\/code> library)<\/h2>\n<ul>\n<li><a href=\"#/docs/core/architecture\">Architecture<\/a> — how the pieces fit together<\/li>\n<li><a href=\"#/docs/core/runners\">Runners<\/a> — k6, locust, JMeter, and the native engine<\/li>\n<li><a href=\"#/docs/core/actions\">Actions<\/a> — <code>std/http<\/code>, <code>std/tcp<\/code>, <code>std/udp<\/code>, <code>std/ws*<\/code>\n(WebSocket), <code>std/graphql<\/code> (GraphQL), <code>std/grpc*<\/code> (gRPC), <code>std/db-*<\/code> (SQL databases), <code>std/check<\/code>,\n<code>std/sleep<\/code>, <code>std/log<\/code>,\n<code>std/file-*<\/code>, <code>std/child_process<\/code>, <code>std/kill_process<\/code>,\n<code>std/set_shared_variable<\/code>, <code>std/get_shared_variable<\/code>, <code>std/thresholds<\/code><\/li>\n<li><a href=\"#/docs/core/setup-teardown\">Setup and teardown<\/a> — <code>before:<\/code>/<code>after:<\/code> lifecycle,\n<code>config.*<\/code>/<code>vars.*<\/code> data flow, background processes<\/li>\n<li><a href=\"#/docs/core/imports\">Imports<\/a> — compose test/config documents from a shared\nbase: local paths, HTTP URLs, git repos; merge semantics, caching, and the\n<code>--allow-remote-import<\/code> security gate<\/li>\n<li><a href=\"#/docs/core/libraries\">Libraries guide<\/a> — custom value generators for\n<code>${alias.fn(...)}<\/code> tokens: the <code>@std/random<\/code> built-in, WASM components,\nthe capability sandbox, and authoring your own with the Rust / TypeScript\n/ Go SDKs<\/li>\n<li><a href=\"#/docs/core/metrics\">Metrics<\/a> — <code>http_req_*<\/code>, <code>[stats]<\/code> lines, custom\ncounters/histograms, <code>--quiet<\/code>, summary forwarding<\/li>\n<li><a href=\"#/docs/core/websocket\">WebSocket guide<\/a> — sessions, live connections, message\nRTT, assertions<\/li>\n<li><a href=\"#/docs/core/graphql\">GraphQL guide<\/a> — queries/mutations, introspection\nschema validation<\/li>\n<li><a href=\"#/docs/core/grpc\">gRPC guide<\/a> — dynamic schemas (reflection / descriptor\nsets), unary calls, streams<\/li>\n<li><a href=\"#/docs/core/shared-variables\">Shared variables guide<\/a> — cross-VU shared\nmutable state: counters, producer/consumer queues, barriers<\/li>\n<li><a href=\"#/docs/core/gpu\">GPU metrics guide<\/a> — utilization/VRAM/temp/power during a\nrun, <code>nvidia-smi<\/code> and dcgm-exporter sources<\/li>\n<li><a href=\"#/docs/core/jmeter\">JMeter guide<\/a> — run existing <code>.jmx<\/code> plans headless,\ntranslated k6-compatible summary, parameterization, limits<\/li>\n<li><a href=\"#/docs/core/docker\">Docker<\/a> — ready-to-run ghcr.io images (slim and\nk6-bundled flavors), mounting scenarios, CI recipes<\/li>\n<li><a href=\"#/docs/core/kubernetes\">Kubernetes<\/a> — the perfscaled agent Helm chart\n(DaemonSet, fleet library policy, cache volume) and one-shot CLI Jobs<\/li>\n<\/ul>\n<h2>For contributors<\/h2>\n<ul>\n<li><a href=\"../README.md\">Repository README<\/a> — layout, local development, release builds<\/li>\n<li><a href=\"../examples/\">Examples<\/a> — runnable sample files for each engine<\/li>\n<li><a href=\"../schema/\">JSON Schemas<\/a> — generated schemas for editor autocomplete<\/li>\n<\/ul>\n","html_ru":"<h1>Документация perfscale<\/h1>\n<p>perfscale — это единый CLI для запуска нагрузочных тестов с <a target=\"_blank\" rel=\"noopener\" href=\"https://k6.io\">k6<\/a>,\n<a target=\"_blank\" rel=\"noopener\" href=\"https://locust.io\">locust<\/a> или собственным нативным шаговым движком perfscale —\nплюс небольшой локальный dev-сервер для сбора результатов.<\/p>\n<h2>С чего начать<\/h2>\n<ul>\n<li><a href=\"#/docs/getting-started\">Начало работы<\/a> — установка, первый запуск, первые результаты<\/li>\n<li><a href=\"#/docs/yaml-reference\">Справочник YAML<\/a> — форматы <code>test.yaml<\/code> / <code>config.yaml<\/code><\/li>\n<li><a href=\"#/docs/library-sdk\">SDK для библиотек<\/a> — создание WASM-библиотек генераторов\nзначений на Rust, TypeScript или Go<\/li>\n<\/ul>\n<h2>CLI (бинарник <code>perfscale<\/code>)<\/h2>\n<ul>\n<li><a href=\"#/docs/cli/commands\">Команды<\/a> — справочник по <code>run<\/code>, <code>serve<\/code>, <code>lint<\/code> и <code>schema<\/code><\/li>\n<li><a href=\"#/docs/cli/examples\">Рецепты<\/a> — готовые примеры для типовых задач<\/li>\n<li><a href=\"#/docs/benchmarks\">Бенчмарки<\/a> — методология сравнения движков и запуски в CI<\/li>\n<li><a href=\"#/docs/mcp\">MCP-сервер<\/a> — управление perfscale из AI-агентов по протоколу Model Context Protocol<\/li>\n<\/ul>\n<h2>Ядро (библиотека <code>perfscale-core<\/code>)<\/h2>\n<ul>\n<li><a href=\"#/docs/core/architecture\">Архитектура<\/a> — как части системы связаны между собой<\/li>\n<li><a href=\"#/docs/core/runners\">Раннеры<\/a> — k6, locust, JMeter и нативный движок<\/li>\n<li><a href=\"#/docs/core/actions\">Действия<\/a> — <code>std/http<\/code>, <code>std/tcp<\/code>, <code>std/udp<\/code>, <code>std/ws*<\/code>\n(WebSocket), <code>std/graphql<\/code> (GraphQL), <code>std/grpc*<\/code> (gRPC), <code>std/db-*<\/code> (базы данных SQL), <code>std/check<\/code>,\n<code>std/sleep<\/code>, <code>std/log<\/code>,\n<code>std/file-*<\/code>, <code>std/child_process<\/code>, <code>std/kill_process<\/code>,\n<code>std/set_shared_variable<\/code>, <code>std/get_shared_variable<\/code>, <code>std/thresholds<\/code><\/li>\n<li><a href=\"#/docs/core/setup-teardown\">Setup и teardown<\/a> — жизненный цикл <code>before:<\/code>/<code>after:<\/code>,\nпоток данных <code>config.*<\/code>/<code>vars.*<\/code>, фоновые процессы<\/li>\n<li><a href=\"#/docs/core/imports\">Импорты<\/a> — сборка документов теста/конфига из общей\nбазы: локальные пути, HTTP-URL, git-репозитории; семантика слияния, кеширование\nи защитный барьер <code>--allow-remote-import<\/code><\/li>\n<li><a href=\"#/docs/core/libraries\">Руководство по библиотекам<\/a> — пользовательские генераторы\nзначений для токенов <code>${alias.fn(...)}<\/code>: встроенный <code>@std/random<\/code>, WASM-компоненты,\nsandbox на основе capability и создание собственных библиотек с SDK для Rust / TypeScript\n/ Go<\/li>\n<li><a href=\"#/docs/core/metrics\">Метрики<\/a> — <code>http_req_*<\/code>, строки <code>[stats]<\/code>, пользовательские\nсчётчики/гистограммы, <code>--quiet<\/code>, пересылка сводки<\/li>\n<li><a href=\"#/docs/core/websocket\">Руководство по WebSocket<\/a> — сессии, живые соединения, RTT\nсообщений, проверки<\/li>\n<li><a href=\"#/docs/core/graphql\">Руководство по GraphQL<\/a> — запросы/мутации, валидация схемы\nчерез интроспекцию<\/li>\n<li><a href=\"#/docs/core/grpc\">Руководство по gRPC<\/a> — динамические схемы (reflection /\ndescriptor set), унарные вызовы, потоки<\/li>\n<li><a href=\"#/docs/core/shared-variables\">Руководство по разделяемым переменным<\/a> — разделяемое\nизменяемое состояние между VU: счётчики, очереди producer/consumer, барьеры<\/li>\n<li><a href=\"#/docs/core/gpu\">Руководство по метрикам GPU<\/a> — загрузка/VRAM/температура/потребление\nво время прогона, источники <code>nvidia-smi<\/code> и dcgm-exporter<\/li>\n<li><a href=\"#/docs/core/jmeter\">Руководство по JMeter<\/a> — headless-запуск существующих планов\n<code>.jmx<\/code>, транслированная k6-совместимая сводка, параметризация, ограничения<\/li>\n<li><a href=\"#/docs/core/docker\">Docker<\/a> — готовые к запуску образы ghcr.io (варианты slim и\nсо встроенным k6), монтирование сценариев, рецепты для CI<\/li>\n<li><a href=\"#/docs/core/kubernetes\">Kubernetes<\/a> — Helm-чарт агента perfscaled\n(DaemonSet, политика fleet-библиотек, том кеша) и разовые CLI-задачи Jobs<\/li>\n<\/ul>\n<h2>Для контрибьюторов<\/h2>\n<ul>\n<li><a href=\"../README.md\">README репозитория<\/a> — структура, локальная разработка, сборки релизов<\/li>\n<li><a href=\"../examples/\">Примеры<\/a> — запускаемые примеры файлов для каждого движка<\/li>\n<li><a href=\"../schema/\">JSON Schemas<\/a> — сгенерированные схемы для автодополнения в редакторе<\/li>\n<\/ul>\n","slug":"README","title":"perfscale documentation"},{"group":"top","html_en":"<h1>Benchmarks<\/h1>\n<p>perfscale ships a suite-based benchmark script comparing engines under an\nidentical workload:<\/p>\n<pre><code class=\"language-sh\">./scripts/bench.sh                       # all suites\nSUITES=\"throughput startup\" ./scripts/bench.sh\n<\/code><\/pre>\n<p>Every scenario hits the same <code>perfscale serve<\/code> instance on loopback, so any\ngap between a <code>perfscale (*)<\/code> row and its native counterpart is perfscale's\nwrapping overhead — not the underlying tool.<\/p>\n<table><thead><tr><th>Scenario<\/th><th>What it runs<\/th><\/tr><\/thead><tbody>\n<tr><td><code>locust (native)<\/code><\/td><td><code>locust<\/code> invoked directly — baseline<\/td><\/tr>\n<tr><td><code>k6 (native)<\/code><\/td><td><code>k6<\/code> invoked directly — baseline<\/td><\/tr>\n<tr><td><code>jmeter (native)<\/code><\/td><td><code>jmeter -n -t<\/code> invoked directly — baseline (overhead/startup suites only)<\/td><\/tr>\n<tr><td><code>perfscale (k6)<\/code><\/td><td>the same k6 script, via <code>perfscale run --k6<\/code><\/td><\/tr>\n<tr><td><code>perfscale (locust)<\/code><\/td><td>the same locustfile, via <code>perfscale run --locust<\/code><\/td><\/tr>\n<tr><td><code>perfscale (jmeter)<\/code><\/td><td>the same <code>.jmx<\/code> plan, via <code>perfscale run --jmeter<\/code> (overhead/startup suites only)<\/td><\/tr>\n<tr><td><code>perfscale (yaml)<\/code><\/td><td>perfscale's own step engine (no external binary)<\/td><\/tr>\n<tr><td><code>perfscale (yaml quiet)<\/code><\/td><td>the step engine with <code>--quiet<\/code> — per-request logging suppressed; the delta against <code>perfscale (yaml)<\/code> is the logging cost<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Suites<\/h2>\n<table><thead><tr><th>Suite<\/th><th>Question it answers<\/th><\/tr><\/thead><tbody>\n<tr><td><code>overhead<\/code><\/td><td>Does wrapping add wall time at a fixed duration? (hyperfine, statistically averaged)<\/td><\/tr>\n<tr><td><code>throughput<\/code><\/td><td>How many requests / what latency does each scenario actually deliver? Plus CPU, CPU-per-request, peak RSS, IO ops from the same instrumented run<\/td><\/tr>\n<tr><td><code>startup<\/code><\/td><td>What does the wrapper cost at startup? (1s runs, where startup isn't drowned by the test duration)<\/td><\/tr>\n<tr><td><code>scaling<\/code><\/td><td>How do RPS / p95 / RSS grow with VUs? (default sweep: 10, 50, 200)<\/td><\/tr>\n<tr><td><code>saturation<\/code><\/td><td>Approximate max RPS per engine at high VUs (default 256)<\/td><\/tr>\n<tr><td><code>yaml<\/code><\/td><td>What does each native-engine feature cost? (GET baseline vs <code>--quiet<\/code> vs +check vs POST body vs multi-step interpolation)<\/td><\/tr>\n<tr><td><code>ws<\/code><\/td><td>WebSocket message throughput and RTT: same-connection echo round-trips against <code>serve<\/code>'s <code>/ws<\/code> endpoint (<code>perfscale (yaml)<\/code>, <code>k6 (native)<\/code>, <code>perfscale (k6)<\/code> — locust has no built-in WebSocket support and is skipped)<\/td><\/tr>\n<tr><td><code>boundary<\/code><\/td><td>Where does the engine break? Climbs a ladder of VU ceilings (<code>BOUNDARY_LADDER<\/code>, default <code>5000 15000 30000<\/code>): each rung ramps 0→ceiling over <code>BOUNDARY_DURATION<\/code>; the boundary is the VU level / time / RPS where the cumulative error rate first reaches <code>BOUNDARY_ERR_PCT<\/code> percent (default 1%) — or the rung where the process dies (OOM/crash counts as the boundary). An engine that crossed stops climbing<\/td><\/tr>\n<tr><td><code>tls<\/code><\/td><td>The TLS tax: same workload against <code>perfscale serve --tls<\/code> (self-signed HTTPS, verification skipped)<\/td><\/tr>\n<tr><td><code>library<\/code><\/td><td>WASM value-generator cost: per-run compile (cold) vs burn-cache deserialize vs the <code>@std/random<\/code> builtin<\/td><\/tr>\n<tr><td><code>grpc<\/code><\/td><td><code>std/grpc@v1<\/code> unary echo against the repo's <code>grpc_echo_server<\/code> example<\/td><\/tr>\n<tr><td><code>graphql<\/code><\/td><td><code>std/graphql@v1<\/code> query against the repo's <code>graphql_server<\/code> example<\/td><\/tr>\n<tr><td><code>db<\/code><\/td><td>SQL: cold connect+query vs warm persistent pool vs transactions (<code>std/db-*@v1<\/code>, PostgreSQL + in-process SQLite), plus the warm shape from locust (psycopg2), JMeter (JDBC) and k6 — the k6 row is a <strong>custom binary<\/strong> built with the <code>xk6-sql<\/code> extension + postgres driver (stock k6 has no SQL module), used only by this row<\/td><\/tr>\n<\/tbody><\/table>\n<p>JMeter joins only the hyperfine suites (<code>overhead<\/code>/<code>startup<\/code>): its non-GUI\nconsole summary has no percentiles, so it stays out of the <code>throughput<\/code>\ntable. Parsing its <code>.jtl<\/code> result files for full throughput metrics is future\nwork.<\/p>\n<p>Select suites with <code>SUITES=\"...\"<\/code>. Scenarios whose engine (<code>k6<\/code>/<code>locust<\/code>/\n<code>jmeter<\/code>) isn't on <code>PATH<\/code> are skipped, not failed; <code>overhead<\/code>/<code>startup<\/code> need\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/sharkdp/hyperfine\">hyperfine<\/a>, the rest don't.<\/p>\n<p>The <code>boundary<\/code> suite detects the crossing differently per engine: k6 aborts\nitself via an <code>abortOnFail<\/code> threshold (the peak-VU progress line is the\nboundary), locust is read from its <code>--csv-full-history<\/code> Aggregated rows,\njmeter from accumulated <code>summary +<\/code> deltas (run with\n<code>-Jsummariser.interval=2<\/code>, heap raised via <code>BOUNDARY_JMETER_HEAP<\/code>), and the\nnative engine from its periodic <code>[stats]<\/code> lines — which is why the native\nboundary row runs without <code>--quiet<\/code> and includes the per-request logging\ncost. A non-zero engine exit without a detected crossing (OOM, crash) is\nrecorded as the boundary at that rung with a \"process died\" note. Wrapped\nlocust/jmeter rows are omitted: the wrapper is a pass-through, the boundary\nis an engine property. <code>BOUNDARY_MAX_VUS<\/code>, when set, replaces the ladder with\na single rung (backwards-compatible override). Between runs the suite probes\nthe target with 50 fresh connections and waits out any loopback TIME_WAIT\ndrain left by the previous engine (the CI runner also gets a widened\n<code>ip_local_port_range<\/code> + <code>tcp_tw_reuse<\/code>) — a boundary must be the engine's,\nnot the machine's exhausted ephemeral ports.<\/p>\n<p>The <code>db<\/code> suite separates the cold path (<code>db<\/code>, <code>db-params<\/code>: connect + one\nquery per iteration, connection dropped at iteration end) from the warm path\n(<code>db-warm<\/code>: one persistent pool per iteration, <code>DB_WARM_QUERIES<\/code> queries,\n<code>db-close<\/code>; <code>db-warm-tx<\/code>: <code>DB_TX_CYCLES<\/code> × begin+query+commit) and adds an\nin-process SQLite floor (<code>db-sqlite<\/code>, <code>db-sqlite-warm<\/code>, no server needed).\nThe locust row (<code>pipx inject locust psycopg2-binary<\/code>), the JMeter row\n(PostgreSQL JDBC jar in JMeter's <code>lib/<\/code>, <code>BENCH_PG_JDBC_JAR<\/code> to point\nelsewhere), and the k6 row repeat the warm shape. The <code>k6 (xk6-sql)<\/code> row is\n<strong>not stock k6<\/strong>: stock k6 has no SQL module, so the bench workflow builds a\nseparate binary with <code>xk6 build<\/code> (xk6-sql extension + postgres driver, all\nversions pinned, binary cached; <code>K6_SQL_BIN<\/code>, default\n<code>target/xk6-sql/k6<\/code>). Its k6 core version may differ from the stock one — the\nCI environment summary prints both. The custom binary serves only this row;\nevery other k6 scenario keeps using the stock binary.<\/p>\n<p>Micro-benchmarks for the native engine's hot paths (YAML parse, <code>${{ ... }}<\/code>\ninterpolation, metrics recording / percentile summary, <code>RingBuf<\/code> process-output\ncapture, <code>waitUntil<\/code> readiness matchers) live in\n<code>crates/perfscale-core/benches/<\/code> and run with <code>cargo bench -p perfscale-core<\/code>.<\/p>\n<h2>GPU inference (local only)<\/h2>\n<p>A separate suite for benchmarking <strong>GPU-backed LLM inference<\/strong> (Ollama /\nvLLM via <code>std/llm@v1<\/code>, with <code>gpu:<\/code> run metrics — TTFT, tokens/sec, GPU\nutilization/VRAM) lives in <a href=\"../bench/gpu/README.md\"><code>bench/gpu/<\/code><\/a>. It is\ndeliberately not part of the CI workflow above: hosted runners have no GPU,\nso the suite runs on a local machine with an NVIDIA card.<\/p>\n<h2>Methodology<\/h2>\n<ul>\n<li><strong>Target<\/strong>: a <code>perfscale serve<\/code> instance on loopback (<code>GET /health<\/code>; the\n<code>ws<\/code> suite uses its <code>GET /ws<\/code> WebSocket echo endpoint) — no network noise,\nthe same target for every scenario within a run. The <code>tls<\/code>\nsuite adds a second <code>serve --tls<\/code> instance.<\/li>\n<li><strong>Wall-time comparison<\/strong> (<code>overhead<\/code>, <code>startup<\/code>): hyperfine repeats each\nscenario (<code>--runs<\/code>, with a <code>--warmup<\/code>) and reports mean, min/max, and\nstandard deviation.<\/li>\n<li><strong>Throughput/latency/resources<\/strong>: one instrumented run per scenario under\n<code>/usr/bin/time<\/code> (<code>-v<\/code> on Linux, <code>-l<\/code> on macOS), with requests, RPS, and\nlatency percentiles parsed from the engine's own summary (k6 text summary,\nlocust <code>--csv<\/code> stats, perfscale's uniform summary lines). Single-run:\ndirectional, not statistically tight.<\/li>\n<li><strong>Beware fixed-duration wall time<\/strong>: every scenario runs the same\nduration, so overhead-suite wall times are all ≈ the duration itself.\nRelative numbers near 1.00 prove the wrapper adds nothing; <em>throughput<\/em>\nnumbers are where engines actually differ.<\/li>\n<li><strong>Shared CPU<\/strong>: the load generator and <code>perfscale serve<\/code> share one\nmachine. Saturation ceilings include the target's cost; if two engines\nplateau at similar RPS, suspect the target/CPU, not the engine.<\/li>\n<\/ul>\n<h2>Running locally<\/h2>\n<pre><code class=\"language-sh\">cargo build --release\n./scripts/bench.sh                                   # all suites, 10 VUs, 15s, 5 runs\nVUS=50 DURATION=30s ./scripts/bench.sh\nSUITES=\"yaml\" YAML_DURATION=5s ./scripts/bench.sh     # just the native-engine suite\nOUTPUT=report.md RESULTS=results.json ./scripts/bench.sh\n<\/code><\/pre>\n<table><thead><tr><th>Variable<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>SUITES<\/code><\/td><td>all<\/td><td>Space-separated suite list (see table above)<\/td><\/tr>\n<tr><td><code>VUS<\/code><\/td><td><code>10<\/code><\/td><td>Virtual users per scenario<\/td><\/tr>\n<tr><td><code>DURATION<\/code><\/td><td><code>15s<\/code><\/td><td>Run length for <code>overhead<\/code>/<code>throughput<\/code><\/td><\/tr>\n<tr><td><code>WARMUP<\/code><\/td><td><code>1<\/code><\/td><td>hyperfine warmup runs (discarded, not shown)<\/td><\/tr>\n<tr><td><code>RUNS<\/code><\/td><td><code>5<\/code><\/td><td>hyperfine measured runs per scenario<\/td><\/tr>\n<tr><td><code>STARTUP_DURATION<\/code> / <code>STARTUP_RUNS<\/code><\/td><td><code>1s<\/code> / <code>5<\/code><\/td><td>Startup-suite run length / samples<\/td><\/tr>\n<tr><td><code>SCALING_VUS<\/code> / <code>SCALING_DURATION<\/code><\/td><td><code>10 50 200<\/code> / <code>10s<\/code><\/td><td>VU sweep points / per-point length<\/td><\/tr>\n<tr><td><code>SAT_VUS<\/code> / <code>SAT_DURATION<\/code><\/td><td><code>256<\/code> / <code>15s<\/code><\/td><td>Saturation VUs / run length<\/td><\/tr>\n<tr><td><code>YAML_DURATION<\/code> / <code>TLS_DURATION<\/code><\/td><td><code>10s<\/code> / <code>10s<\/code><\/td><td>Per-scenario length in those suites<\/td><\/tr>\n<tr><td><code>LIB_DURATION<\/code> / <code>GRPC_DURATION<\/code> / <code>GQL_DURATION<\/code><\/td><td><code>10s<\/code> each<\/td><td>Per-scenario length in the library / grpc / graphql suites<\/td><\/tr>\n<tr><td><code>WS_DURATION<\/code> / <code>WS_ROUNDS<\/code><\/td><td><code>10s<\/code> / <code>10<\/code><\/td><td>ws-suite run length / echo round-trips per connection<\/td><\/tr>\n<tr><td><code>BOUNDARY_DURATION<\/code> / <code>BOUNDARY_LADDER<\/code> / <code>BOUNDARY_ERR_PCT<\/code><\/td><td><code>30s<\/code> / <code>5000 15000 30000<\/code> / <code>1<\/code><\/td><td>boundary-suite per-rung ramp length / VU ceilings / error-rate threshold in percent<\/td><\/tr>\n<tr><td><code>BOUNDARY_MAX_VUS<\/code><\/td><td>unset<\/td><td>Single-rung override for <code>BOUNDARY_LADDER<\/code> (legacy spelling)<\/td><\/tr>\n<tr><td><code>BOUNDARY_JMETER_HEAP<\/code><\/td><td><code>-Xms512m -Xmx4g<\/code><\/td><td>JMeter heap on the high-VU boundary rungs<\/td><\/tr>\n<tr><td><code>DB_DURATION<\/code> / <code>DB_WARM_QUERIES<\/code> / <code>DB_TX_CYCLES<\/code><\/td><td><code>10s<\/code> / <code>10<\/code> / <code>5<\/code><\/td><td>db-suite per-scenario length / queries per warm iteration / tx cycles per iteration<\/td><\/tr>\n<tr><td><code>BENCH_PG_DSN<\/code><\/td><td><code>postgres://postgres:perfscale@127.0.0.1:5432/postgres<\/code><\/td><td>PostgreSQL DSN for the db suite<\/td><\/tr>\n<tr><td><code>BENCH_PG_JDBC_JAR<\/code><\/td><td>autodetected from JMeter's <code>lib/<\/code><\/td><td>PostgreSQL JDBC driver jar for the JMeter db row<\/td><\/tr>\n<tr><td><code>K6_SQL_BIN<\/code><\/td><td><code>target/xk6-sql/k6<\/code><\/td><td>Custom k6 with the xk6-sql extension for the db-suite k6 row (built by the bench workflow)<\/td><\/tr>\n<tr><td><code>PORT<\/code> / <code>TLS_PORT<\/code><\/td><td><code>18999<\/code> / <code>18998<\/code><\/td><td>Ports for the throwaway serve targets<\/td><\/tr>\n<tr><td><code>OUTPUT<\/code><\/td><td><code>bench-report.md<\/code><\/td><td>Markdown report path<\/td><\/tr>\n<tr><td><code>RESULTS<\/code><\/td><td><code>bench-results.json<\/code><\/td><td>Machine-readable results (regression tracking input)<\/td><\/tr>\n<tr><td><code>PERFSCALE_BIN<\/code><\/td><td><code>target/release/perfscale<\/code><\/td><td>Binary under test; builds it if missing<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Running on CI (canonical)<\/h2>\n<p>The <a href=\"../.github/workflows/bench.yml\"><code>bench<\/code> workflow<\/a> runs on\n<code>ubuntu-latest<\/code> — a fixed runner class, which removes local-machine variance:<\/p>\n<ul>\n<li><strong>manually<\/strong>: GitHub → Actions → <code>bench<\/code> → <em>Run workflow<\/em> (inputs: <code>vus<\/code>,\n<code>duration<\/code>, <code>runs<\/code>, <code>suites<\/code>)<\/li>\n<li><strong>weekly<\/strong>: scheduled Monday 04:00 UTC as a perf-regression drift check<\/li>\n<\/ul>\n<p>The job summary carries an Environment table (OS/CPU/threads/RAM/swap) and a\nSoftware table (perfscale/k6/locust/jmeter/java/hyperfine versions) ahead of\nthe results.\nThe <code>bench-report<\/code> artifact (kept 90 days) holds the markdown report plus\n<code>bench-results.json<\/code>.<\/p>\n<h3>Regression tracking<\/h3>\n<p>Each CI run downloads the previous successful run's <code>bench-results.json<\/code> and\nappends a delta table (<code>scripts/bench_compare.py<\/code>) to the summary: RPS,\nlatency, RSS, startup overhead, and criterion means, with changes beyond\n±15% flagged. Runners are shared hardware, so regressions <strong>warn<\/strong> rather\nthan fail the job — treat a flag as \"look here\", confirmed by re-running.<\/p>\n<h2>Reading the numbers<\/h2>\n<ul>\n<li><code>overhead<\/code>: near-1.00 relative wall time = the wrapper is free at that\nduration. Real engine differences are in <code>throughput<\/code>.<\/li>\n<li><code>throughput<\/code>: compare RPS and percentiles; <code>CPU per req<\/code> normalizes CPU\ncost by work actually done (an engine using 2× CPU while serving 10× RPS\nis <em>more<\/em> efficient, not less).<\/li>\n<li><code>startup<\/code>: <code>vs native<\/code> is the wrapper's own cost; <code>vs ideal<\/code> includes the\nengine's startup too.<\/li>\n<li>Never compare across machines or CI runs — only within one report (the\ndelta table compares across runs <em>on the same runner class<\/em>, which is as\nclose as it gets).<\/li>\n<\/ul>\n<h3>Reading <code>IO ops<\/code> (<code>in<\/code> / <code>out<\/code>)<\/h3>\n<p><code>N in / M out<\/code> is the filesystem operation count from the <code>/usr/bin/time<\/code>\npass:<\/p>\n<ul>\n<li><strong><code>in<\/code><\/strong> — read operations: blocks fetched <em>from<\/em> the filesystem (loading\nscripts/configs, paging in binaries). <code>0 in<\/code> is normal on a warm run —\neverything is already in the page cache. A cold first run shows non-zero\n<code>in<\/code> (k6 paging its binary in, for example).<\/li>\n<li><strong><code>out<\/code><\/strong> — write operations: blocks written <em>to<\/em> the filesystem (temp\nscripts, locust's <code>--csv<\/code> stats, logs).<\/li>\n<\/ul>\n<p>IO ops units differ by OS (GNU time counts fs blocks on Linux; BSD time\ncounts block operations on macOS), so the same number does <strong>not<\/strong> mean the\nsame bytes across systems — only compare within one report.<\/p>\n","html_ru":"<h1>Бенчмарки<\/h1>\n<p>perfscale поставляется с бенчмарк-скриптом на основе наборов тестов (suites),\nсравнивающим движки под идентичной нагрузкой:<\/p>\n<pre><code class=\"language-sh\">./scripts/bench.sh                       # all suites\nSUITES=\"throughput startup\" ./scripts/bench.sh\n<\/code><\/pre>\n<p>Каждый сценарий обращается к одному и тому же экземпляру <code>perfscale serve<\/code> на\nloopback, поэтому любая разница между строкой <code>perfscale (*)<\/code> и её «родным»\nаналогом — это накладные расходы обёртки perfscale, а не самого инструмента.<\/p>\n<table><thead><tr><th>Сценарий<\/th><th>Что выполняется<\/th><\/tr><\/thead><tbody>\n<tr><td><code>locust (native)<\/code><\/td><td><code>locust<\/code>, вызванный напрямую — базовый уровень<\/td><\/tr>\n<tr><td><code>k6 (native)<\/code><\/td><td><code>k6<\/code>, вызванный напрямую — базовый уровень<\/td><\/tr>\n<tr><td><code>jmeter (native)<\/code><\/td><td><code>jmeter -n -t<\/code>, вызванный напрямую — базовый уровень (только наборы overhead/startup)<\/td><\/tr>\n<tr><td><code>perfscale (k6)<\/code><\/td><td>тот же скрипт k6 через <code>perfscale run --k6<\/code><\/td><\/tr>\n<tr><td><code>perfscale (locust)<\/code><\/td><td>тот же locustfile через <code>perfscale run --locust<\/code><\/td><\/tr>\n<tr><td><code>perfscale (jmeter)<\/code><\/td><td>тот же <code>.jmx<\/code>-план через <code>perfscale run --jmeter<\/code> (только наборы overhead/startup)<\/td><\/tr>\n<tr><td><code>perfscale (yaml)<\/code><\/td><td>собственный шаговый движок perfscale (без внешних бинарников)<\/td><\/tr>\n<tr><td><code>perfscale (yaml quiet)<\/code><\/td><td>шаговый движок с <code>--quiet<\/code> — логирование каждого запроса отключено; разница с <code>perfscale (yaml)<\/code> — это стоимость логирования<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Наборы тестов (suites)<\/h2>\n<table><thead><tr><th>Набор<\/th><th>На какой вопрос отвечает<\/th><\/tr><\/thead><tbody>\n<tr><td><code>overhead<\/code><\/td><td>Добавляет ли обёртка время выполнения при фиксированной длительности? (hyperfine, статистическое усреднение)<\/td><\/tr>\n<tr><td><code>throughput<\/code><\/td><td>Сколько запросов и с какой задержкой реально обеспечивает каждый сценарий? Плюс CPU, CPU на запрос, пиковый RSS и операции ввода-вывода из того же инструментированного прогона<\/td><\/tr>\n<tr><td><code>startup<\/code><\/td><td>Сколько стоит запуск обёртки? (прогоны по 1 с, где старт не «тонет» в длительности теста)<\/td><\/tr>\n<tr><td><code>scaling<\/code><\/td><td>Как растут RPS / p95 / RSS с ростом числа VU? (стандартная развёртка: 10, 50, 200)<\/td><\/tr>\n<tr><td><code>saturation<\/code><\/td><td>Приблизительный максимум RPS на движок при большом числе VU (по умолчанию 256)<\/td><\/tr>\n<tr><td><code>yaml<\/code><\/td><td>Сколько стоит каждая возможность нативного движка? (базовый GET против <code>--quiet<\/code> против +check против POST-тела против многошаговой подстановки)<\/td><\/tr>\n<tr><td><code>ws<\/code><\/td><td>Пропускная способность WebSocket-сообщений и RTT: эхо-запросы по одному соединению к эндпоинту <code>/ws<\/code> сервера <code>serve<\/code> (<code>perfscale (yaml)<\/code>, <code>k6 (native)<\/code>, <code>perfscale (k6)<\/code> — у locust нет встроенной поддержки WebSocket, он пропускается)<\/td><\/tr>\n<tr><td><code>boundary<\/code><\/td><td>Где движок ломается? Лестница потолков VU (<code>BOUNDARY_LADDER<\/code>, по умолчанию <code>5000 15000 30000<\/code>): на каждой ступени разгон 0→потолок за <code>BOUNDARY_DURATION<\/code>; граница — уровень VU / время / RPS, при которых накопленная доля ошибок впервые достигает <code>BOUNDARY_ERR_PCT<\/code> процентов (по умолчанию 1%), либо ступень, на которой процесс умирает (OOM/краш считается границей). Пересёкший движок дальше не поднимается<\/td><\/tr>\n<tr><td><code>tls<\/code><\/td><td>«Налог» TLS: та же нагрузка против <code>perfscale serve --tls<\/code> (самоподписанный HTTPS, проверка отключена)<\/td><\/tr>\n<tr><td><code>library<\/code><\/td><td>Стоимость WASM-библиотек значений: компиляция на каждый прогон (холодный кэш) против десериализации burn-кэша против встроенной <code>@std/random<\/code><\/td><\/tr>\n<tr><td><code>grpc<\/code><\/td><td>Унарный вызов <code>std/grpc@v1<\/code> против примера <code>grpc_echo_server<\/code> из репозитория<\/td><\/tr>\n<tr><td><code>graphql<\/code><\/td><td>Запрос <code>std/graphql@v1<\/code> против примера <code>graphql_server<\/code> из репозитория<\/td><\/tr>\n<tr><td><code>db<\/code><\/td><td>SQL: холодный connect+query против тёплого постоянного пула против транзакций (<code>std/db-*@v1<\/code>, PostgreSQL + in-process SQLite), плюс тёплая форма от locust (psycopg2), JMeter (JDBC) и k6 — строка k6 использует <strong>кастомный бинарь<\/strong>, собранный с расширением <code>xk6-sql<\/code> и postgres-драйвером (в стоковом k6 SQL-модуля нет), и только она его использует<\/td><\/tr>\n<\/tbody><\/table>\n<p>JMeter участвует только в наборах hyperfine (<code>overhead<\/code>/<code>startup<\/code>): его\nконсольная сводка в non-GUI режиме не содержит перцентилей, поэтому он не\nпопадает в таблицу <code>throughput<\/code>. Парсинг его <code>.jtl<\/code>-файлов результатов для\nполных метрик пропускной способности — задача на будущее.<\/p>\n<p>Наборы выбираются через <code>SUITES=\"...\"<\/code>. Сценарии, чей движок (<code>k6<\/code>/<code>locust<\/code>/\n<code>jmeter<\/code>) отсутствует в <code>PATH<\/code>, пропускаются, а не считаются упавшими;\n<code>overhead<\/code>/<code>startup<\/code> требуют\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/sharkdp/hyperfine\">hyperfine<\/a>, остальные — нет.<\/p>\n<p>Набор <code>boundary<\/code> определяет пересечение границы по-разному для каждого\nдвижка: k6 сам прерывается через порог <code>abortOnFail<\/code> (границей считается\nстрока прогресса на пике VU), locust читается из строк Aggregated в\n<code>--csv-full-history<\/code>, jmeter — из накопленных дельт <code>summary +<\/code> (запускается с\n<code>-Jsummariser.interval=2<\/code>, heap поднимается через <code>BOUNDARY_JMETER_HEAP<\/code>), а\nнативный движок — из периодических строк <code>[stats]<\/code> — поэтому строка нативной\nграницы выполняется без <code>--quiet<\/code> и включает стоимость логирования каждого\nзапроса. Ненулевой код выхода движка без обнаруженного пересечения (OOM,\nкраш) фиксируется как граница на текущей ступени с пометкой «process died».\nСтроки для обёрнутых locust/jmeter опущены: обёртка — это просто\nпроксирование, а граница — свойство движка. <code>BOUNDARY_MAX_VUS<\/code>, если задан,\nзаменяет лестницу одной ступенью (обратносовместимый вариант). Между\nпрогонами набор проверяет цель 50 свежими соединениями и ждёт, пока на\nloopback рассосутся TIME_WAIT-сокеты предыдущего движка (на CI-раннере также\nрасширяется <code>ip_local_port_range<\/code> и включается <code>tcp_tw_reuse<\/code>) — граница\nдолжна быть границей движка, а не исчерпанных эфемерных портов машины.<\/p>\n<p>Набор <code>db<\/code> разделяет холодный путь (<code>db<\/code>, <code>db-params<\/code>: connect + один запрос\nна итерацию, соединение закрывается в конце итерации) и тёплый (<code>db-warm<\/code>:\nодин постоянный пул на итерацию, <code>DB_WARM_QUERIES<\/code> запросов, <code>db-close<\/code>;\n<code>db-warm-tx<\/code>: <code>DB_TX_CYCLES<\/code> × begin+query+commit) и добавляет in-process\nSQLite-«пол» (<code>db-sqlite<\/code>, <code>db-sqlite-warm<\/code>, сервер не нужен). Строка locust\n(<code>pipx inject locust psycopg2-binary<\/code>) и строка JMeter (PostgreSQL JDBC jar в\n<code>lib/<\/code> JMeter, переменная <code>BENCH_PG_JDBC_JAR<\/code> для другого пути) и строка k6\nповторяют тёплую форму. Строка <code>k6 (xk6-sql)<\/code> — это <strong>не стоковый k6<\/strong>: в\nнём нет SQL-модуля, поэтому bench-workflow собирает отдельный бинарь через\n<code>xk6 build<\/code> (расширение xk6-sql + postgres-драйвер, все версии зафиксированы,\nбинарь кэшируется; <code>K6_SQL_BIN<\/code>, по умолчанию <code>target/xk6-sql/k6<\/code>). Версия\nядра k6 внутри может отличаться от стоковой — сводка окружения в CI печатает\nобе. Кастомный бинарь обслуживает только эту строку; все остальные сценарии\nk6 продолжают использовать стоковый.<\/p>\n<p>Микробенчмарки горячих путей нативного движка (парсинг YAML, подстановка\n<code>${{ ... }}<\/code>, запись метрик / перцентильная сводка, захват вывода процессов\nчерез <code>RingBuf<\/code>, матчеры готовности <code>waitUntil<\/code>) находятся в\n<code>crates/perfscale-core/benches/<\/code> и запускаются командой <code>cargo bench -p perfscale-core<\/code>.<\/p>\n<h2>GPU-инференс (только локально)<\/h2>\n<p>Отдельный набор для бенчмарков <strong>LLM-инференса на GPU<\/strong> (Ollama /\nvLLM через <code>std/llm@v1<\/code>, с метриками прогона <code>gpu:<\/code> — TTFT, токены/сек,\nутилизация GPU/VRAM) находится в <a href=\"../bench/gpu/README.md\"><code>bench/gpu/<\/code><\/a>. Он\nнамеренно не входит в CI-workflow выше: на хостовых раннерах нет GPU, поэтому\nнабор выполняется на локальной машине с картой NVIDIA.<\/p>\n<h2>Методология<\/h2>\n<ul>\n<li><strong>Цель<\/strong>: экземпляр <code>perfscale serve<\/code> на loopback (<code>GET /health<\/code>; набор\n<code>ws<\/code> использует его WebSocket-эхо-эндпоинт <code>GET /ws<\/code>) — без сетевого шума,\nодна и та же цель для каждого сценария в рамках прогона. Набор <code>tls<\/code>\nдобавляет второй экземпляр <code>serve --tls<\/code>.<\/li>\n<li><strong>Сравнение по времени выполнения<\/strong> (<code>overhead<\/code>, <code>startup<\/code>): hyperfine\nповторяет каждый сценарий (<code>--runs<\/code>, с <code>--warmup<\/code>) и сообщает среднее,\nmin/max и стандартное отклонение.<\/li>\n<li><strong>Пропускная способность/задержка/ресурсы<\/strong>: один инструментированный\nпрогон на сценарий под <code>/usr/bin/time<\/code> (<code>-v<\/code> на Linux, <code>-l<\/code> на macOS), где\nзапросы, RPS и перцентили задержки парсятся из собственной сводки движка\n(текстовая сводка k6, статистика locust <code>--csv<\/code>, единые строки сводки\nperfscale). Один прогон: ориентировочно, без статистической строгости.<\/li>\n<li><strong>Осторожно с фиксированной длительностью<\/strong>: каждый сценарий выполняется\nодинаковое время, поэтому все времена выполнения набора overhead ≈ сама\nдлительность. Относительные числа около 1.00 доказывают, что обёртка ничего\nне добавляет; реальные различия между движками — в числах <em>пропускной\nспособности<\/em>.<\/li>\n<li><strong>Общий CPU<\/strong>: генератор нагрузки и <code>perfscale serve<\/code> делят одну машину.\nПотолки насыщения включают стоимость цели; если два движка выходят на\nплато при похожих RPS — подозревайте цель/CPU, а не движок.<\/li>\n<\/ul>\n<h2>Локальный запуск<\/h2>\n<pre><code class=\"language-sh\">cargo build --release\n./scripts/bench.sh                                   # all suites, 10 VUs, 15s, 5 runs\nVUS=50 DURATION=30s ./scripts/bench.sh\nSUITES=\"yaml\" YAML_DURATION=5s ./scripts/bench.sh     # just the native-engine suite\nOUTPUT=report.md RESULTS=results.json ./scripts/bench.sh\n<\/code><\/pre>\n<table><thead><tr><th>Переменная<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>SUITES<\/code><\/td><td>все<\/td><td>Список наборов через пробел (см. таблицу выше)<\/td><\/tr>\n<tr><td><code>VUS<\/code><\/td><td><code>10<\/code><\/td><td>Виртуальных пользователей на сценарий<\/td><\/tr>\n<tr><td><code>DURATION<\/code><\/td><td><code>15s<\/code><\/td><td>Длительность прогона для <code>overhead<\/code>/<code>throughput<\/code><\/td><\/tr>\n<tr><td><code>WARMUP<\/code><\/td><td><code>1<\/code><\/td><td>Разогревочные прогоны hyperfine (отбрасываются, не показываются)<\/td><\/tr>\n<tr><td><code>RUNS<\/code><\/td><td><code>5<\/code><\/td><td>Измеряемых прогонов hyperfine на сценарий<\/td><\/tr>\n<tr><td><code>STARTUP_DURATION<\/code> / <code>STARTUP_RUNS<\/code><\/td><td><code>1s<\/code> / <code>5<\/code><\/td><td>Длительность прогона / число замеров набора startup<\/td><\/tr>\n<tr><td><code>SCALING_VUS<\/code> / <code>SCALING_DURATION<\/code><\/td><td><code>10 50 200<\/code> / <code>10s<\/code><\/td><td>Точки развёртки VU / длительность на точку<\/td><\/tr>\n<tr><td><code>SAT_VUS<\/code> / <code>SAT_DURATION<\/code><\/td><td><code>256<\/code> / <code>15s<\/code><\/td><td>VU насыщения / длительность прогона<\/td><\/tr>\n<tr><td><code>YAML_DURATION<\/code> / <code>TLS_DURATION<\/code><\/td><td><code>10s<\/code> / <code>10s<\/code><\/td><td>Длительность на сценарий в этих наборах<\/td><\/tr>\n<tr><td><code>LIB_DURATION<\/code> / <code>GRPC_DURATION<\/code> / <code>GQL_DURATION<\/code><\/td><td>по <code>10s<\/code><\/td><td>Длительность на сценарий в наборах library / grpc / graphql<\/td><\/tr>\n<tr><td><code>WS_DURATION<\/code> / <code>WS_ROUNDS<\/code><\/td><td><code>10s<\/code> / <code>10<\/code><\/td><td>Длительность прогона набора ws / эхо-циклов на соединение<\/td><\/tr>\n<tr><td><code>BOUNDARY_DURATION<\/code> / <code>BOUNDARY_LADDER<\/code> / <code>BOUNDARY_ERR_PCT<\/code><\/td><td><code>30s<\/code> / <code>5000 15000 30000<\/code> / <code>1<\/code><\/td><td>длительность разгона на ступень / потолки VU / порог доли ошибок в процентах для набора boundary<\/td><\/tr>\n<tr><td><code>BOUNDARY_MAX_VUS<\/code><\/td><td>не задан<\/td><td>Замена <code>BOUNDARY_LADDER<\/code> одной ступенью (устаревшее написание)<\/td><\/tr>\n<tr><td><code>BOUNDARY_JMETER_HEAP<\/code><\/td><td><code>-Xms512m -Xmx4g<\/code><\/td><td>heap JMeter на высоких ступенях boundary<\/td><\/tr>\n<tr><td><code>DB_DURATION<\/code> / <code>DB_WARM_QUERIES<\/code> / <code>DB_TX_CYCLES<\/code><\/td><td><code>10s<\/code> / <code>10<\/code> / <code>5<\/code><\/td><td>длительность сценария db / запросов на тёплую итерацию / циклов транзакций на итерацию<\/td><\/tr>\n<tr><td><code>BENCH_PG_DSN<\/code><\/td><td><code>postgres://postgres:perfscale@127.0.0.1:5432/postgres<\/code><\/td><td>DSN PostgreSQL для набора db<\/td><\/tr>\n<tr><td><code>BENCH_PG_JDBC_JAR<\/code><\/td><td>определяется из <code>lib/<\/code> JMeter<\/td><td>jar JDBC-драйвера PostgreSQL для строки JMeter db<\/td><\/tr>\n<tr><td><code>K6_SQL_BIN<\/code><\/td><td><code>target/xk6-sql/k6<\/code><\/td><td>Кастомный k6 с расширением xk6-sql для строки k6 набора db (собирается bench-workflow)<\/td><\/tr>\n<tr><td><code>PORT<\/code> / <code>TLS_PORT<\/code><\/td><td><code>18999<\/code> / <code>18998<\/code><\/td><td>Порты для одноразовых целей serve<\/td><\/tr>\n<tr><td><code>OUTPUT<\/code><\/td><td><code>bench-report.md<\/code><\/td><td>Путь к Markdown-отчёту<\/td><\/tr>\n<tr><td><code>RESULTS<\/code><\/td><td><code>bench-results.json<\/code><\/td><td>Машиночитаемые результаты (вход для отслеживания регрессий)<\/td><\/tr>\n<tr><td><code>PERFSCALE_BIN<\/code><\/td><td><code>target/release/perfscale<\/code><\/td><td>Тестируемый бинарник; собирается при отсутствии<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Запуск в CI (канонический)<\/h2>\n<p><a href=\"../.github/workflows/bench.yml\">Workflow <code>bench<\/code><\/a> выполняется на\n<code>ubuntu-latest<\/code> — фиксированный класс раннера, что устраняет разброс между\nлокальными машинами:<\/p>\n<ul>\n<li><strong>вручную<\/strong>: GitHub → Actions → <code>bench<\/code> → <em>Run workflow<\/em> (параметры: <code>vus<\/code>,\n<code>duration<\/code>, <code>runs<\/code>, <code>suites<\/code>)<\/li>\n<li><strong>еженедельно<\/strong>: по расписанию, понедельник 04:00 UTC, как проверка дрейфа\nпроизводительности<\/li>\n<\/ul>\n<p>Сводка задачи содержит таблицу окружения (ОС/CPU/потоки/RAM/swap) и таблицу\nПО (версии perfscale/k6/locust/jmeter/java/hyperfine) перед результатами.\nАртефакт <code>bench-report<\/code> (хранится 90 дней) содержит markdown-отчёт и\n<code>bench-results.json<\/code>.<\/p>\n<h3>Отслеживание регрессий<\/h3>\n<p>Каждый CI-прогон скачивает <code>bench-results.json<\/code> предыдущего успешного прогона\nи добавляет в сводку таблицу дельт (<code>scripts/bench_compare.py<\/code>): RPS,\nзадержка, RSS, накладные расходы на запуск и средние criterion, с пометкой\nизменений свыше ±15%. Раннеры — общее оборудование, поэтому регрессии\n<strong>предупреждают<\/strong>, а не роняют задачу — воспринимайте пометку как «посмотри\nсюда», подтверждая повторным прогоном.<\/p>\n<h2>Как читать числа<\/h2>\n<ul>\n<li><code>overhead<\/code>: относительное время выполнения около 1.00 = обёртка бесплатна\nна этой длительности. Реальные различия движков — в <code>throughput<\/code>.<\/li>\n<li><code>throughput<\/code>: сравнивайте RPS и перцентили; <code>CPU per req<\/code> нормализует\nстоимость CPU по фактически выполненной работе (движок, потребляющий в 2\nраза больше CPU при в 10 раз большем RPS, <em>эффективнее<\/em>, а не меньше).<\/li>\n<li><code>startup<\/code>: <code>vs native<\/code> — собственная стоимость обёртки; <code>vs ideal<\/code> включает\nтакже старт самого движка.<\/li>\n<li>Никогда не сравнивайте между машинами или CI-прогонами — только внутри\nодного отчёта (таблица дельт сравнивает между прогонами <em>на одном классе\nраннеров<\/em>, а это наиболее близкое к корректному сравнение).<\/li>\n<\/ul>\n<h3>Как читать <code>IO ops<\/code> (<code>in<\/code> / <code>out<\/code>)<\/h3>\n<p><code>N in / M out<\/code> — это счётчик файловых операций из прогона под\n<code>/usr/bin/time<\/code>:<\/p>\n<ul>\n<li><strong><code>in<\/code><\/strong> — операции чтения: блоки, прочитанные <em>с<\/em> файловой системы\n(загрузка скриптов/конфигов, подкачка бинарников). <code>0 in<\/code> — норма для\nтёплого прогона: всё уже в страничном кэше. Холодный первый прогон\nпоказывает ненулевое <code>in<\/code> (например, k6 подкачивает свой бинарник).<\/li>\n<li><strong><code>out<\/code><\/strong> — операции записи: блоки, записанные <em>на<\/em> файловую систему\n(временные скрипты, статистика locust <code>--csv<\/code>, логи).<\/li>\n<\/ul>\n<p>Единицы IO ops различаются между ОС (GNU time считает блоки ФС на Linux; BSD\ntime считает блочные операции на macOS), поэтому одно и то же число <strong>не<\/strong>\nозначает одинаковый объём байт в разных системах — сравнивайте только внутри\nодного отчёта.<\/p>\n","slug":"benchmarks","title":"Benchmarks"},{"group":"top","html_en":"<h1>CI pipelines<\/h1>\n<p>perfscale runs headless by design, so it drops straight into a CI pipeline:\nthe run summary goes to stdout, the exit code gates the job, and\n<code>--summary-export<\/code> writes a machine-readable JSON (or a Markdown table for\nthe job summary UI) for downstream steps.<\/p>\n<h2>GitHub Actions<\/h2>\n<p>The official composite action —\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/github-action\"><strong>Perfscale/github-action<\/strong><\/a> —\ninstalls a pinned perfscale release (checksum-verified against the release's\n<code>sha256sums.txt<\/code>), runs your test, renders the metric table into the <strong>job\nsummary<\/strong>, and packs the summary + metrics into a zip artifact:<\/p>\n<pre><code class=\"language-yaml\">- uses: Perfscale/github-action@v1\n  id: loadtest\n  with:\n    file: test.yaml        # native engine; or: k6 / locust / jmeter\n    config: config.yaml\n- uses: actions/upload-artifact@v4\n  with:\n    name: perfscale-output\n    path: ${{ steps.loadtest.outputs.output-file }}\n<\/code><\/pre>\n<p>One input per engine — <code>k6<\/code>, <code>locust<\/code>, <code>jmeter<\/code>, or <code>file<\/code> (native) — maps to\nthe matching <code>perfscale run<\/code> flag. Engine binaries stay the workflow's\nresponsibility (the action installs perfscale itself): k6/locust are\none-package installs, JMeter needs Java (preinstalled on GitHub-hosted\nrunners) plus the distribution tarball — the action's README has a copy-paste\ninstall step.<\/p>\n<p>Useful outputs for gating: <code>summary-json<\/code> (requests, RPS, latency\npercentiles, error rate + engine/VUs/duration metadata) and <code>exit-code<\/code>:<\/p>\n<pre><code class=\"language-yaml\">- name: Gate on p95\n  run: |\n    p95=$(jq '.summary.p95_ms' \"${{ steps.loadtest.outputs.summary-json }}\")\n    awk \"BEGIN { exit !(${p95} &lt; 500) }\" || { echo '::error::p95 over budget'; exit 1; }\n<\/code><\/pre>\n<p><strong>Live demo:<\/strong> <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale-demo\">Perfscale/perfscale-demo<\/a>\nis a public playground repo — every push runs the native and JMeter engines\nagainst a local target and publishes the job-summary tables and artifacts, so\nyou can see the output without setting anything up.<\/p>\n<h2>GitLab CI<\/h2>\n<p>For GitLab there is a templates repo —\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/gitlab-ci\"><strong>Perfscale/gitlab-ci<\/strong><\/a> — with\nready-made <code>.gitlab-ci.yml<\/code> includes and examples for the same engines.<\/p>\n<h2>Any other CI<\/h2>\n<p>No plugin needed — install the binary and run:<\/p>\n<pre><code class=\"language-sh\">curl -fsSL https://github.com/Perfscale/perfscale/releases/latest/download/perfscale-linux-amd64 \\\n  -o perfscale &amp;&amp; chmod +x perfscale\n./perfscale run -f test.yaml -c config.yaml \\\n  --summary-export summary.json\n<\/code><\/pre>\n<p>Exit codes mirror the CLI: <code>0<\/code> — the run completed (individual failed\nrequests/checks don't change that — gate on <code>summary.json<\/code> instead), <code>1<\/code> —\nthe run could not execute, <code>2<\/code> — invalid arguments. One deliberate exception:\na <code>std/thresholds@v1<\/code> gate violated at <code>severity: fail<\/code> fails the process\nafter the summary export, so CI turns red on SLO breaches.<\/p>\n","html_ru":"<h1>CI-конвейеры<\/h1>\n<p>perfscale изначально работает в неинтерактивном (headless) режиме, поэтому\nон напрямую встраивается в CI-конвейер: сводка запуска выводится в stdout,\nкод завершения управляет исходом задания, а <code>--summary-export<\/code> записывает\nмашиночитаемый JSON (или Markdown-таблицу для интерфейса сводки задания)\nдля последующих шагов.<\/p>\n<h2>GitHub Actions<\/h2>\n<p>Официальный composite action —\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/github-action\"><strong>Perfscale/github-action<\/strong><\/a> —\nустанавливает закреплённый релиз perfscale (с проверкой контрольной суммы по\nфайлу <code>sha256sums.txt<\/code> из релиза), запускает ваш тест, выводит таблицу\nметрик в <strong>сводку задания<\/strong> (job summary) и упаковывает сводку + метрики в\nzip-артефакт:<\/p>\n<pre><code class=\"language-yaml\">- uses: Perfscale/github-action@v1\n  id: loadtest\n  with:\n    file: test.yaml        # native engine; or: k6 / locust / jmeter\n    config: config.yaml\n- uses: actions/upload-artifact@v4\n  with:\n    name: perfscale-output\n    path: ${{ steps.loadtest.outputs.output-file }}\n<\/code><\/pre>\n<p>Один входной параметр на движок — <code>k6<\/code>, <code>locust<\/code>, <code>jmeter<\/code> или <code>file<\/code>\n(нативный) — соответствует соответствующему флагу <code>perfscale run<\/code>. Установка\nбинарных файлов движков остаётся на ответственности workflow (action\nустанавливает только сам perfscale): k6 и locust ставятся одним пакетом,\nдля JMeter нужна Java (предустановлена на раннерах, размещаемых GitHub)\nплюс tar-архив дистрибутива — в README action есть готовый шаг установки,\nкоторый можно просто скопировать.<\/p>\n<p>Полезные выходные данные для проверок (gating): <code>summary-json<\/code> (запросы,\nRPS, перцентили задержки, доля ошибок + метаданные движка/VU/длительности)\nи <code>exit-code<\/code>:<\/p>\n<pre><code class=\"language-yaml\">- name: Gate on p95\n  run: |\n    p95=$(jq '.summary.p95_ms' \"${{ steps.loadtest.outputs.summary-json }}\")\n    awk \"BEGIN { exit !(${p95} &lt; 500) }\" || { echo '::error::p95 over budget'; exit 1; }\n<\/code><\/pre>\n<p><strong>Живое демо:<\/strong> <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale-demo\">Perfscale/perfscale-demo<\/a>\n— публичный репозиторий-песочница: каждый push запускает нативный движок и\nJMeter против локальной цели и публикует таблицы сводки задания и артефакты,\nтак что вы можете увидеть результат, ничего не настраивая.<\/p>\n<h2>GitLab CI<\/h2>\n<p>Для GitLab есть репозиторий с шаблонами —\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/gitlab-ci\"><strong>Perfscale/gitlab-ci<\/strong><\/a> — с\nготовыми include-файлами <code>.gitlab-ci.yml<\/code> и примерами для тех же движков.<\/p>\n<h2>Любой другой CI<\/h2>\n<p>Плагин не нужен — установите бинарный файл и запустите:<\/p>\n<pre><code class=\"language-sh\">curl -fsSL https://github.com/Perfscale/perfscale/releases/latest/download/perfscale-linux-amd64 \\\n  -o perfscale &amp;&amp; chmod +x perfscale\n./perfscale run -f test.yaml -c config.yaml \\\n  --summary-export summary.json\n<\/code><\/pre>\n<p>Коды завершения повторяют коды CLI: <code>0<\/code> — запуск выполнен (отдельные\nнеудачные запросы/проверки на это не влияют — для gating используйте\n<code>summary.json<\/code>), <code>1<\/code> — запуск не удалось выполнить, <code>2<\/code> — неверные\nаргументы. Одно сознательное исключение: нарушение порога\n<code>std/thresholds@v1<\/code> с <code>severity: fail<\/code> завершает процесс с ошибкой после\nэкспорта сводки, поэтому CI «краснеет» при нарушении SLO.<\/p>\n","slug":"ci","title":"CI pipelines"},{"group":"cli","html_en":"<h1>CLI commands<\/h1>\n<pre><code class=\"language-text\">perfscale run          Run a load test with k6, locust, JMeter, or the native step engine\nperfscale serve        Start a local dev server that receives metrics from `run --report`\nperfscale lint         Validate test/config YAML files without running them\nperfscale install      Fetch remote libraries and pin them in perfscale.lock\nperfscale burn         Build a standalone binary with WASM libraries embedded\nperfscale schema       Print the JSON Schema for test or config YAML files\nperfscale metrics      List every metric the registered families declare\nperfscale man          Print the bundled man page (or install it for `man perfscale`)\nperfscale self-update  Update perfscale to the latest release for this platform\nperfscale cache        Manage the local import/library cache (~/.cache/perfscale)\n<\/code><\/pre>\n<h2><code>perfscale run<\/code><\/h2>\n<p>Exactly one engine flag is required: <code>--k6<\/code>, <code>--locust<\/code>, <code>--jmeter<\/code>, or <code>-f<\/code>.<\/p>\n<table><thead><tr><th>Flag<\/th><th>Value<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>--k6 &lt;FILE&gt;<\/code><\/td><td><code>.js<\/code> script<\/td><td>Run via the <code>k6<\/code> binary on <code>PATH<\/code><\/td><\/tr>\n<tr><td><code>--locust &lt;FILE&gt;<\/code><\/td><td>locustfile<\/td><td>Run via the <code>locust<\/code> binary on <code>PATH<\/code>, headless<\/td><\/tr>\n<tr><td><code>--jmeter &lt;FILE&gt;<\/code><\/td><td><code>.jmx<\/code> test plan<\/td><td>Run via the <code>jmeter<\/code> binary on <code>PATH<\/code>, non-GUI (<code>jmeter -n -t<\/code>). The plan owns the load shape — no perfscale config applies<\/td><\/tr>\n<tr><td><code>-f, --file &lt;FILE&gt;<\/code><\/td><td><code>test.yaml<\/code><\/td><td>Run with the built-in native engine (requires <code>-c<\/code>)<\/td><\/tr>\n<tr><td><code>-c, --config &lt;FILE&gt;<\/code><\/td><td><code>config.yaml<\/code><\/td><td>Load config: <code>vus<\/code>, <code>duration<\/code>, optional <code>report.url<\/code>. Required with <code>-f<\/code>, optional load hint for <code>--locust<\/code>, ignored by <code>--k6<\/code> and <code>--jmeter<\/code><\/td><\/tr>\n<tr><td><code>--host &lt;URL&gt;<\/code><\/td><td>base URL<\/td><td>Target host for <code>--locust<\/code> (locust's <code>--host<\/code>)<\/td><\/tr>\n<tr><td><code>--report &lt;URL&gt;<\/code><\/td><td>base URL<\/td><td>POST the summary to a <code>perfscale serve<\/code> instance after the run; overrides <code>report.url<\/code> from the config file<\/td><\/tr>\n<tr><td><code>-q, --quiet<\/code><\/td><td>—<\/td><td>Suppress per-request output; errors and the final metric summary still print. The native engine drops the lines at the source, which also removes their formatting/IO cost under high load<\/td><\/tr>\n<tr><td><code>--summary-export &lt;FILE&gt;<\/code><\/td><td>path, repeatable<\/td><td>After the run, write the parsed metric summary (requests, RPS, latency percentiles, error rate) plus run metadata (engine, VUs, duration, timestamp, perfscale version) to this file. Repeat the flag to write several exports from one run. A <code>.md<\/code>/<code>.json<\/code> extension picks the format per file (default JSON)<\/td><\/tr>\n<tr><td><code>--summary-format &lt;json|md&gt;<\/code><\/td><td>with <code>--summary-export<\/code><\/td><td>Format for export files without a recognized extension. <code>md<\/code> renders a table for CI job summaries: <code>--summary-export \"$GITHUB_STEP_SUMMARY\" --summary-format md<\/code><\/td><\/tr>\n<tr><td><code>--allow-remote-import<\/code><\/td><td>—<\/td><td>Let <code>import:<\/code> in <code>-f<\/code>/<code>-c<\/code> documents fetch over the network (http(s) URLs, git remotes). Fail-closed by default — a document cannot grant itself network access. See <a href=\"#/docs/core/imports\">imports<\/a><\/td><\/tr>\n<tr><td><code>--refresh-imports<\/code><\/td><td>—<\/td><td>Refetch cached tag/branch git imports instead of trusting the cache (commit-SHA imports are immutable and never refetch)<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Exit code semantics<\/h3>\n<ul>\n<li><code>0<\/code> — the run completed, <strong>even if requests or checks failed<\/strong>. Failed\nchecks are load-test feedback (visible in <code>http_req_failed<\/code> and stderr),\nnot a CLI error — mirroring k6's default behaviour without thresholds. This\nalso covers engines that exit non-zero on failed <em>requests<\/em> (k6 with\nthresholds, locust) as long as they produced a results summary.<\/li>\n<li><code>1<\/code> — the run could not execute: missing file, invalid YAML, engine binary\nnot found, or the engine crashed before producing any results (non-zero\nexit with zero metrics — a script error or broken install, not test\nfeedback): <code>error: engine exited with code 1 before producing any results<\/code>.\nAlso: a native run whose <a href=\"#/docs/core/actions\"><code>std/thresholds@v1<\/code><\/a>\ngate evaluated to <code>fail<\/code> (<code>error: thresholds failed: …<\/code>) — gates are how CI\nturns SLO violations into a failing build, like k6 thresholds.<\/li>\n<li><code>2<\/code> — invalid command-line arguments.<\/li>\n<\/ul>\n<h3>Output streams<\/h3>\n<ul>\n<li><strong>stdout<\/strong> — engine output and the final metric summary (machine-friendly)<\/li>\n<li><strong>stderr<\/strong> — errors, failed checks, and <code>[system]<\/code> progress markers. Runs\nexecuted through the machine agent end with a final\n<code>[sys] __perfscale_exit__=&lt;code&gt;<\/code> marker carrying the engine's exit code —\nsee <a href=\"#/docs/core/runners\">Runners → exit marker<\/a><\/li>\n<\/ul>\n<h3>Summary export<\/h3>\n<p><code>--summary-export<\/code> writes a self-describing result file after the run:<\/p>\n<pre><code class=\"language-json\">{\n  \"meta\": {\n    \"perfscale_version\": \"0.2.0\",\n    \"engine\": \"native\",\n    \"vus\": 10,\n    \"duration\": \"30s\",\n    \"timestamp\": \"2026-07-08T11:11:17Z\"\n  },\n  \"summary\": {\n    \"avg_ms\": 0.09, \"med_ms\": 0.08, \"p90_ms\": 0.15, \"p95_ms\": 0.17,\n    \"p99_ms\": 0.27, \"min_ms\": 0.02, \"max_ms\": 2.86,\n    \"error_rate\": 0.0, \"total_requests\": 20872, \"requests_per_sec\": 20866.54\n  }\n}\n<\/code><\/pre>\n<p><code>vus<\/code>/<code>duration<\/code> are <code>null<\/code> for <code>--k6<\/code> and <code>--jmeter<\/code> runs (the load shape\nlives in the script/plan). The same holds for native runs with a <code>stages:<\/code>/<code>arrival:<\/code> profile —\nthere is no fixed VU count, so <code>vus<\/code> is <code>null<\/code> and <code>duration<\/code> is the summed\nstage length (e.g. <code>\"90s\"<\/code>); the summary's <code>vus<\/code> line reports the observed\nmin/max concurrency instead. <code>summary<\/code> is <code>null<\/code> when the run produced no\nHTTP metrics. When the\nconfig had a <a href=\"#/docs/core/actions\"><code>std/thresholds@v1<\/code><\/a> gate,\nthe export gains a <code>thresholds<\/code> field with the gate result:<\/p>\n<pre><code class=\"language-json\">{\n  \"thresholds\": {\n    \"status\": \"fail\",\n    \"message\": \"db_query_failed rate=1 ≥ 0.05; checkout SLO\",\n    \"violations\": [{ \"metric\": \"db_query_failed\", \"expr\": \"rate&lt;0.05\", \"actual\": 1.0 }]\n  }\n}\n<\/code><\/pre>\n<p><code>status<\/code> is <code>pass<\/code> when every expression held, else the gate's <code>severity<\/code>\n(<code>fail<\/code>/<code>warn<\/code>/<code>info<\/code>). A <code>fail<\/code> status also makes <code>perfscale run<\/code> exit\nnon-zero, so CI fails on the gate itself. With\n<code>--summary-format md<\/code> the same data renders as a Markdown table — pointed at\n<code>$GITHUB_STEP_SUMMARY<\/code>, it lands directly in the GitHub Actions job summary.\nA failed export write is a CLI error (exit 1) even though the run itself\ncompleted — CI should not silently continue without the artifact it asked\nfor.<\/p>\n<h3>Engine availability errors<\/h3>\n<pre><code class=\"language-text\">error: k6 not found in PATH — install from https://k6.io/docs/get-started/installation/\nerror: locust not found in PATH — install with `pip install locust` (...)\nerror: jmeter not found in PATH — install from https://jmeter.apache.org/download_jmeter.cgi (...)\n<\/code><\/pre>\n<p>JMeter runs emit no latency percentiles: after the run, jmeter's final\nconsole <code>summary =<\/code> line is translated into the k6-compatible summary block\nwith <code>avg<\/code>/<code>min<\/code>/<code>max<\/code> only. There is no <code>std/thresholds@v1<\/code> integration for\n<code>--jmeter<\/code> — the jmeter process exit code is the gate.<\/p>\n<h2><code>perfscale serve<\/code><\/h2>\n<table><thead><tr><th>Flag<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>--port &lt;PORT&gt;<\/code><\/td><td><code>7999<\/code><\/td><td>Port to listen on; <code>0<\/code> picks a free port (printed at startup)<\/td><\/tr>\n<tr><td><code>--tls<\/code><\/td><td>off<\/td><td>Serve HTTPS with a self-signed certificate generated at startup — a local TLS target for load tests. Clients must skip verification (<code>insecure: true<\/code> in <code>std/http@v1<\/code>, k6's <code>insecureSkipTLSVerify<\/code>, locust's <code>verify=False<\/code>)<\/td><\/tr>\n<tr><td><code>--no-ui<\/code><\/td><td>off<\/td><td>Do not serve the built-in dashboard on <code>/<\/code>; the ingest API keeps working<\/td><\/tr>\n<\/tbody><\/table>\n<p>Endpoints:<\/p>\n<table><thead><tr><th>Method<\/th><th>Path<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>GET<\/code><\/td><td><code>/<\/code><\/td><td>Built-in dashboard (absent with <code>--no-ui<\/code>): live time-series of during-run snapshots plus the last run summaries. Self-contained — no CDN; polls <code>/api/v1/state<\/code><\/td><\/tr>\n<tr><td><code>GET<\/code><\/td><td><code>/health<\/code><\/td><td>Returns <code>ok<\/code><\/td><\/tr>\n<tr><td><code>POST<\/code><\/td><td><code>/api/v1/metrics<\/code><\/td><td>Accepts the end-of-run summary <code>{\"lines\": [\"...\", ...]}<\/code> or a during-run snapshot <code>{\"samples\": [...], \"seq\": N}<\/code> (<code>report.during_run<\/code>), prints it, and keeps it in memory for the dashboard<\/td><\/tr>\n<tr><td><code>GET<\/code><\/td><td><code>/api/v1/state<\/code><\/td><td>Recent snapshot batches and the last run summaries as JSON — what the dashboard polls. Kept in memory only: the last 2000 snapshot batches and 20 summaries<\/td><\/tr>\n<tr><td><code>GET<\/code><\/td><td><code>/ws<\/code><\/td><td>WebSocket echo — every text (and binary) message is echoed back verbatim. A loopback target for WebSocket load tests and the <code>ws<\/code> benchmark suite<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Dashboard<\/h3>\n<p>The dashboard is on by default — start <code>perfscale serve<\/code> and open\n<code>http://localhost:7999/<\/code> (there is no <code>--ui<\/code> flag; the page is served unless\n<code>--no-ui<\/code> is passed):<\/p>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABaAAAAOECAIAAADYLwGFAAAQAElEQVR4nOzdB0AT1x8H8APC3nsjGwFFRMG9995atc62dvnvtK3W2tplra1d2rrr3nsv3FsRFZG9994QIIP/LzlNUwIhCFpCvp9//vbycrkcyb177/3eu3ecmpoaBgAAAAAAAABAmakzAAAAAAAAAABKDgEOAAAAAAAAAFB6CHAAAAAAAAAAgNJDgAMAAAAAAAAAlB4CHAAAAAAAAACg9BDgAAAAAAAAAAClhwAHAAAAAAAAACg9BDgAAAAAAAAAQOkhwAEAAAAAAAAASg8BDgAAAAAAAABQeghwAAAAAAAAAIDSQ4ADAAAAAAAAAJQeAhwAAAAAAAAAoPQQ4AAAAAAAAAAApYcABwAAAAAAAAAoPQQ4AAAAAAAAAEDpIcABAAAAAAAAAEoPAQ4AAAAAAAAAUHoIcAAAAAAAAACA0kOAAwAAAAAAAACUHgIcAAAAAAAAAKD0EOAAAAAAAAAAAKWHAAcAAAAAAAAAKD0OAwAAAAAAwDBcbhWPz+fx+PSvUFjDAChAXV2Nw+FoaXI0ORq6ujoMwH9HraYGZy4AAAAAAJUmFAoLiko0qKmqpsbR0OBwaBFjvUEhdPDw+QK+QFAjZOj/ZqZGdBgxAP8FBDgAAAAAAFRaZWV1YXGJoYE+dcIzAE1QzeOVlFZQjENHW4sBeOkQ4AAAAAAAUF3cyqrycq6RoT4D0EyKS8sN9XV1dLQVXF9YU1NWVvF810apq6tpcjiamhxDAz01jBxReQhwAAAAAACoKKFQmJ1bYG5qzAA0q7yCYltrc0UiDhXcyuLiMkNDfQ5Hg0IVGhqNuzZKIBBSWISUlFaYGBvoYRIQ1YYABwAAAACAisrLL6Ju9jqvTKF2ppqaOn AAAM0j4AAAAAAAAJpHwAEAAAAAADSPgAMAAAAAAGgeAQcAAAAAANA8Ag4AAAAAAKB5BBwAAAAAAEDzCDgAAAAAAIDmEXAAAAAAAADNI+AAAAAAAACaR8ABAAAAAAA0j4ADAAAAAABoHgEHAAAAAADQPAIOAAAAAACgeQQcAAAAAABA8wg4AAAAAACA5hFwAAAAAAAAzSPgAAAAAAAAmkfAAQAAAAAANI+AAwAAAAAAaB4BBwAAAAAA0DwCDgAAAAAAoHkEHAAAAAAAQPMIOAAAAAAAgOYRcAAAAAAAAM0j4AAAAAAAAJpHwAEAAAAAADSPgAMAAAAAAGgeAQcAAAAAANA8Ag4AAAAAAKB5BBwAAAAAAEDzCDgAAAAAAIDmEXAAAAAAAADNI+AAAAAAAACaR8ABAAAAAAA0j4ADAAAAAABoHgEHAAAAAADQPAIOAAAAAACgeQQcAAAAAABA8wg4AAAAAACA5hFwAAAAAAAAzSPgAAAAAAAAmkfAAQAAAAAANI+AAwAAAAAAaB4BBwAAAAAA0DwCDgAAAAAAoHkEHAAAAAAAQPMIOAAAAAAAgOYRcAAAAAAAAM0j4AAAAAAAAJpHwAEAAAAAADSPgAMAAAAAAGgeAQcAAAAAANA8Ag4AAAAAAKB5BBwAAAAAAEDzCDgAAAAAAIDmEXAAAAAAAADNI+AAAAAAAACaR8ABAAAAAAA0j4ADAAAAAABoHgEHAAAAAADQPAIOAAAAAACgeQQcAAAAAABA8wg4AAAAAACA5hFwAAAAAAAAzSPgAAAAAAAAmkfAAQAAAAAANI+AAwAAAAAAaB4BBwAAAAAA0DwCDgAAAAAAoHkEHAAAAAAAQPMIOAAAAAAAgOYRcAAAAAAAAM0j4AAAAAAAAJpHwAEAAAAAADSPgAMAAAAAAGgeAQcAAAAAANA8Ag4AAAAAAKB5BBwAAAAAAEDzCDgAAAAAAIDmEXAAAAAAAADNI+AAAAAAAACaR8ABAAAAAAA0j4ADAAAAAABoHgEHAAAAAADQPAIOAAAAAACgeQQcAAAAAABA8wg4AAAAAACA5hFwAAAAAAAAzSPgAAAAAAAAmkfAAQAAAAAANI+AAwAAAAAAaN7/AAAA//9m13jzAAAABklEQVQDAGUXKyt5P92DAAAAAElFTkSuQmCC\" alt=\"perfscale serve dashboard: live metric cards with sparklines above the last run summary\" /><\/p>\n<p>Every series from <code>report.during_run<\/code> snapshots becomes a card with the latest\nvalue and a sparkline; finished runs stack up as summary blocks below. A\nsortable, filterable table lists all series, and metric cards/rows link into\nthe relevant embedded docs pages. The page polls <code>GET /api/v1/state<\/code> every 2\nseconds and has a dark/light theme toggle (defaults to the OS preference).<\/p>\n<p>The page is a single self-contained HTML file — no CDN. Its sources are a\nReact + TypeScript + Tailwind + shadcn/ui app in <code>crates/perfscale-cli/ui/<\/code>,\nbuilt with Vite into the committed <code>src/commands/serve_ui.html<\/code> that the CLI\nembeds via <code>include_str!<\/code>, so the Rust build itself needs no Node. To change\nthe dashboard: edit the app, run <code>pnpm install &amp;&amp; pnpm build<\/code> in\n<code>crates/perfscale-cli/ui/<\/code>, and commit the regenerated <code>serve_ui.html<\/code> — CI\nverifies it is fresh (<code>pnpm check-built<\/code>).<\/p>\n<p>The same page also embeds this documentation: the <strong>Docs<\/strong> tab renders all\nmarkdown from <code>docs/<\/code> (English and Russian, EN/RU switcher, defaults to the\nbrowser language) fully offline. The embedded copy is generated from the docs\nat build time; contributors regenerate it with\n<code>PERFSCALE_UPDATE_DOCS=1 cargo test -p perfscale-cli serve_docs<\/code> after editing\nthe markdown.<\/p>\n<pre><code class=\"language-bash\"># terminal 1 — the dashboard is served on /\nperfscale serve\n\n# terminal 2 — live series need report.during_run: true in the config\nperfscale run -f test.yaml -c config.yaml --report http://127.0.0.1:7999\n<\/code><\/pre>\n<p>This is a development stand-in, not a control-plane: no persistence, no auth,\nno aggregation across runs. Anything that speaks these endpoints can replace\nit.<\/p>\n<h2>Benchmarking<\/h2>\n<p>perfscale doesn't ship a <code>bench<\/code> subcommand — engine comparisons run through\n<a href=\"../../scripts/bench.sh\"><code>scripts/bench.sh<\/code><\/a>, a <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/sharkdp/hyperfine\">hyperfine<\/a>-based\nscript. See <a href=\"#/docs/benchmarks\">Benchmarks<\/a> for methodology and usage.<\/p>\n<h2><code>perfscale lint<\/code><\/h2>\n<p>Validate YAML files against the same schemas <code>run<\/code> uses — plus checks a\nschema can't express — without executing anything. Made for editors, CI\ngates, and pre-commit hooks.<\/p>\n<pre><code class=\"language-sh\">perfscale lint test.yaml config.yaml\nperfscale lint --schema config load.yaml\n<\/code><\/pre>\n<table><thead><tr><th>Flag<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>FILE...<\/code><\/td><td>required<\/td><td>One or more YAML files<\/td><\/tr>\n<tr><td><code>--schema &lt;auto|test|config&gt;<\/code><\/td><td><code>auto<\/code><\/td><td><code>auto<\/code> detects per file: a top-level <code>steps:<\/code> key means test definition, anything else is a config<\/td><\/tr>\n<tr><td><code>--offline<\/code><\/td><td>off<\/td><td>Skip the network pass (GraphQL introspection) — validate offline only<\/td><\/tr>\n<tr><td><code>--allow-remote-import<\/code><\/td><td>off<\/td><td>Let <code>import:<\/code> in the linted documents fetch over the network so the merged result can be validated<\/td><\/tr>\n<tr><td><code>--refresh-imports<\/code><\/td><td>off<\/td><td>Refetch cached tag/branch git imports instead of trusting the cache<\/td><\/tr>\n<\/tbody><\/table>\n<p>What it checks:<\/p>\n<ol start=\"0\">\n<li><strong>Imports<\/strong> — documents with an <code>import:<\/code> key are resolved and merged\nfirst, so validation sees what would actually run. Resolution problems\n(missing base, cycle, remote import without <code>--allow-remote-import<\/code>)\nare reported as findings at <code>/import<\/code><\/li>\n<li><strong>YAML syntax<\/strong> — parse errors with an indentation/quoting hint<\/li>\n<li><strong>JSON Schema<\/strong> — required fields, types (same validation <code>run<\/code> performs)<\/li>\n<li><strong>Unknown/typo'd fields<\/strong> — with did-you-mean suggestions (<code>chek<\/code> → <code>check<\/code>),\nat every level: step fields, per-action <code>with:<\/code> parameters, <code>check:<\/code> keys,\nconfig fields, <code>report:<\/code> fields<\/li>\n<li><strong>Unknown action IDs<\/strong> — <code>std/htp@v1<\/code> → <code>did you mean 'std/http@v1'?<\/code><\/li>\n<li><strong>GraphQL documents<\/strong> — <code>std/graphql@v1<\/code> queries are parsed (syntax errors\npoint at <code>/steps/N/with/query<\/code>) and, when the endpoint is reachable,\nvalidated against its introspected schema. <code>schema_file<\/code> steps validate\nagainst the local SDL instead, and unreachable endpoints produce an\nadvisory note, never a failure. <code>--offline<\/code> skips the network pass<\/li>\n<\/ol>\n<p>Every finding shows <em>where<\/em> (<code>/steps/0/with<\/code>), <em>what<\/em>, and <em>what to use\ninstead<\/em>, and the output ends with a link to the\n<a href=\"#/docs/yaml-reference\">YAML reference<\/a>.<\/p>\n<p>Exit code: <code>0<\/code> when every file is valid, <code>1<\/code> otherwise — safe to use as a CI\ngate:<\/p>\n<pre><code class=\"language-yaml\">- run: perfscale lint tests/*.yaml\n<\/code><\/pre>\n<h2><code>perfscale install<\/code><\/h2>\n<p>Fetch remote value-generator libraries (RFC 005) declared in\n<code>libraries:<\/code> and pin them for offline runs.<\/p>\n<pre><code class=\"language-sh\">perfscale install test.yaml config.yaml\nperfscale install test.yaml --refresh   # re-resolve git refs\n<\/code><\/pre>\n<p>Every <code>use:<\/code> that is an <code>https://…<\/code> URL or a\n<code>git+&lt;repo&gt;@&lt;ref&gt;#&lt;path&gt;<\/code> ref is fetched once — including declarations\nfound through <code>import:<\/code> chains — digest-verified against its <code>sha256:<\/code> pin\n(declared pins only; see below), stored in the\ncontent-addressed cache (<code>&lt;cache&gt;/libraries/&lt;sha256&gt;.wasm<\/code>), and recorded\nin a TOML <code>perfscale.lock<\/code> next to the declaring file (git refs pinned to\nthe resolved commit). Commit the lockfile: <code>run<\/code> and <code>lint<\/code> resolve remote\nlibraries through lock + cache <strong>fully offline<\/strong>, and a missing pin or\ncache artifact is a hard error that says to run <code>perfscale install<\/code>.<\/p>\n<p><code>sha256:<\/code> is optional for <code>https://…<\/code> sources (mirroring the perfscaled\nagent): without it, the fetched artifact's digest is computed, pinned in\nthe lockfile, and printed with a warning advising you to add the pin to\nthe YAML. With a pin, a mismatch is a hard error that names both digests.<\/p>\n<p>Exit code: <code>0<\/code> when every remote library is installed (or already pinned),\n<code>1<\/code> on fetch/verification errors (a sha256 mismatch names both digests).<\/p>\n<p><code>install<\/code> also <em>burns<\/em> every WASM library — remote and local — into the AOT\ncache (<code>&lt;cache&gt;/libraries/&lt;sha256&gt;.cwasm<\/code>), so <code>run<\/code>/<code>lint<\/code> deserialize a\nprecompiled artifact instead of compiling per run. The burn is advisory: a\nlibrary that fails to precompile downgrades to a warning and compiles at\nrun time instead.<\/p>\n<h2><code>perfscale burn<\/code><\/h2>\n<p>Build a standalone binary with the documents' WASM libraries embedded:<\/p>\n<pre><code class=\"language-sh\">perfscale burn -f test.yaml -c config.yaml -o ./perfscale+libs\n<\/code><\/pre>\n<table><thead><tr><th>Flag<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>-f, --file &lt;FILE&gt;<\/code><\/td><td>required, repeatable<\/td><td>Test YAML document(s) whose <code>libraries:<\/code> should be embedded<\/td><\/tr>\n<tr><td><code>-c, --config &lt;FILE&gt;<\/code><\/td><td>—<\/td><td>Optional config YAML whose <code>libraries:<\/code> should also be embedded<\/td><\/tr>\n<tr><td><code>-o, --output &lt;FILE&gt;<\/code><\/td><td>required<\/td><td>Output path of the derived binary<\/td><\/tr>\n<\/tbody><\/table>\n<p>The output is a byte-copy of the running perfscale binary plus the\nAOT-precompiled (<code>.cwasm<\/code>) artifacts of every declared WASM library,\nappended behind a <code>PFSEMBED<\/code> trailer. The derived binary resolves those\nlibraries from itself — no <code>.wasm<\/code> files, cache, or <code>perfscale.lock<\/code> needed\non the machine it runs on — which makes it the one-file distribution for\nload generators and containers (see\n<a href=\"#/docs/core/docker\">Running perfscale in Docker<\/a>).<\/p>\n<p>Remote refs must be installed first (<code>perfscale install<\/code>) — <code>burn<\/code> resolves\nthem through lock + cache offline, like <code>run<\/code>. <code>@std<\/code> built-ins are native\ncode and are skipped automatically. Burn artifacts are tied to the build\nthat produced them (wasmtime version, target triple, engine configuration):\nre-run <code>perfscale burn<\/code> after upgrading perfscale. Burn removes per-run\ncompilation, not per-call overhead — library call cost is unchanged.<\/p>\n<p>Exit code: <code>0<\/code> on success, <code>1<\/code> when a document fails to load, no WASM\nlibraries are declared, or a library does not compile as a component.<\/p>\n<h2><code>perfscale schema<\/code><\/h2>\n<p>Print the JSON Schema perfscale validates YAML files against — the exact\nschemas <code>lint<\/code> and <code>run<\/code> use, as pretty JSON on stdout.<\/p>\n<pre><code class=\"language-sh\">perfscale schema test     # schema for test definitions (steps)\nperfscale schema config   # schema for run configs\n<\/code><\/pre>\n<p>Made for anything that authors perfscale YAML programmatically:<\/p>\n<ul>\n<li><strong>Editor autocomplete<\/strong> — point your YAML language server at the output<\/li>\n<li><strong>Agent tooling<\/strong> — the <a href=\"#/docs/mcp\">perfscale MCP server<\/a> calls this to give\nmodels the authoring contract<\/li>\n<\/ul>\n<p>Exit code: <code>0<\/code> on success.<\/p>\n<h2><code>perfscale metrics<\/code><\/h2>\n<p>Print the metric catalog: every metric the registered families declare, as a\ntable of family, name, kind (<code>counter<\/code>/<code>gauge<\/code>/<code>histogram<\/code>/<code>rate<\/code>), unit, and\ndescription. The built-in <code>http<\/code> and <code>llm<\/code> families are always present;\nbuilds with pro modules list their families too. See\n<a href=\"#/docs/core/metrics\">Metrics<\/a>.<\/p>\n<pre><code class=\"language-sh\">perfscale metrics\n<\/code><\/pre>\n<p>Exit code: <code>0<\/code> on success.<\/p>\n<h2><code>perfscale man<\/code><\/h2>\n<p>Prints the bundled man page — the full CLI reference, embedded into the\nbinary at build time. This is the path for <strong>Windows<\/strong>, which has no\n<code>man(1)<\/code>:<\/p>\n<pre><code class=\"language-sh\">perfscale man          # plain-text manual on stdout\nperfscale man --raw    # the roff source instead\n<\/code><\/pre>\n<p>On Unix, install the page once so <code>man perfscale<\/code> works:<\/p>\n<pre><code class=\"language-sh\">perfscale man --install                                # → ~/.local/share/man/man1\nperfscale man --install --dir /usr/local/share/man/man1  # system-wide\n<\/code><\/pre>\n<p><code>--install<\/code> writes <code>perfscale.1<\/code> into the chosen directory and refreshes the\nman index when <code>mandb<\/code> is available. If <code>man perfscale<\/code> can't find the page\nafterwards, add the parent directory to <code>MANPATH<\/code>:<\/p>\n<pre><code class=\"language-sh\">export MANPATH=\"$HOME/.local/share/man:$MANPATH\"\n<\/code><\/pre>\n<p>A global npm install (<code>npm install -g @perfscale/exe<\/code>) links the man page\nautomatically — npm's <code>man<\/code> field puts it under\n<code>&lt;prefix&gt;/share/man/man1<\/code>.<\/p>\n<p>Exit code: <code>0<\/code> on success, <code>1<\/code> when <code>--install<\/code> can't write the directory.<\/p>\n<h2><code>perfscale self-update<\/code><\/h2>\n<p>Replaces the running binary with the latest\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/releases\">GitHub release<\/a> for this\nplatform. The download's sha256 is verified against the release's\n<code>sha256sums.txt<\/code> before the swap, and the swap itself is atomic (staged next\nto the executable, then renamed) — a failed update never leaves a broken\nbinary behind.<\/p>\n<pre><code class=\"language-sh\">perfscale self-update                       # update to the latest release (asks first)\nperfscale self-update --check               # only check; exit 10 = update available\nperfscale self-update --force               # reinstall even if already up to date\nperfscale self-update --non-interactive     # no confirmation prompt (scripts, CI)\n<\/code><\/pre>\n<p>Before downloading anything, the command asks on the terminal:<\/p>\n<pre><code class=\"language-text\">Update perfscale 0.24.0 → 0.25.0? [Y/n]\n<\/code><\/pre>\n<p>Enter (empty answer) or <code>y<\/code>/<code>yes<\/code> proceeds; <code>n<\/code>/<code>no<\/code> cancels with exit code\n0 (a declined update is not an error). The prompt goes to <strong>stderr<\/strong>, so\nstdout stays machine-parseable. When stdin is not a TTY (CI, pipes) and\n<code>--non-interactive<\/code> is not passed, the command fails with a hint instead of\nhanging on a prompt nobody can answer. <code>--check<\/code> never asks anything.<\/p>\n<p>Downloads are built for slow links: no total time budget (a 44 MiB asset on\na slow connection legitimately takes minutes), a 60 s per-read stall limit\ninstead, up to 3 attempts with backoff on dropped connections, and a live\n<code>x.x/43.9 MiB<\/code> progress line on a terminal. Mid-download failures say what\nhappened (\"connection dropped mid-download\") instead of reqwest's raw\n\"error decoding response body\".<\/p>\n<table><thead><tr><th>Flag<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>--check<\/code><\/td><td>Report whether an update exists without installing. Exit codes: <code>0<\/code> up to date, <code>10<\/code> update available — scriptable in cron/CI<\/td><\/tr>\n<tr><td><code>--force<\/code><\/td><td>Reinstall the latest release even when versions match<\/td><\/tr>\n<tr><td><code>--non-interactive<\/code><\/td><td>Skip the confirmation prompt — for scripts and CI<\/td><\/tr>\n<\/tbody><\/table>\n<h3>npm installs<\/h3>\n<p>When perfscale was installed with <code>npm install -g @perfscale/exe<\/code>, the binary\nbelongs to npm — swapping it in place would leave npm's package metadata\nclaiming the old version. <code>self-update<\/
