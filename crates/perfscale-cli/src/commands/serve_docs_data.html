)<\/td><\/tr>\n<tr><td><code>wait_for<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ exists | equals: &lt;json&gt; | length_gte: &lt;int&gt;, timeout_ms }<\/code> — блокироваться, пока условие не выполнится; ровно один ключ условия, <code>timeout_ms<\/code> по умолчанию <code>5000<\/code><\/td><\/tr>\n<tr><td><code>extract<\/code><\/td><td>object<\/td><td>—<\/td><td><code>{ key: dotted-path }<\/code> — извлечь поля из значения; тот же синтаксис <code>$.a.b[0]<\/code>, что в extract у <a href=\"#stdllmv1\"><code>std/llm@v1<\/code><\/a><\/td><\/tr>\n<\/tbody><\/table>\n<p><code>wait_for<\/code> опрашивает условие с небольшой асинхронной паузой (без активного\nожидания). По таймауту шаг <strong>завершается ошибкой<\/strong> (строка <code>[err]<\/code>, тот же\nконтракт, что у subscribe в <code>std/pubsub@v1<\/code>) и сообщает последнее наблюдавшееся\nзначение — медленный производитель это провал проверки, а не молчаливый <code>null<\/code>.<\/p>\n<p><strong>Результат:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"driver\": \"memory\", \"name\": \"pending_orders\", \"op\": \"pop\",\n  \"value\": {\"id\": \"ord-1\"}, \"duration_ms\": 0.05 }\n<\/code><\/pre>\n<p>С <code>extract<\/code> каждый извлечённый ключ добавляется на верхний уровень вместо\n<code>value<\/code> (неразрешимые пути превращаются в <code>null<\/code>). Ожидание <code>wait_for<\/code>\nдобавляет в результат <code>waited_ms<\/code> и замер метрики <code>shared_variable_wait_ms<\/code>.<\/p>\n<p><strong>Примеры.<\/strong> Очередь producer/consumer поверх разделяемого списка:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nshared_variables:\n  pending_orders: []      # type inferred: list\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># producer step\n- name: enqueue order\n  use: std/set_shared_variable@v1\n  with: { name: pending_orders, op: append, value: { id: \"ord-${seq}\" } }\n\n# consumer step — block until something is there, then take it\n- name: dequeue order\n  use: std/get_shared_variable@v1\n  with:\n    name: pending_orders\n    op: pop\n    wait_for: { length_gte: 1, timeout_ms: 10000 }\n    extract: { order_id: $.id }\n<\/code><\/pre>\n<p>Разделяемый счётчик:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nshared_variables:\n  approved_count: 0       # type inferred: number\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">- name: count approval\n  use: std/set_shared_variable@v1\n  with: { name: approved_count, op: increment, value: 1 }\n<\/code><\/pre>\n<h2><code>std/llm@v1<\/code><\/h2>\n<blockquote>\n<p>Пошаговое описание на уровне концепций (эндпоинты, примеры, метрики, пороги):\n<a href=\"#/docs/core/llm\">руководство по LLM<\/a>.<\/p>\n<\/blockquote>\n<p>Отправляет один запрос LLM chat-completion за итерацию, по умолчанию в\nпотоковом режиме, измеряя время до первого токена (TTFT), пропускную\nспособность генерации и расход токенов. Три проводных формата эндпоинтов:<\/p>\n<table><thead><tr><th>Эндпоинт<\/th><th>Проводной формат<\/th><\/tr><\/thead><tbody>\n<tr><td><code>openai<\/code> (по умолчанию)<\/td><td>OpenAI chat completions — а также OpenAI-совместимые серверы (Ollama, vLLM, LM Studio, …). При стриминге отправляет <code>stream_options: { include_usage: true }<\/code><\/td><\/tr>\n<tr><td><code>anthropic<\/code><\/td><td>Anthropic messages API; отправляет <code>anthropic-version: 2023-06-01<\/code>, ключ — в <code>x-api-key<\/code><\/td><\/tr>\n<tr><td><code>generic<\/code><\/td><td>Тело — объект <code>params<\/code> как есть; поля ответа извлекаются через <code>extract<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>endpoint<\/code><\/td><td>string<\/td><td><code>openai<\/code><\/td><td><code>openai<\/code>, <code>anthropic<\/code> или <code>generic<\/code><\/td><\/tr>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>URL эндпоинта completion<\/td><\/tr>\n<tr><td><code>model<\/code><\/td><td>string<\/td><td>—<\/td><td>Имя модели; обязательно для <code>openai<\/code> / <code>anthropic<\/code><\/td><\/tr>\n<tr><td><code>prompt<\/code><\/td><td>string<\/td><td>одно из prompt/messages<\/td><td>Сахар для одного сообщения <code>user<\/code> (взаимоисключающий с <code>messages<\/code>)<\/td><\/tr>\n<tr><td><code>messages<\/code><\/td><td>array<\/td><td>одно из prompt/messages<\/td><td><code>[{ role, content }]<\/code> — сообщения чата<\/td><\/tr>\n<tr><td><code>max_tokens<\/code><\/td><td>integer<\/td><td><code>256<\/code><\/td><td>Ограничение на токены ответа<\/td><\/tr>\n<tr><td><code>stream<\/code><\/td><td>boolean<\/td><td><code>true<\/code> (<code>openai<\/code>/<code>anthropic<\/code>), <code>false<\/code> (<code>generic<\/code>)<\/td><td>Стримить ответ как SSE<\/td><\/tr>\n<tr><td><code>api_key<\/code><\/td><td>string<\/td><td>—<\/td><td><code>Authorization: Bearer<\/code> (<code>openai<\/code>/<code>generic<\/code>) или <code>x-api-key<\/code> (<code>anthropic<\/code>)<\/td><\/tr>\n<tr><td><code>headers<\/code><\/td><td>object<\/td><td>—<\/td><td>Дополнительные заголовки запроса, строковые значения<\/td><\/tr>\n<tr><td><code>params<\/code><\/td><td>object<\/td><td>—<\/td><td>Сквозные поля тела (<code>temperature<\/code>, …); для <code>generic<\/code> это и ЕСТЬ тело<\/td><\/tr>\n<tr><td><code>extract<\/code><\/td><td>object<\/td><td>—<\/td><td>Только <code>generic<\/code>: <code>{ text, prompt_tokens, completion_tokens }<\/code> — каждое значение это точечный путь (<code>$.usage.completion_tokens<\/code>, <code>$.choices[0].text<\/code>) или регулярное выражение с одной группой захвата<\/td><\/tr>\n<tr><td><code>timeout_ms<\/code><\/td><td>integer (мс)<\/td><td><code>120000<\/code><\/td><td>Таймаут на весь запрос (подключение → последний фрагмент)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Статус не 2xx приводит к ошибке шага с указанием статуса и первых ~500 символов\nтела ошибки.<\/p>\n<p><strong>Результат:<\/strong><\/p>\n<pre><code class=\"language-json\">{ \"endpoint\": \"openai\", \"model\": \"gpt-4o-mini\", \"status\": 200,\n  \"ttft_ms\": 120.31, \"duration_ms\": 850.02,\n  \"prompt_tokens\": 12, \"completion_tokens\": 96,\n  \"tokens_per_sec\": 131.5, \"chunks\": 34, \"text\": \"…\",\n  \"metrics\": { \"llm_ttft_ms\": [120.31], \"llm_tokens_per_sec\": [131.5],\n               \"llm_prompt_tokens\": 12, \"llm_completion_tokens\": 96,\n               \"llm_chunks\": 34 } }\n<\/code><\/pre>\n<p><code>ttft_ms<\/code> появляется только для потоковых ответов (TTFT = начало запроса →\nпервый фрагмент контента); <code>tokens_per_sec<\/code> делит токены ответа на время\nгенерации после первого токена, а если TTFT не был измерен — на время всего\nзапроса. <code>text<\/code> обрезается до ~4 КиБ. <code>llm_ttft_ms<\/code> / <code>llm_tokens_per_sec<\/code> —\nтренды (доступны перцентили в <code>std/thresholds@v1<\/code>); <code>llm_prompt_tokens<\/code> /\n<code>llm_completion_tokens<\/code> / <code>llm_chunks<\/code> — счётчики.<\/p>\n<p><strong>Примеры.<\/strong> Локальный Ollama (OpenAI-совместимый, без ключа):<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: llama completion\n    use: std/llm@v1\n    with:\n      url: http://127.0.0.1:11434/v1/chat/completions\n      model: llama3.1\n      prompt: \"Summarize the CAP theorem in two sentences.\"\n      max_tokens: 128\n    check:\n      status: 200\n<\/code><\/pre>\n<p>Стриминг Anthropic с ключом из окружения:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: claude completion\n    use: std/llm@v1\n    with:\n      endpoint: anthropic\n      url: https://api.anthropic.com/v1/messages\n      model: claude-sonnet-4-5\n      api_key: ${{ env.ANTHROPIC_API_KEY }}\n      prompt: \"Explain backpressure in one paragraph.\"\n<\/code><\/pre>\n<p>Эндпоинт generic с извлечением полей:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: tgi generate\n    use: std/llm@v1\n    with:\n      endpoint: generic\n      url: http://127.0.0.1:8080/generate\n      params:\n        inputs: \"Tell me a joke.\"\n        parameters: { max_new_tokens: 64 }\n      extract:\n        text: \"$.generated_text\"\n        completion_tokens: '\"generated_tokens\": (\\d+)'\n<\/code><\/pre>\n<h2>WebSocket: <code>std/ws@v1<\/code> и семейство <code>std/ws-*@v1<\/code><\/h2>\n<blockquote>\n<p>Пошаговое описание на уровне концепций (стили, динамические сообщения,\nпроверки, метрики): <a href=\"#/docs/core/websocket\">руководство по WebSocket<\/a>.<\/p>\n<\/blockquote>\n<p>Два способа нагрузочного тестирования WebSocket-эндпоинта:<\/p>\n<ul>\n<li><strong>Разовая сессия<\/strong> — <code>std/ws@v1<\/code> открывает соединение, обменивается\nсообщениями и закрывает его, всё в одном шаге (как FIX-сессия). Самый простой\nвариант; вся сессия измеряется как один замер <code>http_req_duration<\/code>.<\/li>\n<li><strong>Живое соединение<\/strong> — <code>std/ws-connect@v1<\/code> открывает соединение, которое\nостаётся активным между шагами внутри итерации; <code>ws-send<\/code> / <code>ws-recv<\/code> /\n<code>ws-ping<\/code> / <code>ws-close<\/code> обращаются к нему по <strong>id<\/strong>, который вернул шаг\nconnect. Используйте это, чтобы чередовать WS-трафик с другими шагами\n(например, подписаться по WS, инициировать событие по HTTP, проверить, что\npush пришёл).<\/li>\n<\/ul>\n<p>Соединение, оставленное открытым в конце итерации, разрывается аварийно (без\nClose-рукопожатия) — вызывайте <code>std/ws-close@v1<\/code> для корректного завершения.\nЖивые соединения никогда не переживают переход в следующую итерацию, а\n<code>ws-connect<\/code> внутри <code>before:<\/code> setup бесполезен (контекст setup исчезает до\nстарта VU).<\/p>\n<h3>Профиль соединения<\/h3>\n<p>Все шаги, умеющие подключаться (<code>std/ws@v1<\/code>, <code>std/ws-connect@v1<\/code>), принимают\nодни и те же параметры цели — инлайн или собранные в объект-профиль под\n<code>connection<\/code> (инлайн-поля побеждают). Профиль, определённый в шаге <code>before:<\/code>\nконфига, передаётся как <code>connection: \"${{ config.&lt;name&gt; }}\"<\/code>.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Цель <code>ws://<\/code> или <code>wss://<\/code><\/td><\/tr>\n<tr><td><code>headers<\/code><\/td><td>object<\/td><td>—<\/td><td>Дополнительные заголовки рукопожатия (токены авторизации и т.п.)<\/td><\/tr>\n<tr><td><code>subprotocols<\/code><\/td><td>array | string<\/td><td>—<\/td><td>Предлагаемые значения <code>Sec-WebSocket-Protocol<\/code> (например, <code>graphql-ws<\/code>)<\/td><\/tr>\n<tr><td><code>skipTLSVerify<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Принимать любой сертификат сервера (только staging с самоподписанными сертификатами)<\/td><\/tr>\n<tr><td><code>connection<\/code><\/td><td>object | string<\/td><td>—<\/td><td>Профиль, задающий значения по умолчанию для любого поля выше<\/td><\/tr>\n<\/tbody><\/table>\n<p><code>timeout<\/code> (integer, мс, по умолчанию <code>10000<\/code>) принимается обоими шагами инлайн,\nно <strong>не<\/strong> является частью профиля — <code>timeout<\/code> внутри <code>connection<\/code>\nигнорируется. Для <code>std/ws-connect@v1<\/code> он ограничивает рукопожатие; для\n<code>std/ws@v1<\/code> — всю сессию.<\/p>\n<h3><code>std/ws-connect@v1<\/code><\/h3>\n<p>Открывает живое соединение. Результат:<\/p>\n<pre><code class=\"language-json\">{ \"id\": \"ws-1\", \"connected\": true, \"subprotocol\": \"graphql-ws\", \"duration_ms\": 3.1 }\n<\/code><\/pre>\n<p><code>subprotocol<\/code> — согласованный с сервером протокол или <code>null<\/code>, когда сервер не\nвыбрал ни одного. Рукопожатие попадает в <code>http_req_duration<\/code>; неудачное\nрукопожатие учитывается в <code>http_req_failed<\/code>, а результат выглядит как\n<code>{ \"connected\": false, \"error\": \"…\", \"duration_ms\": … }<\/code>.<\/p>\n<p>Сохраните результат (<code>outputs: feed<\/code>) и передавайте <code>id: \"${{ feed.id }}\"<\/code>\nостальным шагам <code>ws-*<\/code>. Идентификаторы выдаются на каждый VU (<code>ws-1<\/code>, <code>ws-2<\/code>,\n…) и действительны только внутри текущей итерации этого VU.<\/p>\n<h3><code>std/ws-send@v1<\/code><\/h3>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Идентификатор соединения от <code>std/ws-connect@v1<\/code><\/td><\/tr>\n<tr><td><code>send<\/code><\/td><td>string<\/td><td>одно из send/send_base64<\/td><td>Текстовая нагрузка; токены <code>${…}<\/code> раскрываются при каждой отправке (см. ниже)<\/td><\/tr>\n<tr><td><code>send_base64<\/code><\/td><td>string<\/td><td>одно из send/send_base64<\/td><td>Бинарная нагрузка<\/td><\/tr>\n<tr><td><code>repeat<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Отправить N сообщений из одного шаблона<\/td><\/tr>\n<tr><td><code>interval_ms<\/code><\/td><td>integer<\/td><td><code>0<\/code><\/td><td>Пауза между повторными отправками<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (мс)<\/td><td><code>10000<\/code><\/td><td>На весь цикл отправки<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>: <code>{ \"sent\": N, \"bytes\": B, \"duration_ms\": …, \"metrics\": { \"ws_msgs_sent\": N } }<\/code>.\nУчитывается в частоте <code>ws_msgs_sent<\/code>. Транспортная ошибка приводит к ошибке\nшага и разрывает соединение — последующие шаги по этому id получают ошибку\n«unknown connection id». Ошибка параметров (например, заданы и <code>send<\/code>, и\n<code>send_base64<\/code>) оставляет соединение пригодным к использованию.<\/p>\n<p>Текстовые нагрузки могут содержать токены с одинарными фигурными скобками\n<code>${…}<\/code>, раскрываемые заново при каждой отправке, — в отличие от <code>${{ … }}<\/code>\nдвижка, которые разрешаются один раз до запуска действия:<\/p>\n<table><thead><tr><th>Токен<\/th><th>Раскрывается в<\/th><\/tr><\/thead><tbody>\n<tr><td><code>${seq}<\/code><\/td><td>Монотонный счётчик, уникальный для каждого сообщения (продолжает считать между отправками по одному соединению)<\/td><\/tr>\n<tr><td><code>${uuid}<\/code><\/td><td>Случайный 32-символьный hex-идентификатор<\/td><\/tr>\n<tr><td><code>${now}<\/code><\/td><td>UTC <code>YYYYMMDD-HH:MM:SS.sss<\/code> (формат FIX SendingTime)<\/td><\/tr>\n<tr><td><code>${now_ms}<\/code><\/td><td>Unix-миллисекунды<\/td><\/tr>\n<tr><td><code>${now_iso}<\/code><\/td><td>UTC RFC 3339 <code>YYYY-MM-DDTHH:MM:SS.sssZ<\/code><\/td><\/tr>\n<tr><td><code>${rand(a,b)}<\/code><\/td><td>Случайное целое в <code>[a,b]<\/code><\/td><\/tr>\n<tr><td><code>${randf(a,b[,dp])}<\/code><\/td><td>Случайное число с плавающей точкой, <code>dp<\/code> знаков после запятой (по умолчанию 2)<\/td><\/tr>\n<tr><td><code>${choice(x|y|z)}<\/code><\/td><td>Случайный выбор<\/td><\/tr>\n<\/tbody><\/table>\n<p>Неизвестные токены остаются как есть. Нагрузки <code>send_base64<\/code> декодируются один\nраз и отправляются без изменений — раскрытия токенов нет.<\/p>\n<h3><code>std/ws-recv@v1<\/code><\/h3>\n<p>Читает, пока не сработает <strong>правило остановки<\/strong> — если оно не сработало за\n<code>timeout<\/code>, шаг завершается ошибкой:<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Идентификатор соединения<\/td><\/tr>\n<tr><td><code>until_contains<\/code><\/td><td>string<\/td><td>—<\/td><td>Остановиться, когда сообщение содержит эту подстроку (взаимоисключающий с <code>until_json<\/code>)<\/td><\/tr>\n<tr><td><code>until_json<\/code><\/td><td>object<\/td><td>—<\/td><td>Остановиться, когда сообщение совпадает с JSON-подмножеством (поля шаблона должны быть равны; лишние поля игнорируются)<\/td><\/tr>\n<tr><td><code>count<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Без правила <code>until_*<\/code>: остановиться после N сообщений с данными<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (мс)<\/td><td><code>10000<\/code><\/td><td>Дедлайн для правила остановки<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>:<\/p>\n<pre><code class=\"language-json\">{ \"messages\": [\"…\"], \"body\": \"…\", \"count\": 2, \"matched\": true, \"duration_ms\": 8.4,\n  \"metrics\": { \"ws_msgs_received\": 2, \"ws_msg_rtt\": [7.9] } }\n<\/code><\/pre>\n<p><code>matched<\/code> показывает, было ли достигнуто правило остановки (в режиме <code>count<\/code>:\nдостигнуто ли количество). Текстовые фреймы приходят строками, бинарные —\nстроками base64; <code>body<\/code> — текстовая форма, объединённая переводами строк\n(поэтому работает <code>check: { body_contains: … }<\/code>). Полученные сообщения\nучитываются в частоте <code>ws_msgs_received<\/code>. Когда правило <code>until_*<\/code> совпало и\nранее по этому соединению был <code>ws-send<\/code>, время «отправка → совпадение»\nзаписывается как замер гистограммы <code>ws_msg_rtt<\/code> — круговой путь сообщения на\nуровне приложения.<\/p>\n<p>Каждое прочитанное по пути сообщение остаётся в <code>messages<\/code>, каким бы ни был\nитог. Если пир закрыл соединение или транспорт умер до срабатывания правила,\nшаг завершается ошибкой, результат получает поле <code>error<\/code>, а соединение\nразрывается; обычный таймаут тоже приводит к ошибке шага, но оставляет\nсоединение пригодным для последующих шагов. Ping/pong-фреймы, приходящие во\nвремя чтения, игнорируются как транспортный шум.<\/p>\n<p>Собственный <code>duration_ms<\/code> шага намеренно <strong>не<\/strong> попадает в\n<code>http_req_duration<\/code>: то, как долго сервер решит ждать перед отправкой push, —\nне задержка цели, и такие замеры отравили бы общие перцентили.<\/p>\n<h3><code>std/ws-ping@v1<\/code><\/h3>\n<p>Круговой путь ping→pong на уровне транспорта: <code>{ \"pong\": true, \"duration_ms\": 0.4 }<\/code>.\nПринимает <code>id<\/code> и <code>timeout<\/code>. RTT не агрегируется ни в одну гистограмму —\nограничивайте его через <code>check: { duration_ms_lt: … }<\/code>, когда нужно. Сообщения\nс данными, приходящие во время ожидания pong, буферизуются для следующего\n<code>ws-recv<\/code>. Отсутствие pong за <code>timeout<\/code> (или закрытое соединение) приводит к\nошибке шага и разрыву соединения.<\/p>\n<h3><code>std/ws-close@v1<\/code><\/h3>\n<p>Корректное Close-рукопожатие. Принимает <code>id<\/code>, <code>code<\/code> (по умолчанию <code>1000<\/code>,\nнормальное закрытие), <code>reason<\/code> (по умолчанию пусто) — оба отправляются в\nClose-фрейме — и <code>timeout<\/code>. Результат: <code>{ \"closed\": true, \"duration_ms\": … }<\/code>,\nвозвращается, даже когда пир не подтвердил закрытие за <code>timeout<\/code>: сокет в любом\nслучае исчезает, а id освобождается.<\/p>\n<h3><code>std/ws@v1<\/code> — разовая сессия<\/h3>\n<p>Параметры профиля как выше, плюс <code>messages<\/code> — список, где каждый элемент это\nстрока (шаблон <code>${…}<\/code> для отправки) или объект:<\/p>\n<table><thead><tr><th>Поле элемента<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>send<\/code> / <code>send_base64<\/code><\/td><td>Нагрузка, как в <code>ws-send<\/code><\/td><\/tr>\n<tr><td><code>repeat<\/code> / <code>interval_ms<\/code><\/td><td>Развёртывание потока, как в <code>ws-send<\/code><\/td><\/tr>\n<tr><td><code>until_contains<\/code> / <code>until_json<\/code><\/td><td>Ждать подходящий ответ перед следующим элементом; даёт замер <code>ws_msg_rtt<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<pre><code class=\"language-yaml\">steps:\n  - name: subscribe and await first trade\n    use: std/ws@v1\n    with:\n      url: wss://stream.example.com/feed\n      messages:\n        - send: '{\"op\":\"subscribe\",\"channel\":\"trades\",\"id\":\"sub-${seq}\"}'\n          until_json: { type: trade }\n    check:\n      message_matches: { type: trade }\n    outputs: feed\n<\/code><\/pre>\n<p><strong>Результат<\/strong>: <code>{ \"connected\": true, \"sent\": N, \"received\": M, \"messages\": […], \"body\": \"…\", \"subprotocol\": …, \"duration_ms\": …, \"metrics\": { \"ws_msgs_sent\": N, \"ws_msgs_received\": M, \"ws_msg_rtt\": […] } }<\/code>.\nВся сессия — один замер <code>http_req_duration<\/code>; шаг завершается ошибкой при ошибках\nрукопожатия/транспорта или любом элементе, чьё правило <code>until_*<\/code> не совпало\nвовремя. Ошибка в середине сессии всё равно сообщает всё, что было передано до\nэтого момента, плюс поле <code>error<\/code> с именем проблемного элемента (<code>message[i]: …<\/code>);\nошибка рукопожатия даёт <code>{ \"connected\": false, \"error\": \"…\", \"duration_ms\": … }<\/code>\nи учитывается в <code>http_req_failed<\/code>.<\/p>\n<h3>Ограничения<\/h3>\n<p>Входящие протокольные ограничения берутся из значений по умолчанию\nWebSocket-библиотеки: сообщения до 64 МиБ, отдельные фреймы до 16 МиБ — более\nкрупное входящее сообщение приводит к ошибке соединения (а значит, и читающего\nего шага). Значения таймаутов, счётчики <code>repeat<\/code> и список <code>messages<\/code> встроенных\nограничений не имеют.<\/p>\n<h2>gRPC: <code>std/grpc@v1<\/code> и семейство <code>std/grpc-*@v1<\/code><\/h2>\n<blockquote>\n<p>Пошаговое описание на уровне концепций (источники схемы, стримы, проверки,\nметрики): <a href=\"#/docs/core/grpc\">руководство по gRPC<\/a>.<\/p>\n<\/blockquote>\n<p>Два способа нагрузочного тестирования gRPC-эндпоинта:<\/p>\n<ul>\n<li><strong>Разовый вызов<\/strong> — <code>std/grpc@v1<\/code> открывает канал, загружает схему, делает\nодин унарный вызов и закрывает, всё в одном шаге. Самый простой вариант для\nэпизодических проверок.<\/li>\n<li><strong>Живой канал<\/strong> — <code>std/grpc-connect@v1<\/code> открывает HTTP/2-канал, который\nостаётся активным между шагами внутри итерации; <code>grpc-call<\/code> (унарный) и\nсемейство <code>grpc-stream-*<\/code> обращаются к нему по <strong>id<\/strong>, который вернул шаг\nconnect. Используйте это для любой серьёзной нагрузки: соединение и загрузка\nсхемы оплачиваются один раз на итерацию, а не на вызов.<\/li>\n<\/ul>\n<p>Вызовы <strong>динамические<\/strong>: никакой кодогенерации protobuf — схема приходит во\nвремя выполнения, а запросы/ответы представлены в JSON (правила protobuf-JSON:\nимена полей принимают и proto-имя, и его camelCase-вариант <code>json_name<\/code>; 64-битные\nцелые — строки; enum — имена).<\/p>\n<p>Канал, оставленный открытым в конце итерации, разрывается — живые каналы и\nстримы никогда не переживают переход в следующую итерацию, а <code>grpc-connect<\/code>\nвнутри <code>before:<\/code> setup бесполезен (контекст setup исчезает до старта VU).<\/p>\n<h3>Профиль канала<\/h3>\n<p><code>std/grpc@v1<\/code> и <code>std/grpc-connect@v1<\/code> принимают одни и те же параметры цели —\nинлайн или собранные в объект-профиль под <code>connection<\/code> (инлайн-поля побеждают).\nПрофиль, определённый в шаге <code>before:<\/code> конфига, передаётся как\n<code>connection: \"${{ config.&lt;name&gt; }}\"<\/code>.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>url<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Цель <code>grpc://<\/code> (открытый текст) или <code>grpcs://<\/code> (TLS); хост без схемы означает <code>grpcs://<\/code><\/td><\/tr>\n<tr><td><code>metadata<\/code><\/td><td>object<\/td><td>—<\/td><td>Метаданные вызовов по умолчанию (токены авторизации и т.п.); <code>metadata<\/code> на вызов переопределяет их по ключу<\/td><\/tr>\n<tr><td><code>skipTLSVerify<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Принимать любой сертификат сервера (только staging с самоподписанными сертификатами)<\/td><\/tr>\n<tr><td><code>descriptor_set<\/code><\/td><td>string<\/td><td>один источник схемы<\/td><td>Base64 сериализованного <code>FileDescriptorSet<\/code> (взаимоисключающий с <code>reflection<\/code>)<\/td><\/tr>\n<tr><td><code>reflection<\/code><\/td><td>boolean<\/td><td>один источник схемы<\/td><td><code>true<\/code>: получить схему через сервис reflection сервера (v1)<\/td><\/tr>\n<tr><td><code>max_recv_size<\/code><\/td><td>integer (байты)<\/td><td><code>16777216<\/code><\/td><td>Ограничение входящего сообщения (16 МиБ)<\/td><\/tr>\n<tr><td><code>connection<\/code><\/td><td>object | string<\/td><td>—<\/td><td>Профиль, задающий значения по умолчанию для любого поля выше<\/td><\/tr>\n<\/tbody><\/table>\n<p>Требуется ровно один источник схемы. <code>descriptor_set<\/code> — это base64\n<code>FileDescriptorSet<\/code> — создайте его через <code>protoc --descriptor_set_out<\/code> или\nполучите по HTTP и сошлитесь на <code>${{ fetch.body_base64 }}<\/code>. С <code>reflection: true<\/code>\nсервер должен включить gRPC reflection; полученный пул кэшируется по URL до\nконца прогона, так что повторные подключения к одному серверу оплачивают один\nкруговой путь.<\/p>\n<p><code>timeout<\/code> (integer, мс, по умолчанию <code>10000<\/code>) принимается обоими шагами инлайн,\nно <strong>не<\/strong> является частью профиля. Для <code>std/grpc-connect@v1<\/code> он ограничивает\nподключение + загрузку схемы; для <code>std/grpc@v1<\/code> — весь шаг (подключение → схема\n→ вызов; заголовок <code>grpc-timeout<\/code> вызова получает оставшийся бюджет).<\/p>\n<p>Методы именуются как <code>\"package.Service/Method\"<\/code>. Опечатка приводит к ошибке с\nподсказкой «did you mean», когда известный метод находится в расстоянии\nредактирования 2.<\/p>\n<h3>Нагрузки<\/h3>\n<p>Запросы принимают <code>payload<\/code> (JSON → динамическое protobuf-сообщение) или\n<code>payload_base64<\/code> (base64 сериализованных байт protobuf) — взаимоисключающие.\nСтроковые листья <code>payload<\/code> могут содержать токены с одинарными фигурными\nскобками <code>${…}<\/code>, описанные в <a href=\"#stdws-sendv1\"><code>std/ws-send@v1<\/code><\/a>, раскрываемые на\nкаждый вызов/отправку (<code>${seq}<\/code> продолжает считать в рамках канала/стрима).\nОтветы появляются в <code>body<\/code> как JSON по тем же правилам отображения.<\/p>\n<h3><code>std/grpc-connect@v1<\/code><\/h3>\n<p>Открывает живой канал и загружает схему. Результат:<\/p>\n<pre><code class=\"language-json\">{ \"id\": \"grpc-1\", \"connected\": true, \"duration_ms\": 4.8 }\n<\/code><\/pre>\n<p>Сохраните результат (<code>outputs: conn<\/code>) и передавайте <code>id: \"${{ conn.id }}\"<\/code>\nостальным шагам <code>grpc-*<\/code>. Идентификаторы выдаются на каждый VU (<code>grpc-1<\/code>,\n<code>grpc-2<\/code>, …) и действительны только внутри текущей итерации этого VU. Неудачное\nподключение или загрузка схемы даёт\n<code>{ \"connected\": false, \"error\": \"…\", \"duration_ms\": … }<\/code>.<\/p>\n<h3><code>std/grpc-call@v1<\/code><\/h3>\n<p>Один унарный вызов по живому каналу.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Идентификатор канала от <code>std/grpc-connect@v1<\/code><\/td><\/tr>\n<tr><td><code>method<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td><code>\"package.Service/Method\"<\/code> (только унарные методы)<\/td><\/tr>\n<tr><td><code>payload<\/code><\/td><td>object | array | string<\/td><td>одно из payload/payload_base64<\/td><td>JSON-сообщение запроса; токены <code>${…}<\/code> раскрываются на каждый вызов<\/td><\/tr>\n<tr><td><code>payload_base64<\/code><\/td><td>string<\/td><td>одно из payload/payload_base64<\/td><td>Сериализованные байты protobuf<\/td><\/tr>\n<tr><td><code>metadata<\/code><\/td><td>object<\/td><td>—<\/td><td>Метаданные вызова (переопределяют значения канала по ключу)<\/td><\/tr>\n<tr><td><code>expect_status<\/code><\/td><td>integer<\/td><td><code>0<\/code><\/td><td>Ожидаемый код статуса gRPC — любой другой приводит к ошибке шага<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (мс)<\/td><td><code>10000<\/code><\/td><td>Отправляется как <code>grpc-timeout<\/code> и контролируется локально<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>:<\/p>\n<pre><code class=\"language-json\">{ \"status\": 0, \"body\": { \"message\": \"hello\" }, \"duration_ms\": 2.4,\n  \"metrics\": { \"grpc_req_duration\": [2.4], \"grpc_msgs_sent\": 1,\n               \"grpc_msgs_received\": 1, \"grpc_msg_rtt\": [2.3], \"grpc_req_failed\": 0 } }\n<\/code><\/pre>\n<p>При ненулевом статусе результат содержит <code>error<\/code> (текст статуса) вместо <code>body<\/code>.\n<code>expect_status<\/code> делает тесты ошибочных веток естественными: <code>expect_status: 5<\/code>\nпроходит, когда сервер возвращает NOT_FOUND, и падает на OK. Неудачный RPC\nприводит к ошибке шага, но канал остаётся пригодным (HTTP/2-каналы\nвосстанавливаются; мёртвый WebSocket — нет). Унарные метрики: гистограммы\n<code>grpc_req_duration<\/code> и <code>grpc_msg_rtt<\/code>, счётчики <code>grpc_msgs_sent<\/code> /\n<code>grpc_msgs_received<\/code>, <code>grpc_req_failed<\/code> для RPC, не удовлетворивших\n<code>expect_status<\/code>.<\/p>\n<h3><code>std/grpc@v1<\/code> — разовый вызов<\/h3>\n<p>Параметры профиля канала и вызова в одном шаге; подключается, загружает схему,\nвызывает, закрывает. Результат тот же, что у <code>std/grpc-call@v1<\/code>.<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch schema\n    use: std/http@v1\n    with: { url: \"https://schema.example.com/echo.pb\" }\n    outputs: fetch\n\n  - name: unary probe\n    use: std/grpc@v1\n    with:\n      url: grpcs://api.example.com:443\n      descriptor_set: \"${{ fetch.body_base64 }}\"\n      method: \"echo.v1.Echo/Unary\"\n      payload: { message: \"ping ${seq}\" }\n    check:\n      duration_ms_lt: 500\n<\/code><\/pre>\n<h3><code>std/grpc-stream-open@v1<\/code><\/h3>\n<p>Запускает client-streaming, bidi или server-streaming вызов по живому каналу и\nвозвращает <strong>id стрима<\/strong> (<code>grpcs-1<\/code>, …).<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Идентификатор канала<\/td><\/tr>\n<tr><td><code>method<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td><code>\"package.Service/Method\"<\/code> (только стриминговые методы)<\/td><\/tr>\n<tr><td><code>payload<\/code><\/td><td>object<\/td><td>server-streaming: обязателен<\/td><td>Единственное сообщение запроса для server-streaming методов<\/td><\/tr>\n<tr><td><code>payload_base64<\/code><\/td><td>string<\/td><td>—<\/td><td>Сериализованная форма вышесказанного<\/td><\/tr>\n<tr><td><code>metadata<\/code><\/td><td>object<\/td><td>—<\/td><td>Метаданные вызова<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>: <code>{ \"id\": \"grpcs-1\", \"kind\": \"server\"|\"client\"|\"bidi\", \"open\": true, \"duration_ms\": … }<\/code>.<\/p>\n<p>Для server-streaming единственный запрос уходит при открытии; для\nclient-streaming/bidi сообщения отправляются через <code>std/grpc-stream-send@v1<\/code>\n(передача <code>payload<\/code> при открытии — ошибка). Open возвращается немедленно —\nвызов выполняется в задаче-ретрансляторе, потому что client-streaming сервер\nотправляет свои начальные метаданные только после half-close со стороны\nклиента. Ошибка на стороне сервера (UNIMPLEMENTED, авторизация, …) поэтому\nпроявляется при первом recv/close, а не при open.<\/p>\n<h3><code>std/grpc-stream-send@v1<\/code><\/h3>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Идентификатор стрима<\/td><\/tr>\n<tr><td><code>payload<\/code><\/td><td>object<\/td><td>одно из payload/payload_base64<\/td><td>JSON-сообщение; токены <code>${…}<\/code> раскрываются на каждую отправку<\/td><\/tr>\n<tr><td><code>payload_base64<\/code><\/td><td>string<\/td><td>одно из payload/payload_base64<\/td><td>Сериализованные байты protobuf<\/td><\/tr>\n<tr><td><code>repeat<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Отправить N сообщений из одного шаблона<\/td><\/tr>\n<tr><td><code>interval_ms<\/code><\/td><td>integer<\/td><td><code>0<\/code><\/td><td>Пауза между повторными отправками<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (мс)<\/td><td><code>10000<\/code><\/td><td>На весь цикл отправки<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>: <code>{ \"sent\": N, \"duration_ms\": …, \"metrics\": { \"grpc_msgs_sent\": N } }<\/code>.\nОтправка в server-streaming стрим — ошибка параметров (стрим остаётся\nпригодным). Отправка, завершившаяся ошибкой из-за того, что пир завершил вызов,\nприводит к ошибке шага и аннулирует id стрима.<\/p>\n<h3><code>std/grpc-stream-recv@v1<\/code><\/h3>\n<p>Читает, пока не сработает <strong>правило остановки<\/strong> — если оно не сработало за\n<code>timeout<\/code>, шаг завершается ошибкой:<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Идентификатор стрима<\/td><\/tr>\n<tr><td><code>until_contains<\/code><\/td><td>string<\/td><td>—<\/td><td>Остановиться, когда сообщение содержит эту подстроку (объекты: компактная JSON-форма)<\/td><\/tr>\n<tr><td><code>until_json<\/code><\/td><td>object<\/td><td>—<\/td><td>Остановиться, когда сообщение совпадает с JSON-подмножеством (взаимоисключающий с <code>until_contains<\/code>)<\/td><\/tr>\n<tr><td><code>count<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Без правила <code>until_*<\/code>: остановиться после N сообщений<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (мс)<\/td><td><code>10000<\/code><\/td><td>Дедлайн для правила остановки<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>:<\/p>\n<pre><code class=\"language-json\">{ \"messages\": [ { \"message\": \"hello\" } ], \"count\": 1, \"matched\": true,\n  \"duration_ms\": 3.1,\n  \"metrics\": { \"grpc_msgs_received\": 1, \"grpc_msg_rtt\": [2.9] } }\n<\/code><\/pre>\n<p><code>grpc_msg_rtt<\/code> появляется, только когда правило <code>until_*<\/code> совпало и ранее по\nэтому стриму был <code>grpc-stream-send<\/code> — прикладной RTT «отправка → совпадение».\nОбычный таймаут приводит к ошибке шага, но оставляет стрим пригодным;\nзавершение стрима (корректно или со статусом) до срабатывания правила приводит\nк ошибке шага и разрыву стрима.<\/p>\n<h3><code>std/grpc-stream-close@v1<\/code><\/h3>\n<p>Выполняет half-close стороны запроса (client-streaming/bidi: сервер видит конец\nввода) и дочитывает оставшиеся сообщения сервера до финального статуса, в\nпределах <code>timeout<\/code>.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Идентификатор стрима<\/td><\/tr>\n<tr><td><code>expect_status<\/code><\/td><td>integer<\/td><td><code>0<\/code><\/td><td>Ожидаемый финальный код статуса gRPC<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>integer (мс)<\/td><td><code>10000<\/code><\/td><td>Дедлайн дочитывания<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>: <code>{ \"closed\": true, \"status\": 0, \"received\": N, \"messages\": […], \"duration_ms\": …, \"metrics\": { \"grpc_msgs_received\": N, \"grpc_req_failed\": 0|1 } }<\/code>.\nДля client-streaming метода дочитанное единственное сообщение — это ответ\nвызова. Id стрима освобождается в любом случае.<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open channel\n    use: std/grpc-connect@v1\n    with:\n      url: grpcs://api.example.com:443\n      reflection: true\n      metadata: { authorization: \"Bearer ${{ vars.token }}\" }\n    outputs: conn\n\n  - name: open bidi stream\n    use: std/grpc-stream-open@v1\n    with:\n      id: \"${{ conn.id }}\"\n      method: \"echo.v1.Echo/Bidi\"\n    outputs: stream\n\n  - name: send events\n    use: std/grpc-stream-send@v1\n    with:\n      id: \"${{ stream.id }}\"\n      payload: { message: \"evt-${seq}\" }\n      repeat: 5\n      interval_ms: 20\n\n  - name: await echoes\n    use: std/grpc-stream-recv@v1\n    with:\n      id: \"${{ stream.id }}\"\n      until_contains: \"evt-5\"\n      timeout: 5000\n    outputs: got\n\n  - name: close stream\n    use: std/grpc-stream-close@v1\n    with: { id: \"${{ stream.id }}\" }\n<\/code><\/pre>\n<h3>Ограничения gRPC<\/h3>\n<p>Входящие сообщения ограничены <code>max_recv_size<\/code> (по умолчанию 16 МиБ);\nпревышающее лимит сообщение приводит к ошибке вызова с RESOURCE_EXCEEDED.\nБинарные (<code>-bin<\/code>) ключи метаданных не поддерживаются — значения метаданных это\nстроки. Время жизни стримов охватывает пользовательские шаги, поэтому стримы\nнамеренно не попадают в <code>grpc_req_duration<\/code> (только унарные вызовы); именно\n<code>grpc-stream-close<\/code> превращает финальный статус стрима в <code>grpc_req_failed<\/code>.\nТаймауты, счётчики <code>repeat<\/code> и длины дочитывания встроенных ограничений не имеют.<\/p>\n<h2>База данных: семейство <code>std/db-*@v1<\/code><\/h2>\n<p>Нагрузочные тесты SQL для <strong>PostgreSQL<\/strong>, <strong>MySQL/MariaDB<\/strong> и <strong>SQLite<\/strong>.\nДва стиля, по аналогии с семейством WebSocket: живое соединение, удерживаемое\nмежду шагами (<code>db-connect<\/code> → <code>db-query<\/code> / транзакции → <code>db-close<\/code>), и режим\n<code>per-query<\/code>, где каждый запрос оплачивает подключение + запрос (см.\n<a href=\"#db-connection-modes\">Режимы подключения<\/a>).<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: open db\n    use: std/db-connect@v1\n    with:\n      driver: postgres\n      dsn: \"${{ vars.db_dsn }}\"      # keep the password out of the file\n    outputs: db\n\n  - name: begin tx\n    use: std/db-tx-begin@v1\n    with: { id: \"${{ db.id }}\" }\n\n  - name: write\n    use: std/db-query@v1\n    with:\n      id: \"${{ db.id }}\"\n      query: INSERT INTO hits (path, status) VALUES ($1, $2)\n      params: [\"/api/checkout\", 200]\n\n  - name: commit\n    use: std/db-tx-commit@v1\n    with: { id: \"${{ db.id }}\" }\n\n  - name: hang up\n    use: std/db-close@v1\n    with: { id: \"${{ db.id }}\" }\n<\/code><\/pre>\n<h3><code>std/db-connect@v1<\/code><\/h3>\n<p>Открывает пул соединений (режим persistent) или сохраняет разобранную\nконфигурацию подключения (режим per-query) и возвращает Connection ID.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>driver<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td><code>postgres<\/code>, <code>mysql<\/code> (включая MariaDB) или <code>sqlite<\/code><\/td><\/tr>\n<tr><td><code>dsn<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Родная для драйвера строка подключения, например <code>postgres://user:pass@host:5432/db<\/code>, <code>mysql://user:pass@host:3306/db<\/code>, <code>sqlite://data.db?mode=rwc<\/code>, <code>sqlite::memory:<\/code>. Может использовать интерполяцию <code>${{ … }}<\/code> для секретов<\/td><\/tr>\n<tr><td><code>tls<\/code><\/td><td>bool | string<\/td><td><code>true<\/code><\/td><td><code>true<\/code> проверяет сертификат + имя хоста; <code>false<\/code> — открытый текст; <code>\"skip-verify\"<\/code> шифрует без проверки. Игнорируется для sqlite<\/td><\/tr>\n<tr><td><code>mode<\/code><\/td><td>string<\/td><td><code>persistent<\/code><\/td><td><code>persistent<\/code> (пул удерживается между шагами) или <code>per-query<\/code> (только конфигурация — каждый запрос подключается заново)<\/td><\/tr>\n<tr><td><code>pool_size<\/code><\/td><td>integer<\/td><td><code>1<\/code><\/td><td>Размер пула в режиме persistent (максимум 1024)<\/td><\/tr>\n<tr><td><code>timeout_ms<\/code><\/td><td>integer<\/td><td><code>30000<\/code><\/td><td>Таймаут подключения<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>: <code>{ \"id\": \"db-1\", \"driver\": \"postgres\", \"mode\": \"persistent\", \"connected\": true, \"duration_ms\": …, \"metrics\": … }<\/code>.\nВ режиме per-query <code>connected<\/code> равен <code>false<\/code> — пока ничего не открыто. DSN и\nего пароль никогда не логируются; в строках лога используется очищенная метка\n<code>host:port/database<\/code>.<\/p>\n<h3><code>std/db-query@v1<\/code><\/h3>\n<p>Выполняет один параметризованный оператор. INSERT/UPDATE/DELETE/DDL разрешены\nпо умолчанию.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>id<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Connection ID от <code>std/db-connect@v1<\/code> (<code>id: \"${{ db.id }}\"<\/code>)<\/td><\/tr>\n<tr><td><code>query<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>SQL с родными для драйвера плейсхолдерами (<code>$1<\/code>, <code>$2<\/code>, … для postgres; <code>?<\/code> для mysql/sqlite). <strong>Никогда не интерполируется<\/strong> — <code>${{<\/code> в SQL доходит до базы как есть. Жёсткий лимит 64 КиБ (<code>max_query_bytes<\/code>)<\/td><\/tr>\n<tr><td><code>params<\/code><\/td><td>array<\/td><td><code>[]<\/code><\/td><td>Позиционные значения привязки; каждый элемент <em>интерполируется<\/em>. Строки → text, числа → i64/f64, булевы → bool, null → типизированный NULL (текстового типа на postgres — приводите в SQL, например <code>$1::int<\/code>). Массивы/объекты привязать нельзя<\/td><\/tr>\n<tr><td><code>max_rows<\/code><\/td><td>integer<\/td><td><code>10000<\/code><\/td><td>Жёсткое ограничение на строки, читаемые в память; лишние строки только устанавливают <code>truncated: true<\/code><\/td><\/tr>\n<tr><td><code>timeout_ms<\/code><\/td><td>integer<\/td><td><code>30000<\/code><\/td><td>Таймаут запроса (режим per-query: подключение + запрос)<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>: <code>{ \"rows\": &lt;u64&gt;, \"rows_affected\": &lt;u64&gt;, \"truncated\": &lt;bool&gt;, \"data\": [ … ], \"duration_ms\": …, \"metrics\": … }<\/code>.\nЯчейки строк декодируются как booleans/integers/floats/text/JSON/base64\n(бинарные); неотображённые типы (NUMERIC, temporal, UUID, массивы) дают <code>null<\/code>\n— строка всё равно учитывается. При открытой на соединении транзакции запрос\nвыполняется внутри неё. Неудачный запрос приводит к ошибке шага, но оставляет\nсоединение — и любую открытую транзакцию — в припаркованном состоянии.<\/p>\n<h3><code>std/db-tx-begin@v1<\/code>, <code>std/db-tx-commit@v1<\/code>, <code>std/db-tx-rollback@v1<\/code><\/h3>\n<p>Контекст транзакции на persistent-соединении (параметр <code>id<\/code>; применяется\n<code>timeout_ms<\/code>). Каждый шаг измеряется как единое целое (<code>duration_ms<\/code> +\n<code>db_query_duration<\/code>). Одна открытая транзакция на соединение — begin при\nуже открытой или commit/rollback при отсутствующей приводят к ошибке шага.\nТранзакции отклоняются на per-query идентификаторах.<\/p>\n<h3><code>std/db-close@v1<\/code><\/h3>\n<p>Закрывает соединение и освобождает его id (параметр <code>id<\/code>). Открытая транзакция\nоткатывается при закрытии. Соединения, оставленные открытыми, неявно\nзакрываются в конце итерации.<\/p>\n<h3>Режимы подключения к БД<\/h3>\n<p><strong>persistent<\/strong> (по умолчанию): <code>db-connect<\/code> открывает пул (<code>pool_size<\/code>, по\nумолчанию 1 — шаги внутри VU выполняются строго последовательно), удерживаемый\nмежду шагами VU; <code>db_query_duration<\/code> измеряет только сам запрос.<\/p>\n<p><strong>per-query<\/strong>: шаг connect лишь валидирует и сохраняет конфигурацию; каждый\n<code>db-query<\/code> открывает новое соединение, выполняет запрос и закрывает, поэтому\n<code>db_query_duration<\/code> измеряет подключение + запрос как единое целое — форма\nserverless-драйверов и бенчмарков времени подключения. Транзакции недоступны.\n<code>sqlite::memory:<\/code> здесь бессмысленен (каждое новое соединение — пустая база) —\nиспользуйте файловый DSN; и наоборот, in-memory пул обязан оставаться на\n<code>pool_size: 1<\/code>.<\/p>\n<h3>Пулеры соединений (PgBouncer, Supabase)<\/h3>\n<p>Запросы выполняются как <strong>неименованные операторы<\/strong>, поэтому пулеры в режиме\nтранзакций (PgBouncer, Supavisor от Supabase на порту 6543) поддерживаются —\nкэшированный именованный оператор конфликтовал бы на разделяемом бэкенде\n(<code>prepared statement \"sqlx_s_1\" already exists<\/code>). Если такой пулер разбивает\nпротокольный обмен запроса между бэкендами под конкуренцией, шаг прозрачно\nповторяет попытку внутри транзакции (которая закрепляет бэкенд), и с этого\nмомента соединение продолжает оборачивать запросы; прямые соединения за это\nникогда не платят. Для Supabase: используйте DSN пулера (порт 6543, IPv4) с\n<code>tls: \"skip-verify\"<\/code> (их цепочки CA нет в webpki-roots) или установите их CA.<\/p>\n<h3>Метрики БД<\/h3>\n<table><thead><tr><th>Имя<\/th><th>Тип<\/th><th>Источник<\/th><th>Значение<\/th><\/tr><\/thead><tbody>\n<tr><td><code>db_connect_duration<\/code><\/td><td>гистограмма<\/td><td><code>std/db-connect@v1<\/code> (успех)<\/td><td>Задержка подключения + настройки пула<\/td><\/tr>\n<tr><td><code>db_query_duration<\/code><\/td><td>гистограмма<\/td><td><code>std/db-query@v1<\/code>, шаги транзакций<\/td><td>Задержка запроса; включает новое подключение в режиме per-query<\/td><\/tr>\n<tr><td><code>db_rows<\/code><\/td><td>счётчик<\/td><td><code>std/db-query@v1<\/code><\/td><td>Возвращённые строки, либо затронутые строки, когда оператор ничего не вернул<\/td><\/tr>\n<tr><td><code>db_errors<\/code><\/td><td>счётчик<\/td><td>все шаги БД (ошибка)<\/td><td>Неудачные шаги БД, всего<\/td><\/tr>\n<tr><td><code>db_errors_{connection,constraint,deadlock,timeout,other}<\/code><\/td><td>счётчик<\/td><td>все шаги БД (ошибка)<\/td><td>То же, разбитое по классам (SQLSTATE / errno / код результата SQLite; также в <code>error_kind<\/code> результата шага)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Метки метрик несут только имя шага — никогда сырой SQL.<\/p>\n<h2><code>std/file-read@v1<\/code><\/h2>\n<p>Читает файл в общий для процесса кэш и делает его содержимое доступным\nпоследующим шагам. Первое обращение оплачивает чтение с диска; каждая\nпоследующая итерация — всех VU — обслуживается из RAM. Кэш перевалидируется по\n<code>(mtime, size)<\/code> файла при каждом обращении, поэтому файл, отредактированный\nмежду прогонами долгоживущего агента, подхватывается автоматически.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>path<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Файл для чтения<\/td><\/tr>\n<tr><td><code>encoding<\/code><\/td><td>string<\/td><td><code>text<\/code><\/td><td><code>text<\/code> (файл должен быть корректным UTF-8) или <code>base64<\/code> (бинарное содержимое)<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong> (доступен через <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{ \"content\": \"...\", \"size\": 1024, \"path\": \"./fixtures/payload.json\" }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">steps:\n  - name: load payload\n    use: std/file-read@v1\n    with: { path: ./fixtures/payload.json }\n    outputs: payload\n\n  - name: send it\n    use: std/http@v1\n    with:\n      method: POST\n      url: \"https://api.example.com/items\"\n      headers: { content-type: application/json }\n      body: \"${{ payload.content }}\"\n    check:\n      status: 201\n<\/code><\/pre>\n<p>Примечания:<\/p>\n<ul>\n<li>Не-UTF-8 файл с <code>encoding: text<\/code> приводит к ошибке шага — используйте\n<code>encoding: base64<\/code> для бинарного содержимого.<\/li>\n<li>Не пишет строк лога на итерацию: попадания в кэш — горячий путь.<\/li>\n<li>Обращение к <code>${{ payload.content }}<\/code> копирует содержимое в запрос — кэш\nэкономит чтения с диска, а не копирование на каждый запрос. Держите фикстуры\nнебольшими при высоком RPS.<\/li>\n<li>Для <em>загрузок<\/em> файлов предпочитайте параметр <a href=\"#multipart-%D0%B7%D0%B0%D0%B3%D1%80%D1%83%D0%B7%D0%BA%D0%B8\"><code>multipart<\/code><\/a>\nу <code>std/http@v1<\/code>, который отправляет корректный <code>multipart/form-data<\/code>.<\/li>\n<\/ul>\n<h2><code>std/file-write@v1<\/code><\/h2>\n<p>Пишет содержимое в файл — обычно чтобы сохранить ответ предыдущего шага.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>path<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Файл для записи (родительский каталог должен существовать)<\/td><\/tr>\n<tr><td><code>content<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Данные для записи; плейсхолдеры <code>${{ ... }}<\/code> делают типичной нагрузку <code>${{ resp.body }}<\/code><\/td><\/tr>\n<tr><td><code>encoding<\/code><\/td><td>string<\/td><td><code>text<\/code><\/td><td><code>text<\/code> пишет строку как есть; <code>base64<\/code> сначала декодирует её (обратное к base64 у <code>file-read<\/code>)<\/td><\/tr>\n<tr><td><code>append<\/code><\/td><td>boolean<\/td><td><code>false<\/code><\/td><td>Дописывать вместо перезаписи<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>: <code>{ \"path\": &lt;string&gt;, \"size\": &lt;записанные байты&gt; }<\/code><\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch report\n    use: std/http@v1\n    with: { url: \"https://api.example.com/report\" }\n    outputs: resp\n\n  - name: save it\n    use: std/file-write@v1\n    with:\n      path: ./out/report.json\n      content: \"${{ resp.body }}\"\n<\/code><\/pre>\n<p>Примечания:<\/p>\n<ul>\n<li>Запись по пути, закэшированному <code>std/file-read@v1<\/code>, автоматически\nинвалидирует эту запись кэша — кэш чтения перевалидируется по <code>(mtime, size)<\/code>.<\/li>\n<li>С <code>append: true<\/code> каждый вызов — одна запись <code>O_APPEND<\/code>, поэтому конкурентные\nVU не перемешиваются внутри содержимого; порядок между VU не определён.<\/li>\n<li>Не пишет строк лога на итерацию.<\/li>\n<\/ul>\n<h2><code>std/child_process@v1<\/code><\/h2>\n<p>Запускает локальный процесс ОС и держит его живым весь прогон — mock-сервер,\nбаза-фикстура, sidecar, нужный тестируемой системе. Типичное место — блок\n<code>before:<\/code> конфига (запуск) в паре с <code>after:<\/code> (остановка); можно использовать и\nв шагах теста. <strong>Fail-closed<\/strong>: прогон должен явно разрешить это через\n<code>allow_process_actions: true<\/code> в конфиге.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>command<\/code><\/td><td>string<\/td><td><strong>обязателен<\/strong><\/td><td>Исполняемый файл для запуска<\/td><\/tr>\n<tr><td><code>args<\/code><\/td><td>array of strings<\/td><td><code>[]<\/code><\/td><td>Аргументы команды<\/td><\/tr>\n<tr><td><code>env<\/code><\/td><td>object<\/td><td>—<\/td><td>Дополнительные переменные окружения (<code>{ \"NAME\": \"value\" }<\/code>, значения — только строки)<\/td><\/tr>\n<tr><td><code>cwd<\/code><\/td><td>string<\/td><td>—<\/td><td>Рабочий каталог потомка<\/td><\/tr>\n<tr><td><code>port<\/code><\/td><td>integer<\/td><td>—<\/td><td>Порт, на котором отвечает процесс (пробрасывается в outputs); <code>0<\/code> автоматически назначает свободный порт и экспортирует его потомку как переменную окружения <code>PORT<\/code><\/td><\/tr>\n<tr><td><code>restart<\/code><\/td><td>string<\/td><td><code>never<\/code><\/td><td>Политика перезапуска: <code>never<\/code>, <code>on-failure<\/code> (ненулевой код выхода или сигнал), <code>always<\/code><\/td><\/tr>\n<tr><td><code>max_restarts<\/code><\/td><td>integer<\/td><td><code>3<\/code><\/td><td>Бюджет перезапусков для политики<\/td><\/tr>\n<tr><td><code>backoff_ms<\/code><\/td><td>integer<\/td><td><code>1000<\/code><\/td><td>Задержка перед каждым перезапуском<\/td><\/tr>\n<tr><td><code>buffer_kb<\/code><\/td><td>integer<\/td><td><code>64<\/code><\/td><td>Размер захватываемого хвоста stdout/stderr на поток (КиБ)<\/td><\/tr>\n<tr><td><code>waitUntil<\/code><\/td><td>object | string<\/td><td>—<\/td><td>Гейт готовности — см. ниже<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong> (доступен через <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{ \"pid\": 12345, \"ppid\": 12300, \"pgid\": 12345, \"port\": 8080,\n  \"stdout\": \"&lt;tail&gt;\", \"stderr\": \"&lt;tail&gt;\", \"restart_count\": 0 }\n<\/code><\/pre>\n<p><code>ppid<\/code> — сам процесс perfscale; <code>pgid<\/code> — группа процессов потомка — каждый\nпотомок возглавляет собственную группу, поэтому убийство дерева никогда не\nзаденет perfscale. <code>port<\/code> присутствует, только когда шаг его объявил.\n<code>pid<\/code>/<code>pgid<\/code>/<code>restart_count<\/code> — это <strong>снимок<\/strong>: они меняются при перезапусках,\nпоэтому останавливайте процессы по имени в реестре\n(<a href=\"#stdkill_processv1\"><code>std/kill_process@v1<\/code><\/a>), а не по захваченному pid.<\/p>\n<p>Потомок продолжает работать после возврата шага. Его вывод стримится в лог\nпрогона с префиксом <code>{step}: <\/code> (та же форма, что у раннера k6) и накапливается\nв ограниченных буферах хвоста за <code>stdout<\/code>/<code>stderr<\/code>. Супервизор применяет\nполитику перезапуска до конца прогона и логирует каждый перезапуск. Всё, что\nещё живо к концу прогона — нормальное завершение, упавший <code>before:<\/code> или\nCtrl-C — <strong>останавливается автоматически<\/strong> (SIGTERM, с эскалацией до SIGKILL\nпосле льготного периода, вся группа процессов), поэтому забытый <code>kill_process<\/code>\nникогда не оставляет утечку сервера.<\/p>\n<h3>waitUntil — гейт готовности<\/h3>\n<p>Блокирует шаг до готовности процесса; каждый перечисленный сопоставитель должен\nсработать. Объектная форма:<\/p>\n<table><thead><tr><th>Поле<\/th><th>Тип<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>stdout_contains<\/code><\/td><td>string<\/td><td>Подстрока в захваченном stdout<\/td><\/tr>\n<tr><td><code>stderr_contains<\/code><\/td><td>string<\/td><td>Подстрока в захваченном stderr<\/td><\/tr>\n<tr><td><code>stdout_matches<\/code><\/td><td>string (regex)<\/td><td>Регулярное выражение по захваченному stdout<\/td><\/tr>\n<tr><td><code>stderr_matches<\/code><\/td><td>string (regex)<\/td><td>Регулярное выражение по захваченному stderr<\/td><\/tr>\n<tr><td><code>port_open<\/code><\/td><td>integer<\/td><td>TCP-подключение к <code>127.0.0.1:&lt;port&gt;<\/code> успешно; <code>0<\/code> проверяет собственный <code>port<\/code> шага<\/td><\/tr>\n<tr><td><code>timeout<\/code><\/td><td>string<\/td><td>Длительность вида <code>30s<\/code>/<code>1m<\/code> (по умолчанию <code>30s<\/code>)<\/td><\/tr>\n<tr><td><code>on_timeout<\/code><\/td><td>string<\/td><td><code>fail<\/code> (по умолчанию) приводит к ошибке шага; <code>continue<\/code> логирует промах и идёт дальше<\/td><\/tr>\n<\/tbody><\/table>\n<p>Процесс, завершившийся до достижения готовности, приводит к ошибке шага с его\nкодом выхода и хвостом stderr. Строковая форма покрывает частый случай одного\nсопоставителя: <code>waitUntil: 'contains(stdout, \"Serving HTTP\")'<\/code>,\n<code>'matches(stderr, \"re\")'<\/code>, <code>'port_open(8080)'<\/code>.<\/p>\n<pre><code class=\"language-yaml\">allow_process_actions: true\n\nbefore:\n  - name: web\n    uses: std/child_process@v1\n    with:\n      command: python3\n      args: [\"-m\", \"http.server\", \"8080\"]\n      waitUntil:\n        port_open: 8080\n        timeout: 10s\n      restart: on-failure\n    outputs: web          # → ${{ config.web.pid }}, ${{ config.web.port }}\n<\/code><\/pre>\n<h2><code>std/kill_process@v1<\/code><\/h2>\n<p>Останавливает процесс, запущенный через <code>std/child_process@v1<\/code> — пара к\n<code>after:<\/code>. Тот же гейт <code>allow_process_actions<\/code>.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>name<\/code><\/td><td>string<\/td><td>одно из name/pid<\/td><td>Имя управляемого процесса в реестре (имя его шага или имя <code>outputs<\/code>). Предпочтительно: поиск всегда указывает на <em>текущий<\/em> pid, даже через перезапуски<\/td><\/tr>\n<tr><td><code>pid<\/code><\/td><td>integer<\/td><td>одно из name/pid<\/td><td>Сырой pid ОС — запасной вариант «как получится» для процессов вне реестра (только unix)<\/td><\/tr>\n<tr><td><code>signal<\/code><\/td><td>string<\/td><td><code>TERM<\/code><\/td><td><code>TERM<\/code>, <code>KILL<\/code>, <code>INT<\/code>, <code>HUP<\/code>, <code>QUIT<\/code>, <code>USR1<\/code>, <code>USR2<\/code> (префикс <code>SIG<\/code> допускается)<\/td><\/tr>\n<tr><td><code>grace_ms<\/code><\/td><td>integer<\/td><td><code>5000<\/code><\/td><td>Ждать завершения процесса столько времени перед эскалацией до SIGKILL<\/td><\/tr>\n<tr><td><code>tree<\/code><\/td><td>boolean<\/td><td><code>true<\/code><\/td><td>Сигналить всей группе процессов, а не только лидеру<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Результат<\/strong>: <code>{ \"pid\": 12345, \"signal\": \"TERM\", \"exit_code\": null, \"waited_ms\": 12 }<\/code><\/p>\n<p><code>exit_code<\/code> равен <code>null<\/code>, когда процесс погиб от сигнала, и всегда <code>null<\/code> для\nсырых pid (статус завершения не-потомка собрать нельзя). Остановка уже\nостановленного процесса — no-op, а не ошибка; автоматическая остановка в конце\nпрогона покрывает всё, что не было остановлено явно.<\/p>\n<pre><code class=\"language-yaml\">after:\n  - name: stop web\n    uses: std/kill_process@v1\n    with: { name: web, signal: TERM }\n<\/code><\/pre>\n<p>На не-unix платформах нет POSIX-сигналов и групп процессов:\n<code>std/kill_process@v1<\/code> по <code>name<\/code> завершает только непосредственного потомка\n(<code>tree<\/code> не действует), а <code>pid:<\/code> не поддерживается.<\/p>\n<h2><code>std/thresholds@v1<\/code><\/h2>\n<p>SLO-гейты уровня прогона поверх метрик, собранных за прогон, — выражения\nпорогов в стиле k6, вычисляемые <strong>один раз<\/strong>, после остановки всех VU. Их дом —\nблок <code>after:<\/code> конфига:<\/p>\n<pre><code class=\"language-yaml\">after:\n  - name: slo gate\n    use: std/thresholds@v1\n    with:\n      db_query_duration: [\"p95&lt;500\", \"max&lt;2000\"]\n      db_query_failed: [\"rate&lt;0.05\"]\n      db_errors: [\"count==0\"]\n      http_req_duration: [\"avg&lt;300\"]\n    severity: fail            # fail (default) | warn | info\n    message: \"checkout SLO\"   # optional, interpolated\n<\/code><\/pre>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>with.&lt;metric&gt;<\/code><\/td><td>string или array of strings<\/td><td><strong>обязателен (≥1)<\/strong><\/td><td>Выражения порогов для метрики прогона<\/td><\/tr>\n<tr><td><code>severity<\/code><\/td><td>string<\/td><td><code>fail<\/code><\/td><td>Поле уровня шага: во что превращается нарушенный гейт — <code>fail<\/code> (прогон завершается с ненулевым кодом), <code>warn<\/code> или <code>info<\/code> (оба с нулевым кодом)<\/td><\/tr>\n<tr><td><code>message<\/code><\/td><td>string<\/td><td>—<\/td><td>Поле уровня шага: пользовательская метка, добавляемая к сводке нарушений; интерполируется<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Выражения<\/strong> имеют вид <code>&lt;agg&gt;&lt;op&gt;&lt;number&gt;<\/code>: agg ∈ <code>avg<\/code>, <code>min<\/code>, <code>max<\/code>, <code>p50<\/code>,\n<code>p90<\/code>, <code>p95<\/code>, <code>p99<\/code>, <code>count<\/code>, <code>rate<\/code>; op ∈ <code>&lt;<\/code>, <code>&lt;=<\/code>, <code>&gt;<\/code>, <code>&gt;=<\/code>, <code>==<\/code>, <code>!=<\/code>;\nчисло — обычный float (целое или десятичное, без единиц). Пробелы вокруг частей\nдопустимы (<code>p95 &lt; 500<\/code> парсится).<\/p>\n<p><strong>Какие агрегаты применимы<\/strong> — зависит от вида метрики:<\/p>\n<ul>\n<li><em>Метрики-замеры<\/em> (<code>db_query_duration<\/code>, <code>http_req_duration<\/code>, <code>ws_msg_rtt<\/code>, …):\n<code>avg<\/code>/<code>min<\/code>/<code>max<\/code>/<code>p50<\/code>/<code>p90<\/code>/<code>p95<\/code>/<code>p99<\/code> вычисляются по <strong>всем<\/strong> замерам,\nсделанным за прогон, из тех же HDR-гистограмм, что печатает итоговая сводка —\nчисла гейтов совпадают со сводкой. <code>count<\/code> — число замеров.<\/li>\n<li><em>Метрики-счётчики<\/em> (<code>db_errors<\/code>, <code>db_rows<\/code>, …): только <code>count<\/code> — финальное\nзначение счётчика.<\/li>\n<li><em>Метрики ошибок<\/em> (<code>http_req_failed<\/code>, <code>db_query_failed<\/code>, …): <code>rate<\/code> — доля\nнеудачных вызовов от всех в <code>0.0..=1.0<\/code>; <code>count<\/code> — число вызовов. Раннер\nвыводит их автоматически — каждый вызов шага записывает замер 0/1 под\n<code>&lt;family&gt;_failed<\/code> для каждой метрики длительности, которую он выпустил\n(<code>db_query_duration<\/code> → <code>db_query_failed<\/code>). См.\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<\/ul>\n<p><strong>Ошибки жёсткие.<\/strong> Неизвестное имя метрики приводит к ошибке гейта — и\nпрогона — со списком метрик, которые <em>есть<\/em>; то же делают пустой <code>with:<\/code>,\nнепарсящееся выражение или агрегат, неприменимый к виду метрики. Сломанный гейт\nникогда незаметно не пройдёт CI.<\/p>\n<p><strong>Результат<\/strong> (доступен через <code>outputs<\/code> / <code>__last__<\/code>):<\/p>\n<pre><code class=\"language-json\">{ \"status\": \"fail\",\n  \"message\": \"db_query_duration p95=612ms ≥ 500ms; checkout SLO\",\n  \"violations\": [{ \"metric\": \"db_query_duration\", \"expr\": \"p95&lt;500\", \"actual\": 612.0 }] }\n<\/code><\/pre>\n<p><code>status<\/code> равен <code>pass<\/code>, когда выполняются все выражения, иначе — значение\n<code>severity<\/code>. <code>message<\/code> — сводка нарушений, объединённая через <code>; <\/code>, плюс\nпользовательское сообщение, обрезанная на 200 символах с <code>…<\/code>. JSON сводки\nпрогона (<code>perfscale run --summary-export<\/code>) получает поле <code>thresholds<\/code> той же\nформы (несколько гейтов объединяются: побеждает худший статус).<\/p>\n<h2><code>std/check@v1<\/code><\/h2>\n<p>Проверяет свойства результата предыдущего шага. Обычно записывается как\nинлайн-блок <code>check:<\/code> шага, который выполняет это действие над результатом того\nшага; автономное использование выбирает цель через <code>on<\/code>.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>on<\/code><\/td><td>string<\/td><td>Что проверять (по умолчанию — результат последнего шага). Точки спускаются вглубь значения: <code>on: got.messages.0<\/code> адресует одно сообщение по позиции<\/td><\/tr>\n<tr><td><code>status<\/code><\/td><td>integer<\/td><td>HTTP-статус должен быть равен этому значению<\/td><\/tr>\n<tr><td><code>duration_ms_lt<\/code><\/td><td>integer<\/td><td><code>duration_ms<\/code> должен быть строго меньше<\/td><\/tr>\n<tr><td><code>body_contains<\/code><\/td><td>string<\/td><td>Тело ответа должно содержать эту подстроку<\/td><\/tr>\n<tr><td><code>message_contains<\/code><\/td><td>string<\/td><td>Какое-то сообщение в списке <code>messages<\/code> содержит эту подстроку<\/td><\/tr>\n<tr><td><code>message_matches<\/code><\/td><td>object<\/td><td>Какое-то сообщение совпадает с этим объектом как JSON-подмножество<\/td><\/tr>\n<tr><td><code>messages_count_gte<\/code><\/td><td>integer<\/td><td>Список <code>messages<\/code> содержит не менее N элементов<\/td><\/tr>\n<\/tbody><\/table>\n<p>Проверки <code>message_*<\/code> работают по списку <code>messages<\/code>, который предоставляют\nдействия обмена сообщениями (<code>std/ws@v1<\/code>, <code>std/ws-recv@v1<\/code>, <code>pro/fix@v1<\/code>), и\nиспользуют квантор <strong>any<\/strong> — хотя бы одно сообщение должно совпасть, потому что\nпотоки несут шум (heartbeats, посторонние события). Текстовые фреймы WS\n(строки) парсятся как JSON для <code>message_matches<\/code>; фреймы FIX (объекты\n«тег→значение») совпадают напрямую, поэтому\n<code>message_matches: { \"35\": \"8\", \"150\": \"F\" }<\/code> проверяет исполненный\nExecutionReport. Для детерминированных обменов адресуйте одно сообщение по\nиндексу через <code>on<\/code> (<code>on: got.messages.0<\/code>) — хрупко на неупорядоченных потоках.<\/p>\n<p>Каждая проверка логирует <code>PASS<\/code>/<code>FAIL<\/code>; неудачи идут в stderr, но не\nостанавливают прогон. Результат: <code>{ \"passed\": true|false }<\/code>.<\/p>\n<h2><code>std/sleep@v1<\/code><\/h2>\n<p>Приостанавливает текущего VU.<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>ms<\/code><\/td><td>integer<\/td><td><code>1000<\/code><\/td><td>Сколько миллисекунд спать<\/td><\/tr>\n<tr><td><code>seconds<\/code><\/td><td>number<\/td><td>—<\/td><td>Альтернатива <code>ms<\/code> (допускаются дробные значения)<\/td><\/tr>\n<\/tbody><\/table>\n<h2><code>std/log@v1<\/code><\/h2>\n<p>Выводит строку в stdout — наиболее полезно с интерполяцией:<\/p>\n<table><thead><tr><th>Параметр<\/th><th>Тип<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>message<\/code><\/td><td>string<\/td><td>Текст для вывода; ссылки <code>${{ var.field }}<\/code> разрешаются первыми<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Правила интерполяции<\/h2>\n<p>Все строковые листья в <code>with<\/code>/<code>check<\/code> интерполируются перед запуском действия:<\/p>\n<ul>\n<li><code>${{ name }}<\/code> — сохранённое значение, приведённое к строке<\/li>\n<li><code>${{ name.field }}<\/code> — одно поле сохранённого JSON-объекта<\/li>\n<li>неизвестные имена разрешаются в <code>\"\"<\/code>; незавершённый <code>${{<\/code> остаётся как есть<\/li>\n<\/ul>\n<h2>Добавление нового действия (для контрибьюторов)<\/h2>\n<ol>\n<li>Реализуйте его в <code>crates/perfscale-core/src/step/actions.rs<\/code> и добавьте ветку\nдиспетчеризации в <code>execute_action<\/code>.<\/li>\n<li>Возвращайте <code>ActionOutput<\/code>: сохраняемое <code>value<\/code>, строки лога, <code>success<\/code> и\n<code>http_sample<\/code>, если действие выполняет HTTP-работу, которая должна\nучитываться в метриках.<\/li>\n<li>Добавьте юнит-тесты рядом с существующими (для HTTP доступен wiremock).<\/li>\n<li>Задокументируйте его здесь и, если оно вводит новые поля шагов, перегенерируйте\nсхемы (<code>cargo run -p perfscale-core --example gen_schema<\/code>).<\/li>\n<\/ol>\n<h2>Пользовательские действия из downstream-крейтов<\/h2>\n<p>Действия, которым не место в этом OSS-крейте, — протоколы более высоких тарифов\nили проприетарные, такие как FIX-действие <code>pro/fix@v1<\/code> — подключаются без\nфорка. Реализуйте трейт <code>perfscale_core::step::actions::ActionHandler<\/code> в своём\nкрейте и вызовите <code>register_action(Arc::new(MyHandler))<\/code> один раз при старте\nпроцесса (например, в <code>main<\/code> агента). Зарегистрированные обработчики опрашиваются\nтолько для идентификаторов действий, которым не соответствует ни одно встроенное\n<code>std/*<\/code>, поэтому встроенные действия не платят за поиск. Параметры доходят до\nобработчика с уже применённой интерполяцией <code>${{ }}<\/code>.<\/p>\n","slug":"core/actions","title":"Built-in actions"},{"group":"core","html_en":"<h1>Architecture<\/h1>\n<p><code>perfscale-core<\/code> is a library crate: everything the CLI does is available to\nany Rust program that wants to embed a load-testing engine.<\/p>\n<pre><code class=\"language-text\">                        ┌─────────────────────────────────────┐\n CLI flags ──────────►  │            ExecutionPlan            │\n                        │  K6Script | LocustScript | Native   │\n                        └──────────────────┬──────────────────┘\n                                           │ runner::execute(plan)\n              ┌────────────────────────────┼────────────────────────────┐\n              ▼                            ▼                            ▼\n      runner::k6                   runner::locust               step::runner\n   spawn `k6 run`,             spawn `locust --headless`,    N tokio tasks (VUs)\n   stream stdout/err           stream + parse CSV stats      loop over steps\n              │                            │                            │\n              └────────────────────────────┴────────────────────────────┘\n                                           │\n                                           ▼\n                          mpsc::Receiver&lt;LogLine&gt;\n                     { source: stdout|stderr|system, text }\n<\/code><\/pre>\n<h2>The one abstraction that matters: <code>LogLine<\/code><\/h2>\n<p>Every engine — external subprocess or in-process — reduces to the same output\ntype:<\/p>\n<pre><code class=\"language-rust\">pub struct LogLine {\n    pub source: LogSource,   // Stdout | Stderr | System\n    pub text: String,\n}\n<\/code><\/pre>\n<p>Consumers (the CLI, <code>perfscale serve<\/code>, a future TUI) never care which engine\nproduced a line. The stream closes when the run finishes — there is no\nseparate completion signal.<\/p>\n<h2>Unified summary format<\/h2>\n<p>All three engines end their stream with the same k6-style summary block\n(<code>http_req_duration<\/code>, <code>http_req_failed<\/code>, <code>http_reqs<\/code>, <code>vus<\/code>, <code>iterations<\/code>),\nso downstream parsers are engine-agnostic:<\/p>\n<ul>\n<li>the native engine formats it from its own collected metrics\n(<code>step::runner::Metrics::summary_lines<\/code>)<\/li>\n<li>the locust runner builds it from locust's <code>--csv<\/code> stats file<\/li>\n<li>k6 prints it natively<\/li>\n<\/ul>\n<h2>Module map<\/h2>\n<table><thead><tr><th>Module<\/th><th>Responsibility<\/th><\/tr><\/thead><tbody>\n<tr><td><code>runner<\/code><\/td><td><code>ExecutionPlan<\/code>, <code>execute()<\/code> dispatcher, <code>LogLine<\/code>/<code>LogSource<\/code><\/td><\/tr>\n<tr><td><code>runner::k6<\/code><\/td><td>k6 subprocess: temp-script handling, streaming, oneshot<\/td><\/tr>\n<tr><td><code>runner::locust<\/code><\/td><td>locust subprocess: headless flags, CSV → summary conversion<\/td><\/tr>\n<tr><td><code>step<\/code><\/td><td>Test model: <code>TestDef<\/code>, <code>Step<\/code>, <code>RunConfig<\/code>, duration parsing, presets<\/td><\/tr>\n<tr><td><code>step::runner<\/code><\/td><td>Native VU scheduler and metrics collection<\/td><\/tr>\n<tr><td><code>step::actions<\/code><\/td><td>Built-in action dispatch (<code>std/*<\/code>) + custom-action registry<\/td><\/tr>\n<tr><td><code>step::http<\/code><\/td><td><code>std/http@v1<\/code> + shared HTTP transport (client pools, timed exchange, reporting)<\/td><\/tr>\n<tr><td><code>step::context<\/code><\/td><td>Per-VU variable store + <code>${{ }}<\/code> interpolation<\/td><\/tr>\n<tr><td><code>step::resources<\/code><\/td><td>Family handle types + gRPC reflection cache over the connection registries<\/td><\/tr>\n<tr><td><code>step::ws<\/code> / <code>step::grpc<\/code> / <code>step::db<\/code><\/td><td>Live-connection protocol families<\/td><\/tr>\n<tr><td><code>step::graphql<\/code><\/td><td><code>std/graphql@v1<\/code>: HTTP GraphQL + introspection/SDL schema validation<\/td><\/tr>\n<tr><td><code>step::thresholds<\/code><\/td><td><code>std/thresholds@v1<\/code> run-level SLO gates<\/td><\/tr>\n<tr><td><code>step::process<\/code><\/td><td>Managed child processes (<code>std/child_process<\/code>, <code>std/kill_process<\/code>)<\/td><\/tr>\n<tr><td><code>yaml<\/code><\/td><td>Schema-validated parsing of test/config files, <code>ConfigFile<\/code><\/td><\/tr>\n<tr><td><code>schema<\/code><\/td><td>JSON Schema generation (schemars) for both file formats<\/td><\/tr>\n<tr><td><code>models<\/code><\/td><td><code>RunResult<\/code> (oneshot subprocess result)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Sibling workspace crate: <strong><code>perfscale-connection<\/code><\/strong> — the generic\nnamed-connection registry (<code>Connection<\/code> trait + <code>ConnectionRegistry<\/code>) that\n<code>step::resources<\/code> builds on. Zero dependencies; usable by any step engine\nwith the connect → park → use → close lifecycle.<\/p>\n<h2>Native engine pipeline<\/h2>\n<p>A native run flows through these pieces in order:<\/p>\n<pre><code class=\"language-text\"> test.yaml + config.yaml (step::yaml, schema-validated)\n        │  steps, before/after, vars, run config (vus, duration)\n        ▼\n step::runner::run_native ── before: steps once (outputs → ${{ config.* }})\n        │\n        │  spawn config.vus tokio tasks, each loops until duration expires:\n        ▼\n step::context::Context     per VU: vars + ${{ }} interpolation,\n        │                   per-VU generator, HTTP client shard\n        ▼\n step::actions::execute_action   per step, strictly sequential:\n        │   std/http·tcp·udp·ws*·grpc*·db-*·check·sleep·log·file-*·…\n        ▼\n step::resources            live handles parked under Connection IDs\n        │   (ws-1, grpc-1, grpcs-1, db-1) via perfscale-connection;\n        │   drained after every iteration — nothing outlives it\n        ▼\n step::runner::Metrics      HDR histograms (fixed memory), counters,\n        │                   rates, threshold results\n        ▼\n summary + thresholds       k6-compatible text summary streamed as\n        │                   LogLines; NativeRunOutcome.thresholds\n        ▼\n CLI exit code              non-zero when a severity:fail gate trips\n<\/code><\/pre>\n<p>Where things plug in:<\/p>\n<ul>\n<li><strong>k6 / locust<\/strong> are sibling <em>engines<\/em>, not steps: <code>runner::execute<\/code>\ndispatches the <code>ExecutionPlan<\/code> to their subprocess runners, which reduce\nto the same <code>LogLine<\/code> stream (diagram above).<\/li>\n<li><strong>gRPC / WebSocket / DB families<\/strong> plug in as <code>std/*<\/code> actions in\n<code>step::actions<\/code>, with their live handles parked in <code>step::resources<\/code>\n(backed by the <code>perfscale-connection<\/code> crate) — connect steps mint the\n<code>ws-1<\/code> / <code>grpc-1<\/code> / <code>db-1<\/code> ids users reference in later steps.<\/li>\n<li><strong>Thresholds<\/strong> run as <code>std/thresholds@v1<\/code> steps in <code>after:<\/code>, evaluating\ngates over the run's collected metrics (<code>step::thresholds<\/code>); the combined\nresult becomes the CLI exit code.<\/li>\n<li><strong>Custom actions<\/strong> (e.g. downstream <code>pro/*<\/code>) register an <code>ActionHandler<\/code>\nvia <code>step::actions::register_action<\/code> and can use <code>perfscale-connection<\/code>\nfor their own parked handles.<\/li>\n<\/ul>\n<p>Key files, one line each:<\/p>\n<table><thead><tr><th>File<\/th><th>Role<\/th><\/tr><\/thead><tbody>\n<tr><td><code>crates/perfscale-core/src/runner/mod.rs<\/code><\/td><td>Engine dispatch, <code>LogLine<\/code><\/td><\/tr>\n<tr><td><code>crates/perfscale-core/src/step/runner.rs<\/code><\/td><td>VU loop, HDR metrics, summary, exit-code source<\/td><\/tr>\n<tr><td><code>crates/perfscale-core/src/step/context.rs<\/code><\/td><td><code>${{ }}<\/code> interpolation, per-VU state<\/td><\/tr>\n<tr><td><code>crates/perfscale-core/src/step/actions.rs<\/code><\/td><td><code>std/*<\/code> action dispatch<\/td><\/tr>\n<tr><td><code>crates/perfscale-core/src/step/resources.rs<\/code><\/td><td>Family handle types, registry glue<\/td><\/tr>\n<tr><td><code>crates/perfscale-connection/src/lib.rs<\/code><\/td><td>The connection-registry pattern, documented<\/td><\/tr>\n<tr><td><code>crates/perfscale-cli/src/main.rs<\/code><\/td><td>CLI: parse args, run plan, print stream, exit code<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Embedding example<\/h2>\n<pre><code class=\"language-rust\">use perfscale_core::runner::{self, ExecutionPlan};\nuse perfscale_core::yaml;\n\nlet test = yaml::parse_test_file(&amp;std::fs::read_to_string(\"test.yaml\")?)?;\nlet config = yaml::parse_config_file(&amp;std::fs::read_to_string(\"config.yaml\")?)?;\n\nlet rx = runner::execute(ExecutionPlan::NativeSteps {\n    test,\n    config: config.run,\n    before: config.before,\n    after: config.after,\n    variables: config.variables,\n    quiet: false,\n})\n.await?;\nwhile let Some(line) = rx.lines.recv().await {\n    println!(\"[{:?}] {}\", line.source, line.text);\n}\n<\/code><\/pre>\n<h2>Design constraints<\/h2>\n<ul>\n<li><strong>No proprietary integrations.<\/strong> Everything here is generic; control-plane\nconcerns (auth, metric push, fleet management) belong to downstream\nconsumers of this crate.<\/li>\n<li><strong>External engines are subprocesses, not linked.<\/strong> k6 and locust are found\non <code>PATH<\/code> at run time; a missing binary is a friendly error, not a build\ndependency.<\/li>\n<li><strong>Bounded channels (512 lines).<\/strong> Producers block when a consumer stalls —\ndrain the receiver concurrently with the run (as <code>execute()<\/code> does), never\nafter it.<\/li>\n<\/ul>\n","html_ru":"<h1>Архитектура<\/h1>\n<p><code>perfscale-core<\/code> — это библиотечный crate: всё, что умеет CLI, доступно\nлюбой программе на Rust, в которую нужно встроить движок нагрузочного\nтестирования.<\/p>\n<pre><code class=\"language-text\">                        ┌─────────────────────────────────────┐\n CLI flags ──────────►  │            ExecutionPlan            │\n                        │  K6Script | LocustScript | Native   │\n                        └──────────────────┬──────────────────┘\n                                           │ runner::execute(plan)\n              ┌────────────────────────────┼────────────────────────────┐\n              ▼                            ▼                            ▼\n      runner::k6                   runner::locust               step::runner\n   spawn `k6 run`,             spawn `locust --headless`,    N tokio tasks (VUs)\n   stream stdout/err           stream + parse CSV stats      loop over steps\n              │                            │                            │\n              └────────────────────────────┴────────────────────────────┘\n                                           │\n                                           ▼\n                          mpsc::Receiver&lt;LogLine&gt;\n                     { source: stdout|stderr|system, text }\n<\/code><\/pre>\n<h2>Единственная важная абстракция: <code>LogLine<\/code><\/h2>\n<p>Каждый движок — и внешний подпроцесс, и внутрипроцессный — сводится к одному\nи тому же типу вывода:<\/p>\n<pre><code class=\"language-rust\">pub struct LogLine {\n    pub source: LogSource,   // Stdout | Stderr | System\n    pub text: String,\n}\n<\/code><\/pre>\n<p>Потребители (CLI, <code>perfscale serve<\/code>, будущий TUI) никогда не задумываются о\nтом, какой движок породил строку. Поток закрывается по завершении прогона —\nотдельного сигнала о завершении нет.<\/p>\n<h2>Единый формат сводки<\/h2>\n<p>Все три движка завершают свой поток одинаковым блоком сводки в стиле k6\n(<code>http_req_duration<\/code>, <code>http_req_failed<\/code>, <code>http_reqs<\/code>, <code>vus<\/code>, <code>iterations<\/code>),\nпоэтому последующие парсеры не зависят от движка:<\/p>\n<ul>\n<li>нативный движок форматирует её из собственных собранных метрик\n(<code>step::runner::Metrics::summary_lines<\/code>)<\/li>\n<li>раннер locust строит её из файла статистики locust <code>--csv<\/code><\/li>\n<li>k6 печатает её
