 сам<\/li>\n<\/ul>\n<h2>Карта модулей<\/h2>\n<table><thead><tr><th>Модуль<\/th><th>Ответственность<\/th><\/tr><\/thead><tbody>\n<tr><td><code>runner<\/code><\/td><td><code>ExecutionPlan<\/code>, диспетчер <code>execute()<\/code>, <code>LogLine<\/code>/<code>LogSource<\/code><\/td><\/tr>\n<tr><td><code>runner::k6<\/code><\/td><td>подпроцесс k6: работа с временными скриптами, стриминг, oneshot<\/td><\/tr>\n<tr><td><code>runner::locust<\/code><\/td><td>подпроцесс locust: headless-флаги, преобразование CSV → сводка<\/td><\/tr>\n<tr><td><code>step<\/code><\/td><td>модель теста: <code>TestDef<\/code>, <code>Step<\/code>, <code>RunConfig<\/code>, парсинг длительности, пресеты<\/td><\/tr>\n<tr><td><code>step::runner<\/code><\/td><td>нативный планировщик VU и сбор метрик<\/td><\/tr>\n<tr><td><code>step::actions<\/code><\/td><td>диспетчеризация встроенных действий (<code>std/*<\/code>) + реестр пользовательских действий<\/td><\/tr>\n<tr><td><code>step::http<\/code><\/td><td><code>std/http@v1<\/code> + общий HTTP-транспорт (пулы клиентов, замеренный обмен, отчётность)<\/td><\/tr>\n<tr><td><code>step::context<\/code><\/td><td>хранилище переменных отдельного VU + интерполяция <code>${{ }}<\/code><\/td><\/tr>\n<tr><td><code>step::resources<\/code><\/td><td>типы хендлов семейств + кэш gRPC reflection поверх реестров соединений<\/td><\/tr>\n<tr><td><code>step::ws<\/code> / <code>step::grpc<\/code> / <code>step::db<\/code><\/td><td>протокольные семейства живых соединений<\/td><\/tr>\n<tr><td><code>step::graphql<\/code><\/td><td><code>std/graphql@v1<\/code>: GraphQL по HTTP + валидация схемы через introspection/SDL<\/td><\/tr>\n<tr><td><code>step::thresholds<\/code><\/td><td>SLO-гейты уровня прогона <code>std/thresholds@v1<\/code><\/td><\/tr>\n<tr><td><code>step::process<\/code><\/td><td>управляемые дочерние процессы (<code>std/child_process<\/code>, <code>std/kill_process<\/code>)<\/td><\/tr>\n<tr><td><code>yaml<\/code><\/td><td>парсинг файлов теста/конфига с валидацией по схеме, <code>ConfigFile<\/code><\/td><\/tr>\n<tr><td><code>schema<\/code><\/td><td>генерация JSON Schema (schemars) для обоих форматов файлов<\/td><\/tr>\n<tr><td><code>models<\/code><\/td><td><code>RunResult<\/code> (результат oneshot-подпроцесса)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Соседний crate в воркспейсе: <strong><code>perfscale-connection<\/code><\/strong> — обобщённый\nреестр именованных соединений (трейт <code>Connection<\/code> + <code>ConnectionRegistry<\/code>),\nна котором строится <code>step::resources<\/code>. Ноль зависимостей; пригоден для\nлюбого движка шагов с жизненным циклом connect → park → use → close.<\/p>\n<h2>Конвейер нативного движка<\/h2>\n<p>Нативный прогон проходит через эти компоненты по порядку:<\/p>\n<pre><code class=\"language-text\"> test.yaml + config.yaml (step::yaml, schema-validated)\n        │  steps, before/after, vars, run config (vus, duration)\n        ▼\n step::runner::run_native ── before: steps once (outputs → ${{ config.* }})\n        │\n        │  spawn config.vus tokio tasks, each loops until duration expires:\n        ▼\n step::context::Context     per VU: vars + ${{ }} interpolation,\n        │                   per-VU generator, HTTP client shard\n        ▼\n step::actions::execute_action   per step, strictly sequential:\n        │   std/http·tcp·udp·ws*·grpc*·db-*·check·sleep·log·file-*·…\n        ▼\n step::resources            live handles parked under Connection IDs\n        │   (ws-1, grpc-1, grpcs-1, db-1) via perfscale-connection;\n        │   drained after every iteration — nothing outlives it\n        ▼\n step::runner::Metrics      HDR histograms (fixed memory), counters,\n        │                   rates, threshold results\n        ▼\n summary + thresholds       k6-compatible text summary streamed as\n        │                   LogLines; NativeRunOutcome.thresholds\n        ▼\n CLI exit code              non-zero when a severity:fail gate trips\n<\/code><\/pre>\n<p>Где подключаются расширения:<\/p>\n<ul>\n<li><strong>k6 / locust<\/strong> — это соседние <em>движки<\/em>, а не шаги: <code>runner::execute<\/code>\nдиспетчеризует <code>ExecutionPlan<\/code> их раннерам подпроцессов, которые сводятся\nк тому же потоку <code>LogLine<\/code> (диаграмма выше).<\/li>\n<li><strong>Семейства gRPC / WebSocket / DB<\/strong> подключаются как действия <code>std/*<\/code> в\n<code>step::actions<\/code>, а их живые хендлы паркуются в <code>step::resources<\/code>\n(на базе crate <code>perfscale-connection<\/code>) — шаги подключения создают\nидентификаторы <code>ws-1<\/code> / <code>grpc-1<\/code> / <code>db-1<\/code>, на которые пользователь\nссылается в последующих шагах.<\/li>\n<li><strong>Пороги (thresholds)<\/strong> выполняются как шаги <code>std/thresholds@v1<\/code> в блоке\n<code>after:<\/code>, оценивая гейты по метрикам, собранным за прогон\n(<code>step::thresholds<\/code>); объединённый результат становится кодом выхода CLI.<\/li>\n<li><strong>Пользовательские действия<\/strong> (например, downstream <code>pro/*<\/code>) регистрируют\n<code>ActionHandler<\/code> через <code>step::actions::register_action<\/code> и могут использовать\n<code>perfscale-connection<\/code> для собственных припаркованных хендлов.<\/li>\n<\/ul>\n<p>Ключевые файлы — по одной строке на каждый:<\/p>\n<table><thead><tr><th>Файл<\/th><th>Роль<\/th><\/tr><\/thead><tbody>\n<tr><td><code>crates/perfscale-core/src/runner/mod.rs<\/code><\/td><td>диспетчеризация движков, <code>LogLine<\/code><\/td><\/tr>\n<tr><td><code>crates/perfscale-core/src/step/runner.rs<\/code><\/td><td>цикл VU, HDR-метрики, сводка, источник кода выхода<\/td><\/tr>\n<tr><td><code>crates/perfscale-core/src/step/context.rs<\/code><\/td><td>интерполяция <code>${{ }}<\/code>, состояние отдельного VU<\/td><\/tr>\n<tr><td><code>crates/perfscale-core/src/step/actions.rs<\/code><\/td><td>диспетчеризация действий <code>std/*<\/code><\/td><\/tr>\n<tr><td><code>crates/perfscale-core/src/step/resources.rs<\/code><\/td><td>типы хендлов семейств, связка с реестром<\/td><\/tr>\n<tr><td><code>crates/perfscale-connection/src/lib.rs<\/code><\/td><td>паттерн реестра соединений, с документацией<\/td><\/tr>\n<tr><td><code>crates/perfscale-cli/src/main.rs<\/code><\/td><td>CLI: парсинг аргументов, запуск плана, печать потока, код выхода<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Пример встраивания<\/h2>\n<pre><code class=\"language-rust\">use perfscale_core::runner::{self, ExecutionPlan};\nuse perfscale_core::yaml;\n\nlet test = yaml::parse_test_file(&amp;std::fs::read_to_string(\"test.yaml\")?)?;\nlet config = yaml::parse_config_file(&amp;std::fs::read_to_string(\"config.yaml\")?)?;\n\nlet rx = runner::execute(ExecutionPlan::NativeSteps {\n    test,\n    config: config.run,\n    before: config.before,\n    after: config.after,\n    variables: config.variables,\n    quiet: false,\n})\n.await?;\nwhile let Some(line) = rx.lines.recv().await {\n    println!(\"[{:?}] {}\", line.source, line.text);\n}\n<\/code><\/pre>\n<h2>Архитектурные ограничения<\/h2>\n<ul>\n<li><strong>Никаких проприетарных интеграций.<\/strong> Всё здесь универсально; задачи\ncontrol plane (аутентификация, пуш метрик, управление флитом) относятся\nк downstream-потребителям этого crate.<\/li>\n<li><strong>Внешние движки — подпроцессы, а не линкуемые зависимости.<\/strong> k6 и locust\nищутся в <code>PATH<\/code> во время выполнения; отсутствующий бинарник — это\nпонятная ошибка, а не зависимость сборки.<\/li>\n<li><strong>Ограниченные каналы (512 строк).<\/strong> Производители блокируются, когда\nпотребитель не успевает, — вычитывайте ресивер параллельно с прогоном\n(как делает <code>execute()<\/code>), а не после него.<\/li>\n<\/ul>\n","slug":"core/architecture","title":"Architecture"},{"group":"core","html_en":"<h1>Running perfscale in Docker<\/h1>\n<p>perfscale publishes ready-to-run images to the GitHub Container Registry on\nevery release — no install, no Rust toolchain, no runner binaries to manage.\nMount your scenarios into the container and run:<\/p>\n<pre><code class=\"language-sh\">docker run --rm -v \"$PWD:/work\" -w /work ghcr.io/perfscale/perfscale:latest \\\n  run -f test.yaml -c config.yaml\n<\/code><\/pre>\n<p>Everything after the image name is passed straight to the <code>perfscale<\/code> CLI\n(the image entrypoint is <code>perfscale<\/code>), so every command and flag works the\nsame as a local install: <code>run<\/code>, <code>lint<\/code>, <code>serve<\/code>, <code>man<\/code>, <code>--help<\/code>.<\/p>\n<h2>Flavors<\/h2>\n<table><thead><tr><th>Image<\/th><th>Contents<\/th><th>Use it for<\/th><\/tr><\/thead><tbody>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;<\/code><\/td><td>perfscale only (~50 MB)<\/td><td>Native step-engine scenarios (<code>-f<\/code>/<code>-c<\/code>)<\/td><\/tr>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;-k6<\/code><\/td><td>+ k6<\/td><td>Existing k6 scripts (<code>--k6<\/code>)<\/td><\/tr>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;-jmeter<\/code><\/td><td>+ JMeter (headless JRE)<\/td><td>Existing <code>.jmx<\/code> plans (<code>--jmeter<\/code>)<\/td><\/tr>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;-locust<\/code><\/td><td>+ locust (Python)<\/td><td>Existing locust files (<code>--locust<\/code>)<\/td><\/tr>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;-full<\/code><\/td><td>+ k6, JMeter, locust<\/td><td>Everything<\/td><\/tr>\n<\/tbody><\/table>\n<p>All flavors are multi-arch (<code>linux/amd64<\/code> and <code>linux/arm64<\/code>) and are tagged\n<code>X.Y.Z<\/code>, <code>X.Y<\/code>, and <code>latest<\/code> (runner flavors use the same tags with their\nsuffix: <code>latest-k6<\/code>, <code>latest-jmeter<\/code>, <code>latest-locust<\/code>, <code>latest-full<\/code>).\nRunner versions are pinned in the image (k6, JMeter, locust — see\n<code>docker/image.Dockerfile<\/code> for the exact pins). Pin an exact perfscale\nversion in CI — treat <code>latest<\/code> as a convenience for local use.<\/p>\n<p>Need a different tool stack? Build on top of any flavor — see\n<a href=\"#extending-the-image\">Extending the image<\/a>.<\/p>\n<h2>Mounting scenarios<\/h2>\n<p>The container runs as a non-root user (<code>perfscale<\/code>, uid 10001) with no\nworking directory of its own, so the standard pattern is a bind mount:<\/p>\n<pre><code class=\"language-sh\"># Scenarios live in the current directory\ndocker run --rm -v \"$PWD:/work\" -w /work ghcr.io/perfscale/perfscale:latest \\\n  run -f test.yaml -c config.yaml\n\n# Read-only mount is fine for running tests\ndocker run --rm -v \"$PWD:/work:ro\" -w /work ghcr.io/perfscale/perfscale:latest \\\n  lint test.yaml\n<\/code><\/pre>\n<p>The bind mount is owned by your host user, so anything perfscale <em>writes<\/em>\n(<code>--summary-export<\/code>, <code>std/file-write@v1<\/code>) lands as the container's uid\n10001. To keep files owned by you, run with your own uid and a writable\nmount:<\/p>\n<pre><code class=\"language-sh\">docker run --rm --user \"$(id -u):$(id -g)\" -v \"$PWD:/work\" -w /work \\\n  ghcr.io/perfscale/perfscale:latest run -f test.yaml -c config.yaml \\\n  --summary-export summary.json\n<\/code><\/pre>\n<p>Secrets and configuration go through the same mechanisms as a local install\n— pass environment variables with <code>-e<\/code> (<code>-e API_TOKEN=...<\/code>) and reference\nthem as <code>${{ env.API_TOKEN }}<\/code> in the scenario.<\/p>\n<h2>WASM libraries<\/h2>\n<p><code>${alias.fn(...)}<\/code> libraries (RFC 005) work in the container — WASM support\nis always compiled into the engine. What to mount depends on the source:<\/p>\n<p><strong>Local components<\/strong> (<code>use: ./libs/fixer-ids.wasm<\/code>) need nothing extra:\npaths resolve relative to the declaring file, so the usual <code>$PWD:/work<\/code>\nmount covers them as long as the relative layout is preserved. A library\ngranted <code>capabilities: [fs]<\/code> gets a read-only preopen of the run's\n<code>fs_root<\/code> — by default the config file's directory, i.e. inside <code>/work<\/code>.<\/p>\n<p><strong>Remote components<\/strong> (<code>https://…<\/code>, <code>git+…<\/code>) are fetched only by\n<code>perfscale install<\/code>, which writes <code>perfscale.lock<\/code> next to the config (in\nthe mount) but the artifact cache to the host's <code>~/.cache/perfscale<\/code>. Keep\nthe cache inside the mounted directory so host and container agree:<\/p>\n<pre><code class=\"language-sh\"># host: install into a project-local cache (perfscale.lock lands next to the config)\nPERFSCALE_CACHE_DIR=\"$PWD/.perfscale-cache\" perfscale install test.yaml config.yaml\n\n# container: same cache dir, fully offline run\ndocker run --rm -v \"$PWD:/work\" -w /work \\\n  -e PERFSCALE_CACHE_DIR=/work/.perfscale-cache \\\n  ghcr.io/perfscale/perfscale:latest run -f test.yaml -c config.yaml\n<\/code><\/pre>\n<p><code>install<\/code> also <em>burns<\/em> (AOT-precompiles) every library — remote or local —\ninto the cache as <code>&lt;sha256&gt;.cwasm<\/code> next to the <code>.wasm<\/code> artifact, so\ncontainerized runs skip per-run Cranelift compilation too: the engine\ndeserializes the precompiled artifact in milliseconds instead of compiling\nthe component at load. The install-time burn is advisory — a precompile\nfailure downgrades to a warning, never a failed install — and a run without\na valid <code>.cwasm<\/code> falls back to compiling from the <code>.wasm<\/code> source at load\n(the JIT path: slower cold start, identical behavior and metrics once\nrunning). A stale artifact (burned by an older perfscale build — the header\ncarries the wasmtime version and target triple) is ignored the same way, so\nre-run <code>install<\/code> after upgrading the image. For all of this the cache\ndirectory must be shared between the install and the run, as above.<\/p>\n<p><strong>Standalone binaries<\/strong> — <code>perfscale burn<\/code> goes further and embeds a\nscenario's libraries into a copy of the binary itself (AOT artifacts behind\na <code>PFSEMBED<\/code> trailer), so nothing has to be mounted besides the YAML:<\/p>\n<pre><code class=\"language-sh\"># on the host (match the target architecture), then ship one file:\nperfscale burn -f test.yaml -c config.yaml -o perfscale+libs\n<\/code><\/pre>\n<p>The derived binary needs no <code>.wasm<\/code> files, cache, or <code>perfscale.lock<\/code> on the\nmachine it runs on — see <a href=\"#/docs/cli/commands\"><code>perfscale burn<\/code><\/a>.<\/p>\n<h2>External runners (k6 / JMeter / locust)<\/h2>\n<p>The runner flavors ship the matching engine, so existing scripts and plans\nrun without any host install:<\/p>\n<pre><code class=\"language-sh\"># k6\ndocker run --rm -v \"$PWD:/work\" -w /work \\\n  ghcr.io/perfscale/perfscale:latest-k6 run --k6 script.js\n\n# JMeter (.jmx plans)\ndocker run --rm -v \"$PWD:/work\" -w /work \\\n  ghcr.io/perfscale/perfscale:latest-jmeter run --jmeter plan.jmx\n\n# locust\ndocker run --rm -v \"$PWD:/work\" -w /work \\\n  ghcr.io/perfscale/perfscale:latest-locust run --locust locustfile.py --host https://example.com\n<\/code><\/pre>\n<p>The <code>-full<\/code> image carries all three — use it when one job runs several\nengines, or when you don't want to think about which flavor a script needs.<\/p>\n<h2>In CI<\/h2>\n<h3>GitHub Actions<\/h3>\n<pre><code class=\"language-yaml\">jobs:\n  load:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v5\n      - name: Run load test\n        run: |\n          docker run --rm -v \"$PWD:/work\" -w /work \\\n            ghcr.io/perfscale/perfscale:0.17.0 \\\n            run -f load.test.yaml -c load.config.yaml\n<\/code><\/pre>\n<p>Threshold gates (<code>std/thresholds@v1<\/code>) make the container exit non-zero on\nSLO violations, so the step fails the job the same way a local run would.<\/p>\n<h3>Kubernetes<\/h3>\n<pre><code class=\"language-yaml\">apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: perfscale-load\nspec:\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n        - name: perfscale\n          image: ghcr.io/perfscale/perfscale:0.17.0\n          args: [\"run\", \"-f\", \"/scenarios/load.test.yaml\", \"-c\", \"/scenarios/load.config.yaml\"]\n          volumeMounts:\n            - name: scenarios\n              mountPath: /scenarios\n      volumes:\n        - name: scenarios\n          configMap:\n            name: perfscale-scenarios\n<\/code><\/pre>\n<h2>Extending the image<\/h2>\n<p>Need extra tooling the flavors don't carry — JMeter plugins, custom CA\ncertificates, another k6 build? Use any flavor as a base — the binaries\nstay put, you add what you need:<\/p>\n<pre><code class=\"language-dockerfile\">FROM ghcr.io/perfscale/perfscale:0.17.0-jmeter\n\nUSER root\n# Example: JMeter plugins land in lib/ext of the installation\nRUN curl -fsSL -o /opt/apache-jmeter-5.6.3/lib/ext/jpgc-casutg.jar \\\n      https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-casutg/2.10/jmeter-plugins-casutg-2.10.jar\nUSER perfscale\n<\/code><\/pre>\n<h2>Verifying a release image<\/h2>\n<p>Images are built from the same static musl binaries published on GitHub\nReleases, and the release workflow smoke-tests every flavor before it goes\nlive: a real native-engine scenario in slim, and each runner binary\nstarting (<code>k6 version<\/code>, <code>jmeter --version<\/code>, <code>locust --version<\/code>) in its\nflavor and in <code>-full<\/code>. To double-check locally:<\/p>\n<pre><code class=\"language-sh\">docker run --rm ghcr.io/perfscale/perfscale:0.17.0 --version\ndocker run --rm --entrypoint k6 ghcr.io/perfscale/perfscale:0.17.0-k6 version\n<\/code><\/pre>\n<h2>Kubernetes<\/h2>\n<p>The platform agent (perfscaled) ships as a Helm chart in\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/charts\">Perfscale/charts<\/a>: a DaemonSet that\nruns one agent per node (<code>ghcr.io<\/code> image, non-root, read-only root\nfilesystem, secret via <code>existingSecret<\/code>). The agent self-registers with the\ncontrolplane and picks up tasks.<\/p>\n<pre><code class=\"language-sh\">helm install perfscaled oci://ghcr.io/perfscale/charts/perfscaled \\\n  --set-file secret...  # or --set existingSecret=perfscaled-env\n<\/code><\/pre>\n<p>Chart notes:<\/p>\n<ul>\n<li><code>readOnlyRootFilesystem: true<\/code> — writable paths come from volumes. The\nlibrary cache (RFC 005) lives on a dedicated <code>library-cache<\/code> volume\n(default <code>emptyDir<\/code>, switch to <code>hostPath<\/code> in <code>values.yaml<\/code> to survive pod\nreschedules) mounted at <code>/var/lib/perfscale/cache<\/code>, wired as\n<code>PERFSCALE_CACHE_DIR<\/code> — so libraries installed via\n<code>perfscaled library install<\/code> / <code>POST /api/v1/libraries/install<\/code> persist\nacross container restarts.<\/li>\n<li>Fleet library policy is set on the agent's env: <code>PERFSCALE_LIBRARY_CAPABILITIES<\/code>\n(fleet ceiling, default: none) and <code>PERFSCALE_LIBRARY_ALLOW_DIGESTS<\/code>\n(optional sha256 allowlist) — the agent intersects them with every task's\ngrants and rejects exceeding tasks with a validation error.<\/li>\n<\/ul>\n<p>For one-shot load runs in a cluster (no agent), the engine images above run\nfine as a <a target=\"_blank\" rel=\"noopener\" href=\"https://kubernetes.io/docs/concepts/workloads/controllers/job/\">Job<\/a>:\nmount the scenario via a ConfigMap/PVC and use the image entrypoint as in the\nexamples here.<\/p>\n<h2>Limits<\/h2>\n<ul>\n<li><strong>Runner versions are pinned<\/strong> — to run a different k6/JMeter/locust\nversion, extend the image (above).<\/li>\n<li><strong>JMeter writes <code>jmeter.log<\/code> (and any <code>.jtl<\/code> results) into the working\ndirectory<\/strong> — give it a writable mount (<code>-v \"$PWD:/work\" -w /work<\/code>, or\n<code>--user \"$(id -u):$(id -g)\"<\/code> to keep files owned by you).<\/li>\n<li><strong><code>perfscale serve<\/code> needs a published port<\/strong>: add <code>-p 7999:7999<\/code> and POST\nreports to the container's address, not <code>localhost<\/code>.<\/li>\n<li><strong>File actions are container-scoped<\/strong>: <code>std/file-read@v1<\/code>/<code>std/file-write@v1<\/code>\nsee the container filesystem — bind-mount what the scenario needs.<\/li>\n<\/ul>\n","html_ru":"<h1>Запуск perfscale в Docker<\/h1>\n<p>perfscale публикует готовые к запуску образы в GitHub Container Registry при\nкаждом релизе — без установки, без тулчейна Rust, без необходимости управлять\nбинарниками раннеров. Смонтируйте свои сценарии в контейнер и запустите:<\/p>\n<pre><code class=\"language-sh\">docker run --rm -v \"$PWD:/work\" -w /work ghcr.io/perfscale/perfscale:latest \\\n  run -f test.yaml -c config.yaml\n<\/code><\/pre>\n<p>Всё, что идёт после имени образа, передаётся напрямую в CLI <code>perfscale<\/code>\n(entrypoint образа — <code>perfscale<\/code>), поэтому все команды и флаги работают так\nже, как при локальной установке: <code>run<\/code>, <code>lint<\/code>, <code>serve<\/code>, <code>man<\/code>, <code>--help<\/code>.<\/p>\n<h2>Варианты образов<\/h2>\n<table><thead><tr><th>Образ<\/th><th>Состав<\/th><th>Для чего использовать<\/th><\/tr><\/thead><tbody>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;<\/code><\/td><td>только perfscale (~50 МБ)<\/td><td>Сценарии на нативном движке шагов (<code>-f<\/code>/<code>-c<\/code>)<\/td><\/tr>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;-k6<\/code><\/td><td>+ k6<\/td><td>Существующие скрипты k6 (<code>--k6<\/code>)<\/td><\/tr>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;-jmeter<\/code><\/td><td>+ JMeter (headless JRE)<\/td><td>Существующие <code>.jmx<\/code>-планы (<code>--jmeter<\/code>)<\/td><\/tr>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;-locust<\/code><\/td><td>+ locust (Python)<\/td><td>Существующие locust-файлы (<code>--locust<\/code>)<\/td><\/tr>\n<tr><td><code>ghcr.io/perfscale/perfscale:&lt;version&gt;-full<\/code><\/td><td>+ k6, JMeter, locust<\/td><td>Всё сразу<\/td><\/tr>\n<\/tbody><\/table>\n<p>Все варианты мультиархитектурные (<code>linux/amd64<\/code> и <code>linux/arm64<\/code>) и помечаются\nтегами <code>X.Y.Z<\/code>, <code>X.Y<\/code> и <code>latest<\/code> (варианты с раннерами используют те же теги\nсо своим суффиксом: <code>latest-k6<\/code>, <code>latest-jmeter<\/code>, <code>latest-locust<\/code>,\n<code>latest-full<\/code>). Версии раннеров зафиксированы в образе (k6, JMeter, locust —\nточные версии см. в <code>docker/image.Dockerfile<\/code>). В CI фиксируйте точную версию\nperfscale — считайте <code>latest<\/code> удобством для локального использования.<\/p>\n<p>Нужен другой набор инструментов? Соберите образ поверх любого варианта — см.\n<a href=\"#%D1%80%D0%B0%D1%81%D1%88%D0%B8%D1%80%D0%B5%D0%BD%D0%B8%D0%B5-%D0%BE%D0%B1%D1%80%D0%B0%D0%B7%D0%B0\">Расширение образа<\/a>.<\/p>\n<h2>Монтирование сценариев<\/h2>\n<p>Контейнер работает под непривилегированным пользователем (<code>perfscale<\/code>, uid\n10001) и не имеет собственной рабочей директории, поэтому стандартный паттерн —\nbind-монтирование:<\/p>\n<pre><code class=\"language-sh\"># Scenarios live in the current directory\ndocker run --rm -v \"$PWD:/work\" -w /work ghcr.io/perfscale/perfscale:latest \\\n  run -f test.yaml -c config.yaml\n\n# Read-only mount is fine for running tests\ndocker run --rm -v \"$PWD:/work:ro\" -w /work ghcr.io/perfscale/perfscale:latest \\\n  lint test.yaml\n<\/code><\/pre>\n<p>Bind-монтирование принадлежит вашему пользователю на хосте, поэтому всё, что\nperfscale <em>записывает<\/em> (<code>--summary-export<\/code>, <code>std/file-write@v1<\/code>), создаётся от\nuid 10001 контейнера. Чтобы файлы оставались вашими, запускайте со своим uid и\nмонтированием, доступным на запись:<\/p>\n<pre><code class=\"language-sh\">docker run --rm --user \"$(id -u):$(id -g)\" -v \"$PWD:/work\" -w /work \\\n  ghcr.io/perfscale/perfscale:latest run -f test.yaml -c config.yaml \\\n  --summary-export summary.json\n<\/code><\/pre>\n<p>Секреты и конфигурация передаются теми же механизмами, что и при локальной\nустановке, — передавайте переменные окружения через <code>-e<\/code>\n(<code>-e API_TOKEN=...<\/code>) и ссылайтесь на них как <code>${{ env.API_TOKEN }}<\/code> в сценарии.<\/p>\n<h2>WASM-библиотеки<\/h2>\n<p>Библиотеки <code>${alias.fn(...)}<\/code> (RFC 005) работают в контейнере — поддержка WASM\nвсегда вкомпилирована в движок. Что монтировать, зависит от источника:<\/p>\n<p><strong>Локальные компоненты<\/strong> (<code>use: ./libs/fixer-ids.wasm<\/code>) не требуют ничего\nдополнительного: пути разрешаются относительно объявляющего файла, поэтому\nобычного монтирования <code>$PWD:/work<\/code> достаточно, если сохранена относительная\nструктура каталогов. Библиотека с <code>capabilities: [fs]<\/code> получает preopen только\nна чтение для <code>fs_root<\/code> запуска — по умолчанию это директория файла\nконфигурации, то есть внутри <code>/work<\/code>.<\/p>\n<p><strong>Удалённые компоненты<\/strong> (<code>https://…<\/code>, <code>git+…<\/code>) скачиваются только командой\n<code>perfscale install<\/code>, которая записывает <code>perfscale.lock<\/code> рядом с конфигом (в\nсмонтированной директории), а кэш артефактов — в <code>~/.cache/perfscale<\/code> на хосте.\nДержите кэш внутри смонтированной директории, чтобы хост и контейнер\nсогласовывались между собой:<\/p>\n<pre><code class=\"language-sh\"># host: install into a project-local cache (perfscale.lock lands next to the config)\nPERFSCALE_CACHE_DIR=\"$PWD/.perfscale-cache\" perfscale install test.yaml config.yaml\n\n# container: same cache dir, fully offline run\ndocker run --rm -v \"$PWD:/work\" -w /work \\\n  -e PERFSCALE_CACHE_DIR=/work/.perfscale-cache \\\n  ghcr.io/perfscale/perfscale:latest run -f test.yaml -c config.yaml\n<\/code><\/pre>\n<p><code>install<\/code> также <em>прожигает<\/em> (AOT-прекомпилирует) каждую библиотеку — удалённую\nили локальную — в кэш как <code>&lt;sha256&gt;.cwasm<\/code> рядом с <code>.wasm<\/code>-артефактом, поэтому\nконтейнерные запуски пропускают и компиляцию Cranelift при каждом запуске:\nдвижок десериализует прекомпилированный артефакт за миллисекунды вместо\nкомпиляции компонента при загрузке. Прожиг при установке — рекомендательный:\nошибка прекомпиляции понижается до предупреждения, но никогда не приводит к\nнеудачной установке, — а запуск без валидного <code>.cwasm<\/code> откатывается к\nкомпиляции из <code>.wasm<\/code>-исходника при загрузке (JIT-путь: более медленный\nхолодный старт, идентичное поведение и метрики после запуска). Устаревший\nартефакт (прожжённый более старой сборкой perfscale — в заголовке записаны\nверсия wasmtime и целевой триплет) игнорируется таким же образом, поэтому\nпосле обновления образа повторите <code>install<\/code>. Для всего этого директория кэша\nдолжна быть общей между установкой и запуском, как показано выше.<\/p>\n<p><strong>Автономные бинарники<\/strong> — <code>perfscale burn<\/code> идёт дальше и встраивает\nбиблиотеки сценария в копию самого бинарника (AOT-артефакты за трейлером\n<code>PFSEMBED<\/code>), так что монтировать не нужно ничего, кроме YAML:<\/p>\n<pre><code class=\"language-sh\"># on the host (match the target architecture), then ship one file:\nperfscale burn -f test.yaml -c config.yaml -o perfscale+libs\n<\/code><\/pre>\n<p>Производному бинарнику не нужны <code>.wasm<\/code>-файлы, кэш или <code>perfscale.lock<\/code> на\nмашине, где он запускается, — см. <a href=\"#/docs/cli/commands\"><code>perfscale burn<\/code><\/a>.<\/p>\n<h2>Внешние раннеры (k6 / JMeter / locust)<\/h2>\n<p>Варианты с раннерами содержат соответствующий движок, поэтому существующие\nскрипты и планы запускаются без какой-либо установки на хосте:<\/p>\n<pre><code class=\"language-sh\"># k6\ndocker run --rm -v \"$PWD:/work\" -w /work \\\n  ghcr.io/perfscale/perfscale:latest-k6 run --k6 script.js\n\n# JMeter (.jmx plans)\ndocker run --rm -v \"$PWD:/work\" -w /work \\\n  ghcr.io/perfscale/perfscale:latest-jmeter run --jmeter plan.jmx\n\n# locust\ndocker run --rm -v \"$PWD:/work\" -w /work \\\n  ghcr.io/perfscale/perfscale:latest-locust run --locust locustfile.py --host https://example.com\n<\/code><\/pre>\n<p>Образ <code>-full<\/code> содержит все три — используйте его, когда в одной задаче\nзапускается несколько движков или когда вы не хотите задумываться, какой\nвариант нужен скрипту.<\/p>\n<h2>В CI<\/h2>\n<h3>GitHub Actions<\/h3>\n<pre><code class=\"language-yaml\">jobs:\n  load:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v5\n      - name: Run load test\n        run: |\n          docker run --rm -v \"$PWD:/work\" -w /work \\\n            ghcr.io/perfscale/perfscale:0.17.0 \\\n            run -f load.test.yaml -c load.config.yaml\n<\/code><\/pre>\n<p>Пороговые проверки (<code>std/thresholds@v1<\/code>) заставляют контейнер завершаться с\nненулевым кодом при нарушениях SLO, поэтому шаг проваливает задачу так же, как\nэто сделал бы локальный запуск.<\/p>\n<h3>Kubernetes<\/h3>\n<pre><code class=\"language-yaml\">apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: perfscale-load\nspec:\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n        - name: perfscale\n          image: ghcr.io/perfscale/perfscale:0.17.0\n          args: [\"run\", \"-f\", \"/scenarios/load.test.yaml\", \"-c\", \"/scenarios/load.config.yaml\"]\n          volumeMounts:\n            - name: scenarios\n              mountPath: /scenarios\n      volumes:\n        - name: scenarios\n          configMap:\n            name: perfscale-scenarios\n<\/code><\/pre>\n<h2>Расширение образа<\/h2>\n<p>Нужны дополнительные инструменты, которых нет в вариантах, — плагины JMeter,\nсобственные CA-сертификаты, другая сборка k6? Используйте любой вариант как\nбазовый — бинарники остаются на месте, вы добавляете то, что нужно:<\/p>\n<pre><code class=\"language-dockerfile\">FROM ghcr.io/perfscale/perfscale:0.17.0-jmeter\n\nUSER root\n# Example: JMeter plugins land in lib/ext of the installation\nRUN curl -fsSL -o /opt/apache-jmeter-5.6.3/lib/ext/jpgc-casutg.jar \\\n      https://repo1.maven.org/maven2/kg/apc/jmeter-plugins-casutg/2.10/jmeter-plugins-casutg-2.10.jar\nUSER perfscale\n<\/code><\/pre>\n<h2>Проверка релизного образа<\/h2>\n<p>Образы собираются из тех же статических musl-бинарников, что публикуются в\nGitHub Releases, а релизный workflow перед публикацией проводит смоук-тесты\nкаждого варианта: реальный сценарий на нативном движке в slim-образе и запуск\nкаждого бинарника раннера (<code>k6 version<\/code>, <code>jmeter --version<\/code>,\n<code>locust --version<\/code>) в его варианте и в <code>-full<\/code>. Чтобы перепроверить локально:<\/p>\n<pre><code class=\"language-sh\">docker run --rm ghcr.io/perfscale/perfscale:0.17.0 --version\ndocker run --rm --entrypoint k6 ghcr.io/perfscale/perfscale:0.17.0-k6 version\n<\/code><\/pre>\n<h2>Kubernetes<\/h2>\n<p>Платформенный агент (perfscaled) поставляется как Helm-чарт в\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/charts\">Perfscale/charts<\/a>: DaemonSet, запускающий\nпо одному агенту на узел (образ <code>ghcr.io<\/code>, непривилегированный пользователь,\nкорневая файловая система только для чтения, секрет через <code>existingSecret<\/code>).\nАгент самостоятельно регистрируется в controlplane и забирает задачи.<\/p>\n<pre><code class=\"language-sh\">helm install perfscaled oci://ghcr.io/perfscale/charts/perfscaled \\\n  --set-file secret...  # or --set existingSecret=perfscaled-env\n<\/code><\/pre>\n<p>Примечания к чарту:<\/p>\n<ul>\n<li><code>readOnlyRootFilesystem: true<\/code> — пути, доступные на запись, предоставляются\nчерез тома. Кэш библиотек (RFC 005) размещается на выделенном томе\n<code>library-cache<\/code> (по умолчанию <code>emptyDir<\/code>; переключите на <code>hostPath<\/code> в\n<code>values.yaml<\/code>, чтобы переживать перепланирование подов), смонтированном в\n<code>/var/lib/perfscale/cache<\/code> и подключённом как <code>PERFSCALE_CACHE_DIR<\/code> — так\nбиблиотеки, установленные через <code>perfscaled library install<\/code> /\n<code>POST /api/v1/libraries/install<\/code>, сохраняются между перезапусками\nконтейнера.<\/li>\n<li>Политика библиотек флота задаётся через переменные окружения агента:\n<code>PERFSCALE_LIBRARY_CAPABILITIES<\/code> (потолок флота, по умолчанию — никаких) и\n<code>PERFSCALE_LIBRARY_ALLOW_DIGESTS<\/code> (опциональный список разрешённых sha256) —\nагент пересекает их с разрешениями каждой задачи и отклоняет задачи,\nпревышающие лимит, с ошибкой валидации.<\/li>\n<\/ul>\n<p>Для разовых нагрузочных запусков в кластере (без агента) образы движка выше\nотлично работают как\n<a target=\"_blank\" rel=\"noopener\" href=\"https://kubernetes.io/docs/concepts/workloads/controllers/job/\">Job<\/a>:\nсмонтируйте сценарий через ConfigMap/PVC и используйте entrypoint образа, как в\nпримерах здесь.<\/p>\n<h2>Ограничения<\/h2>\n<ul>\n<li><strong>Версии раннеров зафиксированы<\/strong> — чтобы запустить другую версию\nk6/JMeter/locust, расширьте образ (см. выше).<\/li>\n<li><strong>JMeter пишет <code>jmeter.log<\/code> (и любые результаты <code>.jtl<\/code>) в рабочую\nдиректорию<\/strong> — дайте ему монтирование, доступное на запись\n(<code>-v \"$PWD:/work\" -w /work<\/code>, или <code>--user \"$(id -u):$(id -g)\"<\/code>, чтобы файлы\nоставались вашими).<\/li>\n<li><strong><code>perfscale serve<\/code> требует опубликованного порта<\/strong>: добавьте <code>-p 7999:7999<\/code>\nи отправляйте POST с отчётами на адрес контейнера, а не на <code>localhost<\/code>.<\/li>\n<li><strong>Файловые действия ограничены контейнером<\/strong>: <code>std/file-read@v1<\/code>/<code>std/file-write@v1<\/code>\nвидят файловую систему контейнера — смонтируйте через bind то, что нужно\nсценарию.<\/li>\n<\/ul>\n","slug":"core/docker","title":"Running perfscale in Docker"},{"group":"core","html_en":"<h1>GPU metrics<\/h1>\n<p>The native engine can sample the host's GPUs for the whole run — utilization,\nVRAM, temperature, and power — and land a <code>gpu<\/code> section in the run summary.\nThis exists primarily for <strong>LLM load testing<\/strong>: with <a href=\"#/docs/core/llm\"><code>std/llm@v1<\/code><\/a>\nagainst a local server (Ollama, vLLM, …) the GPU <em>is<\/em> the system under test,\nand correlating TTFT/tokens-per-second with SM utilization and memory\npressure is how you tell \"model is saturated\" apart from \"server is\nmisconfigured\".<\/p>\n<p>Collection is <strong>best-effort<\/strong>: no GPU, a missing <code>nvidia-smi<\/code> binary, or an\nunreachable exporter logs one warning at run start and the run continues\nwithout GPU metrics — it never fails the run.<\/p>\n<h2>Configuration<\/h2>\n<p>The <code>gpu:<\/code> block sits in the <a href=\"#/docs/yaml-reference\">run config<\/a>\nnext to <code>vus<\/code>/<code>duration<\/code> (native engine only):<\/p>\n<pre><code class=\"language-yaml\">vus: 10\nduration: 5m\ngpu:\n  enabled: true\n  interval_ms: 1000      # default 1000 (min 10)\n  source: nvidia-smi     # nvidia-smi (default) | dcgm | powermetrics (macOS)\n  dcgm_url: http://127.0.0.1:9400/metrics  # for source: dcgm\n  devices: [0, 1]        # optional; default — every GPU the source reports\n<\/code><\/pre>\n<table><thead><tr><th>Field<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody>\n<tr><td><code>enabled<\/code><\/td><td><code>false<\/code><\/td><td>Master switch; the section is ignored without it<\/td><\/tr>\n<tr><td><code>interval_ms<\/code><\/td><td><code>1000<\/code><\/td><td>Sampling interval (one snapshot per GPU per tick)<\/td><\/tr>\n<tr><td><code>source<\/code><\/td><td><code>nvidia-smi<\/code><\/td><td><code>nvidia-smi<\/code> shells out to the binary; <code>dcgm<\/code> polls a dcgm-exporter HTTP endpoint; <code>powermetrics<\/code> samples Apple Silicon GPU/ANE on macOS (needs root)<\/td><\/tr>\n<tr><td><code>dcgm_url<\/code><\/td><td><code>http://127.0.0.1:9400/metrics<\/code><\/td><td>dcgm-exporter metrics endpoint (<code>source: dcgm<\/code> only)<\/td><\/tr>\n<tr><td><code>devices<\/code><\/td><td>all<\/td><td>Restrict sampling to these GPU indices<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Sources<\/h2>\n<p><strong><code>nvidia-smi<\/code><\/strong> (default) — runs\n<code>nvidia-smi --query-gpu=index,utilization.gpu,memory.used,memory.total,temperature.gpu,power.draw --format=csv,noheader,nounits<\/code>\nonce per tick. Works anywhere the NVIDIA driver is installed, no extra\ndaemon needed. Fields the driver reports as <code>N/A<\/code> (e.g. power draw on some\nvirtualized GPUs) are recorded as absent, not zero.<\/p>\n<p><strong><code>dcgm<\/code><\/strong> — HTTP GET on <code>dcgm_url<\/code> and parses the Prometheus text format of\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/NVIDIA/dcgm-exporter\">dcgm-exporter<\/a>:\n<code>DCGM_FI_DEV_GPU_UTIL<\/code>, <code>DCGM_FI_DEV_FB_USED<\/code>/<code>DCGM_FI_DEV_FB_FREE<\/code> (VRAM\ntotal is derived as used+free), <code>DCGM_FI_DEV_GPU_TEMP<\/code>,\n<code>DCGM_FI_DEV_POWER_USAGE<\/code>. Better for GPU servers and Kubernetes, where\ndcgm-exporter is typically already running.<\/p>\n<p><strong><code>powermetrics<\/code><\/strong> (macOS, Apple Silicon) — runs\n<code>sudo powermetrics --samplers cpu_power,gpu_power -n 1 -f plist<\/code> once per\ntick. The integrated GPU (index 0) gets a true utilization figure (active\nresidency %) and its rail power. The <strong>Neural Engine (ANE/NPU) has no public\nutilization API on macOS<\/strong> — the only signal is its power draw — so the ANE\narrives as <code>ane_power_w<\/code> alongside <code>cpu_power_w<\/code>/<code>package_power_w<\/code>, charted\nas its own series (during-run too). Memory and temperature stay absent:\nunified memory has no VRAM figure, and <code>powermetrics<\/code> reports thermal\n<em>pressure<\/em>, not °C. Note that LLM inference on a Mac (llama.cpp, Ollama,\nMLX) runs on the GPU via Metal — the ANE is only exercised by CoreML models\ncompiled for it, so watch <code>gpu_utilization_pct<\/code> first and treat\n<code>ane_power_w<\/code> as the NPU-activity proxy.<\/p>\n<p><code>powermetrics<\/code> requires root. Either run the CLI under sudo, or grant the\nload-test user passwordless sudo for the tool only:<\/p>\n<pre><code class=\"language-sh\">echo \"$USER ALL=(root) NOPASSWD: /usr/bin/powermetrics\" | sudo tee /etc/sudoers.d/powermetrics\n<\/code><\/pre>\n<p>Without root the run logs one warning and continues without GPU metrics\n(the usual best-effort contract).<\/p>\n<p>Sampling-cadence note: each <code>powermetrics -n 1<\/code> invocation measures a\nwindow of <code>gpu.interval_ms<\/code> (clamped to 1s–60s) and blocks for roughly the\nwindow plus ~1s of startup overhead, so the effective cadence is the tick\nplus window plus overhead (~2s at the default 1s tick). Keep\n<code>interval_ms<\/code> at 5s or above for near-continuous window coverage.<\/p>\n<h2>Output<\/h2>\n<p>While the VUs run, the sampler takes one snapshot per GPU per tick (the\nfirst immediately at run start). After the metric summary the run prints a\ncompact block:<\/p>\n<pre><code class=\"language-text\">gpu: 1 device, 300 samples every 1000ms (nvidia-smi)\ngpu0: util avg=64.3% max=100.0% vram max=41088/81559MiB temp max=71.0C power max=512.3W\n<\/code><\/pre>\n<p>…followed by one machine-readable <code>gpu: {...}<\/code> line with the full\ntimeseries, collected into <code>perfscale run --summary-export<\/code> under <code>gpu<\/code>\n(same framing as the <code>thresholds: {...}<\/code> gate line):<\/p>\n<pre><code class=\"language-json\">{\n  \"gpu\": {\n    \"source\": \"nvidia-smi\",\n    \"interval_ms\": 1000,\n    \"devices\": [\n      {\n        \"index\": 0,\n        \"samples\": [\n          { \"ts_ms\": 1720000000000, \"index\": 0, \"utilization_pct\": 64.0,\n            \"memory_used_mib\": 41088.0, \"memory_total_mib\": 81559.0,\n            \"temperature_c\": 71.0, \"power_w\": 512.3 }\n        ],\n        \"avg_utilization_pct\": 64.3,\n        \"max_utilization_pct\": 100.0,\n        \"max_memory_used_mib\": 41088.0,\n        \"memory_total_mib\": 81559.0,\n        \"max_temperature_c\": 71.0,\n        \"max_power_w\": 512.3\n      }\n    ]\n  }\n}\n<\/code><\/pre>\n<p>Each sample carries <code>ts_ms<\/code> (epoch milliseconds) on the same timeline as the\n<a href=\"#/docs/core/metrics\">stats<\/a> lines, so throughput/latency and GPU\nstate can be charted together. Absent optional fields mean the source\nreported <code>N/A<\/code> for that metric. Markdown exports (<code>--summary-export out.md<\/code>)\nget one compact row per device per aggregate.<\/p>\n<p>GPU state also streams <strong>during the run<\/strong>: with\n<a href=\"#/docs/core/metrics\"><code>report.during_run<\/code><\/a> on,\nevery engine snapshot carries the GPU samples taken since the previous one —\nshipped to the collector as <code>gpu_utilization_pct<\/code>, <code>gpu_memory_used_mib<\/code>,\n<code>gpu_memory_total_mib<\/code>, <code>gpu_temperature_c<\/code> and <code>gpu_power_w<\/code> gauges with a\n<code>gpu=\"&lt;index&gt;\"<\/code> label, each at the collector's own timestamp. See\n<a href=\"#/docs/core/metrics\">during-run metrics<\/a> for the\nfull naming table and delivery semantics.<\/p>\n<h2>Example: Ollama under load, GPU watch on<\/h2>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 8\nduration: 2m\ngpu:\n  enabled: true\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - name: llama completion\n    use: std/llm@v1\n    with:\n      url: http://127.0.0.1:11434/v1/chat/completions\n      model: llama3.1\n      prompt: \"Summarize the CAP theorem in two sentences.\"\n      max_tokens: 128\n    check:\n      status: 200\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml --summary-export gpu-run.json\n<\/code><\/pre>\n<p>Reading the result together: <code>llm_tokens_per_sec<\/code> flat while\n<code>gpu0 util avg<\/code> sits at ~100% → the GPU is the bottleneck (add a card,\nshard the model, or lower <code>vus<\/code>); util well below 100% with rising TTFT →\nlook at the server (queueing, context limits) instead. VRAM creeping to\n<code>memory_total_mib<\/code> explains evictions/OOMs mid-run.<\/p>\n<h2>Example: game-style rendering load<\/h2>\n<p>GPU load testing is not only about LLM servers. The other classic question\nis <strong>session density<\/strong>: how many concurrent render sessions — game clients\non a cloud-gaming node, streaming viewports, digital-twin renderers — one\ncard carries before the frame rate collapses. The pattern is the same as\nabove, except the \"system under test\" is a set of renderer processes that\nperfscale orchestrates with\n<a href=\"#/docs/core/actions\"><code>std/child_process@v1<\/code><\/a> while the <code>gpu:<\/code>\nsampler records what the card is doing. A <code>before:<\/code> sidecar adds the second\ningredient of a real node — a heavy background GPU job (the encode stage)\ncompeting with the sessions for the same card.<\/p>\n<p>Any renderer that prints FPS works. This example uses\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/glmark2/glmark2\">glmark2<\/a> (OpenGL, <code>apt install glmark2<\/code>) looping its 3D scenes as a stand-in for a game client; <code>vkmark<\/code>\nis the Vulkan equivalent, and a headless Unity/Unreal build drops in\nunchanged — only the <code>command<\/code> differs.<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 1                      # the renderers are the load; one VU just keeps\nduration: 5m                # the run open (see test.yaml below)\nallow_process_actions: true # required for child_process/kill_process\n\ngpu:\n  enabled: true\n  interval_ms: 1000\n\nbefore:\n  # One \"game session\" = one renderer process. The farm spawns as a single\n  # managed process group, so `after:` stops every session at once.\n  - name: render-farm\n    uses: std/child_process@v1\n    with:\n      command: sh\n      args: [\"-c\", \"for i in $(seq 4); do glmark2 --run-forever &amp; done; wait\"]\n      waitUntil:\n        stdout_contains: GL_RENDERER  # GL context is up\n        on_timeout: continue\n      restart: never                  # a crashed session must not respawn a 2nd farm\n\n  # Sidecar: a heavy GPU job sharing the card with the sessions — the encode\n  # stage of a game-streaming pipeline. Looped 1080p60 from a generated\n  # source, NVENC-encoded, discarded to null.\n  - name: encode-sidecar\n    uses: std/child_process@v1\n    with:\n      command: ffmpeg\n      args: [\"-f\", \"lavfi\", \"-i\", \"testsrc2=size=1920x1080:rate=60\",\n             \"-c:v\", \"h264_nvenc\", \"-f\", \"null\", \"-\"]\n      waitUntil:\n        stderr_contains: \"Press [q]\"  # ffmpeg reports the running loop on stderr\n        on_timeout: continue\n      restart: on-failure             # a crashed encoder comes back\n\nafter:\n  - name: stop the farm\n    uses: std/kill_process@v1\n    with: { name: render-farm }       # tree: true by default → every session\n  - name: stop the sidecar\n    uses: std/kill_process@v1\n    with: { name: encode-sidecar }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - name: keep the run open\n    use: std/sleep@v1\n    with: { seconds: 30 }\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml --summary-export render.json\n<\/code><\/pre>\n<p>Headless nodes: glmark2 needs a GL context. On a GPU server without a\ndisplay use the DRM build (<code>glmark2-drm<\/code> / <code>glmark2-es2-drm<\/code> — renders via\nGBM straight on the card) or wrap the command in <code>xvfb-run -a<\/code>.<\/p>\n<h3>Reading the result<\/h3>\n<p>The renderer's FPS lines stream into the run log with a <code>render-farm: <\/code>\nprefix; the <code>gpu:<\/code> summary records what the card did meanwhile. The method\nis a sweep, not a single run — raise the session count (<code>seq 4<\/code> → 1, 2, 4,\n8) between runs:<\/p>\n<ul>\n<li>per-scene FPS divided by ~N while <code>util max<\/code> pins at 100% → the GPU is\nsaturated; that session count is the card's ceiling for this workload;<\/li>\n<li>FPS degrades while util stays below 100% → the limit is elsewhere (CPU,\ncontext switching) — cross-check <code>temp max<\/code> / <code>power max<\/code> for thermal or\npower throttling;<\/li>\n<li><code>vram max<\/code> per session count answers the capacity question directly: how\nmany sessions fit into <code>memory_total_mib<\/code> before the driver starts\nswapping;<\/li>\n<li>the sidecar's price is the <strong>FPS delta<\/strong> between a farm-only run (comment\nthe <code>encode-sidecar<\/code> block out) and a farm+sidecar run at the same session\ncount — that is what sharing the card with the encode pipeline costs a\ncloud-gaming node.<\/li>\n<\/ul>\n<p>perfscale does not parse FPS into metrics — frame-rate numbers live in the\nrun log; the <code>gpu:<\/code> timeseries (each sample stamped <code>ts_ms<\/code> on the <a href=\"#/docs/core/metrics\">stats\ntimeline<\/a>) is what you chart against them.<\/p>\n<p>One caveat for runs like this: <code>utilization.gpu<\/code> reports the 3D/compute\nengine — the NVENC encoder the sidecar burns is <strong>not<\/strong> counted there, so\njudge the sidecar by VRAM, power draw, and the FPS it costs the sessions,\nnot by the util line.<\/p>\n<h2>Example: ANE (Neural Engine) load via Core ML<\/h2>\n<p>On Apple Silicon the NPU question mirrors the GPU one: does the workload\nactually engage the Neural Engine, and where is its ceiling? The shipped\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/tree/main/examples/coreml-ane\"><code>examples/coreml-ane/<\/code><\/a>\ngenerates real ANE load with a Core ML sidecar — a small conv net built with\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/apple/coremltools\">coremltools<\/a>' MIL builder (no model\ndownload), looping predictions with <code>compute_units=ALL<\/code> — while\n<code>gpu.source: powermetrics<\/code> records the SoC:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml (excerpt)\ngpu:\n  enabled: true\n  source: powermetrics\n  interval_ms: 5000\n\nbefore:\n  - name: ane-sidecar\n    uses: std/child_process@v1\n    with:\n      command: sh\n      args: [\"-c\", \".venv/bin/python ane_load.py\"]\n      waitUntil: { stdout_contains: \"inference loop\", on_timeout: fail }\n      restart: never\n\nafter:\n  - name: stop the sidecar\n    uses: std/kill_process@v1\n    with: { name: ane-sidecar }\n<\/code><\/pre>\n<p>Verified on an M2 Pro: <code>ane_power_w<\/code> rises ≈2 W over baseline (to ≈7 W\nsustained) while the loop runs at ≈1 450 inferences/s on the built-in net,\nwith <code>gpu_utilization_pct<\/code> and <code>gpu_power_w<\/code> staying flat — proof the load\nis on the Neural Engine, not the GPU. (powermetrics models several watts of\nANE draw even at idle on M2 Pro/Max, so read the delta, not the floor.)\nReading the result:<\/p>\n<ul>\n<li><code>ane_power_w<\/code> flat at its baseline → the ANE is not engaged: the model is\nCPU/GPU-bound or was loaded without <code>compute_units=ALL<\/code>. (Python's data\nstack — pandas, NumPy, Anaconda — never touches the ANE;\n<code>coremltools<\/code>/Core ML is the only path user code has to it.)<\/li>\n<li>Scale out (more sidecars, <code>--size 224<\/code>, or your own <code>--model x.mlpackage<\/code>)\nand watch where inferences/sec stop scaling — the chip's ANE ceiling for\nthat workload.<\/li>\n<\/ul>\n<p>Setup (venv + the powermetrics sudoers rule) and the sweep method are in the\nexample's README.<\/p>\n<h2>GPU benchmark suite<\/h2>\n<p>The repo ships a ready-made local suite in\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/tree/main/bench/gpu\"><code>bench/gpu/<\/code><\/a>:\n<code>std/llm@v1<\/code> scenarios against Ollama and vLLM with <code>gpu:<\/code> metrics on, a\nstepped ramping-VU profile (concurrency vs tok/s / TTFT degradation) and an\narrival-rate profile (find the rate where TTFT and <code>dropped_iterations<\/code>\nclimb). It is local-only — CI runners have no GPU.<\/p>\n<pre><code class=\"language-sh\">bench/gpu/run.sh ollama        # or: vllm, or both\n<\/code><\/pre>\n<p>…runs each profile, writes <code>--summary-export<\/code> JSONs and raw logs to\n<code>bench/gpu/results/&lt;timestamp&gt;/<\/code>, and prints a compact table:<\/p>\n<pre><code class=\"language-text\">scenario        reqs  req/s  tok/s avg  ttft p50 ms  ttft p95 ms  gpu util max  vram max MiB  dropped\n--------------  ----  -----  ---------  -----------  -----------  ------------  ------------  -------\nollama-stages   152   0.42   38.71      212.40       890.15       100%          5104          0\nollama-arrival  210   0.63   31.05      340.72       2410.30      100%          5112          17\n<\/code><\/pre>\n<p>Setup (Ollama / vLLM), requirements, and how to read the numbers:\n<code>bench/gpu/README.md<\/code>.<\/p>\n<h2>Extension seam<\/h2>\n<p><code>perfscale-core<\/code> exposes <code>gpu::GpuCollector<\/code> and\n<code>gpu::register_gpu_collector<\/code> — the same pattern as\n<a href=\"#/docs/core/pubsub\"><code>register_pubsub_driver<\/code><\/a>: a downstream (proprietary)\nbuild can register richer collectors (NVML-based per-process memory, SM\nclock/throttle reasons, <code>rocm-smi<\/code> for AMD, <code>powermetrics<\/code> for Apple\nsilicon) and select them via <code>gpu.source<\/code>, or shadow the built-ins under\ntheir own names. The basic metrics above are the OSS baseline every\ncollector reports.<\/p>\n","html_ru":"<h1>Метрики GPU<\/h1>\n<p>Нативный движок умеет на протяжении всего прогона снимать показания GPU хоста —\nзагрузку, VRAM, температуру и потребление — и помещает секцию <code>gpu<\/code> в сводку\nпрогона. Это нужно прежде всего для <strong>нагрузочного тестирования LLM<\/strong>: при\nработе с <a href=\"#/docs/core/llm\"><code>std/llm@v1<\/code><\/a> против локального сервера (Ollama, vLLM, …)\nGPU и <em>есть<\/em> тестируемая система, и именно корреляция TTFT/токенов в секунду\nс загрузкой SM и нехваткой памяти позволяет отличить «модель насыщена» от\n«сервер неправильно настроен».<\/p>\n<p>Сбор работает в режиме <strong>best-effort<\/strong>: отсутствие GPU, отсутствие бинарника\n<code>nvidia-smi<\/code> или недоступный экспортер приводят к одному предупреждению в\nначале прогона, после чего прогон продолжается без метрик GPU — он никогда\nне завершается ошибкой из-за этого.<\/p>\n<h2>Конфигурация<\/h2>\n<p>Блок <code>gpu:<\/code> находится в <a href=\"#/docs/yaml-reference\">конфиге прогона<\/a>\nрядом с <code>vus<\/code>/<code>duration<\/code> (только нативный движок):<\/p>\n<pre><code class=\"language-yaml\">vus: 10\nduration: 5m\ngpu:\n  enabled: true\n  interval_ms: 1000      # default 1000 (min 10)\n  source: nvidia-smi     # nvidia-smi (default) | dcgm | powermetrics (macOS)\n  dcgm_url: http://127.0.0.1:9400/metrics  # for source: dcgm\n  devices: [0, 1]        # optional; default — every GPU the source reports\n<\/code><\/pre>\n<table><thead><tr><th>Поле<\/th><th>Значение по умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>enabled<\/code><\/td><td><code>false<\/code><\/td><td>Главный переключатель; без него секция игнорируется<\/td><\/tr>\n<tr><td><code>interval_ms<\/code><\/td><td><code>1000<\/code><\/td><td>Интервал сэмплирования (один снимок на GPU за тик)<\/td><\/tr>\n<tr><td><code>source<\/code><\/td><td><code>nvidia-smi<\/code><\/td><td><code>nvidia-smi<\/code> вызывает бинарник; <code>dcgm<\/code> опрашивает HTTP-эндпоинт dcgm-exporter; <code>powermetrics<\/code> снимает показания GPU/ANE Apple Silicon на macOS (требует root)<\/td><\/tr>\n<tr><td><code>dcgm_url<\/code><\/td><td><code>http://127.0.0.1:9400/metrics<\/code><\/td><td>Эндпоинт метрик dcgm-exporter (только для <code>source: dcgm<\/code>)<\/td><\/tr>\n<tr><td><code>devices<\/code><\/td><td>все<\/td><td>Ограничить сэмплирование указанными индексами GPU<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Источники<\/h2>\n<p><strong><code>nvidia-smi<\/code><\/strong> (по умолчанию) — раз в тик выполняет\n<code>nvidia-smi --query-gpu=index,utilization.gpu,memory.used,memory.total,temperature.gpu,power.draw --format=csv,noheader,nounits<\/code>.\nРаботает везде, где установлен драйвер NVIDIA, дополнительный демон не нужен.\nПоля, которые драйвер сообщает как <code>N/A<\/code> (например, потребление на некоторых\nвиртуализованных GPU), записываются как отсутствующие, а не как ноль.<\/p>\n<p><strong><code>dcgm<\/code><\/strong> — HTTP GET на <code>dcgm_url<\/code> и разбор текстового формата Prometheus от\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/NVIDIA/dcgm-exporter\">dcgm-exporter<\/a>:\n<code>DCGM_FI_DEV_GPU_UTIL<\/code>, <code>DCGM_FI_DEV_FB_USED<\/code>/<code>DCGM_FI_DEV_FB_FREE<\/code> (общий\nобъём VRAM вычисляется как used+free), <code>DCGM_FI_DEV_GPU_TEMP<\/code>,\n<code>DCGM_FI_DEV_POWER_USAGE<\/code>. Лучше подходит для GPU-серверов и Kubernetes, где\ndcgm-exporter обычно уже запущен.<\/p>\n<p><strong><code>powermetrics<\/code><\/strong> (macOS, Apple Silicon) — раз в тик выполняет\n<code>sudo powermetrics --samplers cpu_power,gpu_power -n 1 -f plist<\/code>. Встроенный\nGPU (индекс 0) получает настоящий показатель загрузки (active residency %) и\nпотребление по своей линии питания. <strong>У Neural Engine (ANE/NPU) нет публичного\nAPI загрузки на macOS<\/strong> — единственный сигнал — его потребление, — поэтому\nANE приходит как <code>ane_power_w<\/code> наряду с <code>cpu_power_w<\/code>/<code>package_power_w<\/code> и\nотображается отдельным рядом (в том числе в during_run). Память и температура\nостаются отсутствующими: у unified memory нет понятия VRAM, а <code>powermetrics<\/code>\nсообщает тепловое <em>давление<\/em>, а не °C. Учтите, что LLM-инференс на Mac\n(llama.cpp, Ollama, MLX) выполняется на GPU через Metal — ANE задействуют\nтолько модели CoreML, скомпилированные под него, поэтому в первую очередь\nсмотрите на <code>gpu_utilization_pct<\/code>, а <code>ane_power_w<\/code> воспринимайте как\nкосвенный индикатор активности NPU.<\/p>\n<p><code>powermetrics<\/code> требует root. Либо запускайте CLI под sudo, либо дайте\nпользователю, запускающему нагрузочный тест, беспарольный sudo только для\nэтой утилиты:<\/p>\n<pre><code class=\"language-sh\">echo \"$USER ALL=(root) NOPASSWD: /usr/bin/powermetrics\" | sudo tee /etc/sudoers.d/powermetrics\n<\/code><\/pre>\n<p>Без root прогон выводит одно предупреждение и продолжается без метрик GPU\n(обычный контракт best-effort).<\/p>\n<p>Замечание о частоте сэмплирования: каждый вызов <code>powermetrics -n 1<\/code> измеряет\nокно длиной <code>gpu.interval_ms<\/code> (ограничено диапазоном 1s–60s) и блокируется\nпримерно на длительность окна плюс ~1s накладных расходов на запуск, поэтому\nэффективная частота — это тик плюс окно плюс накладные расходы (~2s при тике\n1s по умолчанию). Держите <code>interval_ms<\/code> на уровне 5s и выше для почти\nнепрерывного покрытия окнами.<\/p>\n<h2>Вывод<\/h2>\n<p>Пока работают виртуальные пользователи (VU), сэмплер делает один снимок на\nGPU за тик (первый — сразу в начале прогона). После сводки метрик прогон\nпечатает компактный блок:<\/p>\n<pre><code class=\"language-text\">gpu: 1 device, 300 samples every 1000ms (nvidia-smi)\ngpu0: util avg=64.3% max=100.0% vram max=41088/81559MiB temp max=71.0C power max=512.3W\n<\/code><\/pre>\n<p>…за которым следует одна машиночитаемая строка <code>gpu: {...}<\/code> с полным временным\nрядом, попадающая в <code>perfscale run --summary-export<\/code> под ключом <code>gpu<\/code>\n(такое же оформление, как у строки гейта <code>thresholds: {...}<\/code>):<\/p>\n<pre><code class=\"language-json\">{\n  \"gpu\": {\n    \"source\": \"nvidia-smi\",\n    \"interval_ms\": 1000,\n    \"devices\": [\n      {\n        \"index\": 0,\n        \"samples\": [\n          { \"ts_ms\": 1720000000000, \"index\": 0, \"utilization_pct\": 64.0,\n            \"memory_used_mib\": 41088.0, \"memory_total_mib\": 81559.0,\n            \"temperature_c\": 71.0, \"power_w\": 512.3 }\n        ],\n        \"avg_utilization_pct\": 64.3,\n        \"max_utilization_pct\": 100.0,\n        \"max_memory_used_mib\": 41088.0,\n        \"memory_total_mib\": 81559.0,\n        \"max_temperature_c\": 71.0,\n        \"max_power_w\": 512.3\n      }\n    ]\n  }\n}\n<\/code><\/pre>\n<p>Каждый сэмпл несёт <code>ts_ms<\/code> (миллисекунды epoch) на той же шкале времени, что\nи строки <a href=\"#/docs/core/metrics\">stats<\/a>, так что пропускную способность/\nзадержку и состояние GPU можно строить на одном графике. Отсутствующие\nнеобязательные поля означают, что источник сообщил <code>N/A<\/code> для этой метрики.\nMarkdown-экспорты (<code>--summary-export out.md<\/code>) получают по одной компактной\nстроке на устройство на агрегат.<\/p>\n<p>Состояние GPU также стримится <strong>во время прогона<\/strong>: при включённом\n<a href=\"#/docs/core/metrics\"><code>report.during_run<\/code><\/a> каждый\nснимок движка несёт сэмплы GPU, собранные с предыдущего снимка, — они\nотправляются коллектору как gauge-метрики <code>gpu_utilization_pct<\/code>,\n<code>gpu_memory_used_mib<\/code>, <code>gpu_memory_total_mib<\/code>, <code>gpu_temperature_c<\/code> и\n<code>gpu_power_w<\/code> с лейблом <code>gpu=\"&lt;index&gt;\"<\/code>, каждая — с собственной меткой\nвремени коллектора. Полную таблицу имён и семантику доставки см. в разделе\n<a href=\"#/docs/core/metrics\">метрики во время прогона<\/a>.<\/p>\n<h2>Пример: Ollama под нагрузкой с наблюдением за GPU<\/h2>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 8\nduration: 2m\ngpu:\n  enabled: true\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - name: llama completion\n    use: std/llm@v1\n    with:\n      url: http://127.0.0.1:11434/v1/chat/completions\n      model: llama3.1\n      prompt: \"Summarize the CAP theorem in two sentences.\"\n      max_tokens: 128\n    check:\n      status: 200\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml --summary-export gpu-run.json\n<\/code><\/pre>\n<p>Читаем результат целиком: <code>llm_tokens_per_sec<\/code> не растёт, а <code>gpu0 util avg<\/code>\nсидит на ~100% → узкое место — GPU (добавьте карту, разделите модель по\nшардам или снизьте <code>vus<\/code>); загрузка заметно ниже 100% при растущем TTFT →\nсмотрите на сервер (очереди, лимиты контекста). VRAM, ползущий к\n<code>memory_total_mib<\/code>, объясняет вытеснения/OOM в середине прогона.<\/p>\n<h2>Пример: нагрузка в стиле игрового рендеринга<\/h2>\n<p>Нагрузочное тестирование GPU — это не только про LLM-серверы. Другой\nклассический вопрос — <strong>плотность сессий<\/strong>: сколько одновременных сессий\nрендеринга — игровых клиентов на ноде облачного гейминга, стриминговых\nвьюпортов, рендереров цифровых двойников — выдержит одна карта, прежде чем\nчастота кадров рухнет. Схема та же, что и выше, только «тестируемая система»\nздесь — набор процессов-рендереров, которыми perfscale управляет через\n<a href=\"#/docs/core/actions\"><code>std/child_process@v1<\/code><\/a>, пока сэмплер <code>gpu:<\/code>\nзаписывает, что делает карта. Сайдкар в <code>before:<\/code> добавляет второй ингредиент\nреальной ноды — тяжёлую фоновую задачу на GPU (стадия кодирования),\nконкурирующую с сессиями за ту же карту.<\/p>\n<p>Подойдёт любой рендерер, который печатает FPS. В этом примере используется\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/glmark2/glmark2\">glmark2<\/a> (OpenGL, <code>apt install glmark2<\/code>), зацикливающий свои 3D-сцены в роли заменителя игрового клиента;\n<code>vkmark<\/code> — аналог для Vulkan, а headless-сборка Unity/Unreal подключается без\nизменений — отличается только <code>command<\/code>.<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nvus: 1                      # нагрузку создают рендереры; один VU просто\nduration: 5m                # держит прогон открытым (см. test.yaml ниже)\nallow_process_actions: true # required for child_process/kill_process\n\ngpu:\n  enabled: true\n  interval_ms: 1000\n\nbefore:\n  # Одна \"игровая сессия\" = один процесс-рендерер. Ферма запускается как\n  # единая управляемая группа процессов, поэтому `after:` останавливает\n  # все сессии разом.\n  - name: render-farm\n    uses: std/child_process@v1\n    with:\n      command: sh\n      args: [\"-c\", \"for i in $(seq 4); do glmark2 --run-forever &amp; done; wait\"]\n      waitUntil:\n        stdout_contains: GL_RENDERER  # GL context is up\n        on_timeout: continue\n      restart: never                  # упавшая сессия не должна перезапускать вторую ферму\n\n  # Сайдкар: тяжёлая задача на GPU, делящая карту с сессиями, — стадия\n  # кодирования в пайплайне игрового стриминга. Зацикленный 1080p60 из\n  # сгенерированного источника, кодируется NVENC, вывод отбрасывается в null.\n  - name: encode-sidecar\n    uses: std/child_process@v1\n    with:\n      command: ffmpeg\n      args: [\"-f\", \"lavfi\", \"-i\", \"testsrc2=size=1920x1080:rate=60\",\n             \"-c:v\", \"h264_nvenc\", \"-f\", \"null\", \"-\"]\n      waitUntil:\n        stderr_contains: \"Press [q]\"  # ffmpeg сообщает о работающем цикле в stderr\n        on_timeout: continue\n      restart: on-failure             # упавший энкодер перезапускается\n\nafter:\n  - name: stop the farm\n    uses: std/kill_process@v1\n    with: { name: render-farm }       # tree: true по умолчанию → все сессии\n  - name: stop the sidecar\n    uses: std/kill_process@v1\n    with: { name: encode-sidecar }\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - name: keep the run open\n    use: std/sleep@v1\n    with: { seconds: 30 }\n<\/code><\/pre>\n<pre><code class=\"language-sh\">perfscale run -f test.yaml -c config.yaml --summary-export render.json\n<\/code><\/pre>\n<p>Headless-ноды: glmark2 нужен GL-контекст. На GPU-сервере без дисплея\nиспользуйте DRM-сборку (<code>glmark2-drm<\/code> / <code>glmark2-es2-drm<\/code> — рендерит через\nGBM напрямую на карте) или оберните команду в <code>xvfb-run -a<\/code>.<\/p>\n<h3>Чтение результата<\/h3>\n<p>Строки FPS рендерера стримятся в лог прогона с префиксом <code>render-farm: <\/code>;\nсводка <code>gpu:<\/code> фиксирует, что тем временем делала карта. Метод — это серия\nпрогонов, а не один: увеличивайте число сессий (<code>seq 4<\/code> → 1, 2, 4, 8) между\nпрогонами:<\/p>\n<ul>\n<li>FPS по сценам делится примерно на N, а <code>util max<\/code> упирается в 100% → GPU\nнасыщен; это число сессий — потолок карты для данной нагрузки;<\/li>\n<li>FPS деградирует, а загрузка остаётся ниже 100% → ограничение в другом месте\n(CPU, переключение контекста) — перепроверьте <code>temp max<\/code> / <code>power max<\/code> на\nпредмет троттлинга по температуре или питанию;<\/li>\n<li><code>vram max<\/code> при разном числе сессий напрямую отвечает на вопрос ёмкости:\nсколько сессий помещается в <code>memory_total_mib<\/code>, прежде чем драйвер начнёт\nсвопить;<\/li>\n<li>цена сайдкара — это <strong>дельта FPS<\/strong> между прогоном только с фермой\n(закомментируйте блок <code>encode-sidecar<\/code>) и прогоном ферма+сайдкар при том же\nчисле сессий — именно столько ноде облачного гейминга стоит совместное\nиспользование карты с пайплайном кодирования.<\/li>\n<\/ul>\n<p>perfscale не разбирает FPS в метрики — числа частоты кадров живут в логе\nпрогона; именно временной ряд <code>gpu:<\/code> (каждый сэмпл с меткой <code>ts_ms<\/code> на\n<a href=\"#/docs/core/metrics\">шкале времени stats<\/a>) — то, с чем вы их\nсопоставляете на графике.<\/p>\n<p>Одна оговорка для таких прогонов: <code>utilization.gpu<\/code> отражает 3D/compute-движок —\nэнкодер NVENC, который жгёт сайдкар, там <strong>не учитывается<\/strong>, поэтому оценивайте\nсайдкар по VRAM, потреблению и тому, сколько FPS он отнимает у сессий, а не\nпо линии загрузки.<\/p>\n<h2>Пример: нагрузка на ANE (Neural Engine) через Core ML<\/h2>\n<p>На Apple Silicon вопрос про NPU зеркалит вопрос про GPU: действительно ли\nнагрузка задействует Neural Engine и где его потолок? Прилагаемый пример\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/tree/main/examples/coreml-ane\"><code>examples/coreml-ane/<\/code><\/a>\nсоздаёт настоящую нагрузку на ANE сайдкаром на Core ML — небольшая свёрточная\nсеть, собранная MIL-билдером <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/apple/coremltools\">coremltools<\/a>\n(без скачивания модели), зацикленно выполняет предсказания с\n<code>compute_units=ALL<\/code>, — пока <code>gpu.source: powermetrics<\/code> записывает показания SoC:<\/p>\n<pre><code class=\"language-yaml\"># config.yaml (фрагмент)\ngpu:\n  enabled: true\n  source: powermetrics\n  interval_ms: 5000\n\nbefore:\n  - name: ane-sidecar\n    uses: std/child_process@v1\n    with:\n      command: sh\n      args: [\"-c\", \".venv/bin/python ane_load.py\"]\n      waitUntil: { stdout_contains: \"inference loop\", on_timeout: fail }\n      restart: never\n\nafter:\n  - name: stop the sidecar\n    uses: std/kill_process@v1\n    with: { name: ane-sidecar }\n<\/code><\/pre>\n<p>Проверено на M2 Pro: <code>ane_power_w<\/code> поднимается примерно на 2 W над базовой\nлинией (до ≈7 W в устоявшемся режиме), пока цикл выполняет ≈1 450 инференсов/с\nна встроенной сети, а <code>gpu_utilization_pct<\/code> и <code>gpu_power_w<\/code> остаются ровными —\nдоказательство того, что нагрузка идёт на Neural Engine, а не на GPU.\n(powermetrics моделирует несколько ватт потребления ANE даже в простое на\nM2 Pro/Max, поэтому читайте дельту, а не абсолютный уровень.) Чтение\nрезультата:<\/p>\n<ul>\n<li><code>ane_power_w<\/code> ровно на базовой линии → ANE не задействован: модель упирается\nв CPU/GPU или была загружена без <code>compute_units=ALL<\/code>. (Стек данных Python —\npandas, NumPy, Anaconda — никогда не трогает ANE; <code>coremltools<\/code>/Core ML —\nединственный путь к нему из пользовательского кода.)<\/li>\n<li>Масштабируйтесь (больше сайдкаров, <code>--size 224<\/code> или свой <code>--model x.mlpackage<\/code>) и смотрите, где инференсы/с перестают расти — это потолок ANE\nчипа для данной нагрузки.<\/li>\n<\/ul>\n<p>Настройка (venv + правило sudoers для powermetrics) и метод серии прогонов\nописаны в README примера.<\/p>\n<h2>Набор GPU-бенчмарков<\/h2>\n<p>В репозитории поставляется готовый локальный набор в\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/Perfscale/perfscale/tree/main/bench/gpu\"><code>bench/gpu/<\/code><\/a>:\nсценарии <code>std/llm@v1<\/code> против Ollama и vLLM с включёнными метриками <code>gpu:<\/code>,\nступенчатый профиль с нарастающим числом VU (конкурентность против деградации\ntok/s / TTFT) и профиль с интенсивностью поступления запросов (найдите\nинтенсивность, при которой растут TTFT и <code>dropped_iterations<\/code>). Набор только\nлокальный — у CI-раннеров нет GPU.<\/p>\n<pre><code class=\"language-sh\">bench/gpu/run.sh ollama        # or: vllm, or both\n<\/code><\/pre>\n<p>…запускает каждый профиль, записывает JSON <code>--summary-export<\/code> и сырые логи в\n<code>bench/gpu/results/&lt;timestamp&gt;/<\/code> и печатает компактную таблицу:<\/p>\n<pre><code class=\"language-text\">scenario        reqs  req/s  tok/s avg  ttft p50 ms  ttft p95 ms  gpu util max  vram max MiB  dropped\n--------------  ----  -----  ---------  -----------  -----------  ------------  ------------  -------\nollama-stages   152   0.42   38.71      212.40       890.15       100%          5104          0\nollama-arrival  210   0.63   31.05      340.72       2410.30      100%          5112          17\n<\/code><\/pre>\n<p>Настройка (Ollama / vLLM), требования и как читать числа:\n<code>bench/gpu/README.md<\/code>.<\/p>\n<h2>Точка расширения<\/h2>\n<p><code>perfscale-core<\/code> экспортирует <code>gpu::GpuCollector<\/code> и\n<code>gpu::register_gpu_collector<\/code> — тот же паттерн, что и\n<a href=\"#/docs/core/pubsub\"><code>register_pubsub_driver<\/code><\/a>: сторонняя (проприетарная)\nсборка может регистрировать более богатые коллекторы (память по процессам на\nбазе NVML, причины троттлинга SM clock, <code>rocm-smi<\/code> для AMD, <code>powermetrics<\/code>\nдля Apple silicon) и выбирать их через <code>gpu.source<\/code> либо перекрывать\nвстроенные под их собственными именами. Базовые метрики выше — это\nOSS-базовый уровень, который сообщает каждый коллектор.<\/p>\n","slug":"core/gpu","title":"GPU metrics"},{"group":"core","html_en":"<h1>GraphQL load testing<\/h1>\n<p>perfscale drives <strong>GraphQL<\/strong> endpoints under load with the native step engine:\none operation per step, queries and mutations over HTTP POST (or opt-in GET),\nwith the query validated against the endpoint's own schema before it is ever\nsent.<\/p>\n<p>No codegen and no client stubs: the document is plain text in the YAML (or a\n<code>.graphql<\/code> file), variables are JSON, and responses come back as structured\n<code>data<\/code>/<code>errors<\/code> the next steps extract from with <code>${{ … }}<\/code> interpolation.<\/p>\n<p>This page is the guide. Per-step parameters and outputs live in the\n<a href=\"#/docs/core/actions\">actions reference<\/a>; a runnable scenario ships as\n<a href=\"../../examples/graphql.test.yaml\"><code>examples/graphql.test.yaml<\/code><\/a>.<\/p>\n<h2>One action: <code>std/graphql@v1<\/code><\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch viewer\n    use: std/graphql@v1\n    with:\n      url: https://api.example.com/graphql\n      query: |\n        query GetViewer($id: ID!) {\n          viewer(id: $id) { id name }\n        }\n      variables: { \"id\": \"${{ vars.viewer_id }}\" }\n    check:\n      status: 200\n    outputs: viewer\n\n  - name: rename widget\n    use: std/graphql@v1\n    with:\n      url: https://api.example.com/graphql\n      query: |\n        mutation Rename($id: ID!, $name: String!) {\n          renameWidget(id: $id, name: $name) { id }\n        }\n      variables: { \"id\": \"${{ viewer.data.viewer.id }}\", \"name\": \"w-${seq}\" }\n<\/code><\/pre>\n<ul>\n<li><code>query<\/code> is inline (multiline YAML reads well); <code>query_file<\/code> points at a\n<code>.graphql<\/code> file instead — the two are mutually exclusive.<\/li>\n<li><code>variables<\/code> is a JSON object. <code>${{ … }}<\/code> interpolation applies everywhere in\n<code>with:<\/code>, so values extracted from earlier steps flow straight in, and\nsingle-brace <code>${…}<\/code> generator tokens (<code>${uuid}<\/code>, <code>${rand}<\/code>, <code>${now}<\/code>)\nexpand per execution — every iteration can send a fresh name or id.<\/li>\n<li>A document with several operations needs <code>operation: GetViewer<\/code> to pick\none — the same <code>operationName<\/code> the server receives.<\/li>\n<li><code>method: GET<\/code> moves the operation into URL query parameters for\nCDN-cacheable reads. Mutations stay on POST (the default).<\/li>\n<\/ul>\n<h2>Schema validation<\/h2>\n<p>Every query is parsed before it is sent, and — when a schema is available —\nvalidated against it. A typo fails the step (and <code>perfscale lint<\/code>) with a\ndid-you-mean suggestion instead of burning requests against the target:<\/p>\n<pre><code class=\"language-text\">fetch viewer: query validation failed: unknown field 'viewr' on type 'Query' — did you mean 'viewer'?\n<\/code><\/pre>\n<p>Two schema sources:<\/p>\n<ul>\n<li><strong>Introspection<\/strong> (default) — the engine POSTs an introspection query to the\nendpoint once per run, caches the schema process-wide, and validates every\nquery against it. One round trip per endpoint, no matter how many VUs.<\/li>\n<li><strong><code>schema_file: schema.graphql<\/code><\/strong> — validate against a local SDL file.\nThis is the fallback for endpoints that refuse introspection (common in\nproduction): when introspection fails and no <code>schema_file<\/code> is given, the\nstep still runs — unvalidated, with one <code>[sys]<\/code> log line saying so.\n<code>introspection: false<\/code> opts out of fetching entirely.<\/li>\n<\/ul>\n<p><code>perfscale lint<\/code> applies the same gate: syntax always (offline), schema when\nthe endpoint is reachable or an SDL file is given. <code>perfscale lint --offline<\/code>\nskips the network pass.<\/p>\n<h2>What counts as failure<\/h2>\n<p>GraphQL errors travel in a <code>200 OK<\/code> body, so HTTP status alone is not the\nverdict:<\/p>\n<ul>\n<li>HTTP status ≥ 400 → the step fails.<\/li>\n<li><code>errors<\/code> present, <code>data<\/code> null/absent → the step fails (nothing resolved).<\/li>\n<li>partial <code>data<\/code> <strong>plus<\/strong> <code>errors<\/code> → the step <strong>passes<\/strong> — the server resolved\nwhat it could — and the errors are counted in <code>graphql_errors<\/code>.<\/li>\n<\/ul>\n<p>Standard <code>check:<\/code> assertions work unchanged: <code>status<\/code>, <code>duration_ms_lt<\/code>,\n<code>body_contains<\/code> (against the raw body). Field-level assertions read the\ndecoded payload via a <code>std/check@v1<\/code> step:<\/p>\n<pre><code class=\"language-yaml\">  - name: viewer id present\n    use: std/check@v1\n    with:\n      on: viewer.data.viewer\n      message_contains: \"id\"   # …or assert via outputs interpolation\n<\/code><\/pre>\n<h2>Metrics<\/h2>\n<ul>\n<li><code>graphql_req_duration<\/code> — HDR histogram in ms (percentiles in the\nsummary); every operation's round trip, one sample per request actually\nsent, on success and on failure. Gate on it with <code>std/thresholds@v1<\/code>:\n<code>\"graphql_req_duration\": [\"p99&lt;200\"]<\/code>.<\/li>\n<li><code>graphql_req_failed<\/code> — failure rate derived from <code>graphql_req_duration<\/code>:\none 0/1 sample per invocation (1 = step failed: transport error, HTTP\nerror status, or <code>errors<\/code> without <code>data<\/code> — see above). Use it for SLO\ngates: <code>graphql_req_failed: [\"rate&lt;0.01\"]<\/code>. Derivation details:\n<a href=\"#/docs/core/metrics\">metrics.md<\/a>.<\/li>\n<li><code>graphql_errors<\/code> — counter, summed over the run; GraphQL-level errors,\nincluding the partial-data ones that pass the step. Always emitted (0 on\nclean responses), so <code>graphql_errors: [\"count==0\"]<\/code> gates resolve on\nhealthy runs too.<\/li>\n<li><code>graphql_op_&lt;operationName&gt;_duration<\/code> — HDR histogram in ms;\nper-operation latency, emitted only when the operation is named (explicit\n<code>operation<\/code> or a single named operation), so metric cardinality stays\nbounded by the test definition. Each named operation also gets a derived\n<code>graphql_op_&lt;operationName&gt;_failed<\/code> rate.<\/li>\n<li>The request also feeds the standard <code>http_req_duration<\/code> / <code>http_req_failed<\/code>\n/ <code>http_reqs<\/code> aggregates, like any HTTP step.<\/li>\n<\/ul>\n<h2>Connection pooling<\/h2>\n<p><code>pool: per-vu<\/code> (default) pins the step to the VU's HTTP client shard — the\nsame keep-alive behaviour as <code>std/http@v1<\/code>, so a VU reuses its warm\nconnections across iterations. <code>pool: shared<\/code> puts every VU on one\nprocess-global client: maximal connection reuse against a single endpoint, at\nthe cost of pool-lock contention under very high VU counts.<\/p>\n<h2>Limits<\/h2>\n<ul>\n<li>Subscriptions are not supported (the transport is HTTP request/response);\na document containing one fails validation.<\/li>\n<li>Request batching (arrays of operations) and incremental delivery\n(<code>@defer<\/code>/<code>@stream<\/code>) are not supported — one operation per step.<\/li>\n<li><code>query_file<\/code> and <code>schema_file<\/code> are filesystem access: they require\n<code>allow_file_actions<\/code> in the run config and honour <code>fs_root<\/code> confinement.<\/li>\n<\/ul>\n","html_ru":"<h1>Нагрузочное тестирование GraphQL<\/h1>\n<p>perfscale нагружает <strong>GraphQL<\/strong>-эндпоинты через встроенный движок шагов:\nодна операция на шаг, запросы и мутации по HTTP POST (или опционально GET),\nпричём запрос валидируется по схеме самого эндпоинта ещё до того, как будет\nотправлен.<\/p>\n<p>Никакой кодогенерации и клиентских заглушек: документ — это обычный текст в\nYAML (или файл <code>.graphql<\/code>), переменные — JSON, а ответы возвращаются в виде\nструктурированных <code>data<\/code>/<code>errors<\/code>, из которых следующие шаги извлекают данные\nподстановкой <code>${{ … }}<\/code>.<\/p>\n<p>Эта страница — руководство. Параметры и выходные данные шага описаны в\n<a href=\"#/docs/core/actions\">справочнике действий<\/a>; готовый к запуску сценарий —\n<a href=\"../../examples/graphql.test.yaml\"><code>examples/graphql.test.yaml<\/code><\/a>.<\/p>\n<h2>Одно действие: <code>std/graphql@v1<\/code><\/h2>\n<pre><code class=\"language-yaml\">steps:\n  - name: fetch viewer\n    use: std/graphql@v1\n    with:\n      url: https://api.example.com/graphql\n      query: |\n        query GetViewer($id: ID!) {\n          viewer(id: $id) { id name }\n        }\n      variables: { \"id\": \"${{ vars.viewer_id }}\" }\n    check:\n      status: 200\n    outputs: viewer\n\n  - name: rename widget\n    use: std/graphql@v1\n    with:\n      url: https://api.example.com/graphql\n      query: |\n        mutation Rename($id: ID!, $name: String!) {\n          renameWidget(id: $id, name: $name) { id }\n        }\n      variables: { \"id\": \"${{ viewer.data.viewer.id }}\", \"name\": \"w-${seq}\" }\n<\/code><\/pre>\n<ul>\n<li><code>query<\/code> задаётся инлайн (многострочный YAML хорошо читается); <code>query_file<\/code>\nуказывает на файл <code>.graphql<\/code> — эти два параметра взаимоисключающие.<\/li>\n<li><code>variables<\/code> — JSON-объект. Подстановка <code>$
