<\/a> load with GPU state. Off by default; collection\nfailures (no GPU, missing tooling) log one warning and never fail the run.<\/p>\n<pre><code class=\"language-yaml\">gpu:\n  enabled: true\n  interval_ms: 1000                          # default 1000 (min 10)\n  source: nvidia-smi                         # nvidia-smi (default) | dcgm\n  dcgm_url: http://127.0.0.1:9400/metrics    # for source: dcgm\n  devices: [0, 1]                            # optional; default — all GPUs\n<\/code><\/pre>\n<p>Full guide: <a href=\"#/docs/core/gpu\">core/gpu.md<\/a>.<\/p>\n<h3>Engine self-metrics (<code>engine_metrics:<\/code>)<\/h3>\n<p>The engine measures the system under test but, by default, not itself. With\n<code>engine_metrics.enabled: true<\/code> a probe task wakes every <code>interval_ms<\/code> during\nthe VU phase and records the engine's own overhead into the run summary:<\/p>\n<ul>\n<li><code>engine_scheduler_lag_ms<\/code> (histogram) — tokio scheduler lag: how late the\nprobe woke relative to its schedule. A starved runtime shows up here\nbefore it shows up in the workload's percentiles.<\/li>\n<li><code>engine_log_channel_depth_max<\/code> (gauge) — peak pending lines in the bounded\nrun-log channel (capacity 512). Approaching the capacity means step\nlogging is back-pressuring the VUs.<\/li>\n<\/ul>\n<pre><code class=\"language-yaml\">engine_metrics:\n  enabled: true\n  interval_ms: 100        # default 100 (min 10) — also the lag resolution\n<\/code><\/pre>\n<p>Off by default: nothing is spawned unless <code>enabled: true<\/code>, so a regular run\npays nothing. Native engine only.<\/p>\n<h3>Load profiles<\/h3>\n<p>The native engine supports three load profiles. <code>stages<\/code>/<code>arrival<\/code> override\n<code>vus<\/code>/<code>duration<\/code> (lint warns if both are set) and are mutually exclusive;\nthe run length is the sum of the stage durations.<\/p>\n<p><strong>Fixed<\/strong> (the default): <code>vus<\/code> workers loop the steps for <code>duration<\/code>.<\/p>\n<pre><code class=\"language-yaml\">vus: 10\nduration: 5m\n<\/code><\/pre>\n<p><strong>Ramping VUs<\/strong> (<code>stages:<\/code>, k6-style): the target VU count interpolates\nlinearly between stage targets — the first stage ramps from 0, each next one\nfrom the previous stage's <code>target<\/code>. Scale-down is graceful: a VU being\nramped away finishes its in-flight step and exits at the next step boundary.<\/p>\n<pre><code class=\"language-yaml\">stages:\n  - { duration: 30s, target: 10 }  # ramp 0→10 VUs\n  - { duration: 1m,  target: 50 }  # ramp 10→50 VUs\n  - { duration: 30s, target: 0 }   # ramp down, drain to zero\n<\/code><\/pre>\n<p><strong>Arrival-rate<\/strong> (<code>arrival:<\/code>, open model): the engine holds an\niterations-per-second rate profile and scales a worker pool to keep up —\nnew iterations start on schedule even when the system under test slows down\n(where a fixed-VU loop would stretch). <code>rate<\/code> ramps linearly between stages\n(fractions allowed: <code>0.5<\/code> = one iteration every 2s).<\/p>\n<pre><code class=\"language-yaml\">arrival:\n  max_vus: 100              # worker pool cap — required, ≥ 1\n  pre_allocated_vus: 10     # workers spawned up front (default 1); the pool grows lazily to max_vus\n  stages:\n    - { duration: 30s, rate: 5 }    # ramp 0→5 iterations/sec\n    - { duration: 1m,  rate: 20 }   # ramp 5→20 iterations/sec\n<\/code><\/pre>\n<p>A permit that arrives while all <code>max_vus<\/code> workers are busy is dropped and\ncounted in the <code>dropped_iterations<\/code> summary metric (plus a warning logged at\nmost once per 5s) — raise <code>max_vus<\/code> or lower the rate when it grows.<\/p>\n<p>For <code>stages<\/code>/<code>arrival<\/code> runs the summary's <code>vus<\/code> line reports the observed\nconcurrency (<code>vus....................: &lt;last&gt; min=&lt;min&gt; max=&lt;max&gt;<\/code>), the\nperiodic <code>[stats]<\/code> line gains a trailing <code>vus=N<\/code> field, and summary exports\n(<code>--summary-export<\/code>) report <code>vus: null<\/code> with <code>duration<\/code> set to the summed\nstage length.<\/p>\n<p>Stage durations use the same <code>\"500ms\"<\/code>/<code>\"30s\"<\/code>/<code>\"1m30s\"<\/code>/<code>\"1h\"<\/code> grammar as <code>duration<\/code>\nbut are validated strictly: an unparseable or zero stage duration fails the\nrun (and <code>perfscale lint<\/code>) with a clear error. <code>stages<\/code> and <code>arrival<\/code> are\nnative-engine only — with <code>--locust<\/code> they're rejected (use <code>vus<\/code>/<code>duration<\/code>),\nwith <code>--k6<\/code> the config file is ignored anyway. See\n<a href=\"../examples/ramping.config.yaml\">examples/ramping.config.yaml<\/a>,\n<a href=\"../examples/spike.config.yaml\">examples/spike.config.yaml<\/a>, and\n<a href=\"../examples/arrival-rate.config.yaml\">examples/arrival-rate.config.yaml<\/a>.<\/p>\n<h3>Libraries (<code>libraries:<\/code>)<\/h3>\n<p>Libraries provide value-generating functions for <code>${...}<\/code> generator tokens\n(RFC 005) — real UUIDs, ULIDs, faker-style data, dates — beyond the\nhardcoded <code>${seq}<\/code>/<code>${rand(a,b)}<\/code>/<code>${uuid}<\/code>/<code>${now}<\/code> built-ins. Declared in\nthe config file, the test file, or both (declarations concatenate; a\nduplicate alias is a validation error):<\/p>\n<pre><code class=\"language-yaml\">libraries:\n  - use: '@std/random@v1'          # built-in; default alias: random\n    capabilities: []               # required key — [] means \"no grants\"\n  - use: '@std/random@v1'\n    as: ids                        # alias → token prefix ${ids.fn(...)}\n    capabilities: []\n  - use: ./libs/fixer-ids.wasm     # local WASM component (path relative to this file)\n    capabilities: []\n  - use: 'https://vendor.example.com/fixer-ids.wasm'   # remote: perfscale install\n    sha256: '9f2c…64 hex…'\n    capabilities: []\n  - use: 'git+https://github.com/org/repo.git@v1.2.3#libs/fixer-ids.wasm'  # git: perfscale install\n    capabilities: []\n<\/code><\/pre>\n<p>Payloads in actions that expand <code>${...}<\/code> (http, ws, gRPC, GraphQL, tcp, udp,\nllm, db parameters, pubsub, file-write — everything except std/log) can then\ncall the library's functions:<\/p>\n<pre><code class=\"language-yaml\">with:\n  send: '{ \"id\": \"${random.ulid()}\", \"who\": \"${random.email()}\", \"n\": \"${ids.int(1000,9999)}\" }'\n<\/code><\/pre>\n<p>Rules:<\/p>\n<ul>\n<li>Built-in tokens (<code>${seq}<\/code>, <code>${rand}<\/code>, …) match first and are unchanged.\nAn alias may not shadow their names.<\/li>\n<li>Unknown alias → token left verbatim. Known alias + unknown function (or\nbad arguments) → the step <strong>fails<\/strong> — a typo must not ship silently into\na payload.<\/li>\n<li>Arguments map text → JSON by a fixed contract: split on commas not inside\ndouble quotes, trim, strip one pair of surrounding quotes, parse as JSON\nif possible, else treat as a string. So <code>pick(a|b|c)<\/code> passes one string\n<code>\"a|b|c\"<\/code> and <code>int(1,100)<\/code> passes two numbers.<\/li>\n<li>Any function's optional trailing <code>key<\/code> argument memoizes the result\n<strong>within one message<\/strong>: <code>${random.uuid4(order)}<\/code> appearing twice in one\nmessage yields one id; the next message generates a fresh one.<\/li>\n<li><code>seed: 42<\/code> in the config makes a run reproducible: per-instance seeds\nderive as <code>hash(seed, vu_id, conn_seq)<\/code>.<\/li>\n<li><code>capabilities:<\/code> is <strong>required on every entry<\/strong> — an explicit empty list\n(<code>capabilities: []<\/code>) means \"no grants\"; omitting the key is a validation\nerror at load, <code>lint<\/code>, and run. Non-empty grants (<code>fs<\/code>, <code>clock<\/code>, or\n<code>{ net: [hosts] }<\/code>) require\n<code>allow_library_capabilities: true<\/code> (fail-closed, same pattern as\n<code>allow_file_actions<\/code>). <code>@std/random@v1<\/code> declares no capabilities —\ngranting it any is a validation error. A library whose <code>info()<\/code> reports\n<code>\"pure\": true<\/code> needs no grant for its <code>wasi:filesystem<\/code> /\n<code>wasi:clocks/wall-clock<\/code> imports (jco toolchain noise) — and gets no\npreopens, so real file access fails at runtime.<\/li>\n<\/ul>\n<h4>Run settings (<code>CallCtx.settings_json<\/code>)<\/h4>\n<p>Every library call receives the run's settings as a JSON object, frozen\nonce at run start — the string is identical for every VU, iteration, and\ncall of the run:<\/p>\n<pre><code class=\"language-json\">{\n  \"vus\": 10,            // fixed profile only, else null\n  \"duration_ms\": 300000, // fixed profile only, else null\n  \"seed\": 42,           // config seed, or null\n  \"stages\": null,       // staged profile: [{ \"duration_ms\", \"target\" }]\n  \"arrival\": null,      // arrival profile: { \"max_vus\", \"pre_allocated_vus\", \"stages\": [{ \"duration_ms\", \"rate\" }] }\n  \"variables\": {}       // config `variables:` with ${{ env.* }} resolved\n}\n<\/code><\/pre>\n<p><code>vus<\/code>/<code>duration_ms<\/code> are only set for the fixed load profile; staged and\narrival-rate runs leave them null and carry the profile in\n<code>stages<\/code>/<code>arrival<\/code> (durations normalized to milliseconds). <code>variables<\/code> are\nresolved through the same interpolation steps use — so an env-sourced value\na library now receives is also recorded in the run's secret registry and\nstays masked in the run log. Components built against the WIT 0.1 ABI\nreceive <code>\"{}\"<\/code> (the 0.1 context has no settings field).<\/p>\n<h4>Policy rules: <code>secret<\/code> / <code>allow<\/code> / <code>deny<\/code> / <code>log<\/code><\/h4>\n<p>A library entry can restrict which functions are callable and force result\nmasking (all optional):<\/p>\n<pre><code class=\"language-yaml\">libraries:\n  - use: '@std/random@v1'\n    capabilities: []      # required on every entry; [] = no grants\n    secret: true          # mask every result of this library in the run log\n    allow: [uuid4, ulid]  # whitelist: other calls fail the step\n    deny: [email]         # blacklist: wins over allow\n    log: [uuid4]          # always mask these functions' results\n<\/code><\/pre>\n<ul>\n<li>\n<p><code>deny:<\/code> wins over <code>allow:<\/code> when a name appears in both; a blocked call\nfails the step with a message naming the rule, and <code>perfscale lint<\/code>\nflags it in <code>${alias.fn(...)}<\/code> tokens.<\/p>\n<\/li>\n<li>\n<p>Masking is <strong>additive<\/strong>: a result is masked when the function declares\n<code>secret: true<\/code> in its metadata, the entry sets <code>secret: true<\/code>, or the\nfunction is in the entry's <code>log:<\/code> list. There is deliberately no way to\n<em>un<\/em>mask. Masked values are recorded in the run's secret registry and\nshown as <code>***<\/code> in the run log; the wire payload keeps the real value.<\/p>\n<\/li>\n<li>\n<p>Every name in <code>allow:<\/code>/<code>deny:<\/code>/<code>log:<\/code> must be a function the library\nactually exports — a typo is a hard validation error (it would silently\nnever fire).<\/p>\n<\/li>\n<li>\n<p>Local paths (<code>use: ./libs/fixer-ids.wasm<\/code>) load WASM component libraries\n(WASI Preview 2, <code>perfscale:library@0.2.0<\/code> WIT — components built against\nthe older <code>@0.1.x<\/code> ABI keep loading, they just never see the run settings;\nsee <a href=\"../rfcs/005-libraries.md\">RFC 005<\/a>). Paths resolve <strong>relative to the\ndeclaring file's directory<\/strong>, like <code>import:<\/code> paths. The perfscale CLI\nbinary ships WASM support; embedders of <code>perfscale-core<\/code> need the\n<code>wasm-libs<\/code> cargo feature.<\/p>\n<\/li>\n<\/ul>\n<p>Remote sources (<code>https://…<\/code> and <code>git+…<\/code>) are <strong>distribution refs<\/strong> — they\nare never fetched at run time. <code>perfscale install &lt;files&gt;<\/code> fetches each\nremote library once, verifies its digest, stores it in the\ncontent-addressed cache (<code>&lt;cache&gt;/libraries/&lt;sha256&gt;.wasm<\/code>), and writes\n<code>perfscale.lock<\/code> next to the declaring file. <code>perfscale run<\/code> and\n<code>perfscale lint<\/code> then resolve every remote ref through lock + cache,\n<strong>fully offline<\/strong>: a missing lock, a missing entry, or a missing cache\nartifact is a hard error that says to run <code>perfscale install<\/code>.<\/p>\n<pre><code class=\"language-yaml\"># HTTPS: sha256 pins the artifact — a re-published artifact with a\n# different digest is a hard error, never a silent swap. The pin is\n# optional: without it, `perfscale install` pins the computed digest in\n# the lockfile and prints a warning advising to add it here.\n- use: 'https://vendor.example.com/fixer-ids.wasm'\n  sha256: '9f2c…(64 hex)…'\n\n# git: repo URL + ref (tag/branch/commit) + artifact path inside the repo.\n# The ref is resolved to a commit at install time and pinned with the\n# artifact digest; `perfscale install --refresh` re-resolves it.\n- use: 'git+https://github.com/org/repo.git@v1.2.3#libs/fixer-ids.wasm'\n<\/code><\/pre>\n<p><code>perfscale.lock<\/code> is TOML, keyed by the exact <code>use:<\/code> string, and meant to be\ncommitted:<\/p>\n<pre><code class=\"language-toml\">version = 1\n\n[[libraries]]\nuse = \"https://vendor.example.com/fixer-ids.wasm\"\nsha256 = \"…\"\n\n[[libraries]]\nuse = \"git+https://github.com/org/repo.git@v1.2.3#libs/fixer-ids.wasm\"\ncommit = \"…resolved sha…\"\nsha256 = \"…artifact digest…\"\n<\/code><\/pre>\n<p>Notes:<\/p>\n<ul>\n<li>The cache honors <code>PERFSCALE_CACHE_DIR<\/code> (then <code>XDG_CACHE_HOME/perfscale<\/code>,\ndefault <code>~/.cache/perfscale<\/code>) — the same root as the <code>import:<\/code> git clone\ncache.<\/li>\n<li>Libraries declared in a git-imported document (<code>import: { git: … }<\/code>) are\npinned by the <code>perfscale.lock<\/code> <strong>inside that repository<\/strong> (at its root);\nrun <code>perfscale install<\/code> on the importing file and it is written there.\nInstall follows <code>import:<\/code> chains (including remote ones) for exactly\nthis reason.<\/li>\n<li>For <code>git+<\/code> refs a YAML <code>sha256:<\/code> is optional: the commit pin is the\nintegrity anchor. When present, install verifies it and a mismatch is a\nhard error.<\/li>\n<\/ul>\n<h4>AOT compilation (burn cache) and <code>perfscale burn<\/code><\/h4>\n<p>Compiling a WASM component (Cranelift) costs real time on every <code>run<\/code>/\n<code>lint<\/code> — seconds for large components. Two mechanisms remove it:<\/p>\n<ul>\n<li><strong>Burn cache.<\/strong> <code>perfscale install<\/code> precompiles every declared WASM\nlibrary — remote <em>and<\/em> local <code>./path.wasm<\/code> (local libraries get no\n<code>perfscale.lock<\/code> entry; the file itself is already local) — into\n<code>&lt;cache&gt;/libraries/&lt;sha256&gt;.cwasm<\/code>. The loader probes this cache first and\ndeserializes the artifact (native code, mmap-fast); on any miss or\nmismatch it silently falls back to a full compile, so the cache is purely\nadvisory. Artifacts carry a header pinning the wasmtime version, target\ntriple, engine configuration, and the source digest: <strong>upgrading\nperfscale invalidates them — re-run <code>perfscale install<\/code> to re-burn<\/strong>.<\/li>\n<li><strong>Binary embedding.<\/strong> <code>perfscale burn -f test.yaml [-c config.yaml] -o ./perfscale+libs<\/code> writes a copy of the running binary with the <code>.cwasm<\/code>\nartifacts of the documents' libraries appended (a <code>PFSEMBED<\/code> trailer — no\nexecutable-section patching, works for ELF/Mach-O/PE). The derived binary\nresolves those libraries from itself by exact <code>use:<\/code> string, so it runs\nwith <strong>no <code>.wasm<\/code> files, cache, or <code>perfscale.lock<\/code> on disk<\/strong> — a single\nfile to ship to load generators. Remote refs must be installed first.\nBecause embedding bakes in the artifacts, a burned binary that detects a\nheader mismatch fails with a \"re-burn\" error rather than falling back;\nre-run <code>perfscale burn<\/code> with the current perfscale.<\/li>\n<\/ul>\n<p>What burn does <strong>not<\/strong> change: per-call overhead (JSON marshaling of\narguments, per-instance store/memory per VU) is unchanged — burn removes\nper-run compilation, not call cost.<\/p>\n<p>WASM library rules:<\/p>\n<ul>\n<li>The sandbox is fail-closed: the component's WIT imports are inspected at\nload, and anything beyond the YAML <code>capabilities:<\/code> grant is a hard load\nerror naming the needed vs granted capabilities — unless the component's\n<code>info()<\/code> declares <code>\"pure\": true<\/code>, in which case <code>wasi:filesystem<\/code> /\n<code>wasi:clocks/wall-clock<\/code> imports are waived as toolchain noise (the guest\nstill gets no preopens, so actual file access fails at runtime). <code>fs<\/code> is\na read-only preopen confined to <code>fs_root<\/code> (default: the directory\ncontaining the <code>.wasm<\/code>); <code>clock<\/code> is <code>wasi:clocks<\/code>; <code>net: [hosts]<\/code> grants\noutbound HTTP via <code>wasi:http<\/code> with a destination allowlist checked on\nevery request (<code>host<\/code> allows any port, <code>host:port<\/code> pins one, <code>*.suffix<\/code>\nmatches any host under the suffix); requests outside the allowlist fail\nwith an error naming the destination, and the host bounds each call at\n30 s per request with a 16 MiB cap on request and response bodies;\n<code>wasi:random<\/code> and raw sockets are never provided — libraries draw\nrandomness from the seeded PRNG (<code>ctx.seed<\/code>) in their SDK.<\/li>\n<li><code>with:<\/code> is passed to the component's <code>init()<\/code> as JSON; an init failure is\nfatal to the run.<\/li>\n<li>A trapping or runaway call fails the step: every call runs under a\nper-call fuel budget (~50M) and each instance is capped at 64 MiB of\nmemory.<\/li>\n<li>A component file may be at most 64 MiB at load (the same cap\n<code>perfscale install<\/code> enforces on remote fetches) — compilation memory\nscales with module size, and the cap applies before fuel/memory limits\ncan.<\/li>\n<li>The artifact cache is verified at run time, not just at install: a cached\n<code>.wasm<\/code> whose bytes no longer hash to the pinned digest (corruption or\ntampering) is a hard error saying to re-run <code>perfscale install<\/code>. Burn\nartifacts (<code>.cwasm<\/code>, embedded payloads) carry a header pinning the source\ndigest, wasmtime version, target triple, and engine configuration, and\nare only ever deserialized after a full header match.<\/li>\n<li>Author libraries in Rust with\n<a href=\"../crates/perfscale-library-sdk/README.md\"><code>perfscale-library-sdk<\/code><\/a>.<\/li>\n<\/ul>\n<p><code>@std/random@v1<\/code> functions:<\/p>\n<table><thead><tr><th>Function<\/th><th>Returns<\/th><\/tr><\/thead><tbody>\n<tr><td><code>uuid4([key])<\/code><\/td><td>Random RFC 4122 v4 UUID<\/td><\/tr>\n<tr><td><code>uuid7([key])<\/code><\/td><td>Time-ordered RFC 9562 v7 UUID (48-bit unix-ms prefix)<\/td><\/tr>\n<tr><td><code>ulid([key])<\/code><\/td><td>26-char Crockford-base32 ULID (unix-ms prefix)<\/td><\/tr>\n<tr><td><code>nanoid([len], [key])<\/code><\/td><td>URL-safe id from <code>A-Za-z0-9_-<\/code> (default len 21)<\/td><\/tr>\n<tr><td><code>int(a, b, [key])<\/code><\/td><td>Random integer in <code>[a, b]<\/code> inclusive<\/td><\/tr>\n<tr><td><code>float(a, b, [dp], [key])<\/code><\/td><td>Random float in <code>[a, b]<\/code>, <code>dp<\/code> decimals (default 2)<\/td><\/tr>\n<tr><td><code>pick(a|b|c, [key])<\/code><\/td><td>Random pick among <code>|<\/code>-separated options<\/td><\/tr>\n<tr><td><code>weighted(a:10|b:90, [key])<\/code><\/td><td>Weighted random pick among <code>value:weight<\/code> pairs<\/td><\/tr>\n<tr><td><code>seq(name)<\/code><\/td><td>Named monotonic counter per generator instance, starting at 1<\/td><\/tr>\n<tr><td><code>pattern(\"ORD-####-????\")<\/code><\/td><td>Template fill: <code>#<\/code>→digit, <code>?<\/code>→a-z, <code>^<\/code>→A-Z, <code>*<\/code>→alphanumeric<\/td><\/tr>\n<tr><td><code>first_name()<\/code> / <code>last_name()<\/code> / <code>name()<\/code><\/td><td>Random names (small embedded corpora)<\/td><\/tr>\n<tr><td><code>username()<\/code> / <code>email()<\/code> / <code>company()<\/code><\/td><td>Random username / email / company<\/td><\/tr>\n<tr><td><code>lorem([words])<\/code><\/td><td>Lorem-ipsum words (default 5)<\/td><\/tr>\n<tr><td><code>phone()<\/code><\/td><td>Random phone number (<code>+1-NNN-NNN-NNNN<\/code>)<\/td><\/tr>\n<tr><td><code>date(a, b)<\/code><\/td><td>Random date between <code>YYYY-MM-DD<\/code> a and b inclusive, <code>YYYY-MM-DD<\/code> out<\/td><\/tr>\n<tr><td><code>timestamp(a, b)<\/code><\/td><td>Random unix-ms timestamp in <code>[a, b]<\/code><\/td><\/tr>\n<tr><td><code>datetime(a, b)<\/code><\/td><td>Random RFC 3339 datetime between dates a and b (whole end day included)<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Composing documents: <code>import<\/code><\/h3>\n<p>Both test definitions and configs accept a top-level <code>import:<\/code> naming a base\ndocument. The base loads first (it may import its own base, recursively),\nthen the current document deep-merges on top: <strong>objects merge key-by-key,\nscalars and arrays (including <code>steps:<\/code>) are replaced<\/strong> by the importing\nside. The one exception is <code>libraries:<\/code>, which concatenates across the\nchain — a duplicate alias is a validation error.<\/p>\n<pre><code class=\"language-yaml\"># team config — inherits the org-wide base, overrides one variable\nimport: ../shared/_base.yaml\nvariables:\n  region: us\n<\/code><\/pre>\n<p>Three source forms:<\/p>\n<pre><code class=\"language-yaml\"># relative filesystem path (resolved against the importing file's directory)\nimport: ../shared/_base.yaml\n\n# raw HTTP(S) URL — pin the ref in the path\nimport: \"https://raw.githubusercontent.com/org/repo/v1.2.0/perf/config/_base.yaml\"\n\n# any git host (SSH or HTTPS remotes, self-hosted included)\nimport:\n  git: git@gitlab.example.com:group/repo.git\n  ref: v1.2.0          # tag, branch, or commit SHA\n  file: perf/config/_base.yaml\n<\/code><\/pre>\n<p>Remote imports (URL and git) are <strong>fail-closed<\/strong>: they run only when the\ncaller passes <code>--allow-remote-import<\/code>. The permission belongs to the caller\nbecause import resolution happens before the <code>allow_file_actions<\/code> /\n<code>allow_process_actions<\/code> gates — a remote base could otherwise grant itself\nthose rights and pull in a <code>std/child_process@v1<\/code> step. A document can never\nopt itself into the network.<\/p>\n<p>Origins stay confined: a document fetched from a URL resolves relative\nimports against its own URL; a document from a git repo may only import\nfiles inside that same clone (<code>../<\/code> escapes are rejected). A remote document\ncan never read your local filesystem. Import cycles fail with the chain\nprinted.<\/p>\n<p>Git imports clone with <code>--depth 1<\/code> through your system <code>git<\/code> (SSH keys and\ncredential helpers apply) and cache under <code>~/.cache/perfscale/imports/<\/code>.\nTags and commit SHAs are immutable — cached forever. Branches revalidate\nagainst the remote after a short TTL, so <code>ref: main<\/code> follows the branch;\n<code>--refresh-imports<\/code> forces a refetch. The full guide lives in\n<a href=\"#/docs/core/imports\">docs/core/imports.md<\/a>.<\/p>\n<h3>Setup and variables<\/h3>\n<p><code>before:<\/code> steps run <strong>once<\/strong>, in order, before any VU starts — for one-time\nsetup like fetching a token or building a connection profile. Each <code>before<\/code>\nstep is a normal step (<code>use<\/code>/<code>with<\/code>/<code>outputs<\/code>); its <code>outputs<\/code> name is exposed\nto <strong>every<\/strong> test step under the <code>config<\/code> namespace. <code>variables:<\/code> holds static\nvalues, exposed under <code>vars<\/code>.<\/p>\n<pre><code class=\"language-yaml\">vus: 50\nvariables:\n  region: eu-west\nbefore:\n  - uses: std/http@v1\n    with:\n      method: POST\n      url: \"https://api.example.com/token\"\n      body: { user: demo, region: \"${{ vars.region }}\" }\n    outputs: auth            # ← exposed to test steps as config.auth\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - uses: std/http@v1\n    with:\n      url: \"https://api.example.com/me\"\n      headers:\n        authorization: \"Bearer ${{ config.auth.body }}\"   # from before step\n        x-region: \"${{ vars.region }}\"                      # from variables\n<\/code><\/pre>\n<ul>\n<li><code>before<\/code> runs regardless of <code>--quiet<\/code> (its failures always print). If any\nsetup step fails, the run <strong>aborts before spawning VUs<\/strong> — a broken setup\nwould make every iteration fail identically.<\/li>\n<li><code>before<\/code> steps see <code>${{ vars.* }}<\/code> and earlier setup outputs (under their own\n<code>outputs<\/code> name). Test steps see <code>config.*<\/code> and <code>vars.*<\/code> but not each other's.<\/li>\n<li>Interpolation always yields a <strong>string<\/strong>, so a numeric config value like\n<code>${{ config.fix_config.port }}<\/code> reaches the action as <code>\"1111\"<\/code>. Actions that\ntake numbers accept the string form.<\/li>\n<\/ul>\n<p>For the full lifecycle (including background processes started in <code>before:<\/code>),\nsee <a href=\"#/docs/core/setup-teardown\">Setup and teardown<\/a>.<\/p>\n<h3>Teardown (<code>after:<\/code>)<\/h3>\n<p><code>after:<\/code> steps run <strong>once<\/strong> after the load stops — on a normal finish, on a\nfailed run, on a failed <code>before:<\/code>, and on Ctrl-C/SIGTERM alike. They see the\nsame <code>${{ config.* }}<\/code> and <code>${{ vars.* }}<\/code> as test steps. Unlike <code>before:<\/code>, a\nfailing teardown step is logged but does not abort the remaining ones\n(best-effort cleanup). The typical <code>after:<\/code> step is a <code>std/kill_process@v1<\/code>\nfor a server <code>before:<\/code> started:<\/p>\n<pre><code class=\"language-yaml\">allow_process_actions: true\n\nbefore:\n  - name: web\n    uses: std/child_process@v1\n    with:\n      command: python3\n      args: [\"-m\", \"http.server\", \"8080\"]\n      port: 8080\n      waitUntil: { port_open: 8080, timeout: 10s }\n    outputs: web\n\nafter:\n  - name: stop web\n    uses: std/kill_process@v1\n    with: { name: web, signal: TERM }\n<\/code><\/pre>\n<p>Processes still alive after the <code>after:<\/code> steps are stopped automatically, so\nthe explicit kill is about a clean, timely stop rather than leak prevention.\nSee <a href=\"#/docs/core/actions\"><code>std/child_process@v1<\/code><\/a> for the full\nparameter list (restart policy, output capture, <code>waitUntil<\/code>),\n<a href=\"../examples/with-processes.config.yaml\">examples/with-processes.config.yaml<\/a>\nfor a runnable setup, and <a href=\"#/docs/core/setup-teardown\">Setup and teardown<\/a> for the\nwhole lifecycle (interrupts, auto-kill, data flow).<\/p>\n<p><code>after:<\/code> is also the home of run-level SLO gates: <code>std/thresholds@v1<\/code>\nevaluates k6-style expressions (<code>p95&lt;500<\/code>, <code>rate&lt;0.05<\/code>, <code>count==0<\/code>) against\nthe metrics the whole run collected, once, and fails the run (non-zero exit)\nwhen a <code>severity: fail<\/code> gate is violated:<\/p>\n<pre><code class=\"language-yaml\">after:\n  - name: slo gate\n    use: std/thresholds@v1\n    with:\n      db_query_duration: [\"p95&lt;500\", \"max&lt;2000\"]\n      db_query_failed: [\"rate&lt;0.05\"]\n      db_errors: [\"count==0\"]\n    severity: fail            # fail (default) | warn | info\n    message: \"checkout SLO\"   # optional, interpolated\n<\/code><\/pre>\n<p>See <a href=\"#/docs/core/actions\"><code>std/thresholds@v1<\/code><\/a> for the expression\ngrammar, metric kinds, and the <code>thresholds<\/code> field in the run summary JSON.<\/p>\n<p>With <code>--locust<\/code>, the same config maps to locust's <code>--users<\/code>/<code>--spawn-rate<\/code>/<code>--run-time<\/code>.\nWith <code>--k6<\/code>, load config lives in the script's own <code>options<\/code> block and the\nconfig file is ignored.<\/p>\n<h2>Validating without running: <code>perfscale lint<\/code><\/h2>\n<p>Check files ahead of time — in CI, pre-commit hooks, or while writing them:<\/p>\n<pre><code class=\"language-sh\">perfscale lint test.yaml config.yaml\n<\/code><\/pre>\n<p>Beyond schema validation, <code>lint<\/code> flags unknown and typo'd field names with\ndid-you-mean suggestions (<code>chek<\/code> → <code>check<\/code>, <code>vsu<\/code> → <code>vus<\/code>, <code>std/htp@v1<\/code> →\n<code>std/http@v1<\/code>), including per-action <code>with:<\/code> parameters. See\n<a href=\"#/docs/cli/commands\">CLI commands → lint<\/a>.<\/p>\n<h2>Validation errors<\/h2>\n<p>perfscale validates before running. Parsing is strict: unknown keys are\nrejected, not ignored — a typo like <code>iterations: 1<\/code> (or <code>chek:<\/code> instead of\n<code>check:<\/code>) fails validation and names the offending key, instead of silently\nchanging the load profile. This applies to the top level, every step's fixed\nfields, and the <code>report:<\/code>, <code>gpu:<\/code>, <code>stages:<\/code>/<code>arrival:<\/code>, and <code>libraries:<\/code>\nblocks. Examples of what you'll see:<\/p>\n<pre><code class=\"language-text\">error: schema validation failed:\n  /steps/0 — every step must name an action: `use: std/http@v1` (or the `uses:` alias)\n<\/code><\/pre>\n<pre><code class=\"language-text\">error: invalid YAML: found unexpected end of stream\n<\/code><\/pre>\n<p>Regenerate the schemas after changing the Rust types:<\/p>\n<pre><code class=\"language-sh\">cargo run -p perfscale-core --example gen_schema\n<\/code><\/pre>\n<p>(CI's <code>shipped_schemas_match_generated_ones<\/code> test fails if <code>schema/<\/code> goes stale.)<\/p>\n","html_ru":"<h1>Справочник по YAML<\/h1>\n<p>Нативный запуск управляется двумя файлами: <strong>определение теста<\/strong> (<code>-f<\/code>)\nописывает, <em>что<\/em> делать; <strong>конфиг<\/strong> (<code>-c<\/code>) описывает, <em>сколько нагрузки<\/em>\nподавать.<\/p>\n<p>Оба файла валидируются по JSON Schema до выполнения — ошибки указывают на\nпуть конкретного поля, а не на сырой вывод парсера. Схемы лежат в\n<a href=\"../schema/\"><code>schema/<\/code><\/a> и могут включать автодополнение в редакторе через\nмодлайн:<\/p>\n<pre><code class=\"language-yaml\"># yaml-language-server: $schema=https://raw.githubusercontent.com/Perfscale/perfscale/main/schema/test.schema.json\n<\/code><\/pre>\n<h2>Определение теста (<code>-f test.yaml<\/code>)<\/h2>\n<p>Один массив <code>steps<\/code>. Каждый виртуальный пользователь (VU) выполняет весь\nсписок в цикле, пока не истечёт заданная длительность. Опциональный\nверхнеуровневый <code>import:<\/code> наследует базовый документ — см.\n<a href=\"#composing-documents-import\">Композиция документов<\/a>. Опциональный\nверхнеуровневый <code>libraries:<\/code> объявляет библиотеки генераторов значений для\nтокенов <code>${alias.fn(...)}<\/code> — см. <a href=\"#libraries-libraries\">Библиотеки<\/a>.<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - name: login                     # необязательная метка для вывода в лог\n    use: std/http@v1                # обязательно — идентификатор действия\n    with:                           # параметры действия (см. ниже)\n      method: POST\n      url: https://api.example.com/login\n      body:\n        user: demo\n    check:                          # необязательные инлайн-проверки\n      status: 200\n      duration_ms_lt: 500\n    outputs: login                  # необязательно — сохранить вывод для следующих шагов\n<\/code><\/pre>\n<h3>Поля шага<\/h3>\n<table><thead><tr><th>Поле<\/th><th>Обязательно<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>use<\/code><\/td><td>да<\/td><td>Идентификатор действия: <code>std/http@v1<\/code>, <code>std/graphql@v1<\/code>, <code>std/tcp@v1<\/code>, <code>std/udp@v1<\/code>, <code>std/pubsub@v1<\/code>, <code>std/llm@v1<\/code>, <code>std/ws@v1<\/code>, <code>std/ws-connect@v1<\/code>, <code>std/ws-send@v1<\/code>, <code>std/ws-recv@v1<\/code>, <code>std/ws-ping@v1<\/code>, <code>std/ws-close@v1<\/code>, <code>std/grpc@v1<\/code>, <code>std/grpc-connect@v1<\/code>, <code>std/grpc-call@v1<\/code>, <code>std/grpc-stream-open@v1<\/code>, <code>std/grpc-stream-send@v1<\/code>, <code>std/grpc-stream-recv@v1<\/code>, <code>std/grpc-stream-close@v1<\/code>, <code>std/db-connect@v1<\/code>, <code>std/db-query@v1<\/code>, <code>std/db-tx-begin@v1<\/code>, <code>std/db-tx-commit@v1<\/code>, <code>std/db-tx-rollback@v1<\/code>, <code>std/db-close@v1<\/code>, <code>std/check@v1<\/code>, <code>std/sleep@v1<\/code>, <code>std/log@v1<\/code>, <code>std/file-read@v1<\/code>, <code>std/file-write@v1<\/code>, <code>std/child_process@v1<\/code>, <code>std/kill_process@v1<\/code>, <code>std/thresholds@v1<\/code>, <code>std/set_shared_variable@v1<\/code>, <code>std/get_shared_variable@v1<\/code> (также работают короткие алиасы <code>http<\/code>, <code>graphql<\/code>, <code>tcp<\/code>, <code>udp<\/code>, <code>pubsub<\/code>, <code>llm<\/code>, <code>ws<\/code>, <code>ws-connect<\/code>, <code>ws-send<\/code>, <code>ws-recv<\/code>, <code>ws-ping<\/code>, <code>ws-close<\/code>, <code>grpc<\/code>, <code>grpc-connect<\/code>, <code>grpc-call<\/code>, <code>grpc-stream-open<\/code>, <code>grpc-stream-send<\/code>, <code>grpc-stream-recv<\/code>, <code>grpc-stream-close<\/code>, <code>db-connect<\/code>, <code>db-query<\/code>, <code>db-tx-begin<\/code>, <code>db-tx-commit<\/code>, <code>db-tx-rollback<\/code>, <code>db-close<\/code>, <code>check<\/code>, <code>sleep<\/code>, <code>log<\/code>, <code>file-read<\/code>, <code>file-write<\/code>, <code>child_process<\/code>, <code>kill_process<\/code>, <code>thresholds<\/code>, <code>set_shared_variable<\/code>, <code>get_shared_variable<\/code>). <code>uses:<\/code> принимается как алиас для <code>use:<\/code><\/td><\/tr>\n<tr><td><code>name<\/code><\/td><td>нет<\/td><td>Человекочитаемая метка, отображаемая в строках лога<\/td><\/tr>\n<tr><td><code>with<\/code><\/td><td>нет<\/td><td>Параметры действия — см. <a href=\"#/docs/core/actions\">Действия<\/a><\/td><\/tr>\n<tr><td><code>check<\/code><\/td><td>нет<\/td><td>Проверки вывода этого шага — те же ключи, что у <code>std/check@v1<\/code><\/td><\/tr>\n<tr><td><code>outputs<\/code><\/td><td>нет<\/td><td>Имя переменной, под которой сохраняется вывод шага<\/td><\/tr>\n<tr><td><code>severity<\/code><\/td><td>нет<\/td><td>Только для <code>std/thresholds@v1<\/code>: во что превращается нарушенный порог — <code>fail<\/code> (по умолчанию; запуск завершается с ненулевым кодом), <code>warn<\/code> или <code>info<\/code><\/td><\/tr>\n<tr><td><code>message<\/code><\/td><td>нет<\/td><td>Только для <code>std/thresholds@v1<\/code>: пользовательская метка, добавляемая к сводке нарушений (интерполируется)<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Переменные (<code>${{ ... }}<\/code>)<\/h3>\n<p>Шаги передают данные последующим шагам через плейсхолдеры в стиле GitHub\nActions. Шаг сохраняет свой вывод под именем, заданным в <code>outputs:<\/code>; любое\n<strong>строковое значение<\/strong> в <code>with:<\/code> или <code>check:<\/code> последующего шага может затем\nссылаться на него:<\/p>\n<table><thead><tr><th>Выражение<\/th><th>Раскрывается в<\/th><\/tr><\/thead><tbody>\n<tr><td><code>${{ name }}<\/code><\/td><td>Весь сохранённый вывод, приведённый к строке<\/td><\/tr>\n<tr><td><code>${{ name.field }}<\/code><\/td><td>Одно поле сохранённого объекта (например, <code>.status<\/code>, <code>.body<\/code>, <code>.duration_ms<\/code>)<\/td><\/tr>\n<tr><td><code>${{ name.a.b }}<\/code><\/td><td>Вложенный путь — один уровень JSON на каждую <code>.<\/code>, например <code>${{ resp.headers.x-request-id }}<\/code><\/td><\/tr>\n<tr><td><code>${{ __last__ }}<\/code> / <code>${{ __last__.field }}<\/code><\/td><td>Вывод непосредственно предыдущего шага — всегда доступен, <code>outputs:<\/code> не нужен<\/td><\/tr>\n<tr><td><code>${{ config.&lt;name&gt;.&lt;field&gt; }}<\/code><\/td><td>Вывод шага инициализации <code>before:<\/code> из конфиг-файла (см. <a href=\"#config--c-configyaml\">Конфиг<\/a>)<\/td><\/tr>\n<tr><td><code>${{ vars.&lt;key&gt; }}<\/code><\/td><td>Статическое значение из блока <code>variables:<\/code> конфиг-файла<\/td><\/tr>\n<tr><td><code>${{ env.NAME }}<\/code><\/td><td>Переменная окружения процесса <code>NAME<\/code> — для секретов (<code>api_key<\/code>, токенов, DSN), которые не должны храниться в YAML<\/td><\/tr>\n<\/tbody><\/table>\n<p>Для <code>std/http@v1<\/code> сохранённый вывод имеет вид\n<code>{ \"status\": &lt;int&gt;, \"body\": &lt;string&gt;, \"duration_ms\": &lt;float&gt;, \"headers\": &lt;object&gt; }<\/code>\n— имена заголовков приводятся к нижнему регистру, поэтому заголовок сессии\nили токена из ответа 1 может перейти в запрос 2:<\/p>\n<pre><code class=\"language-yaml\">steps:\n  - use: std/http@v1\n    with: { url: \"https://api.example.com/first\" }\n    outputs: r1\n  - use: std/http@v1\n    with:\n      url: \"https://api.example.com/second\"\n      headers:\n        x-session: \"${{ r1.headers.x-session }}\"\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">steps:\n  - name: login\n    use: std/http@v1\n    with:\n      method: POST\n      url: \"https://api.example.com/token\"\n      body: { user: demo }\n    outputs: auth                          # ← сохраняется как `auth`\n\n  - name: fetch profile\n    use: std/http@v1\n    with:\n      url: \"https://api.example.com/me\"\n      headers:\n        authorization: \"Bearer ${{ auth.body }}\"   # вложенные значения работают\n    check:\n      body_contains: \"${{ auth.body }}\"            # и в check тоже\n\n  - use: std/log@v1\n    with:\n      message: \"login took ${{ auth.duration_ms }}ms → ${{ auth.status }}\"\n<\/code><\/pre>\n<p>Правила и граничные случаи:<\/p>\n<ul>\n<li>Плейсхолдеры работают в строковых значениях на <strong>любой глубине<\/strong>\n<code>with<\/code>/<code>check<\/code> — во вложенных объектах (заголовки), элементах массивов,\nтелах запросов. Ключи никогда не интерполируются.<\/li>\n<li>Пробелы внутри фигурных скобок игнорируются: <code>${{auth.status}}<\/code> ≡\n<code>${{ auth.status }}<\/code>.<\/li>\n<li><strong>Отсутствующая переменная или поле раскрываются в пустую строку<\/strong> —\nзапуск не падает. Проверяйте значение через <code>check:<\/code>, если отсутствие\nдолжно быть ошибкой. <strong>Исключение:<\/strong> <code>${{ env.NAME }}<\/code> с неустановленным\n<code>NAME<\/code> <strong>проваливает шаг<\/strong> с ошибкой <code>env var 'NAME' is not set<\/code> до запуска\nдействия — иначе молча пустой <code>api_key<\/code> проявился бы как непонятный 401 от\nAPI.<\/li>\n<li><code>${{ env.NAME }}<\/code> читает окружение процесса <code>perfscale<\/code> (всё после <code>env.<\/code> —\nэто имя переменной). <code>env<\/code> — зарезервированный префикс: сохранённый вывод с\nименем <code>env<\/code> будет им перекрыт. Раскрытые значения подставляются только в\nпараметры шагов — движок сам никогда не пишет их в логи или сводки. Он\nтакже записывает каждое раскрытое значение <code>env.*<\/code> в реестр уровня запуска\nи <strong>маскирует его в логе запуска<\/strong>: значения длиной 4+ символа заменяются\nна <code>***<\/code> везде, где встречаются (в том числе внутри URL и DSN), более\nкороткие — только как целые токены, — так что секрет, случайно попавший в\nURL запроса или сообщение <code>std/log@v1<\/code>, всё равно не утечёт в вывод. Именно\nпоэтому <code>env.*<\/code> — правильный канал для секретов.<\/li>\n<li>Сегменты пути спускаются на один уровень JSON-объекта за каждую <code>.<\/code> —\nзаголовки с точками в имени адресовать нельзя (редкий случай; всё остальное\nработает).<\/li>\n<li>Плейсхолдеры раскрываются отдельно для каждого виртуального пользователя и\nкаждой итерации — каждый VU видит выводы только своей цепочки шагов,\nникогда чужой.<\/li>\n<li>Шаги без <code>${{<\/code> выполняются как есть: движок полностью пропускает проход\nинтерполяции, поэтому обычные шаги не платят за эту возможность ничем.<\/li>\n<li>Кавычки в YAML: работают и без кавычек (<code>Bearer ${{ auth.body }}<\/code>), и в\nкавычках (<code>\"${{ auth.body }}\"<\/code>); ставьте кавычки, если значение начинается с\nсимвола, который YAML трактует специально (<code>{<\/code>, <code>[<\/code>, <code>*<\/code>, …).<\/li>\n<\/ul>\n<h2>Конфиг (<code>-c config.yaml<\/code>)<\/h2>\n<pre><code class=\"language-yaml\">vus: 10          # виртуальные пользователи, по умолчанию 1\nduration: 5m     # \"30s\", \"500ms\", \"1.5s\", \"1m\", \"5m30s\", \"1h\" — по умолчанию \"1m\"\n\nreport:          # необязательно — пересылка метрик в инстанс perfscale serve\n  url: http://localhost:7999\n  during_run: true      # также стримить накопительные снапшоты во время работы\n\ngpu:             # необязательно — метрики GPU во время запуска (нативный движок)\n  enabled: true\n  interval_ms: 1000\n  source: nvidia-smi\n<\/code><\/pre>\n<table><thead><tr><th>Поле<\/th><th>По умолчанию<\/th><th>Описание<\/th><\/tr><\/thead><tbody>\n<tr><td><code>vus<\/code><\/td><td><code>1<\/code><\/td><td>Одновременные виртуальные пользователи (фиксированный профиль)<\/td><\/tr>\n<tr><td><code>duration<\/code><\/td><td><code>1m<\/code><\/td><td>Длительность запуска по реальному времени; голые числа — секунды; доли секунды (<code>\"500ms\"<\/code>, <code>\"1.5s\"<\/code>) поддерживаются нативным движком<\/td><\/tr>\n<tr><td><code>stages<\/code><\/td><td>—<\/td><td>Профиль ramping-VU (в стиле k6): список стадий <code>{ duration, target }<\/code>. Переопределяет <code>vus<\/code>/<code>duration<\/code>; взаимоисключающий с <code>arrival<\/code>. Только нативный движок<\/td><\/tr>\n<tr><td><code>arrival<\/code><\/td><td>—<\/td><td>Профиль arrival-rate (открытая модель): <code>{ max_vus, pre_allocated_vus?, stages: [{ duration, rate }] }<\/code> — поддержание заданной частоты итераций/с. Взаимоисключающий со <code>stages<\/code>. Только нативный движок<\/td><\/tr>\n<tr><td><code>report.url<\/code><\/td><td>—<\/td><td>Базовый URL инстанса <code>perfscale serve<\/code>; флаг CLI <code>--report<\/code> переопределяет его<\/td><\/tr>\n<tr><td><code>report.during_run<\/code><\/td><td><code>false<\/code><\/td><td>Также стримить накопительные снапшоты метрик во время запуска (батчевые POST на <code>&lt;url&gt;/api/v1/metrics<\/code>), а не только сводку в конце — см. <a href=\"#/docs/core/metrics\">Метрики во время запуска<\/a>. Только нативный движок<\/td><\/tr>\n<tr><td><code>report.interval_ms<\/code><\/td><td><code>5000<\/code><\/td><td>Интервал снапшотов/сброса во время запуска, миллисекунды (мин. 1000)<\/td><\/tr>\n<tr><td><code>report.batch_size<\/code><\/td><td><code>500<\/code><\/td><td>Сбрасывать батч, как только в нём накопится столько сэмплов<\/td><\/tr>\n<tr><td><code>report.max_cpu_percent<\/code><\/td><td><code>90<\/code><\/td><td>Порог по CPU: пока загрузка CPU хоста ≥ этого значения, батчи удерживаются (без POST), а снапшоты ставятся в очередь — никогда не теряются — пока порог не откроется; <code>0<\/code> отключает; вне Linux не действует<\/td><\/tr>\n<tr><td><code>report.max_pending<\/code><\/td><td><code>24<\/code><\/td><td>Мягкий лимит недоставленных батчей — при превышении выводится предупреждение, но батчи сохраняются и доставляются по порядку, никогда не теряются посреди запуска<\/td><\/tr>\n<tr><td><code>gpu<\/code><\/td><td>—<\/td><td>Сбор метрик GPU — см. <a href=\"#gpu-metrics-gpu\">Метрики GPU<\/a>. Только нативный движок<\/td><\/tr>\n<tr><td><code>engine_metrics<\/code><\/td><td>—<\/td><td>Самонаблюдаемость движка — см. <a href=\"#engine-self-metrics-engine_metrics\">Собственные метрики движка<\/a>. Только нативный движок<\/td><\/tr>\n<tr><td><code>before<\/code><\/td><td><code>[]<\/code><\/td><td>Одноразовые шаги инициализации — см. <a href=\"#setup-and-variables\">Инициализация и переменные<\/a><\/td><\/tr>\n<tr><td><code>after<\/code><\/td><td><code>[]<\/code><\/td><td>Одноразовые шаги завершения — см. <a href=\"#teardown-after\">Завершение<\/a><\/td><\/tr>\n<tr><td><code>variables<\/code><\/td><td><code>{}<\/code><\/td><td>Статические значения, доступные шагам как <code>${{ vars.* }}<\/code>. Не храните секреты в этом блоке — это обычный YAML, попадающий в репозитории и диффы; для них используйте <code>${{ env.NAME }}<\/code> (окружение процесса, маскируется в логах запуска)<\/td><\/tr>\n<tr><td><code>shared_variables<\/code><\/td><td><code>{}<\/code><\/td><td>Изменяемое общее состояние между VU для <code>std/set_shared_variable@v1<\/code> / <code>std/get_shared_variable@v1<\/code>: отображение имя → начальное JSON-значение (тип выводится из него). Объявление обязательно — шаг, ссылающийся на необъявленное имя, или <code>op<\/code>, несовместимая с объявленным типом, проваливает валидацию до старта запуска. См. <a href=\"#/docs/core/shared-variables\">руководство по общим переменным<\/a>. Только нативный движок<\/td><\/tr>\n<tr><td><code>allow_process_actions<\/code><\/td><td><code>false<\/code><\/td><td>Разрешить шагам запускать/сигналить процессам ОС (<code>std/child_process@v1<\/code>, <code>std/kill_process@v1<\/code>). Fail-closed: список шагов из недоверенного источника не может трогать процессы, пока вы явно не разрешите<\/td><\/tr>\n<tr><td><code>allow_library_capabilities<\/code><\/td><td><code>false<\/code><\/td><td>Разрешить записям <code>libraries:<\/code> нести непустые выдачи <code>capabilities:<\/code>. Fail-closed, тот же паттерн, что у <code>allow_file_actions<\/code><\/td><\/tr>\n<tr><td><code>seed<\/code><\/td><td>—<\/td><td>Seed детерминизма уровня запуска: каждый генератор <code>${…}<\/code> и экземпляр библиотеки выводит свой seed как <code>hash(seed, vu_id, conn_seq)<\/code>, поэтому запуск с seed воспроизводит те же сгенерированные значения. Реальное время остаётся недетерминированным<\/td><\/tr>\n<tr><td><code>max_response_body_bytes<\/code><\/td><td><code>16777216<\/code> (16 МиБ)<\/td><td>Лимит размера тела ответа для <code>std/http@v1<\/code> / <code>std/graphql@v1<\/code>. Больший ответ завершает шаг понятной ошибкой (никогда не обрезается молча — обрезанное тело могло бы пройти <code>check:<\/code>). Только нативный движок<\/td><\/tr>\n<tr><td><code>libraries<\/code><\/td><td>—<\/td><td>Библиотеки генераторов значений для токенов <code>${alias.fn(...)}<\/code> — см. <a href=\"#libraries-libraries\">Библиотеки<\/a><\/td><\/tr>\n<tr><td><code>import<\/code><\/td><td>—<\/td><td>Базовый документ для наследования — см. <a href=\"#composing-documents-import\">Композиция документов<\/a><\/td><\/tr>\n<\/tbody><\/table>\n<h3>Метрики GPU (<code>gpu:<\/code>)<\/h3>\n<p>Сэмплирование GPU хоста (utilization, VRAM, температура, мощность) на\nпротяжении всего запуска с секцией <code>gpu<\/code> в сводке запуска — в первую очередь\nчтобы коррелировать нагрузку <a href=\"#/docs/core/llm\"><code>std/llm@v1<\/code><\/a> с состоянием GPU.\nПо умолчанию выключено; сбои сбора (нет GPU, отсутствуют утилиты) пишут одно\nпредупреждение и никогда не проваливают запуск.<\/p>\n<pre><code class=\"language-yaml\">gpu:\n  enabled: true\n  interval_ms: 1000                          # по умолчанию 1000 (мин. 10)\n  source: nvidia-smi                         # nvidia-smi (по умолчанию) | dcgm\n  dcgm_url: http://127.0.0.1:9400/metrics    # для source: dcgm\n  devices: [0, 1]                            # необязательно; по умолчанию — все GPU\n<\/code><\/pre>\n<p>Полное руководство: <a href=\"#/docs/core/gpu\">core/gpu.md<\/a>.<\/p>\n<h3>Собственные метрики движка (<code>engine_metrics:<\/code>)<\/h3>\n<p>Движок измеряет тестируемую систему, но по умолчанию не измеряет себя. С\n<code>engine_metrics.enabled: true<\/code> задача-пробник просыпается каждые\n<code>interval_ms<\/code> во время фазы VU и записывает собственные накладные расходы\nдвижка в сводку запуска:<\/p>\n<ul>\n<li><code>engine_scheduler_lag_ms<\/code> (гистограмма) — лаг планировщика tokio:\nнасколько позже расписания проснулся пробник. Голодание рантайма видно\nздесь раньше, чем в перцентилях нагрузки.<\/li>\n<li><code>engine_log_channel_depth_max<\/code> (gauge) — пиковое число ожидающих строк в\nограниченном канале лога запуска (ёмкость 512). Значение, близкое к\nёмкости, означает, что логирование шагов тормозит VU (back-pressure).<\/li>\n<\/ul>\n<pre><code class=\"language-yaml\">engine_metrics:\n  enabled: true\n  interval_ms: 100        # по умолчанию 100 (мин. 10) — также разрешение лага\n<\/code><\/pre>\n<p>По умолчанию выключено: без <code>enabled: true<\/code> ничего не запускается, обычный\nзапуск ничего не платит. Только нативный движок.<\/p>\n<h3>Профили нагрузки<\/h3>\n<p>Нативный движок поддерживает три профиля нагрузки. <code>stages<\/code>/<code>arrival<\/code>\nпереопределяют <code>vus<\/code>/<code>duration<\/code> (lint предупреждает, если задано и то, и\nдругое) и взаимоисключают друг друга; длительность запуска — сумма\nдлительностей стадий.<\/p>\n<p><strong>Фиксированный<\/strong> (по умолчанию): <code>vus<\/code> воркеров крутят шаги в цикле в\nтечение <code>duration<\/code>.<\/p>\n<pre><code class=\"language-yaml\">vus: 10\nduration: 5m\n<\/code><\/pre>\n<p><strong>Ramping VUs<\/strong> (<code>stages:<\/code>, в стиле k6): целевое число VU линейно\nинтерполируется между целями стадий — первая стадия поднимается с 0, каждая\nследующая — от <code>target<\/code> предыдущей стадии. Снижение происходит плавно: VU,\nкоторый убирается, завершает текущий шаг и выходит на следующей границе шага.<\/p>\n<pre><code class=\"language-yaml\">stages:\n  - { duration: 30s, target: 10 }  # рост 0→10 VU\n  - { duration: 1m,  target: 50 }  # рост 10→50 VU\n  - { duration: 30s, target: 0 }   # снижение до нуля\n<\/code><\/pre>\n<p><strong>Arrival-rate<\/strong> (<code>arrival:<\/code>, открытая модель): движок поддерживает профиль\nчастоты итераций в секунду и масштабирует пул воркеров, чтобы успевать, —\nновые итерации стартуют по расписанию, даже когда тестируемая система\nзамедляется (там, где цикл с фиксированным числом VU растянулся бы). <code>rate<\/code>\nлинейно растёт между стадиями (допустимы дроби: <code>0.5<\/code> = одна итерация каждые\n2 с).<\/p>\n<pre><code class=\"language-yaml\">arrival:\n  max_vus: 100              # потолок пула воркеров — обязательно, ≥ 1\n  pre_allocated_vus: 10     # воркеры, созданные заранее (по умолчанию 1); пул растёт лениво до max_vus\n  stages:\n    - { duration: 30s, rate: 5 }    # рост 0→5 итераций/с\n    - { duration: 1m,  rate: 20 }   # рост 5→20 итераций/с\n<\/code><\/pre>\n<p>Разрешение, пришедшее, пока все <code>max_vus<\/code> воркеров заняты, отбрасывается и\nучитывается в сводной метрике <code>dropped_iterations<\/code> (плюс предупреждение в\nлог не чаще раза в 5 с) — увеличьте <code>max_vus<\/code> или снизьте частоту, если она\nрастёт.<\/p>\n<p>Для запусков со <code>stages<\/code>/<code>arrival<\/code> строка <code>vus<\/code> в сводке показывает\nнаблюдаемый параллелизм (<code>vus....................: &lt;last&gt; min=&lt;min&gt; max=&lt;max&gt;<\/code>),\nпериодическая строка <code>[stats]<\/code> получает в конце поле <code>vus=N<\/code>, а экспорты\nсводки (<code>--summary-export<\/code>) возвращают <code>vus: null<\/code> с <code>duration<\/code>, равным сумме\nдлительностей стадий.<\/p>\n<p>Длительности стадий используют ту же грамматику <code>\"500ms\"<\/code>/<code>\"30s\"<\/code>/<code>\"1m30s\"<\/code>/<code>\"1h\"<\/code>,\nчто и <code>duration<\/code>, но валидируются строго: нечитаемая или нулевая длительность\nстадии проваливает запуск (и <code>perfscale lint<\/code>) с понятной ошибкой. <code>stages<\/code> и\n<code>arrival<\/code> доступны только в нативном движке — с <code>--locust<\/code> они отклоняются\n(используйте <code>vus<\/code>/<code>duration<\/code>), с <code>--k6<\/code> конфиг-файл всё равно игнорируется.\nСм. <a href=\"../examples/ramping.config.yaml\">examples/ramping.config.yaml<\/a>,\n<a href=\"../examples/spike.config.yaml\">examples/spike.config.yaml<\/a> и\n<a href=\"../examples/arrival-rate.config.yaml\">examples/arrival-rate.config.yaml<\/a>.<\/p>\n<h3>Библиотеки (<code>libraries:<\/code>)<\/h3>\n<p>Библиотеки предоставляют функции-генераторы значений для токенов <code>${...}<\/code>\n(RFC 005) — настоящие UUID, ULID, данные в стиле faker, даты — помимо\nвстроенных <code>${seq}<\/code>/<code>${rand(a,b)}<\/code>/<code>${uuid}<\/code>/<code>${now}<\/code>. Объявляются в\nконфиг-файле, файле теста или в обоих (объявления конкатенируются;\nдублирующийся алиас — ошибка валидации):<\/p>\n<pre><code class=\"language-yaml\">libraries:\n  - use: '@std/random@v1'          # встроенная; алиас по умолчанию: random\n    capabilities: []               # обязательный ключ — [] означает «без разрешений»\n  - use: '@std/random@v1'\n    as: ids                        # алиас → префикс токена ${ids.fn(...)}\n    capabilities: []\n  - use: ./libs/fixer-ids.wasm     # локальный WASM-компонент (путь относительно этого файла)\n    capabilities: []\n  - use: 'https://vendor.example.com/fixer-ids.wasm'   # удалённый: perfscale install\n    sha256: '9f2c…64 hex…'\n    capabilities: []\n  - use: 'git+https://github.com/org/repo.git@v1.2.3#libs/fixer-ids.wasm'  # git: perfscale install\n    capabilities: []\n<\/code><\/pre>\n<p>Полезные нагрузки в действиях, раскрывающих <code>${...}<\/code> (http, ws, gRPC,\nGraphQL, tcp, udp, llm, параметры db, pubsub, file-write — всё, кроме\nstd/log), могут затем вызывать функции библиотеки:<\/p>\n<pre><code class=\"language-yaml\">with:\n  send: '{ \"id\": \"${random.ulid()}\", \"who\": \"${random.email()}\", \"n\": \"${ids.int(1000,9999)}\" }'\n<\/code><\/pre>\n<p>Правила:<\/p>\n<ul>\n<li>Встроенные токены (<code>${seq}<\/code>, <code>${rand}<\/code>, …) сопоставляются первыми и не\nизменяются. Алиас не может перекрывать их имена.<\/li>\n<li>Неизвестный алиас → токен остаётся как есть. Известный алиас + неизвестная\nфункция (или неверные аргументы) → шаг <strong>проваливается<\/strong> — опечатка не\nдолжна молча попасть в полезную нагрузку.<\/li>\n<li>Аргументы отображаются текст → JSON по фиксированному контракту: разбиение\nпо запятым вне двойных кавычек, обрезка пробелов, снятие одной пары\nокружающих кавычек, разбор как JSON при возможности, иначе — строка. Так\n<code>pick(a|b|c)<\/code> передаёт одну строку <code>\"a|b|c\"<\/code>, а <code>int(1,100)<\/code> — два числа.<\/li>\n<li>Опциональный завершающий аргумент <code>key<\/code> любой функции мемоизирует результат\n<strong>в пределах одного сообщения<\/strong>: <code>${random.uuid4(order)}<\/code>, встретившийся\nдважды в одном сообщении, даёт один id; следующее сообщение генерирует\nновый.<\/li>\n<li><code>seed: 42<\/code> в конфиге делает запуск воспроизводимым: seed экземпляров\nвыводятся как <code>hash(seed, vu_id, conn_seq)<\/code>.<\/li>\n<li><code>capabilities:<\/code> <strong>обязателен в каждой записи<\/strong> — явный пустой список\n(<code>capabilities: []<\/code>) означает «без разрешений»; пропущенный ключ — ошибка\nвалидации при загрузке, <code>lint<\/code> и запуске. Непустые разрешения (<code>fs<\/code>,\n<code>clock<\/code> или <code>{ net: [hosts] }<\/code>) требуют\n<code>allow_library_capabilities: true<\/code> (fail-closed, тот же паттерн, что у\n<code>allow_file_actions<\/code>). <code>@std/random@v1<\/code> не объявляет никаких capability —\nвыдача ей любых — ошибка валидации. Библиотека, чей <code>info()<\/code> сообщает\n<code>\"pure\": true<\/code>, не нуждается в разрешениях для импортов <code>wasi:filesystem<\/code> /\n<code>wasi:clocks/wall-clock<\/code> (шум тулчейна jco) — и не получает preopen'ов,\nпоэтому реальный доступ к файлам падает в рантайме.<\/li>\n<\/ul>\n<h4>Настройки запуска (<code>CallCtx.settings_json<\/code>)<\/h4>\n<p>Каждый вызов библиотеки получает настройки запуска как JSON-объект,\nзамороженный один раз при старте запуска, — строка идентична для каждого VU,\nитерации и вызова в запуске:<\/p>\n<pre><code class=\"language-json\">{\n  \"vus\": 10,            // только фиксированный профиль, иначе null\n  \"duration_ms\": 300000, // только фиксированный профиль, иначе null\n  \"seed\": 42,           // seed из конфига или null\n  \"stages\": null,       // профиль со стадиями: [{ \"duration_ms\", \"target\" }]\n  \"arrival\": null,      // arrival-профиль: { \"max_vus\", \"pre_allocated_vus\", \"stages\": [{ \"duration_ms\", \"rate\" }] }\n  \"variables\": {}       // `variables:` из конфига с раскрытыми ${{ env.* }}\n}\n<\/code><\/pre>\n<p><code>vus<\/code>/<code>duration_ms<\/code> задаются только для фиксированного профиля нагрузки;\nзапуски со стадиями и arrival-rate оставляют их null и несут профиль в\n<code>stages<\/code>/<code>arrival<\/code> (длительности нормализованы до миллисекунд). <code>variables<\/code>\nраскрываются через ту же интерполяцию, что используют шаги, — поэтому\nзначение из env, которое теперь получает библиотека, также записывается в\nреестр секретов запуска и остаётся замаскированным в логе. Компоненты,\nсобранные под ABI WIT 0.1, получают <code>\"{}\"<\/code> (в контексте 0.1 нет поля\nнастроек).<\/p>\n<h4>Правила политики: <code>secret<\/code> / <code>allow<\/code> / <code>deny<\/code> / <code>log<\/code><\/h4>\n<p>Запись библиотеки может ограничивать, какие функции можно вызывать, и\nпринудительно маскировать результаты (всё опционально):<\/p>\n<pre><code class=\"language-yaml\">libraries:\n  - use: '@std/random@v1'\n    capabilities: []      # обязательно в каждой записи; [] = без разрешений\n    secret: true          # маскировать каждый результат этой библиотеки в логе запуска\n    allow: [uuid4, ulid]  # белый список: остальные вызовы проваливают шаг\n    deny: [email]         # чёрный список: побеждает allow\n    log: [uuid4]          # всегда маскировать результаты этих функций\n<\/code><\/pre>\n<ul>\n<li>\n<p><code>deny:<\/code> побеждает <code>allow:<\/code>, если имя встречается в обоих; заблокированный\nвызов проваливает шаг с сообщением, называющим правило, а <code>perfscale lint<\/code>\nпомечает его в токенах <code>${alias.fn(...)}<\/code>.<\/p>\n<\/li>\n<li>\n<p>Маскирование <strong>аддитивно<\/strong>: результат маскируется, если функция объявляет\n<code>secret: true<\/code> в своих метаданных, запись задаёт <code>secret: true<\/code> или функция\nнаходится в списке <code>log:<\/code> записи. Способа <em>снять<\/em> маску намеренно нет.\nЗамаскированные значения записываются в реестр секретов запуска и\nотображаются как <code>***<\/code> в логе запуска; полезная нагрузка по сети сохраняет\nреальное значение.<\/p>\n<\/li>\n<li>\n<p>Каждое имя в <code>allow:<\/code>/<code>deny:<\/code>/<code>log:<\/code> должно быть функцией, которую\nбиблиотека действительно экспортирует, — опечатка — жёсткая ошибка\nвалидации (иначе она молча никогда бы не сработала).<\/p>\n<\/li>\n<li>\n<p>Локальные пути (<code>use: ./libs/fixer-ids.wasm<\/code>) загружают библиотеки\nWASM-компонентов (WASI Preview 2, WIT <code>perfscale:library@0.2.0<\/code> —\nкомпоненты, собранные под старый ABI <code>@0.1.x<\/code>, продолжают загружаться,\nпросто они никогда не видят настройки запуска; см.\n<a href=\"../rfcs/005-libraries.md\">RFC 005<\/a>). Пути разрешаются <strong>относительно\nдиректории объявляющего файла<\/strong>, как пути <code>import:<\/code>. Бинарник perfscale CLI\nпоставляется с поддержкой WASM; встраивающим <code>perfscale-core<\/code> нужна\ncargo-фича <code>wasm-libs<\/code>.<\/p>\n<\/li>\n<\/ul>\n<p>Удалённые источники (<code>https://…<\/code> и <code>git+…<\/code>) — это <strong>ссылки на дистрибуцию<\/strong> —\nони никогда не скачиваются во время запуска. <code>perfscale install &lt;files&gt;<\/code>\nскачивает каждую удалённую библиотеку один раз, проверяет её дайджест,\nскладывает в контентно-адресуемый кэш (<code>&lt;cache&gt;/libraries/&lt;sha256&gt;.wasm<\/code>) и\nпишет <code>perfscale.lock<\/code> рядом с объявляющим файлом. <code>perfscale run<\/code> и\n<code>perfscale lint<\/code> затем разрешают каждую удалённую ссылку через lock + кэш,\n<strong>полностью офлайн<\/strong>: отсутствующий lock, отсутствующая запись или\nотсутствующий артефакт в кэше — жёсткая ошибка с указанием запустить\n<code>perfscale install<\/code>.<\/p>\n<pre><code class=\"language-yaml\"># HTTPS: sha256 закрепляет артефакт — переопубликованный артефакт с другим\n# дайджестом — жёсткая ошибка, никогда не молчаливая подмена. Закрепление\n# опционально: без него `perfscale install` закрепляет вычисленный дайджест\n# в lock-файле и печатает предупреждение с советом добавить его сюда.\n- use: 'https://vendor.example.com/fixer-ids.wasm'\n  sha256: '9f2c…(64 hex)…'\n\n# git: URL репозитория + ref (тег/ветка/коммит) + путь к артефакту внутри репозитория.\n# Ref разрешается в коммит во время установки и закрепляется вместе с\n# дайджестом артефакта; `perfscale install --refresh` разрешает его заново.\n- use: 'git+https://github.com/org/repo.git@v1.2.3#libs/fixer-ids.wasm'\n<\/code><\/pre>\n<p><code>perfscale.lock<\/code> — это TOML, ключованный точной строкой <code>use:<\/code>, и он\nпредназначен для коммита:<\/p>\n<pre><code class=\"language-toml\">version = 1\n\n[[libraries]]\nuse = \"https://vendor.example.com/fixer-ids.wasm\"\nsha256 = \"…\"\n\n[[libraries]]\nuse = \"git+https://github.com/org/repo.git@v1.2.3#libs/fixer-ids.wasm\"\ncommit = \"…resolved sha…\"\nsha256 = \"…artifact digest…\"\n<\/code><\/pre>\n<p>Замечания:<\/p>\n<ul>\n<li>Кэш учитывает <code>PERFSCALE_CACHE_DIR<\/code> (затем <code>XDG_CACHE_HOME/perfscale<\/code>,\nпо умолчанию <code>~/.cache/perfscale<\/code>) — тот же корень, что и кэш git-клонов\nдля <code>import:<\/code>.<\/li>\n<li>Библиотеки, объявленные в документе, импортированном из git\n(<code>import: { git: … }<\/code>), закрепляются в <code>perfscale.lock<\/code> <strong>внутри того\nрепозитория<\/strong> (в его корне); запустите <code>perfscale install<\/code> для\nимпортирующего файла, и он запишется туда. Install следует по цепочкам\n<code>import:<\/code> (включая удалённые) именно по этой причине.<\/li>\n<li>Для ссылок <code>git+<\/code> YAML-ключ <code>sha256:<\/code> опционален: закреплённый коммит —\nякорь целостности. Если он задан, install проверяет его, и несовпадение —\nжёсткая ошибка.<\/li>\n<\/ul>\n<h4>AOT-компиляция (burn-кэш) и <code>perfscale burn<\/code><\/h4>\n<p>Компиляция WASM-компонента (Cranelift) стоит реального времени при каждом\n<code>run<\/code>/<code>lint<\/code> — секунды для больших компонентов. Два механизма убирают её:<\/p>\n<ul>\n<li><strong>Burn-кэш.<\/strong> <code>perfscale install<\/code> предкомпилирует каждую объявленную\nWASM-библиотеку — удалённую <em>и<\/em> локальную <code>./path.wasm<\/code> (локальные\nбиблиотеки не получают записи в <code>perfscale.lock<\/code>; сам файл уже локален) —\nв <code>&lt;cache&gt;/libraries/&lt;sha256&gt;.cwasm<\/code>. Загрузчик сначала проверяет этот кэш\nи десериализует артефакт (нативный код, быстрый mmap); при любом промахе\nили несовпадении он молча откатывается на полную компиляцию, так что кэш\nчисто опционален. Артефакты несут заголовок, закрепляющий версию wasmtime,\nцелевой триплет, конфигурацию движка и дайджест исходника: <strong>обновление\nperfscale инвалидирует их — перезапустите <code>perfscale install<\/code>, чтобы\nперепрожечь<\/strong>.<\/li>\n<li><strong>Встраивание в бинарник.<\/strong> <code>perfscale burn -f test.yaml [-c config.yaml] -o ./perfscale+libs<\/code> пишет копию запущенного бинарника с дописанными\n<code>.cwasm<\/code>-артефактами библиотек документов (трейлер <code>PFSEMBED<\/code> — без\nпатчинга исполняемых секций, работает для ELF/Mach-O/PE). Производный\nбинарник разрешает эти библиотеки из самого себя по точной строке <code>use:<\/code>,\nпоэтому работает <strong>без <code>.wasm<\/code>-файлов, кэша и <code>perfscale.lock<\/code> на диске<\/strong> —\nодин файл для доставки на генераторы нагрузки. Удалённые ссылки должны быть\nсначала установлены. Поскольку встраивание запекает артефакты, прожжённый\nбинарник, обнаруживший несовпадение заголовка, падает с ошибкой\n«перепрожгите», а не откатывается; перезапустите <code>perfscale burn<\/code> с текущим\nperfscale.<\/li>\n<\/ul>\n<p>Что burn <strong>не<\/strong> меняет: накладные расходы на вызов (JSON-маршалинг\nаргументов, store/память на экземпляр на VU) неизменны — burn убирает\nкомпиляцию на запуск, а не стоимость вызова.<\/p>\n<p>Правила WASM-библиотек:<\/p>\n<ul>\n<li>Песочница fail-closed: WIT-импорты компонента инспектируются при загрузке,\nи всё, что выходит за выдачу <code>capabilities:<\/code> в YAML, — жёсткая ошибка\nзагрузки с указанием нужных и выданных capability — если только <code>info()<\/code>\nкомпонента не объявляет <code>\"pure\": true<\/code>; в этом случае импорты\n<code>wasi:filesystem<\/code> / <code>wasi:clocks/wall-clock<\/code> прощаются как шум тулчейна\n(гость всё равно не получает preopen'ов, поэтому реальный доступ к файлам\nпадает в рантайме). <code>fs<\/code> — это read-only preopen, ограниченный <code>fs_root<\/code>\n(по умолчанию: директория, содержащая <code>.wasm<\/code>); <code>clock<\/code> — это\n<code>wasi:clocks<\/code>; <code>net: [hosts]<\/code> <strong>пока не поддерживается<\/strong> (выдача <code>net<\/code>\nпроваливает загрузку с понятной ошибкой); <code>wasi:random<\/code> и сырые сокеты не\nпредоставляются никогда — библиотеки берут случайность из PRNG с seed\n(<code>ctx.seed<\/code>) в своём SDK.<\/li>\n<li><code>with:<\/code> передаётся в <code>init()<\/code> компонента как JSON; сбой init фатален для\nзапуска.<\/li>\n<li>Трап или бесконечный вызов проваливает шаг: каждый вызов выполняется под\nбюджетом fuel (~50M), а каждый экземпляр ограничен 64 МиБ памяти.<\/li>\n<li>Файл компонента может быть не больше 64 МиБ при загрузке (тот же лимит, что\n<code>perfscale install<\/code> применяет к удалённым скачиваниям) — память компиляции\nмасштабируется с размером модуля, и лимит применяется раньше, чем\nограничения fuel/памяти смогут.<\/li>\n<li>Кэш артефактов проверяется во время запуска, а не только при установке:\nзакэшированный <code>.wasm<\/code>, чьи байты больше не хешируются в закреплённый\nдайджест (повреждение или подделка), — жёсткая ошибка с указанием\nперезапустить <code>perfscale install<\/code>. Артефакты burn (<code>.cwasm<\/code>, встроенные\nполезные нагрузки) несут заголовок, закрепляющий дайджест исходника, версию\nwasmtime, целевой триплет и конфигурацию движка, и десериализуются только\nпосле полного совпадения заголовка.<\/li>\n<li>Пишите библиотеки на Rust с\n<a href=\"../crates/perfscale-library-sdk/README.md\"><code>perfscale-library-sdk<\/code><\/a>.<\/li>\n<\/ul>\n<p>Функции <code>@std/random@v1<\/code>:<\/p>\n<table><thead><tr><th>Функция<\/th><th>Возвращает<\/th><\/tr><\/thead><tbody>\n<tr><td><code>uuid4([key])<\/code><\/td><td>Случайный UUID RFC 4122 v4<\/td><\/tr>\n<tr><td><code>uuid7([key])<\/code><\/td><td>Временно́ упорядоченный UUID RFC 9562 v7 (48-битный префикс unix-мс)<\/td><\/tr>\n<tr><td><code>ulid([key])<\/code><\/td><td>26-символьный ULID Crockford-base32 (префикс unix-мс)<\/td><\/tr>\n<tr><td><code>nanoid([len], [key])<\/code><\/td><td>URL-безопасный id из <code>A-Za-z0-9_-<\/code> (длина по умолчанию 21)<\/td><\/tr>\n<tr><td><code>int(a, b, [key])<\/code><\/td><td>Случайное целое в <code>[a, b]<\/code> включительно<\/td><\/tr>\n<tr><td><code>float(a, b, [dp], [key])<\/code><\/td><td>Случайное число в <code>[a, b]<\/code>, <code>dp<\/code> знаков после запятой (по умолчанию 2)<\/td><\/tr>\n<tr><td><code>pick(a|b|c, [key])<\/code><\/td><td>Случайный выбор среди вариантов, разделённых <code>|<\/code><\/td><\/tr>\n<tr><td><code>weighted(a:10|b:90, [key])<\/code><\/td><td>Взвешенный случайный выбор среди пар <code>значение:вес<\/code><\/td><\/tr>\n<tr><td><code>seq(name)<\/code><\/td><td>Именованный монотонный счётчик на экземпляр генератора, начиная с 1<\/td><\/tr>\n<tr><td><code>pattern(\"ORD-####-????\")<\/code><\/td><td>Заполнение шаблона: <code>#<\/code>→цифра, <code>?<\/code>→a-z, <code>^<\/code>→A-Z, <code>*<\/code>→буква или цифра<\/td><\/tr>\n<tr><td><code>first_name()<\/code> / <code>last_name()<\/code> / <code>name()<\/code><\/td><td>Случайные имена (небольшие встроенные корпуса)<\/td><\/tr>\n<tr><td><code>username()<\/code> / <code>email()<\/code> / <code>company()<\/code><\/td><td>Случайный username / email / компания<\/td><\/tr>\n<tr><td><code>lorem([words])<\/code><\/td><td>Слова lorem ipsum (по умолчанию 5)<\/td><\/tr>\n<tr><td><code>phone()<\/code><\/td><td>Случайный номер телефона (<code>+1-NNN-NNN-NNNN<\/code>)<\/td><\/tr>\n<tr><td><code>date(a, b)<\/code><\/td><td>Случайная дата между <code>YYYY-MM-DD<\/code> a и b включительно, на выходе <code>YYYY-MM-DD<\/code><\/td><\/tr>\n<tr><td><code>timestamp(a, b)<\/code><\/td><td>Случайная метка времени unix-мс в <code>[a, b]<\/code><\/td><\/tr>\n<tr><td><code>datetime(a, b)<\/code><\/td><td>Случайный datetime RFC 3339 между датами a и b (весь конечный день включён)<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Композиция документов: <code>import<\/code><\/h3>\n<p>И определения тестов, и конфиги принимают верхнеуровневый <code>import:<\/code> с именем\nбазового документа. База загружается первой (она может импортировать свою\nбазу, рекурсивно), затем текущий документ глубоко сливается поверх:\n<strong>объекты сливаются поключно, скаляры и массивы (включая <code>steps:<\/code>)\nзаменяются<\/strong> импортирующей стороной. Единственное исключение — <code>libraries:<\/code>,\nкоторый конкатенируется по цепочке, — дублирующийся алиас — ошибка\nвалидации.<\/p>\n<pre><code class=\"language-yaml\"># конфиг команды — наследует общий базовый документ организации, переопределяет одну переменную\nimport: ../shared/_base.yaml\nvariables:\n  region: us\n<\/code><\/pre>\n<p>Три формы источника:<\/p>\n<pre><code class=\"language-yaml\"># относительный путь в файловой системе (разрешается относительно директории импортирующего файла)\nimport: ../shared/_base.yaml\n\n# сырой HTTP(S) URL — закрепите ref в пути\nimport: \"https://raw.githubusercontent.com/org/repo/v1.2.0/perf/config/_base.yaml\"\n\n# любой git-хост (SSH или HTTPS remote, включая self-hosted)\nimport:\n  git: git@gitlab.example.com:group/repo.git\n  ref: v1.2.0          # тег, ветка или SHA коммита\n  file: perf/config/_base.yaml\n<\/code><\/pre>\n<p>Удалённые импорты (URL и git) <strong>fail-closed<\/strong>: они выполняются только когда\nвызывающая сторона передаёт <code>--allow-remote-import<\/code>. Разрешение принадлежит\nвызывающей стороне, потому что разрешение импортов происходит до проверок\n<code>allow_file_actions<\/code> / <code>allow_process_actions<\/code> — иначе удалённая база могла\nбы выдать себе эти права и подтянуть шаг <code>std/child_process@v1<\/code>. Документ\nникогда не может сам разрешить себе сеть.<\/p>\n<p>Источники остаются ограниченными: документ, полученный по URL, разрешает\nотносительные импорты относительно своего собственного URL; документ из\ngit-репозитория может импортировать только файлы внутри того же клона\n(выходы через <code>../<\/code> отклоняются). Удалённый документ никогда не может\nпрочитать вашу локальную файловую систему. Циклы импортов падают с выводом\nцепочки.<\/p>\n<p>Git-импорты клонируются с <code>--depth 1<\/code> через ваш системный <code>git<\/code> (SSH-ключи и\ncredential helpers применяются) и кэшируются в\n<code>~/.cache/perfscale/imports/<\/code>. Теги и SHA коммитов неизменны — кэшируются\nнавсегда. Ветки ревалидируются по удалённому репозиторию после короткого\nTTL, так что <code>ref: main<\/code> следует за веткой; <code>--refresh-imports<\/code> принудительно\nперескачивает. Полное руководство — в\n<a href=\"#/docs/core/imports\">docs/core/imports.md<\/a>.<\/p>\n<h3>Инициализация и переменные<\/h3>\n<p>Шаги <code>before:<\/code> выполняются <strong>один раз<\/strong>, по порядку, до старта любого VU —\nдля одноразовой инициализации вроде получения токена или построения профиля\nсоединения. Каждый шаг <code>before<\/code> — обычный шаг (<code>use<\/code>/<code>with<\/code>/<code>outputs<\/code>); его\nимя в <code>outputs<\/code> доступно <strong>каждому<\/strong> тестовому шагу в пространстве имён\n<code>config<\/code>. <code>variables:<\/code> хранит статические значения, доступные в <code>vars<\/code>.<\/p>\n<pre><code class=\"language-yaml\">vus: 50\nvariables:\n  region: eu-west\nbefore:\n  - uses: std/http@v1\n    with:\n      method: POST\n      url: \"https://api.example.com/token\"\n      body: { user: demo, region: \"${{ vars.region }}\" }\n    outputs: auth            # ← доступен тестовым шагам как config.auth\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># test.yaml\nsteps:\n  - uses: std/http@v1\n    with:\n      url: \"https://api.example.com/me\"\n      headers:\n        authorization: \"Bearer ${{ config.auth.body }}\"   # из шага before\n        x-region: \"${{ vars.region }}\"                      # из variables\n<\/code><\/pre>\n<ul>\n<li><code>before<\/code> выполняется независимо от <code>--quiet<\/code> (его сбои всегда печатаются).\nЕсли любой шаг инициализации падает, запуск <strong>прерывается до запуска VU<\/strong> —\nсломанная инициализация привела бы к одинаковому провалу каждой итерации.<\/li>\n<li>Шаги <code>before<\/code> видят <code>${{ vars.* }}<\/code> и выводы предыдущих шагов инициализации\n(под их собственными именами <code>outputs<\/code>). Тестовые шаги видят <code>config.*<\/code> и\n<code>vars.*<\/code>, но не выводы друг друга.<\/li>\n<li>Интерполяция всегда даёт <strong>строку<\/strong>, поэтому числовое значение конфига\nвроде <code>${{ config.fix_config.port }}<\/code> доходит до действия как <code>\"1111\"<\/code>.\nДействия, принимающие числа, принимают и строковую форму.<\/li>\n<\/ul>\n<p>Полный жизненный цикл (включая фоновые процессы, запущенные в <code>before:<\/code>) —\nсм. <a href=\"#/docs/core/setup-teardown\">Инициализация и завершение<\/a>.<\/p>\n<h3>Завершение (<code>after:<\/code>)<\/h3>\n<p>Шаги <code>after:<\/code> выполняются <strong>один раз<\/strong> после остановки нагрузки — при\nнормальном завершении, при провалившемся запуске, при провалившемся <code>before:<\/code>\nи при Ctrl-C/SIGTERM одинаково. Они видят те же <code>${{ config.* }}<\/code> и\n<code>${{ vars.* }}<\/code>, что и тестовые шаги. В отличие от <code>before:<\/code>, провалившийся\nшаг завершения логируется, но не прерывает оставшиеся (очистка по принципу\nbest-effort). Типичный шаг <code>after:<\/code> — <code>std/kill_process@v1<\/code> для сервера,\nзапущенного в <code>before:<\/code>:<\/p>\n<pre><code class=\"language-yaml\">allow_process_actions: true\n\nbefore:\n  - name: web\n    uses: std/child_process@v1\n    with:\n      command: python3\n      args: [\"-m\", \"http.server\", \"8080\"]\n      port: 8080\n      waitUntil: { port_open: 8080, timeout: 10s }\n    outputs: web\n\nafter:\n  - name: stop web\n    uses: std/kill_process@v1\n    with: { name: web, signal: TERM }\n<\/code><\/pre>\n<p>Процессы, ещё живые после шагов <code>after:<\/code>, останавливаются автоматически, так\nчто явный kill — про чистую и своевременную остановку, а не про\nпредотвращение утечек. См. <a href=\"#/docs/core/actions\"><code>std/child_process@v1<\/code><\/a>\nдля полного списка параметров (политика рестарта, захват вывода, <code>waitUntil<\/code>),\n<a href=\"../examples/with-processes.config.yaml\">examples/with-processes.config.yaml<\/a>\nдля готового примера и <a href=\"#/docs/core/setup-teardown\">Инициализация и завершение<\/a>\nдля всего жизненного цикла (прерывания, авто-kill, поток данных).<\/p>\n<p><code>after:<\/code> — также дом для SLO-порогов уровня запуска: <code>std/thresholds@v1<\/code>\nвычисляет выражения в стиле k6 (<code>p95&lt;500<\/code>, <code>rate&lt;0.05<\/code>, <code>count==0<\/code>) по\nметрикам, собранным за весь запуск, один раз и проваливает запуск (ненулевой\nкод выхода), когда нарушен порог с <code>severity: fail<\/code>:<\/p>\n<pre><code class=\"language-yaml\">after:\n  - name: slo gate\n    use: std/thresholds@v1\n    with:\n      db_query_duration: [\"p95&lt;500\", \"max&lt;2000\"]\n      db_query_failed: [\"rate&lt;0.05\"]\n      db_errors: [\"count==0\"]\n    severity: fail            # fail (по умолчанию) | warn | info\n    message: \"checkout SLO\"   # необязательно, интерполируется\n<\/code><\/pre>\n<p>См. <a href=\"#/docs/core/actions\"><code>std/thresholds@v1<\/code><\/a> для грамматики\nвыражений, видов метрик и поля <code>thresholds<\/code> в JSON сводки запуска.<\/p>\n<p>С <code>--locust<\/code> тот же конфиг отображается в <code>--users<\/code>/<code>--spawn-rate<\/code>/<code>--run-time<\/code>\nlocust. С <code>--k6<\/code> конфигурация нагрузки живёт в собственном блоке <code>options<\/code>\nскрипта, а конфиг-файл игнорируется.<\/p>\n<h2>Валидация без запуска: <code>perfscale lint<\/code><\/h2>\n<p>Проверяйте файлы заранее — в CI, pre-commit-хуках или прямо во время\nнаписания:<\/p>\n<pre><code class=\"language-sh\">perfscale lint test.yaml config.yaml\n<\/code><\/pre>\n<p>Помимо валидации по схеме, <code>lint<\/code> помечает неизвестные и опечаточные имена\nполей с подсказками «возможно, вы имели в виду» (<code>chek<\/code> → <code>check<\/code>, <code>vsu<\/code> →\n<code>vus<\/code>, <code>std/htp@v1<\/code> → <code>std/http@v1<\/code>), включая параметры <code>with:<\/code> для\nконкретных действий. См.\n<a href=\"#/docs/cli/commands\">Команды CLI → lint<\/a>.<\/p>\n<h2>Ошибки валидации<\/h2>\n<p>perfscale валидирует перед запуском. Разбор строгий: неизвестные ключи\nотклоняются, а не игнорируются — опечатка вроде <code>iterations: 1<\/code> (или <code>chek:<\/code>\nвместо <code>check:<\/code>) завершает валидацию ошибкой с именем ключа, а не молча\nменяет профиль нагрузки. Это действует на верхнем уровне, для фиксированных\nполей каждого шага и для блоков <code>report:<\/code>, <code>gpu:<\/code>, <code>stages:<\/code>/<code>arrival:<\/code> и\n<code>libraries:<\/code>. Примеры того, что вы увидите:<\/p>\n<pre><code class=\"language-text\">error: schema validation failed:\n  /steps/0 — every step must name an action: `use: std/http@v1` (or the `uses:` alias)\n<\/code><\/pre>\n<pre><code class=\"language-text\">error: invalid YAML: found unexpected end of stream\n<\/code><\/pre>\n<p>Перегенерируйте схемы после изменения Rust-типов:<\/p>\n<pre><code class=\"language-sh\">cargo run -p perfscale-core --example gen_schema\n<\/code><\/pre>\n<p>(Тест CI <code>shipped_schemas_match_generated_ones<\/code> падает, если <code>schema/<\/code>\nустарел.)<\/p>\n","slug":"yaml-reference","title":"YAML reference"}];</script>
