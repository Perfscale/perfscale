[package]
name = "perfscale-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "perfscale — CLI for running k6, locust, and native load tests"

[[bin]]
name = "perfscale"
path = "src/main.rs"

[dependencies]
# Global allocator: the system malloc showed up at ~8% of engine CPU on the
# HTTP hot path (per-request header maps, URLs, JSON outputs).
mimalloc = { version = "0.1", default-features = false }
# `wasm-libs` (RFC 005 phase 2) is enabled unconditionally: the shipped CLI
# binary always supports WASM libraries, while embedders of the core crate
# stay lean by default.
perfscale-core = { path = "../perfscale-core", features = ["wasm-libs"] }

clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "process"] }
# `ws` feature: the `serve` command's /ws echo endpoint (benchmark target).
axum = { version = "0.7", features = ["ws"] }

# `perfscale serve --tls`: HTTPS with a self-signed certificate generated at
# startup. The no-provider feature + explicit ring keeps the process on a
# single rustls crypto provider (reqwest's rustls-tls is ring-based too).
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
reqwest    = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# run ids for the report@v1 artifact built CLI-side (non-native engines)
uuid       = { version = "1", features = ["v4"] }

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

tempfile = "3"

# `perfscale self-update`: checksum verification + version-check cache location
sha2 = "0.10"
dirs = "5"

[dev-dependencies]
assert_cmd    = "2"
predicates    = "3"
tempfile      = "3"
wiremock      = "0.6"
# Decoding remote-write bodies in the streaming-reporter e2e tests.
snap = "1"
prost = "0.14"
# The OTLP/gRPC collector the streaming e2e test runs in-process.
tonic = { version = "0.14.6", features = ["transport"] }
tokio-stream = "0.1"
http = "1"
http-body-util = "0.1"
tower         = { version = "0.5", features = ["util"] }
serial_test = { version = "3", features = ["file_locks"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3.32", default-features = false, features = ["sink"] }
# Renders docs/ markdown for the serve dashboard's embedded Docs tab; test-only,
# the CLI binary carries no markdown machinery (see commands/serve_docs.rs).
pulldown-cmark = "0.13"
